meta.title=How to Send a Bedtime Story Recording | Sleep2Story
meta.description=Send a recorded bedtime story from iPhone or Android. Choose an audio file or a private link and make sure the story plays on the phone at home.
meta.og_title=How to Send a Bedtime Story Recording to Your Child
meta.og_description=Get a story from your phone to the person doing bedtime, with sharing steps for iPhone and Android and a message to copy.
schema.description=Instructions for sharing a recorded bedtime story as an audio file from iPhone or Android and checking playback before bedtime.
index.card_title=How to send a bedtime story recording
index.card_excerpt=Share the audio from your phone, send one clear message and check that the story will play at bedtime.
hero.title=How to send a bedtime story recording to your child
hero.lead=You’ve read the story into your phone. Now get the recording to the adult doing bedtime so they can find it and press play without waiting for you to answer. A short audio file and one clear message are usually enough.
quick.title=Send an audio file first
quick.body=Open the original recording, share it as playable audio and send it in a one-to-one message or email. Ask the recipient to open the copy they received on the device they’ll use that evening. If there’s no reliable connection at bedtime, have them download the file while they’re still online.
iphone.title=Send a recording from iPhone Voice Memos
iphone.p1=Open Voice Memos and tap the story in the recording list. Tap the three-dot menu and choose Share. If the share sheet shows Options, choose Rendered to make a single .m4a file for listening. Select Messages, Mail or another sharing app, pick the adult at home and send.
iphone.p2=If you’re attaching the recording from a different app later, you can use Save to Files in the share sheet, then attach the saved file. Give it a name the recipient can find quickly, such as Moon Rabbit – Tuesday. The Editable option is for someone who wants to work on the recording with compatible software. For listening, send the finished audio.
android.title=Send a recording from a Pixel or another Android phone
android.p1=On a Google Pixel, open Recorder and press and hold the story. Open Share, pick File and select Audio. Choose your messaging or email app and check that the outgoing message contains an audio attachment. The Transcript choice sends the words as text, so use Audio when you want your child to hear your reading.
android.p2=On other Android phones, open your voice recorder and look for Share, Send or Export in the recording’s menu. The app name and labels vary. If it only offers a link or a project, look for an option to save the audio to your device. You can then attach it from your phone’s file picker.
send.title=Choose between an attachment and a private link
send.p1=For one story, an attachment is the easiest thing to find again. Use a message thread or email address you already share with the adult who will play it. Keep tonight’s story in its own message so it is easy to spot, and start the message with the file name if you’re sending more than one.
send.p2=If the app rejects a large file, share it from a cloud folder with access limited to the recipient’s account. Ask them to open the link while signed in with that account. If they need to listen offline, allow them to download the file and ask them to save it on the bedtime device ahead of time.
handoff.title=Add a short message for the adult at home
handoff.example=“Tonight’s story is Moon Rabbit, about four minutes. Please play it after teeth and pajamas. Could you check it opens on your phone? If the audio won’t play, the rabbit book on the shelf is our backup.”
handoff.check=Ask the adult to play the first few seconds through the speaker they’ll actually use. A file can open and still send sound to earbuds left connected in another room. If they saved it for offline use, they can briefly switch off Wi-Fi and mobile data and try it again.
fix.title=If the story doesn’t play
fix.p1=For a link that asks for access, check which account the recipient opened it with and grant that account permission. If the file is easier to send another way, attach a fresh copy directly. When a message has only a transcript or an editable project, return to the original recording and choose the audio export.
fix.p2=If the copy opens but is silent, check media volume and Bluetooth first, then play the original on your own phone. If the original has sound, resend the audio or try opening the received copy from Files. If the original itself is silent, leave the backup book for tonight.
faq.title=Questions about sharing bedtime story audio
faq.q1=Can I send a Voice Memos recording to someone with Android?
faq.a1=Yes. Send the audio as a file or a link the recipient can access. If their message app doesn’t play the attachment, ask them to save it and open it with an audio player that supports .m4a.
faq.q2=Can we listen to the story without Wi-Fi?
faq.a2=Yes, once the recipient has saved a playable copy on the device. A cloud link typically needs a connection the first time it opens. Confirm playback before bedtime with the device temporarily offline.
