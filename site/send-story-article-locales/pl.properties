meta.title=Jak wysłać dziecku nagraną bajkę na dobranoc | Sleep2Story
meta.description=Wyślij nagranie bajki z iPhone’a lub Androida. Zobacz, jak dołączyć plik audio, ograniczyć dostęp do linku i sprawdzić odsłuch przed snem.
meta.og_title=Jak wysłać dziecku nagraną bajkę na dobranoc
meta.og_description=Od Dyktafonu do odtwarzania przed snem. Instrukcja dla iPhone’a i Androida z przykładową wiadomością dla opiekuna.
schema.description=Instrukcja wysyłania nagrania bajki na dobranoc z iPhone’a lub Androida z poradami dotyczącymi odsłuchu i dostępu do pliku.
index.card_title=Jak wysłać nagranie bajki na dobranoc
index.card_excerpt=Prześlij bajkę jako plik audio, dodaj krótką wiadomość i sprawdź, czy opiekun może ją odtworzyć.
hero.title=Jak wysłać dziecku nagraną bajkę na dobranoc
hero.lead=Bajka jest już nagrana. Teraz podeślij ją dorosłemu, który będzie dziś z dzieckiem przy zasypianiu. Wystarczą plik i krótka wiadomość, żeby wieczorem domownicy mogli włączyć nagranie, nawet jeśli akurat nie możesz odebrać telefonu.
quick.title=Najprościej wysłać plik audio
quick.body=Otwórz oryginał w dyktafonie i udostępnij nagranie jako dźwięk w prywatnej wiadomości albo e-mailem. Poproś odbiorcę, żeby otworzył otrzymany plik na telefonie lub tablecie, z którego skorzysta wieczorem. Jeśli w pokoju dziecka bywa słaby zasięg, niech pobierze bajkę wcześniej.
iphone.title=Jak udostępnić bajkę z Dyktafonu na iPhonie
iphone.p1=W Dyktafonie wybierz nagranie. Otwórz menu z trzema kropkami i stuknij „Udostępnij”. Jeśli widzisz przycisk „Opcje”, wybierz gotowy plik audio („Rendered” w angielskiej wersji iOS). Dyktafon przygotuje jeden plik .m4a. Wybierz pocztę lub komunikator, sprawdź adresata i wyślij.
iphone.p2=Jeśli chcesz dodać nagranie do wiadomości później, w menu udostępniania możesz wybrać „Zachowaj w Plikach”. Nadaj bajce nazwę, którą łatwo zauważyć w rozmowie, na przykład „Królik na Księżycu — na wtorek”. Wersję edytowalną wybierz tylko wtedy, gdy odbiorca ma zmieniać nagranie w zgodnej aplikacji.
android.title=Jak wysłać nagranie z Pixela lub innego telefonu z Androidem
android.p1=Na Pixelu otwórz aplikację Dyktafon i przytrzymaj wybrane nagranie. Stuknij „Udostępnij”, wybierz „Plik”, a potem „Dźwięk”. Wybierz aplikację pocztową lub komunikator i upewnij się, że w wiadomości jest załącznik audio. Opcja „Transkrypcja” udostępnia zapis słów w formie tekstu.
android.p2=Na innych telefonach z Androidem nazwy aplikacji i przycisków zależą od modelu. Otwórz menu gotowego nagrania i poszukaj opcji „Udostępnij”, „Wyślij” lub „Eksportuj”. Jeśli aplikacja oferuje tylko link albo projekt do edycji, spróbuj najpierw zapisać dźwięk w pamięci telefonu, a potem wybrać ten plik przy dodawaniu załącznika.
send.title=Załącznik czy link z ograniczonym dostępem?
send.p1=Jedną krótką bajkę najłatwiej wysłać jako załącznik na czacie, z którego już korzystacie, lub e-mailem. Podaj tytuł w wiadomości obok pliku. Jeśli szykujesz kilka bajek na czas wyjazdu, dodaj do każdej datę albo dzień tygodnia. Dzięki temu opiekun szybciej znajdzie właściwą wersję.
send.p2=Gdy plik nie mieści się w wiadomości, zapisz go w chmurze i udostępnij wyłącznie kontu opiekuna. Poproś, żeby otworzył link po zalogowaniu na to konto. Jeśli chce posłuchać bajki bez internetu, powinien pobrać ją na urządzenie wcześniej. Upewnij się, że ustawienia udostępniania pozwalają mu pobrać plik.
handoff.title=Co napisać osobie, która dziś kładzie dziecko spać
handoff.example=„Na dziś jest «Królik na Księżycu», około czterech minut. Włącz po myciu zębów i założeniu piżamy. Sprawdzisz, czy plik otwiera się na Twoim telefonie? Jeśli coś nie zadziała, książka o króliku stoi na półce”.
handoff.check=Poproś opiekuna, żeby włączył pierwsze sekundy na urządzeniu, którego użyje wieczorem. Przy okazji sprawdzi głośność i to, czy dźwięk nie płynie do słuchawek Bluetooth. Jeśli bajka ma grać bez połączenia z internetem, niech wyłączy na chwilę Wi-Fi i dane komórkowe, a potem ponownie uruchomi pobraną kopię.
fix.title=Co zrobić, gdy nagranie się nie odtwarza
fix.p1=Jeśli link wymaga dostępu, sprawdź, z jakiego konta korzysta odbiorca. Przyznaj dostęp temu kontu lub prześlij nagranie jako załącznik. Jeżeli dotarł jedynie tekst bajki albo projekt do edycji, wróć do nagrania i wyślij gotowy plik dźwiękowy.
fix.p2=Gdy plik się otwiera, ale nic nie słychać, sprawdź głośność multimediów i aktywne urządzenia Bluetooth. Posłuchaj też oryginału na swoim telefonie. Jeśli działa, spróbuj wysłać plik ponownie lub poproś opiekuna, żeby otworzył go bezpośrednio z folderu pobranych plików. Jeśli w oryginale nie ma dźwięku, wieczorem przyda się książka z półki.
faq.title=Pytania o wysyłanie nagranych bajek
faq.q1=Czy da się wysłać nagranie z iPhone’a na Androida?
faq.a1=Tak. Wyślij dźwięk jako plik lub link dostępny dla odbiorcy. Jeśli komunikator nie odtwarza załącznika, odbiorca może pobrać go i otworzyć w odtwarzaczu obsługującym pliki .m4a.
faq.q2=Czy bajki można słuchać bez internetu?
faq.a2=Tak, jeśli odbiorca zapisał działający plik na urządzeniu. Sam link do chmury zazwyczaj wymaga połączenia przy pierwszym otwarciu. Warto sprawdzić pobraną kopię przed snem, na chwilę wyłączając internet.
