meta.title=Come inviare una storia della buonanotte registrata | Sleep2Story
meta.description=Invia una storia della buonanotte registrata su iPhone o Android e prepara l’ascolto sul dispositivo che tuo figlio userà la sera.
meta.og_title=Come inviare una storia della buonanotte registrata
meta.og_description=Condividi il file audio e fai una prova con chi sarà accanto a tuo figlio al momento di dormire.
schema.description=Guida per inviare una storia della buonanotte come file audio da iPhone o Android e verificarne la riproduzione.
index.card_title=Come inviare una storia della buonanotte registrata
index.card_excerpt=Invia l’audio a chi si occupa della buonanotte e preparalo per l’ascolto, anche senza internet.
hero.title=Come inviare a tuo figlio una storia della buonanotte registrata
hero.lead=Hai già sul telefono la storia che hai letto ad alta voce. Per farla arrivare a tuo figlio, invia l’audio a chi sarà con lui la sera. Con un titolo che si trova al volo, un breve messaggio e una prova sul dispositivo giusto, l’ascolto è pronto anche se fai tardi o sei in viaggio.
quick.title=Invia il file audio e chiedi una prova
quick.body=Apri la registrazione, tocca «Condividi» e invia l’audio a chi metterà a letto tuo figlio. Chiedi di aprirlo sul telefono o sul tablet che userà davvero quella sera. Se la connessione è debole, può scaricare una copia prima e verificare che si apra anche offline.
iphone.title=Inviare la storia da Memo Vocali su iPhone
iphone.p1=Apri Memo Vocali, tocca la registrazione della storia e poi il pulsante con i tre puntini per vedere le altre azioni. Tocca «Condividi». Se compare «Opzioni», scegli «Elaborato» per ottenere un solo file .m4a con tutto l’audio.
iphone.p2=Scegli Messaggi, Mail o la chat che usi già con chi sarà a casa. Prima di inviare il file, puoi dargli un nome riconoscibile come «La volpe e la luna – martedì». Il formato modificabile serve a chi deve ritoccare la registrazione su un dispositivo compatibile.
android.title=Condividere una storia registrata da Android
android.p1=Su un Google Pixel, apri Registratore e tieni premuta la registrazione. Tocca «Condividi», poi «File» e «Audio». Scegli l’app da usare per l’invio e il destinatario. L’opzione «Trascrizione» contiene le parole della registrazione in forma di testo.
android.p2=Su altri telefoni Android l’app di registrazione può avere un nome diverso. Apri la storia o tieni premuta la riga corrispondente e cerca il comando «Condividi» o la relativa icona. Se compare un’opzione per esportare, scegli il file audio. Se l’app consente solo di salvare, cerca il file appena salvato nell’app che gestisce i file e condividilo da lì.
send.title=Scegliere tra allegato e link con accesso limitato
send.p1=Quando il file è abbastanza piccolo, invialo come allegato in un messaggio privato o per e-mail. Scegli il canale che l’altro adulto apre di solito e scrivi il titolo accanto all’allegato, così il racconto si trova facilmente anche in mezzo ai messaggi della giornata.
send.p2=Se il file supera il limite degli allegati, salvalo nel tuo spazio cloud e concedi l’accesso solo all’account di chi lo riceve. Fai provare il link che hai inviato con quell’account. Se il dispositivo dovrà riprodurlo senza connessione, l’altro adulto può scaricarlo in anticipo.
handoff.title=Lascia un messaggio a chi sarà lì per la buonanotte
handoff.example=«Dopo aver lavato i denti puoi far partire La volpe e la luna. Dura poco meno di quattro minuti. Mi dici se si sente sul tablet? Se stasera preferisce che legga tu, il libro del coniglio è sul comodino.»
handoff.check=Bastano pochi secondi all’inizio e un salto verso la fine della storia per accorgersi se l’audio è troppo basso o se il file si interrompe. Se userete la copia scaricata, apritela una volta con il dispositivo in modalità aereo.
fix.title=Se il file non si apre o non si sente
fix.p1=Se il link chiede un’autorizzazione, controllate che chi lo apre abbia effettuato l’accesso con l’account a cui hai dato il permesso. Se l’anteprima della chat non riproduce l’audio, salva l’allegato sul dispositivo e aprilo con il lettore audio.
fix.p2=Se la barra avanza in silenzio, controlla il volume multimediale e se sono collegate cuffie Bluetooth. Poi ascolta il file originale sul telefono da cui lo hai inviato. Se lì si sente, esporta e invia di nuovo il file audio. Una trascrizione o un progetto modificabile possono comparire come allegati senza offrire un audio riproducibile.
faq.title=Domande sulle storie della buonanotte registrate
faq.q1=Posso inviare la storia da iPhone a un telefono Android?
faq.a1=Sì. Usa un allegato audio per e-mail o in una chat accessibile da entrambi i dispositivi. Molti dispositivi riproducono .m4a. Prova il file sul telefono o sul tablet del destinatario prima di affidargli l’ascolto della sera.
faq.q2=Si può ascoltare la storia senza internet?
faq.a2=Sì, se il file è già salvato sul dispositivo che lo riprodurrà. Apri la copia locale una volta in modalità aereo. Vedere il nome dell’allegato nella chat non basta per sapere se è già stato scaricato.
