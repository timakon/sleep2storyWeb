meta.title=怎么把录好的睡前故事发给孩子？手机音频分享指南 | Sleep2Story
meta.description=用 iPhone 语音备忘录或 Android 手机上的录音机发睡前故事。了解怎么分享音频文件、处理大文件和提前检查离线播放。
meta.og_title=怎么把录好的睡前故事发给孩子
meta.og_description=让家里陪孩子的大人点开就能听：发送音频文件，提前确认能播放，顺手留一句睡前留言。
schema.description=从 iPhone 或 Android 手机导出睡前故事录音、发送到家人设备并提前确认播放的实用指南。
index.card_title=把录好的睡前故事发给孩子
index.card_excerpt=从手机导出音频，发给今晚陪孩子的大人，再花一分钟检查能不能播放。
hero.title=怎么把录好的睡前故事发给孩子？
hero.lead=出差前录了一段故事，或者隔着时差想给孩子说声晚安？把录音当作音频文件发给今晚陪孩子的大人。对方事先打开听几秒，到了睡觉时间就能直接播放。
quick.title=录完以后，先做这三件事
quick.body=在录音软件里找到故事，导出可播放的音频文件，发到家人平常用的一对一聊天或邮箱。请收件人在今晚要用的手机或平板上试听。要是晚上可能没网，提前下载到设备，断网再试一次。
iphone.title=iPhone：从「语音备忘录」发出故事录音
iphone.p1=打开「语音备忘录」，在列表里点一下那段录音。点更多操作按钮（通常是三个点），再选「共享」。如果页面提供导出选项，选把内容合成一个音频文件的版本（Rendered），它会生成一个 .m4a 文件，然后选发给家人的聊天应用或邮件。
iphone.p2=要发给 Android 手机，也可以直接把音频作为附件发出。发完看一眼聊天里出现的是能播放或下载的音频，而不是一段文字或需要兼容软件打开的可编辑项目。附近的 Apple 设备可以通过隔空投送接收，家人在外地时用聊天或邮件更方便。
android.title=Android：从录音机导出音频文件
android.p1=在 Pixel 的录音机（Recorder）里长按故事录音，点「分享」后选「文件」，然后选「音频」。接下来选择要用的聊天或邮件应用，并核对收件人。选择「转录稿」会发出文字，家人听不到原本的声音。
android.p2=其他 Android 手机的按钮可能叫「分享」「发送」或「导出」。先从录音列表选中故事，再找音频文件选项。手机若支持另存到「文件」应用，也可以先保存一份，再从聊天窗口用添加附件的方式挑选这份音频。
send.title=选音频附件，还是发一个链接？
send.p1=一小段睡前故事，直接发附件通常最快。取个好认的文件名，比如「周三晚安－月亮船」，方便家人在一串照片和语音里翻到它。连续发几段时，可以说清楚哪一段是今晚的故事。
send.p2=遇到附件大小上限，可以把录音放到家人已经在用的云盘，把访问权限设给指定收件人，再发链接。请对方用有权限的账号打开并下载，尤其是要在路上或网络不稳的房间播放时。打开云盘里自己的预览，不能代替收件人的测试。
handoff.title=发给今晚陪孩子的大人时，留一句话
handoff.example=「这是今晚的《月亮船》，大概四分钟。刷完牙就可以放，放完跟他说一声『晚安，明天见』。你有空先听一下开头，看看能不能打开？」
handoff.check=对方确认收到后，试听开头和结尾，看看音量够不够、时长对不对。下载过的文件可以放到容易找的位置。担心孩子今晚等不到录音时，也可以先和家人约好备用的绘本。
fix.title=录音打不开、没有声音，怎么办？
fix.p1=点链接提示「需要权限」时，请对方确认当前登录的账号。分享人可以把访问权给那个账号，或重发音频附件。如果页面显示文件已移动或删除，回到录音软件找原件，重新导出一份。
fix.p2=听不到声音时，先确认消息里收到的是音频，再看媒体音量和蓝牙设备有没有接管声音。发错了剪辑文件、项目文件或文字稿，就用录音软件重新导出一份可直接播放的音频。
faq.title=发送睡前故事录音的常见问题
faq.q1=家人需要安装和我一样的录音软件吗？
faq.a1=一般不用。把故事导出成对方设备可以播放的普通音频文件，手机自带播放器或聊天应用通常就能打开。最好先发一段十秒钟的录音试试。
faq.q2=对方没网时还能听吗？
faq.a2=可以先把音频文件完整下载到要播放的手机或平板上。只收到链接或看到在线预览还不够，提前关掉网络后试播一次最稳妥。
