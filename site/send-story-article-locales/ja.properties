meta.title=録音した寝る前のお話を子どもに送る方法 | Sleep2Story
meta.description=iPhoneのボイスメモやAndroidのレコーダーで録音した寝る前のお話を家族に送る手順。音声ファイルの共有とオフライン再生を確認できます。
meta.og_title=録音した寝る前のお話を子どもに送る方法
meta.og_description=録音を音声ファイルで家族に共有。寝かしつけの時間になったらすぐに聞けるよう、先に再生を確認しましょう。
schema.description=iPhoneやAndroidで録音した寝る前のお話を家族に送り、相手の端末で再生できるか確認するガイド。
index.card_title=録音したおやすみ前のお話を家族に送る
index.card_excerpt=スマホの録音を音声ファイルにして共有。寝かしつけをする家族に、聞かせたいタイミングも伝えましょう。
hero.title=録音した寝る前のお話を子どもに送る方法
hero.lead=出張先から絵本の読み聞かせを届けたい夜は、録音したお話を、子どものそばにいる家族に送っておきましょう。早めに送っておけば、寝る直前にファイルを探したり、通話がつながるのを待ったりせずに済みます。
quick.title=音声ファイルで送り、相手の端末で確認
quick.body=録音アプリから音声ファイルを共有し、ふだん使うメッセージアプリかメールで送ります。寝かしつけに使うスマホやタブレットで、冒頭だけでも再生できるか確認してもらいましょう。通信が不安定な場所なら、その端末にダウンロードしておきます。
iphone.title=iPhoneのボイスメモから録音を送る
iphone.p1=「ボイスメモ」で送る録音をタップし、その他の操作ボタンから「共有」を選びます。オプションで書き出し形式を選べる場合は、1つの音声ファイルにまとめる形式（Rendered）を選ぶと .m4a で送れます。共有先のアプリと相手を選んで送信します。
iphone.p2=相手が離れた場所にいるときは、メッセージやメールに添付するのが手軽です。送信前に添付欄を見て、編集用データではなく音声が選ばれているか確認します。受け取る相手がAndroidでも、対応するプレーヤーで聞ける音声ファイルとして送れます。
android.title=Androidから読み聞かせの録音を送る
android.p1=Pixelでは「レコーダー」を開いて録音を長押しし、共有ボタンから「ファイル」を選びます。「音声」を選んで、ふだん連絡に使うアプリに渡してください。「文字起こし」を選ぶと、読み聞かせの声は届きません。
android.p2=ほかのAndroid端末では、録音アプリによって「共有」や「送信」、保存場所の表示が異なります。音声の書き出しができるなら、一度端末のファイルに保存し、メッセージに添付する方法もあります。送りたい録音が複数あるときは、タイトルを確認してから選びましょう。
send.title=添付ファイルにするか、リンクにするか
send.p1=数分のお話なら、まずはファイルを添付して送ると、相手はやりとりの中からすぐに探せます。「今夜・月の小舟」のように題名や使う日を入れておくと、翌日の録音と取り違えにくくなります。
send.p2=容量制限で送れないときは、家族が使っているクラウドに保存し、受け取る人だけにアクセスを許可してリンクを送ります。その人のアカウントと端末で開けるかを先に確認し、Wi-Fiがない場所なら再生用のファイルをダウンロードしてもらいます。
handoff.title=子どものそばにいる大人に添えるひとこと
handoff.example=「今夜は『月の小舟』をお願い。4分くらいです。歯みがきのあとに流して、最後に『おやすみ、また明日』って伝えてもらえる？ 時間のあるときに、音が出るかだけ見ておいてね。」
handoff.check=途中で止まらないか気になるときは、最初と最後を試しに聞き、長さと音量を確認します。保存した音声を見つけやすい場所に置いておくと、夜になってからチャットをさかのぼる手間が省けます。予備にいつもの絵本を1冊出しておくのも手です。
fix.title=録音が開けない、音が出ないとき
fix.p1=リンクを開くとアクセス許可が求められる場合は、受け取る人がどのアカウントで開いているか確認します。そのアカウントに共有するか、音声ファイルを添付して送り直しましょう。リンク切れの場合は、録音アプリにある元の音声から再度書き出します。
fix.p2=再生画面は開くのに音が出ないときは、メディア音量とBluetoothの出力先を確認します。届いたものが文字起こしや編集用データなら、送る側がアプリで音声ファイルとして書き出し直してください。
faq.title=録音したお話を送るときのよくある質問
faq.q1=相手も同じ録音アプリを入れる必要はありますか？
faq.a1=相手の端末が対応する形式の音声ファイルなら、通常は不要です。メッセージ内のプレーヤーや端末の音楽再生機能で聞けます。心配なら10秒ほどの録音で先に試してください。
faq.q2=ネットがつながらない場所でも聞けますか？
faq.a2=事前に端末へ音声ファイルをダウンロードしておけば聞けます。クラウドのリンクを送っただけでは通信が必要な場合があります。機内モードなどで通信を切って再生できるか確かめましょう。
