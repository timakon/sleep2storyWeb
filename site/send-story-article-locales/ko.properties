meta.title=녹음한 잠자리 동화를 아이에게 보내는 방법 | Sleep2Story
meta.description=아이폰 음성 메모나 안드로이드 녹음 앱에서 잠자리 동화 파일을 보내는 법. 가족에게 공유하고, 와이파이 없이도 재생할 수 있게 준비하세요.
meta.og_title=녹음한 잠자리 동화를 아이에게 보내는 방법
meta.og_description=아이 곁에 있는 어른에게 동화 녹음을 보내고 잠들기 전에 그쪽 기기에서 잘 재생되는지 확인해 보세요.
schema.description=아이폰이나 안드로이드에서 녹음한 잠자리 동화를 오디오 파일로 공유하고 가족의 기기에서 재생을 확인하는 안내.
index.card_title=아이에게 잠자리 동화 녹음 보내기
index.card_excerpt=아이폰이나 안드로이드로 동화 음성 파일을 보내고, 오늘 아이를 재울 어른에게 재생 방법을 알려 주세요.
hero.title=녹음한 잠자리 동화를 아이에게 보내는 방법
hero.lead=출장이나 야근으로 아이를 직접 재우기 어려운 날, 미리 읽어 둔 동화를 음성 파일로 보낼 수 있어요. 그날 아이 곁에 있을 어른이 파일을 먼저 열어 보면, 잘 시간이 됐을 때 바로 틀어 줄 수 있습니다.
quick.title=음성 파일을 보내고 받는 쪽에서 재생해 보세요
quick.body=녹음 앱에서 동화를 재생 가능한 음성 파일로 내보내고, 평소 쓰는 메신저의 개인 채팅이나 이메일로 보내세요. 상대방에게 아이와 함께 쓸 휴대폰이나 태블릿에서 잠깐 재생해 달라고 부탁하세요. 인터넷이 불안정하다면 파일을 미리 기기에 내려받아 두는 게 좋습니다.
iphone.title=아이폰 음성 메모에서 녹음 보내기
iphone.p1=‘음성 메모’ 목록에서 보낼 녹음을 누르고, 더 보기 버튼을 열어 ‘공유’를 선택합니다. 옵션에서 형식을 고를 수 있다면 여러 부분을 합쳐 하나의 .m4a로 만드는 형식(Rendered)을 선택하세요. 메신저 또는 메일 앱을 열어 받을 사람을 확인하고 전송합니다.
iphone.p2=상대가 멀리 있거나 안드로이드 기기를 쓴다면 일반 파일을 첨부할 수 있는 앱이 편합니다. 보내기 전에 첨부 항목이 실제 음성인지 확인하세요. 녹음 편집용 파일은 상대 기기에서 별도 앱을 요구할 수 있습니다.
android.title=안드로이드 녹음 앱에서 음성 파일 내보내기
android.p1=Pixel에서는 ‘녹음기(Recorder)’에서 동화 녹음을 길게 누릅니다. 공유 버튼을 누른 뒤 파일을 선택하고, 오디오 항목을 골라 보낼 앱을 엽니다. 텍스트나 스크립트 항목을 고르면 목소리 대신 글이 보내집니다.
android.p2=다른 안드로이드 휴대폰에서는 메뉴 이름이 ‘공유’, ‘보내기’, ‘내보내기’ 등으로 다를 수 있습니다. 선택한 녹음을 파일 앱에 먼저 저장할 수 있다면, 메신저에서 첨부 버튼을 눌러 그 파일을 직접 고르는 방법도 있습니다.
send.title=파일을 첨부할까요, 링크를 보낼까요?
send.p1=몇 분짜리 동화는 메신저나 이메일에 파일을 첨부하는 방법부터 써 보세요. ‘수요일 밤-달빛 보트’처럼 듣는 날과 제목을 파일명에 넣으면, 가족이 다른 메시지 사이에서 찾기 쉽습니다. 여러 동화를 한 번에 보낼 때는 오늘 들을 편도 표시해 두세요.
send.p2=첨부 용량 제한에 걸리면 가족이 쓰는 클라우드에 저장하고, 받을 사람의 계정에만 접근 권한을 준 뒤 링크를 보내세요. 상대가 자기 기기와 계정으로 열어 봐야 권한을 제대로 확인할 수 있습니다. 밤에 인터넷을 쓰기 어렵다면 그 기기에 음성 파일을 내려받아 두세요.
handoff.title=오늘 아이를 재울 어른에게 전할 말
handoff.example=“오늘 들려줄 이야기는 ‘달빛 보트’야. 4분 정도니까 양치하고 나서 틀어 줘. 끝나면 내가 ‘잘 자, 내일 보자’고 했다고 전해 줘. 시간 될 때 소리만 잠깐 확인해 줄래?”
handoff.check=받는 쪽에서 앞부분과 끝부분을 잠깐 재생해 보고, 길이와 볼륨을 확인합니다. 내려받았다면 잠들기 직전에 헤매지 않게 찾기 쉬운 곳에 저장하세요. 파일이 끝내 열리지 않을 때 읽어 줄 책을 한 권 미리 정해 둬도 좋습니다.
fix.title=파일이 열리지 않거나 소리가 안 날 때
fix.p1=링크가 권한을 요청하면 상대가 어떤 계정으로 열었는지 먼저 물어보세요. 그 계정에 접근 권한을 주거나, 오디오를 직접 첨부해 다시 보내면 됩니다. 파일이 삭제되었거나 옮겨진 경우에는 녹음 앱에서 원본을 찾아 새로 내보냅니다.
fix.p2=재생 화면에 들어갔는데 소리가 없다면 미디어 볼륨과 블루투스 연결을 확인해 보세요. 메시지에 편집 프로젝트나 받아쓰기 파일이 들어 있다면 재생할 수 있는 일반 오디오로 내보내 다시 보내세요.
faq.title=잠자리 동화 음성 파일을 보낼 때 자주 묻는 질문
faq.q1=받는 사람도 똑같은 녹음 앱을 설치해야 하나요?
faq.a1=받는 쪽 기기가 지원하는 오디오 형식이라면 대개 필요 없습니다. 메신저나 기기의 기본 플레이어로 열 수 있는지 짧은 테스트 파일을 보내 먼저 확인해 보세요.
faq.q2=와이파이가 없어도 들을 수 있나요?
faq.a2=기기에 음성 파일을 미리 다운로드했다면 들을 수 있습니다. 링크에 접속하는 것만으로는 파일이 저장되지 않을 수 있으니, 인터넷을 끈 상태에서도 재생되는지 미리 확인하세요.
