meta.title=रिकॉर्ड की हुई सोने की कहानी बच्चे को कैसे भेजें? | Sleep2Story
meta.description=iPhone या Android से सोने की रिकॉर्ड की हुई कहानी ऑडियो फ़ाइल के रूप में भेजें। लिंक की अनुमति जाँचें और बिना इंटरनेट सुनने की तैयारी करें।
meta.og_title=रिकॉर्ड की हुई सोने की कहानी बच्चे को कैसे भेजें?
meta.og_description=फ़ोन से कहानी की ऑडियो फ़ाइल भेजें और सोने के समय से पहले घर के फ़ोन पर चलाकर देख लें।
schema.description=iPhone या Android पर रिकॉर्ड की हुई सोने की कहानी किसी भरोसेमंद बड़े को भेजने और उनके फ़ोन पर चलाकर देखने की जानकारी।
index.card_title=बच्चे को रिकॉर्ड की हुई सोने की कहानी भेजें
index.card_excerpt=फ़ोन से कहानी की ऑडियो फ़ाइल भेजने, बड़ी फ़ाइल साझा करने और समय रहते आवाज़ जाँचने का तरीका।
hero.title=रिकॉर्ड की हुई सोने की कहानी बच्चे को कैसे भेजें?
hero.lead=कभी सफ़र या देर की ड्यूटी की वजह से बच्चे को कहानी सुनाने का समय नहीं मिल पाता। ऐसे में रिकॉर्डिंग उस बड़े को भेज दें जो आज बच्चे के साथ होगा। उनसे कहें कि शाम से पहले अपने फ़ोन या टैबलेट पर उसे खोलकर देख लें, ताकि सोते समय फ़ाइल ढूँढने की ज़रूरत न पड़े।
quick.title=ऑडियो फ़ाइल भेजें और सामने वाले के फ़ोन पर जाँचें
quick.body=रिकॉर्डिंग ऐप से कहानी को ऑडियो फ़ाइल के रूप में साझा करें। परिवार जिस चैट ऐप या ईमेल का इस्तेमाल करता है, वहाँ फ़ाइल सीधे उस बड़े को भेजें। वे उसी डिवाइस पर शुरू के कुछ सेकंड सुन लें जिस पर बच्चे को कहानी सुनाएँगे। रात में इंटरनेट न मिलने की संभावना हो तो पहले फ़ाइल डाउनलोड कर लें।
iphone.title=iPhone के Voice Memos से कहानी की रिकॉर्डिंग भेजें
iphone.p1=Voice Memos खोलें, सूची में कहानी की रिकॉर्डिंग चुनें और तीन बिंदुओं वाले मेन्यू से Share पर टैप करें। अगर Options दिखे, तो Rendered चुनें। इससे आवाज़ एक .m4a फ़ाइल में रहती है। अब चैट या ईमेल ऐप चुनें, सही व्यक्ति की पुष्टि करें और फ़ाइल भेज दें।
iphone.p2=दूर रहने वाले परिवार को फ़ाइल सीधे अटैच कर भेज सकते हैं। भेजते समय देख लें कि संलग्न चीज़ चलाने लायक ऑडियो है। एडिट करने वाली फ़ाइल को खोलने के लिए दूसरे फ़ोन पर कोई ख़ास ऐप या सॉफ़्टवेयर चाहिए हो सकता है। अगर डिवाइस पास में है, तो Apple डिवाइसों के बीच AirDrop भी इस्तेमाल कर सकते हैं।
android.title=Android के रिकॉर्डर से कहानी की ऑडियो फ़ाइल भेजें
android.p1=Google Pixel के Recorder ऐप में रिकॉर्डिंग को कुछ देर दबाकर रखें। Share में File दबाएँ, फिर Audio चुनें और वह ऐप खोलें जिससे फ़ाइल भेजनी है। Transcript चुनने से कहानी का लिखा हुआ पाठ जाएगा, रिकॉर्ड की हुई आवाज़ नहीं।
android.p2=दूसरे Android फ़ोन में रिकॉर्डिंग ऐप का मेन्यू अलग हो सकता है। रिकॉर्डिंग खोलकर Share, Send या Export जैसा विकल्प ढूँढें और ऑडियो फ़ाइल चुनें। अगर ऐप फ़ाइल को डिवाइस पर सेव करने देता है, तो उसे सेव करने के बाद चैट में अटैच करके भी भेज सकते हैं।
send.title=सीधे फ़ाइल भेजें या डाउनलोड का लिंक दें?
send.p1=कुछ मिनट की छोटी कहानी के लिए फ़ाइल अटैच करना आम तौर पर सबसे आसान रहता है। कहानी का नाम और दिन लिख दें, जैसे ‘बुधवार रात – चाँद की नाव’। इससे घर पर जिसे कहानी चलानी है, उसे पुरानी बातचीत में सही रिकॉर्डिंग ढूँढने में आसानी होगी।
send.p2=फ़ाइल भेजने की सीमा से बड़ी हो तो उसे उस क्लाउड सेवा पर रखें जिसे घरवाले इस्तेमाल करते हैं। सिर्फ़ पाने वाले के खाते को अनुमति देकर लिंक भेजें। लिंक उनके खाते से खुलना चाहिए। अगर सुनने के समय इंटरनेट भरोसेमंद न हो, तो उनसे पहले ही फ़ाइल डाउनलोड करने को कहें।
handoff.title=बच्चे के साथ रहने वाले बड़े को छोटा संदेश भेजें
handoff.example=“आज के लिए ‘चाँद की नाव’ भेजी है। चार मिनट की है। दाँत साफ़ करने के बाद चला देना और आख़िर में मेरी ओर से कहना, ‘शुभ रात्रि, कल मिलेंगे।’ फ़ुर्सत मिले तो शुरू के कुछ सेकंड सुनकर बता देना कि फ़ाइल खुल रही है।”
handoff.check=फ़ाइल मिलने पर शुरू और आख़िर का थोड़ा हिस्सा चलाकर आवाज़ और अवधि देख लें। डाउनलोड करने के बाद ऐसी जगह रखें जहाँ शाम को जल्दी मिल जाए। ज़रूरत पड़े तो एक पसंदीदा किताब भी पास रख सकते हैं।
fix.title=फ़ाइल नहीं खुल रही या आवाज़ नहीं आ रही?
fix.p1=अगर लिंक खोलने पर अनुमति माँगी जाए, तो देखें कि पाने वाला किस खाते से साइन इन है। उसी खाते को फ़ाइल खोलने की अनुमति दें या ऑडियो सीधे अटैच करके दोबारा भेजें। फ़ाइल हट गई हो तो रिकॉर्डर ऐप से उसकी नई कॉपी निकालें।
fix.p2=अगर फ़ाइल खुल गई है लेकिन आवाज़ नहीं है, तो मीडिया का वॉल्यूम और Bluetooth की जाँच करें। कभी आवाज़ पास के हेडफ़ोन पर जा रही होती है। अगर गलती से एडिट वाली फ़ाइल या लिखा हुआ पाठ भेजा गया है, तो रिकॉर्डर से कहानी को ऑडियो के रूप में फिर से भेजें।
faq.title=कहानी की रिकॉर्डिंग भेजने से जुड़े सवाल
faq.q1=क्या घरवालों को वही रिकॉर्डिंग ऐप इंस्टॉल करना होगा?
faq.a1=आम तौर पर नहीं। फ़ाइल का फ़ॉर्मैट उनके फ़ोन पर चलता हो तो उसे चैट ऐप या फ़ोन के ऑडियो प्लेयर में सुन सकते हैं। संदेह हो तो पहले दस सेकंड की रिकॉर्डिंग भेजकर देख लें।
faq.q2=इंटरनेट के बिना कहानी सुन सकते हैं?
faq.a2=हाँ, अगर ऑडियो फ़ाइल उसी फ़ोन या टैबलेट पर पहले से पूरी डाउनलोड है। सिर्फ़ क्लाउड का लिंक मिल जाना काफ़ी नहीं। बेहतर है कि शाम से पहले नेटवर्क बंद करके फ़ाइल एक बार चला लें।
