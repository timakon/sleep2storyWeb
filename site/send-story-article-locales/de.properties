meta.title=Gute-Nacht-Geschichte als Audio verschicken | Sleep2Story
meta.description=So verschicken Sie eine aufgenommene Gute-Nacht-Geschichte mit dem iPhone oder Android-Handy und testen die Wiedergabe vor dem Schlafengehen.
meta.og_title=Eine aufgenommene Gute-Nacht-Geschichte verschicken
meta.og_description=Vom Sprachmemo zur abspielbaren Audiodatei für die Person, die Ihr Kind heute ins Bett bringt.
schema.description=Anleitung zum Verschicken und Abspielen einer aufgenommenen Gute-Nacht-Geschichte vom iPhone oder Android-Handy.
index.card_title=Gute-Nacht-Geschichte als Audio verschicken
index.card_excerpt=So senden Sie die fertige Aufnahme vom iPhone oder Android-Handy, und so kann sie am Abend auch ohne Internet abgespielt werden.
hero.title=So verschicken Sie eine aufgenommene Gute-Nacht-Geschichte
hero.lead=Die Geschichte ist vorgelesen und auf dem Handy gespeichert. Jetzt soll sie bei der Person ankommen, die Ihr Kind heute ins Bett bringt. Am einfachsten geht das mit einer Audiodatei, einem kurzen Hinweis und einem Test auf dem Gerät, das abends neben dem Bett liegt.
quick.title=Der kürzeste Weg von der Aufnahme ans Bett
quick.body=Öffnen Sie die fertige Aufnahme, wählen Sie „Teilen“ und schicken Sie die Audiodatei per Messenger oder E-Mail direkt an die Betreuungsperson. Bitten Sie sie, die Datei tagsüber auf dem später verwendeten Handy oder Tablet zu öffnen. Bei schwachem Empfang lädt sie die Geschichte vorher herunter und prüft kurz, ob sie auch offline losläuft.
iphone.title=Eine Geschichte aus „Sprachmemos“ am iPhone senden
iphone.p1=Öffnen Sie „Sprachmemos“ und tippen Sie auf die Geschichte. Wählen Sie über die Taste für weitere Aktionen mit den drei Punkten „Teilen“. Wenn „Optionen“ erscheint, wählen Sie „Gerendert“. Das iPhone erstellt dabei eine einzelne .m4a-Datei mit der fertigen Tonspur.
iphone.p2=Wählen Sie anschließend eine Nachrichten- oder Mail-App und dann die Person, die das Audio abspielen soll. Benennen Sie die Aufnahme vorher so, dass sie auch in einem vollen Chat auffällt, zum Beispiel „Der Fuchs und der Mond – Dienstag“. Eine bearbeitbare Version ist für jemanden gedacht, der an der Aufnahme weiterarbeiten möchte.
android.title=Eine Aufnahme von einem Android-Handy teilen
android.p1=Auf einem Google Pixel halten Sie die Geschichte in der App „Rekorder“ gedrückt. Tippen Sie auf „Teilen“, dann auf „Datei“ und „Audio“. Wählen Sie eine App und den Kontakt. So kommt der Ton an. Ein Transkript enthält den erkannten Text.
android.p2=Auf anderen Android-Handys kann die Aufnahme-App anders heißen und die Menüs können sich unterscheiden. Öffnen Sie die gespeicherte Aufnahme oder halten Sie ihren Eintrag gedrückt und suchen Sie nach „Teilen“ oder dem Teilen-Symbol. Bietet die App mehrere Exportarten an, wählen Sie die Audiodatei. Falls sie nur Speichern anbietet, suchen Sie die Datei anschließend in der Dateien-App und teilen Sie sie von dort.
send.title=Anhang oder Freigabelink?
send.p1=Für eine einzelne Geschichte ist ein Anhang im vertrauten Chat oder in einer E-Mail meist am einfachsten. Die Person vor Ort kann die Datei direkt öffnen und bei Bedarf speichern. Schicken Sie sie an den vorgesehenen Kontakt. Eine kurze Nachricht mit dem Titel verhindert, dass am Abend aus Versehen die falsche Aufnahme läuft.
send.p2=Wenn der Anhang zu groß ist, legen Sie die Datei in einem Cloudspeicher ab und geben Sie sie gezielt für die E-Mail-Adresse oder das Konto der Betreuungsperson frei. Ein öffentlicher Link ist dafür unnötig. Lassen Sie den Link aus der Nachricht mit dem Empfängerkonto öffnen. Bei schwachem WLAN sollte eine heruntergeladene Kopie bereitliegen.
handoff.title=Schreiben Sie dazu, wann die Geschichte dran ist
handoff.example=„Nach dem Zähneputzen: Der Fuchs und der Mond, knapp vier Minuten. Kannst du kurz prüfen, ob die Datei auf dem Tablet läuft? Wenn es heute ohne Aufnahme leichter geht, liegt das Hasenbuch neben dem Bett.“
handoff.check=Die Person zu Hause sollte den Anfang hören und kurz zum Ende springen. So merkt sie, ob der Ton verständlich ist und die Datei vollständig angekommen ist. Falls der Abend ohne Internet auskommen soll, öffnet sie die heruntergeladene Datei einmal im Flugmodus und legt sie anschließend griffbereit.
fix.title=Wenn die Datei sich nicht öffnen lässt oder stumm bleibt
fix.p1=Bei „Zugriff erforderlich“ prüfen Sie, ob die andere Person mit dem Konto angemeldet ist, für das Sie die Datei freigegeben haben. Passen Sie bei Bedarf den Zugriff für genau dieses Konto an. Wenn der Messenger eine Vorschau zeigt, aber nichts abspielt, speichern Sie die Datei und öffnen Sie sie mit dem Audioplayer des Geräts.
fix.p2=Bei fehlendem Ton zuerst die Medienlautstärke und verbundene Bluetooth-Kopfhörer prüfen. Hören Sie danach die Originalaufnahme auf dem eigenen Gerät ab. Spielt sie dort, senden Sie die Audiodatei erneut und prüfen Sie die gewählte Exportart. Ein Texttranskript oder ein bearbeitbares Projekt kann auf dem anderen Gerät eine ganz andere Vorschau ergeben.
faq.title=Häufige Fragen zum Versand der Geschichte
faq.q1=Kann ich die Aufnahme vom iPhone an ein Android-Handy schicken?
faq.a1=Ja. Teilen Sie eine normale Audiodatei und wählen Sie einen Weg, den beide Geräte nutzen, etwa E-Mail oder einen gemeinsamen Messenger. Eine .m4a-Datei lässt sich auf vielen Geräten öffnen. Testen Sie das konkrete Empfängergerät vor dem Abend.
faq.q2=Kann mein Kind die Geschichte ohne Internet hören?
faq.a2=Die Betreuungsperson kann die Audiodatei vorab auf dem Abspielgerät speichern. Die Vorschau im Chat genügt für einen Abend ohne Verbindung womöglich nicht. Ein kurzer Test mit der gespeicherten Datei im Flugmodus klärt das.
