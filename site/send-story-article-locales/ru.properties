meta.title=Как отправить запись сказки на ночь ребёнку | Sleep2Story
meta.description=Как отправить аудиозапись сказки с iPhone или Android, поделиться файлом или закрытой ссылкой и проверить, что сказку можно включить перед сном.
meta.og_title=Как отправить ребёнку записанную сказку на ночь
meta.og_description=Как передать запись с iPhone или Android, что написать взрослому дома и как проверить, что сказку можно включить без интернета.
schema.description=Пошаговая инструкция для семьи: отправка аудиозаписи сказки с iPhone или Android, доступ к файлу и проверка воспроизведения перед сном.
index.card_title=Как отправить запись сказки на ночь
index.card_excerpt=Отправьте аудиофайл с телефона и заранее проверьте, что взрослый дома сможет его найти и включить.
hero.title=Как отправить ребёнку записанную сказку на ночь
hero.lead=Вы уже начитали сказку на телефон. Теперь нужно передать запись тому, кто сегодня укладывает ребёнка, чтобы вечером он мог просто нажать «Воспроизвести». Для этого обычно хватает одного аудиофайла и короткого сообщения.
quick.title=Начните с обычного аудиофайла
quick.body=Откройте запись в диктофоне, поделитесь ею как аудио и отправьте в личном чате или по электронной почте. Попросите взрослого дома открыть полученную копию на том устройстве, с которого будут слушать сказку. Если вечером интернет может пропасть, пусть он скачает файл заранее.
iphone.title=Как отправить запись из «Диктофона» на iPhone
iphone.p1=Откройте «Диктофон» и выберите сказку в списке записей. Нажмите кнопку с тремя точками и выберите «Поделиться». Если в меню есть параметры экспорта, выберите готовую версию записи (Rendered в английском интерфейсе) — она сохранится одним файлом .m4a. Затем выберите почту или мессенджер, проверьте получателя и отправьте.
iphone.p2=Если хотите сначала сохранить файл, выберите «Сохранить в Файлы» в меню отправки. Потом его можно приложить к письму или сообщению из папки. Назовите запись так, чтобы её легко было узнать в чате, например «Заяц на Луне — на вторник». Редактируемая версия нужна для работы со звуком в совместимом приложении. Для прослушивания выберите готовую.
android.title=Как отправить аудиозапись с Pixel или другого Android
android.p1=На Google Pixel откройте приложение для записи звука Recorder. Нажмите на нужную запись и удерживайте, затем выберите «Поделиться», «Файл» и «Аудио». Откройте мессенджер или почту и проверьте, что к сообщению приложен файл, который можно послушать. Расшифровка передаст текст сказки, поэтому для прослушивания выберите аудио.
android.p2=На других телефонах Android приложение может называться «Диктофон», «Запись звука» или иначе. Откройте меню готовой записи и поищите «Поделиться», «Отправить» или «Экспорт». Если диктофон предлагает только ссылку или проект для редактирования, поищите возможность сохранить аудио на телефон. Затем прикрепите его из списка файлов.
send.title=Отправить файл или ссылку с ограниченным доступом?
send.p1=Если запись одна и мессенджер её принимает, прикрепите сам файл. Отправьте в личный чат со взрослым, который будет укладывать ребёнка. Укажите название сказки в том же сообщении. Так семье не придётся вечером искать подходящий файл среди старых голосовых.
send.p2=Если файл слишком большой, загрузите его в облако и дайте доступ только нужному человеку. Попросите открыть ссылку с того аккаунта, которому вы выдали доступ. Для прослушивания без интернета разрешите скачивание, если сервис позволяет, и попросите сохранить файл на телефон или планшет заранее.
handoff.title=Что написать взрослому, который уложит ребёнка
handoff.example=«На сегодня сказка “Заяц на Луне”, около четырёх минут. Включи после того, как почистите зубы и наденете пижаму. Проверь, пожалуйста, что файл открывается. Если не заработает, на полке лежит книжка про зайца».
handoff.check=Попросите получателя включить начало записи на том телефоне и через тот динамик, которыми он будет пользоваться вечером. Иногда звук уходит в Bluetooth-наушники, оставленные в другой комнате. Если файл скачали для прослушивания без интернета, пусть получатель временно отключит Wi-Fi и мобильную сеть и проверит ещё раз.
fix.title=Что делать, если сказка не воспроизводится
fix.p1=Если ссылка требует доступ, уточните, под каким аккаунтом её открывают. Добавьте этот аккаунт в список получателей или пришлите файл напрямую. Если вместо аудио пришёл текст или проект записи, откройте оригинал в диктофоне и ещё раз выберите экспорт звука.
fix.p2=Если файл открывается, но его не слышно, сначала проверьте громкость медиа и подключённые Bluetooth-устройства. Затем включите оригинал на своём телефоне. Если он звучит, отправьте копию ещё раз или попросите открыть полученный файл через менеджер файлов. Если и оригинал записался без звука, на этот вечер пригодится запасная сказка.
faq.title=Частые вопросы об отправке аудиосказки
faq.q1=Можно ли отправить запись с iPhone на Android?
faq.a1=Да. Отправьте аудиофайл или ссылку с доступом для получателя. Если мессенджер не воспроизводит вложение, скачайте его и откройте в проигрывателе с поддержкой .m4a.
faq.q2=Можно ли послушать запись без интернета?
faq.a2=Да, если получатель сохранил на устройстве рабочий аудиофайл. Для первого открытия облачной ссылки обычно нужен интернет. Перед сном лучше проверить, что скачанная копия запускается без сети.
