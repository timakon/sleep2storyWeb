meta.title=Como enviar uma história de embalar gravada | Sleep2Story
meta.description=Envie uma história de embalar gravada a partir de um iPhone ou Android e confirme que o áudio toca à hora de deitar, mesmo sem Internet.
meta.og_title=Como enviar uma história de embalar gravada
meta.og_description=Partilhe a gravação e deixe a história pronta a ouvir no telemóvel ou tablet que a criança vai usar.
schema.description=Guia para enviar o ficheiro de áudio de uma história de embalar a partir de um iPhone ou de um telemóvel Android.
index.card_title=Como enviar uma história de embalar gravada
index.card_excerpt=Partilhe o áudio com quem fica com a criança e prepare a história para tocar mesmo sem ligação à Internet.
hero.title=Como enviar uma história de embalar gravada para a criança ouvir
hero.lead=A história já está gravada no telemóvel. Se for outra pessoa a pô-la a tocar à hora de deitar, envie-lhe o áudio cedo. Um nome fácil de encontrar e uma mensagem curta ajudam a deixar tudo pronto no aparelho que vai estar junto à cama.
quick.title=Envie o ficheiro de áudio e peça um teste
quick.body=Abra a gravação, escolha «Partilhar» e envie o áudio à pessoa que vai estar com a criança. Peça-lhe para abrir o ficheiro no telemóvel ou tablet que vai usar à noite. Se a rede for fraca, vale a pena descarregar uma cópia e confirmar que toca sem ligação.
iphone.title=Enviar a história a partir do Dictafone no iPhone
iphone.p1=Abra o Dictafone, toque na gravação da história e depois no botão com três pontos. Escolha «Partilhar». Se aparecer o menu de opções, escolha a que cria um único ficheiro .m4a com o áudio final. No iPhone em português do Brasil, a aplicação chama-se Gravador e a opção pode aparecer como «Renderizado».
iphone.p2=Escolha Mensagens, Mail ou a aplicação onde costuma falar com quem vai reproduzir a história. Dê à gravação um nome fácil de reconhecer, como «A raposa e a lua – terça-feira». O formato editável destina-se a quem vai trabalhar na gravação com um dispositivo compatível.
android.title=Partilhar uma história gravada no Android
android.p1=Num Google Pixel, abra a aplicação Gravador e toque sem soltar na história. Escolha partilhar como ficheiro e selecione «Áudio». Depois escolha a aplicação de envio e o destinatário. A opção de transcrição partilha o texto reconhecido pelo Gravador.
android.p2=Noutros telemóveis Android, o gravador pode ter outro nome e os menus variam. Abra a gravação guardada ou toque sem soltar no respetivo nome e procure o ícone de partilha ou a opção de exportar. Se o gravador só permitir guardar, encontre o áudio na aplicação de ficheiros do telemóvel e partilhe-o a partir daí.
send.title=Anexo ou ligação com acesso restrito?
send.p1=Se o ficheiro couber no limite da aplicação, envie-o como anexo numa conversa privada ou por e-mail. Use o canal que a outra pessoa já consulta e escreva o nome da história junto ao ficheiro. Isso ajuda quando há vários áudios na mesma conversa.
send.p2=Se o áudio for demasiado grande, guarde-o no seu armazenamento na nuvem e dê acesso apenas à conta da pessoa que o vai receber. Peça-lhe que abra essa ligação com a conta autorizada. Se a rede puder falhar, a outra pessoa pode descarregar o ficheiro antes da hora de deitar.
handoff.title=Deixe uma nota a quem vai ficar com a criança
handoff.example=«Depois de lavar os dentes, podes pôr A raposa e a lua. Demora pouco menos de quatro minutos. Confirmas que se ouve no tablet? Se hoje preferir que leias, o livro do coelho está na mesa de cabeceira.»
handoff.check=Peça a quem recebe que ouça o início e avance para perto do fim. Assim é mais fácil detetar um envio incompleto ou um volume baixo. Se a ideia for usar a cópia descarregada, faça um teste rápido com o aparelho em modo de voo.
fix.title=O que fazer se o áudio não abrir ou não se ouvir
fix.p1=Se a ligação pedir autorização, confirme que a pessoa abriu a página com a conta a que deu acesso. Se a aplicação de mensagens mostrar o ficheiro mas não conseguir reproduzi-lo, experimente guardar o anexo e abri-lo no leitor de áudio do aparelho.
fix.p2=Se o contador avançar sem se ouvir nada, verifique o volume multimédia e a ligação a auscultadores Bluetooth. Depois ouça a gravação original no telemóvel de origem. Se estiver boa, volte a exportar e enviar o ficheiro de áudio. Um projeto editável ou uma transcrição podem chegar como anexo sem permitir ouvir a história.
faq.title=Perguntas sobre o envio de histórias gravadas
faq.q1=Posso enviar uma história do iPhone para um Android?
faq.a1=Sim. Envie o ficheiro de áudio por e-mail ou através de uma aplicação de mensagens que ambos utilizem. Muitos aparelhos reproduzem .m4a. Antes do serão, confirme que o ficheiro abre no dispositivo de quem o recebeu.
faq.q2=É possível ouvir a história sem Internet?
faq.a2=Sim, se o áudio estiver guardado no aparelho que vai reproduzi-lo. Abra essa cópia em modo de voo para confirmar. Ver o nome do ficheiro na conversa não significa que já foi descarregado.
