meta.title=كيف ترسل قصة قبل النوم مسجّلة إلى طفلك؟ | Sleep2Story
meta.description=أرسل تسجيل قصة قبل النوم من الآيفون أو أندرويد كملف صوتي. تعرّف على طريقة مشاركة الملفات الكبيرة والتحقق من التشغيل حتى من دون إنترنت.
meta.og_title=كيف ترسل قصة قبل النوم مسجّلة إلى طفلك؟
meta.og_description=أرسل تسجيل القصة إلى الشخص الذي سيبقى مع طفلك الليلة. جرّبا تشغيله مسبقاً حتى يكون جاهزاً عند موعد النوم.
schema.description=دليل لإرسال تسجيل قصة قبل النوم من الآيفون أو أندرويد كملف صوتي، والتحقق من تشغيله على جهاز أحد أفراد العائلة.
index.card_title=أرسل تسجيل قصة قبل النوم إلى طفلك
index.card_excerpt=خطوات إرسال ملف القصة من الهاتف والتأكد من أنه يعمل عند الشخص الذي سيشغّله لطفلك.
hero.title=كيف ترسل قصة قبل النوم مسجّلة إلى طفلك؟
hero.lead=إذا كنت في سفر أو ستتأخر عن موعد النوم، يمكنك إرسال القصة التي سجّلتها إلى الشخص البالغ الذي سيكون مع طفلك. اطلب منه تشغيل بضع ثوانٍ منها قبل حلول المساء، حتى يجدها جاهزة عندما يحين وقت القصة.
quick.title=أرسل الصوت كملف وجرّبه على جهاز المستلِم
quick.body=شارك التسجيل كملف صوتي عبر محادثة خاصة أو بالبريد الإلكتروني. اطلب من المستلِم فتحه على الهاتف أو الجهاز اللوحي الذي سيستخدمه مع الطفل. إذا كان الاتصال بالإنترنت ضعيفاً هناك، فليُنزّل الملف على الجهاز مسبقاً وليجرّب تشغيله بلا اتصال.
iphone.title=إرسال التسجيل من المذكرات الصوتية على الآيفون
iphone.p1=افتح تطبيق «المذكرات الصوتية» واختر تسجيل القصة من القائمة. اضغط على زر المزيد، ثم اختر «مشاركة». إذا ظهرت خيارات الصيغة، اختر الصيغة التي تجمع التسجيل في ملف واحد (Rendered) بامتداد ‎.m4a، ثم اختر التطبيق الذي سترسل منه الملف وحدّد المستلِم.
iphone.p2=عندما يكون أفراد العائلة بعيدين، أرفق الملف في المحادثة أو البريد. تأكّد قبل الإرسال من أن المرفق يمكن تشغيله كصوت. قد تحتاج النسخة القابلة للتحرير إلى تطبيق متوافق عند المستلِم. وإذا كان الشخص بالقرب منك ولديه جهاز Apple متوافق، يمكنك نقل التسجيل عبر AirDrop.
android.title=إرسال تسجيل القصة من هاتف أندرويد
android.p1=على هواتف Pixel، افتح تطبيق «مسجّل الصوت» واضغط مطوّلاً على التسجيل، ثم اختر «مشاركة» وبعدها «ملف». اختر الصوت وحدّد التطبيق الذي ستستخدمه للإرسال. خيار النص المكتوب يرسل تفريغ التسجيل، لذلك لن تصل القراءة بصوتك بهذه الطريقة.
android.p2=على هواتف أندرويد الأخرى قد تجد الأمر باسم «مشاركة» أو «إرسال» أو «تصدير». اختر ملفاً صوتياً إن عرض التطبيق أكثر من صيغة. وإذا كان بإمكانك حفظ نسخة في تطبيق الملفات، فاحفظها هناك ثم افتح محادثتك مع الشخص المقصود وأرفقها.
send.title=متى ترسل مرفقاً ومتى تستخدم رابطاً؟
send.p1=إذا كانت القصة تستغرق بضع دقائق، فغالباً ما يكون إرسالها كمرفق أبسط. اكتب اسم القصة واليوم في اسم الملف، مثل «الأربعاء – قارب القمر». وإذا أرسلت أكثر من تسجيل، أخبر المستلِم أيّ قصة اخترتها لهذه الليلة.
send.p2=إذا تجاوز الملف حدّ المرفقات، احفظه في خدمة تخزين سحابي يستخدمها أفراد العائلة بالفعل. امنح المستلِم إذناً بحسابه وأرسل الرابط في محادثة خاصة. اطلب منه فتحه بحسابه هو ثم تنزيله إذا أراد تشغيله لاحقاً من دون إنترنت.
handoff.title=رسالة قصيرة لمن سيكون مع الطفل
handoff.example=«أرسلت لك قصة قارب القمر لليلة. مدّتها نحو أربع دقائق. شغّلها بعد تنظيف الأسنان، وقل في النهاية منّي: تصبح على خير، أراك غداً. عندما يتاح لك وقت، جرّب فتح الملف والتأكد من أن الصوت واضح.»
handoff.check=بعد وصول الملف، من المفيد سماع بدايته ونهايته للتأكّد من مستوى الصوت واكتمال التسجيل. إذا نُزّل على الجهاز، احتفظ به في مكان يسهل العثور عليه. ويمكن أيضاً الاتفاق على كتاب مألوف يكون جاهزاً إذا تعذّر تشغيل التسجيل.
fix.title=ماذا لو لم يُفتح التسجيل أو لم يظهر الصوت؟
fix.p1=إذا طلب الرابط إذناً، اسأل المستلِم عن الحساب الذي يستخدمه وامنحه صلاحية الوصول أو أعد الإرسال بمرفق مباشر. إذا نُقل الملف أو حُذف، ابحث عن التسجيل الأصلي في تطبيق التسجيل وصدّر نسخة جديدة.
fix.p2=إذا ظهر المشغّل ولم تسمع شيئاً، تحقّق من مستوى صوت الوسائط ومن اتصال سماعات البلوتوث. وإذا اتّضح أن المرفق مشروع قابل للتحرير أو نص مكتوب، فأعد تصدير القصة بصيغة ملف صوتي عادي وأرسله من جديد.
faq.title=أسئلة حول إرسال تسجيلات قصص قبل النوم
faq.q1=هل يلزم تثبيت تطبيق التسجيل نفسه عند المستلِم؟
faq.a1=في العادة يكفي أن يدعم جهازه صيغة الملف الصوتي. يمكن أن يشغّله من داخل المحادثة أو بمشغّل الصوت في الجهاز. إذا لم تكن متأكداً، أرسل تسجيلاً تجريبياً مدّته عشر ثوانٍ.
faq.q2=هل يمكن الاستماع إلى القصة من دون إنترنت؟
faq.a2=نعم، إذا نُزّل الملف الصوتي بالكامل على الهاتف أو الجهاز اللوحي الذي سيُستخدم للاستماع. قد يحتاج فتح رابط في التخزين السحابي إلى اتصال. جرّب تشغيل النسخة المحفوظة بعد فصل الإنترنت.
