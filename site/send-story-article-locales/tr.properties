meta.title=Çocuğunuza uyku masalı kaydı nasıl gönderilir? | Sleep2Story
meta.description=iPhone veya Android’deki uyku masalı kaydını ses dosyası ya da kısıtlı bağlantı olarak gönderin. Kaydın diğer telefonda açıldığını önceden kontrol edin.
meta.og_title=Çocuğunuza sesini kaydettiğiniz bir uyku masalı nasıl gönderilir?
meta.og_description=iPhone ve Android’den ses dosyası gönderme adımları, evdeki yetişkine örnek mesaj ve çevrimdışı dinleme kontrolü.
schema.description=iPhone veya Android’de kaydedilmiş bir uyku masalını paylaşma ve çocuğun yatacağı akşam kullanılacak cihazda önceden oynatma kılavuzu.
index.card_title=Uyku masalı kaydı nasıl gönderilir?
index.card_excerpt=Masalı telefondan ses dosyası olarak gönderin, kısa bir not ekleyin ve kaydın evde açıldığını kontrol edin.
hero.title=Çocuğunuza uyku masalı kaydı nasıl gönderilir?
hero.lead=Masalı telefonunuza okudunuz. Şimdi sıra kaydı, bu akşam çocuğunuzu yatıracak yetişkine ulaştırmakta. Bir ses dosyası ve kısa bir notla, siz telefona bakamasanız bile evde masalın nereden açılacağı belli olur.
quick.title=Önce ses dosyasını gönderin
quick.body=Asıl kaydı açın, dinlenebilir bir ses dosyası olarak paylaşın ve özel mesajla ya da e-postayla gönderin. Alıcıdan, akşam gerçekten kullanacağı telefon veya tablette gelen dosyayı açmasını isteyin. Bağlantı akşam zayıflayabiliyorsa masalı internet varken indirsin.
iphone.title=iPhone’da Sesli Notlar’dan masal kaydı gönderme
iphone.p1=Sesli Notlar’ı açın ve listeden masalı seçin. Üç noktalı menüden “Paylaş”a dokunun. Paylaşım ekranında “Seçenekler” görünüyorsa dinlemeye hazır tek bir .m4a dosyası oluşturan seçeneği seçin. İngilizce arayüzde adı “Rendered”dır. Ardından mesaj veya e-posta uygulamasını seçip evdeki yetişkine gönderin.
iphone.p2=Dosyayı daha sonra göndermek isterseniz paylaşım ekranındaki “Dosyalara Kaydet” seçeneğini kullanın. “Aydaki Tavşan — Salı akşamı” gibi kolay bulunacak bir ad verin. Düzenlenebilir sürümü, alıcı kaydı uyumlu bir uygulamada düzenleyecekse kullanın. Evde dinlemek için hazır ses dosyası yeterli.
android.title=Pixel veya başka bir Android telefondan kayıt gönderme
android.p1=Google Pixel’de Kaydedici’yi açıp masal kaydına basılı tutun. Sırasıyla “Paylaş”, “Dosya” ve “Ses”i seçin. Mesajlaşma ya da e-posta uygulamanızı açın ve giden mesaja bir ses dosyasının eklendiğini kontrol edin. “Transkript” seçeneği okuduğunuz sözleri yazı olarak gönderir.
android.p2=Diğer Android telefonlarda kayıt uygulamasının adı ve menü seçenekleri modele göre değişebilir. Kaydın menüsünde “Paylaş”, “Gönder” veya “Dışa aktar” seçeneğini arayın. Yalnızca bağlantı ya da düzenleme projesi çıkıyorsa sesi önce telefona kaydetmeyi deneyin. Sonra mesajınıza dosya seçiciden ekleyebilirsiniz.
send.title=Dosya eki mi, erişimi kısıtlı bağlantı mı?
send.p1=Tek bir masal için dosya eki bulması kolay bir seçenektir. Kaydı, çocuğun yanında olacak yetişkinle zaten kullandığınız özel sohbete veya e-postaya gönderin. Aynı mesajda masalın adını da yazın. Birkaç akşam için kayıt hazırladıysanız hangisinin hangi gün çalınacağını belirtin.
send.p2=Mesajlaşma uygulaması büyük dosyayı kabul etmiyorsa kaydı bir bulut klasörüne yükleyip erişimi alıcının hesabıyla sınırlayın. Alıcıdan bağlantıyı izin verdiğiniz hesapla açmasını isteyin. Akşam internetsiz dinlemek gerekiyorsa ve hizmet izin veriyorsa indirmeyi açın. Dosyayı masalın dinleneceği cihaza daha önceden kaydetsin.
handoff.title=Evdeki yetişkine kısa bir mesaj ekleyin
handoff.example=“Bu akşamki masal Aydaki Tavşan, yaklaşık dört dakika. Dişler fırçalanıp pijamalar giyilince açar mısın? Dosyanın telefonunda çalıştığına bir bakabilir misin? Açılmazsa tavşan kitabı rafta.”
handoff.check=Evdeki yetişkin masalın ilk birkaç saniyesini akşam kullanacağı cihazın hoparlöründen dinlesin. Dosya açıldığı hâlde ses başka odada kalan Bluetooth kulaklığa gidiyor olabilir. Çevrimdışı dinlemek için kaydı indirdiyse Wi-Fi’ı ve mobil veriyi bir anlığına kapatıp indirilen dosyayı yeniden açsın.
fix.title=Masal açılmıyorsa ne yapmalı?
fix.p1=Bir bağlantı erişim istiyorsa alıcının hangi hesapla açtığını sorun ve o hesaba izin verin. İsterseniz ses dosyasını doğrudan ek olarak yeniden gönderin. Karşı tarafa yalnızca masalın yazısı veya düzenlenebilir proje gittiyse ilk kaydı açın ve sesi dosya olarak paylaşın.
fix.p2=Dosya açılıyor ama ses gelmiyorsa önce medya sesini ve Bluetooth bağlantılarını kontrol edin. Sonra asıl kaydı kendi telefonunuzda dinleyin. Orijinalde ses varsa dosyayı yeniden gönderin veya alıcıdan indirilenler klasöründen açmasını isteyin. Asıl kayıt da sessizse o akşam raftaki yedek kitabı okuyabilirsiniz.
faq.title=Uyku masalı kaydı paylaşma hakkında sorular
faq.q1=iPhone’daki bir ses kaydı Android telefona gönderilebilir mi?
faq.a1=Evet. Kaydı ses dosyası olarak veya alıcının açabildiği bir bağlantıyla gönderin. Mesajlaşma uygulaması eki oynatmıyorsa alıcı dosyayı indirip .m4a açabilen bir ses oynatıcıda dinleyebilir.
faq.q2=Masal internet olmadan dinlenebilir mi?
faq.a2=Evet, masalın açılabilen bir kopyası telefona kaydedilmişse. Bir bulut bağlantısını ilk kez açmak için genellikle internet gerekir. Yatmadan önce bağlantıyı kısa süre kapatıp indirdiğiniz kaydı deneyin.
