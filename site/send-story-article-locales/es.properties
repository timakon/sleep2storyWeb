meta.title=Cómo enviar un cuento para dormir grabado | Sleep2Story
meta.description=Envía un cuento para dormir grabado desde iPhone o Android y prepara el audio para que tu hijo lo escuche incluso sin internet.
meta.og_title=Cómo enviar un cuento para dormir grabado
meta.og_description=Comparte el archivo de audio desde tu móvil y comprueba que la persona que acompaña a tu hijo puede reproducirlo.
schema.description=Guía para enviar un cuento para dormir grabado desde un iPhone o un teléfono Android y preparar su reproducción.
index.card_title=Cómo enviar un cuento para dormir grabado
index.card_excerpt=Comparte una grabación con quien se queda en casa y deja el audio listo para la hora de dormir.
hero.title=Cómo enviar a tu hijo un cuento para dormir que has grabado
hero.lead=Ya tienes el cuento grabado en el móvil. Si esta noche lo va a poner otro adulto, envíale el audio con tiempo para que pueda abrirlo en el dispositivo que usarán al acostarse. Así también sirve si estás trabajando, de viaje o sin cobertura a esa hora.
quick.title=Envía el archivo y pide una prueba de sonido
quick.body=Abre la grabación, toca «Compartir» y envía el archivo de audio a la persona que estará con tu hijo. Pídele que escuche unos segundos en el móvil o la tableta que vaya a usar. Si por la noche no habrá buena conexión, que descargue el archivo antes y compruebe que suena sin internet.
iphone.title=Enviar el cuento desde Notas de Voz en iPhone
iphone.p1=Abre Notas de Voz, selecciona el cuento y toca el botón de más acciones, que tiene tres puntos. Elige «Compartir». Si aparece «Opciones», selecciona «Archivo renderizado». Esta opción reúne todo el sonido en un solo archivo .m4a listo para oír.
iphone.p2=Elige Mensajes, Mail o la aplicación en la que sueles hablar con la persona que va a reproducirlo. Dale antes un nombre fácil de reconocer al archivo, por ejemplo «El zorro y la luna – cuento del martes». La opción editable es para quien vaya a modificar la grabación y use un dispositivo compatible.
android.title=Enviar la grabación desde Android
android.p1=En un Google Pixel, mantén pulsado el cuento en Grabadora. Toca «Compartir», elige «Archivo» y selecciona «Audio». Después elige la aplicación con la que vas a enviarlo y el contacto. Si seleccionas la transcripción, compartirás el texto que ha detectado la grabadora.
android.p2=En otros teléfonos, los nombres y los iconos pueden cambiar. Abre la grabación guardada o mantenla pulsada en la lista y busca «Compartir» o «Exportar». Si te ofrece varios formatos o tipos de archivo, elige el audio. Si la grabadora solo permite guardarlo, búscalo después en la aplicación de archivos del teléfono y compártelo desde allí.
send.title=Cuándo enviar un archivo y cuándo usar un enlace
send.p1=Para un cuento corto suele bastar con adjuntar el archivo de audio en una conversación privada o en un correo. Usa el canal que la otra persona consulta normalmente. Añade el título del cuento al mensaje, sobre todo si ya habéis compartido varias grabaciones en la misma conversación.
send.p2=Si la aplicación rechaza el archivo por su tamaño, sube solo ese audio a tu almacenamiento en la nube y concede acceso a la cuenta de la persona que lo va a poner. Pídele que abra el enlace que le has enviado e inicie sesión con esa cuenta. Si necesita escucharlo sin conexión, conviene que lo descargue con antelación.
handoff.title=Deja una nota breve para quien se queda en casa
handoff.example=«Después de lavarse los dientes, pon El zorro y la luna. Dura menos de cuatro minutos. ¿Me confirmas que se oye en la tableta? Si hoy prefiere que le leas, el cuento del conejo está en la mesita».
handoff.check=Pídele a la otra persona que reproduzca el comienzo y salte un poco hacia el final. Así puede detectar si el volumen es bajo, si el archivo está incompleto o si el sonido sale por unos auriculares conectados. Cuando vaya a depender de una copia descargada, que la pruebe una vez en modo avión.
fix.title=Qué hacer si la grabación no se abre o no se oye
fix.p1=Si sale un aviso para solicitar acceso, revisad que la cuenta con la que se abre el enlace sea la misma a la que diste permiso. Si el audio no suena dentro del chat, guardad el archivo y probad a abrirlo en el reproductor del dispositivo.
fix.p2=Si el reproductor avanza en silencio, revisad el volumen multimedia y las conexiones Bluetooth. Escucha también el original en tu móvil. Si allí se oye bien, vuelve a enviar el archivo en formato de audio. Enviar un proyecto editable o una transcripción puede dar lugar a una vista previa que no reproduce la voz.
faq.title=Preguntas sobre cómo compartir un cuento grabado
faq.q1=¿Puedo mandar el audio de un iPhone a un Android?
faq.a1=Sí. Envía el audio como archivo por correo o por una aplicación que tengáis los dos. Muchos móviles pueden reproducir .m4a. Antes de la hora de dormir, comprobad que el archivo se abre en el dispositivo del destinatario.
faq.q2=¿Se puede escuchar un cuento grabado sin wifi?
faq.a2=Sí, si el archivo ya está descargado en el dispositivo. Es mejor abrir la copia guardada y comprobar que reproduce en modo avión. Ver el audio en la conversación no garantiza que esté descargado.
