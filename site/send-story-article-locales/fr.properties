meta.title=Comment envoyer une histoire du soir enregistrée | Sleep2Story
meta.description=Transmettez une histoire du soir enregistrée sur iPhone ou Android et préparez l’écoute sur l’appareil qui servira au coucher.
meta.og_title=Comment envoyer une histoire du soir enregistrée
meta.og_description=Du Dictaphone au coucher, les étapes pour envoyer l’audio et vérifier qu’il se lance, même si le Wi-Fi est instable.
schema.description=Guide pour partager le fichier audio d’une histoire du soir depuis un iPhone ou un téléphone Android et préparer son écoute.
index.card_title=Comment envoyer une histoire du soir enregistrée
index.card_excerpt=Partagez le fichier audio avec l’adulte qui accompagne votre enfant et préparez l’écoute, même hors connexion.
hero.title=Comment envoyer à votre enfant une histoire du soir enregistrée
hero.lead=L’histoire est déjà enregistrée sur votre téléphone. Reste à la faire parvenir à la personne qui sera là au coucher. Un fichier audio et quelques mots sur le moment où le lancer suffisent souvent. Faites un essai en journée pour que l’écoute soit prête quand votre enfant sortira son livre ou son doudou.
quick.title=Le plus simple est d’envoyer le fichier audio
quick.body=Ouvrez l’enregistrement, choisissez « Partager », puis joignez le fichier audio à un message privé ou à un e-mail. Demandez à l’adulte qui le reçoit de l’ouvrir sur le téléphone ou la tablette prévus pour le soir. En cas de réseau capricieux, téléchargez une copie avant le coucher.
iphone.title=Envoyer l’audio depuis Dictaphone sur iPhone
iphone.p1=Dans Dictaphone, touchez l’histoire dans la liste, puis le bouton à trois points pour accéder aux actions. Choisissez « Partager ». Si « Options » s’affiche, sélectionnez « Rendu » pour obtenir le son dans un seul fichier .m4a.
iphone.p2=Choisissez ensuite Messages, Mail ou l’application de votre choix, puis vérifiez le destinataire avant l’envoi. Un titre comme « Le renard et la lune – mardi » permet à l’autre adulte de retrouver l’histoire au milieu du fil. Le format modifiable sert si quelqu’un doit retravailler l’enregistrement sur un appareil compatible.
android.title=Envoyer une histoire depuis un téléphone Android
android.p1=Sur un Google Pixel, ouvrez l’application Enregistreur et faites un appui long sur l’histoire. Dans le menu de partage, sélectionnez « Fichier », puis « Audio », avant de choisir l’application et le destinataire. Une transcription contient les paroles reconnues sous forme de texte.
android.p2=Sur les autres téléphones Android, le nom de l’enregistreur et les boutons varient. Ouvrez la prise enregistrée ou faites un appui long dans la liste, puis cherchez « Partager » ou l’icône de partage. Si vous ne trouvez qu’une option pour enregistrer le fichier, utilisez-la et partagez ensuite l’audio depuis l’application Fichiers du téléphone.
send.title=Choisir entre une pièce jointe et un lien privé
send.p1=Pour un fichier qui passe sans difficulté, optez pour une pièce jointe dans une conversation privée ou un e-mail. Choisissez le canal que la personne sur place consulte déjà. Indiquez le titre à côté de la pièce jointe, surtout si vous avez envoyé plusieurs histoires dans le même fil.
send.p2=Si le fichier est trop volumineux, déposez-le dans votre espace de stockage en ligne et donnez accès uniquement au compte de la personne qui doit le recevoir. Demandez-lui de tester le lien exact, depuis son propre compte. Pour une écoute hors connexion, elle peut télécharger le fichier sur l’appareil du soir.
handoff.title=Ajoutez un mot pour l’adulte qui sera là au coucher
handoff.example=« Après le brossage des dents, tu peux lancer Le renard et la lune. Ça dure un peu moins de quatre minutes. Tu peux vérifier que le son sort bien de la tablette ? Si elle préfère que tu lises ce soir, le livre du lapin est sur la table de nuit. »
handoff.check=Un essai de quelques secondes au début, puis vers la fin du fichier, suffit pour repérer un volume trop faible ou un envoi interrompu. Si la connexion risque de manquer le soir, testez aussi l’ouverture de la copie téléchargée en mode avion.
fix.title=Si le fichier refuse de s’ouvrir ou reste muet
fix.p1=Si le lien demande une autorisation, vérifiez que le compte utilisé pour l’ouvrir est celui auquel vous avez donné accès. Si le lecteur de la messagerie n’arrive pas à lancer l’audio, enregistrez la pièce jointe sur l’appareil et ouvrez-la dans son lecteur audio.
fix.p2=Si la lecture semble démarrer sans son, vérifiez le volume multimédia et assurez-vous que le téléphone n’envoie pas l’audio à des écouteurs Bluetooth. Écoutez aussi l’original sur votre appareil. Si l’original fonctionne, exportez de nouveau le son et envoyez ce fichier. Le projet de montage et la transcription ne donnent pas toujours un fichier lisible ailleurs.
faq.title=Questions sur les histoires du soir enregistrées
faq.q1=Peut-on envoyer l’audio d’un iPhone à un téléphone Android ?
faq.a1=Oui. Envoyez un fichier audio par e-mail ou avec une messagerie que vous utilisez tous les deux. Beaucoup d’appareils lisent le .m4a. Faites un essai avec l’appareil qui servira à l’écoute pour vérifier la compatibilité.
faq.q2=Peut-on écouter l’histoire sans Internet ?
faq.a2=Oui, si vous avez téléchargé le fichier à l’avance. Ouvrez la copie locale en mode avion pour vous en assurer. Un aperçu dans une conversation ne suffit pas à confirmer que l’audio est disponible hors connexion.
