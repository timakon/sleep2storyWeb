setup.kicker=Než vyberete
setup.title=Vybírejte pro dítě, které máte před sebou dnes
setup.lead=Věkové doporučení je vodítko, ne pravidlo. Batole může týden chtít stejné leporelo; školák spíš kapitolu, vtipnou rodinnou vzpomínku nebo audioseriál s pokračováním zítra.
setup.body=Sledujte tři věci: kolik jazyka dítě bez námahy zvládá, kolik mu zbývá energie a jaký pocit zanechá konec. Divoká dobrodružství přesuňte na dřívější dobu, pokud brání zklidnění. Před spaním často lépe fungují známé zápletky, jemný humor, opakování a jasný závěr.
kit.1.title=Věk a pozornost
kit.1.body=Pro mladší posluchače volte méně postav a více opakování; delší děj nebo kapitoly přidávejte s rostoucí pozorností.
kit.2.title=Pružná délka
kit.2.body=Začněte pěti až deseti klidnými minutami a sledujte dítě, ne hodiny. Krátká pohádka s příjemným koncem stačí.
kit.3.title=Pocit po příběhu
kit.3.body=Vybírejte příběh, po němž pokoj působí tišeji, bezpečněji nebo příjemně zvědavě, ne napjatě a úplně vzhůru.
steps.kicker=Průběh večera
steps.title=Sedm kroků od ruchu ke známému „dobrou noc“
step.1.title=Začněte stejným malým signálem
step.1.body=Nechte pohádku následovat po čištění zubů, pyžamu, zatažení závěsů nebo výběru plyšáka. Tento signál říká, že aktivní část dne končí.
step.2.title=Nabídněte dvě vhodné možnosti
step.2.body=Celá knihovna snadno promění ukládání ve vyjednávání. Vyberte dvě knihy, které jste opravdu ochotni číst. Když jste velmi unavení, nabídněte krátkou oblíbenou pohádku a dříve uloženou nahrávku.
step.3.title=Ztlumte světlo a odložte jasné obrazovky
step.3.body=Nechte dost teplého světla pro pohodlné čtení, ale vyřaďte videa a nekonečné rolování. Pokud audio pouštíte z telefonu, spusťte ho a pak obrazovku nechte být.
step.4.title=Čtěte o něco pomaleji než přes den
step.4.body=Používejte svůj přirozený hlas, ztište se a dělejte pauzy při obracení stránky. Složité herectví není třeba. Rovnoměrné tempo dělá z příběhu most k noci.
step.5.title=Zveme ke spojení, ne ke zkoušení
step.5.body=Stačí jedna jemná otázka: „Co myslíš, že bude dál?“ nebo „Která část se ti líbila?“ Pokud dítě už dřímá, neověřujte, kolik si zapamatovalo.
step.6.title=Končete stejnou větou
step.6.body=Zavřete knihu, řekněte, že čas pohádky skončil, a použijte známé přání na dobrou noc. Předvídatelný konec pomáhá nepřidávat po poslední stránce další tři činnosti.
step.7.title=Připravte si zálohu dříve, než ji potřebujete
step.7.body=V klidný den nahrajte oblíbenou pohádku nebo rodinný vzkaz. Když jste vyčerpaní, bolí vás v krku nebo jste pryč, známý hlas může podpořit rituál, zatímco jiný blízký dospělý zůstává nablízku.
quote.text=Rituál nemusí být dlouhý. Musí být dostatečně známý, aby dítě vědělo, co přijde dál.
quote.attribution=Večerní princip Sleep2Story
checklist.kicker=Pro obyčejný večer
checklist.title=Dvouminutový seznam před pohádkou
checklist.1=Jedna nebo dvě vhodné pohádky jsou připravené
checklist.2=Příběh odpovídá dnešní energii
checklist.3=Jasná videa a oznámení jsou pryč
checklist.4=Místo pro čtení je pohodlné a bezpečné
checklist.5=Délka je reálná i pro dospělého
checklist.6=Čtení nebo audiozáloha je připravená
checklist.7=Závěrečná věta zůstává známá
checklist.8=Lze skončit dříve, když už je klid
problems.title=Chraňte klid, ne dokonalou sérii
problem.1.question=Jsem vyčerpaný nebo mě bolí v krku
problem.1.answer=Vyberte nejkratší známou pohádku, požádejte jiného blízkého dospělého nebo použijte starší nahrávku. Zůstaňte nablízku, pokud vás dítě potřebuje, ale nenuťte se do dlouhého čtení. Bolavý hlas šetřete a při obavách se poraďte s lékařem.
problem.2.question=Dítě chce každý večer stejnou pohádku
problem.2.answer=Opakování není nedostatek pestrosti. Známá slova umožní dítěti předvídat, zapojit se a uvolnit. Oblíbenou pohádku ponechte a občas vedle ní nabídněte jednu novou.
problem.3.question=Pohádky dítě ještě víc rozruší
problem.3.answer=Živé knihy čtěte dříve, večer zvolte kratší a předvídatelnější děj a po poslední stránce všechno ztište. Hlasité role přesuňte na den, pokud pravidelně zvyšují energii.
problem.4.question=Příběh je najednou děsivý
problem.4.answer=Zastavte se, místo abyste za každou cenu dočetli. Pojmenujte, co dítě vyděsilo, ujistěte ho, že je s vámi v bezpečí, a přejděte k něčemu známému. Ke knize se můžete vrátit za dne.
problem.5.question=Cesta nebo pozdní večer narušily rutinu
problem.5.answer=Zachovejte dvě přenosné kotvy: stejnou krátkou pohádku či nahrávku a stejnou závěrečnou větu. Pokoj a čas se mohou změnit, ale pořadí zůstane poznatelné.
faq.title=Odpovědi pro klidnější usínání
faq.1.question=Jak dlouhá má být pohádka na dobrou noc?
faq.1.answer=Dokonalé číslo neexistuje. Pět až deset minut je pro mnoho rodin dobrý začátek, ale pozornost a klid jsou důležitější než hodiny. Skončete dříve nebo dlouhý příběh rozdělte do kapitol.
faq.2.question=Jsou audiopohádky před spaním vhodné?
faq.2.answer=Audio může rutinu dobře doplnit, zejména se známým hlasem a dostupným dospělým. Je to další způsob sdílení příběhu, ne slib usnutí ani náhrada veškeré živé blízkosti.
faq.3.question=Je v pořádku číst každý večer stejnou pohádku?
faq.3.answer=Ano. Opakování usnadňuje zapojení a činí pořadí předvídatelným. Pestrost přidávejte jemně nabídkou jedné známé a jedné nové pohádky.
faq.4.question=Od jakého věku začít s pohádkami na noc?
faq.4.answer=Začít můžete už u miminka několika klidnými stránkami, říkankou nebo zvukem známého hlasu. S rozvojem řeči a pozornosti upravujte slova, obrázky, délku i rozhovor.
