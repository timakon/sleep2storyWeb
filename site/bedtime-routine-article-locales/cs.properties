answer.title=Vyberte krátkou pohádku přiměřenou věku, zachovejte několik známých signálů ke spánku a skončete, dokud je dítě stále klidné.
answer.body=Čtěte sami, když můžete. Při vyčerpání, chrapotu nebo odloučení může známá nahrávka udržet rituál, aniž by se rodič nutil do dlouhého výkonu.
