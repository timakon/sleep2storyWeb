answer.title=Escolha uma história curta e adequada à idade, mantenha alguns sinais habituais de sono e termine enquanto a criança ainda está tranquila.
answer.body=Leia ao vivo quando puder. Em noites de exaustão, rouquidão ou distância, uma gravação familiar pode manter o ritual reconhecível sem obrigar ninguém a ler a todo o custo.
