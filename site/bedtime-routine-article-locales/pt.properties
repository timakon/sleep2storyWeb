problems.title=Proteja a calma, não uma sequência perfeita
problem.1.question=Estou exausto ou tenho dores de garganta
problem.1.answer=Escolha a história conhecida mais curta, peça a outro adulto próximo ou use uma gravação anterior. Fique disponível se a criança precisar, mas não force uma leitura longa. Descanse uma voz dolorosa e procure aconselhamento médico se estiver preocupado.
problem.2.question=A criança pede a mesma história todas as noites
problem.2.answer=A repetição não significa falta de variedade. As palavras conhecidas permitem prever, participar e relaxar. Mantenha o favorito e, de vez em quando, coloque uma opção nova ao lado sem retirar a anterior.
problem.3.question=As histórias deixam a criança ainda mais desperta
problem.3.answer=Passe os livros mais agitados para mais cedo, escolha um enredo curto e previsível e torne mais silencioso o que acontece depois da última página. Se as vozes teatrais a despertam, deixe-as para o dia.
problem.4.question=A história tornou-se assustadora de repente
problem.4.answer=Pare em vez de insistir até ao fim. Dê nome ao que assustou, lembre a criança de que está segura consigo e mude para algo familiar. Podem voltar ao livro durante o dia se ela quiser.
problem.5.question=Uma viagem ou uma noite tardia interrompe a rotina
problem.5.answer=Mantenha duas âncoras portáteis: a mesma história curta ou gravação e a mesma frase final. O quarto e a hora podem mudar enquanto a ordem continua reconhecível.
faq.title=Algumas respostas para uma noite mais tranquila
faq.1.question=Quanto tempo deve durar uma história para dormir?
faq.1.answer=Não existe um número perfeito. Cinco a dez minutos são um bom início para muitas famílias, mas a atenção e a calma contam mais do que o relógio. Termine mais cedo ou divida uma história longa em capítulos.
faq.2.question=As histórias em áudio são boas antes de dormir?
faq.2.answer=O áudio pode complementar bem o ritual, sobretudo com uma voz familiar e um adulto disponível. É outra forma de partilhar uma história, não uma promessa de sono nem um substituto de toda a proximidade ao vivo.
faq.3.question=Pode ler-se a mesma história todas as noites?
faq.3.answer=Sim. A repetição facilita a participação e torna a sequência previsível. Introduza variedade com suavidade, oferecendo uma opção conhecida e outra nova.
faq.4.question=Com que idade podem começar as histórias da noite?
faq.4.answer=Pode começar logo na primeira infância com algumas páginas calmas, uma rima ou o som de uma voz conhecida. Ajuste palavras, imagens, duração e conversa à medida que a linguagem e a atenção crescem.
