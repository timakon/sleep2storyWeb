setup.kicker=Antes de escolher
setup.title=Escolha para a criança que tem à sua frente hoje
setup.lead=A indicação de idade é uma orientação, não uma regra. Uma criança pequena pode pedir o mesmo livro cartonado durante uma semana; uma mais velha poderá preferir um capítulo, uma memória familiar divertida ou uma história em áudio para continuar amanhã.
setup.body=Observe três aspetos: quanta linguagem a criança acompanha sem esforço, quanta energia ainda tem e que sensação fica no final. Guarde as aventuras muito agitadas para mais cedo se dificultarem o sossego. Ao deitar, os enredos conhecidos, o humor suave, as repetições e um final claro costumam ser mais fáceis de largar.
kit.1.title=Idade e atenção
kit.1.body=Para os mais pequenos, escolha poucas personagens e mais repetições; acrescente enredos longos ou capítulos à medida que a atenção cresce.
kit.2.title=Uma duração flexível
kit.2.body=Comece com cinco a dez minutos tranquilos e observe a criança, não o relógio. Uma história curta que termina bem é suficiente.
kit.3.title=A sensação que fica
kit.3.body=Escolha uma história que deixe o quarto mais calmo, seguro ou agradavelmente curioso, em vez de tenso e totalmente desperto.
steps.kicker=O decorrer da noite
steps.title=Sete passos da agitação ao «boa noite» de sempre
step.1.title=Comece com o mesmo pequeno sinal
step.1.body=Faça a história seguir uma ação repetida: lavar os dentes, vestir o pijama, fechar os estores ou escolher o boneco. Esse sinal mostra que a parte ativa do dia está a terminar.
step.2.title=Ofereça duas opções adequadas
step.2.body=Demasiados livros transformam a hora de deitar numa negociação. Escolha dois que está realmente disponível para ler. Numa noite muito cansativa, proponha um favorito curto e uma gravação já guardada.
step.3.title=Baixe a luz e afaste os ecrãs brilhantes
step.3.body=Mantenha luz quente suficiente para ler, mas retire do ritual os vídeos e o deslizar sem fim. Se o áudio vier do telemóvel, inicie-o e depois deixe o ecrã em paz.
step.4.title=Leia um pouco mais devagar do que fala de dia
step.4.body=Use a sua voz natural, baixe o volume e deixe pausas ao virar a página. Não é preciso representar todas as personagens. Um ritmo regular transforma a história numa ponte para a noite.
step.5.title=Convide à proximidade, não a um teste
step.5.body=Basta uma pergunta suave: «O que achas que acontece agora?» ou «De que parte gostaste?» Se a criança já está sonolenta, não verifique quanto compreendeu.
step.6.title=Termine com a mesma frase
step.6.body=Feche o livro, diga que o tempo da história acabou e use a frase de boa noite habitual. Um final previsível ajuda a não acrescentar mais três atividades depois da última página.
step.7.title=Prepare antes a solução para noites sem energia
step.7.body=Num dia tranquilo, grave uma história favorita ou uma mensagem da família. Quando estiver exausto, com dores de garganta ou longe, essa voz conhecida pode apoiar o ritual enquanto outro adulto de confiança fica presente.
quote.text=O ritual não precisa de ser longo. Precisa de ser familiar o suficiente para a criança saber o que vem a seguir.
quote.attribution=Princípio noturno Sleep2Story
