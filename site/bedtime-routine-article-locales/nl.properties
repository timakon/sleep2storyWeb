answer.title=Kies een kort, leeftijdsgericht verhaal, houd een paar vaste slaapsignalen aan en stop terwijl je kind nog rustig is.
answer.body=Lees zelf wanneer dat lukt. Op uitgeputte, hese of verre avonden kan een vertrouwde opname het ritueel herkenbaar houden zonder dat een ouder zich door het voorlezen heen hoeft te slepen.
