setup.kicker=Voor je kiest
setup.title=Kies voor het kind dat vanavond voor je zit
setup.lead=Een leeftijdsaanduiding is een beginpunt, geen regel. Een peuter wil misschien een week hetzelfde kartonboekje; een schoolkind liever een hoofdstuk, een grappige familieherinnering of een luisterverhaal dat morgen verdergaat.
setup.body=Let op drie dingen: hoeveel taal je kind ontspannen volgt, hoeveel energie er nog is en welk gevoel het einde achterlaat. Bewaar drukke avonturen voor eerder als ze het afschakelen moeilijker maken. Bekende verhaallijnen, zachte humor, herhaling en een duidelijk slot passen vaak beter bij bedtijd.
kit.1.title=Leeftijd en aandacht
kit.1.body=Kies voor jongere luisteraars minder personages en meer herhaling; voeg langere lijnen of hoofdstukken toe wanneer de aandacht groeit.
kit.2.title=Een flexibele lengte
kit.2.body=Begin met vijf tot tien rustige minuten en kijk naar je kind, niet naar de klok. Een kort verhaal dat prettig eindigt is genoeg.
kit.3.title=Het gevoel erna
kit.3.body=Kies een verhaal waarna de kamer rustiger, veiliger of aangenaam nieuwsgierig voelt, niet gespannen en klaar voor nieuwe actie.
steps.kicker=Het verloop van de avond
steps.title=Zeven stappen van een drukke avond naar vertrouwd welterusten
step.1.title=Begin met hetzelfde kleine signaal
step.1.body=Laat het verhaal volgen op een herhaalde handeling: tandenpoetsen, pyjama aan, gordijnen dicht of een knuffel kiezen. Dat signaal zegt dat het actieve deel van de dag stopt.
step.2.title=Bied twee geschikte keuzes
step.2.body=Een hele boekenkast maakt van bedtijd snel een onderhandeling. Kies twee titels die je echt wilt lezen. Bied op een heel vermoeide avond een korte favoriet en een eerder opgeslagen opname aan.
step.3.title=Dim het licht en leg felle schermen weg
step.3.body=Gebruik genoeg warm licht om prettig te lezen, maar haal video en eindeloos scrollen uit het ritueel. Komt de audio van een telefoon, start die dan en laat het scherm daarna met rust.
step.4.title=Lees iets langzamer dan overdag
step.4.body=Gebruik je gewone stem, praat wat zachter en laat ruimte bij het omslaan. Uitgebreide stemmetjes zijn niet nodig. Een gelijkmatig tempo maakt van het verhaal een brug naar de nacht.
step.5.title=Nodig uit tot contact, niet tot een toets
step.5.body=Eén zachte vraag is genoeg: ‘Wat denk je dat er nu gebeurt?’ of ‘Welk stukje vond je leuk?’ Dommelt je kind al, laat de woorden dan komen zonder begrip te controleren.
step.6.title=Eindig met dezelfde zin
step.6.body=Doe het boek dicht, zeg dat de verhaaltijd voorbij is en gebruik de vertrouwde welterustenzin. Een voorspelbaar einde voorkomt dat er na de laatste bladzijde nog drie activiteiten volgen.
step.7.title=Maak de energiezuinige reserve vooraf
step.7.body=Neem op een rustige dag een favoriet verhaal of familieboodschap op. Wanneer je uitgeput of hees bent of niet thuis bent, kan die bekende stem het ritueel dragen terwijl een andere vertrouwde volwassene aanwezig blijft.
quote.text=Het ritueel hoeft niet lang te zijn. Het moet vertrouwd genoeg zijn zodat het kind weet wat erna komt.
quote.attribution=Sleep2Story-principe voor de avond
