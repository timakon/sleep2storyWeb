problems.title=Bescherm de rust, niet een perfecte reeks
problem.1.question=Ik ben uitgeput of heb keelpijn
problem.1.answer=Kies het kortste bekende verhaal, vraag een andere vertrouwde volwassene of gebruik een eerdere opname. Blijf in de buurt als je kind je nodig heeft, maar forceer geen lange voordracht. Geef een pijnlijke stem rust en vraag medisch advies als je je zorgen maakt.
problem.2.question=Mijn kind vraagt elke avond hetzelfde verhaal
problem.2.answer=Herhaling is geen gebrek aan variatie. Bekende woorden laten een kind voorspellen, meedoen en ontspannen. Houd de favoriet en leg er af en toe één nieuwe optie naast zonder de oude weg te nemen.
problem.3.question=Verhalen maken mijn kind juist drukker
problem.3.answer=Lees levendige boeken eerder, kies ’s avonds een korter en voorspelbaarder verhaal en maak wat na de laatste bladzijde komt stiller. Bewaar luide stemmetjes voor overdag als ze de kamer steeds wakker maken.
problem.4.question=Het verhaal wordt opeens eng
problem.4.answer=Stop in plaats van koste wat kost door te lezen. Benoem wat eng voelde, herinner je kind eraan dat het bij jou veilig is en schakel over naar iets bekends. Bekijk het boek eventueel overdag opnieuw.
problem.5.question=Een reis of late avond onderbreekt de routine
problem.5.answer=Houd twee draagbare ankers: hetzelfde korte verhaal of dezelfde opname en dezelfde slotzin. Kamer en tijd mogen veranderen terwijl de volgorde herkenbaar blijft.
faq.title=Antwoorden voor een rustiger bedtijd
faq.1.question=Hoe lang moet een verhaaltje voor het slapengaan zijn?
faq.1.answer=Er is geen perfect aantal minuten. Vijf tot tien minuten is voor veel gezinnen een bruikbaar begin, maar aandacht en rust tellen meer dan de klok. Stop eerder of verdeel een lang verhaal over hoofdstukken.
faq.2.question=Zijn luisterverhalen goed voor het slapengaan?
faq.2.answer=Audio kan de routine goed aanvullen, vooral met een vertrouwde stem en een beschikbare volwassene. Het is een andere manier om een verhaal te delen, geen slaapbelofte en geen vervanging van alle live nabijheid.
faq.3.question=Mag je elke avond hetzelfde verhaal lezen?
faq.3.answer=Ja. Herhaling maakt meedoen makkelijker en de volgorde voorspelbaar. Voeg voorzichtig variatie toe door één bekend en één nieuw verhaal aan te bieden.
faq.4.question=Vanaf welke leeftijd kun je bedtijdverhalen lezen?
faq.4.answer=Je kunt al bij een baby beginnen met een paar rustige bladzijden, een rijmpje of een bekende stem. Pas woorden, beelden, lengte en gesprek aan wanneer taal en aandacht groeien.
