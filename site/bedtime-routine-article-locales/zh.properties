problems.title=守住平静，不必追求完美打卡
problem.1.question=我太累了，或嗓子疼
problem.1.answer=选最短、最熟悉的故事，请另一位值得信赖的成年人来读，或播放之前录好的故事。孩子需要你时可以陪在旁边，但不要勉强自己长时间朗读。让疼痛的嗓子休息；如果担心健康状况，请咨询医生。
problem.2.question=孩子每晚都要听同一个故事
problem.2.answer=反复听不等于缺少变化。熟悉的词句让孩子能预测、参与，也更容易放松。保留最爱的故事，偶尔在旁边放一个新选择，不必把旧故事拿走。
problem.3.question=故事反而让孩子更兴奋
problem.3.answer=把热闹的书放到更早的时段，睡前选更短、更容易预料的故事，最后一页之后的活动也放轻。如果夸张的角色表演总让房间热闹起来，就别把睡前阅读变成舞台剧。
problem.4.question=故事突然让孩子害怕
problem.4.answer=停下来，不必硬读到结尾。问问哪里让孩子害怕，告诉孩子此刻和你在一起是安全的，再换一个熟悉的故事。如果孩子愿意，可以白天再重读这本书。
problem.5.question=旅行或晚归打乱了流程
problem.5.answer=保留两个能带着走的固定环节：同一个短故事或录音，以及同一句结束语。房间和时间可以改变，顺序依然能让孩子觉得熟悉。
faq.title=让睡前更平静的几个答案
faq.1.question=睡前故事讲多久合适？
faq.1.answer=没有完美时长。对很多家庭来说，五到十分钟是实用的起点，但孩子的注意力和平静程度比钟表更重要。孩子已经安稳时可以提前结束；较长的故事可以分章讲。
faq.2.question=音频睡前故事对孩子好吗？
faq.2.answer=音频可以成为睡前习惯的一部分，尤其是声音熟悉、身边仍有成年人可陪伴的时候。把它看作分享故事的另一种方式，不要保证每个孩子听后都会睡着，也不要用它取代所有面对面的交流。
faq.3.question=每晚读同一个故事可以吗？
faq.3.answer=可以。重复让孩子更容易参与，也让整个过程变得可预期。想增加变化时，可以温和地提供一个熟悉选择和一个新选择。
faq.4.question=多大的孩子可以开始听睡前故事？
faq.4.answer=婴儿期就可以从几页平静的图画、儿歌或熟悉的声音开始。随着语言能力和注意力发展，再调整文字、图片、时长和互动方式。
