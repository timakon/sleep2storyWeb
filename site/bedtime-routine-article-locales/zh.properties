setup.kicker=挑选故事之前
setup.title=为今晚的孩子选故事
setup.lead=年龄标签只是参考，不是硬规定。幼儿可能想把一本结实的图画书连续听上一周；上学的孩子也许更喜欢一章故事、一段有趣的家庭回忆，或明晚接着听的音频故事。
setup.body=留意三件事：孩子能轻松听懂多少、此刻有多清醒，以及故事结束后留下什么感受。如果节奏快、声音热闹的冒险故事让孩子更难安静下来，就留到早些时候。睡前通常更适合熟悉的情节、温和的幽默、重复的句子和清楚的结尾。
kit.1.title=年龄与注意力
kit.1.body=年纪小的孩子可以听角色少、重复多的故事；随着注意力增长，再加入更长的情节或章节。
kit.2.title=弹性的时长
kit.2.body=先从五到十分钟的平静时光开始，跟着孩子的状态走，不必盯着钟表。一个结束得舒服的短故事就够了。
kit.3.title=听完后的心情
kit.3.body=选一个让房间变得更安静、孩子感觉更安心，或留下愉快好奇心的故事，避免紧张得睡意全无。
steps.kicker=晚间流程
steps.title=七步从忙碌的夜晚走向熟悉的晚安
step.1.title=从一个固定的小提示开始
step.1.body=让故事接在刷牙、换睡衣、拉窗帘或选一只毛绒玩具之后。这些重复的动作会提醒孩子：一天里忙碌的部分要结束了。
step.2.title=给孩子两个合适的选择
step.2.body=书太多，睡前容易变成一场讨价还价。挑两本你确实愿意读的，让孩子选。特别疲惫的夜晚，可以提供一本简短的最爱，和一段已经录好的故事音频。
step.3.title=调暗灯光，放下明亮的屏幕
step.3.body=保留足够舒适阅读的暖光，但别把刺激的视频和无止境的刷屏带进睡前流程。如果用手机播放音频，先点好播放，再把屏幕放到一边。
step.4.title=读得比白天聊天稍慢一点
step.4.body=保持自然的声音，音量轻一些，在翻页时稍作停顿。不需要夸张地扮演每个角色。稳定的节奏能让故事成为过渡，而不是又一轮热闹的娱乐。
step.5.title=邀请孩子交流，不要考问
step.5.body=一个轻柔的问题就够了，比如“你觉得接下来会怎样？”或“你喜欢哪一段？”如果孩子已经困了，让故事自然流过去，不必检查有没有听懂。
step.6.title=用同一句话说晚安
step.6.body=合上书，告诉孩子故事时间结束了，再说一句熟悉的晚安。可预期的结尾，有助于避免最后一页之后又添上三项活动。
step.7.title=在需要之前备好省力的方案
step.7.body=趁身体舒服、时间宽裕的时候，录一段喜欢的故事或家人的问候。等你累了、嗓子疼了，或人在远方时，熟悉的声音能帮忙延续这个习惯，同时让另一位成年人陪在孩子身边。
quote.text=睡前习惯不需要很长。只要足够熟悉，孩子就知道下一步是什么。
