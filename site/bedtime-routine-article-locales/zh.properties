sticker.line1=平静比
sticker.line2=完美重要
answer.title=选一个简短适龄的故事，保持几个固定的睡前提示；孩子已经安静下来时就可以停，不必为了“读完”而硬撑。
answer.body=能亲自读的时候，就陪孩子读。疲惫、嗓子不舒服或人在远方的夜晚，一段熟悉的录音也能让睡前习惯保持原来的感觉，而不必让家长勉强自己。
