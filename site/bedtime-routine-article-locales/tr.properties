setup.kicker=Seçmeden önce
setup.title=Bu akşam karşınızdaki çocuğa göre seçin
setup.lead=Yaş etiketi bir başlangıç noktasıdır, kesin kural değildir. Küçük bir çocuk bir hafta aynı karton kitabı isteyebilir; okul çağındaki çocuk ise bir bölüm, komik bir aile anısı ya da yarın devam edecek bir sesli masalı tercih edebilir.
setup.body=Üç şeye bakın: çocuk ne kadar dili zorlanmadan takip ediyor, ne kadar enerjisi kaldı ve final nasıl bir duygu bırakıyor? Hareketli maceralar sakinleşmeyi zorlaştırıyorsa onları daha erken saate alın. Uyku öncesinde tanıdık olaylar, yumuşak mizah, tekrarlar ve net bir son genellikle daha kolay bırakılır.
kit.1.title=Yaş ve dikkat
kit.1.body=Küçük dinleyiciler için daha az karakter ve daha çok tekrar seçin; dikkat arttıkça uzun olaylar ya da bölümler ekleyin.
kit.2.title=Esnek süre
kit.2.body=Beş-on sakin dakikayla başlayın ve saate değil çocuğa bakın. Güzel biten kısa bir masal yeterlidir.
kit.3.title=Masaldan sonra kalan duygu
kit.3.body=Odayı daha sakin, güvenli ya da tatlı bir merakla bırakan masalı seçin; gergin ve tamamen uyanık bırakanı değil.
steps.kicker=Akşamın akışı
steps.title=Yoğun akşamdan tanıdık “iyi geceler”e yedi adım
step.1.title=Aynı küçük işaretle başlayın
step.1.body=Masalın her zaman diş fırçalama, pijama giyme, perdeyi kapatma ya da uyku oyuncağını seçmeden sonra gelmesini sağlayın. Bu işaret günün hareketli kısmının bittiğini anlatır.
step.2.title=Uygun iki seçenek sunun
step.2.body=Çok fazla kitap yatma saatini pazarlığa çevirebilir. Gerçekten okumaya hazır olduğunuz iki masalı seçin. Çok yorgun bir akşamda kısa bir favoriyle önceden kaydedilmiş sesi seçenek yapın.
step.3.title=Işığı azaltın ve parlak ekranları kaldırın
step.3.body=Rahat okumaya yetecek sıcak ışık bırakın, ama video ve sonsuz kaydırmayı ritüelden çıkarın. Ses telefondan geliyorsa kaydı başlatın ve sonra ekranı bırakın.
step.4.title=Gündüz konuşmasından biraz daha yavaş okuyun
step.4.body=Doğal sesinizi kullanın, sesi biraz alçaltın ve sayfa geçişlerinde bekleyin. Her karakteri canlandırmanız gerekmez. Düzenli tempo masalı yeni bir gösteri değil, geceye köprü yapar.
step.5.title=Sınava değil bağ kurmaya çağırın
step.5.body=Tek bir yumuşak soru yeter: “Sence şimdi ne olacak?” ya da “En çok nereyi sevdin?” Çocuk uyukluyorsa ne kadar anladığını ölçmeden kelimelerin akmasına izin verin.
step.6.title=Aynı cümleyle bitirin
step.6.body=Kitabı kapatın, masal zamanının bittiğini söyleyin ve her zamanki iyi geceler cümlesini kullanın. Öngörülebilir son, son sayfadan sonra üç etkinlik daha eklenmesini önler.
step.7.title=Düşük enerjili planı önceden hazırlayın
step.7.body=Sakin bir günde sevilen bir masalı ya da aile mesajını kaydedin. Yorgun olduğunuzda, boğazınız ağrıdığında veya uzaktayken bu tanıdık ses rutini destekler; başka bir güvenilir yetişkin de çocuğun yanında kalır.
quote.text=Rutinin uzun olması gerekmez. Çocuğun sırada ne olduğunu bileceği kadar tanıdık olması gerekir.
