problems.title=Kusursuz seriyi değil sakinliği koruyun
problem.1.question=Çok yorgunum ya da boğazım ağrıyor
problem.1.answer=En kısa tanıdık masalı seçin, başka bir güvenilir yetişkinden rica edin ya da önceki kaydı kullanın. Çocuk ihtiyaç duyuyorsa yakında kalın, ancak uzun okumayı zorlamayın. Ağrıyan sesi dinlendirin ve endişeniz varsa tıbbi görüş alın.
problem.2.question=Çocuğum her gece aynı masalı istiyor
problem.2.answer=Tekrar çeşitlilik eksikliği değildir. Tanıdık kelimeler çocuğun tahmin etmesini, katılmasını ve rahatlamasını sağlar. Favoriyi koruyun ve zaman zaman yanına tek bir yeni seçenek koyun.
problem.3.question=Masallar çocuğu daha da hareketlendiriyor
problem.3.answer=Hareketli kitapları daha erken okuyun, akşam kısa ve öngörülebilir bir olay seçin ve son sayfadan sonrasını sessizleştirin. Karakter sesleri sürekli enerji yükseltiyorsa onları gündüze bırakın.
problem.4.question=Masal birden korkutucu oldu
problem.4.answer=Sonuna kadar gitmek yerine durun. Korkutan şeyi adlandırın, çocuğa yanınızda güvende olduğunu hatırlatın ve tanıdık bir şeye geçin. İsterse kitaba gündüz dönebilirsiniz.
problem.5.question=Seyahat ya da geç saat rutini bozdu
problem.5.answer=Taşınabilir iki dayanağı koruyun: aynı kısa masal ya da kayıt ve aynı kapanış cümlesi. Oda ve saat değişse de sıra tanıdık kalabilir.
faq.title=Daha sakin bir uyku saati için yanıtlar
faq.1.question=Uyku masalı ne kadar sürmeli?
faq.1.answer=Kusursuz bir sayı yoktur. Beş-on dakika birçok aile için iyi bir başlangıçtır, ancak dikkat ve sakinlik saatten önemlidir. Çocuk rahatladıysa erken bitirin ya da uzun masalı bölümlere ayırın.
faq.2.question=Sesli uyku masalları çocuklar için iyi mi?
faq.2.answer=Sesli içerik, özellikle tanıdık bir ses ve ulaşılabilir bir yetişkinle rutini iyi tamamlayabilir. Masalı paylaşmanın başka bir yoludur; uyku garantisi ya da bütün canlı yakınlığın yerine geçecek bir araç değildir.
faq.3.question=Her gece aynı masalı okumak uygun mu?
faq.3.answer=Evet. Tekrar, katılımı kolaylaştırır ve sırayı öngörülebilir yapar. Bir tanıdık ve bir yeni seçenek sunarak çeşitliliği yavaşça ekleyin.
faq.4.question=Uyku masallarına kaç yaşında başlanabilir?
faq.4.answer=Bebeklikten itibaren birkaç sakin sayfa, kısa bir tekerleme veya tanıdık bir sesle başlayabilirsiniz. Dil ve dikkat geliştikçe kelimeleri, görselleri, süreyi ve konuşmayı uyarlayın.
