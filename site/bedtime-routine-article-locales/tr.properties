answer.title=Yaşa uygun kısa bir masal seçin, birkaç tanıdık uyku işaretini koruyun ve çocuk hâlâ sakinken okumayı bitirin.
answer.body=Mümkün olduğunda canlı okuyun. Çok yorgun, sesiniz kısık ya da uzaktaysanız tanıdık bir kayıt, kendinizi zorlamadan rutinin aynı hissedilmesini sağlayabilir.
