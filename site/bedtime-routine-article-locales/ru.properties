answer.title=Выберите короткую сказку по возрасту, сохраните несколько привычных сигналов ко сну и завершите чтение, пока ребёнок ещё спокоен.
answer.body=Читайте сами, когда есть силы. Если вы сильно устали, охрипли или находитесь далеко, знакомая запись поможет сохранить узнаваемый ритуал без необходимости читать через силу.
