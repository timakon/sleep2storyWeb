setup.kicker=Перед выбором
setup.title=Выбирайте историю для сегодняшнего ребёнка
setup.lead=Возрастная маркировка — ориентир, а не строгая инструкция. Малыш может неделю просить одну картонную книжку, а школьник — главу повести, смешную семейную историю или аудиосказку с продолжением завтра.
setup.body=Оцените три вещи: насколько легко ребёнку следить за сюжетом, сколько у него осталось сил и с каким ощущением заканчивается история. Шумные приключения лучше перенести на более раннее время, если после них трудно успокоиться. Перед сном часто удобнее знакомый сюжет, мягкий юмор, повторы и ясный финал.
kit.1.title=Возраст и внимание
kit.1.body=Для младших слушателей выбирайте меньше героев и больше повторов; длинный сюжет и главы добавляйте по мере роста внимания.
kit.2.title=Гибкая длина
kit.2.body=Начните с пяти-десяти спокойных минут и смотрите на ребёнка, а не на часы. Короткой сказки с хорошим завершением достаточно.
kit.3.title=Ощущение после
kit.3.body=Подойдёт история, после которой в комнате становится тише, безопаснее или остаётся спокойное любопытство, а не напряжение.
steps.kicker=Ход вечера
steps.title=Семь шагов от суеты к знакомому «спокойной ночи»
step.1.title=Начните с одного и того же сигнала
step.1.body=Пусть сказка идёт после повторяемого действия: чистки зубов, пижамы, закрытых штор или выбора любимой игрушки. Такой сигнал показывает, что активная часть дня заканчивается.
step.2.title=Предложите две подходящие истории
step.2.body=Большая стопка книг превращает укладывание в переговоры. Выберите две сказки, которые действительно готовы прочитать, и отдайте выбор ребёнку. В очень уставший вечер предложите короткую любимую историю и заранее сохранённую запись.
step.3.title=Приглушите свет и уберите яркие экраны
step.3.body=Оставьте достаточно тёплого света для чтения, но исключите видео и бесконечную ленту. Если включаете аудио с телефона, запустите запись заранее и больше не взаимодействуйте с экраном.
step.4.title=Читайте немного медленнее обычного разговора
step.4.body=Говорите своим голосом, чуть тише и с паузами на перелистывание. Сложная актёрская игра не нужна. Ровный темп помогает сказке стать переходом ко сну, а не новым развлечением.
step.5.title=Разговаривайте, но не устраивайте проверку
step.5.body=Достаточно одного мягкого вопроса: «Как думаешь, что будет дальше?» или «Что тебе понравилось?» Если ребёнок уже засыпает, не проверяйте, насколько внимательно он слушал.
step.6.title=Заканчивайте одной и той же фразой
step.6.body=Закройте книгу, скажите, что время сказки закончилось, и пожелайте спокойной ночи привычными словами. Предсказуемый финал помогает не добавлять ещё три занятия после последней страницы.
step.7.title=Подготовьте запасной вариант заранее
step.7.body=В спокойный день запишите любимую сказку или семейное пожелание. Когда вы очень устали, болит горло или приходится быть далеко, знакомый голос поддержит ритуал, пока рядом остаётся другой взрослый.
quote.text=Ритуал не обязан быть долгим. Он должен быть достаточно знакомым, чтобы ребёнок понимал, что будет дальше.
quote.attribution=Принцип вечернего ритуала Sleep2Story
