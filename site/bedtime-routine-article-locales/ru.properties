problems.title=Сохраняйте спокойствие, а не идеальную серию
problem.1.question=Я очень устал или у меня болит горло
problem.1.answer=Выберите самую короткую знакомую сказку, попросите другого близкого взрослого прочитать её или включите запись, сделанную заранее. Оставайтесь рядом, если это нужно ребёнку, но не заставляйте себя читать долго через силу. Дайте голосу отдохнуть и обратитесь к врачу, если состояние беспокоит.
problem.2.question=Ребёнок каждый вечер просит одну и ту же сказку
problem.2.answer=Повторы — не отсутствие развития. Знакомые слова позволяют предугадывать, участвовать и расслабляться. Оставьте любимую сказку и иногда кладите рядом один новый вариант, не убирая старый.
problem.3.question=После сказок ребёнок только сильнее возбуждается
problem.3.answer=Перенесите динамичные книги на более раннее время, выберите короткий предсказуемый сюжет и сделайте всё после последней страницы тише. Если громкая игра голосами мешает успокоиться, оставьте её для дня.
problem.4.question=Сказка неожиданно напугала ребёнка
problem.4.answer=Остановитесь, а не дочитывайте любой ценой. Назовите то, что показалось страшным, напомните ребёнку, что рядом безопасный взрослый, и переключитесь на знакомую историю. К книге можно вернуться днём, если он захочет.
problem.5.question=Поездка или поздний вечер сбили режим
problem.5.answer=Сохраните два переносных элемента: одну и ту же короткую сказку или запись и привычную финальную фразу. Комната и время могут измениться, а порядок останется узнаваемым.
faq.title=Что ещё важно знать перед сном
faq.1.question=Сколько должна длиться сказка на ночь?
faq.1.answer=Идеального числа нет. Для многих семей удобная отправная точка — пять-десять минут, но спокойствие и внимание важнее часов. Закончите раньше, если ребёнок уже расслабился, а длинную историю разделите на главы.
faq.2.question=Полезно ли детям слушать аудиосказки перед сном?
faq.2.answer=Аудио может быть удобной частью ритуала, особенно когда голос знаком, а взрослый остаётся доступен. Это ещё один способ разделить историю, а не обещание мгновенного сна и не полная замена живого общения.
faq.3.question=Можно ли читать одну и ту же сказку каждый вечер?
faq.3.answer=Да. Повторение помогает ребёнку участвовать и делает последовательность предсказуемой. Разнообразие можно добавлять мягко: предлагать одну знакомую и одну новую историю.
faq.4.question=С какого возраста начинать сказки перед сном?
faq.4.answer=Начать можно уже в младенчестве с пары спокойных страниц, потешки или просто знакомого голоса. По мере развития речи и внимания меняйте слова, картинки, длину и степень участия.
