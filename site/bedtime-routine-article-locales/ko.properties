hero.line2=잠자리 이야기,
hero.line3=하루를 차분하게 마무리하는 시간
hero.dek=가장 좋은 잠자리 이야기는 제일 길거나 교육적인 이야기가 아닙니다. 오늘 밤 우리 아이에게 맞고 내일도 이어 갈 수 있는 저녁 습관에 자연스럽게 들어맞는 이야기입니다.
byline.read_time=읽는 시간 9분
byline.date=2026년 9월 4일
field.label=오늘 밤의 리듬
field.line1=짧은 이야기 하나.
field.line2=익숙한 순서 하나.
field.line3=부담은 조금 덜고.
sticker.line1=완벽함보다
sticker.line2=편안함
answer.title=아이 나이에 맞는 짧은 이야기를 고르고, 잠자리에 드는 순서 몇 가지만 일정하게 유지하세요. 끝을 꼭 채우려고 오래 읽기보다 아이가 편안해졌을 때 멈추는 게 좋습니다.
answer.body=가능하면 직접 읽어 주세요. 너무 지쳤거나 목이 쉬었거나 멀리 있는 밤에는 익숙한 목소리의 녹음이 부모에게 무리를 주지 않으면서도 잠자리 습관을 이어 가는 데 도움이 될 수 있습니다.
toc.1=알맞은 이야기 고르기
toc.2=일곱 단계의 잠자리 습관
toc.3=오늘 밤 점검표
toc.4=잠자리에서 생기는 흔한 어려움
toc.6=부모들이 묻는 질문
setup.kicker=이야기를 고르기 전에
setup.title=오늘 밤의 아이에게 맞춰 고르세요
setup.lead=권장 연령은 출발점이지 규칙은 아닙니다. 어린아이는 일주일 내내 같은 그림책 한 권을 원할 수 있고, 초등학생은 한 장짜리 이야기나 재미있는 가족 추억, 내일 이어 들을 수 있는 오디오 이야기를 더 좋아할 수 있습니다.
setup.body=세 가지를 살펴보세요. 아이가 편하게 따라갈 수 있는 말의 양, 지금 얼마나 또렷이 깨어 있는지, 이야기가 끝난 뒤 어떤 기분이 남는지입니다. 빠르고 시끄러운 모험 이야기에 아이가 들뜬다면 좀 더 이른 시간에 읽으세요. 잠자리에는 익숙한 전개와 부드러운 유머, 반복, 분명한 결말이 있는 이야기가 편안할 때가 많습니다.
kit.1.title=나이와 집중력
kit.1.body=어린아이에게는 등장인물을 줄이고 반복을 늘리세요. 집중하는 시간이 길어지면 더 긴 줄거리나 장별 이야기를 더해 보세요.
kit.2.title=유연한 길이
kit.2.body=차분한 5~10분으로 시작하고 시계보다 아이의 반응을 따르세요. 짧지만 잘 끝나는 이야기면 충분합니다.
kit.3.title=끝나고 남는 느낌
kit.3.body=긴장해서 잠이 달아나는 이야기보다 방 안이 더 조용하고 안전하게 느껴지거나 기분 좋게 궁금증이 남는 이야기를 고르세요.
steps.kicker=저녁 시간
steps.title=분주한 저녁부터 익숙한 ‘잘 자’까지, 일곱 단계
step.1.title=매일 같은 작은 신호로 시작하세요
step.1.body=양치하기, 잠옷 입기, 커튼 닫기, 인형 고르기처럼 반복할 수 있는 행동 다음에 이야기를 읽으세요. 이런 신호는 활발한 하루가 끝나 간다는 것을 몸에 알려 줍니다.
step.2.title=알맞은 선택지 두 개를 주세요
step.2.body=책이 너무 많으면 잠자리가 끝없는 협상이 됩니다. 실제로 읽어 줄 마음이 있는 책 두 권을 골라 아이가 선택하게 하세요. 몹시 지친 밤에는 짧은 애독서와 저장해 둔 오디오 중에서 고르게 해도 좋습니다.
step.3.title=조명을 낮추고 밝은 화면은 치우세요
step.3.body=읽기 편할 만큼 따뜻한 빛은 남기되, 자극적인 영상이나 끝없는 화면 넘기기는 잠자리에서 빼세요. 휴대전화로 오디오를 틀었다면 먼저 재생을 시작한 뒤 화면은 더 보지 않아도 됩니다.
step.4.title=낮에 대화할 때보다 조금 천천히 읽으세요
step.4.body=평소 목소리를 유지하되 조금 부드럽게 말하고 페이지를 넘길 때 쉬어 가세요. 등장인물마다 과하게 연기할 필요는 없습니다. 일정한 속도는 이야기가 또 다른 자극이 아니라 잠자리로 넘어가는 다리처럼 느껴지게 합니다.
step.5.title=문제보다 대화를 건네세요
step.5.body=“다음엔 무슨 일이 일어날까?” 또는 “어느 부분이 좋았어?”처럼 부드러운 질문 하나면 충분합니다. 아이가 이미 졸려 한다면 내용을 이해했는지 확인하지 말고 이야기만 흘러가게 두세요.
step.6.title=늘 같은 끝인사로 마무리하세요
step.6.body=책을 덮고 이야기 시간이 끝났다고 말한 뒤 익숙한 ‘잘 자’ 한마디를 건네세요. 끝이 예측 가능하면 마지막 장 뒤에 활동을 세 가지 더 늘리지 않아도 됩니다.
step.7.title=기운이 없을 때 쓸 방법을 미리 준비하세요
step.7.body=몸이 좋고 여유로운 날 좋아하는 이야기나 가족의 메시지를 녹음해 두세요. 지쳤거나 목이 아프거나 집을 떠나 있는 밤에는 다른 어른이 아이 곁에 있으면서, 그 익숙한 목소리로 습관을 이어 갈 수 있습니다.
quote.text=잠자리 습관이 길 필요는 없습니다. 아이가 다음에 무엇이 올지 알 만큼 익숙하면 됩니다.
quote.attribution=Sleep2Story의 잠자리 원칙
checklist.kicker=평범한 저녁을 위해
checklist.title=2분 잠자리 이야기 점검표
checklist.1=읽기 좋은 이야기 한두 개가 준비되어 있다
checklist.2=오늘 밤 아이의 에너지 수준에 맞는다
checklist.3=밝은 영상과 알림은 치워 두었다
checklist.4=읽는 자리가 편안하고 안전하다
checklist.5=어른에게도 무리 없는 길이로 잡았다
checklist.6=직접 읽거나 대신 들려줄 녹음을 준비했다
checklist.7=마지막 ‘잘 자’ 인사는 늘 같다
checklist.8=편안해졌다면 일찍 멈춰도 된다
problems.title=완벽한 기록보다 편안한 밤을 지키세요
problem.1.question=너무 지쳤거나 목이 아파요
problem.1.answer=가장 짧고 익숙한 이야기를 고르거나 믿을 수 있는 다른 어른에게 부탁하세요. 미리 녹음한 이야기를 들려줘도 됩니다. 아이가 곁에 있어 주길 원한다면 가까이 있되 긴 낭독을 억지로 하지는 마세요. 아픈 목은 쉬게 하고 걱정되는 증상이 있으면 의료진과 상담하세요.
problem.2.question=아이가 매일 같은 이야기만 찾습니다
problem.2.answer=반복해서 읽는다고 다양성이 부족한 건 아닙니다. 익숙한 말은 아이가 다음 내용을 예상하고 따라 하며 편안해지는 데 도움이 됩니다. 좋아하는 이야기는 남겨 두고 가끔 새로운 선택지를 하나 곁에 놓아 보세요.
problem.3.question=이야기를 들으면 아이가 더 신이 나요
problem.3.answer=활기찬 책은 좀 더 이른 시간에 읽고, 짧고 예상하기 쉬운 이야기를 고르세요. 마지막 장 뒤의 분위기도 차분하게 이어 가세요. 큰 소리로 등장인물을 연기하면 아이가 늘 더 깬다면 잠자리에서는 피하는 편이 좋습니다.
problem.4.question=갑자기 이야기가 무섭게 느껴집니다
problem.4.answer=끝까지 밀어붙이지 말고 멈추세요. 무엇이 무서웠는지 말로 짚고 아이가 곁에서 안전하다고 알려 준 뒤 익숙한 이야기로 바꾸세요. 아이가 원한다면 낮에 그 책을 다시 볼 수 있습니다.
problem.5.question=여행이나 늦은 귀가로 습관이 깨져요
problem.5.answer=어디서나 쓸 수 있는 두 가지를 챙기세요. 늘 듣던 짧은 이야기나 녹음, 그리고 같은 끝인사입니다. 방과 시간은 바뀌어도 순서가 익숙하면 됩니다.
faq.title=더 편안한 잠자리를 위한 답변
faq.1.question=잠자리 이야기는 얼마나 길어야 하나요?
faq.1.answer=정답은 없습니다. 많은 가정에서 5~10분이 좋은 출발점이지만, 시계보다 아이의 집중력과 편안함이 중요합니다. 아이가 안정되면 일찍 마치고, 긴 이야기는 장을 나누어 읽으세요.
faq.2.question=오디오 잠자리 이야기가 아이에게 좋은가요?
faq.2.answer=익숙한 목소리이고 어른이 필요할 때 곁에 있다면 오디오도 유용한 잠자리 습관이 될 수 있습니다. 모든 아이를 잠들게 하는 방법이나 직접 함께하는 시간을 완전히 대신하는 수단으로 생각하지 말고, 이야기를 나누는 또 하나의 방법으로 보세요.
faq.3.question=매일 같은 이야기를 읽어도 괜찮나요?
faq.3.answer=네. 반복은 아이가 이야기에 참여하고 다음 순서를 예측하는 데 도움이 됩니다. 익숙한 이야기 하나와 새 이야기 하나를 함께 제안하며 천천히 변화를 줄 수 있습니다.
faq.4.question=몇 살부터 잠자리 이야기를 들려줄 수 있나요?
faq.4.answer=아기 때부터 차분한 그림책 몇 장이나 운율 있는 말, 익숙한 목소리로 시작할 수 있습니다. 언어와 집중력이 자라면 말과 그림, 길이와 상호작용의 정도를 조절하세요.
