setup.kicker=قبل اختيار الحكاية
setup.title=اختر لطفلك كما هو هذه الليلة
setup.lead=التصنيفات العمرية نقطة بداية، وليست قاعدة. قد يطلب طفل صغير كتاب صور واحدًا طوال أسبوع، بينما يفضّل طفل في سن المدرسة فصلًا من كتاب أو ذكرى عائلية طريفة أو حكاية صوتية يكملها غدًا.
setup.body=انتبه إلى ثلاثة أمور: مقدار اللغة الذي يفهمه طفلك براحة، ومدى يقظته، والشعور الذي تتركه الحكاية. احتفظ بالمغامرات الصاخبة والسريعة لوقت أبكر إذا كانت تصعّب عليه الهدوء. عند النوم يسهل غالبًا ترك حبكة مألوفة ودعابة لطيفة وتكرار مريح ونهاية واضحة.
kit.1.title=العمر والانتباه
kit.1.body=استخدم شخصيات أقل وتكرارًا أكثر للصغار، وانتقل إلى حبكات أو فصول أطول مع نمو قدرتهم على التركيز.
kit.2.title=مدة مرنة
kit.2.body=ابدأ بخمس إلى عشر دقائق هادئة واتبع إيقاع طفلك لا الساعة. تكفي حكاية قصيرة تنتهي على خير.
kit.3.title=الشعور بعد النهاية
kit.3.body=اختر ما يجعل الغرفة أهدأ ويمنح شعورًا بالأمان أو فضولًا لطيفًا، لا توترًا ويقظةً كاملة.
steps.kicker=المساء
steps.title=سبع خطوات من مساء مزدحم إلى ليلة مألوفة
step.1.title=ابدأ بالإشارة الصغيرة نفسها
step.1.body=اجعل الحكاية تأتي بعد عمل يتكرر، مثل غسل الأسنان أو ارتداء ملابس النوم أو إغلاق الستائر أو اختيار لعبة محبّبة. تُخبر هذه الإشارة الطفل بأن وقت النشاط يقترب من نهايته.
step.2.title=قدّم خيارين مناسبين
step.2.body=كثرة الكتب قد تحوّل وقت النوم إلى مفاوضة. اختر كتابين لا تمانع قراءتهما ودع طفلك يقرر. وفي الليالي المتعبة جدًا، اعرض حكاية قصيرة مفضّلة وتسجيلًا صوتيًا محفوظًا.
step.3.title=خفّف الإضاءة وأبعد الشاشات الساطعة
step.3.body=استخدم ضوءًا دافئًا يكفي للقراءة براحة، وأخرج مقاطع الفيديو المحفّزة والتصفّح الطويل من الروتين. إذا شغّلت تسجيلًا من الهاتف، فابدأ تشغيله ثم اترك الشاشة.
step.4.title=اقرأ أبطأ قليلًا من حديث النهار
step.4.body=احتفظ بصوتك الطبيعي، وخفّض شدّته، واترك وقفة عند تقليب الصفحة. لست بحاجة إلى تمثيل شخصيات معقّد. الإيقاع الثابت يجعل الحكاية جسرًا إلى النوم، لا دفعة جديدة من الإثارة.
step.5.title=ادعُ إلى القرب، لا إلى اختبار
step.5.body=يكفي سؤال لطيف واحد: «ماذا تظن سيحدث؟» أو «أي جزء أحببت؟». وإذا كان طفلك يغفو بالفعل، فدع الكلمات تمضي من غير اختبار فهمه لها.
step.6.title=اختم بالعبارة نفسها
step.6.body=أغلق الكتاب، وقل إن وقت الحكاية انتهى، واستخدم جملة تصبح على خير التي اعتادها الطفل. النهاية المتوقّعة تساعد على عدم إضافة ثلاث أنشطة جديدة بعد الصفحة الأخيرة.
step.7.title=حضّر بديلًا للأيام المتعبة مسبقًا
step.7.body=سجّل حكاية مفضّلة أو رسالة عائلية في يوم ترتاح فيه ويكون صوتك جيدًا. عندما تُرهَق أو يؤلمك حلقك أو تكون بعيدًا، يساعد الصوت المألوف على استمرار الروتين مع بقاء شخص بالغ آخر إلى جانب الطفل.
quote.text=لا يحتاج الطقس المسائي إلى وقت طويل؛ يكفي أن يكون مألوفًا حتى يعرف الطفل ما سيأتي بعده.
