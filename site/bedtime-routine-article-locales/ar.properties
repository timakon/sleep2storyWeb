problems.title=احفظ الهدوء، لا سلسلة ليالٍ مثالية
problem.1.question=أنا مرهق أو يؤلمني حلقي
problem.1.answer=اختر أقصر حكاية مألوفة، أو اطلب من شخص بالغ موثوق أن يقرأ، أو شغّل تسجيلًا أعددته سابقًا. ابقَ قريبًا إذا احتاج إليك طفلك، لكن لا تُجبر نفسك على قراءة طويلة. أرح صوتك المتألم واستشر مختصًا إذا كنت قلقًا.
problem.2.question=يطلب طفلي الحكاية نفسها كل ليلة
problem.2.answer=التكرار ليس نقصًا في التنويع. الكلمات المألوفة تساعد الطفل على التوقّع والمشاركة والاسترخاء. احتفظ بحكايته المفضّلة، وأضف بجانبها خيارًا جديدًا من حين لآخر من غير إزالتها.
problem.3.question=تجعل الحكايات طفلي أكثر حماسًا
problem.3.answer=انقل الكتب الحماسية إلى وقت أبكر، واختر حكاية أقصر وأسهل توقّعًا، واجعل ما بعد الصفحة الأخيرة أكثر هدوءًا. تجنّب تحويل القراءة إلى لعب صاخب بالأصوات إذا كانت تُبقيه مستيقظًا.
problem.4.question=أصبحت الحكاية مخيفة فجأة
problem.4.answer=توقّف بدلًا من دفع الطفل إلى سماع النهاية. سمِّ ما أخافه، وطمئنه إلى أنه آمن معك، وانتقل إلى شيء مألوف. يمكن العودة إلى الكتاب نهارًا إذا أراد.
problem.5.question=يفسد السفر أو التأخر مساءً الروتين
problem.5.answer=احتفظ بعنصرين يسهل حملهما: الحكاية القصيرة أو التسجيل نفسه، وعبارة الختام نفسها. قد يتغيّر المكان والوقت، لكن يبقى ترتيب الأحداث مألوفًا.
faq.title=إجابات تساعد على نوم أهدأ
faq.1.question=كم ينبغي أن تستغرق حكاية ما قبل النوم؟
faq.1.answer=لا يوجد رقم مثالي. خمس إلى عشر دقائق نقطة بداية مناسبة لعائلات كثيرة، لكن انتباه الطفل وهدوءه أهم من الساعة. اختم مبكرًا إذا استقرّ؛ وقسّم الحكاية الطويلة إلى فصول.
faq.2.question=هل الحكايات الصوتية قبل النوم مفيدة للأطفال؟
faq.2.answer=يمكن للصوت أن يدعم الروتين، خاصةً عندما يكون الصوت مألوفًا ويظل شخص بالغ متاحًا للطفل. انظر إليه على أنه طريقة أخرى لمشاركة الحكاية، لا وعدًا بأن ينام كل طفل ولا بديلًا عن كل تواصل مباشر.
faq.3.question=هل لا بأس بقراءة الحكاية نفسها كل ليلة؟
faq.3.answer=نعم. يساعد التكرار على المشاركة ويجعل تسلسل المساء متوقّعًا. يمكنك إضافة التنويع برفق بعرض خيار مألوف وآخر جديد.
faq.4.question=من أي عمر يمكن البدء بحكايات ما قبل النوم؟
faq.4.answer=يمكنك البدء من مرحلة الرضاعة بصفحات هادئة قليلة أو أهزوجة أو صوت مألوف. ومع نمو اللغة والانتباه، عدّل الكلمات والصور والمدة وطريقة التفاعل.
