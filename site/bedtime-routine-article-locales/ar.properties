answer.title=اختر حكاية قصيرة مناسبة للعمر، وثبّت إشارات النوم البسيطة، وتوقّف حين يهدأ طفلك بدلًا من إطالة القراءة بحثًا عن نهاية مثالية.
answer.body=اقرأ له مباشرةً حين تستطيع. وفي الليالي التي تكون فيها مرهقًا أو مبحوحًا أو بعيدًا، يمكن لتسجيل بصوت مألوف أن يحافظ على شكل الطقس العائلي من دون أن يضطر أحد إلى القراءة رغم تعبه.
