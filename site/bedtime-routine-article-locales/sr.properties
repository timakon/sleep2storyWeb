setup.kicker=Pre izbora
setup.title=Birajte za dete kakvo je baš večeras
setup.lead=Oznaka uzrasta je smernica, a ne strogo pravilo. Malo dete može nedelju dana tražiti istu slikovnicu, dok će školarac želeti poglavlje, smešnu porodičnu uspomenu ili audio-priču koja se nastavlja sutra.
setup.body=Posmatrajte tri stvari: koliko jezika dete lako prati, koliko energije još ima i kakvo osećanje priča ostavlja. Bučne avanture pomerite ranije ako otežavaju smirivanje. Pred spavanje često bolje prolaze poznat zaplet, blag humor, ponavljanje i jasan završetak.
kit.1.title=Uzrast i pažnja
kit.1.body=Za mlađe slušaoce birajte manje likova i više ponavljanja; duže zaplete i poglavlja uvodite kako pažnja raste.
kit.2.title=Prilagodljiva dužina
kit.2.body=Počnite sa pet do deset mirnih minuta i pratite dete, a ne sat. Kratka priča koja se lepo završi sasvim je dovoljna.
kit.3.title=Osećaj posle priče
kit.3.body=Birajte priču posle koje soba deluje tiše i sigurnije ili ostaje prijatna radoznalost umesto napetosti.
steps.kicker=Tok večeri
steps.title=Sedam koraka od užurbanog dana do poznatog „laku noć”
step.1.title=Počnite istim malim znakom
step.1.body=Neka priča uvek dođe posle pranja zuba, oblačenja pidžame, navlačenja zavesa ili izbora plišane igračke. Taj znak govori da se aktivni deo dana završava.
step.2.title=Ponudite dve odgovarajuće priče
step.2.body=Veliki izbor lako pretvara odlazak u krevet u pregovore. Izaberite dve priče koje zaista možete da pročitate. Kada ste veoma umorni, ponudite kratku omiljenu priču i ranije sačuvan snimak.
step.3.title=Prigušite svetlo i sklonite svetle ekrane
step.3.body=Ostavite dovoljno toplog svetla za čitanje, ali uklonite video i beskrajno listanje. Ako puštate zvuk sa telefona, pokrenite ga i zatim više ne dirajte ekran.
step.4.title=Čitajte malo sporije nego tokom dana
step.4.body=Koristite svoj prirodan glas, tiši ton i pauze pri okretanju strane. Složena gluma nije potrebna. Ujednačen tempo pomaže da priča bude prelaz ka snu, a ne nova predstava.
step.5.title=Pozovite na bliskost, ne na ispitivanje
step.5.body=Dovoljno je jedno blago pitanje: „Šta misliš da sledi?” ili „Koji deo ti se dopao?” Ako dete već tone u san, ne proveravajte koliko je zapamtilo.
step.6.title=Završite istom rečenicom
step.6.body=Zatvorite knjigu, recite da je vreme za priču gotovo i upotrebite poznatu želju za laku noć. Predvidiv kraj sprečava da posle poslednje strane dodate još tri aktivnosti.
step.7.title=Pripremite rezervu pre nego što zatreba
step.7.body=Mirnog dana snimite omiljenu priču ili porodičnu poruku. Kada ste iscrpljeni, boli vas grlo ili ste odsutni, poznat glas može održati rutinu dok druga bliska odrasla osoba ostaje pored deteta.
quote.text=Rutina ne mora da bude duga. Treba da bude dovoljno poznata da dete zna šta dolazi sledeće.
quote.attribution=Sleep2Story princip za mirno veče
