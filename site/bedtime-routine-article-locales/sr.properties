problems.title=Čuvajte mir, a ne savršen niz
problem.1.question=Iscrpljen sam ili me boli grlo
problem.1.answer=Izaberite najkraću poznatu priču, zamolite drugu blisku odraslu osobu ili pustite raniji snimak. Ostanite blizu ako je detetu potrebno, ali ne terajte sebe na dugo čitanje. Odmorite bolan glas i potražite savet lekara ako ste zabrinuti.
problem.2.question=Dete svake večeri traži istu priču
problem.2.answer=Ponavljanje nije nedostatak raznovrsnosti. Poznate reči omogućavaju detetu da predviđa, učestvuje i opusti se. Zadržite omiljenu priču i povremeno pored nje ponudite jednu novu.
problem.3.question=Priča još više razbudi dete
problem.3.answer=Dinamične knjige čitajte ranije, a uveče birajte kraći i predvidiviji zaplet. Utišajte sve posle poslednje strane; glasne uloge ostavite za dan ako redovno podižu energiju.
problem.4.question=Priča je odjednom postala strašna
problem.4.answer=Zaustavite se umesto da insistirate na kraju. Imenujte ono što je uplašilo dete, podsetite ga da je bezbedno uz vas i pređite na nešto poznato. Knjizi se možete vratiti po danu.
problem.5.question=Putovanje ili kasno veče poremetili su rutinu
problem.5.answer=Sačuvajte dva prenosiva oslonca: istu kratku priču ili snimak i istu završnu rečenicu. Soba i vreme mogu da se promene, ali redosled ostaje prepoznatljiv.
faq.title=Odgovori za mirniji odlazak na spavanje
faq.1.question=Koliko treba da traje priča za laku noć?
faq.1.answer=Ne postoji savršen broj. Pet do deset minuta je dobar početak za mnoge porodice, ali pažnja i mir su važniji od sata. Završite ranije ili podelite dužu priču na poglavlja.
faq.2.question=Da li su audio-priče dobre pred spavanje?
faq.2.answer=Audio može korisno dopuniti rutinu, naročito uz poznat glas i dostupnu odraslu osobu. To je još jedan način deljenja priče, a ne obećanje da će dete zaspati niti zamena za svu bliskost uživo.
faq.3.question=Da li je u redu čitati istu priču svake večeri?
faq.3.answer=Da. Ponavljanje olakšava učešće i čini redosled predvidivim. Raznovrsnost uvodite nežno nudeći jednu poznatu i jednu novu priču.
faq.4.question=Od kog uzrasta počinju priče pred spavanje?
faq.4.answer=Možete početi već u najranijem uzrastu sa nekoliko mirnih strana, kratkom rimom ili poznatim glasom. Kako rastu govor i pažnja, prilagođavajte reči, slike, dužinu i razgovor.
