answer.title=Izaberite kratku priču prema uzrastu, zadržite nekoliko poznatih znakova za spavanje i završite dok je dete još mirno.
answer.body=Čitajte uživo kada možete. Kada ste iscrpljeni, promukli ili daleko, poznat snimak može sačuvati rutinu bez čitanja preko sopstvenih granica.
