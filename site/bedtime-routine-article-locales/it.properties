setup.kicker=Prima di scegliere
setup.title=Scegli per il bambino che hai davanti stasera
setup.lead=L’indicazione dell’età è un orientamento, non una regola. Un bimbo piccolo può chiedere lo stesso libro cartonato per una settimana; uno più grande può preferire un capitolo, un ricordo di famiglia divertente o una storia audio da continuare domani.
setup.body=Osserva tre cose: quante parole riesce a seguire senza fatica, quanta energia gli resta e quale emozione lascia il finale. Tieni le avventure movimentate per un momento precedente se rendono difficile calmarsi. Prima di dormire funzionano spesso trame note, umorismo delicato, ripetizioni e una conclusione chiara.
kit.1.title=Età e attenzione
kit.1.body=Per i più piccoli scegli pochi personaggi e più ripetizioni; aggiungi trame lunghe o capitoli quando cresce l’attenzione.
kit.2.title=Una durata flessibile
kit.2.body=Inizia con cinque-dieci minuti tranquilli e guarda il bambino, non l’orologio. Una storia breve che finisce bene è sufficiente.
kit.3.title=La sensazione che resta
kit.3.body=Scegli una storia che lasci la stanza più calma, sicura o piacevolmente curiosa, non tesa e pronta a ripartire.
steps.kicker=Il corso della sera
steps.title=Sette passi dalla confusione al solito «buonanotte»
step.1.title=Inizia con lo stesso piccolo segnale
step.1.body=Fai seguire la storia a un gesto ripetuto: lavare i denti, mettere il pigiama, chiudere le tende o scegliere il pupazzo. Quel segnale dice che la parte attiva della giornata sta finendo.
step.2.title=Offri due scelte adatte
step.2.body=Troppi libri trasformano facilmente il letto in una trattativa. Seleziona due titoli che sei davvero disposto a leggere. Nelle sere più stanche, proponi un breve preferito e una registrazione già salvata.
step.3.title=Abbassa la luce e metti via gli schermi luminosi
step.3.body=Lascia una luce calda sufficiente per leggere, ma togli dal rituale video e scorrimento infinito. Se l’audio parte dal telefono, avvialo e poi lascia stare lo schermo.
step.4.title=Leggi un po’ più lentamente del solito
step.4.body=Usa la tua voce naturale, abbassa il volume e lascia una pausa quando giri pagina. Non serve recitare ogni personaggio. Un ritmo regolare rende la storia un ponte verso il sonno.
step.5.title=Invita alla vicinanza, non a un interrogatorio
step.5.body=Basta una domanda gentile: «Secondo te cosa succede adesso?» oppure «Quale parte ti è piaciuta?» Se il bambino sta già sonnecchiando, non verificare quanto ha capito.
step.6.title=Concludi con la stessa frase
step.6.body=Chiudi il libro, dì che il tempo della storia è finito e usa il solito augurio della buonanotte. Una fine prevedibile evita di aggiungere tre nuove attività dopo l’ultima pagina.
step.7.title=Prepara prima il piano per le sere senza energie
step.7.body=In una giornata tranquilla, registra una storia preferita o un messaggio di famiglia. Quando sei esausto, hai mal di gola o sei lontano, quella voce familiare può sostenere il rituale mentre un altro adulto di fiducia resta presente.
quote.text=Il rituale non deve essere lungo. Deve essere abbastanza familiare perché il bambino sappia cosa viene dopo.
quote.attribution=Principio della sera Sleep2Story
checklist.kicker=Per una sera normale
checklist.title=La lista di due minuti prima della storia
checklist.1=Una o due storie adatte sono pronte
checklist.2=La storia corrisponde all’energia di stasera
checklist.3=Video luminosi e notifiche sono lontani
checklist.4=L’angolo di lettura è comodo e sicuro
checklist.5=La durata è realistica anche per l’adulto
checklist.6=La lettura o la riserva audio è pronta
checklist.7=La frase finale resta quella familiare
checklist.8=Si può finire prima quando è arrivata la calma
problems.title=Proteggi la calma, non una serie perfetta
problem.1.question=Sono esausto o mi fa male la gola
problem.1.answer=Scegli la storia familiare più breve, chiedi a un altro adulto vicino o usa una registrazione precedente. Resta disponibile se il bambino ne ha bisogno, ma non forzare una lunga lettura. Riposa una voce dolorante e senti un medico se la situazione ti preoccupa.
problem.2.question=Mio figlio chiede la stessa storia ogni sera
problem.2.answer=La ripetizione non è mancanza di varietà. Le parole note permettono di prevedere, partecipare e rilassarsi. Mantieni il preferito e ogni tanto affiancagli una sola opzione nuova.
problem.3.question=Le storie lo rendono ancora più vivace
problem.3.answer=Sposta i libri movimentati a un’ora precedente, scegli una trama più breve e prevedibile e rendi più quieto ciò che segue l’ultima pagina. Se le voci teatrali lo svegliano, lasciale al giorno.
problem.4.question=La storia diventa improvvisamente spaventosa
problem.4.answer=Fermati invece di insistere fino alla fine. Dai un nome a ciò che ha fatto paura, ricorda al bambino che è al sicuro con te e passa a qualcosa di noto. Potrete riaprire il libro di giorno.
problem.5.question=Un viaggio o una sera tardi spezzano la routine
problem.5.answer=Conserva due ancore portatili: la stessa breve storia o registrazione e la stessa frase finale. La stanza e l’ora possono cambiare mentre l’ordine resta riconoscibile.
faq.title=Qualche risposta per una buonanotte più serena
faq.1.question=Quanto deve durare una storia della buonanotte?
faq.1.answer=Non esiste un numero perfetto. Cinque-dieci minuti sono un buon punto di partenza per molte famiglie, ma contano di più attenzione e calma. Termina prima o dividi una storia lunga in capitoli.
faq.2.question=Le storie audio vanno bene prima di dormire?
faq.2.answer=L’audio può completare bene il rituale, soprattutto con una voce familiare e un adulto disponibile. È un altro modo per condividere la storia, non una promessa di sonno né un sostituto di ogni vicinanza dal vivo.
faq.3.question=Va bene leggere la stessa storia ogni sera?
faq.3.answer=Sì. La ripetizione facilita la partecipazione e rende prevedibile la sequenza. Introduci varietà con delicatezza offrendo un titolo noto e uno nuovo.
faq.4.question=A che età si può iniziare con le storie serali?
faq.4.answer=Si può iniziare già da neonati con poche pagine tranquille, una filastrocca o il suono di una voce familiare. Adatta parole, immagini, durata e scambio mentre crescono linguaggio e attenzione.
