setup.kicker=Zanim wybierzesz
setup.title=Wybieraj dla dziecka, które masz dziś przed sobą
setup.lead=Oznaczenie wieku to wskazówka, nie sztywna zasada. Maluch może przez tydzień prosić o tę samą kartonową książeczkę, a starsze dziecko o rozdział, zabawną rodzinną historię albo słuchowisko z ciągiem dalszym następnego dnia.
setup.body=Sprawdź trzy rzeczy: ile języka dziecko śledzi bez wysiłku, ile ma jeszcze energii i jakie uczucie zostawia zakończenie. Głośne przygody lepiej przenieść na wcześniejszą porę, jeśli utrudniają wyciszenie. Wieczorem często sprawdzają się znane fabuły, łagodny humor, powtórzenia i czytelny finał.
kit.1.title=Wiek i uwaga
kit.1.body=Dla młodszych słuchaczy wybieraj mniej postaci i więcej powtórzeń; dłuższe fabuły i rozdziały wprowadzaj wraz z rosnącą uwagą.
kit.2.title=Elastyczna długość
kit.2.body=Zacznij od pięciu–dziesięciu spokojnych minut i obserwuj dziecko, nie zegarek. Krótka, dobrze zakończona bajka wystarczy.
kit.3.title=Uczucie po historii
kit.3.body=Dobra opowieść zostawia w pokoju więcej ciszy, bezpieczeństwa lub przyjemnej ciekawości, a nie napięcia i pełnej gotowości do zabawy.
steps.kicker=Przebieg wieczoru
steps.title=Siedem kroków od gwarnego wieczoru do znajomego „dobranoc”
step.1.title=Zacznij od tego samego małego sygnału
step.1.body=Niech bajka zawsze następuje po myciu zębów, założeniu piżamy, zasłonięciu okna albo wyborze przytulanki. Taki sygnał mówi, że aktywna część dnia dobiega końca.
step.2.title=Zaproponuj dwie odpowiednie historie
step.2.body=Cała półka książek łatwo zamienia wieczór w negocjacje. Wybierz dwie pozycje, które naprawdę możesz przeczytać. Gdy brakuje sił, zaproponuj krótki ulubiony tytuł i zapisane wcześniej nagranie.
step.3.title=Przygaś światło i odłóż jasne ekrany
step.3.body=Zostaw ciepłe światło wystarczające do czytania, ale usuń z rytuału filmy i bez końca przewijane treści. Jeśli audio płynie z telefonu, uruchom je i nie wracaj już do ekranu.
step.4.title=Czytaj trochę wolniej niż mówisz w dzień
step.4.body=Zostań przy swoim naturalnym głosie, mów ciszej i rób pauzy przy zmianie strony. Rozbudowane aktorstwo nie jest potrzebne. Równy rytm pomaga opowieści stać się mostem do snu.
step.5.title=Zapraszaj do bliskości, nie do odpytywania
step.5.body=Wystarczy jedno łagodne pytanie: „Jak myślisz, co będzie dalej?” albo „Który fragment ci się podobał?” Jeśli dziecko już przysypia, nie sprawdzaj, czy wszystko zapamiętało.
step.6.title=Kończ tym samym zdaniem
step.6.body=Zamknij książkę, powiedz, że czas bajki się skończył, i użyj znanego pożegnania. Przewidywalny finał ułatwia nie dokładanie trzech kolejnych zajęć po ostatniej stronie.
step.7.title=Przygotuj wariant na trudny wieczór
step.7.body=W spokojny dzień nagraj ulubioną bajkę albo rodzinne życzenie dobrej nocy. Kiedy jesteś wyczerpany, boli cię gardło lub jesteś poza domem, znajomy głos podtrzyma rytuał, a obok może zostać inny bliski dorosły.
quote.text=Rytuał nie musi być długi. Ma być na tyle znajomy, żeby dziecko wiedziało, co wydarzy się za chwilę.
quote.attribution=Zasada spokojnego wieczoru Sleep2Story
checklist.kicker=Na zwykły wieczór
checklist.title=Dwuminutowa lista bajki na dobranoc
checklist.1=Jedna lub dwie odpowiednie bajki są gotowe
checklist.2=Historia pasuje do dzisiejszego poziomu energii
checklist.3=Jasne filmy i powiadomienia są odłożone
checklist.4=Miejsce do czytania jest wygodne i bezpieczne
checklist.5=Długość jest realna także dla dorosłego
checklist.6=Gotowe jest czytanie lub nagranie zapasowe
checklist.7=Końcowe „dobranoc” pozostaje znajome
checklist.8=Można skończyć wcześniej, gdy pojawił się spokój
problems.title=Chroń spokój, nie idealną serię
problem.1.question=Jestem wyczerpany albo boli mnie gardło
problem.1.answer=Wybierz najkrótszą znaną bajkę, poproś innego bliskiego dorosłego lub użyj wcześniejszego nagrania. Zostań obok, jeśli dziecko tego potrzebuje, ale nie zmuszaj się do długiego czytania. Oszczędzaj bolący głos i skonsultuj się z lekarzem, jeśli coś cię niepokoi.
problem.2.question=Dziecko co wieczór chce tej samej bajki
problem.2.answer=Powtarzanie nie jest brakiem różnorodności. Znane słowa pozwalają przewidywać, włączać się i rozluźniać. Zostaw ulubioną książkę, a czasem połóż obok jedną nową propozycję.
problem.3.question=Po bajce dziecko jest jeszcze bardziej pobudzone
problem.3.answer=Dynamiczne książki czytaj wcześniej, a wieczorem wybierz krótszą i bardziej przewidywalną fabułę. Po ostatniej stronie ścisz wszystko; głośne głosy bohaterów można zostawić na dzień.
problem.4.question=Opowieść nagle przestraszyła dziecko
problem.4.answer=Zatrzymaj się zamiast koniecznie doczytywać. Nazwij to, co było straszne, przypomnij, że dziecko jest z tobą bezpieczne, i sięgnij po coś znanego. Do książki można wrócić w dzień.
problem.5.question=Podróż lub późny powrót zaburzyły rytuał
problem.5.answer=Zachowaj dwa przenośne punkty: tę samą krótką bajkę lub nagranie i to samo zdanie na dobranoc. Pokój i godzina mogą się zmienić, a kolejność nadal będzie rozpoznawalna.
faq.title=Odpowiedzi na spokojniejsze dobranoc
faq.1.question=Jak długa powinna być bajka na dobranoc?
faq.1.answer=Nie ma idealnej liczby. Dla wielu rodzin pięć–dziesięć minut to dobry początek, ale uwaga i spokój są ważniejsze od zegarka. Skończ wcześniej albo podziel dłuższą historię na rozdziały.
faq.2.question=Czy bajki audio są dobre przed snem?
faq.2.answer=Audio może dobrze uzupełniać rytuał, szczególnie gdy głos jest znajomy, a dorosły pozostaje dostępny. To kolejny sposób wspólnego przeżywania opowieści, nie obietnica zaśnięcia ani zamiennik całej bliskości.
faq.3.question=Czy można co wieczór czytać tę samą bajkę?
faq.3.answer=Tak. Powtórzenia ułatwiają dziecku udział i czynią kolejność przewidywalną. Różnorodność można wprowadzać łagodnie, dając do wyboru jedną znaną i jedną nową opowieść.
faq.4.question=Od jakiego wieku zaczynać bajki na dobranoc?
faq.4.answer=Można zacząć już w niemowlęctwie od kilku spokojnych stron, rymowanki lub samego brzmienia znajomego głosu. Wraz z rozwojem mowy i uwagi zmieniaj słowa, obrazy, długość i poziom rozmowy.
