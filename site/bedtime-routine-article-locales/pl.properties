answer.title=Wybierz krótką bajkę odpowiednią do wieku, zachowaj kilka stałych sygnałów snu i skończ, kiedy dziecko nadal jest wyciszone.
answer.body=Czytaj na żywo, gdy masz siłę. W bardzo męczący wieczór, przy chrypce albo podczas nieobecności znajome nagranie może podtrzymać rytuał bez czytania za wszelką cenę.
