answer.title=年齢に合う短い話を選び、寝る前の合図をいくつか同じにして、子どもが落ち着いたら無理に読み続けずに終えましょう。
answer.body=読めるときは直接読んであげてください。疲れ切った夜や声がかれた夜、離れている夜には、聞き慣れた録音が、親に無理をさせずにいつもの習慣を支えます。
toc.1=物語の選び方
toc.2=7ステップの習慣
toc.3=今夜のチェックリスト
toc.4=寝る前によくある困りごと
toc.6=保護者からの質問
setup.kicker=選ぶ前に
setup.title=今夜のわが子に合う話を選ぶ
setup.lead=対象年齢は目安であって、決まりではありません。幼児は同じ丈夫な絵本を一週間続けて欲しがるかもしれませんし、小学生なら1章分の話、家族の面白い思い出、翌日に続きを聴ける音声を好むこともあります。
setup.body=見るのは3つ。子どもが無理なく理解できる言葉の量、今の眠気や元気さ、読み終わった後の気分です。速くてにぎやかな冒険で興奮してしまうなら、夜の早い時間に。寝る前には、なじみのある展開、やさしいユーモア、繰り返し、はっきりした結末のほうが落ち着きやすいことがあります。
kit.1.title=年齢と集中力
kit.1.body=小さい子には登場人物を少なくし、繰り返しを増やします。集中できるようになったら長い筋や章立ての話も。
kit.2.title=調整できる長さ
kit.2.body=まずは穏やかな5〜10分から。時計より子どもの様子を見ましょう。気持ちよく終わる短い話で十分です。
kit.3.title=読み終わった後の気分
kit.3.body=緊張して目がさえる話より、部屋が少し静かに、安全に、あるいは心地よい好奇心を残せる話を選びます。
steps.kicker=夜の流れ
steps.title=にぎやかな夕方から、いつもの「おやすみ」までの7ステップ
step.1.title=いつもの小さな合図から始める
step.1.body=歯を磨く、パジャマに着替える、カーテンを閉める、ぬいぐるみを選ぶなど、毎晩繰り返せる動作の次に物語を置きます。その合図が、活動する時間の終わりを伝えます。
step.2.title=選択肢は2つに絞る
step.2.body=本が多すぎると、寝る前が交渉の時間になります。大人も読みたいと思える2冊を選び、子どもに決めてもらいましょう。特に疲れた夜は、短いお気に入りと保存済みの音声を選択肢にできます。
step.3.title=照明を落とし、明るい画面を片づける
step.3.body=読むのに十分な暖かい光は残し、刺激の強い動画や終わりのない画面の操作は習慣から外しましょう。スマホで音声を流すなら先に再生を始め、その後は画面に触れないようにします。
step.4.title=日中の会話より少しゆっくり読む
step.4.body=いつもの声のまま音量を少し抑え、ページをめくるときに間を置きます。凝った演技は不要です。一定の速さなら、物語は新たな興奮ではなく、眠りへの橋になります。
step.5.title=つながりを大切にし、クイズにしない
step.5.body=「この後どうなると思う？」「どこが好きだった？」など、やさしい問いをひとつで十分です。もう眠そうなら、理解を確かめずに言葉を流してあげましょう。
step.6.title=毎回同じ言葉で締めくくる
step.6.body=本を閉じ、物語の時間が終わりだと伝え、いつもの「おやすみ」を言います。終わり方が決まっていると、最後のページの後にさらに何かを増やしにくくなります。
step.7.title=元気のない夜の備えを先に作る
step.7.body=元気で時間に余裕のある日に、お気に入りの話や家族からのメッセージを録っておきます。疲れたとき、喉が痛いとき、離れているときにも、別の大人がそばにいながら聞き慣れた声で習慣を支えられます。
quote.text=習慣は長くなくていい。次に何が起こるか、子どもに分かるくらい慣れた流れであれば十分です。
quote.attribution=Sleep2Story の寝る前の習慣についての考え方
checklist.kicker=いつもの夜に
checklist.title=2分で確認できる寝る前の物語チェックリスト
checklist.1=合う物語を1つか2つ用意した
checklist.2=今夜の元気さに合う話を選んだ
checklist.3=明るい動画や通知を片づけた
checklist.4=読む場所が心地よく、安全だ
checklist.5=大人にとっても無理のない長さだ
checklist.6=直接読むか、予備の音声を使える
checklist.7=最後の「おやすみ」はいつもどおり
checklist.8=落ち着いたら早めに終えてもよい
problems.title=守りたいのは完璧な記録より穏やかな時間
problem.1.question=疲れ切っている、または喉が痛い
problem.1.answer=いちばん短い慣れた物語を選び、信頼できる別の大人に読んでもらうか、以前の録音を使いましょう。子どもが必要とするならそばにいながら、無理して長く読まなくて大丈夫です。痛む声は休ませ、心配なら医療機関に相談してください。
problem.2.question=子どもが毎晩同じ物語を求める
problem.2.answer=繰り返しは、選択肢が足りない証拠ではありません。知っている言葉なら、子どもは先を予想し、一緒に言い、安心できます。お気に入りは残し、ときどき新しい話をひとつ横に添えましょう。
problem.3.question=物語を読むと逆に興奮する
problem.3.answer=元気の出る本は早い時間に移し、短くて先が分かりやすい話を選び、読み終わった後も静かな流れにします。役になりきる大きな声で毎回目がさえるなら、寝る前は控えましょう。
problem.4.question=途中で話を怖がった
problem.4.answer=最後まで無理に進めず止めましょう。何が怖かったのか言葉にし、「ここでは安全だよ」と伝え、なじみのある話に替えます。子どもが望めば、昼間にその本を読み直せます。
problem.5.question=旅行や遅い帰宅で習慣が崩れる
problem.5.answer=持ち運べる軸を2つ残しましょう。同じ短い物語か録音と、同じ締めくくりの言葉です。場所や時間が変わっても、順番が分かれば安心できます。
faq.title=穏やかな寝る前のためのQ&A
faq.1.question=寝る前の物語は何分くらいがよいですか？
faq.1.answer=決まった正解はありません。5〜10分は多くの家庭で始めやすい目安ですが、時計より子どもの集中力と落ち着きが大切です。落ち着いたら早めに終え、長い話は章ごとに分けましょう。
faq.2.question=音声の寝る前の物語は子どもによいですか？
faq.2.answer=聞き慣れた声で、大人が必要なときに応じられるなら、音声も習慣の一部になります。物語を共有するひとつの方法として使いましょう。必ず眠れるという約束でも、直接の関わりをすべて置き換えるものでもありません。
faq.3.question=毎晩同じ話を読んでも大丈夫ですか？
faq.3.answer=はい。繰り返しは子どもが参加しやすく、次の展開も予想できます。慣れた話をひとつ、新しい話をひとつ用意すると、無理なく変化をつけられます。
faq.4.question=寝る前の読み聞かせは何歳から始められますか？
faq.4.answer=乳児期から、数ページの本やわらべ歌、聞き慣れた声で始められます。言葉と集中力が育つにつれ、文章、絵、長さ、やり取りを調整しましょう。
