answer.title=Choisissez un récit court et adapté à l’âge, gardez quelques repères constants et arrêtez la lecture pendant que votre enfant est encore apaisé.
answer.body=Lisez vous-même quand vous le pouvez. Les soirs d’épuisement, de voix enrouée ou d’absence, un enregistrement familier peut préserver le rituel sans vous obliger à assurer coûte que coûte.
toc.1=Choisir la bonne histoire
toc.2=Un rituel en sept étapes
toc.3=La liste de ce soir
toc.4=Les difficultés courantes
toc.6=Les questions des parents
setup.kicker=Avant de choisir
setup.title=Choisissez pour l’enfant que vous avez devant vous ce soir
setup.lead=Les indications d’âge sont des repères, pas des règles. Un tout-petit peut réclamer le même album cartonné pendant une semaine ; un enfant plus grand préférera un chapitre, un souvenir de famille amusant ou une histoire audio à poursuivre demain.
setup.body=Observez trois éléments : la quantité de langage que l’enfant suit sans effort, son niveau d’éveil et l’émotion laissée par la fin. Gardez les aventures très mouvementées pour plus tôt si elles compliquent l’apaisement. Au coucher, les intrigues familières, l’humour doux, les répétitions et une fin claire passent souvent mieux.
kit.1.title=Âge et attention
kit.1.body=Pour les plus jeunes, privilégiez peu de personnages et davantage de répétitions ; ajoutez des intrigues longues ou des chapitres quand l’attention grandit.
kit.2.title=Une durée souple
kit.2.body=Commencez par cinq à dix minutes tranquilles et regardez votre enfant plutôt que l’horloge. Une courte histoire bien terminée suffit.
kit.3.title=L’émotion qui reste
kit.3.body=Choisissez un récit qui laisse la chambre plus calme, plus sûre ou doucement curieuse, plutôt que tendue et prête à repartir.
steps.kicker=Le déroulé du soir
steps.title=Sept étapes de l’agitation au « bonne nuit » familier
step.1.title=Commencez par le même petit signal
step.1.body=Placez toujours l’histoire après une action répétée : se brosser les dents, enfiler le pyjama, fermer les volets ou choisir le doudou. Ce signal indique que la partie active de la journée se termine.
step.2.title=Proposez deux choix adaptés
step.2.body=Trop de livres transforment vite le coucher en négociation. Sélectionnez deux titres que vous êtes vraiment prêt à lire. Les soirs de grande fatigue, proposez un favori court et un enregistrement déjà sauvegardé.
step.3.title=Tamisez la lumière et écartez les écrans lumineux
step.3.body=Gardez une lumière chaude suffisante pour lire, mais sortez les vidéos et le défilement sans fin du rituel. Si l’audio vient du téléphone, lancez-le puis laissez l’écran de côté.
step.4.title=Lisez un peu plus lentement qu’en journée
step.4.body=Gardez votre voix naturelle, baissez légèrement le volume et marquez les changements de page. Inutile de jouer chaque personnage. Un rythme régulier transforme le récit en passage vers la nuit plutôt qu’en nouveau spectacle.
step.5.title=Invitez à la complicité, pas à l’interrogation
step.5.body=Une question douce suffit : « Que va-t-il se passer ensuite, à ton avis ? » ou « Quel passage as-tu aimé ? » Si votre enfant somnole déjà, ne vérifiez pas sa compréhension.
step.6.title=Terminez par la même formule
step.6.body=Fermez le livre, annoncez la fin du temps de l’histoire et reprenez une phrase de bonne nuit familière. Une fin prévisible évite d’ajouter trois nouvelles activités après la dernière page.
step.7.title=Préparez une solution pour les soirs sans énergie
step.7.body=Lors d’une journée tranquille, enregistrez une histoire préférée ou un message familial. Si vous êtes épuisé, avez mal à la gorge ou êtes absent, cette voix familière soutient le rituel pendant qu’un autre adulte de confiance reste présent.
quote.text=Le rituel n’a pas besoin d’être long. Il doit être assez familier pour que l’enfant sache ce qui vient ensuite.
quote.attribution=Principe du soir Sleep2Story
