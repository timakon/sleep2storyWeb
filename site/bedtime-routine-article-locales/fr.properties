problems.title=Préservez le calme, pas une série parfaite
problem.1.question=Je suis épuisé ou j’ai mal à la gorge
problem.1.answer=Choisissez le récit familier le plus court, demandez à un autre adulte proche ou utilisez un enregistrement antérieur. Restez disponible si l’enfant en a besoin, mais ne forcez pas une longue lecture. Reposez une voix douloureuse et consultez un professionnel de santé si cela vous inquiète.
problem.2.question=Mon enfant réclame la même histoire chaque soir
problem.2.answer=La répétition n’est pas un manque de variété. Les mots connus permettent d’anticiper, de participer et de se détendre. Gardez le favori et placez parfois une nouveauté à côté sans retirer l’ancien.
problem.3.question=Les histoires excitent encore plus mon enfant
problem.3.answer=Déplacez les albums très animés plus tôt, choisissez une intrigue courte et prévisible, puis rendez l’après-lecture plus silencieux. Si les voix de personnages réveillent la chambre, gardez-les pour la journée.
problem.4.question=L’histoire devient soudain effrayante
problem.4.answer=Arrêtez plutôt que de vouloir finir à tout prix. Nommez ce qui a fait peur, rappelez à l’enfant qu’il est en sécurité avec vous et revenez à un récit connu. Vous pourrez rouvrir le livre en journée s’il le souhaite.
problem.5.question=Un voyage ou une soirée tardive casse le rituel
problem.5.answer=Gardez deux repères transportables : la même courte histoire ou le même enregistrement, puis la même formule finale. La chambre et l’heure changent, mais l’ordre reste reconnaissable.
faq.title=Quelques réponses pour un coucher plus serein
faq.1.question=Combien de temps doit durer une histoire du soir ?
faq.1.answer=Il n’existe pas de durée parfaite. Cinq à dix minutes constituent un bon départ pour beaucoup de familles, mais l’attention et le calme comptent davantage. Arrêtez plus tôt ou partagez un long récit en chapitres.
faq.2.question=Les histoires audio sont-elles bonnes le soir ?
faq.2.answer=L’audio peut compléter utilement le rituel, surtout avec une voix familière et un adulte disponible. C’est une autre façon de partager un récit, pas une promesse d’endormissement ni le remplacement de toute présence réelle.
faq.3.question=Peut-on lire la même histoire tous les soirs ?
faq.3.answer=Oui. La répétition facilite la participation et rend la suite prévisible. Introduisez la nouveauté en douceur en proposant un titre familier et un nouveau.
faq.4.question=À quel âge commencer les histoires du soir ?
faq.4.answer=Dès la petite enfance, quelques pages calmes, une comptine ou la simple voix d’un proche peuvent entrer dans le rituel. Faites évoluer les mots, les images, la durée et les échanges avec l’attention de l’enfant.
