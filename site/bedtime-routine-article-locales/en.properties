problems.title=Protect the calm, not a perfect streak
problem.1.question=I am exhausted or my throat hurts
problem.1.answer=Choose the shortest familiar story, ask another trusted adult to read, or use a recording prepared earlier. Stay nearby if your child needs you, but do not force a long performance. Rest a painful voice and seek medical advice if you are concerned.
problem.2.question=My child asks for the same story every night
problem.2.answer=Repetition is not a failure of variety. Familiar words let a child predict, join in, and relax. Keep the favourite and occasionally place one new option beside it without removing the old one.
problem.3.question=Stories make my child more excited
problem.3.answer=Move energetic books earlier, choose a shorter and more predictable story, and soften what happens after the last page. Avoid turning bedtime reading into loud character play if it consistently wakes the room up.
problem.4.question=The story suddenly feels scary
problem.4.answer=Stop rather than pushing to the ending. Name what felt frightening, remind the child that they are safe with you, and switch to something familiar. You can revisit the book in daylight if they want to.
problem.5.question=Travel or a late evening breaks the routine
problem.5.answer=Keep two portable anchors: the same short story or recording and the same closing phrase. The room and time can change while the order remains recognisable.
faq.title=A few answers for a calmer bedtime
faq.1.question=How long should a bedtime story be?
faq.1.answer=There is no perfect number. Five to ten minutes is a useful starting point for many families, but attention and calm matter more than the clock. End earlier when the child is settled; split a longer story into chapters.
faq.2.question=Are audio bedtime stories good for children?
faq.2.answer=Audio can be a useful part of the routine, especially when the voice is familiar and an adult remains available. Treat it as another way to share a story, not as a promise that every child will fall asleep or as a replacement for all live connection.
faq.3.question=Is it okay to read the same story every night?
faq.3.answer=Yes. Repetition supports participation and makes the sequence predictable. You can add variety gently by offering one familiar choice and one new choice.
faq.4.question=What age can bedtime stories begin?
faq.4.answer=You can begin in infancy with a few calm pages, a rhyme, or the sound of a familiar voice. As language and attention grow, adjust the words, pictures, length, and level of interaction.
