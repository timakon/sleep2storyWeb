setup.kicker=Before you choose
setup.title=Choose for the child you have tonight
setup.lead=Age labels are a starting point, not a rule. A toddler may want one sturdy picture book repeated for a week; a school-age child may prefer a chapter, a funny family memory, or an audio story they can continue tomorrow.
setup.body=Look at three things: how much language your child can comfortably follow, how alert they are, and what mood the story leaves behind. Save fast, noisy adventures for earlier if they make it harder to settle. At bedtime, familiar plots, gentle humour, repetition, and a clear ending are often easier to leave.
kit.1.title=Age and attention
kit.1.body=Use fewer characters and more repetition for younger listeners; add longer plots or chapters when attention grows.
kit.2.title=A flexible length
kit.2.body=Begin with five to ten calm minutes and follow the child, not the clock. A short story that ends well is enough.
kit.3.title=The after-feeling
kit.3.body=Choose a story that leaves the room quieter, safer, or pleasantly curious rather than tense and wide awake.
steps.kicker=The evening
steps.title=Seven steps from busy evening to familiar goodnight
step.1.title=Start with the same small cue
step.1.body=Let the story follow a repeatable action such as brushing teeth, putting on pyjamas, closing the curtains, or choosing a soft toy. The cue tells the body that the active part of the day is ending.
step.2.title=Offer two suitable choices
step.2.body=Too many books turn bedtime into negotiation. Pick two you are genuinely willing to read and let the child choose. On very tired nights, offer a short favourite and a saved audio option.
step.3.title=Lower the light and put bright screens aside
step.3.body=Use enough warm light to read comfortably, but move stimulating video and endless scrolling out of the ritual. If you play audio from a phone, start it first and then leave the screen alone.
step.4.title=Read a little slower than daytime conversation
step.4.body=Keep your natural voice, soften the volume, and leave a pause at page turns. You do not need elaborate character acting. A steady pace helps the story feel like a bridge, not another burst of entertainment.
step.5.title=Invite connection, not a quiz
step.5.body=One gentle question is enough: “What do you think happens next?” or “Which part did you like?” If your child is already sleepy, let the words pass without checking comprehension.
step.6.title=End with the same closing phrase
step.6.body=Close the book, name that story time is finished, and use one familiar goodnight sentence. A predictable ending makes it easier to resist adding three more activities after the last page.
step.7.title=Prepare a low-energy backup before you need it
step.7.body=Record a favourite story or family message on a healthy, unhurried day. When you are exhausted, your throat hurts, or you are away, that familiar voice can support the routine while another adult stays present.
quote.text=The ritual does not need to be long. It needs to feel familiar enough that the child knows what comes next.
