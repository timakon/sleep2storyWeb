answer.title=छोटी, उम्र के अनुरूप कहानी चुनें, सोने के समय के कुछ संकेत रोज़ वैसे ही रखें और कहानी को हर हाल में खत्म करने की जगह बच्चा शांत होते ही रुकें।
answer.body=जब संभव हो, सामने बैठकर पढ़ें। बहुत थकी, गला बैठी या दूर रहने वाली रातों में परिचित आवाज़ की रिकॉर्डिंग उस रिवाज को बनाए रख सकती है, बिना माता-पिता पर ज़ोर डालने के।
