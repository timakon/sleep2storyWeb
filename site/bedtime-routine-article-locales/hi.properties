problems.title=शांति बचाएँ, पूर्णता का रिकॉर्ड नहीं
problem.1.question=मैं थक गया हूँ या गला दुख रहा है
problem.1.answer=सबसे छोटी परिचित कहानी चुनें, किसी भरोसेमंद वयस्क से पढ़वाएँ या पहले तैयार रिकॉर्डिंग चलाएँ। बच्चे को ज़रूरत हो तो पास रहें, लेकिन लंबा पढ़ने के लिए खुद पर ज़ोर न डालें। दुखते गले को आराम दें और चिंता हो तो डॉक्टर से सलाह लें।
problem.2.question=बच्चा हर रात वही कहानी माँगता है
problem.2.answer=दोहराव विविधता की कमी नहीं है। परिचित शब्द बच्चे को अनुमान लगाने, साथ बोलने और शांत होने देते हैं। पसंदीदा कहानी रखें और कभी-कभी पुरानी हटाए बिना एक नया विकल्प जोड़ें।
problem.3.question=कहानी सुनकर बच्चा और उत्साहित हो जाता है
problem.3.answer=ऊर्जावान किताबें शाम में पहले पढ़ें, छोटी और अनुमान लगने वाली कहानी चुनें तथा आखिरी पन्ने के बाद की गतिविधि शांत रखें। यदि नाटकीय आवाज़ें बच्चे को हर बार जगा देती हैं, तो उनसे बचें।
problem.4.question=कहानी अचानक डरावनी लगने लगती है
problem.4.answer=अंत तक ज़बरदस्ती जाने के बजाय रुकें। बच्चे से पूछें कि क्या डरावना लगा, याद दिलाएँ कि वह आपके साथ सुरक्षित है और परिचित कहानी चुनें। चाहे तो उस किताब को दिन में फिर देख सकते हैं।
problem.5.question=यात्रा या देर रात दिनचर्या बिगाड़ देती है
problem.5.answer=दो चीज़ें साथ रखें: वही छोटी कहानी या रिकॉर्डिंग और शुभ रात्रि की वही पंक्ति। जगह और समय बदलें तो भी क्रम पहचान में आएगा।
faq.title=शांत रात के लिए कुछ जवाब
faq.1.question=सोने से पहले की कहानी कितनी लंबी होनी चाहिए?
faq.1.answer=कोई एक सही अवधि नहीं। कई परिवारों के लिए पाँच से दस मिनट अच्छी शुरुआत है, लेकिन घड़ी से ज़्यादा बच्चे का ध्यान और शांति देखें। बच्चा शांत हो जाए तो पहले रुकें; लंबी कहानी अध्यायों में बाँटें।
faq.2.question=क्या बच्चों के लिए ऑडियो कहानियाँ अच्छी हैं?
faq.2.answer=ऑडियो दिनचर्या का उपयोगी हिस्सा हो सकता है, खासकर जब आवाज़ परिचित हो और कोई वयस्क उपलब्ध रहे। इसे कहानी साझा करने का एक और तरीका समझें, हर बच्चे को सुलाने की गारंटी या आमने-सामने के सभी जुड़ाव का विकल्प नहीं।
faq.3.question=क्या हर रात वही कहानी पढ़ना ठीक है?
faq.3.answer=हाँ। दोहराव बच्चे की भागीदारी बढ़ाता है और क्रम को परिचित बनाता है। एक पुराना और एक नया विकल्प देकर धीरे-धीरे विविधता ला सकते हैं।
faq.4.question=किस उम्र से रात की कहानी शुरू कर सकते हैं?
faq.4.answer=शैशवावस्था से ही कुछ शांत पन्ने, कविता या परिचित आवाज़ सुना सकते हैं। भाषा और ध्यान बढ़ने पर शब्द, चित्र, अवधि और बातचीत की मात्रा बदलें।
