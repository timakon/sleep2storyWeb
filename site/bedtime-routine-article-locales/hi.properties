setup.kicker=चुनने से पहले
setup.title=आज जैसा बच्चा है, कहानी भी वैसी चुनें
setup.lead=उम्र का लेबल एक शुरुआत है, कठोर नियम नहीं। छोटा बच्चा एक ही चित्र-पुस्तक हफ़्ते भर सुनना चाहेगा; स्कूल जाने वाला बच्चा अध्याय, मज़ेदार पारिवारिक याद या कल फिर सुनने वाली ऑडियो कहानी पसंद कर सकता है।
setup.body=तीन बातें देखें: बच्चा कितनी भाषा आसानी से समझता है, आज उसमें कितनी ऊर्जा है और कहानी के बाद कैसा महसूस करता है। तेज़ और शोरगुल वाले रोमांच उसे जगाए रखते हों तो उन्हें शाम में पहले पढ़ें। रात में परिचित कथानक, हल्का हास्य, दोहराव और स्पष्ट अंत के साथ रुकना आसान होता है।
kit.1.title=उम्र और ध्यान
kit.1.body=छोटे श्रोता के लिए कम पात्र और ज़्यादा दोहराव रखें; ध्यान बढ़ने पर लंबी कहानी या अध्याय चुनें।
kit.2.title=लचीली अवधि
kit.2.body=पाँच से दस शांत मिनट से शुरू करें और घड़ी के बजाय बच्चे को देखें। ठीक जगह खत्म हुई छोटी कहानी काफ़ी है।
kit.3.title=कहानी के बाद की भावना
kit.3.body=ऐसी कहानी लें जो कमरे को शांत, सुरक्षित या हल्की जिज्ञासा से भरा छोड़े, तनाव और पूरी तरह जागतेपन से नहीं।
steps.kicker=शाम का समय
steps.title=भागदौड़ से परिचित शुभ रात्रि तक: सात कदम
step.1.title=हर बार उसी छोटे संकेत से शुरू करें
step.1.body=कहानी से पहले दाँत साफ़ करना, रात के कपड़े पहनना, पर्दे बंद करना या पसंदीदा खिलौना चुनना जैसे काम रखें। एक ही संकेत बच्चे को बताता है कि दिन की हलचल समाप्त हो रही है।
step.2.title=दो उपयुक्त विकल्प दें
step.2.body=बहुत सारी किताबें रात को बातचीत के बजाय मोल-भाव बना देती हैं। दो ऐसी कहानियाँ चुनें जिन्हें आप सच में पढ़ने को तैयार हैं और बच्चे को चुनने दें। बहुत थकी रात में एक छोटी पसंदीदा कहानी और पहले से सहेजा ऑडियो विकल्प रखें।
step.3.title=रोशनी धीमी करें और चमकती स्क्रीन हटाएँ
step.3.body=पढ़ने लायक गर्म रोशनी रखें, लेकिन उत्तेजक वीडियो और अंतहीन स्क्रॉलिंग को रिवाज से दूर करें। फ़ोन से ऑडियो चलाते हैं तो पहले उसे शुरू करें, फिर स्क्रीन छोड़ दें।
step.4.title=दिन की बातचीत से थोड़ा धीमे पढ़ें
step.4.body=अपनी स्वाभाविक आवाज़ रखें, बोलना थोड़ा धीमा और हल्का करें तथा पन्ना पलटते समय रुकें। हर पात्र का नाटकीय अभिनय ज़रूरी नहीं। स्थिर लय कहानी को एक शांत पुल बनाती है, मनोरंजन का नया शोर नहीं।
step.5.title=जुड़ाव बनाएँ, परीक्षा न लें
step.5.body=एक हल्का सवाल काफ़ी है: “आगे क्या होगा?” या “तुम्हें कौन-सा हिस्सा अच्छा लगा?” यदि बच्चा पहले ही उनींदा है तो समझ की जाँच किए बिना शब्दों को बहने दें।
step.6.title=हर बार वही अंतिम बात कहें
step.6.body=किताब बंद करें, बताएं कि कहानी का समय समाप्त हुआ और शुभ रात्रि की परिचित पंक्ति कहें। अनुमान लगने वाला अंत, आखिरी पन्ने के बाद तीन नए काम जोड़ने की माँग कम करता है।
step.7.title=ज़रूरत से पहले कम मेहनत वाला विकल्प तैयार रखें
step.7.body=जब समय और तबीयत अच्छी हो, पसंदीदा कहानी या परिवार का संदेश रिकॉर्ड कर लें। बहुत थकान, गला दर्द या दूर रहने पर वह परिचित आवाज़ दिनचर्या सँभाल सकती है, जबकि कोई दूसरा वयस्क बच्चे के पास रहे।
quote.text=रात का रिवाज लंबा होना ज़रूरी नहीं। इतना परिचित होना चाहिए कि बच्चा जानता हो, अब आगे क्या होगा।
