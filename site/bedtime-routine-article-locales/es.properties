setup.kicker=Antes de elegir
setup.title=Elige para el niño que tienes delante esta noche
setup.lead=La edad recomendada orienta, pero no manda. Un peque puede pedir el mismo álbum de cartón durante una semana; uno mayor quizá prefiera un capítulo, una anécdota familiar divertida o un cuento en audio que continúe mañana.
setup.body=Fíjate en tres cosas: cuánto lenguaje sigue sin esfuerzo, cuánta energía le queda y qué sensación deja el final. Guarda las aventuras muy movidas para antes si dificultan la calma. Al acostarse suelen funcionar mejor las tramas conocidas, el humor suave, las repeticiones y un cierre claro.
kit.1.title=Edad y atención
kit.1.body=Para los más pequeños, usa pocos personajes y más repeticiones; añade tramas largas o capítulos a medida que crece la atención.
kit.2.title=Una duración flexible
kit.2.body=Empieza con cinco o diez minutos tranquilos y mira al niño, no al reloj. Un cuento breve que termina bien es suficiente.
kit.3.title=La sensación que queda
kit.3.body=Elige una historia que deje la habitación más tranquila, segura o agradablemente curiosa, no tensa y totalmente despierta.
steps.kicker=El curso de la noche
steps.title=Siete pasos del ajetreo al «buenas noches» de siempre
step.1.title=Empieza con la misma señal pequeña
step.1.body=Haz que el cuento llegue después de una acción repetida: lavarse los dientes, ponerse el pijama, cerrar la persiana o elegir el peluche. Esa señal anuncia que la parte activa del día termina.
step.2.title=Ofrece dos opciones adecuadas
step.2.body=Demasiados libros convierten la cama en una negociación. Escoge dos que de verdad puedas leer. En una noche de mucho cansancio, ofrece un favorito corto y una grabación que ya esté guardada.
step.3.title=Baja la luz y aparta las pantallas brillantes
step.3.body=Deja una luz cálida suficiente para leer, pero saca del ritual los vídeos y el desplazamiento infinito. Si el audio sale del móvil, ponlo en marcha y después deja quieta la pantalla.
step.4.title=Lee un poco más despacio que durante el día
step.4.body=Usa tu voz natural, baja el volumen y deja pausas al pasar página. No hace falta interpretar a todos los personajes. Un ritmo estable convierte el cuento en un puente hacia la noche.
step.5.title=Invita a conectar, no a examinar
step.5.body=Basta una pregunta suave: «¿Qué crees que pasará ahora?» o «¿Qué parte te gustó?» Si el niño ya se duerme, deja que las palabras pasen sin comprobar cuánto entendió.
step.6.title=Termina con la misma frase
step.6.body=Cierra el libro, di que el tiempo de cuento ha terminado y usa el saludo de buenas noches de siempre. Un final previsible evita sumar tres actividades más tras la última página.
step.7.title=Prepara el plan de poca energía antes de necesitarlo
step.7.body=En un día tranquilo, graba un cuento favorito o un mensaje familiar. Cuando estés agotado, te duela la garganta o estés lejos, esa voz conocida puede sostener el ritual mientras otro adulto cercano permanece presente.
quote.text=El ritual no tiene que ser largo. Tiene que ser lo bastante familiar para que el niño sepa qué viene después.
quote.attribution=Principio nocturno de Sleep2Story
