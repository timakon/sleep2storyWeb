problems.title=Protege la calma, no una racha perfecta
problem.1.question=Estoy agotado o me duele la garganta
problem.1.answer=Elige el cuento conocido más corto, pide a otro adulto de confianza que lea o usa una grabación anterior. Quédate cerca si el niño te necesita, pero no fuerces una lectura larga. Descansa una voz dolorida y consulta con un profesional sanitario si te preocupa.
problem.2.question=Mi hijo pide el mismo cuento todas las noches
problem.2.answer=Repetir no significa que falte variedad. Las palabras conocidas permiten anticipar, participar y relajarse. Conserva el favorito y, de vez en cuando, coloca una opción nueva al lado sin retirar la anterior.
problem.3.question=Los cuentos le dan aún más energía
problem.3.answer=Pasa los libros muy movidos a una hora anterior, escoge una trama más corta y previsible y baja el ritmo tras la última página. Si las voces teatrales despiertan la habitación, resérvalas para el día.
problem.4.question=El cuento se vuelve aterrador de repente
problem.4.answer=Para en lugar de insistir hasta el final. Pon nombre a lo que dio miedo, recuerda al niño que está seguro contigo y cambia a algo conocido. Podéis volver al libro de día si quiere.
problem.5.question=Un viaje o una noche tardía rompe la rutina
problem.5.answer=Conserva dos anclas portátiles: el mismo cuento corto o grabación y la misma frase final. La habitación y la hora pueden cambiar mientras el orden sigue siendo reconocible.
faq.title=Respuestas para acostarse con más calma
faq.1.question=¿Cuánto debe durar un cuento para dormir?
faq.1.answer=No hay una cifra perfecta. Cinco o diez minutos son un buen comienzo para muchas familias, pero importan más la atención y la calma. Termina antes si el niño ya se relaja o divide una historia larga en capítulos.
faq.2.question=¿Son buenos los cuentos en audio antes de dormir?
faq.2.answer=El audio puede complementar bien la rutina, especialmente con una voz familiar y un adulto disponible. Es otra forma de compartir un cuento, no una promesa de sueño ni un sustituto de toda la conexión en directo.
faq.3.question=¿Está bien leer el mismo cuento cada noche?
faq.3.answer=Sí. La repetición facilita participar y hace previsible la secuencia. Introduce variedad con suavidad ofreciendo una opción conocida y otra nueva.
faq.4.question=¿A qué edad se puede empezar con cuentos nocturnos?
faq.4.answer=Se puede empezar desde bebé con unas páginas tranquilas, una rima o el sonido de una voz conocida. Adapta las palabras, imágenes, duración y conversación a medida que crecen el lenguaje y la atención.
