answer.title=Elige un cuento corto y adecuado a la edad, conserva unas pocas señales de sueño y termina mientras el niño sigue tranquilo.
answer.body=Lee en directo cuando puedas. En noches de agotamiento, afonía o distancia, una grabación familiar puede mantener reconocible el ritual sin obligarte a actuar a toda costa.
