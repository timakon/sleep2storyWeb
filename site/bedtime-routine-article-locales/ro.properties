answer.title=Alege o poveste scurtă și potrivită vârstei, păstrează câteva semnale cunoscute de somn și oprește-te cât copilul este încă liniștit.
answer.body=Citește pe loc când poți. În serile de epuizare, răgușeală sau depărtare, o înregistrare familiară poate păstra ritualul fără să te oblige să citești cu orice preț.
