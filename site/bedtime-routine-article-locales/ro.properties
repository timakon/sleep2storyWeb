setup.kicker=Înainte să alegi
setup.title=Alege pentru copilul pe care îl ai în față astăzi
setup.lead=Eticheta de vârstă este un reper, nu o regulă. Un copil mic poate cere aceeași carte cartonată o săptămână; unul mai mare poate prefera un capitol, o amintire amuzantă din familie sau o poveste audio care continuă mâine.
setup.body=Urmărește trei lucruri: cât limbaj poate înțelege fără efort, câtă energie mai are și ce stare lasă finalul. Păstrează aventurile foarte agitate pentru mai devreme dacă îngreunează liniștirea. La culcare se potrivesc adesea intrigile cunoscute, umorul blând, repetițiile și un final clar.
kit.1.title=Vârstă și atenție
kit.1.body=Pentru cei mici, alege mai puține personaje și mai multe repetiții; adaugă intrigi lungi sau capitole pe măsură ce atenția crește.
kit.2.title=Durată flexibilă
kit.2.body=Începe cu cinci-zece minute calme și privește copilul, nu ceasul. O poveste scurtă care se încheie bine este suficientă.
kit.3.title=Starea de după
kit.3.body=Alege o poveste după care camera se simte mai liniștită, mai sigură sau plăcut curioasă, nu tensionată și complet trează.
steps.kicker=Desfășurarea serii
steps.title=Șapte pași de la agitație la familiarul „noapte bună”
step.1.title=Începe cu același semnal mic
step.1.body=Lasă povestea să urmeze o acțiune repetată: spălatul dinților, pijamaua, tragerea perdelelor sau alegerea jucăriei. Semnalul spune că partea activă a zilei se încheie.
step.2.title=Oferă două opțiuni potrivite
step.2.body=Prea multe cărți transformă culcarea într-o negociere. Alege două pe care chiar ești dispus să le citești. Într-o seară grea, oferă o poveste scurtă preferată și o înregistrare salvată anterior.
step.3.title=Redu lumina și lasă ecranele luminoase deoparte
step.3.body=Păstrează suficientă lumină caldă pentru citit, dar scoate videoclipurile și derularea nesfârșită din ritual. Dacă redai audio de pe telefon, pornește-l și apoi nu mai folosi ecranul.
step.4.title=Citește puțin mai rar decât vorbești ziua
step.4.body=Folosește vocea naturală, redu volumul și lasă pauze la întorsul paginii. Nu ai nevoie de actorie elaborată. Un ritm constant face din poveste o punte spre noapte.
step.5.title=Invită la apropiere, nu la examinare
step.5.body=Ajunge o întrebare blândă: „Ce crezi că urmează?” sau „Ce parte ți-a plăcut?” Dacă deja ațipește, lasă cuvintele să curgă fără să verifici înțelegerea.
step.6.title=Încheie cu aceeași frază
step.6.body=Închide cartea, spune că timpul poveștii s-a terminat și folosește urarea cunoscută de noapte bună. Un final previzibil evită să adaugi alte trei activități după ultima pagină.
step.7.title=Pregătește rezerva înainte să ai nevoie de ea
step.7.body=Într-o zi liniștită, înregistrează o poveste preferată sau un mesaj din familie. Când ești epuizat, te doare gâtul sau ești departe, vocea familiară poate susține ritualul cât alt adult apropiat rămâne prezent.
quote.text=Ritualul nu trebuie să fie lung. Trebuie să fie suficient de familiar încât copilul să știe ce urmează.
quote.attribution=Principiul de seară Sleep2Story
checklist.kicker=Pentru o seară obișnuită
checklist.title=Lista de două minute înaintea poveștii
checklist.1=Una sau două povești potrivite sunt pregătite
checklist.2=Povestea se potrivește energiei din seara aceasta
checklist.3=Videoclipurile și notificările sunt deoparte
checklist.4=Locul de citit este comod și sigur
checklist.5=Durata este realistă și pentru adult
checklist.6=Cititul sau rezerva audio este pregătită
checklist.7=Fraza de final rămâne familiară
checklist.8=Este în regulă să te oprești devreme când e liniște
problems.title=Protejează liniștea, nu o serie perfectă
problem.1.question=Sunt epuizat sau mă doare gâtul
problem.1.answer=Alege cea mai scurtă poveste cunoscută, roagă alt adult apropiat sau folosește o înregistrare anterioară. Rămâi aproape dacă cel mic are nevoie, dar nu forța o lectură lungă. Odihnește o voce dureroasă și cere sfatul medicului dacă ești îngrijorat.
problem.2.question=Copilul cere aceeași poveste în fiecare seară
problem.2.answer=Repetiția nu înseamnă lipsă de varietate. Cuvintele cunoscute îi permit copilului să anticipeze, să participe și să se relaxeze. Păstrează favorita și pune uneori o singură opțiune nouă alături.
problem.3.question=Poveștile îl agită și mai tare
problem.3.answer=Mută cărțile dinamice mai devreme, alege seara o intrigă mai scurtă și previzibilă și liniștește tot ce urmează după ultima pagină. Păstrează vocile teatrale pentru zi dacă ridică mereu energia.
problem.4.question=Povestea devine brusc înfricoșătoare
problem.4.answer=Oprește-te în loc să insiști până la final. Numește ce a speriat copilul, amintește-i că este în siguranță cu tine și treci la ceva cunoscut. Puteți reveni la carte în timpul zilei.
problem.5.question=O călătorie sau o seară târzie întrerupe rutina
problem.5.answer=Păstrează două ancore portabile: aceeași poveste scurtă sau înregistrare și aceeași frază finală. Camera și ora se pot schimba, în timp ce ordinea rămâne recognoscibilă.
faq.title=Răspunsuri pentru o culcare mai liniștită
faq.1.question=Cât ar trebui să dureze o poveste de seară?
faq.1.answer=Nu există un număr perfect. Cinci-zece minute sunt un început util pentru multe familii, dar atenția și calmul contează mai mult decât ceasul. Oprește-te mai devreme sau împarte povestea lungă în capitole.
faq.2.question=Sunt bune poveștile audio înainte de somn?
faq.2.answer=Audio poate completa bine ritualul, mai ales cu o voce familiară și un adult disponibil. Este încă o cale de a împărtăși povestea, nu o promisiune de somn și nici înlocuitorul întregii apropieri directe.
faq.3.question=Este în regulă aceeași poveste în fiecare seară?
faq.3.answer=Da. Repetiția ușurează participarea și face ordinea previzibilă. Adaugă varietate treptat, oferind o opțiune cunoscută și una nouă.
faq.4.question=De la ce vârstă pot începe poveștile de seară?
faq.4.answer=Poți începe din primul an cu câteva pagini calme, o rimă sau sunetul unei voci cunoscute. Ajustează cuvintele, imaginile, durata și conversația pe măsură ce cresc limbajul și atenția.
