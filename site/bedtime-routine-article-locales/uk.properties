problems.title=Бережіть спокій, а не ідеальну серію
problem.1.question=Я дуже втомився або в мене болить горло
problem.1.answer=Оберіть найкоротшу знайому казку, попросіть іншого близького дорослого або ввімкніть запис, зроблений раніше. Залишайтеся поруч, якщо це потрібно дитині, але не змушуйте себе довго читати через силу. Дайте голосу відпочити й зверніться до лікаря, якщо стан турбує.
problem.2.question=Дитина щовечора просить ту саму казку
problem.2.answer=Повторення — не брак різноманіття. Знайомі слова дозволяють передбачати, долучатися й розслаблятися. Залиште улюблену книжку та час від часу кладіть поруч один новий варіант.
problem.3.question=Після казки дитина ще більше збуджується
problem.3.answer=Перенесіть динамічні книжки на раніший час, оберіть коротший передбачуваний сюжет і зробіть усе після останньої сторінки тихішим. Гучні голоси персонажів можна лишити для дня.
problem.4.question=Казка раптом налякала дитину
problem.4.answer=Зупиніться замість того, щоб дочитувати за будь-яку ціну. Назвіть те, що видалося страшним, нагадайте, що поруч безпечно, і перейдіть до знайомої історії. За бажанням поверніться до книжки вдень.
problem.5.question=Подорож або пізній вечір збили порядок
problem.5.answer=Збережіть два переносні елементи: ту саму коротку казку чи запис і звичну фінальну фразу. Кімната та час можуть змінитися, а послідовність лишиться впізнаваною.
faq.title=Що ще варто знати перед сном
faq.1.question=Скільки має тривати казка на ніч?
faq.1.answer=Ідеального числа немає. Для багатьох родин зручно почати з п’яти-десяти хвилин, але спокій і увага важливіші за годинник. Завершуйте раніше, якщо дитина розслабилася, а довгу історію діліть на розділи.
faq.2.question=Чи корисно дітям слухати аудіоказки перед сном?
faq.2.answer=Аудіо може бути зручною частиною ритуалу, особливо зі знайомим голосом і доступним дорослим поруч. Це ще один спосіб розділити історію, а не обіцянка миттєвого сну й не повна заміна живого спілкування.
faq.3.question=Чи можна читати ту саму казку щовечора?
faq.3.answer=Так. Повторення допомагає долучатися й робить послідовність передбачуваною. Різноманіття можна додавати м’яко, пропонуючи одну знайому й одну нову історію.
faq.4.question=З якого віку починати казки перед сном?
faq.4.answer=Почати можна вже в немовлячому віці з кількох спокійних сторінок, віршика або просто знайомого голосу. З розвитком мови й уваги змінюйте слова, картинки, тривалість і взаємодію.
