answer.title=Оберіть коротку казку за віком, збережіть кілька звичних сигналів до сну й завершіть читання, поки дитина ще спокійна.
answer.body=Читайте наживо, коли маєте сили. Якщо ви виснажені, захрипли або далеко, знайомий запис допоможе зберегти впізнаваний ритуал без читання через силу.
toc.1=Як обрати казку
toc.2=Ритуал із семи кроків
toc.3=Перелік на сьогодні
toc.4=Типові вечірні труднощі
toc.6=Запитання батьків
setup.kicker=Перед вибором
setup.title=Обирайте історію для дитини саме сьогодні
setup.lead=Вікова позначка — орієнтир, а не правило. Малюк може тиждень просити ту саму картонну книжку, а школяр — розділ повісті, кумедний родинний спогад або аудіоказку з продовженням завтра.
setup.body=Зважайте на три речі: скільки мови дитина здатна спокійно сприймати, наскільки вона бадьора і яке відчуття лишає фінал. Гучні пригоди краще перенести на раніший час, якщо після них важко вгамуватися. Перед сном часто легше слухати знайомі сюжети, лагідний гумор, повтори й чіткий кінець.
kit.1.title=Вік і увага
kit.1.body=Для молодших слухачів обирайте менше героїв і більше повторів; довші сюжети й розділи додавайте зі зростанням уваги.
kit.2.title=Гнучка тривалість
kit.2.body=Почніть із п’яти-десяти спокійних хвилин і дивіться на дитину, а не на годинник. Короткої казки з добрим завершенням достатньо.
kit.3.title=Відчуття після
kit.3.body=Підійде історія, після якої в кімнаті стає тихіше й безпечніше або лишається приємна цікавість замість напруження.
steps.kicker=Хід вечора
steps.title=Сім кроків від метушні до знайомого «на добраніч»
step.1.title=Почніть з однакового невеликого сигналу
step.1.body=Нехай казка завжди йде після чищення зубів, піжами, закритих штор або вибору улюбленої іграшки. Цей сигнал показує, що активна частина дня закінчується.
step.2.title=Запропонуйте дві доречні історії
step.2.body=Велика купа книжок перетворює вкладання на перемовини. Оберіть дві казки, які справді готові прочитати. У дуже втомлений вечір дайте вибір між короткою улюбленою історією та збереженим записом.
step.3.title=Приглушіть світло й відкладіть яскраві екрани
step.3.body=Залиште достатньо теплого світла для читання, але приберіть відео та нескінченне гортання. Якщо вмикаєте аудіо з телефона, запустіть його й більше не торкайтеся екрана.
step.4.title=Читайте трохи повільніше за денну розмову
step.4.body=Говоріть природним голосом, трохи тихіше, з паузами на перегортання. Складна акторська гра не потрібна. Рівний темп робить казку містком до сну, а не новою розвагою.
step.5.title=Запрошуйте до розмови, а не до перевірки
step.5.body=Досить одного лагідного запитання: «Як думаєш, що буде далі?» або «Що тобі сподобалося?» Якщо дитина вже засинає, не перевіряйте розуміння тексту.
step.6.title=Завершуйте тією самою фразою
step.6.body=Закрийте книжку, скажіть, що час казки завершився, і побажайте на добраніч звичними словами. Передбачуваний фінал допомагає не додавати ще три заняття після останньої сторінки.
step.7.title=Підготуйте запасний варіант заздалегідь
step.7.body=У спокійний день запишіть улюблену казку або родинне побажання. Коли ви виснажені, болить горло чи доводиться бути далеко, знайомий голос підтримає ритуал, поки поруч лишається інший дорослий.
quote.text=Ритуал не мусить бути довгим. Він має бути достатньо знайомим, щоб дитина знала, що буде далі.
quote.attribution=Принцип вечірнього ритуалу Sleep2Story
