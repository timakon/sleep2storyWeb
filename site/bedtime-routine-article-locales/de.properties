answer.title=Wählen Sie eine kurze, altersgerechte Geschichte, behalten Sie wenige vertraute Schlafsignale bei und hören Sie auf, solange Ihr Kind noch ruhig ist.
answer.body=Lesen Sie möglichst selbst vor. An sehr müden Tagen, bei heiserer Stimme oder auf Reisen kann eine vertraute Aufnahme das Ritual erhalten, ohne dass jemand sich durch das Vorlesen quälen muss.
toc.1=Die passende Geschichte
toc.2=Sieben Schritte zur Routine
toc.3=Checkliste für heute
toc.4=Typische Stolpersteine
toc.6=Fragen von Eltern
setup.kicker=Vor der Auswahl
setup.title=Wählen Sie für das Kind, das heute vor Ihnen sitzt
setup.lead=Altersangaben bieten Orientierung, sind aber keine Vorschrift. Ein Kleinkind möchte vielleicht eine Woche lang dasselbe Pappbilderbuch hören; ein Schulkind lieber ein Kapitel, eine lustige Familienerinnerung oder eine Hörgeschichte mit Fortsetzung am nächsten Abend.
setup.body=Achten Sie auf drei Dinge: Wie viel Sprache kann Ihr Kind entspannt verfolgen, wie wach ist es noch und mit welchem Gefühl endet die Geschichte? Wilde Abenteuer passen besser in den Nachmittag, wenn sie das Einschlafen erschweren. Vertraute Handlungen, sanfter Humor, Wiederholungen und ein klarer Schluss eignen sich oft besser für den Abend.
kit.1.title=Alter und Aufmerksamkeit
kit.1.body=Jüngere Kinder profitieren von wenigen Figuren und Wiederholungen; längere Handlungen und Kapitel wachsen mit der Aufmerksamkeit mit.
kit.2.title=Flexible Länge
kit.2.body=Beginnen Sie mit fünf bis zehn ruhigen Minuten und achten Sie auf Ihr Kind statt auf die Uhr. Eine kurze, gut beendete Geschichte genügt.
kit.3.title=Das Gefühl danach
kit.3.body=Gut ist eine Geschichte, nach der das Zimmer ruhiger und sicherer wirkt oder angenehme Neugier bleibt statt Anspannung.
steps.kicker=Der Abend
steps.title=Sieben Schritte vom vollen Tag zum vertrauten Gute-Nacht
step.1.title=Beginnen Sie mit demselben kleinen Signal
step.1.body=Die Geschichte kann immer auf Zähneputzen, Schlafanzug, Vorhänge schließen oder die Wahl des Kuscheltiers folgen. Dieses Signal zeigt: Der aktive Teil des Tages geht zu Ende.
step.2.title=Bieten Sie zwei passende Geschichten an
step.2.body=Ein ganzes Regal macht aus dem Zubettgehen schnell eine Verhandlung. Wählen Sie zwei Bücher, die Sie wirklich vorlesen möchten. An sehr müden Abenden stehen ein kurzer Favorit und eine gespeicherte Aufnahme zur Wahl.
step.3.title=Dimmen Sie das Licht und legen Sie helle Bildschirme weg
step.3.body=Nutzen Sie genügend warmes Licht zum Lesen, aber nehmen Sie Videos und endloses Scrollen aus dem Ritual. Wenn das Hörstück vom Handy kommt, starten Sie es zuerst und lassen Sie den Bildschirm danach in Ruhe.
step.4.title=Lesen Sie etwas langsamer als im Alltagsgespräch
step.4.body=Bleiben Sie bei Ihrer natürlichen Stimme, sprechen Sie leiser und lassen Sie beim Umblättern Pausen. Aufwendige Rollenstimmen sind nicht nötig. Ein gleichmäßiges Tempo macht die Geschichte zur Brücke in die Nacht.
step.5.title=Laden Sie zum Austausch ein, nicht zum Test
step.5.body=Eine sanfte Frage reicht: „Was glaubst du, passiert als Nächstes?“ oder „Was hat dir gefallen?“ Ist Ihr Kind schon schläfrig, müssen Sie nicht prüfen, ob jedes Detail angekommen ist.
step.6.title=Beenden Sie den Abend mit demselben Satz
step.6.body=Schließen Sie das Buch, sagen Sie, dass die Geschichtenzeit vorbei ist, und verwenden Sie einen vertrauten Gute-Nacht-Satz. Ein vorhersehbarer Schluss verhindert, dass nach der letzten Seite noch drei Programmpunkte folgen.
step.7.title=Bereiten Sie die müde Lösung vorher vor
step.7.body=Nehmen Sie an einem entspannten Tag eine Lieblingsgeschichte oder eine Familienbotschaft auf. Wenn Sie erschöpft oder heiser sind oder fehlen, unterstützt die vertraute Stimme das Ritual, während eine andere Bezugsperson dabeibleibt.
quote.text=Das Ritual muss nicht lang sein. Es muss vertraut genug sein, damit das Kind weiß, was als Nächstes kommt.
quote.attribution=Sleep2Story-Prinzip für den Abend
checklist.kicker=Für einen normalen Abend
checklist.title=Die Zwei-Minuten-Checkliste zur Gute-Nacht-Geschichte
checklist.1=Ein oder zwei passende Geschichten liegen bereit
checklist.2=Die Geschichte passt zur Energie an diesem Abend
checklist.3=Helle Videos und Benachrichtigungen sind weg
checklist.4=Der Vorleseplatz ist bequem und sicher
checklist.5=Die Länge ist auch für den Erwachsenen realistisch
checklist.6=Vorlesen oder eine Audio-Reserve ist vorbereitet
checklist.7=Der letzte Gute-Nacht-Satz bleibt vertraut
checklist.8=Ein früher Schluss ist erlaubt, wenn Ruhe eingekehrt ist
problems.title=Bewahren Sie die Ruhe, nicht eine perfekte Serie
problem.1.question=Ich bin erschöpft oder meine Stimme tut weh
problem.1.answer=Nehmen Sie den kürzesten vertrauten Text, bitten Sie eine andere vertraute Person oder nutzen Sie eine frühere Aufnahme. Bleiben Sie bei Bedarf in der Nähe, aber erzwingen Sie keine lange Vorstellung. Schonen Sie eine schmerzende Stimme und holen Sie ärztlichen Rat ein, wenn Sie sich Sorgen machen.
problem.2.question=Mein Kind verlangt jeden Abend dieselbe Geschichte
problem.2.answer=Wiederholung ist kein Mangel an Abwechslung. Vertraute Wörter lassen Kinder vorhersagen, mitsprechen und entspannen. Lassen Sie den Favoriten liegen und stellen Sie gelegentlich eine neue Alternative daneben.
problem.3.question=Geschichten machen mein Kind erst richtig munter
problem.3.answer=Lesen Sie lebhafte Bücher früher, wählen Sie abends eine kürzere, vorhersehbare Handlung und gestalten Sie die Zeit nach der letzten Seite leiser. Laute Rollenstimmen dürfen in den Tag wandern, wenn sie regelmäßig aufdrehen.
problem.4.question=Die Geschichte wirkt plötzlich beängstigend
problem.4.answer=Stoppen Sie, statt unbedingt bis zum Ende zu lesen. Benennen Sie, was Angst gemacht hat, geben Sie Sicherheit und wechseln Sie zu etwas Vertrautem. Bei Interesse können Sie das Buch tagsüber wieder ansehen.
problem.5.question=Eine Reise oder ein später Abend unterbricht den Ablauf
problem.5.answer=Nehmen Sie zwei tragbare Anker mit: dieselbe kurze Geschichte oder Aufnahme und denselben Schlusssatz. Raum und Uhrzeit dürfen wechseln, solange die Reihenfolge erkennbar bleibt.
faq.title=Antworten für eine ruhigere Schlafenszeit
faq.1.question=Wie lang sollte eine Gute-Nacht-Geschichte sein?
faq.1.answer=Es gibt keine perfekte Zahl. Fünf bis zehn Minuten sind für viele Familien ein guter Anfang, doch Aufmerksamkeit und Ruhe zählen mehr als die Uhr. Hören Sie früher auf oder teilen Sie längere Bücher in Kapitel.
faq.2.question=Sind Hörgeschichten am Abend gut für Kinder?
faq.2.answer=Audio kann die Routine sinnvoll ergänzen, besonders mit einer vertrauten Stimme und einer erreichbaren Bezugsperson. Es ist eine weitere Form des gemeinsamen Erzählens, kein Einschlafversprechen und kein Ersatz für jede persönliche Nähe.
faq.3.question=Darf es jeden Abend dieselbe Geschichte sein?
faq.3.answer=Ja. Wiederholung erleichtert das Mitmachen und macht den Ablauf vorhersehbar. Abwechslung kommt sanft dazu, wenn ein vertrauter und ein neuer Titel zur Wahl stehen.
faq.4.question=Ab welchem Alter sind Gute-Nacht-Geschichten sinnvoll?
faq.4.answer=Schon im Säuglingsalter können wenige ruhige Seiten, ein Reim oder eine vertraute Stimme dazugehören. Mit Sprache und Aufmerksamkeit wachsen Wortschatz, Bilder, Länge und Austausch mit.
