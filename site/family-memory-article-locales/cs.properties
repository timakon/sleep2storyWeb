prompts.kicker=Nejdřív poznámky
prompts.title=Osm otázek, které vám pomohou najít příběh
prompts.intro=Povídejte si o těchto otázkách s dítětem, nebo si na ně odpovězte sami. Ke každé stačí pár slov. Dítě může vybrat jeden detail, aniž by pomáhalo vymýšlet celou pohádku.
prompt.1.title=Kde jsme byli?
prompt.1.body=Vyberte jedno místo a jeden okamžik: před zahradní brankou po dešti. Nesnažte se obsáhnout všechno, co se v neděli stalo.
prompt.2.title=Jakou drobnost si pamatujeme?
prompt.2.body=Vyberte něco, co vám utkvělo v paměti: žlutý list, vrzání holínek nebo vůni teplého chleba.
prompt.3.title=Kdo bude hlavní postavou?
prompt.3.body=Může to být vaše dítě, vymyšlené dítě, zvíře nebo samotný předmět. Ať se hlavní děj točí kolem jedné postavy.
prompt.4.title=Co si postava přeje?
prompt.4.body=Přání ať je jednoduché: pustit lodičku na vodu, najít rukavici nebo donést dort domů. Příběh tak získá směr.
prompt.5.title=Co jí stojí v cestě?
prompt.5.body=Zkuste malou překážku: lodičku zastaví kamínek nebo nejde zavřít taška. V pohádce na dobrou noc nemusí číhat děsivé nebezpečí.
prompt.6.title=Kdo nebo co může pomoci?
prompt.6.body=Někdo z rodiny, vánek nebo mluvící vrabec může přijít s nápadem. Tady je dobré místo pro jeden vymyšlený prvek.
prompt.7.title=Co postava zkusí udělat?
prompt.7.body=Vyberte činnost, kterou si posluchač snadno představí. Dítě odsune větvičku, vydá se za zvukem nebo najde lehčího pasažéra.
prompt.8.title=Kde dobrodružství končí?
prompt.8.body=Dopřejte příběhu klidný konec: lodička dopluje do přístavu, rukavice najde druhou do páru, všichni se vrátí domů.
outline.title=Sestavte z odpovědí pět vět
outline.intro=Přepište si osnovu na papír a doplňte místa v závorkách. Získáte začátek, prostředek a konec, ještě než začnete hledat správná slova.
outline.1.label=1. Známý začátek
outline.1.text=Jednoho [dne] se [postava] ocitla na [místě], kde [zapamatovaný detail].
outline.2.label=2. Přání
outline.2.text=[Postava] si přála [drobný cíl].
outline.3.label=3. Překážka
outline.3.text=Jenže plán překazila [překážka].
outline.4.label=4. Pokus
outline.4.text=S pomocí [pomocníka] [postava] zkusila [činnost].
outline.5.label=5. Klidný konec
outline.5.text=Nakonec [výsledek] a [postava] [klidná závěrečná činnost].
outline.body=Přečtěte si věty za sebou. Pokud na sebe události navazují, přidejte promluvu a detail, který máte rádi. Pokud se příběh rozbíhá do více směrů, uberte jednu postavu nebo druhou překážku. Při rozvíjení prostřední části mějte na paměti, kam má pohádka dojít.
story.kicker=Původní pohádka ke čtení nahlas
story.title=Lodička z listu
story.intro=Tento vymyšlený příklad začíná obyčejnou rodinnou scénou: dítě s rodičem pouští list po louži. Mluvící vrabec a mráček jako pasažér jsou pohádkové dodatky.
story.1=V neděli našla Mína s tatínkem žlutý list ve tvaru malé lodičky. Položili ho na hladinu louže u zahradní branky.
story.2=„Kam popluje?“ zeptal se tatínek.
story.3=„K moři,“ řekla Mína. Jenže list narazil do kamínku a zastavil se.
story.4=Nedaleko přistál vrabec. „Znám cestu k moři,“ zaštěbetal. „Nejdřív ale musíte vzít na palubu něco, co stojí za svezení.“
story.5=Mína prohledala kapsy. Našla knoflík, hladký kámen a kousek provázku. Všechno bylo moc těžké.
story.6=Pak si všimla mráčku, který se zrcadlil v louži. „A tenhle by se mohl svézt?“
story.7=List se jemně zhoupnul. Uprostřed žlutého listu se usadil měkký bílý mráček.
story.8=Vánek postrčil lodičku kolem kamínku. Obeplula tatínkovu holínku a proplula mezi dvěma ostrovy z bláta. Mína šla vedle ní a ukazovala jí každé nové místo.
story.9=Na druhém konci louže doplul list k trsu trávy.
story.10=„Tohle není moře,“ řekla Mína.
story.11=„Není,“ řekl tatínek. „Ale podívej, kdo sem doplul s námi.“
story.12=Mráček nad nimi pořád plul. Vrabec čekal na brance. A malá lodička je provezla celým odpolednem.
story.13=Mína přenesla list na plochý kámen.
story.14=„Tady máš přístav,“ řekla mu.
story.15=Pak šli s tatínkem domů. Mína nechala holínky u dveří a došla k oknu, aby se ještě jednou podívala ven.
story.16=Žlutá lodička vypadala docela maličká a nebe nad ní obrovské.
adapt.title=Udělejte z pohádky příběh své rodiny
adapt.1.title=Nechte v ní detail, který patří vám
adapt.1.body=Vyměňte zahradní branku za svou ulici, tatínka za jiného blízkého dospělého nebo žlutý list za stočený hnědý. Nechte v příběhu oblíbené rodinné slovíčko. Takové drobné volby mu dodají osobní ráz, aniž byste museli vyprávět celé rodinné dějiny.
adapt.2.title=Řekněte, kde začíná vymýšlení
adapt.2.body=Zkuste říct: „Ten den jsme opravdu pouštěli list po vodě. Co říkal vrabec, to už je vymyšlené.“ Pokud chcete mít i přesnou památku, zapište si zvlášť místo, účastníky a průběh události. Pohádka se pak může měnit, aniž by nahradila záznam vzpomínky.
adapt.3.title=Délku přizpůsobte posluchači
adapt.3.body=V kratší verzi nechte list, kamínek a přístav; vynechte hledání v kapsách. Dítě, které se chce zapojit, může lodičku pojmenovat nebo navrhnout pasažéra. Jeho oblíbený nápad zachovejte, ale pokud se zapojit nechce, nechte ho jen poslouchat.
reading.title=Přečtěte pohádku nahlas a pak se rozhodněte, zda ji nahrajete
reading.body1=Než otevřete diktafon, dokončete text. Vyslovte jména nahlas, rozdělte věty, na kterých se zadrháváte, a ověřte, že je jasné, kdo mluví. Přečtěte i závěr: má dobrodružství ukončit, ne otevřít další problém.
reading.body2=Chcete-li zachovat přesně své čtení, nahrajte celou pohádku na telefon. Zůstanou v ní vaše pauzy, smích i výslovnost. Náš návod vás provede krátkou zkouškou zvuku a uložením hotového souboru:
reading.recording_link=jak nahrát pohádku na dobrou noc
reading.body3=Hotový text si můžete nechat i na jiný večer. Není nutné psát, zkoušet čtení a nahrávat těsně před spaním. Na dnešek si vyberte některou z možností v našem návodu pro
reading.tired_link=rodiče, kteří jsou na čtení příliš unavení
product.eyebrow=Připravujeme · iOS a Android
product.title=Váš hotový text k poslechu
product.body=Sleep2Story vyvíjíme pro syntetické namluvení celého textu pohádky, který dodá dospělý. Hlas má vycházet ze vzorku hlasu dospělého člena rodiny s jeho souhlasem. Počítáme také s osobní knihovnou příběhů a přehrávačem. Aplikace pohádku nepíše ani neuchovává původní nahrávku toho, jak ji tento dospělý přečetl.
product.body2=Aplikace se stále připravuje k vydání. Příběhy má namlouvat anglicky a rusky; další jazyky webu neznamenají podporu namluvení v těchto jazycích. Svou rodinnou pohádku můžete už teď napsat, přečíst a nahrát běžným diktafonem v telefonu.
product.cta=Podívejte se, jak funguje Sleep2Story
faq.title=Otázky k pohádkám z rodinných vzpomínek
faq.1.question=Musí být každý detail pravdivý?
faq.1.answer=Nemusí. Řekněte dítěti, kterou část si pamatujete a kterou jste vymysleli. Pokud chcete mít i rodinný záznam, uchovejte poznámky o skutečných událostech odděleně od pohádky.
faq.2.question=Můžeme si hlavní postavu vymyslet?
faq.2.answer=Ano. Skutečnou osobu může zastoupit liška, lodička na hraní nebo vymyšlené dítě. Ponechte jeden známý detail, aby příběh stále souvisel se vzpomínkou.
faq.3.question=Co když se dítě nechce zapojit?
faq.3.answer=Napište pohádku sami a nabídněte dítěti, že mu ji přečtete. Může poslouchat, vybrat jméno později nebo si říct o jiný příběh. Zapojit se nemusí.
faq.4.question=Jak dlouhá má rodinná pohádka být?
faq.4.answer=Začněte verzí o pěti větách a přečtěte ji nahlas. Pokud máte vy i dítě chuť pokračovat, přidejte podrobnosti. Zvolte konec, ke kterému dojdete bez spěchu a zbytečné námahy. Žádná povinná doba čtení neexistuje.
faq.5.question=Napíše Sleep2Story pohádku za mě?
faq.5.answer=Ne. Celý text dodává dospělý. Sleep2Story se připravuje pro syntetické namluvení tohoto textu v angličtině nebo ruštině podle hlasového vzorku dospělé osoby s jejím souhlasem. Aplikace zatím není dostupná v obchodech s aplikacemi.
