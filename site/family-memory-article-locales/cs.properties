sources.body=Činnost od PBS nabízí výrobu knížky z rodinných vzpomínek. Osm otázek, osnova o pěti větách a „Lodička z listu“ jsou původní materiály redakce Sleep2Story. Příklad je smyšlený, nejde o zkušenost skutečné rodiny; uvedený zdroj Sleep2Story nehodnotí.
