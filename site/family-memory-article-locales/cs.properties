memory.title=Která rodinná vzpomínka se hodí do pohádky?
memory.body1=Vyberte scénu, kterou si dokážete vybavit: louži u branky, kuchyňský stůl poprášený moukou, cestu autobusem s babičkou nebo dědečkem. Celá dovolená se do krátké pohádky vejde těžko. Ale odpoledne, kdy jste zachraňovali klobouk ze živého plotu, už nabízí místo, překážku i konec.
memory.body2=Vyberte vzpomínku, ke které se všichni zúčastnění rádi vracejí. Než použijete osobní příběh jiného dospělého, požádejte ho o souhlas, zvlášť pokud se o pohádku chcete podělit i mimo rodinu. Vynechte trapnou příhodu dítěte, jestliže o ní nerado slyší. Pro začátek stačí obyčejná milá drobnost.
memory.source=PBS KIDS for Parents nabízí podobnou činnost od Fred Rogers Productions: vlastnoručně vyrobit knížku podle rodinné vzpomínky.
memory.source_link=Podívejte se na nápad s rodinnou knížkou
memory.grandparents_link=Požádejte babičku nebo dědečka o vzpomínku.
memory.grandparents_body=Fotografie nebo známý předmět vám mohou pomoci začít rozhovor.
