answer.title=Zachovejte jeden skutečný detail. Přidejte malé dobrodružství.
answer.body=Vyberte vzpomínku, dejte postavě cíl, přidejte překonatelnou překážku a doveďte příběh k jasnému konci. Nejprve napište pět vět. Doplňte krátký rozhovor a jedno vymyšlené překvapení. Máte pohádku, kterou můžete přečíst nahlas.
