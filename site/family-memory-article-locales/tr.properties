sources.body=PBS etkinliği, aile anılarından bir kitap hazırlamayı öneriyor. Sekiz soru, beş cümlelik taslak ve Yapraktan Kayık, Sleep2Story editörlerinin özgün çalışmalarıdır. Örnek kurmacadır, gerçek bir ailenin deneyimini anlatmaz; kaynak Sleep2Story hakkında bir değerlendirme yapmaz.
