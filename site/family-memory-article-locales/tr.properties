answer.title=Gerçek bir ayrıntıyı koruyun. Küçük bir macera ekleyin.
answer.body=Bir anı seçin, karakterinize yapacak bir şey verin, aşabileceği bir engel ekleyin ve hikâyeyi belli bir sona ulaştırın. Önce beş cümle yazın. Biraz konuşma ve hayal ürünü bir sürpriz eklediğinizde yüksek sesle okuyabileceğiniz bir hikâyeniz olur.
