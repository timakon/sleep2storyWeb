memory.title=Hangi aile anısı bir hikâyeye dönüşebilir?
memory.body1=Gözünüzde canlandırabildiğiniz bir sahne seçin: kapının yanındaki su birikintisi, un serpilmiş mutfak masası, büyükanne veya dedeyle yapılan bir otobüs yolculuğu. Bütün bir tatili kısa bir hikâyeye sığdırmak zordur. Oysa çitlere takılan bir şapkayı kurtardığınız öğleden sonra, size zaten bir yer, bir sorun ve bir son verir.
memory.body2=İçinde yer alan kişilerin yeniden anlatılmasından rahatsız olmayacağı bir anı seçin. Başka bir yetişkinin kişisel hikâyesini kullanmadan önce, özellikle aile dışıyla paylaşmayı düşünüyorsanız, kendisine sorun. Çocuğunuz onu utandıran bir olayın anlatılmasını istemiyorsa o olayı kullanmayın. Başlamak için sıradan, güzel bir ayrıntı yeterlidir.
memory.source=PBS KIDS for Parents, Fred Rogers Productions'ın benzer bir etkinliğine yer veriyor: bir aile anısından yola çıkarak el yapımı bir kitap hazırlamak.
memory.source_link=Aile hikâyesi kitabı etkinliğine bakın
memory.grandparents_link=Büyükanne veya dededen bir anısını anlatmasını isteyin.
memory.grandparents_body=Bir fotoğraf ya da tanıdık bir eşya, sohbete nereden başlayacağınızı bulmanıza yardımcı olabilir.
figure.alt=Bir ebeveyn ve çocuğun su birikintisindeki sarı yapraktan kayığa ve bulutun yansımasına baktığı, sıcak tonlarda bir çizim
figure.caption=Bir su birikintisi, bir yaprak ve birlikte geçen bir öğleden sonra: küçük bir macera için yeterli.
prompts.kicker=Önce notlar, sonra cümleler
prompts.title=Hikâyenizi bulmanıza yardımcı olacak sekiz soru
prompts.intro=Bu soruları çocuğunuzla konuşabilir ya da kendiniz yanıtlayabilirsiniz. Her soru için birkaç kelime yeterlidir. Çocuğunuz, bütün hikâyenin yazımına katılmadan tek bir ayrıntı seçebilir.
prompt.1.title=Neredeydik?
prompt.1.body=Bir yer ve bir an seçin: pazar günü olan her şey yerine, yağmurdan sonra bahçe kapısının önünde geçen bir an.
prompt.2.title=Hangi küçük ayrıntıyı hatırlıyoruz?
prompt.2.body=Gördüğünüz, duyduğunuz, dokunduğunuz ya da kokladığınız bir şeyi seçin: sarı bir yaprak, gıcırdayan çizmeler veya sıcak ekmek kokusu.
prompt.3.title=Hikâyenin ana karakteri kim olacak?
prompt.3.body=Çocuğunuz, hayal ürünü bir çocuk, bir hayvan veya eşyanın kendisi olabilir. Olayların merkezinde tek bir karakter olsun.
prompt.4.title=Bu karakter ne istiyor?
prompt.4.body=İsteği basit tutun: bir kayığı yüzdürmek, eldivenini bulmak ya da bir pastayı eve götürmek. Bu istek, hikâyeye bir yön verir.
prompt.5.title=Önüne ne engel çıkıyor?
prompt.5.body=Küçük bir engel deneyin: bir çakıl taşı kayığın yolunu keser ya da çanta bir türlü kapanmaz. Uyku masalında korkutucu bir tehlike olması gerekmez.
prompt.6.title=Kim veya ne yardım edebilir?
prompt.6.body=Bir akraba, hafif bir rüzgâr ya da konuşan bir serçe bir fikir verebilir. Burası, hayal ürünü bir unsur eklemek için uygun bir yer.
prompt.7.title=Karakter neyi deniyor?
prompt.7.body=Dinleyenin gözünde canlandırabileceği bir hareket seçin. Çocuk bir dalı kenara iter, bir sesin peşinden gider ya da daha hafif bir yolcu bulur.
prompt.8.title=Macera nerede bitiyor?
prompt.8.body=Hikâyeye dinlenecek bir yer bulun: kayık limanına ulaşır, eldiven tekini bulur, herkes evine döner.
outline.title=Yanıtlarınızı beş cümleye dönüştürün
outline.intro=Bu taslağı kâğıda geçirin ve köşeli parantezleri doldurun. Böylece cümleleri güzelleştirmeye başlamadan önce bir başlangıcınız, gelişmeniz ve sonunuz olur.
outline.1.label=1. Tanıdık bir başlangıç
outline.1.text=Bir [gün], [karakter] [neredeydi] ve orada [hatırlanan ayrıntı].
outline.2.label=2. Bir istek
outline.2.text=[Karakter], [ne yapmak] istiyordu.
outline.3.label=3. Bir sorun
outline.3.text=Ama [engel] planı bozdu.
outline.4.label=4. Bir deneme
outline.4.text=[Yardım eden kişi veya şey] yardım edince, [karakter] [ne yapmayı denedi].
outline.5.label=5. Bir durak
outline.5.text=Sonunda [sonuç] ve [karakter] [son, sakin hareket].
outline.body=Cümleleri sırayla okuyun. Olaylar anlaşılır biçimde ilerliyorsa bir konuşma cümlesi ve sevdiğiniz bir ayrıntı ekleyin. Hikâye dağılıyorsa bir karakteri veya ikinci sorunu çıkarın. Ortasını genişletirken nereye varacağınızı aklınızda tutun.
story.kicker=Yüksek sesle okumak için özgün bir hikâye
story.title=Yapraktan Kayık
story.intro=Bu kurmaca örnek, sıradan bir aile anıyla başlıyor: bir çocuk ve ebeveyni su birikintisinde bir yaprak yüzdürüyor. Konuşan serçe ve yolcu olan bulut ise hikâyeye eklenen masal öğeleri.
story.1=Pazar günü Mina ile babası, küçük bir kayığa benzeyen sarı bir yaprak buldular. Onu bahçe kapısının yanındaki su birikintisine bıraktılar.
story.2=“Nereye gitsin?” diye sordu babası.
story.3=“Denize,” dedi Mina. Ama yaprak bir çakıl taşına çarpıp durdu.
story.4=Yakınlarına bir serçe kondu. “Ben denizin yolunu biliyorum,” diye cıvıldadı. “Ama önce yanınıza götürmeye değer bir şey almalısınız.”
story.5=Mina ceplerini karıştırdı. Bir düğme, pürüzsüz bir taş ve bir parça ip buldu. Hepsi fazla ağırdı.
story.6=Sonra su birikintisine yansıyan bir bulut fark etti. “Onu taşıyabilir misin?”
story.7=Yaprak hafifçe sallandı. Yumuşacık, beyaz bulut yaprağın sarı ortasına yerleşti.
story.8=Hafif bir rüzgâr küçük kayığı itip çakıl taşının yanından geçirdi. Kayık, babasının çizmesinin çevresinden dolaştı ve çamurdan iki adanın arasından süzüldü. Mina yanında yürüyüp geçtiği her yeni yeri ona gösterdi.
story.9=Su birikintisinin öbür ucunda yaprak, bir tutam çimene ulaştı.
story.10=“Burası deniz değil,” dedi Mina.
story.11=“Değil,” dedi babası. “Ama bak, bizimle kimler geldi.”
story.12=Bulut hâlâ tepelerinde süzülüyordu. Serçe kapının üstünde bekliyordu. Küçük kayıkları onları koca bir öğleden sonranın içinden geçirip buraya getirmişti.
story.13=Mina yaprağı kaldırıp düz bir taşın üstüne koydu.
story.14=“İşte limanın,” dedi ona.
story.15=Sonra babasıyla eve girdiler. Mina çizmelerini kapının yanında bıraktı ve son bir kez bakmak için pencereye gitti.
story.16=Sarı kayık küçücük görünüyordu; üzerindeki gökyüzü ise uçsuz bucaksızdı.
adapt.title=Hikâyeyi ailenize uyarlayın
adapt.1.title=Size ait olan ayrıntıyı koruyun
adapt.1.body=Bahçe kapısının yerine sokağınızı, babanın yerine tanıdık başka bir yetişkini, sarı yaprağın yerine kıvrılmış kahverengi bir yaprağı koyabilirsiniz. Ailenizin sevdiği bir kelimeyi koruyun. Bu küçük seçimler, uzun bir aile geçmişi anlatmanıza gerek kalmadan hikâyeyi size ait kılar.
adapt.2.title=Hayalin nerede başladığını söyleyin
adapt.2.body=Şöyle diyebilirsiniz: “O gün gerçekten bir yaprak yüzdürmüştük. Serçenin söylediklerini ben uydurdum.” Anının gerçeğe uygun bir kaydı da olsun istiyorsanız yeri, kişileri ve yaşananları ayrı bir nota yazın. Böylece masal değişebilir, anının kaydı da olduğu gibi kalır.
adapt.3.title=Uzunluğu dinleyene göre ayarlayın
adapt.3.body=Daha kısa bir anlatım için yaprağı, çakıl taşını ve limanı koruyun; cepleri karıştırma bölümünü atlayın. Katılmak isteyen bir çocuk kayığa isim verebilir veya bir yolcu önerebilir. En sevdiği fikri kullanın; katılmak istemiyorsa yalnızca dinlemesi de yeterli olsun.
reading.title=Yüksek sesle okuyun, sonra kaydedip kaydetmeyeceğinize karar verin
reading.body1=Kaydı açmadan önce metni bitirin. İsimleri yüksek sesle söyleyin, okurken takıldığınız cümleleri bölün ve kimin konuştuğunun belli olduğundan emin olun. Sonunu da okuyun: yeni bir sorun başlatmak yerine macerayı bitirmeli.
reading.body2=Kendi okuyuşunuzu olduğu gibi saklamak için hikâyenin tamamını telefonla kaydedin. Böylece duraklamalarınız, gülüşünüz ve telaffuzunuz korunur. Rehberimizde kısa bir ses denemesi yapmayı ve biten kaydı saklamayı anlatıyoruz:
reading.recording_link=uyku masalı kaydetme rehberi
reading.body3=Metni başka bir akşam için hazır da bırakabilirsiniz. Yazmayı, prova yapmayı ve kaydetmeyi uyku saatine sığdırmanız gerekmez. Bu akşam için şu rehberdeki seçeneklere bakın:
reading.tired_link=masal okumaya hâli olmayan anne babalara öneriler
product.eyebrow=Hazırlık aşamasında · iOS ve Android
product.title=Tamamladığınız metin dinlemeye hazır hâle gelsin
product.body=Sleep2Story, bir yetişkinin sağladığı tam hikâye metnini, rızasını vermiş yetişkin bir aile üyesinin ses örneğini kullanarak sentetik seslendirmeye dönüştürmek üzere geliştiriliyor. Planlanan uygulamada kişisel hikâye kütüphanesi ve ses oynatıcısı bulunuyor. Hikâyeyi uygulama yazmaz; üretilen seslendirme, yetişkinin metnin tamamını kendi sesiyle okuduğu gerçek bir kayıt değildir.
product.body2=Uygulama henüz yayımlanmaya hazırlanıyor. Seslendirme İngilizce ve Rusça için planlanıyor; sitedeki diğer diller, o dillerde seslendirme desteği olduğu anlamına gelmiyor. Aile hikâyenizi şimdiden yazabilir, okuyabilir ve telefonunuzun sıradan ses kaydedicisiyle kaydedebilirsiniz.
product.cta=Sleep2Story'nin nasıl çalıştığını görün
faq.title=Anıları hikâyeye dönüştürmek hakkında sorular
faq.1.question=Her ayrıntı gerçek olmak zorunda mı?
faq.1.answer=Hayır. Çocuğunuza hangi kısmı hatırladığınızı, hangi kısmı hayal ettiğinizi söyleyin. Aileniz için gerçek olayların kaydını da tutmak istiyorsanız bu notları masaldan ayrı saklayın.
faq.2.question=Ana karakteri kendimiz uydurabilir miyiz?
faq.2.answer=Evet. Gerçek bir kişinin yerini bir tilki, oyuncak kayık veya hayal ürünü bir çocuk alabilir. Hikâyenin anıyla bağını koruması için tanıdık bir ayrıntıyı bırakın.
faq.3.question=Çocuğum katılmak istemezse ne yapmalıyım?
faq.3.answer=Hikâyeyi kendiniz yazın ve dinlemesini önerin. Çocuğunuz dinleyebilir, daha sonra bir isim seçebilir veya başka bir hikâye isteyebilir. Katılmak zorunda değildir.
faq.4.question=Aile hikâyemiz ne kadar uzun olmalı?
faq.4.answer=Beş cümlelik anlatımla başlayın ve yüksek sesle okuyun. İkiniz de devamını istiyorsanız ayrıntı ekleyin. Rahatça ulaşabileceğiniz bir son seçin; uymanız gereken bir okuma süresi yok.
faq.5.question=Sleep2Story hikâyeyi benim yerime yazar mı?
faq.5.answer=Hayır. Metnin tamamını yetişkin sağlar. Sleep2Story, bu metin ve rızasını vermiş bir yetişkinin ses örneğinden İngilizce veya Rusça seslendirme üretmek üzere hazırlanıyor. Henüz uygulama mağazalarında bulunmuyor.
