memory.title=Який сімейний спогад може стати казкою?
memory.body1=Оберіть сцену, яку легко уявити: калюжу біля хвіртки, кухонний стіл у борошні, поїздку автобусом із бабусею чи дідусем. Цілу відпустку важко вмістити в коротку казку. А от день, коли ви діставали капелюха з живоплоту, вже дає місце дії, перешкоду й завершення.
memory.body2=Оберіть спогад, до якого всім учасникам приємно повертатися. Перш ніж використати особисту історію іншого дорослого, запитайте його згоди, особливо якщо плануєте ділитися казкою поза родиною. Не включайте незручний для дитини випадок, якщо їй неприємно його чути. Для початку вистачить звичайної радісної деталі.
memory.source=PBS KIDS for Parents пропонує схоже заняття від Fred Rogers Productions: власноруч зробити книжечку на основі сімейного спогаду.
memory.source_link=Переглянути ідею сімейної книжечки
memory.grandparents_link=Попросіть бабусю чи дідуся поділитися спогадом.
memory.grandparents_body=Фотографія або знайома річ допоможе почати розмову.
