answer.title=Залиште одну справжню деталь. Додайте маленьку пригоду.
answer.body=Оберіть спогад, дайте персонажеві мету, додайте посильну перешкоду й доведіть історію до зрозумілого завершення. Спершу напишіть п’ять речень. Додайте трохи діалогу та одну вигадану несподіванку — і матимете казку, яку можна прочитати вголос.
