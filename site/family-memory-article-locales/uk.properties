figure.caption=Калюжа, листок і день разом — цього досить для маленької пригоди.
prompts.kicker=Спершу нотатки
prompts.title=Вісім запитань, щоб знайти свою історію
prompts.intro=Обговоріть ці запитання з дитиною або дайте відповіді самі. На кожне вистачить кількох слів. Дитина може обрати одну деталь, не беручи участі в написанні всієї казки.
prompt.1.title=Де ми були?
prompt.1.body=Назвіть одне місце й одну мить: біля садової хвіртки після дощу. Не намагайтеся охопити все, що сталося в неділю.
prompt.2.title=Яку дрібницю ми пам’ятаємо?
prompt.2.body=Оберіть щось, що можна було побачити, почути чи відчути: жовтий листок, рипіння чобіт або запах теплого хліба.
prompt.3.title=Хто буде головним персонажем?
prompt.3.body=Ваша дитина, вигадана дитина, тварина чи сам предмет. Нехай основні події відбуваються навколо одного персонажа.
prompt.4.title=Чого хоче цей персонаж?
prompt.4.body=Нехай бажання буде простим: пустити човник, знайти рукавичку чи донести торт додому. Воно задасть історії напрямок.
prompt.5.title=Що заважає?
prompt.5.body=Додайте невелику перешкоду: камінець зупинив човник або сумка ніяк не застібається. Казка на ніч може обійтися без страшної небезпеки.
prompt.6.title=Хто або що може допомогти?
prompt.6.body=Хтось із рідних, вітерець або балакучий горобець може підказати ідею. Саме тут доречно додати щось вигадане.
prompt.7.title=Що спробує зробити персонаж?
prompt.7.body=Оберіть дію, яку слухач легко уявить. Дитина відсуває гілочку, йде на звук або знаходить легшого пасажира.
prompt.8.title=Де завершиться пригода?
prompt.8.body=Приведіть історію до спокійного завершення: човник дістався гавані, рукавичка знайшла свою пару, усі повернулися додому.
outline.title=Складіть із відповідей п’ять речень
outline.intro=Перепишіть цей план на папір і заповніть дужки. Так у вас з’являться початок, середина й кінець, перш ніж ви добиратимете слова.
outline.1.label=1. Знайомий початок
outline.1.text=Одного [дня] [персонаж] опинився в [місці], де [деталь зі спогаду].
outline.2.label=2. Бажання
outline.2.text=[Персонаж] хотів [невелика мета].
outline.3.label=3. Перешкода
outline.3.text=Але здійснити задум завадила [перешкода].
outline.4.label=4. Спроба
outline.4.text=За допомогою [помічника] [персонаж] спробував [дія].
outline.5.label=5. Спокійне завершення
outline.5.text=Нарешті [результат], і [персонаж] [спокійна дія наприкінці].
outline.body=Прочитайте речення по черзі. Якщо події пов’язані між собою, додайте репліку й деталь, яка вам подобається. Якщо історія розпорошується, приберіть одного персонажа або другу перешкоду. Доповнюючи середину, пам’ятайте, куди має привести казка.
story.kicker=Авторська казка для читання вголос
story.title=Човник із листка
story.intro=Цей вигаданий приклад починається зі звичайної сімейної сцени: дитина з кимось із батьків пускає листок по калюжі. Балакучий горобець і хмаринка-пасажирка — казкові доповнення.
story.1=У неділю Міна й тато знайшли жовтий листок, схожий на маленький човник. Вони опустили його в калюжу біля садової хвіртки.
story.2=— Куди він попливе? — запитав тато.
story.3=— До моря, — сказала Міна. Але листок наштовхнувся на камінець і зупинився.
story.4=Поруч сів горобець. — Я знаю дорогу до моря, — цвірінькнув він. — Та спершу візьміть на борт щось варте подорожі.
story.5=Міна пошукала в кишенях. Знайшлися ґудзик, гладенький камінь і шматочок мотузки. Усе було надто важке.
story.6=Аж тут вона помітила хмаринку, що відбивалася в калюжі. — А її повезеш?
story.7=Листок легенько гойднувся. Біла м’яка хмаринка вмостилася в його жовтій серединці.
story.8=Вітерець підштовхнув човник повз камінець. Той обігнув татів чобіт і проплив між двома острівцями з багнюки. Міна йшла поруч і показувала йому кожне нове місце.
story.9=На протилежному краю калюжі листок пристав до трави.
story.10=— Це ж не море, — сказала Міна.
story.11=— Ні, — відповів тато. — Але поглянь, хто дістався сюди разом із нами.
story.12=Угорі й далі пливла хмаринка. На хвіртці чекав горобець. А маленький човник провіз їх крізь цілий недільний день.
story.13=Міна переклала листок на плаский камінь.
story.14=— Ось твоя гавань, — сказала вона.
story.15=Потім вони з татом зайшли до хати. Міна залишила чоботи біля дверей і підійшла до вікна, щоб поглянути ще раз.
story.16=Жовтий човник здавався зовсім крихітним, а небо над ним — безкраїм.
adapt.title=Зробіть казку своєю сімейною історією
adapt.1.title=Збережіть деталь, яка належить саме вам
adapt.1.body=Замініть садову хвіртку на свою вулицю, тата — на іншого знайомого дорослого, а жовтий листок — на скручений коричневий. Залиште улюблене сімейне слівце. Так казка стане вашою без довгої розповіді про всю родину.
adapt.2.title=Поясніть, де починається вигадка
adapt.2.body=Можна сказати: «Того дня ми справді пускали листок по воді. А слова горобця — це вже вигадка». Якщо хочете зберегти й точний спогад, окремо занотуйте місце, учасників і те, що сталося. Тоді казку можна буде змінювати, не підміняючи нею справжню історію.
adapt.3.title=Орієнтуйтеся на слухача
adapt.3.body=Щоб скоротити казку, залиште листок, камінець і гавань, а пошуки в кишенях пропустіть. Якщо дитина хоче долучитися, запропонуйте їй назвати човник або обрати пасажира. Збережіть її улюблену ідею, але дозвольте просто слухати, якщо вигадувати разом не хочеться.
reading.title=Прочитайте вголос, а потім вирішіть, чи робити запис
reading.body1=Завершіть текст, перш ніж відкривати диктофон. Вимовте імена вголос, розділіть речення, на яких спотикаєтеся, і перевірте, чи зрозуміло, хто говорить. Прочитайте також кінцівку: вона має завершувати пригоду, а не починати нову проблему.
reading.body2=Щоб зберегти саме ваше читання, запишіть усю казку на телефон. Так залишаться ваші паузи, сміх і вимова. У нашій інструкції є коротка перевірка звуку та поради зі збереження готового файлу:
reading.recording_link=як записати казку на ніч
reading.body3=Можна й відкласти готовий текст до іншого вечора. Не обов’язково писати, репетирувати й записувати просто перед сном. А на сьогодні оберіть варіант із наших порад для
reading.tired_link=батьків, яким бракує сил читати
product.eyebrow=Готуємо до випуску · iOS та Android
product.title=Ваш готовий текст — для прослуховування
product.body=Sleep2Story розробляють, щоб перетворювати повний текст казки, наданий дорослим, на синтезовану озвучку. Для цього використовуватиметься зразок голосу повнолітнього члена родини за його згодою. У застосунку заплановано особисту бібліотеку казок і програвач. Він не пише казку й не зберігає оригінальний запис того, як цей дорослий прочитав її слова.
product.body2=Застосунок іще готується до випуску. Озвучку заплановано англійською та російською; інші мови сайту не означають підтримки озвучки цими мовами. Написати, прочитати й записати сімейну казку звичайним диктофоном на телефоні можна вже зараз.
product.cta=Дізнатися, як працює Sleep2Story
faq.title=Запитання про казки із сімейних спогадів
faq.1.question=Чи кожна деталь має бути правдивою?
faq.1.answer=Ні. Розкажіть дитині, що було насправді, а що ви вигадали. Якщо хочете також зберегти спогад для родини, тримайте фактичні нотатки окремо від казки.
faq.2.question=Чи можна вигадати головного персонажа?
faq.2.answer=Так. Замість реальної людини в казці може бути лисичка, іграшковий човник або вигадана дитина. Залиште одну знайому деталь, яка пов’язуватиме історію зі спогадом.
faq.3.question=Що робити, якщо дитина не хоче долучатися?
faq.3.answer=Напишіть казку самі й запропонуйте її послухати. Дитина може просто слухати, пізніше обрати ім’я або попросити іншу історію. Участь у вигадуванні не обов’язкова.
faq.4.question=Якої довжини має бути сімейна казка?
faq.4.answer=Почніть із п’яти речень і прочитайте їх уголос. Додавайте подробиці, якщо вам обом хочеться продовжити. Оберіть завершення, до якого зможете дійти без поспіху й зайвих зусиль: обов’язкової тривалості читання немає.
faq.5.question=Чи напише Sleep2Story казку замість мене?
faq.5.answer=Ні. Повний текст надає дорослий. Sleep2Story готують до створення озвучки англійською чи російською на основі цього тексту та зразка голосу повнолітньої людини за її згодою. Застосунок ще недоступний у магазинах застосунків.
