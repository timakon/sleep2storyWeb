sources.title=Джерело та примітка редакції
sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: книжечка із сімейних спогадів
sources.body=Заняття від PBS пропонує зробити книжечку із сімейних спогадів. Вісім запитань, план із п’яти речень і «Човник із листка» — оригінальні матеріали редакції Sleep2Story. Приклад вигаданий і не є відгуком родини; джерело не оцінює Sleep2Story.
