answer.title=진짜 기억 하나를 남기고 작은 모험 하나를 더하세요.
answer.body=추억 한 장면을 골라 등장인물에게 할 일을 주고, 넘어설 만한 작은 어려움을 놓은 뒤 분명하게 끝맺으세요. 먼저 다섯 문장으로 써 보세요. 짧은 대화와 상상에서 나온 뜻밖의 일 하나를 더하면 소리 내어 읽을 이야기가 됩니다.
