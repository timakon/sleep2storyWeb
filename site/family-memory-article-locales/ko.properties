memory.title=어떤 가족의 추억을 이야기로 만들 수 있을까요?
memory.body1=눈앞에 그려지는 장면을 고르세요. 대문 앞 웅덩이, 밀가루가 묻은 식탁, 조부모와 함께 탄 버스 같은 장면이요. 휴가 전체를 짧은 이야기에 담기는 어렵습니다. 반면 울타리에 걸린 모자를 꺼냈던 오후에는 이미 장소와 문제, 결말이 있습니다.
memory.body2=그 추억에 등장하는 사람들이 편하게 떠올릴 수 있는 일을 고르세요. 다른 어른의 사적인 이야기를 쓰려면 먼저 물어보세요. 가족 밖에 공유할 생각이라면 더 중요합니다. 아이가 듣기 싫어하는 창피한 순간은 빼 주세요. 소소하게 즐거웠던 일 하나면 시작하기에 충분합니다.
memory.source=PBS KIDS for Parents에는 Fred Rogers Productions가 제안한 비슷한 활동이 있습니다. 가족의 추억으로 손수 책을 만드는 활동입니다.
memory.source_link=가족 이야기책 만들기 활동 보기
memory.grandparents_link=조부모님께 추억을 물어보세요.
memory.grandparents_body=사진이나 익숙한 물건 하나가 대화의 시작이 될 수 있습니다.
figure.alt=물에 비친 구름과 노란 나뭇잎 배가 있는 웅덩이 옆에 부모와 아이가 서 있는 따뜻한 그림
figure.caption=웅덩이와 나뭇잎, 함께 보낸 오후면 작은 모험을 시작하기에 충분합니다.
prompts.kicker=문장을 쓰기 전에 짧게 메모해요
prompts.title=이야기를 찾는 여덟 가지 질문
prompts.intro=아이와 이야기를 나누며 질문해도 좋고 혼자 답해도 좋습니다. 질문마다 몇 마디면 충분해요. 아이는 이야기 전체를 쓰지 않아도 좋아하는 부분 하나를 고를 수 있습니다.
prompt.1.title=어디에 있었나요?
prompt.1.body=일요일에 있었던 모든 일을 나열하기보다 ‘비 온 뒤 정원 대문 앞’처럼 장소와 순간 하나를 정하세요.
prompt.2.title=기억나는 작은 것은 무엇인가요?
prompt.2.body=노란 나뭇잎, 삐걱거리는 장화, 갓 구운 빵 냄새처럼 보거나 듣거나 만질 수 있었던 것을 고르세요.
prompt.3.title=누구를 따라가는 이야기인가요?
prompt.3.body=우리 아이, 상상 속 아이, 동물, 또는 물건 자체도 주인공이 될 수 있습니다. 한 등장인물이 주요 행동을 하게 해 보세요.
prompt.4.title=그 주인공은 무엇을 원하나요?
prompt.4.body=배를 띄우기, 장갑을 찾기, 케이크를 집에 가져가기처럼 간단한 바람이면 됩니다. 이야기의 방향이 생겨요.
prompt.5.title=무엇이 앞을 가로막나요?
prompt.5.body=돌멩이가 배를 막거나 가방이 잘 닫히지 않는 정도의 작은 어려움을 넣어 보세요. 잠자리 이야기에 무서운 위험은 필요 없습니다.
prompt.6.title=누가, 또는 무엇이 도와줄까요?
prompt.6.body=가족 한 명이나 산들바람, 말하는 참새가 좋은 생각을 줄 수 있어요. 상상 속 요소 하나를 넣기에도 좋은 자리입니다.
prompt.7.title=주인공은 무엇을 해 보나요?
prompt.7.body=듣는 아이가 그릴 수 있는 행동을 고르세요. 작은 나뭇가지를 옮기거나 소리를 따라가거나 더 가벼운 승객을 찾는 식으로요.
prompt.8.title=모험은 어디서 끝나나요?
prompt.8.body=이야기가 쉴 곳을 만들어 주세요. 배가 항구에 닿고, 장갑이 짝을 찾고, 모두 집으로 돌아오는 결말이면 됩니다.
outline.title=대답을 다섯 문장으로 엮어 보세요
outline.intro=이 틀을 종이에 옮겨 괄호 안을 채워 보세요. 문장을 다듬기 전에 시작과 중간, 끝을 잡을 수 있습니다.
outline.1.label=1. 익숙한 시작
outline.1.text=어느 [날], [주인공]은 [장소]에 있었어요. 그곳에는 [기억나는 것]이 있었지요.
outline.2.label=2. 바람
outline.2.text=[주인공]은 [작은 목표]를 하고 싶었어요.
outline.3.label=3. 문제
outline.3.text=하지만 [방해가 되는 것] 때문에 뜻대로 되지 않았어요.
outline.4.label=4. 시도
outline.4.text=[도와주는 사람이나 것]의 도움을 받아 [주인공]은 [행동]을 해 보았어요.
outline.5.label=5. 편안한 끝
outline.5.text=마침내 [결과]가 되었고, [주인공]은 [조용한 마지막 행동]을 했어요.
outline.body=이 다섯 문장을 순서대로 읽어 보세요. 행동이 자연스럽게 이어진다면 대사 한 줄과 마음에 드는 세부 묘사를 더하세요. 이야기가 산만해진다면 등장인물이나 두 번째 문제를 하나 빼면 됩니다. 중간을 늘릴 때도 결말은 눈에 보이게 두세요.
story.kicker=소리 내어 읽는 창작 이야기
story.title=나뭇잎 배
story.intro=이 상상 속 예시는 아이와 부모가 웅덩이에 나뭇잎을 띄우는 평범한 가족의 장면에서 시작합니다. 말을 하는 참새와 배에 탄 구름은 동화에서 더한 요소입니다.
story.1=일요일에 미나와 아빠는 작은 배처럼 생긴 노란 나뭇잎을 찾았어요. 둘은 정원 대문 옆 웅덩이에 그 잎을 띄웠어요.
story.2=“어디로 보내 줄까?” 아빠가 물었어요.
story.3=“바다로요.” 미나가 말했어요. 그런데 나뭇잎이 조약돌에 부딪혀 멈췄어요.
story.4=그때 참새 한 마리가 가까이 내려앉았어요. “바다로 가는 길을 알아.” 참새가 짹짹거렸어요. “하지만 먼저 함께 데려갈 만한 걸 태워야 해.”
story.5=미나는 주머니를 뒤졌어요. 단추 하나와 매끈한 돌, 실 한 조각이 나왔어요. 모두 배에 싣기에는 너무 무거웠어요.
story.6=그때 미나는 웅덩이에 비친 구름을 보았어요. “저 구름은 태울 수 있을까?”
story.7=나뭇잎이 살랑 흔들렸어요. 부드럽고 하얀 구름이 노란 잎 한가운데에 내려앉았어요.
story.8=산들바람이 작은 배를 밀어 조약돌을 지나게 했어요. 배는 아빠의 장화를 돌아 진흙 섬 두 개 사이로 나아갔어요. 미나는 옆에서 걸으며 새로운 곳마다 손가락으로 가리켰어요.
story.9=웅덩이 저편 끝에서 나뭇잎은 풀밭에 닿았어요.
story.10=“여기는 바다가 아니잖아요.” 미나가 말했어요.
story.11=“그렇지.” 아빠가 말했어요. “그런데 누가 함께 왔는지 봐.”
story.12=구름은 여전히 둘의 머리 위에 떠 있었어요. 참새는 대문에서 기다리고 있었지요. 그리고 작은 배는 두 사람을 오후의 저편까지 데려다주었어요.
story.13=미나는 나뭇잎을 들어 납작한 돌 위에 올려놓았어요.
story.14=“여기가 네 항구야.” 미나가 말했어요.
story.15=그다음 미나와 아빠는 집으로 들어갔어요. 미나는 장화를 문 옆에 벗어 두고 창가로 가서 마지막으로 밖을 보았어요.
story.16=노란 배는 아주 작아 보였고, 그 위의 하늘은 아주 넓어 보였어요.
adapt.title=우리 가족만의 이야기로 바꿔 보세요
adapt.1.title=우리에게만 있는 세부 사항을 남기세요
adapt.1.body=정원 대문을 우리 동네 골목으로, 아빠를 아이에게 익숙한 다른 어른으로, 노란 잎을 둥글게 말린 갈색 잎으로 바꿔 보세요. 가족이 좋아하는 말도 넣어 보세요. 이런 작은 선택만으로도 긴 가족사를 늘어놓지 않고 우리 가족다운 이야기가 됩니다.
adapt.2.title=어디부터 상상인지 알려 주세요
adapt.2.body=“그날 나뭇잎을 물에 띄운 건 진짜야. 참새가 한 말은 내가 상상했어”라고 말해 보세요. 사실 그대로의 추억도 남기고 싶다면 장소와 함께 있었던 사람, 실제로 일어난 일을 따로 적어 두세요. 그러면 추억의 기록을 바꾸지 않으면서 동화는 자유롭게 다듬을 수 있습니다.
adapt.3.title=듣는 아이에게 맞춰 길이를 정하세요
adapt.3.body=더 짧게 읽고 싶다면 나뭇잎과 조약돌, 항구만 남기고 주머니를 뒤지는 장면은 빼세요. 참여하고 싶은 아이에게는 배 이름을 짓거나 승객을 골라 달라고 해 보세요. 좋아하는 생각을 살리되, 그저 듣고 싶어 한다면 그것만으로 충분합니다.
reading.title=소리 내어 읽어 본 뒤 녹음할지 정하세요
reading.body1=녹음기를 켜기 전에 글을 완성하세요. 이름을 소리 내어 읽고, 자꾸 막히는 문장은 나누고, 누가 말하는지 분명한지 확인하세요. 결말도 읽어 보세요. 새로운 문제를 꺼내기보다 모험을 끝내야 합니다.
reading.body2=내가 실제로 읽은 목소리를 그대로 남기고 싶다면 휴대전화로 이야기 전체를 녹음하세요. 내가 멈추는 순간과 웃음, 발음도 함께 남습니다. 짧은 소리 점검부터 완성된 파일 저장까지 아래 가이드에서 안내합니다:
reading.recording_link=잠자리 이야기 녹음하는 방법
reading.body3=글만 준비해 두었다가 다른 날 읽어도 좋습니다. 잠자리 시간에 쓰고 연습하고 녹음까지 한꺼번에 할 필요는 없습니다. 오늘 밤에는 다음 가이드의 방법을 참고해 보세요:
reading.tired_link=이야기를 읽어 줄 기운이 없는 부모를 위한 방법
product.eyebrow=출시 준비 중 · iOS 및 Android
product.title=완성된 이야기 글을 들을 수 있도록 준비합니다
product.body=Sleep2Story는 성인이 제공한 이야기의 전체 글을 동의한 성인 가족의 목소리 샘플로 합성 낭독하는 앱으로 개발 중입니다. 계획된 앱에는 개인 이야기 보관함과 플레이어가 있습니다. 이야기를 대신 쓰거나 그 성인이 직접 읽은 원본 음성을 보존하지는 않습니다.
product.body2=앱은 아직 출시를 준비 중입니다. 지금은 가족의 이야기를 쓰고 읽거나 휴대전화로 평범하게 녹음할 수 있습니다.
product.cta=Sleep2Story 이용 방법 보기
faq.title=추억을 이야기로 바꿀 때 궁금한 점
faq.1.question=모든 내용이 사실이어야 하나요?
faq.1.answer=아니요. 기억하는 부분과 상상한 부분을 아이에게 알려 주세요. 가족의 사실 기록도 남기고 싶다면 동화와 따로 적어 두세요.
faq.2.question=주인공을 새로 만들어도 되나요?
faq.2.answer=네. 실제 사람 대신 여우나 장난감 배, 상상 속 아이가 주인공이 될 수 있습니다. 익숙한 세부 사항 하나는 남겨 추억과 이어 주세요.
faq.3.question=아이가 함께 만들고 싶어 하지 않으면요?
faq.3.answer=직접 쓰고 아이에게 들려주세요. 아이는 듣기만 하거나 나중에 이름을 골라도 되고, 다른 이야기를 부탁해도 됩니다. 참여는 선택입니다.
faq.4.question=가족 이야기는 얼마나 길어야 하나요?
faq.4.answer=다섯 문장 버전부터 시작해 소리 내어 읽어 보세요. 둘 다 더 듣고 싶다면 자세한 내용을 보태세요. 편안하게 닿을 수 있는 결말을 고르면 됩니다. 정해진 읽기 시간은 없어요.
faq.5.question=Sleep2Story가 이야기를 대신 써 주나요?
faq.5.answer=아니요. 성인이 전체 글을 제공해야 합니다. Sleep2Story는 동의한 성인의 목소리 샘플로 그 글을 낭독하는 기능을 준비 중입니다. 아직 앱 스토어에서 이용할 수 없습니다.
