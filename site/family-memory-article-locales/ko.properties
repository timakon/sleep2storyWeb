sources.body=PBS의 활동은 가족의 추억으로 책을 만드는 방법을 제안합니다. 여덟 가지 질문과 다섯 문장 이야기 틀, ‘나뭇잎 배’는 Sleep2Story가 직접 만든 편집 자료입니다. 예시 이야기는 창작물이며 실제 가족의 후기가 아닙니다. 출처는 Sleep2Story를 평가하지 않습니다.
