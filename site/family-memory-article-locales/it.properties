answer.title=Tieni un dettaglio vero. Aggiungi una piccola avventura.
answer.body=Scegli un ricordo, dai al protagonista qualcosa da fare, aggiungi un ostacolo alla sua portata e porta la storia a una conclusione chiara. Scrivi prima cinque frasi. Aggiungi un po’ di dialogo e una sorpresa inventata: avrai una storia da leggere ad alta voce.
