memory.title=Quale ricordo di famiglia può diventare una storia?
memory.body1=Scegli una scena che riesci a immaginare: la pozzanghera accanto al cancello, il tavolo della cucina sporco di farina, un viaggio in autobus con i nonni. Un’intera vacanza è difficile da far entrare in un racconto breve. Il pomeriggio in cui avete recuperato un cappello da una siepe, invece, ti offre già un luogo, un problema e un finale.
memory.body2=Scegli un ricordo che le persone coinvolte abbiano piacere di ripercorrere. Chiedi prima di usare la storia personale di un altro adulto, soprattutto se pensi di condividerla fuori dalla famiglia. Lascia da parte gli episodi imbarazzanti se a tuo figlio non piace sentirli raccontare. Un piccolo ricordo felice basta per cominciare.
memory.source=PBS KIDS for Parents propone un’attività di Fred Rogers Productions vicina a questa idea: creare a mano un libro intorno a un ricordo di famiglia.
memory.source_link=Scopri l’attività del libro di ricordi di famiglia
memory.grandparents_link=Chiedi a un nonno o a una nonna di raccontarti un ricordo.
memory.grandparents_body=Una fotografia o un oggetto familiare possono offrire uno spunto per iniziare la conversazione.
figure.alt=Illustrazione dai toni caldi di un genitore e un bambino accanto a una pozzanghera con una barchetta di foglia gialla e il riflesso di una nuvola
figure.caption=Una pozzanghera, una foglia e un pomeriggio insieme: quanto basta per una piccola avventura.
prompts.kicker=Prima gli appunti, poi le frasi
prompts.title=Otto domande per trovare la tua storia
prompts.intro=Se ti chiedi come inventare una storia per bambini, usa queste domande per chiacchierare insieme oppure rispondi per conto tuo. Bastano poche parole per ogni risposta. Tuo figlio può scegliere un dettaglio senza dover aiutare a scrivere l’intero racconto.
prompt.1.title=Dove eravamo?
prompt.1.body=Indica un luogo e un momento: fuori dal cancello del giardino dopo la pioggia, invece di tutto quello che è successo domenica.
prompt.2.title=Quale piccolo dettaglio ricordiamo?
prompt.2.body=Scegli qualcosa che potevi vedere, sentire, toccare o annusare: una foglia gialla, gli stivali che cigolavano o il profumo del pane caldo.
prompt.3.title=Chi sarà il protagonista?
prompt.3.body=Può essere tuo figlio, un bambino inventato, un animale o l’oggetto stesso. Affida l’azione principale a un solo personaggio.
prompt.4.title=Che cosa desidera?
prompt.4.body=Scegli un desiderio semplice: far salpare una barca, trovare un guanto o portare a casa una torta. Darà una direzione alla storia.
prompt.5.title=Che cosa lo ostacola?
prompt.5.body=Prova con un piccolo intoppo: un sassolino blocca la barca oppure la borsa non si chiude. Una storia della buonanotte non ha bisogno di pericoli spaventosi.
prompt.6.title=Chi o che cosa potrebbe aiutare?
prompt.6.body=Un parente, una brezza o un passero parlante possono suggerire un’idea. È un buon punto in cui aggiungere un elemento di fantasia.
prompt.7.title=Che cosa prova a fare il protagonista?
prompt.7.body=Scegli un’azione che chi ascolta possa immaginare. Il bambino sposta un rametto, segue un suono o trova un passeggero più leggero.
prompt.8.title=Dove finisce l’avventura?
prompt.8.body=Dai alla storia un punto d’arrivo tranquillo: la barca raggiunge il porto, il guanto ritrova il suo compagno, tutti tornano a casa.
outline.title=Trasforma le risposte in cinque frasi
outline.intro=Copia questa traccia su un foglio e completa le parti tra parentesi. Avrai un inizio, uno svolgimento e una conclusione prima di curare le parole.
outline.1.label=1. Un inizio familiare
outline.1.text=Un [giorno], [personaggio] si trovava a [luogo], dove [dettaglio del ricordo].
outline.2.label=2. Un desiderio
outline.2.text=[Personaggio] voleva [piccolo obiettivo].
outline.3.label=3. Un problema
outline.3.text=Ma [ostacolo] si mise di mezzo.
outline.4.label=4. Un tentativo
outline.4.text=Con l’aiuto di [aiutante], [personaggio] provò a [azione].
outline.5.label=5. Un approdo tranquillo
outline.5.text=Alla fine, [risultato], e [personaggio] [ultima azione tranquilla].
outline.body=Leggi le frasi in ordine. Se l’azione funziona, aggiungi una battuta di dialogo e un dettaglio che ti piace. Se la storia si perde, togli un personaggio o un secondo problema. Tieni a mente il finale mentre sviluppi la parte centrale.
story.kicker=Una storia originale da leggere ad alta voce
story.title=La barchetta di foglia
story.intro=Questo esempio inventato parte da una normale scena di famiglia: una bambina e il suo papà fanno navigare una foglia in una pozzanghera. Il passero parlante e la nuvola passeggera sono gli elementi di fantasia.
story.1=Domenica, Mina e papà trovarono una foglia gialla a forma di barchetta. La posarono in una pozzanghera accanto al cancello del giardino.
story.2=«Dove andrà?» chiese papà.
story.3=«Al mare» disse Mina. Ma la foglia urtò un sassolino e si fermò.
story.4=Un passero si posò lì vicino. «Io conosco la strada per il mare» cinguettò. «Prima, però, dovete portare qualcosa che valga il viaggio.»
story.5=Mina frugò nelle tasche. Trovò un bottone, una pietra liscia e un pezzetto di spago. Erano tutti troppo pesanti.
story.6=Poi notò una nuvola riflessa nella pozzanghera. «Potresti portare lei?»
story.7=La foglia dondolò piano. La nuvola si accomodò nel suo centro giallo, soffice e bianca.
story.8=Una brezza spinse la barchetta oltre il sassolino. Navigò intorno allo stivale di papà e tra due isole di fango. Mina le camminava accanto, indicando ogni posto nuovo.
story.9=Dall’altra parte della pozzanghera, la foglia raggiunse un ciuffo d’erba.
story.10=«Questo non è il mare» disse Mina.
story.11=«No» rispose papà. «Ma guarda chi è venuto con noi.»
story.12=La nuvola galleggiava ancora sopra di loro. Il passero li aspettava sul cancello. E la loro barchetta li aveva portati in viaggio attraverso un pomeriggio intero.
story.13=Mina sollevò la foglia e la posò su una pietra piatta.
story.14=«Il tuo porto» le disse.
story.15=Poi rientrò in casa con papà. Lasciò gli stivali accanto alla porta e andò alla finestra per un’ultima occhiata.
story.16=La barchetta gialla sembrava piccolissima, e il cielo sopra di lei sembrava immenso.
adapt.title=Rendi la storia parte della tua famiglia
adapt.1.title=Conserva il dettaglio che vi appartiene
adapt.1.body=Sostituisci il cancello del giardino con la vostra strada, papà con un altro adulto familiare o la foglia gialla con una marrone e arricciata. Mantieni una parola speciale che usate in famiglia. Queste piccole scelte rendono personale il racconto senza aggiungere una lunga storia familiare.
adapt.2.title=Spiega dove comincia la fantasia
adapt.2.body=Puoi dire: «Quel giorno abbiamo davvero fatto navigare una foglia. Quello che ha detto il passero l’ho inventato io». Se vuoi conservare anche un ricordo fedele, annota a parte il luogo, le persone e ciò che è successo. La fiaba potrà così cambiare senza sostituire il resoconto dei fatti.
adapt.3.title=Adatta la lunghezza a chi ascolta
adapt.3.body=Per una versione più breve, tieni la foglia, il sassolino e il porto; salta la ricerca nelle tasche. Un bambino che vuole partecipare può dare un nome alla barca o suggerire un passeggero. Conserva la sua idea preferita, ma lascia che ascolti e basta, se lo desidera.
reading.title=Leggila ad alta voce, poi decidi se registrarla
reading.body1=Finisci il testo prima di aprire il registratore. Pronuncia i nomi ad alta voce, dividi le frasi su cui inciampi e controlla che sia chiaro chi sta parlando. Leggi anche il finale: deve concludere l’avventura, senza introdurre un altro problema.
reading.body2=Per conservare la tua lettura esattamente com’è, registra l’intera storia con il telefono. Manterrai le tue pause, le risate e la pronuncia. La nostra guida spiega come fare una breve prova audio e salvare il file finito:
reading.recording_link=come registrare una storia della buonanotte
reading.body3=Puoi anche lasciare il testo pronto per un’altra sera. Non occorre scrivere, provare e registrare tutto al momento di andare a letto. Per stasera, trovi alcune possibilità nella nostra guida per
