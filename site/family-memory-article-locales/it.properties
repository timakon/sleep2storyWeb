product.eyebrow=In preparazione · iOS e Android
product.title=Il tuo testo completo, pronto da ascoltare
product.body=Stiamo sviluppando Sleep2Story per trasformare il testo completo fornito da un adulto in una narrazione sintetica, usando un campione vocale di un familiare adulto che abbia dato il proprio consenso. L’app prevista comprende una biblioteca personale di storie e un lettore audio. Non scrive la storia e non conserva la lettura originale di quelle parole da parte dell’adulto.
product.body2=L’app è ancora in preparazione per il lancio. La narrazione è prevista in inglese e russo; le altre lingue del sito non indicano che la narrazione sia disponibile in quelle lingue. Puoi già scrivere e leggere la tua storia di famiglia, oppure registrarla normalmente con il telefono.
product.cta=Scopri come funziona Sleep2Story
faq.title=Domande su come trasformare i ricordi in storie
faq.1.question=Ogni dettaglio deve essere vero?
faq.1.answer=No. Spiega a tuo figlio quale parte ricordi e quale hai inventato. Se vuoi conservare anche un ricordo dei fatti, tieni gli appunti separati dalla fiaba.
faq.2.question=Possiamo inventare il protagonista?
faq.2.answer=Sì. Una volpe, una barca giocattolo o un bambino inventato possono prendere il posto di una persona reale. Conserva un dettaglio familiare perché la storia resti legata al ricordo.
faq.3.question=E se mio figlio non vuole partecipare?
faq.3.answer=Scrivi tu la storia e proponigliela da ascoltare. Tuo figlio può ascoltare, scegliere un nome in seguito o chiedere un altro racconto. Partecipare è facoltativo.
faq.4.question=Quanto dovrebbe essere lunga la nostra storia di famiglia?
faq.4.answer=Comincia dalla versione di cinque frasi e leggila ad alta voce. Aggiungi dettagli se entrambi volete continuare. Scegli un finale a cui puoi arrivare senza fretta: non c’è una durata obbligatoria.
faq.5.question=Sleep2Story scrive la storia al posto mio?
faq.5.answer=No. L’adulto fornisce il testo completo. Sleep2Story è in preparazione per generare una narrazione in inglese o russo a partire da quel testo e da un campione vocale di un adulto che abbia dato il proprio consenso. Non è ancora disponibile negli store di app.
