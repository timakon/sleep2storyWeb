sources.body=L’attività di PBS suggerisce di creare un libro a partire dai ricordi di famiglia. Le otto domande, la traccia di cinque frasi e La barchetta di foglia sono contenuti editoriali originali di Sleep2Story. L’esempio è inventato, non è la testimonianza di una famiglia; la fonte non valuta Sleep2Story.
