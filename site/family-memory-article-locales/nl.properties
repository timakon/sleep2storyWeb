prompts.kicker=Eerst steekwoorden, dan zinnen
prompts.title=Acht vragen om je verhaal te vinden
prompts.intro=Wil je zelf een verhaal bedenken voor je kind? Bespreek deze vragen samen of beantwoord ze alleen. Een paar woorden per vraag zijn genoeg. Je kind kan één detail kiezen zonder het hele verhaal mee te hoeven schrijven.
prompt.1.title=Waar waren we?
prompt.1.body=Noem één plek en één moment: na de regen bij het tuinhek, in plaats van alles wat er op zondag gebeurde.
prompt.2.title=Welk klein detail herinneren we ons?
prompt.2.body=Kies iets dat je kon zien, horen, voelen of ruiken: een geel blad, piepende laarzen of de geur van warm brood.
prompt.3.title=Wie krijgt de hoofdrol?
prompt.3.body=Dat kan je kind zijn, een verzonnen kind, een dier of het voorwerp zelf. Laat één personage de belangrijkste handelingen uitvoeren.
prompt.4.title=Wat wil dat personage?
prompt.4.body=Houd de wens eenvoudig: een boot laten varen, een want vinden of een taart thuisbrengen. Zo krijgt het verhaal een richting.
prompt.5.title=Wat zit er in de weg?
prompt.5.body=Kies een klein obstakel: een kiezel houdt het bootje tegen, of de tas wil niet dicht. Een verhaal voor het slapengaan heeft geen angstaanjagend gevaar nodig.
prompt.6.title=Wie of wat kan helpen?
prompt.6.body=Een familielid, een briesje of een pratende mus kan een idee aandragen. Hier kun je goed iets verzonnens toevoegen.
prompt.7.title=Wat probeert het personage?
prompt.7.body=Kies een handeling die de luisteraar voor zich kan zien. Het kind verplaatst een takje, volgt een geluid of vindt een lichtere passagier.
prompt.8.title=Waar eindigt het avontuur?
prompt.8.body=Geef het verhaal een rustig eindpunt: het bootje bereikt zijn haven, de want vindt zijn maatje, iedereen gaat naar huis.
outline.title=Maak van je antwoorden vijf zinnen
outline.intro=Neem deze opzet over op papier en vervang de woorden tussen haakjes door je eigen ideeën. Zo heb je een begin, een midden en een einde voordat je aan de formulering werkt.
outline.1.label=1. Een vertrouwd begin
outline.1.text=Op een [dag] was [personage] bij [plek] en zag daar [detail uit de herinnering].
outline.2.label=2. Een wens
outline.2.text=[Personage] wilde [klein doel].
outline.3.label=3. Een probleem
outline.3.text=Maar [obstakel] hield het plan tegen.
outline.4.label=4. Een poging
outline.4.text=Met hulp van [helper] probeerde [personage] om [handeling].
outline.5.label=5. Een rustig eindpunt
outline.5.text=Uiteindelijk [uitkomst], en [personage] [laatste rustige handeling].
outline.body=Lees de zinnen achter elkaar. Is de handeling logisch, voeg dan iets toe wat iemand zegt en een detail dat je mooi vindt. Dwaalt het verhaal af, schrap dan een personage of een tweede probleem. Houd het einde in gedachten terwijl je het midden uitbreidt.
story.kicker=Een origineel verhaal om voor te lezen
story.title=Het blaadjesbootje
story.intro=Dit verzonnen voorbeeld begint met een alledaags familiemoment: een kind en een ouder laten een blad in een plas varen. De pratende mus en de wolk die meevaart, maken er een sprookje van.
story.1=Op zondag vonden Mina en papa een geel blad dat op een bootje leek. Ze legden het in een plas naast het tuinhek.
story.2=“Waar zal het naartoe varen?” vroeg papa.
story.3=“Naar de zee,” zei Mina. Maar het blad botste tegen een kiezel en bleef steken.
story.4=Er landde een mus vlak bij hen. “Ik weet de weg naar de zee,” tjilpte hij. “Maar eerst moet je iets meenemen dat de reis waard is.”
story.5=Mina doorzocht haar zakken. Ze vond een knoop, een gladde steen en een stukje touw. Alles was te zwaar.
story.6=Toen zag ze een wolk die in de plas werd weerspiegeld. “Zou je die kunnen meenemen?”
story.7=Het blad wiegde zachtjes. De wolk nestelde zich in het gele midden, zacht en wit.
story.8=Een briesje duwde het bootje langs de kiezel. Het voer om papa’s laars heen en tussen twee eilanden van modder door. Mina liep ernaast en wees elke nieuwe plek aan.
story.9=Aan de overkant van de plas bereikte het blad een plukje gras.
story.10=“Dit is de zee niet,” zei Mina.
story.11=“Nee,” zei papa. “Maar kijk eens wie er allemaal mee zijn gekomen.”
story.12=De wolk zweefde nog steeds boven hen. De mus zat op het hek te wachten. En hun bootje had hen een hele middag lang meegenomen op avontuur.
story.13=Mina tilde het blad op en legde het op een platte steen.
story.14=“Jouw haven,” zei ze tegen het bootje.
story.15=Toen ging ze met papa naar binnen. Mina zette haar laarzen bij de deur en liep naar het raam om nog één keer te kijken.
story.16=Het gele bootje leek heel klein, en de lucht erboven leek eindeloos groot.
adapt.title=Maak het verhaal van jullie familie
adapt.1.title=Bewaar het detail dat van jullie is
adapt.1.body=Vervang het tuinhek door jullie straat, papa door een andere vertrouwde volwassene, of het gele blad door een gekruld bruin blad. Bewaar een lievelingswoord uit jullie gezin. Zulke kleine keuzes maken het verhaal persoonlijk, zonder dat je de hele familiegeschiedenis hoeft te vertellen.
adapt.2.title=Vertel waar het verzinnen begint
adapt.2.body=Bijvoorbeeld: “We hebben die dag echt een blad laten varen. Wat de mus zei, heb ik verzonnen.” Wil je de herinnering ook bewaren zoals die was, noteer dan apart de plek, de mensen en wat er gebeurde. Het sprookje kan dan veranderen zonder je verslag van de herinnering te vervangen.
adapt.3.title=Laat de lengte bij je kind passen
adapt.3.body=Houd voor een kortere versie het blad, de kiezel en de haven en sla het zoeken in de zakken over. Een kind dat wil meedoen, kan het bootje een naam geven of een passagier bedenken. Bewaar het favoriete idee, maar laat luisteren genoeg zijn als je kind liever niet meedoet.
reading.title=Lees het voor en beslis daarna of je het wilt opnemen
reading.body1=Maak de tekst af voordat je de opname-app opent. Spreek de namen hardop uit, splits zinnen waarover je struikelt en controleer of steeds duidelijk is wie er praat. Lees ook het slot: dat hoort het avontuur af te ronden en geen nieuw probleem te beginnen.
reading.body2=Wil je precies jouw voorleesversie bewaren, neem dan het hele verhaal op met je telefoon. Zo blijven je eigen pauzes, lachjes en uitspraak behouden. Onze gids legt uit hoe je kort het geluid controleert en het voltooide bestand bewaart:
reading.recording_link=een verhaal voor het slapengaan opnemen
reading.body3=Je kunt de tekst ook klaarleggen voor een andere avond. Schrijven, oefenen en opnemen hoeft niet allemaal rond bedtijd. Voor vanavond vind je mogelijkheden in onze gids voor
reading.tired_link=ouders die te moe zijn om voor te lezen
product.eyebrow=In voorbereiding · iOS en Android
product.title=Je afgeronde tekst wordt een verhaal om te beluisteren
product.body=Sleep2Story wordt ontwikkeld om de volledige verhaaltekst die een volwassene aanlevert met een synthetische stem voor te lezen. Daarvoor gebruikt de app een stemfragment van een volwassen familielid dat toestemming heeft gegeven. De geplande app krijgt een persoonlijke verhalenbibliotheek en een audiospeler. De app schrijft het verhaal niet en bewaart geen oorspronkelijke opname waarin die volwassene deze woorden zelf voorleest.
product.body2=De app wordt nog voorbereid op de release. Vertelling is gepland in het Engels en Russisch; de andere talen van de website betekenen niet dat de app ook in die talen kan vertellen. Je kunt je familieverhaal nu al schrijven, voorlezen en gewoon met je telefoon opnemen.
product.cta=Bekijk hoe Sleep2Story werkt
faq.title=Vragen over verhalen uit herinneringen
faq.1.question=Moet elk detail echt gebeurd zijn?
faq.1.answer=Nee. Vertel je kind welk deel je je herinnert en welk deel je hebt verzonnen. Wil je ook een verslag voor de familie bewaren, houd de feitelijke aantekeningen dan apart van het sprookje.
faq.2.question=Mogen we het hoofdpersonage verzinnen?
faq.2.answer=Ja. Een vos, een speelgoedbootje of een verzonnen kind kan de plaats innemen van een echte persoon. Bewaar één vertrouwd detail, zodat het verhaal verbonden blijft met de herinnering.
faq.3.question=Wat als mijn kind niet wil meedoen?
faq.3.answer=Schrijf het verhaal zelf en bied aan om het voor te lezen. Je kind kan luisteren, later een naam kiezen of om een ander verhaal vragen. Meedoen hoeft niet.
faq.4.question=Hoelang moet ons familieverhaal zijn?
faq.4.answer=Begin met de versie van vijf zinnen en lees die hardop voor. Voeg details toe als jullie allebei meer willen. Kies een einde dat je op je gemak kunt bereiken; er is geen verplichte voorleesduur.
faq.5.question=Schrijft Sleep2Story het verhaal voor mij?
faq.5.answer=Nee. De volwassene levert de volledige tekst aan. Sleep2Story wordt voorbereid om daarvan een Engelse of Russische vertelling te maken met een stemfragment van een volwassene die toestemming heeft gegeven. De app is nog niet verkrijgbaar in de appwinkels.
