sources.body=De activiteit van PBS stelt voor om een boekje te maken van familieherinneringen. De acht vragen, de opzet in vijf zinnen en Het blaadjesbootje zijn origineel redactioneel materiaal van Sleep2Story. Het voorbeeld is verzonnen en geen ervaringsverhaal van een gezin; de bron beoordeelt Sleep2Story niet.
