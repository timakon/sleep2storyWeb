answer.title=Bewaar één echt detail. Voeg een klein avontuur toe.
answer.body=Kies een herinnering, geef een personage iets te doen, voeg een klein obstakel toe en werk naar een duidelijk einde. Schrijf eerst vijf zinnen. Met wat dialoog en één verzonnen verrassing maak je er een verhaal van dat je kunt voorlezen.
