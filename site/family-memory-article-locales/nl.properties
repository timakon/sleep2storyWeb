memory.title=Welke familieherinnering kan een verhaal worden?
memory.body1=Kies een tafereel dat je voor je ziet: de plas bij het tuinhek, een keukentafel onder het meel, een busrit met opa of oma. Een hele vakantie past moeilijk in een kort verhaal. De middag waarop je een hoed uit de heg haalde, heeft al een plek, een probleem en een einde.
memory.body2=Kies een herinnering waar de betrokkenen graag op terugkijken. Vraag het eerst als je een persoonlijke belevenis van een andere volwassene wilt gebruiken, zeker als je het verhaal buiten de familie wilt delen. Laat gênante momenten van je kind weg als het die niet graag hoort. Een gewoon, fijn detail is genoeg om mee te beginnen.
memory.source=PBS KIDS for Parents deelt een verwante activiteit van Fred Rogers Productions: zelf een boekje maken over een familieherinnering.
memory.source_link=Bekijk de activiteit voor een eigen herinneringsboekje
