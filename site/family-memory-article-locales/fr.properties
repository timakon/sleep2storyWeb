answer.title=Gardez un détail vécu. Ajoutez une petite aventure.
answer.body=Choisissez un souvenir, donnez un but à un personnage, ajoutez un petit obstacle puis une fin claire. Commencez par écrire cinq phrases. Quelques répliques et une surprise inventée suffisent ensuite à en faire une histoire à lire à voix haute.
