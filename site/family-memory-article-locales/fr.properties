prompts.kicker=Des notes avant les phrases
prompts.title=Huit questions pour trouver votre histoire
prompts.intro=Pour inventer une histoire pour votre enfant, discutez de ces questions ensemble ou répondez-y de votre côté. Quelques mots par question suffisent. Votre enfant peut choisir un détail sans participer à l’écriture de tout le récit.
prompt.1.title=Où étions-nous ?
prompt.1.body=Nommez un lieu et un moment précis : devant le portail après la pluie, plutôt que tout ce qui s’est passé dimanche.
prompt.2.title=De quel petit détail nous souvenons-nous ?
prompt.2.body=Choisissez quelque chose qu’on pouvait voir, entendre, toucher ou sentir : une feuille jaune, des bottes qui couinent ou l’odeur du pain chaud.
prompt.3.title=Qui sera le personnage principal ?
prompt.3.body=Ce peut être votre enfant, un enfant inventé, un animal ou l’objet lui-même. Confiez l’action principale à un seul personnage.
prompt.4.title=Que veut ce personnage ?
prompt.4.body=Gardez un souhait simple : faire naviguer un bateau, retrouver une moufle ou rapporter un gâteau à la maison. Cela donne une direction au récit.
prompt.5.title=Qu’est-ce qui l’en empêche ?
prompt.5.body=Essayez un petit obstacle : un caillou bloque le bateau, ou le sac ne ferme plus. Une histoire du soir n’a pas besoin d’un danger effrayant.
prompt.6.title=Qui ou quoi pourrait l’aider ?
prompt.6.body=Un proche, une brise ou un moineau qui parle peut proposer une idée. C’est le bon moment pour ajouter un élément imaginaire.
prompt.7.title=Que tente le personnage ?
prompt.7.body=Choisissez une action facile à imaginer. L’enfant déplace une brindille, suit un bruit ou trouve un passager plus léger.
prompt.8.title=Où l’aventure se termine-t-elle ?
prompt.8.body=Offrez au récit une arrivée tranquille : le bateau rejoint son port, la moufle retrouve sa jumelle, tout le monde rentre à la maison.
outline.title=Transformez vos réponses en cinq phrases
outline.intro=Recopiez ce plan sur une feuille et remplacez les mots entre crochets. Vous aurez un début, un milieu et une fin avant de travailler les formulations.
outline.1.label=1. Un début familier
outline.1.text=Un [jour], [personnage] se trouvait à [lieu] et remarquait [détail du souvenir].
outline.2.label=2. Un souhait
outline.2.text=[Personnage] voulait [petit objectif].
outline.3.label=3. Un problème
outline.3.text=Mais [obstacle] l’en empêchait.
outline.4.label=4. Une tentative
outline.4.text=Avec l’aide de [personne ou chose qui aide], [personnage] a essayé de [action].
outline.5.label=5. Une arrivée tranquille
outline.5.text=Enfin, [résultat], et [personnage] [dernière action calme].
outline.body=Lisez ces phrases dans l’ordre. Si les événements s’enchaînent bien, ajoutez une réplique et un détail qui vous plaît. Si le récit s’éparpille, retirez un personnage ou un deuxième problème. Gardez la fin en tête pendant que vous développez le milieu.
story.kicker=Un récit original à lire à voix haute
story.title=Le bateau-feuille
story.intro=Cet exemple inventé part d’une scène familiale ordinaire : un enfant et un parent font naviguer une feuille dans une flaque. Le moineau qui parle et le nuage passager apportent la part de merveilleux.
story.1=Dimanche, Mina et Papa trouvèrent une feuille jaune qui ressemblait à un petit bateau. Ils la posèrent dans une flaque près du portail du jardin.
story.2=« Où va-t-il aller ? » demanda Papa.
story.3=« Jusqu’à la mer », répondit Mina. Mais la feuille buta contre un caillou et s’immobilisa.
story.4=Un moineau se posa près d’eux. « Je connais le chemin de la mer, gazouilla-t-il. Mais d’abord, il faut emporter quelque chose qui mérite le voyage. »
story.5=Mina fouilla dans ses poches. Elle y trouva un bouton, un caillou lisse et un bout de ficelle. Tout était trop lourd.
story.6=Puis elle aperçut un nuage qui se reflétait dans la flaque. « Est-ce que tu pourrais l’emmener ? »
story.7=La feuille se balança doucement. Le nuage se posa au creux du bateau jaune, tout blanc et tout doux.
story.8=Une brise poussa le petit bateau au-delà du caillou. Il contourna la botte de Papa et passa entre deux îles de boue. Mina marchait à côté en montrant chaque nouvel endroit du doigt.
story.9=À l’autre bout de la flaque, la feuille atteignit une touffe d’herbe.
story.10=« Ce n’est pas la mer », dit Mina.
story.11=« Non, répondit Papa. Mais regarde qui a fait le voyage avec nous. »
story.12=Le nuage flottait toujours au-dessus d’eux. Le moineau les attendait sur le portail. Et leur petit bateau leur avait fait traverser tout un après-midi.
story.13=Mina souleva la feuille et la posa sur une pierre plate.
story.14=« Voilà ton port », lui dit-elle.
story.15=Puis elle rentra avec Papa. Mina laissa ses bottes près de la porte et alla à la fenêtre pour jeter un dernier coup d’œil dehors.
story.16=Le bateau jaune paraissait tout petit, et le ciel au-dessus de lui, immense.
adapt.title=Faites de ce récit une histoire bien à vous
adapt.1.title=Gardez le détail qui vous appartient
adapt.1.body=Remplacez le portail par votre rue, Papa par un autre adulte familier, ou la feuille jaune par une feuille brune et recourbée. Gardez un mot que votre famille aime employer. Ces petits choix rendent l’histoire personnelle sans devoir raconter toute la vie de la famille.
adapt.2.title=Dites où commence l’imaginaire
adapt.2.body=Par exemple : « Ce jour-là, nous avons vraiment fait naviguer une feuille. Les paroles du moineau, je les ai inventées. » Si vous souhaitez aussi garder une trace fidèle du souvenir, notez à part le lieu, les personnes et les faits. Le conte pourra alors évoluer sans remplacer ce qui s’est réellement passé.
adapt.3.title=Adaptez la longueur à votre enfant
adapt.3.body=Pour une version plus courte, gardez la feuille, le caillou et le port ; passez la fouille des poches. Un enfant qui souhaite participer peut nommer le bateau ou proposer un passager. Gardez son idée préférée, mais laissez-le simplement écouter s’il en a davantage envie.
reading.title=Lisez à voix haute, puis décidez si vous voulez enregistrer
reading.body1=Terminez le texte avant d’ouvrir l’enregistreur. Dites les prénoms à voix haute, coupez les phrases sur lesquelles vous butez et vérifiez qu’on sait toujours qui parle. Lisez aussi la fin : elle doit conclure l’aventure, sans ouvrir un nouveau problème.
reading.body2=Pour conserver votre lecture telle quelle, enregistrez l’histoire entière avec un téléphone. Vous garderez vos pauses, vos rires et votre prononciation. Notre guide explique comment faire un petit test sonore et sauvegarder le fichier terminé :
reading.recording_link=enregistrer une histoire du soir
reading.body3=Vous pouvez aussi garder le texte prêt pour un autre soir. Il n’est pas nécessaire d’écrire, de répéter et d’enregistrer au moment du coucher. Pour ce soir, retrouvez des idées dans notre guide pour les
reading.tired_link=parents trop fatigués pour lire une histoire
product.eyebrow=En préparation · iOS et Android
product.title=Votre texte terminé, prêt à devenir une histoire à écouter
product.body=Sleep2Story est en cours de développement pour transformer le texte complet fourni par un adulte en narration de synthèse. La voix est créée à partir d’un échantillon enregistré par un adulte de la famille qui a donné son accord. L’application prévue comprend une bibliothèque personnelle d’histoires et un lecteur audio. Elle ne rédige pas le récit et ne conserve pas la lecture originale de ces mots par cet adulte.
product.body2=L’application est encore en préparation. La narration est prévue en anglais et en russe ; les autres langues du site ne correspondent pas à des langues de narration prises en charge. Vous pouvez dès maintenant écrire votre histoire, la lire et en faire un enregistrement ordinaire avec un téléphone.
product.cta=Découvrir le fonctionnement de Sleep2Story
faq.title=Vos questions pour transformer un souvenir en histoire
faq.1.question=Tous les détails doivent-ils être vrais ?
faq.1.answer=Non. Dites à votre enfant ce dont vous vous souvenez et ce que vous avez inventé. Si vous souhaitez aussi garder une trace pour la famille, conservez les notes factuelles séparément du conte.
faq.2.question=Peut-on inventer le personnage principal ?
faq.2.answer=Oui. Un renard, un bateau-jouet ou un enfant inventé peut remplacer une personne réelle. Gardez un détail familier pour que le récit reste lié au souvenir.
faq.3.question=Et si mon enfant ne veut pas participer ?
faq.3.answer=Écrivez le récit vous-même et proposez-lui de l’écouter. Votre enfant peut écouter, choisir un prénom plus tard ou demander une autre histoire. Il n’est pas obligé de participer.
faq.4.question=Quelle longueur donner à notre histoire ?
faq.4.answer=Commencez par la version en cinq phrases et lisez-la à voix haute. Ajoutez des détails si vous en avez tous les deux envie. Choisissez une fin que vous pouvez atteindre sans vous presser : aucune durée de lecture n’est imposée.
faq.5.question=Sleep2Story écrit-il l’histoire à ma place ?
faq.5.answer=Non. L’adulte fournit le texte complet. Sleep2Story est en préparation pour créer une narration en anglais ou en russe à partir de ce texte et d’un échantillon de voix d’un adulte qui a donné son accord. L’application n’est pas encore disponible dans les boutiques d’applications.
