memory.title=Quel souvenir de famille peut devenir une histoire ?
memory.body1=Choisissez une scène que vous pouvez vous représenter : la flaque près du portail, la table de cuisine couverte de farine, un trajet en bus avec un grand-parent. Des vacances entières tiennent difficilement dans un petit récit. L’après-midi où vous avez récupéré un chapeau dans une haie fournit déjà un lieu, un problème et une fin.
memory.body2=Retenez un souvenir que les personnes concernées ont plaisir à évoquer. Demandez l’accord d’un autre adulte avant de raconter son anecdote personnelle, surtout si vous comptez la partager hors de la famille. Laissez de côté les moments embarrassants de votre enfant s’il n’aime pas les entendre. Un simple détail heureux suffit pour commencer.
memory.source=PBS KIDS for Parents propose une activité de Fred Rogers Productions sur un thème proche : fabriquer un petit livre à partir d’un souvenir de famille.
memory.source_link=Voir l’activité du livre de souvenirs
memory.grandparents_link=Demandez à un grand-parent de raconter un souvenir.
memory.grandparents_body=Une photo ou un objet familier peut vous donner un point de départ pour la conversation.
