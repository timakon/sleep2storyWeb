sources.body=L’activité de PBS propose de créer un livre à partir de souvenirs de famille. Les huit questions, le plan en cinq phrases et Le bateau-feuille sont des contenus originaux de la rédaction de Sleep2Story. Le récit est fictif et ne constitue pas le témoignage d’une famille. Cette source n’évalue pas Sleep2Story.
