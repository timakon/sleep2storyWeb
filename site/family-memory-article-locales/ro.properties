answer.title=Păstrează un detaliu real. Adaugă o mică aventură.
answer.body=Alege o amintire, dă-i personajului ceva de făcut, adaugă un obstacol pe care îl poate depăși, apoi du povestea la un final clar. Scrie mai întâi cinci propoziții. Adaugă puțin dialog și o surpriză inventată, iar povestea e gata de citit cu voce tare.
