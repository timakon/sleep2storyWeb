memory.title=Ce amintire de familie ar putea deveni o poveste?
memory.body1=Alege o scenă pe care ți-o poți închipui: balta de lângă poartă, masa din bucătărie presărată cu făină, o călătorie cu autobuzul alături de bunica sau bunicul. E greu să cuprinzi o vacanță întreagă într-o poveste scurtă. În schimb, după-amiaza în care ați recuperat o pălărie dintr-un gard viu îți oferă deja un loc, o problemă și un deznodământ.
memory.body2=Alege o amintire despre care cei implicați se simt în largul lor să vorbească. Cere acordul celuilalt adult înainte să folosești o întâmplare personală a lui, mai ales dacă ai putea împărtăși povestea în afara familiei. Lasă deoparte un moment stânjenitor pentru copil dacă lui nu îi place să îl audă povestit. Un detaliu simplu și plăcut este de ajuns pentru început.
memory.source=PBS KIDS for Parents prezintă o activitate înrudită de la Fred Rogers Productions: confecționarea unei cărticele pornind de la o amintire de familie.
memory.source_link=Vezi activitatea pentru cărticica de familie
memory.grandparents_link=Roagă bunica sau bunicul să îți povestească o amintire.
memory.grandparents_body=O fotografie sau un obiect cunoscut pot fi punctul de plecare al conversației.
figure.alt=Ilustrație în tonuri calde cu un părinte și un copil lângă o baltă, o bărcuță dintr-o frunză galbenă și oglindirea unui nor
figure.caption=O baltă, o frunză și o după-amiază împreună: de ajuns pentru o mică aventură.
prompts.kicker=Mai întâi notițe, apoi propoziții
prompts.title=Opt întrebări care te ajută să găsești povestea
prompts.intro=Folosește întrebările ca punct de pornire pentru o discuție cu copilul sau răspunde singur la ele. Câteva cuvinte pentru fiecare sunt suficiente. Copilul poate alege un detaliu fără să participe la scrierea întregii povești.
prompt.1.title=Unde eram?
prompt.1.body=Alege un singur loc și un singur moment: în fața porții grădinii după ploaie, fără să povestești tot ce s-a întâmplat duminică.
prompt.2.title=Ce mic detaliu ne amintim?
prompt.2.body=Alege ceva ce ați văzut, auzit, atins sau mirosit: o frunză galbenă, cizme care scârțâie ori pâine caldă.
prompt.3.title=Cine va fi personajul principal?
prompt.3.body=Poate fi copilul tău, un copil inventat, un animal sau chiar obiectul. Lasă un singur personaj să ducă acțiunea înainte.
prompt.4.title=Ce își dorește personajul?
prompt.4.body=Alege o dorință simplă: să pună o bărcuță pe apă, să găsească o mănușă sau să ducă un tort acasă. Dorința dă poveștii o direcție.
prompt.5.title=Ce îi stă în cale?
prompt.5.body=Încearcă un obstacol mărunt: o pietricică oprește bărcuța sau geanta nu se închide. O poveste de seară nu are nevoie de un pericol înfricoșător.
prompt.6.title=Cine sau ce ar putea să ajute?
prompt.6.body=O rudă, o adiere sau o vrabie vorbitoare pot veni cu o idee. Acesta este un moment potrivit pentru a adăuga un element imaginar.
prompt.7.title=Ce încearcă personajul?
prompt.7.body=Alege o acțiune pe care ascultătorul și-o poate închipui. Copilul mută o crenguță, merge după un sunet sau găsește un pasager mai ușor.
prompt.8.title=Unde se încheie aventura?
prompt.8.body=Dă-i poveștii un loc în care să se oprească: bărcuța ajunge în port, mănușa își găsește perechea, toată lumea se întoarce acasă.
outline.title=Transformă răspunsurile în cinci propoziții
outline.intro=Copiază planul pe hârtie și completează spațiile dintre paranteze. Vei avea un început, un cuprins și o încheiere înainte să te ocupi de formulări.
outline.1.label=1. Un început familiar
outline.1.text=Într-o [zi], [personajul] era la [locul], unde [detaliul amintit].
outline.2.label=2. O dorință
outline.2.text=[Personajul] voia să [scopul simplu].
outline.3.label=3. O problemă
outline.3.text=Dar [obstacolul] a dat planul peste cap.
outline.4.label=4. O încercare
outline.4.text=Cu ajutorul [celui care ajută], [personajul] a încercat să [acțiunea].
outline.5.label=5. Un popas
outline.5.text=În cele din urmă, [rezultatul], iar [personajul] [ultima acțiune liniștită].
outline.body=Citește propozițiile în ordine. Dacă acțiunea are sens, adaugă o replică și un detaliu care îți place. Dacă povestea se împrăștie, renunță la un personaj sau la a doua problemă. Ține minte finalul în timp ce dezvolți mijlocul poveștii.
story.kicker=O poveste originală de citit cu voce tare
story.title=Bărcuța din frunză
story.intro=Acest exemplu inventat pornește de la o scenă obișnuită din familie: un copil și un părinte lasă o frunză să plutească într-o baltă. Vrabia vorbitoare și norul-pasager sunt adaosurile de basm.
story.1=Duminică, Mina și tata au găsit o frunză galbenă care semăna cu o bărcuță. Au pus-o într-o baltă, lângă poarta grădinii.
story.2=„Încotro să pornească?” a întrebat tata.
story.3=„Spre mare”, a spus Mina. Dar frunza s-a lovit de o pietricică și s-a oprit.
story.4=O vrabie a aterizat în apropiere. „Eu știu drumul spre mare”, a ciripit ea. „Dar mai întâi trebuie să luați la bord ceva ce merită dus până acolo.”
story.5=Mina și-a scotocit buzunarele. A găsit un nasture, o piatră netedă și o bucățică de sfoară. Toate erau prea grele.
story.6=Atunci a observat un nor care se oglindea în baltă. „Pe el ai putea să-l duci?”
story.7=Frunza s-a legănat ușor. Norul, pufos și alb, s-a așezat în mijlocul galben al frunzei.
story.8=O adiere a împins bărcuța pe lângă pietricică. A plutit în jurul cizmei tatei și printre două insule de noroi. Mina mergea alături de ea și îi arăta fiecare loc nou.
story.9=La celălalt capăt al bălții, frunza a ajuns lângă un petic de iarbă.
story.10=„Asta nu e marea”, a spus Mina.
story.11=„Nu”, a spus tata. „Dar uite cine a venit cu noi.”
story.12=Norul încă plutea deasupra lor. Vrabia îi aștepta pe poartă. Iar bărcuța lor îi purtase printr-o după-amiază întreagă.
story.13=Mina a ridicat frunza și a așezat-o pe o piatră plată.
story.14=„Uite portul tău”, i-a spus.
story.15=Apoi ea și tata au intrat în casă. Mina și-a lăsat cizmele lângă ușă și s-a dus la fereastră să mai arunce o privire.
story.16=Bărcuța galbenă părea tare mică, iar cerul de deasupra ei, nesfârșit.
adapt.title=Fă din ea povestea familiei tale
adapt.1.title=Păstrează detaliul care vă aparține
adapt.1.body=Înlocuiește poarta grădinii cu strada voastră, pe tata cu alt adult apropiat sau frunza galbenă cu una maronie și răsucită. Păstrează un cuvânt drag familiei. Aceste mici alegeri fac povestea personală, fără să adaugi întreaga istorie a familiei.
adapt.2.title=Spune unde începe imaginația
adapt.2.body=Poți spune: „Chiar am pus o frunză pe apă în ziua aceea. Ce a spus vrabia am inventat eu.” Dacă vrei să păstrezi și o relatare exactă, notează separat locul, persoanele și ce s-a întâmplat. Basmul se poate schimba apoi fără să înlocuiască însemnarea despre amintirea voastră.
adapt.3.title=Lasă ascultătorul să dea măsura poveștii
adapt.3.body=Pentru o variantă mai scurtă, păstrează frunza, pietricica și portul; sari peste căutarea prin buzunare. Un copil care vrea să contribuie poate numi bărcuța sau propune un pasager. Păstrează ideea lui preferată, dar lasă-l doar să asculte dacă nu vrea să participe.
reading.title=Citește cu voce tare, apoi hotărăște dacă vrei să înregistrezi
reading.body1=Termină textul înainte să pornești înregistrarea. Rostește numele cu voce tare, împarte frazele la care te poticnești și verifică dacă este clar cine vorbește. Citește și finalul: ar trebui să încheie aventura, fără să deschidă o altă problemă.
reading.body2=Ca să păstrezi exact felul tău de a citi, înregistrează toată povestea pe telefon. Așa rămân pauzele, râsul și pronunția ta. Ghidul nostru îți arată cum să faci o scurtă probă de sunet și să salvezi fișierul final:
