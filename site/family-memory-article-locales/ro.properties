sources.body=Activitatea PBS propune realizarea unei cărți din amintiri de familie. Cele opt întrebări, planul în cinci propoziții și Bărcuța din frunză sunt materiale editoriale originale Sleep2Story. Exemplul este fictiv și nu reprezintă mărturia unei familii; sursa citată nu evaluează Sleep2Story.
