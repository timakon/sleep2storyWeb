reading.tired_link=părinți prea obosiți să citească
product.eyebrow=În pregătire · iOS și Android
product.title=Textul tău complet, pregătit pentru ascultare
product.body=Sleep2Story este în curs de dezvoltare pentru a transforma textul complet al unei povești, furnizat de un adult, în narațiune sintetică. Va folosi o mostră de voce a unui membru adult al familiei, cu acordul acestuia. Aplicația planificată include o bibliotecă personală de povești și un player audio. Nu scrie povestea, iar narațiunea generată nu este o înregistrare a adultului citind el însuși întregul text.
product.body2=Aplicația este încă în pregătire pentru lansare. Narațiunea este planificată în engleză și rusă; celelalte limbi ale site-ului nu înseamnă că narațiunea este disponibilă și în acele limbi. Poți deja să scrii, să citești și să înregistrezi povestea familiei cu un simplu telefon.
product.cta=Vezi cum funcționează Sleep2Story
faq.title=Întrebări despre transformarea amintirilor în povești
faq.1.question=Trebuie să fie adevărat fiecare detaliu?
faq.1.answer=Nu. Spune-i copilului ce parte îți amintești și ce parte ai inventat. Dacă vrei și o însemnare pentru familie, păstrează notițele despre faptele reale separat de basm.
faq.2.question=Putem inventa personajul principal?
faq.2.answer=Da. O vulpe, o bărcuță de jucărie sau un copil inventat pot lua locul unei persoane reale. Păstrează un detaliu familiar, astfel încât povestea să rămână legată de amintire.
faq.3.question=Ce fac dacă nu vrea copilul să participe?
faq.3.answer=Scrie tu povestea și propune-i să o asculte. Copilul poate asculta, poate alege un nume mai târziu sau poate cere altă poveste. Participarea este opțională.
faq.4.question=Cât de lungă ar trebui să fie povestea familiei noastre?
faq.4.answer=Începe cu varianta în cinci propoziții și citește-o cu voce tare. Adaugă detalii dacă amândoi vreți mai mult. Alege un final la care poți ajunge fără efort; nu există un timp de lectură obligatoriu.
faq.5.question=Sleep2Story scrie povestea în locul meu?
faq.5.answer=Nu. Adultul furnizează textul complet. Sleep2Story este în pregătire pentru a genera narațiune în engleză sau rusă din acel text și o mostră de voce a unui adult care și-a dat acordul. Aplicația nu este încă disponibilă în magazinele de aplicații.
