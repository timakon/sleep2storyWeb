faq.title=Questions about turning memories into stories
faq.1.question=Must every detail be true?
faq.1.answer=No. Tell your child which part you remember and which part you invented. If you also want a family record, keep the factual notes separately from the fairy tale.
faq.2.question=Can we invent the main character?
faq.2.answer=Yes. A fox, a toy boat or an invented child can take the place of a real person. Keep one familiar detail so the story still connects to the memory.
faq.3.question=What if my child does not want to join in?
faq.3.answer=Write it yourself and offer it as a story to hear. Your child can listen, choose a name later, or ask for a different tale. Participation is optional.
faq.4.question=How long should our family story be?
faq.4.answer=Start with the five-sentence version and read it aloud. Add details if you both want more. Choose an ending you can reach comfortably; there is no required reading time.
faq.5.question=Does Sleep2Story write the story for me?
faq.5.answer=No. The adult supplies the complete text. Sleep2Story is being prepared to generate English or Russian narration from that text and a consenting adult’s voice sample. It is not yet available in app stores.
