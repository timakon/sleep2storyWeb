answer.title=Keep one real detail. Add one small adventure.
answer.body=Choose a memory, give a character something to do, add a manageable obstacle, then bring the story to a clear ending. Write five sentences first. Add a little dialogue and one imagined surprise, and you have a story you can read aloud.
