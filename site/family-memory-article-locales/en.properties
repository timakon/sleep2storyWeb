product.eyebrow=In preparation · iOS and Android
product.title=Your finished text, prepared for listening
product.body=Sleep2Story is being built to turn the complete story text an adult supplies into synthetic narration, using a consenting adult family member’s voice sample. The planned app includes a personal story library and player. It does not write the story or preserve that adult’s original reading of those words.
product.body2=The app is still being prepared for release. Narration is planned for English and Russian; other website languages do not mean narration is supported in those languages. You can write, read and make an ordinary phone recording of your family story now.
