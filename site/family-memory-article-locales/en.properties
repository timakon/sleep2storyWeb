memory.title=Which family memory could become a story?
memory.body1=Choose a scene you can picture: the puddle by the gate, a floury kitchen table, a bus ride with a grandparent. A whole holiday is hard to fit into a short tale. The afternoon you rescued a hat from a hedge already gives you a place, a problem and an ending.
memory.body2=Pick a memory the people involved are comfortable revisiting. Ask before using another adult’s personal story, especially if you might share it outside the family. Leave out a child’s embarrassing moment if they dislike hearing it. An ordinary happy detail is plenty to begin with.
memory.source=PBS KIDS for Parents offers a related activity from Fred Rogers Productions: making a handmade book around a family memory.
memory.source_link=See the family storybook activity
memory.grandparents_link=Ask a grandparent for a memory.
memory.grandparents_body=A photograph or a familiar object can give you somewhere to start the conversation.
