prompts.kicker=Notes before sentences
prompts.title=Eight questions to find your story
prompts.intro=Use these family story prompts for kids as a conversation, or answer them yourself. A few words per question are enough. Your child can choose one detail without helping to write the whole tale.
prompt.1.title=Where were we?
prompt.1.body=Name one place and one moment: outside the garden gate after rain, rather than everything that happened on Sunday.
prompt.2.title=What small detail do we remember?
prompt.2.body=Choose something you could see, hear or touch: a yellow leaf, squeaky boots or the smell of warm bread.
prompt.3.title=Who will the story follow?
prompt.3.body=It can be your child, an invented child, an animal or the object itself. Give one character the main action.
prompt.4.title=What does that character want?
prompt.4.body=Keep the wish simple: launch a boat, find a mitten or carry a cake home. It gives the story somewhere to go.
prompt.5.title=What gets in the way?
prompt.5.body=Try a small obstacle: a pebble blocks the boat, or the bag will not close. A bedtime tale needs no frightening danger.
prompt.6.title=Who or what could help?
prompt.6.body=A relative, a breeze or a talking sparrow can offer an idea. This is a good place to add one imaginary element.
prompt.7.title=What does the character try?
prompt.7.body=Choose an action the listener can picture. The child moves a twig, follows a sound or finds a lighter passenger.
prompt.8.title=Where does the adventure end?
prompt.8.body=Give the story a place to rest: the boat reaches its harbour, the mitten finds its pair, everyone goes home.
outline.title=Turn your answers into five sentences
outline.intro=Copy this outline onto paper and fill the brackets. It gives you a beginning, a middle and an ending before you work on the wording.
outline.1.label=1. A familiar beginning
outline.1.text=One [day], [character] was at [place], where [remembered detail].
outline.2.label=2. A wish
outline.2.text=[Character] wanted to [small goal].
outline.3.label=3. A problem
outline.3.text=But [obstacle] stopped the plan.
outline.4.label=4. An attempt
outline.4.text=With help from [helper], [character] tried [action].
outline.5.label=5. A resting place
outline.5.text=At last, [result], and [character] [quiet final action].
outline.body=Read those sentences in order. If the action makes sense, add a spoken line and a detail you enjoy. If it wanders, remove a character or a second problem. Keep the ending visible while you expand the middle.
story.kicker=An original story to read aloud
story.title=The Leaf Boat
story.intro=This invented example starts with an ordinary family scene: a child and a parent sailing a leaf in a puddle. The talking sparrow and cloud passenger are the fairy-tale additions.
story.1=On Sunday, Mina and Dad found a yellow leaf shaped like a little boat. They placed it in a puddle beside the garden gate.
story.2=“Where shall it go?” Dad asked.
story.3=“To the sea,” said Mina. But the leaf bumped into a pebble and stopped.
story.4=A sparrow landed nearby. “I know the way to the sea,” it chirped. “First you must carry something worth taking.”
story.5=Mina searched her pockets. She found a button, a smooth stone, and a piece of string. They were all too heavy.
story.6=Then she noticed a cloud reflected in the puddle. “Could you carry that?”
story.7=The leaf rocked gently. The cloud settled into its yellow middle, soft and white.
story.8=A breeze pushed the little boat past the pebble. It sailed around Dad’s boot and between two islands made of mud. Mina walked beside it, pointing out each new place.
story.9=At the far edge of the puddle, the leaf reached a patch of grass.
story.10=“This isn’t the sea,” Mina said.
story.11=“No,” said Dad. “But look who came along.”
story.12=The cloud still floated above them. The sparrow was waiting on the gate. And their little boat had brought them all the way across a whole afternoon.
story.13=Mina lifted the leaf onto a flat stone.
story.14=“Your harbour,” she told it.
story.15=Then she and Dad went inside. Mina left her boots by the door and went to the window for one last look.
story.16=The yellow boat looked very small, and the sky above it looked very wide.
adapt.title=Make the story your family’s own
adapt.1.title=Keep the detail that belongs to you
adapt.1.body=Swap the garden gate for your street, Dad for another familiar adult, or the yellow leaf for a curled brown one. Keep a favourite family word. These small choices make family storytelling ideas feel personal without adding a long family history.
adapt.2.title=Say where make-believe begins
adapt.2.body=Try: “We really sailed a leaf that day. I made up what the sparrow said.” If you want an accurate keepsake too, save a separate note with the place, people and what happened. The fairy tale can then change without replacing your record of the memory.
adapt.3.title=Let the listener set the size
adapt.3.body=For a shorter version, keep the leaf, the pebble and the harbour; skip the pocket search. A child who wants to contribute could name the boat or suggest its passenger. Keep their favourite idea, but let listening be enough if they would rather not join in.
reading.title=Read it aloud, then decide whether to record it
reading.body1=Finish the text before opening a recorder. Say the names aloud, split any sentence you stumble over, and check that you know who is speaking. Read the ending too: it should finish the adventure rather than open another problem.
reading.body2=To preserve your exact reading, record the whole story on a phone. That keeps your own pauses, laughter and pronunciation. Our guide walks you through a short sound check and saving the finished file:
reading.recording_link=how to record a bedtime story
reading.body3=You can also leave the text ready for another evening. There is no need to write, rehearse and record at bedtime. For tonight, try the choices in our guide for
