answer.title=Zachowaj jeden prawdziwy szczegół. Dodaj małą przygodę.
answer.body=Wybierz wspomnienie, daj bohaterowi cel, postaw mu na drodze niewielką przeszkodę i doprowadź historię do wyraźnego końca. Najpierw napisz pięć zdań. Dodaj krótki dialog i jedną wymyśloną niespodziankę, a powstanie bajka, którą możesz przeczytać na głos.
