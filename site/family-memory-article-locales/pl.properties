prompts.kicker=Najpierw notatki
prompts.title=Osiem pytań, które pomogą znaleźć historię
prompts.intro=Porozmawiaj o tych pytaniach z dzieckiem albo odpowiedz na nie samodzielnie. Wystarczy kilka słów przy każdym. Dziecko może wybrać jeden szczegół, nie pomagając w pisaniu całej bajki.
prompt.1.title=Gdzie byliśmy?
prompt.1.body=Wybierz jedno miejsce i jedną chwilę: przed furtką do ogrodu po deszczu. Nie próbuj opowiedzieć wszystkiego, co wydarzyło się w niedzielę.
prompt.2.title=Jaki drobny szczegół pamiętamy?
prompt.2.body=Wybierz coś, co dało się zobaczyć, usłyszeć lub poczuć: żółty liść, skrzypienie kaloszy albo zapach ciepłego chleba.
prompt.3.title=Kto będzie głównym bohaterem?
prompt.3.body=Może nim być Twoje dziecko, wymyślone dziecko, zwierzę lub sam przedmiot. Niech najważniejsze wydarzenia skupiają się wokół jednej postaci.
prompt.4.title=Czego chce bohater?
prompt.4.body=Niech pragnienie będzie proste: puścić łódkę na wodę, znaleźć rękawiczkę lub donieść tort do domu. Dzięki temu historia zyska kierunek.
prompt.5.title=Co stoi na przeszkodzie?
prompt.5.body=Spróbuj z małą przeszkodą: kamyk zatrzymuje łódkę albo torba nie chce się zamknąć. Bajka na dobranoc nie musi straszyć.
prompt.6.title=Kto lub co może pomóc?
prompt.6.body=Ktoś z rodziny, wietrzyk albo mówiący wróbel może podsunąć pomysł. To dobry moment na dodanie jednego wymyślonego elementu.
prompt.7.title=Co próbuje zrobić bohater?
prompt.7.body=Wybierz czynność, którą słuchacz łatwo sobie wyobrazi. Dziecko odsuwa gałązkę, idzie za dźwiękiem albo znajduje lżejszego pasażera.
prompt.8.title=Gdzie kończy się przygoda?
prompt.8.body=Daj historii spokojne zakończenie: łódka dopływa do portu, rękawiczka odnajduje swoją parę, wszyscy wracają do domu.
outline.title=Ułóż z odpowiedzi pięć zdań
outline.intro=Przepisz ten plan na kartkę i uzupełnij miejsca w nawiasach. Zyskasz początek, środek i zakończenie, zanim zaczniesz dopracowywać słowa.
outline.1.label=1. Znajomy początek
outline.1.text=Pewnego [dnia] [bohater] znalazł się w [miejscu], gdzie [zapamiętany szczegół].
outline.2.label=2. Pragnienie
outline.2.text=[Bohater] chciał [niewielki cel].
outline.3.label=3. Przeszkoda
outline.3.text=Ale [przeszkoda] pokrzyżowała plan.
outline.4.label=4. Próba
outline.4.text=Z pomocą [pomocnika] [bohater] spróbował [czynność].
outline.5.label=5. Spokojny koniec
outline.5.text=Wreszcie [wynik], a [bohater] [spokojna czynność na zakończenie].
outline.body=Przeczytaj zdania po kolei. Jeśli wydarzenia układają się w całość, dodaj wypowiedź bohatera i szczegół, który lubisz. Jeśli historia się rozprasza, usuń jedną postać albo drugą przeszkodę. Rozwijając środek, pamiętaj, dokąd ma prowadzić bajka.
story.kicker=Autorska bajka do czytania na głos
story.title=Łódka z liścia
story.intro=Ten wymyślony przykład zaczyna się od zwykłej rodzinnej sceny: dziecko i rodzic puszczają liść po kałuży. Mówiący wróbel i chmurka w roli pasażera to bajkowe dodatki.
story.1=W niedzielę Mina i tata znaleźli żółty liść w kształcie małej łódki. Położyli go na wodzie w kałuży przy furtce do ogrodu.
story.2=— Dokąd popłynie? — zapytał tata.
story.3=— Do morza — powiedziała Mina. Ale liść uderzył w kamyk i się zatrzymał.
story.4=Obok przysiadł wróbel. — Znam drogę do morza — zaćwierkał. — Najpierw jednak weźcie na pokład coś, co warto zabrać w podróż.
story.5=Mina przeszukała kieszenie. Znalazła guzik, gładki kamień i kawałek sznurka. Wszystko było za ciężkie.
story.6=Wtedy zauważyła chmurkę odbitą w kałuży. — A ją zabierzesz?
story.7=Liść lekko się zakołysał. Miękka, biała chmurka usadowiła się pośrodku żółtej łódki.
story.8=Wietrzyk popchnął łódkę obok kamyka. Opłynęła kalosz taty i przemknęła między dwiema wyspami z błota. Mina szła obok i pokazywała jej każde nowe miejsce.
story.9=Na drugim krańcu kałuży liść dopłynął do kępki trawy.
story.10=— To nie morze — powiedziała Mina.
story.11=— Nie — przyznał tata. — Ale zobacz, kto dotarł tu z nami.
story.12=Chmurka nadal płynęła nad ich głowami. Wróbel czekał na furtce. A mała łódka przewiozła ich przez całe popołudnie.
story.13=Mina przełożyła liść na płaski kamień.
story.14=— Oto twój port — powiedziała.
story.15=Potem razem z tatą weszła do domu. Zostawiła kalosze przy drzwiach i podeszła do okna, żeby jeszcze raz spojrzeć na łódkę.
story.16=Żółta łódka wydawała się maleńka, a niebo nad nią ogromne.
adapt.title=Niech to będzie bajka Twojej rodziny
adapt.1.title=Zachowaj szczegół, który jest Wasz
adapt.1.body=Zamień furtkę do ogrodu na Waszą ulicę, tatę na inną bliską dorosłą osobę, a żółty liść na zwinięty brązowy. Zostaw ulubione rodzinne powiedzonko. Dzięki takim drobnym zmianom bajka stanie się Wasza bez opisywania całej historii rodziny.
adapt.2.title=Powiedz, gdzie zaczyna się zmyślanie
adapt.2.body=Możesz powiedzieć: „Tego dnia naprawdę puszczaliśmy liść po wodzie. To, co powiedział wróbel, jest już zmyślone”. Jeśli chcesz mieć także wierną pamiątkę, zapisz osobno miejsce, uczestników i przebieg zdarzenia. Bajka będzie mogła się zmieniać, a zapis wspomnienia pozostanie.
adapt.3.title=Dopasuj długość do słuchacza
adapt.3.body=W krótszej wersji zostaw liść, kamyk i port, a pomiń przeszukiwanie kieszeni. Dziecko, które chce się włączyć, może nazwać łódkę lub zaproponować pasażera. Zachowaj jego ulubiony pomysł, ale pozwól mu też po prostu słuchać, jeśli woli nie brać udziału w wymyślaniu.
reading.title=Przeczytaj na głos, a potem zdecyduj, czy nagrywać
reading.body1=Skończ tekst, zanim otworzysz dyktafon. Wymów imiona na głos, podziel zdania, na których się zacinasz, i sprawdź, czy wiadomo, kto mówi. Przeczytaj też zakończenie: powinno zamykać przygodę, a nie wprowadzać kolejny problem.
reading.body2=Jeśli chcesz zachować dokładnie swoje czytanie, nagraj całą bajkę telefonem. Zostaną w niej Twoje pauzy, śmiech i wymowa. Nasz poradnik przeprowadzi Cię przez krótką próbę dźwięku i zapisanie gotowego pliku:
reading.recording_link=jak nagrać bajkę na dobranoc
reading.body3=Możesz też odłożyć gotowy tekst na inny wieczór. Nie musisz pisać, ćwiczyć i nagrywać tuż przed snem. Na dziś wybierz coś z naszego poradnika dla
reading.tired_link=rodziców zbyt zmęczonych, by czytać
product.eyebrow=W przygotowaniu · iOS i Android
product.title=Twój gotowy tekst do słuchania
product.body=Sleep2Story powstaje po to, by zamieniać pełny tekst bajki dostarczony przez dorosłego w syntetyczną narrację na podstawie próbki głosu dorosłego członka rodziny, za jego zgodą. W aplikacji zaplanowano osobistą bibliotekę opowieści i odtwarzacz. Aplikacja nie pisze bajki ani nie zachowuje oryginalnego nagrania, na którym ta osoba czyta jej słowa.
product.body2=Aplikacja jest jeszcze przygotowywana do wydania. Narracja jest planowana po angielsku i rosyjsku; inne języki strony nie oznaczają obsługi narracji w tych językach. Już teraz możesz napisać rodzinną bajkę, przeczytać ją i nagrać zwykłym dyktafonem w telefonie.
product.cta=Zobacz, jak działa Sleep2Story
faq.title=Pytania o bajki z rodzinnych wspomnień
faq.1.question=Czy każdy szczegół musi być prawdziwy?
faq.1.answer=Nie. Powiedz dziecku, którą część pamiętasz, a która jest wymyślona. Jeśli chcesz też zachować zapis dla rodziny, trzymaj notatki o faktach oddzielnie od bajki.
faq.2.question=Czy możemy wymyślić głównego bohatera?
faq.2.answer=Tak. Lis, zabawkowa łódka albo wymyślone dziecko mogą zastąpić prawdziwą osobę. Zostaw jeden znajomy szczegół, żeby historia nadal łączyła się ze wspomnieniem.
faq.3.question=Co jeśli dziecko nie chce się włączyć?
faq.3.answer=Napisz bajkę samodzielnie i zaproponuj dziecku, że ją przeczytasz. Może posłuchać, wybrać imię później albo poprosić o inną historię. Udział w wymyślaniu jest dobrowolny.
faq.4.question=Jak długa powinna być rodzinna bajka?
faq.4.answer=Zacznij od wersji z pięciu zdań i przeczytaj ją na głos. Dodaj szczegóły, jeśli oboje macie ochotę na więcej. Wybierz zakończenie, do którego dojdziesz bez pośpiechu i nadmiernego wysiłku. Nie ma obowiązkowego czasu czytania.
faq.5.question=Czy Sleep2Story napisze bajkę za mnie?
faq.5.answer=Nie. Dorosły dostarcza pełny tekst. Sleep2Story jest przygotowywane do tworzenia narracji po angielsku lub rosyjsku na podstawie tego tekstu i próbki głosu dorosłej osoby, za jej zgodą. Aplikacja nie jest jeszcze dostępna w sklepach z aplikacjami.
