sources.title=Źródło i uwaga redakcji
sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: książeczka z rodzinnych wspomnień
sources.body=Zajęcie proponowane przez PBS polega na zrobieniu książeczki z rodzinnych wspomnień. Osiem pytań, plan z pięciu zdań i „Łódka z liścia” to autorskie materiały redakcji Sleep2Story. Przykład jest fikcyjny i nie stanowi opinii rodziny korzystającej z aplikacji; źródło nie ocenia Sleep2Story.
