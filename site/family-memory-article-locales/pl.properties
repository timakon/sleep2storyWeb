memory.title=Które rodzinne wspomnienie nadaje się na bajkę?
memory.body1=Wybierz scenę, którą potrafisz sobie wyobrazić: kałużę przy furtce, kuchenny stół oprószony mąką, przejazd autobusem z babcią lub dziadkiem. Całe wakacje trudno zmieścić w krótkiej bajce. Za to popołudnie, gdy wyciągaliście kapelusz z żywopłotu, daje już miejsce akcji, przeszkodę i zakończenie.
memory.body2=Wybierz wspomnienie, do którego jego uczestnicy chętnie wracają. Zanim wykorzystasz osobistą historię innego dorosłego, zapytaj go o zgodę, zwłaszcza jeśli zamierzasz podzielić się bajką poza rodziną. Pomiń zawstydzające zdarzenie z udziałem dziecka, jeśli nie lubi o nim słuchać. Zwykły, miły szczegół wystarczy na początek.
memory.source=PBS KIDS for Parents proponuje podobne zajęcie przygotowane przez Fred Rogers Productions: własnoręczne zrobienie książeczki na podstawie rodzinnego wspomnienia.
