sources.body=PBS のアクティビティは、家族の思い出から本を作ることを提案しています。8つの質問、5文の構成、『葉っぱの舟』は Sleep2Story 編集部のオリジナルです。例は架空の物語で、家族による体験談ではありません。また、資料は Sleep2Story を評価したものではありません。
