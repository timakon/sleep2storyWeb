answer.title=本当の細部をひとつ残し、小さな冒険をひとつ加える。
answer.body=思い出を選び、登場人物にしたいことを与え、乗り越えられる障害を置き、分かりやすく終えます。まずは5文だけ。短い会話と想像上の驚きをひとつ加えれば、声に出して読める物語になります。
