memory.title=どんな家族の思い出がお話になる？
memory.body1=門のそばの水たまり、小麦粉のついたキッチンのテーブル、祖父母と乗ったバスなど、情景が目に浮かぶ場面を選びましょう。旅行の全日程を短い話に収めるのは大変。でも、生け垣から帽子を取り戻した午後なら、場所も困りごとも結末もあります。
memory.body2=関わった人が気持ちよく思い返せる出来事を選びます。別の大人の個人的な話を使う前には、特に家族の外へ共有する可能性があるなら、本人に聞きましょう。子どもが嫌がる恥ずかしい出来事も避けます。何気ない楽しい細部があれば、始めるには十分です。
memory.source=PBS KIDS for Parents は、Fred Rogers Productions による関連アクティビティとして、家族の思い出から手作りの本を作る方法を紹介しています。
memory.source_link=家族の絵本づくりを見る
memory.grandparents_link=祖父母に思い出を聞いてみましょう。
memory.grandparents_body=写真や見慣れた物が、話し始めるきっかけになります。
figure.alt=水たまりのそばの親子と黄色い葉っぱの舟、映り込んだ雲を描く温かなイラスト
figure.caption=水たまり、葉っぱ、一緒に過ごした午後。それだけで小さな冒険になります。
prompts.kicker=文章にする前のメモ
prompts.title=物語を見つける8つの質問
prompts.intro=子どもと会話しながら答えても、自分で考えても大丈夫です。各質問には数語のメモで十分。子どもは細部をひとつ選ぶだけでもよく、物語を全部一緒に書く必要はありません。
prompt.1.title=どこにいた？
prompt.1.body=日曜日に起きたことを全部並べるより、「雨上がりの庭の門の前」のように、場所と時間をひとつ決めます。
prompt.2.title=どんな小さなことを覚えている？
prompt.2.body=黄色い葉っぱ、きゅっきゅっと鳴る長靴、温かいパンの匂いなど、見たり聞いたり触れたりできたものを選びます。
prompt.3.title=誰を主人公にする？
prompt.3.body=わが子でも、架空の子でも、動物や物そのものでもかまいません。主な行動をする登場人物をひとり決めましょう。
prompt.4.title=主人公は何をしたい？
prompt.4.body=舟を出す、手袋を見つける、ケーキを家まで運ぶなど、願いはシンプルに。お話に向かう先ができます。
prompt.5.title=何が邪魔をする？
prompt.5.body=小石が舟の行く手をふさぐ、袋の口が閉まらない、といった小さな障害で十分です。寝る前の話に怖い危険は要りません。
prompt.6.title=誰が、または何が助けてくれる？
prompt.6.body=家族、そよ風、おしゃべりなスズメがヒントをくれるかもしれません。想像の要素をひとつ加えるのによい場所です。
prompt.7.title=主人公は何を試す？
prompt.7.body=聴く子が思い浮かべられる行動を選びます。小枝を動かす、音を追いかける、もっと軽い乗客を探すなど。
prompt.8.title=冒険はどこで終わる？
prompt.8.body=物語が落ち着ける場所を用意します。舟が港に着く、手袋の片方が見つかる、みんなで家に帰るなどです。
outline.title=答えを5文にしてみよう
outline.intro=この構成を紙に写し、角括弧を埋めます。表現を練る前に、始まり・途中・終わりが揃います。
outline.1.label=1. なじみのある始まり
outline.1.text=[ある日]、[主人公]は[場所]にいました。そこには[思い出の細部]がありました。
outline.2.label=2. 願い
outline.2.text=[主人公]は[小さな目標]をしたいと思いました。
outline.3.label=3. 困りごと
outline.3.text=でも、[障害]が邪魔をしました。
outline.4.label=4. 試してみる
outline.4.text=[助け手]に助けてもらい、[主人公]は[行動]を試しました。
outline.5.label=5. 落ち着く結末
outline.5.text=やがて[結果]、[主人公]は[静かな最後の行動]をしました。
outline.body=順に読んでみましょう。話の流れが自然なら、台詞と好きな細部をひとつ足します。話が広がりすぎるなら、登場人物か二つ目の問題を減らします。途中を膨らませても、結末を見失わないように。
story.kicker=声に出して読めるオリジナルの物語
story.title=葉っぱの舟
story.intro=この架空の例は、親子が水たまりに葉っぱを浮かべるという、ありふれた家族の場面から始まります。話すスズメと舟に乗る雲は、おとぎ話として加えたものです。
story.1=日曜日、みなとお父さんは、小さな舟の形をした黄色い葉っぱを見つけました。ふたりは庭の門のそばの水たまりに、それを浮かべました。
story.2=「どこまで行くかな？」と、お父さんが聞きました。
story.3=「海まで！」と、みな。ところが葉っぱは小石にぶつかって止まりました。
story.4=近くにスズメが一羽おりてきました。「海への道なら知ってるよ」と、チュンチュン言います。「でもその前に、持っていく価値のあるものを乗せなくちゃ。」
story.5=みなはポケットを探しました。ボタンと、つるつるの石と、短いひもが見つかりました。でも、どれも重すぎます。
story.6=そのとき、水たまりに雲が映っているのに気づきました。「あれなら乗せられる？」
story.7=葉っぱがそっと揺れました。ふわふわの白い雲が、黄色い舟の真ん中に収まりました。
story.8=そよ風が小さな舟を押し、小石を越えました。お父さんの長靴を回り込み、泥でできたふたつの島の間を進みます。みなは横を歩きながら、新しい景色をひとつずつ指さしました。
story.9=水たまりの向こう端で、葉っぱは草むらに着きました。
story.10=「ここ、海じゃないよ」と、みなが言いました。
story.11=「そうだね」と、お父さん。「でも、一緒に来てくれたのは誰かな？」
story.12=雲はまだふたりの頭の上に浮かんでいます。スズメも門で待っています。そして小さな舟と一緒に、ふたりは午後の時間をずっと旅してきたのでした。
story.13=みなは葉っぱを持ち上げ、平たい石の上に置きました。
story.14=「ここがあなたの港だよ」と、舟に言いました。
story.15=それからお父さんと家に入りました。みなは長靴を玄関に置き、最後にもう一度見ようと窓辺へ行きました。
story.16=黄色い舟はとても小さく、その上の空はとても広く見えました。
adapt.title=わが家だけの物語にする
adapt.1.title=家族ならではの細部を残す
adapt.1.body=庭の門を家の近くの道に、お父さんを別の身近な大人に、黄色い葉っぱを丸まった茶色の葉に替えてみましょう。家族の好きな言葉を残してもよいでしょう。長い家族史を書かなくても、こうした小さな選択で、自分たちらしい話になります。
adapt.2.title=どこからが作り話か伝える
adapt.2.body=「あの日、葉っぱを水に浮かべたのは本当だよ。スズメの台詞は考えたんだ」と伝えられます。正確な記録も残したいなら、場所、人、起きたことを別にメモしましょう。そうすれば思い出の記録はそのままに、おとぎ話を自由に変えられます。
adapt.3.title=長さは聴く子に合わせる
adapt.3.body=短くするなら、葉っぱ、小石、港を残して、ポケットを探す場面を省きましょう。参加したい子には、舟の名前や乗客を考えてもらえます。好きな案は取り入れつつ、参加したくないなら聴くだけでも十分です。
reading.title=声に出して読んでから、録るか決める
reading.body1=録音アプリを開く前に、文章を最後まで書きましょう。名前を声に出し、つかえる文は短く分け、誰の台詞か確認します。結末も読んでみてください。新たな問題を出すのではなく、冒険が終わる形になっているとよいでしょう。
reading.body2=自分が読んだそのままを残したいなら、スマホで物語の全文を録音します。あなたの間や笑い声、発音も残ります。短い試し録りからファイルの保存まで、こちらのガイドで紹介しています：
reading.recording_link=寝る前の物語を録音する方法
reading.body3=文章だけ用意して、別の夜に読むのでも大丈夫。寝る前に書いて、練習して、録音まで済ませる必要はありません。今夜は、こちらのガイドの方法を試してみてください：
reading.tired_link=読み聞かせをする元気がない保護者へ
product.eyebrow=公開準備中 · iOS と Android
product.title=書き終えた物語を、聴ける形に
product.body=Sleep2Story は、大人が提供する物語の全文を、本人が同意した成年の家族の声のサンプルで合成朗読にするアプリとして開発中です。個人の物語ライブラリとプレーヤーを予定しています。物語を代筆したり、その大人が実際に読んだ音声を保存したりするものではありません。
product.body2=アプリはまだ公開準備中です。家族のお話を書く、声に出して読む、スマホで通常の録音をすることは今からできます。
product.cta=Sleep2Story の使い方を見る
faq.title=思い出を物語にする際の質問
faq.1.question=すべて本当にあったことにすべきですか？
faq.1.answer=いいえ。覚えている部分と想像した部分を子どもに伝えましょう。家族の記録も残すなら、事実のメモは物語と別に保管します。
faq.2.question=主人公を架空の人物にしてもいいですか？
faq.2.answer=はい。キツネやおもちゃの舟、架空の子を、実在する人の代わりにできます。思い出とのつながりを残すため、なじみのある細部をひとつ入れましょう。
faq.3.question=子どもが一緒に作りたがらないときは？
faq.3.answer=大人が書き、聴けるお話として贈りましょう。子どもは聴くだけでも、後から名前を決めても、別の話を頼んでもかまいません。参加は自由です。
faq.4.question=家族の物語はどのくらいの長さがいいですか？
faq.4.answer=まず5文の版を作って、声に出して読みます。ふたりとももっと聴きたければ細部を足しましょう。無理なく辿り着ける結末を選べば十分で、決まった朗読時間はありません。
faq.5.question=Sleep2Story が物語を書いてくれますか？
faq.5.answer=いいえ。大人が文章の全文を用意します。Sleep2Story は、本人が同意した大人の声のサンプルで朗読するために準備中です。アプリストアではまだ公開されていません。
