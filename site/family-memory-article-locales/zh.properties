answer.title=留住一个真实细节，再添一段小冒险。
answer.body=选一段回忆，给主角一个要做的事，安排一道不太难的障碍，再让故事有个明确的结尾。先写5句话，然后加一点对话和一个想象中的惊喜，就有了一篇可以读给孩子听的故事。
