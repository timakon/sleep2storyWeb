product.title=把写好的故事准备成可以听的版本
product.body=Sleep2Story 正在开发中，计划用成年家庭成员在知情同意下提供的声音样本，为家长提交的完整故事文本生成合成朗读。计划中的应用包含个人故事库和播放器。它不会替你写故事，也不会保存这位成年人的原声朗读。
product.body2=应用还在准备发布。现在你就可以写下故事，读给孩子听，或用手机做一份普通录音。
