faq.title=关于把回忆写成故事的常见问题
faq.1.question=每个细节都必须是真的吗？
faq.1.answer=不必。告诉孩子哪些是你记得的，哪些是编出来的。如果还想留下家庭记录，可以把真实经过单独记下，和童话故事分开。
faq.2.question=主角可以是虚构的吗？
faq.2.answer=可以。狐狸、玩具船或虚构的小朋友，都可以代替真实的人。留一个熟悉的细节，让故事仍然和那段回忆有关。
faq.3.question=如果孩子不想参与怎么办？
faq.3.answer=你可以自己写，把它当作故事讲给孩子听。孩子可以只听，也可以以后再给角色起名，或要求换一个故事。参与是自愿的。
faq.4.question=家庭故事应该写多长？
faq.4.answer=先写5句话的版本，读出来听听。如果你们都想多听一点，再加些细节。选一个能自然讲到的结尾，没有规定的朗读时长。
faq.5.question=Sleep2Story 能替我写故事吗？
faq.5.answer=不能。成年人需要提供完整的故事文本。Sleep2Story 正在开发一项功能，计划利用取得本人同意的成年人的声音样本来朗读这篇故事。应用尚未在应用商店上线。
