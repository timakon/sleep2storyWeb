figure.caption=一个水洼、一片树叶、一个一起度过的下午，足够开启一段小冒险。
prompts.kicker=动笔前先记几笔
prompts.title=用8个问题找到你家的故事
prompts.intro=你可以和孩子聊聊这些问题，也可以自己作答。每题写几个词就够了。孩子只选一个细节也可以，不必一起写完整篇故事。
prompt.1.title=当时我们在哪里？
prompt.1.body=说出一个地点和一个时刻，比如「雨后的院门外」，不用讲完星期天发生的所有事。
prompt.2.title=我们记得哪个小细节？
prompt.2.body=选一个能看见、听见或摸到的东西：黄树叶、吱呀作响的雨靴，或刚出炉面包的香味。
prompt.3.title=故事跟着谁走？
prompt.3.body=主角可以是你的孩子、虚构的小朋友、一只动物，甚至一件物品。让一个角色推动故事。
prompt.4.title=主角想做什么？
prompt.4.body=愿望简单就好：让小船出发、找到手套，或把蛋糕带回家。这样故事就有了方向。
prompt.5.title=什么挡住了去路？
prompt.5.body=试试小小的障碍：一颗石子挡住小船，或袋子怎么也合不上。睡前故事不需要吓人的危险。
prompt.6.title=谁或什么能帮忙？
prompt.6.body=一位亲人、一阵风，或一只会说话的麻雀，都能出个主意。这里正适合加入一点想象。
prompt.7.title=主角做了什么尝试？
prompt.7.body=选一个孩子能想象出来的动作：挪开小树枝、循着声音走，或给小船换个更轻的乘客。
prompt.8.title=冒险在哪里结束？
prompt.8.body=给故事一个可以停靠的地方：小船到了港口，手套找到了另一只，大家回到了家。
outline.title=把答案写成5句话
outline.intro=把下面的提纲抄在纸上，填好括号。这样在琢磨措辞之前，就已经有了开头、经过和结尾。
outline.1.label=1. 熟悉的开头
outline.1.text=[某一天]，[主角]来到[地点]，那里有[记忆中的细节]。
outline.2.label=2. 一个愿望
outline.2.text=[主角]想要[一个小目标]。
outline.3.label=3. 遇到难题
outline.3.text=可是[障碍]挡住了去路。
outline.4.label=4. 试着解决
outline.4.text=在[帮手]的帮助下，[主角]试着[做一件事]。
outline.5.label=5. 安心的结尾
outline.5.text=最后，[结果]，[主角]又[一个安静的收尾动作]。
outline.body=按顺序读一遍这5句话。如果情节通顺，再加一句对话和一个你喜欢的细节。如果故事跑远了，就删掉一个角色或第二个难题。扩写经过时，别忘了故事要在哪里结束。
story.kicker=一篇可以读给孩子听的原创故事
story.title=树叶小船
story.intro=下面是一个虚构的例子，起点是普通的家庭场景：孩子和爸爸让一片树叶在水洼里漂起来。会说话的麻雀和搭船的云朵，是故事里加上的想象。
story.1=星期天，小米和爸爸发现一片黄色的树叶，形状像一艘小船。他们把它放进院门旁的水洼里。
story.2=「它要去哪里呀？」爸爸问。
story.3=「去大海！」小米说。可树叶碰到一颗石子，停了下来。
story.4=一只麻雀落在旁边。「我知道去大海的路，」它叽叽喳喳地说，「不过，你得先带上一样值得带走的东西。」
story.5=小米翻了翻口袋。她找到一颗纽扣、一块光滑的小石头，还有一截绳子。它们都太重了。
story.6=这时，她看见水洼里倒映着一朵云。「把它带上，行吗？」
story.7=树叶轻轻晃了晃。那朵软软的白云，落进了它黄色的船舱。
story.8=一阵微风推着小船绕过石子。它从爸爸的雨靴旁驶过，又穿过两座泥土小岛。小米跟在旁边，每到一个新地方就指给爸爸看。
story.9=漂到水洼另一头时，树叶碰到了一丛草。
story.10=「这里不是大海呀。」小米说。
story.11=「不是，」爸爸说，「不过你看，谁一路跟着我们来了？」
story.12=云朵还飘在他们头顶。麻雀正在院门上等着。而那艘小船，载着他们穿过了整整一个下午。
story.13=小米捧起树叶，把它放在一块平平的石头上。
story.14=「你的港口到了。」她对小船说。
story.15=然后，她和爸爸回到屋里。小米把雨靴留在门口，又走到窗边看了最后一眼。
story.16=黄色的小船看起来很小，它上面的天空却很大很大。
adapt.title=把故事写成你家的样子
adapt.1.title=留下只属于你们的细节
adapt.1.body=把院门换成你家的街道，把爸爸换成另一位熟悉的大人，或把黄树叶换成一片卷起来的褐色叶子。也可以留下家里常说的一句话。这些小选择能让故事更亲切，不必交代一大段家族往事。
adapt.2.title=告诉孩子想象从哪里开始
adapt.2.body=你可以说：「那天我们真的让树叶在水里漂起来了。麻雀说的话是我编的。」如果也想留下准确的纪念，另记一份笔记，写清地点、人物和真实经过。以后想怎么改写童话，都不会混淆那段回忆。
adapt.3.title=故事长短可以听孩子的
adapt.3.body=想讲短一点，就留下树叶、石子和港口，省去翻口袋那一段。想参与的孩子可以给小船起名，或为它挑一位乘客。喜欢的点子记下来；如果孩子只想听，也完全可以。
reading.title=先读一遍，再决定要不要录音
reading.body1=打开录音机之前，先把文字写完。念一念人物的名字，把读起来拗口的长句拆开，并确认谁在说话。结尾也要读：它应该让冒险收束，而不是再抛出一个难题。
reading.body2=如果想保存自己一字不差的朗读，就用手机录下整篇故事。这样会保留你的停顿、笑声和读法。我们的指南会带你做一次简单的试音，再保存录好的文件：
