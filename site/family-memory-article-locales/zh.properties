memory.title=哪段家庭回忆适合写成故事？
memory.body1=挑一个你能清楚想起的场景：门边的水洼、沾满面粉的餐桌，或和爷爷奶奶一起坐公交的那段路。把整个假期塞进短故事里很难；而从树篱里救回帽子的那个下午，已经有地点、难题和结局了。
memory.body2=选一段当事人愿意重温的回忆。用到另一位成年人的私事前先问问对方，尤其是打算讲给家人以外的人听时。如果孩子不喜欢听自己出糗，也别把那件事写进去。一个平凡又愉快的细节，就足够开头。
memory.source=PBS KIDS for Parents 刊有 Fred Rogers Productions 的相关活动：围绕家庭回忆亲手制作一本故事书。
memory.source_link=查看家庭故事书活动
memory.grandparents_link=请家里的长辈讲一段回忆。
memory.grandparents_body=一张照片或一件熟悉的物品，就能打开话题。
