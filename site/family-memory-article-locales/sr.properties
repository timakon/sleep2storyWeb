answer.title=Sačuvajte jedan stvarni detalj. Dodajte malu pustolovinu.
answer.body=Izaberite uspomenu, dajte junaku neki zadatak, dodajte prepreku koju može da savlada i dovedite priču do jasnog kraja. Prvo napišite pet rečenica. Dodajte kratak razgovor i jedno izmišljeno iznenađenje, i priča je spremna za čitanje naglas.
