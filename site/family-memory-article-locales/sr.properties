figure.caption=Bara, list i zajedničko popodne: dovoljno za malu pustolovinu.
prompts.kicker=Prvo beleške, pa rečenice
prompts.title=Osam pitanja koja će vam pomoći da smislite priču
prompts.intro=Razgovarajte o ovim pitanjima sa detetom ili sami zapišite odgovore. Dovoljno je nekoliko reči za svako pitanje. Dete može da izabere jedan detalj, bez obaveze da učestvuje u pisanju cele priče.
prompt.1.title=Gde smo bili?
prompt.1.body=Odredite jedno mesto i jedan trenutak: ispred baštenske kapije posle kiše, umesto svega što se dogodilo u nedelju.
prompt.2.title=Kog sitnog detalja se sećamo?
prompt.2.body=Izaberite nešto što ste videli, čuli, dodirnuli ili omirisali: žuti list, čizme koje škripe ili topao hleb.
prompt.3.title=Ko je glavni junak priče?
prompt.3.body=To može da bude vaše dete, izmišljeno dete, životinja ili sam predmet. Neka jedan junak vodi glavnu radnju.
prompt.4.title=Šta taj junak želi?
prompt.4.body=Neka želja bude jednostavna: da porine brodić, pronađe rukavicu ili donese tortu kući. Ona daje pravac priči.
prompt.5.title=Šta mu stoji na putu?
prompt.5.body=Dodajte malu prepreku: kamenčić zaustavi brodić ili torba neće da se zatvori. Priči za laku noć nije potrebna strašna opasnost.
prompt.6.title=Ko ili šta može da pomogne?
prompt.6.body=Rođak, povetarac ili vrabac koji govori mogu da predlože rešenje. Ovde možete da ubacite jedan izmišljeni detalj.
prompt.7.title=Šta junak pokušava?
prompt.7.body=Izaberite radnju koju slušalac može da zamisli. Dete pomera grančicu, prati neki zvuk ili pronalazi lakšeg putnika.
prompt.8.title=Gde se pustolovina završava?
prompt.8.body=Pronađite mirno mesto za kraj: brodić stiže u luku, rukavica pronalazi svoj par, svi se vraćaju kući.
outline.title=Pretvorite odgovore u pet rečenica
outline.intro=Prepišite ovaj plan na papir i dopunite delove u zagradama. Tako ćete imati početak, sredinu i kraj pre nego što počnete da doterujete rečenice.
outline.1.label=1. Poznat početak
outline.1.text=Jednog [dana], [junak] se nalazi [mesto], gde [detalj iz uspomene].
outline.2.label=2. Želja
outline.2.text=[Junak] želi da [mali cilj].
outline.3.label=3. Problem
outline.3.text=Ali plan zaustavlja jedna prepreka: [prepreka].
outline.4.label=4. Pokušaj
outline.4.text=Uz pomoć [ime pomagača], [junak] pokušava da [radnja].
outline.5.label=5. Miran kraj
outline.5.text=Na kraju, [ishod], a [junak] [mirna završna radnja].
outline.body=Pročitajte rečenice redom. Ako je radnja jasna, dodajte jednu repliku i detalj koji vam se dopada. Ako priča luta, izbacite jednog junaka ili dodatni problem. Dok proširujete sredinu, imajte kraj na umu.
story.kicker=Originalna priča za čitanje naglas
story.title=Brodić od lista
story.intro=Ovaj izmišljeni primer počinje običnim porodičnim prizorom: dete i roditelj puštaju list da plovi po bari. Vrabac koji govori i oblak kao putnik donose malo čarolije.
story.1=Jedne nedelje, Mina i tata pronašli su žuti list nalik malom brodu. Spustili su ga u baru pored baštenske kapije.
story.2=„Kuda će da plovi?”, upitao je tata.
story.3=„Do mora”, rekla je Mina. Ali list je udario u kamenčić i stao.
story.4=U blizini je sleteo vrabac. „Znam put do mora”, zacvrkutao je. „Samo prvo morate da ponesete nešto što vredi poneti.”
story.5=Mina je pretražila džepove. Pronašla je dugme, gladak kamen i parče kanapa. Sve je bilo preteško.
story.6=Onda je primetila oblak koji se ogledao u bari. „Možeš li njega da poneseš?”
story.7=List se blago zaljuljao. Oblak se smestio u njegovu žutu sredinu, mek i beo.
story.8=Povetarac je gurnuo brodić pored kamenčića. Otplovio je oko tatine čizme i između dva ostrva od blata. Mina je išla pored njega i pokazivala mu svako novo mesto.
story.9=Na drugom kraju bare, list je stigao do trave.
story.10=„Ovo nije more”, rekla je Mina.
story.11=„Nije”, rekao je tata. „Ali pogledaj ko je sve stigao s nama.”
story.12=Oblak je i dalje plovio iznad njih. Vrabac ih je čekao na kapiji. A njihov mali brodić provezao ih je kroz čitavo jedno popodne.
story.13=Mina je podigla list i spustila ga na pljosnat kamen.
story.14=„Evo tvoje luke”, rekla mu je.
story.15=Zatim su ona i tata ušli u kuću. Mina je ostavila čizme pored vrata i prišla prozoru da još jednom pogleda napolje.
story.16=Žuti brodić izgledao je sasvim malen, a nebo iznad njega ogromno.
adapt.title=Neka priča pripada vašoj porodici
adapt.1.title=Sačuvajte detalj koji je baš vaš
adapt.1.body=Umesto baštenske kapije stavite svoju ulicu, umesto tate drugu blisku odraslu osobu, a umesto žutog lista uvijen smeđi list. Sačuvajte neku omiljenu porodičnu reč. Takvi mali izbori čine priču ličnom, bez potrebe da prepričavate celu istoriju porodice.
adapt.2.title=Recite gde počinje mašta
adapt.2.body=Pokušajte ovako: „Tog dana smo stvarno pustili list da plovi. A ono što je vrabac rekao smo izmislili.” Ako želite i tačan zapis uspomene, posebno zabeležite mesto, učesnike i događaj. Tada bajka može da se menja, a da vaš zapis ostane sačuvan.
adapt.3.title=Prilagodite dužinu slušaocu
adapt.3.body=Za kraću verziju zadržite list, kamenčić i luku, a preskočite pretragu džepova. Dete koje želi da učestvuje može da smisli ime brodića ili predloži putnika. Zadržite njegovu omiljenu ideju, ali neka bude dovoljno i samo da sluša ako ne želi da se uključi.
reading.title=Pročitajte naglas, pa odlučite da li ćete snimiti priču
reading.body1=Završite tekst pre nego što uključite snimanje. Izgovorite imena naglas, podelite rečenice kod kojih zapinjete i proverite da li je jasno ko govori. Pročitajte i kraj: treba da završi pustolovinu, a ne da uvede novi problem.
reading.body2=Ako želite da sačuvate baš svoje čitanje, snimite celu priču telefonom. Tako ostaju vaše pauze, smeh i izgovor. Naš vodič objašnjava kratku proveru zvuka i čuvanje gotovog snimka:
reading.recording_link=kako snimiti priču za laku noć
reading.body3=Tekst možete da ostavite spreman i za neko drugo veče. Ne morate da pišete, vežbate i snimate pred samo spavanje. Za večeras pogledajte predloge u našem vodiču za
reading.tired_link=roditelje koji su preumorni da čitaju
product.eyebrow=U pripremi · iOS i Android
product.title=Vaš gotov tekst, pripremljen za slušanje
product.body=Sleep2Story se razvija kako bi od celog teksta priče koji dostavi odrasla osoba napravio sintetičku naraciju, na osnovu uzorka glasa odraslog člana porodice koji je dao saglasnost. Planirana aplikacija sadrži ličnu biblioteku priča i plejer. Aplikacija ne piše priču, a tako dobijena naracija nije snimak na kojem ta osoba sama čita ceo tekst.
product.body2=Aplikacija se još priprema za objavljivanje. Naracija je planirana na engleskom i ruskom; drugi jezici sajta ne znače da je naracija dostupna i na tim jezicima. Svoju porodičnu priču već sada možete da napišete, pročitate i snimite običnim snimačem na telefonu.
product.cta=Pogledajte kako radi Sleep2Story
faq.title=Pitanja o pretvaranju uspomena u priče
faq.1.question=Da li svaki detalj mora da bude istinit?
faq.1.answer=Ne. Recite detetu čega se sećate, a šta ste izmislili. Ako želite i porodični zapis, čuvajte beleške o stvarnim događajima odvojeno od bajke.
faq.2.question=Možemo li da izmislimo glavnog junaka?
faq.2.answer=Da. Lisica, brodić igračka ili izmišljeno dete mogu da zamene stvarnu osobu. Sačuvajte jedan poznat detalj kako bi priča i dalje bila povezana sa uspomenom.
faq.3.question=Šta ako dete ne želi da učestvuje?
faq.3.answer=Napišite priču sami i ponudite detetu da je posluša. Ono može da sluša, kasnije izabere ime ili zatraži neku drugu priču. Učešće nije obavezno.
faq.4.question=Koliko duga treba da bude naša porodična priča?
faq.4.answer=Počnite verzijom od pet rečenica i pročitajte je naglas. Dodajte detalje ako oboje želite još. Izaberite kraj do kojeg možete da stignete bez napora; ne postoji obavezno trajanje čitanja.
faq.5.question=Da li Sleep2Story piše priču umesto mene?
faq.5.answer=Ne. Odrasla osoba dostavlja ceo tekst. Sleep2Story se priprema za stvaranje naracije na engleskom ili ruskom na osnovu tog teksta i uzorka glasa odrasle osobe koja je dala saglasnost. Još nije dostupan u prodavnicama aplikacija.
