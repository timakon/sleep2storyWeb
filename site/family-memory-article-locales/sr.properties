sources.body=Aktivnost PBS-a predlaže pravljenje knjige od porodičnih uspomena. Osam pitanja, plan od pet rečenica i Brodić od lista originalni su materijali uredništva Sleep2Story. Primer je izmišljen i ne predstavlja iskustvo stvarne porodice; navedeni izvor ne ocenjuje Sleep2Story.
