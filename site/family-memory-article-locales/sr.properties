memory.title=Koja porodična uspomena može da postane priča?
memory.body1=Izaberite prizor koji možete da zamislite: baru pored kapije, kuhinjski sto posut brašnom, vožnju autobusom sa bakom ili dekom. Ceo odmor teško staje u kratku priču. Ali popodne kada ste izvukli šešir iz žive ograde već ima mesto, problem i kraj.
memory.body2=Izaberite uspomenu koje se svi učesnici rado sećaju. Pitajte drugu odraslu osobu pre nego što upotrebite njenu ličnu priču, naročito ako nameravate da je podelite van porodice. Izostavite detetovu neprijatnu zgodu ako ono ne voli da je sluša. Za početak je dovoljan jedan običan, lep detalj.
memory.source=PBS KIDS for Parents objavljuje srodnu aktivnost organizacije Fred Rogers Productions: pravljenje knjižice zasnovane na porodičnoj uspomeni.
memory.source_link=Pogledajte ideju za porodičnu knjižicu
