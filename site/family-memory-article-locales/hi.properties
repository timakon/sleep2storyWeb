memory.title=परिवार की कौन सी याद कहानी बन सकती है?
memory.body1=ऐसा दृश्य चुनें जो आँखों के सामने आ जाए: गेट के पास पानी का गड्ढा, आटे से सनी रसोई की मेज़ या दादा-दादी के साथ बस का सफ़र। पूरी छुट्टी को छोटी कहानी में समेटना मुश्किल है। मगर झाड़ी में अटकी टोपी निकालने वाली दोपहर में जगह, समस्या और अंत—तीनों पहले से हैं।
memory.body2=ऐसी याद लें जिसे उससे जुड़े लोग दोबारा सुनकर सहज महसूस करें। किसी और बड़े की निजी बात इस्तेमाल करने से पहले पूछें, खासकर यदि कहानी परिवार के बाहर साझा करनी हो। बच्चे को कोई शर्मिंदगी वाली घटना पसंद नहीं है तो उसे छोड़ दें। शुरू करने के लिए एक साधारण, सुखद बात ही काफी है।
memory.source=PBS KIDS for Parents पर Fred Rogers Productions की एक जुड़ी गतिविधि है: परिवार की याद पर हाथ से छोटी किताब बनाना।
