sources.title=स्रोत और संपादकीय टिप्पणी
sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: Tell Me a Story: A Caregiving Storybook
sources.body=PBS की गतिविधि परिवार की यादों से किताब बनाने का सुझाव देती है। आठ सवाल, पाँच वाक्यों की रूपरेखा और 'पत्ते की नाव' Sleep2Story की मौलिक संपादकीय सामग्री हैं। कहानी काल्पनिक मिसाल है, किसी परिवार का अनुभव नहीं; स्रोत Sleep2Story का मूल्यांकन नहीं करता।
