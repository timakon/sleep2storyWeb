answer.title=एक असली बात रखें। उसमें छोटा सा रोमांच जोड़ें।
answer.body=कोई याद चुनें। पात्र को कुछ करने को दें, रास्ते में एक हल्की सी अड़चन रखें और कहानी को साफ़ अंत तक पहुँचाएँ। पहले पाँच वाक्य लिखें। फिर थोड़ा संवाद और एक कल्पनाशील मोड़ जोड़ दें। कहानी सुनाने के लिए तैयार है।
