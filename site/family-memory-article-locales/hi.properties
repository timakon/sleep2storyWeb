product.eyebrow=तैयारी में · iOS और Android
product.title=आपका पूरा लिखा पाठ, सुनाने के लिए तैयार
product.body=Sleep2Story को इस तरह बनाया जा रहा है कि कोई बड़ा व्यक्ति जो पूरी कहानी लिखे, उसे परिवार के सहमति देने वाले वयस्क की आवाज़ के नमूने से कृत्रिम स्वर में सुनाया जा सके। नियोजित ऐप में निजी कहानी संग्रह और प्लेयर होगा। यह कहानी खुद नहीं लिखता और उस व्यक्ति के असली पाठ की रिकॉर्डिंग भी सुरक्षित नहीं करता।
product.body2=ऐप अभी जारी होने की तैयारी में है। फिलहाल आप अपनी पारिवारिक कहानी लिख सकते हैं, पढ़ सकते हैं और फ़ोन पर सामान्य रिकॉर्डिंग कर सकते हैं।
product.cta=जानें Sleep2Story कैसे काम करेगा
faq.title=यादों से कहानी बनाने पर सवाल
faq.1.question=क्या हर बात सच होनी चाहिए?
faq.1.answer=नहीं। बच्चे को बताइए कि कौन सा हिस्सा याद है और कौन सा आपने कल्पना से जोड़ा है। परिवार की असली याद भी सँभालनी हो तो उसके तथ्य कहानी से अलग लिखें।
faq.2.question=क्या मुख्य पात्र काल्पनिक रख सकते हैं?
faq.2.answer=हाँ। असली व्यक्ति की जगह लोमड़ी, खिलौना नाव या कल्पना का बच्चा रख सकते हैं। याद से जुड़ी एक परिचित बात रखेंगे तो कहानी का रिश्ता बना रहेगा।
faq.3.question=अगर बच्चा साथ में कहानी न बनाना चाहे तो?
faq.3.answer=खुद लिखकर उसे सुनाएँ। बच्चा सिर्फ सुन सकता है, बाद में कोई नाम चुन सकता है या दूसरी कहानी माँग सकता है। साथ लिखना ज़रूरी नहीं।
faq.4.question=परिवार की कहानी कितनी लंबी हो?
faq.4.answer=पाँच वाक्यों से शुरू करें और ज़ोर से पढ़ें। आप दोनों और सुनना चाहें तो बारीकियाँ जोड़ें। ऐसा अंत चुनें जहाँ आराम से पहुँचा जा सके; पढ़ने की कोई तय अवधि नहीं।
faq.5.question=क्या Sleep2Story मेरे लिए कहानी लिखेगा?
faq.5.answer=नहीं। बड़े को पूरा पाठ देना होगा। Sleep2Story को सहमति देने वाले वयस्क की आवाज़ के नमूने से उसे सुनाने के लिए तैयार किया जा रहा है। यह अभी ऐप स्टोर में उपलब्ध नहीं है।
