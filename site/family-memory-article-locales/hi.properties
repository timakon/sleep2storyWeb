prompts.kicker=वाक्य लिखने से पहले कुछ नोट
prompts.title=अपनी कहानी ढूँढ़ने के आठ सवाल
prompts.intro=इन सवालों पर बच्चे से बात करें या खुद जवाब लिखें। हर सवाल के लिए कुछ शब्द भी काफी हैं। पूरी कहानी लिखने की ज़िम्मेदारी दिए बिना बच्चा एक बात चुन सकता है।
prompt.1.title=हम कहाँ थे?
prompt.1.body=एक जगह और एक पल बताइए: रविवार भर की हर बात के बजाय बारिश के बाद बगीचे के गेट के बाहर का दृश्य।
prompt.2.title=कौन सी छोटी बात याद है?
prompt.2.body=कुछ ऐसा चुनें जिसे देखा, सुना या छुआ जा सके: पीला पत्ता, चरमराते जूते या गरम रोटी की खुशबू।
prompt.3.title=कहानी किसके साथ चलेगी?
prompt.3.body=आपका बच्चा, कोई काल्पनिक बच्चा, जानवर या वह चीज़ खुद भी मुख्य पात्र हो सकती है। कहानी का मुख्य काम एक पात्र को दें।
prompt.4.title=वह पात्र क्या चाहता है?
prompt.4.body=इच्छा छोटी रखें: नाव चलाना, दस्ताना ढूँढ़ना या केक घर पहुँचाना। इससे कहानी को दिशा मिलती है।
prompt.5.title=रास्ते में क्या अटकता है?
prompt.5.body=हल्की अड़चन रखें: कंकड़ नाव रोक दे या थैला बंद न हो। सोते समय की कहानी में डरावना खतरा ज़रूरी नहीं।
prompt.6.title=कौन या क्या मदद करेगा?
prompt.6.body=रिश्तेदार, हवा का झोंका या बोलती चिड़िया कोई उपाय बता सकती है। यहाँ एक काल्पनिक बात जोड़ सकते हैं।
prompt.7.title=पात्र क्या कोशिश करता है?
prompt.7.body=ऐसा काम चुनें जिसकी तस्वीर सुनने वाले के मन में बन जाए। बच्चा टहनी हटाता है, आवाज़ का पीछा करता है या हल्का यात्री ढूँढ़ता है।
prompt.8.title=रोमांच कहाँ खत्म होता है?
prompt.8.body=कहानी को ठहरने की जगह दें: नाव किनारे पहुँचे, दस्ताने को उसका जोड़ीदार मिले और सब घर लौट आएँ।
outline.title=जवाबों से पाँच वाक्य बनाएँ
outline.intro=इस रूपरेखा को कागज़ पर उतारें और कोष्ठक भरें। शब्द सँवारने से पहले शुरुआत, बीच और अंत साफ़ हो जाएगा।
outline.1.label=1. जानी-पहचानी शुरुआत
outline.1.text=एक [दिन], [पात्र] [जगह] पर था, जहाँ [याद की बात]।
outline.2.label=2. एक इच्छा
outline.2.text=[पात्र] [छोटा लक्ष्य] चाहता था।
outline.3.label=3. एक समस्या
outline.3.text=लेकिन [अड़चन] ने उसे रोक दिया।
outline.4.label=4. एक कोशिश
outline.4.text=[मददगार] की मदद से [पात्र] ने [काम] करने की कोशिश की।
outline.5.label=5. सुकून भरा अंत
outline.5.text=आखिरकार [नतीजा], और [पात्र] ने [शांत अंतिम काम]।
outline.body=इन वाक्यों को क्रम से पढ़ें। घटनाएँ ठीक लगें तो एक संवाद और अपनी पसंद की कोई बारीकी जोड़ें। कहानी भटक रही हो तो एक पात्र या दूसरी समस्या हटा दें। बीच का हिस्सा बढ़ाते समय अंत को सामने रखें।
story.kicker=पढ़कर सुनाने के लिए मौलिक कहानी
story.title=पत्ते की नाव
story.intro=यह काल्पनिक मिसाल परिवार के साधारण पल से शुरू होती है: एक बच्ची और उसके पापा पानी के गड्ढे में पत्ते की नाव चलाते हैं। बोलती चिड़िया और बादल रूपी यात्री कहानी की कल्पना हैं।
story.1=रविवार को मीना और पापा को नाव जैसा एक पीला पत्ता मिला। उन्होंने उसे बगीचे के गेट के पास पानी के गड्ढे में रख दिया।
story.2=“यह कहाँ जाएगी?” पापा ने पूछा।
story.3=“समुद्र तक,” मीना बोली। मगर पत्ता एक कंकड़ से टकराकर रुक गया।
story.4=पास ही एक गौरैया आ बैठी। “मुझे समुद्र का रास्ता पता है,” वह चहकी। “मगर पहले साथ ले जाने लायक कुछ ढूँढ़ो।”
story.5=मीना ने अपनी जेबें टटोलीं। एक बटन, चिकना पत्थर और धागे का टुकड़ा मिला। तीनों बहुत भारी थे।
story.6=तभी उसे पानी में बादल का अक्स दिखा। “क्या इसे साथ ले जा सकती हो?”
story.7=पत्ता धीरे से डोला। सफ़ेद, मुलायम बादल उसके पीले बीचोंबीच आ बैठा।
story.8=हवा के झोंके ने छोटी नाव को कंकड़ के पार धकेल दिया। वह पापा के जूते का चक्कर काटकर कीचड़ के बने दो टापुओं के बीच से निकली। मीना साथ-साथ चलती रही और हर नई जगह दिखाती रही।
story.9=गड्ढे के दूसरे किनारे पर पत्ता घास के पास पहुँच गया।
story.10=“यह तो समुद्र नहीं है,” मीना बोली।
story.11=“नहीं,” पापा ने कहा। “मगर देखो, हमारे साथ कौन आया।”
story.12=बादल अब भी उनके ऊपर तैर रहा था। गौरैया गेट पर बैठी थी। और उनकी छोटी नाव उन्हें पूरी दोपहर पार करा लाई थी।
story.13=मीना ने पत्ता उठाकर एक सपाट पत्थर पर रख दिया।
story.14=“यह तुम्हारा बंदरगाह है,” उसने कहा।
story.15=फिर मीना और पापा अंदर चले गए। मीना ने दरवाज़े के पास जूते उतारे और एक आखिरी नज़र डालने खिड़की पर पहुँची।
story.16=पीली नाव बहुत छोटी लग रही थी, और उसके ऊपर का आसमान बहुत बड़ा।
adapt.title=इसे अपने परिवार की कहानी बनाएँ
adapt.1.title=अपनी याद की खास बात रखें
adapt.1.body=बगीचे के गेट की जगह अपनी गली रखें, पापा की जगह परिवार का कोई और करीबी बड़ा या पीले पत्ते की जगह मुड़ा हुआ भूरा पत्ता। घर में बोला जाने वाला कोई प्यारा शब्द भी रखें। ऐसी छोटी पसंदें लंबा पारिवारिक इतिहास जोड़े बिना कहानी को अपना बनाती हैं।
adapt.2.title=बताएँ कि कल्पना कहाँ से शुरू हुई
adapt.2.body=कह सकते हैं: “उस दिन हमने सच में पत्ते की नाव चलाई थी। चिड़िया की बातें मैंने बनाई हैं।” अगर असली घटना की याद भी सँभालनी है, तो जगह, लोगों और जो हुआ उसके अलग नोट रखें। फिर कहानी बदल सकती है, बिना असली याद को बदले।
adapt.3.title=कहानी की लंबाई बच्चे के हिसाब से रखें
adapt.3.body=छोटा रूप चाहिए तो पत्ता, कंकड़ और किनारा रखें; जेब टटोलने वाला हिस्सा छोड़ दें। बच्चा शामिल होना चाहे तो नाव का नाम या उसका यात्री सुझा सकता है। उसका पसंदीदा विचार रखें, लेकिन वह सिर्फ सुनना चाहे तो वह भी ठीक है।
reading.title=पढ़कर सुनाएँ, फिर तय करें रिकॉर्ड करना है या नहीं
reading.body1=रिकॉर्डर खोलने से पहले पूरा पाठ लिख लें। नाम ज़ोर से बोलकर देखें, जिस वाक्य पर अटकें उसे छोटा करें और साफ़ रखें कि कौन बोल रहा है। अंत भी पढ़ें: उसे रोमांच समेटना चाहिए, नई समस्या नहीं खोलनी चाहिए।
reading.body2=अपनी असली पढ़ने की शैली बचानी हो तो पूरी कहानी फ़ोन पर रिकॉर्ड करें। इससे आपके विराम, हँसी और उच्चारण भी रहेंगे। आवाज़ जाँचने और तैयार फ़ाइल सहेजने के तरीके हमारी गाइड में हैं:
reading.recording_link=सोते समय की कहानी कैसे रिकॉर्ड करें
reading.body3=लिखा हुआ पाठ किसी और शाम के लिए भी रख सकते हैं। सोने के समय ही लिखना, अभ्यास करना और रिकॉर्ड करना ज़रूरी नहीं। आज के लिए हमारी यह गाइड देखें:
