memory.title=Welche Familienerinnerung eignet sich als Geschichte?
memory.body1=Wählen Sie eine Szene, die Sie vor sich sehen: die Pfütze am Gartentor, den Küchentisch voller Mehl, eine Busfahrt mit Oma oder Opa. Ein ganzer Urlaub passt schwer in eine kurze Geschichte. Der Nachmittag, an dem Sie einen Hut aus der Hecke gerettet haben, liefert dagegen schon einen Ort, ein Problem und ein Ende.
memory.body2=Nehmen Sie eine Erinnerung, an die alle Beteiligten gern zurückdenken. Fragen Sie andere Erwachsene, bevor Sie deren persönliche Erlebnisse verwenden, besonders wenn Sie die Geschichte außerhalb der Familie teilen möchten. Lassen Sie peinliche Momente Ihres Kindes weg, wenn es sie nicht gern hört. Ein schönes Alltagsdetail reicht für den Anfang.
memory.source=PBS KIDS for Parents stellt eine passende Bastelidee von Fred Rogers Productions vor: ein selbst gemachtes Buch über eine Familienerinnerung.
memory.source_link=Zur Anleitung für das Erinnerungsbuch
memory.grandparents_link=Bitten Sie Oma oder Opa um eine Erinnerung.
memory.grandparents_body=Ein Foto oder ein vertrauter Gegenstand kann den Einstieg ins Gespräch erleichtern.
