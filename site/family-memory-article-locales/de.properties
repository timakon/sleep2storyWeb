product.eyebrow=In Vorbereitung · iOS und Android
product.title=Ihr fertiger Text wird zur Hörgeschichte
product.body=Sleep2Story wird entwickelt, um den vollständigen Text, den ein Erwachsener bereitstellt, in eine synthetisch erzeugte Hörfassung umzuwandeln. Grundlage ist die Stimmprobe eines erwachsenen Familienmitglieds, das der Nutzung zugestimmt hat. Die geplante App umfasst eine persönliche Geschichtenbibliothek und einen Audioplayer. Sie schreibt die Geschichte nicht und bewahrt auch keine Originalaufnahme, in der dieser Erwachsene den gesamten Text vorgelesen hat.
product.body2=Die App wird noch für die Veröffentlichung vorbereitet. Die Sprachausgabe ist für Englisch und Russisch geplant. Die weiteren Sprachen der Website bedeuten nicht, dass die App Geschichten in diesen Sprachen vertont. Ihre Familiengeschichte können Sie schon jetzt schreiben, vorlesen und ganz normal mit dem Handy aufnehmen.
product.cta=So funktioniert Sleep2Story
faq.title=Fragen zu Geschichten aus Familienerinnerungen
faq.1.question=Muss jedes Detail wahr sein?
faq.1.answer=Nein. Erzählen Sie Ihrem Kind, woran Sie sich erinnern und was Sie erfunden haben. Wenn Sie das Erlebnis auch für die Familie festhalten möchten, bewahren Sie die sachlichen Notizen getrennt vom Märchen auf.
faq.2.question=Dürfen wir die Hauptfigur erfinden?
faq.2.answer=Ja. Ein Fuchs, ein Spielzeugboot oder ein erfundenes Kind kann an die Stelle einer echten Person treten. Behalten Sie ein vertrautes Detail bei, damit die Geschichte mit der Erinnerung verbunden bleibt.
faq.3.question=Was ist, wenn mein Kind nicht mitmachen möchte?
faq.3.answer=Schreiben Sie die Geschichte selbst und bieten Sie sie zum Zuhören an. Ihr Kind kann zuhören, später einen Namen auswählen oder sich eine andere Geschichte wünschen. Mitmachen ist freiwillig.
faq.4.question=Wie lang sollte unsere Familiengeschichte sein?
faq.4.answer=Beginnen Sie mit der Fassung aus fünf Sätzen und lesen Sie sie laut vor. Ergänzen Sie Details, wenn Sie beide mehr möchten. Wählen Sie ein Ende, das Sie gut erreichen können. Eine feste Vorlesedauer gibt es nicht.
faq.5.question=Schreibt Sleep2Story die Geschichte für mich?
faq.5.answer=Nein. Ein Erwachsener stellt den vollständigen Text bereit. Sleep2Story wird entwickelt, um daraus mit der Stimmprobe eines Erwachsenen eine englische oder russische Hörfassung zu erzeugen. Der Erwachsene muss der Nutzung seiner Stimme zugestimmt haben. Die App ist noch nicht in den App-Stores erhältlich.
