sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: Ein selbst gemachtes Buch mit Familienerinnerungen
sources.body=Die Bastelidee von PBS regt dazu an, aus Familienerinnerungen ein Buch zu machen. Die acht Fragen, die Vorlage aus fünf Sätzen und „Das Blätterboot“ sind eigene redaktionelle Inhalte von Sleep2Story. Die Beispielgeschichte ist erfunden und kein Erfahrungsbericht einer Familie. Die Quelle bewertet Sleep2Story nicht.
