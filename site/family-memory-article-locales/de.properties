prompts.kicker=Erst Stichworte, dann Sätze
prompts.title=Acht Fragen, mit denen Sie Ihre Geschichte finden
prompts.intro=Mit diesen Fragen können Sie gemeinsam oder allein Geschichten für Kinder erfinden. Ein paar Stichworte pro Frage reichen. Ihr Kind kann ein Detail auswählen, ohne an der ganzen Geschichte mitschreiben zu müssen.
prompt.1.title=Wo waren wir?
prompt.1.body=Nennen Sie einen Ort und einen Moment: nach dem Regen vor dem Gartentor, statt alles aufzuzählen, was am Sonntag passiert ist.
prompt.2.title=An welches kleine Detail erinnern wir uns?
prompt.2.body=Wählen Sie etwas, das man sehen, hören, fühlen oder riechen konnte: ein gelbes Blatt, quietschende Stiefel oder den Duft von warmem Brot.
prompt.3.title=Wer steht im Mittelpunkt?
prompt.3.body=Das kann Ihr Kind sein, ein erfundenes Kind, ein Tier oder der Gegenstand selbst. Lassen Sie eine Figur die Hauptrolle übernehmen.
prompt.4.title=Was möchte diese Figur erreichen?
prompt.4.body=Ein einfacher Wunsch genügt: ein Boot zu Wasser lassen, einen Fäustling finden oder einen Kuchen nach Hause bringen. Damit bekommt die Geschichte eine Richtung.
prompt.5.title=Was steht im Weg?
prompt.5.body=Nehmen Sie ein kleines Hindernis: Ein Kiesel hält das Boot auf, oder die Tasche geht nicht zu. Eine Gute-Nacht-Geschichte braucht keine beängstigende Gefahr.
prompt.6.title=Wer oder was könnte helfen?
prompt.6.body=Ein Verwandter, ein Windhauch oder ein sprechender Spatz kann eine Idee beisteuern. Hier lässt sich gut etwas Erfundenes einbauen.
prompt.7.title=Was versucht die Figur?
prompt.7.body=Wählen Sie eine Handlung, die man sich gut vorstellen kann. Das Kind schiebt einen Zweig zur Seite, folgt einem Geräusch oder findet einen leichteren Fahrgast.
prompt.8.title=Wo endet das Abenteuer?
prompt.8.body=Geben Sie der Geschichte einen ruhigen Abschluss: Das Boot erreicht seinen Hafen, der Fäustling findet sein Gegenstück, alle gehen nach Hause.
outline.title=Aus Ihren Antworten werden fünf Sätze
outline.intro=Schreiben Sie diese Vorlage auf ein Blatt Papier und ersetzen Sie die Wörter in Klammern durch Ihre eigenen Ideen. So stehen Anfang, Mitte und Ende fest, bevor Sie an den Formulierungen feilen.
outline.1.label=1. Ein vertrauter Anfang
outline.1.text=An einem [Tag] war [Figur] an [Ort] und bemerkte [Detail aus der Erinnerung].
outline.2.label=2. Ein Wunsch
outline.2.text=[Figur] wollte [kleines Ziel].
outline.3.label=3. Ein Problem
outline.3.text=Doch [Hindernis] kam dazwischen.
outline.4.label=4. Ein Versuch
outline.4.text=Mit Hilfe von [Helfer] versuchte [Figur], [Handlung].
outline.5.label=5. Ein ruhiger Abschluss
outline.5.text=Am Ende [Ergebnis], und [Figur] [ruhige letzte Handlung].
outline.body=Lesen Sie die Sätze der Reihe nach. Ist die Handlung schlüssig, ergänzen Sie etwas wörtliche Rede und ein Detail, das Ihnen gefällt. Verzettelt sich die Geschichte, streichen Sie eine Figur oder ein zweites Problem. Behalten Sie das Ende im Blick, während Sie die Mitte ausschmücken.
story.kicker=Eine Originalgeschichte zum Vorlesen
story.title=Das Blätterboot
story.intro=Dieses erfundene Beispiel beginnt mit einer alltäglichen Familienszene: Ein Kind und ein Elternteil lassen ein Blatt auf einer Pfütze schwimmen. Der sprechende Spatz und die Wolke als Fahrgast bringen das Märchenhafte hinein.
story.1=Am Sonntag fanden Mina und Papa ein gelbes Blatt, das wie ein kleines Boot aussah. Sie legten es in eine Pfütze neben dem Gartentor.
story.2=„Wohin soll es fahren?“, fragte Papa.
story.3=„Zum Meer“, sagte Mina. Doch das Blatt stieß gegen einen Kiesel und blieb hängen.
story.4=Ein Spatz landete neben ihnen. „Ich kenne den Weg zum Meer“, zwitscherte er. „Aber zuerst müsst ihr etwas mitnehmen, das die Reise wert ist.“
story.5=Mina durchsuchte ihre Taschen. Sie fand einen Knopf, einen glatten Stein und ein Stück Schnur. Alles war zu schwer.
story.6=Dann entdeckte sie eine Wolke, die sich in der Pfütze spiegelte. „Könntest du die mitnehmen?“
story.7=Das Blatt schaukelte sanft. Die Wolke nahm in seiner gelben Mitte Platz, weich und weiß.
story.8=Ein Windhauch schob das kleine Boot am Kiesel vorbei. Es fuhr um Papas Stiefel herum und zwischen zwei Inseln aus Matsch hindurch. Mina ging nebenher und zeigte auf jeden neuen Ort.
story.9=Am anderen Ende der Pfütze erreichte das Blatt ein Stück Gras.
story.10=„Das ist aber nicht das Meer“, sagte Mina.
story.11=„Nein“, sagte Papa. „Aber schau mal, wer alles mitgekommen ist.“
story.12=Die Wolke schwebte noch immer über ihnen. Der Spatz wartete auf dem Gartentor. Und ihr kleines Boot hatte sie durch einen ganzen Nachmittag getragen.
story.13=Mina hob das Blatt auf einen flachen Stein.
story.14=„Dein Hafen“, sagte sie zu ihm.
story.15=Dann gingen sie und Papa hinein. Mina stellte ihre Stiefel an die Tür und ging ans Fenster, um noch einmal hinauszuschauen.
story.16=Das gelbe Boot sah winzig aus, und der Himmel darüber war ganz weit.
adapt.title=So wird daraus Ihre eigene Familiengeschichte
adapt.1.title=Behalten Sie Ihr persönliches Detail
adapt.1.body=Ersetzen Sie das Gartentor durch Ihre Straße, Papa durch einen anderen vertrauten Erwachsenen oder das gelbe Blatt durch ein eingerolltes braunes. Lassen Sie ein Lieblingswort aus Ihrer Familie stehen. Solche kleinen Entscheidungen machen die Geschichte persönlich, ohne dass Sie die ganze Familiengeschichte erzählen müssen.
adapt.2.title=Sagen Sie, wo die Fantasie beginnt
adapt.2.body=Zum Beispiel: „Wir haben an dem Tag wirklich ein Blatt schwimmen lassen. Was der Spatz gesagt hat, habe ich mir ausgedacht.“ Möchten Sie das Erlebnis auch unverändert festhalten, notieren Sie Ort, Beteiligte und Geschehen gesondert. Dann darf sich das Märchen weiterentwickeln, ohne die eigentliche Erinnerung zu ersetzen.
adapt.3.title=Lassen Sie Ihr Kind mitbestimmen, wie viel es sein darf
adapt.3.body=Für eine kürzere Fassung behalten Sie das Blatt, den Kiesel und den Hafen bei und lassen die Suche in den Taschen weg. Ein Kind, das mitmachen möchte, könnte das Boot benennen oder einen Fahrgast vorschlagen. Übernehmen Sie seine Lieblingsidee. Wenn es lieber nur zuhört, ist das genauso in Ordnung.
reading.title=Erst vorlesen, dann über eine Aufnahme entscheiden
reading.body1=Stellen Sie den Text fertig, bevor Sie die Aufnahme-App öffnen. Sprechen Sie die Namen laut aus, teilen Sie Sätze, über die Sie stolpern, und prüfen Sie, ob immer klar ist, wer spricht. Lesen Sie auch das Ende: Es sollte das Abenteuer abschließen und kein neues Problem aufwerfen.
reading.body2=Wenn Sie Ihre genaue Lesung bewahren möchten, nehmen Sie die ganze Geschichte mit dem Handy auf. So bleiben Ihre eigenen Pausen, Ihr Lachen und Ihre Aussprache erhalten. Unsere Anleitung erklärt einen kurzen Tontest und das Speichern der fertigen Datei:
