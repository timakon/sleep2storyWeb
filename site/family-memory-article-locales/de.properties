answer.title=Ein echtes Detail. Ein kleines Abenteuer dazu.
answer.body=Wählen Sie eine Erinnerung und geben Sie einer Figur etwas zu tun. Ein kleines Hindernis führt zu einer Lösung und einem klaren Ende. Schreiben Sie zunächst fünf Sätze. Mit etwas wörtlicher Rede und einer erfundenen Überraschung entsteht daraus eine Geschichte zum Vorlesen.
