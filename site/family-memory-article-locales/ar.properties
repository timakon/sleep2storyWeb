memory.title=أيّ ذكرى عائلية تصلح لقصة؟
memory.body1=اختر مشهدًا تستطيع تخيّله: بركة الماء عند البوابة، أو طاولة المطبخ الملطخة بالدقيق، أو رحلة بالحافلة مع أحد الأجداد. يصعب اختصار عطلة كاملة في حكاية قصيرة. أمّا بعد الظهر الذي أنقذتم فيه قبعة علقت في شجيرة، ففيه مكان ومشكلة ونهاية بالفعل.
memory.body2=اختر ذكرى يرتاح المعنيون بها إلى استعادتها. استأذن قبل استخدام قصة شخصية لشخص بالغ آخر، خصوصًا إذا كنت قد تشاركها خارج العائلة. واترك المواقف التي تُحرج طفلك إن كان لا يحب سماعها. تفصيل يومي سعيد يكفي للبداية.
memory.source=يقدّم PBS KIDS for Parents نشاطًا قريبًا من هذه الفكرة، من Fred Rogers Productions: صنع كتاب يدوي عن ذكرى عائلية.
memory.source_link=اطّلع على نشاط كتاب الذكريات العائلية
memory.grandparents_link=اسأل أحد الأجداد عن ذكرى.
memory.grandparents_body=قد تمنحك صورة أو غرض مألوف بدايةً للحديث.
