prompts.kicker=دوّن أفكارًا قبل كتابة الجمل
prompts.title=ثمانية أسئلة تساعدك على اكتشاف القصة
prompts.intro=استخدم هذه الأسئلة في حديث مع طفلك، أو أجب عنها بنفسك. تكفي كلمات قليلة لكل سؤال. ويمكن للطفل اختيار تفصيل واحد من دون أن يشارك في كتابة الحكاية كلها.
prompt.1.title=أين كنا؟
prompt.1.body=حدّد مكانًا ولحظة: خارج بوابة الحديقة بعد المطر، بدل سرد كل ما حدث يوم الأحد.
prompt.2.title=أيّ تفصيل صغير نتذكره؟
prompt.2.body=اختر شيئًا رأيتموه أو سمعتموه أو لمستموه: ورقة صفراء، أو صرير الحذاء، أو رائحة الخبز الدافئ.
prompt.3.title=من سنرافق في القصة؟
prompt.3.body=قد تكون الشخصية طفلك، أو طفلًا من الخيال، أو حيوانًا، أو الغرض نفسه. اجعل شخصية واحدة تقود الحدث.
prompt.4.title=ماذا تريد هذه الشخصية؟
prompt.4.body=ليكن الهدف بسيطًا: أن تطلق قاربًا، أو تعثر على قفاز، أو توصل كعكة إلى البيت. هكذا تعرف الحكاية إلى أين تمضي.
prompt.5.title=ما الذي يعترض طريقها؟
prompt.5.body=جرّب عقبة صغيرة: حصاة توقف القارب، أو حقيبة لا تنغلق. لا تحتاج قصة ما قبل النوم إلى خطر مخيف.
prompt.6.title=من أو ما الذي قد يساعدها؟
prompt.6.body=قد يقترح قريب أو نسمة هواء أو عصفور يتكلم فكرةً مفيدة. هنا يمكنك إدخال لمسة خيالية واحدة.
prompt.7.title=ماذا ستجرّب الشخصية؟
prompt.7.body=اختر فعلًا يسهل على الطفل تخيّله: يزيح غصنًا صغيرًا، أو يتبع صوتًا، أو يجد راكبًا أخف وزنًا.
prompt.8.title=أين تنتهي المغامرة؟
prompt.8.body=امنح القصة مكانًا تهدأ فيه: يصل القارب إلى مرفئه، أو يجد القفاز رفيقه، أو يعود الجميع إلى البيت.
outline.title=حوّل إجاباتك إلى خمس جمل
outline.intro=انسخ هذا المخطط على ورقة واملأ ما بين الأقواس. سيمنحك بداية ووسطًا ونهاية قبل أن تصوغ الكلمات النهائية.
outline.1.label=1. بداية مألوفة
outline.1.text=في أحد [الأيام]، كان [اسم الشخصية] في [المكان]، حيث [التفصيل الذي تتذكرونه].
outline.2.label=2. رغبة
outline.2.text=أراد [اسم الشخصية] أن [الهدف الصغير].
outline.3.label=3. مشكلة
outline.3.text=لكن [العقبة] حالت دون ذلك.
outline.4.label=4. محاولة
outline.4.text=بمساعدة [المساعد]، جرّب [اسم الشخصية] أن [الفعل].
outline.5.label=5. خاتمة هادئة
outline.5.text=أخيرًا، [النتيجة]، ثم [الفعل الهادئ الأخير للشخصية].
outline.body=اقرأ الجمل بالترتيب. إذا بدت الأحداث مترابطة، أضف سطرًا حواريًا وتفصيلًا تحبه. وإذا تفرعت الحكاية، احذف شخصية أو مشكلة ثانية. أبقِ النهاية في ذهنك وأنت توسّع الوسط.
story.kicker=قصة أصلية للقراءة بصوت عالٍ
story.title=قارب الورقة
story.intro=يبدأ هذا المثال المتخيّل بمشهد عائلي عادي: طفلة وأبوها يطلقان ورقة في بركة ماء. أمّا العصفور المتكلم والسحابة الراكبة فإضافتان من عالم الحكايات.
story.1=في يوم أحد، وجدت مينا وأبوها ورقة صفراء تشبه قاربًا صغيرًا. وضعاها في بركة ماء بجانب بوابة الحديقة.
story.2=سألها أبوها: «إلى أين ستذهب؟»
story.3=قالت مينا: «إلى البحر». لكن الورقة اصطدمت بحصاة وتوقفت.
story.4=حطّ عصفور قريبًا منهما وزقزق: «أعرف الطريق إلى البحر. لكن عليكما أولًا أن تجدا شيئًا يستحق الرحلة».
story.5=فتشت مينا في جيوبها، فوجدت زرًا وحجرًا أملس وقطعة خيط. كانت كلها ثقيلة على القارب.
story.6=ثم انتبهت إلى سحابة تنعكس صورتها في البركة. وسألت الورقة: «هل تستطيعين حمل هذه؟»
story.7=تمايلت الورقة برفق، واستقرت السحابة في وسطها الأصفر، ناعمة وبيضاء.
story.8=دفعت نسمة هواء القارب الصغير فتجاوز الحصاة. أبحر حول حذاء أبيها، ثم بين جزيرتين من الطين. مشت مينا إلى جانبه تشير إلى كل مكان جديد.
story.9=عند الطرف البعيد من البركة، وصلت الورقة إلى رقعة من العشب.
story.10=قالت مينا: «هذا ليس البحر».
story.11=أجاب أبوها: «صحيح. لكن انظري من رافقنا».
story.12=كانت السحابة لا تزال تطفو فوقهما. وكان العصفور ينتظرهما على البوابة. أمّا قاربهما الصغير فقد حملهم عبر ظهيرة كاملة.
story.13=رفعت مينا الورقة ووضعتها على حجر مسطح.
story.14=قالت لها: «هذا مرفؤك».
story.15=ثم دخلت مع أبيها إلى البيت. تركت حذاءها قرب الباب وذهبت إلى النافذة لتلقي نظرة أخيرة.
story.16=بدا القارب الأصفر صغيرًا جدًا، وبدت السماء فوقه واسعة جدًا.
adapt.title=اجعل القصة جزءًا من حكاية عائلتكم
adapt.1.title=احتفظ بالتفصيل الذي يخصكم
adapt.1.body=استبدل بوابة الحديقة بشارعكم، والأب بشخص بالغ مألوف آخر، أو الورقة الصفراء بورقة بنية ملتفة. واحتفظ بكلمة تحبها عائلتكم. بهذه التفاصيل تصبح القصة شخصية، من دون أن تحتاج إلى سرد تاريخ العائلة كله.
adapt.2.title=وضّح أين يبدأ الخيال
adapt.2.body=يمكنك أن تقول: «أطلقنا ورقة في الماء فعلًا ذلك اليوم، لكنني تخيلت ما قاله العصفور». وإذا أردت الاحتفاظ بالذكرى كما حدثت، فدوّن في ورقة منفصلة المكان والأشخاص وما وقع بالفعل. عندها تستطيع تغيير الحكاية الخيالية من دون أن تضيع تفاصيل الذكرى الحقيقية.
adapt.3.title=دع الطفل يحدد طول الحكاية
adapt.3.body=لنسخة أقصر، احتفظ بالورقة والحصاة والمرفأ، وتجاوز البحث في الجيوب. إذا أراد طفلك المشاركة، فليسمِّ القارب أو يقترح راكبًا له. خذ فكرته المفضلة، وإن فضّل الاستماع فقط فهذا يكفي.
reading.title=اقرأها بصوت عالٍ، ثم قرر إن كنت ستسجلها
reading.body1=أكمل النص قبل أن تفتح تطبيق التسجيل. انطق الأسماء، وقسّم أي جملة تتعثر فيها، وتأكد من وضوح المتحدث في كل حوار. اقرأ النهاية أيضًا؛ ينبغي أن تختم المغامرة بدل أن تفتح مشكلة جديدة.
reading.body2=إذا أردت الاحتفاظ بقراءتك كما هي، فسجّل القصة كاملة على هاتفك. سيحفظ ذلك وقفاتك وضحكاتك وطريقتك في نطق الكلمات. يشرح دليلنا فحصًا صوتيًا قصيرًا وكيفية حفظ الملف النهائي:
reading.recording_link=كيف تسجّل قصة قبل النوم
reading.body3=ويمكنك الاحتفاظ بالنص لأمسية أخرى. لا داعي إلى الكتابة والتدرب والتسجيل كلها وقت النوم. لهذه الليلة، اطّلع على خياراتنا في دليل
reading.tired_link=الأهل الذين أنهكهم التعب ولا يقوون على القراءة
product.eyebrow=قيد الإعداد · iOS وAndroid
product.title=نصّك المكتمل، جاهز للاستماع
product.body=يجري تطوير Sleep2Story لتحويل النص الكامل الذي يقدمه شخص بالغ إلى سرد صوتي اصطناعي باستخدام عينة صوت من فرد بالغ في العائلة وافق على ذلك. يضم التطبيق المخطط له مكتبة قصص شخصية ومشغّلًا. وهو لا يكتب القصة ولا يحفظ الأداء الأصلي لذلك الشخص عند قراءتها.
product.body2=لا يزال التطبيق قيد الإعداد للإطلاق. ويمكنك الآن كتابة قصة عائلتك وقراءتها وتسجيلها تسجيلًا عاديًا بهاتفك.
product.cta=تعرّف على طريقة عمل Sleep2Story
faq.title=أسئلة عن تحويل الذكريات إلى قصص
faq.1.question=هل يجب أن تكون كل التفاصيل حقيقية؟
faq.1.answer=لا. أخبر طفلك بما تتذكره فعلًا وبما أضفته من خيالك. وإذا أردت الاحتفاظ بسجل عائلي، فدوّن الوقائع منفصلة عن الحكاية الخيالية.
faq.2.question=هل يمكننا ابتكار الشخصية الرئيسية؟
faq.2.answer=نعم. يمكن لثعلب أو قارب لعبة أو طفل من الخيال أن يحل محل شخص حقيقي. أبقِ تفصيلًا مألوفًا حتى تظل القصة مرتبطة بالذكرى.
faq.3.question=ماذا لو لم يرغب طفلي في المشاركة؟
faq.3.answer=اكتبها بنفسك وقدّمها له ليستمع إليها. قد يستمع الآن، أو يختار اسمًا لاحقًا، أو يطلب حكاية مختلفة. المشاركة اختيارية.
faq.4.question=كم ينبغي أن يكون طول قصتنا العائلية؟
faq.4.answer=ابدأ بنسخة الخمس جمل واقرأها بصوت عالٍ. أضف تفاصيل إذا رغبتما معًا في المزيد. اختر نهاية تصل إليها بسهولة؛ فلا مدة إلزامية للقراءة.
faq.5.question=هل يكتب Sleep2Story القصة نيابةً عني؟
faq.5.answer=لا. يقدّم الشخص البالغ النص كاملًا. ويجري إعداد Sleep2Story لسرده باستخدام عينة صوت من شخص بالغ وافق على استخدامها. التطبيق غير متاح بعد في متاجر التطبيقات.
