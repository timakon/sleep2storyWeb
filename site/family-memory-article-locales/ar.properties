answer.title=احتفظ بتفصيل حقيقي واحد، وأضف مغامرة صغيرة.
answer.body=اختر ذكرى، وأعطِ الشخصية شيئًا تسعى إليه، ثم ضع في طريقها عقبة يسهل تجاوزها وأنهِ الحكاية بوضوح. اكتب خمس جمل أولًا. أضف حوارًا قصيرًا ومفاجأة من الخيال، وستحصل على قصة تقرؤها بصوت عالٍ.
