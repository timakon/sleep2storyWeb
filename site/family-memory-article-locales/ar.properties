sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: ‏Tell Me a Story: A Caregiving Storybook
sources.body=يقترح نشاط PBS صنع كتاب من ذكريات العائلة. أمّا الأسئلة الثمانية والمخطط المكوّن من خمس جمل وقصة «قارب الورقة»، فهي مواد تحريرية أصلية من Sleep2Story. المثال خيالي وليس شهادة من عائلة؛ والمصدر لا يقيّم Sleep2Story.
