answer.title=Guarda um pormenor real. Acrescenta uma pequena aventura.
answer.body=Escolhe uma memória, dá à personagem algo para fazer, acrescenta um obstáculo simples e leva a história até um final claro. Escreve primeiro cinco frases. Junta um pouco de diálogo e uma surpresa inventada: já tens uma história para ler em voz alta.
