sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: atividade para criar um livro de memórias de família
sources.body=A atividade da PBS sugere criar um livro a partir de memórias de família. As oito perguntas, o esquema de cinco frases e O barquinho de folha são conteúdos editoriais originais do Sleep2Story. O exemplo é fictício, não é o testemunho de uma família; a fonte não avalia o Sleep2Story.
