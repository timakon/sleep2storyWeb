prompts.kicker=Primeiro as notas, depois as frases
prompts.title=Oito perguntas para encontrares a tua história
prompts.intro=Estas perguntas ajudam-te a perceber como inventar uma história para crianças. Usa-as numa conversa ou responde por tua conta. Bastam poucas palavras por pergunta. O teu filho pode escolher um pormenor sem ter de ajudar a escrever a história inteira.
prompt.1.title=Onde estávamos?
prompt.1.body=Escolhe um lugar e um momento: junto ao portão do jardim depois da chuva, em vez de tudo o que aconteceu no domingo.
prompt.2.title=De que pequeno pormenor nos lembramos?
prompt.2.body=Escolhe algo que pudesses ver, ouvir, tocar ou cheirar: uma folha amarela, umas botas que chiavam ou o cheiro a pão quente.
prompt.3.title=Quem será a personagem principal?
prompt.3.body=Pode ser o teu filho, uma criança inventada, um animal ou o próprio objeto. Entrega a ação principal a uma só personagem.
prompt.4.title=O que quer essa personagem?
prompt.4.body=Escolhe um desejo simples: pôr um barco a navegar, encontrar uma luva ou levar um bolo para casa. Assim, a história terá um rumo.
prompt.5.title=O que a impede?
prompt.5.body=Experimenta um pequeno obstáculo: uma pedrinha bloqueia o barco ou o saco não fecha. Uma história para a hora de deitar não precisa de perigos assustadores.
prompt.6.title=Quem ou o que pode ajudar?
prompt.6.body=Um familiar, uma brisa ou um pardal que fala podem sugerir uma ideia. É uma boa altura para acrescentar um elemento imaginário.
prompt.7.title=O que tenta fazer a personagem?
prompt.7.body=Escolhe uma ação que quem ouve consiga imaginar. A criança afasta um raminho, segue um som ou encontra um passageiro mais leve.
prompt.8.title=Onde acaba a aventura?
prompt.8.body=Dá à história um lugar para descansar: o barco chega ao porto, a luva encontra o seu par ou todos regressam a casa.
outline.title=Transforma as respostas em cinco frases
outline.intro=Copia este esquema para uma folha de papel e preenche os espaços entre parênteses retos. Terás um princípio, um meio e um fim antes de trabalhares as palavras.
outline.1.label=1. Um começo familiar
outline.1.text=Num [dia], [personagem] estava em [lugar], onde [pormenor da memória].
outline.2.label=2. Um desejo
outline.2.text=[Personagem] queria [pequeno objetivo].
outline.3.label=3. Um problema
outline.3.text=Mas [obstáculo] não deixou o plano avançar.
outline.4.label=4. Uma tentativa
outline.4.text=Com a ajuda de [ajudante], [personagem] tentou [ação].
outline.5.label=5. Um lugar para descansar
outline.5.text=Por fim, [resultado], e [personagem] [última ação tranquila].
outline.body=Lê as frases por ordem. Se a ação fizer sentido, acrescenta uma fala e um pormenor de que gostes. Se a história se dispersar, retira uma personagem ou um segundo problema. Mantém o final em mente enquanto desenvolves a parte do meio.
story.kicker=Uma história original para ler em voz alta
story.title=O barquinho de folha
story.intro=Este exemplo inventado começa com uma cena familiar comum: uma menina e o pai põem uma folha a navegar numa poça. O pardal que fala e a nuvem passageira são os elementos de fantasia.
story.1=No domingo, a Mina e o pai encontraram uma folha amarela com a forma de um barquinho. Puseram-na numa poça junto ao portão do jardim.
story.2=— Para onde vai? — perguntou o pai.
story.3=— Para o mar — disse a Mina. Mas a folha bateu numa pedrinha e parou.
story.4=Um pardal pousou ali perto e piou: «Eu conheço o caminho para o mar. Mas primeiro têm de levar alguma coisa que valha a pena.»
story.5=A Mina procurou nos bolsos. Encontrou um botão, uma pedra lisa e um pedaço de fio. Eram todos demasiado pesados.
story.6=Então reparou numa nuvem refletida na poça e perguntou à folha: «Podias levá-la a ela?»
story.7=A folha baloiçou devagar. A nuvem acomodou-se no seu centro amarelo, fofa e branca.
story.8=Uma brisa empurrou o barquinho para lá da pedrinha. Navegou à volta da bota do pai e entre duas ilhas de lama. A Mina caminhava ao seu lado e ia apontando cada lugar novo.
story.9=Na outra ponta da poça, a folha chegou a um tufo de erva.
story.10=— Isto não é o mar — disse a Mina.
story.11=— Não — respondeu o pai. — Mas olha quem veio connosco.
story.12=A nuvem continuava a flutuar por cima deles. O pardal esperava no portão. E o barquinho tinha-os levado numa viagem que atravessara uma tarde inteira.
story.13=A Mina tirou a folha da água e pousou-a numa pedra plana.
story.14=— O teu porto — disse-lhe.
story.15=Depois entrou em casa com o pai. Deixou as botas junto à porta e foi à janela olhar uma última vez.
story.16=O barco amarelo parecia muito pequeno, e o céu por cima dele parecia imenso.
adapt.title=Faz desta história uma história da tua família
adapt.1.title=Guarda o pormenor que vos pertence
adapt.1.body=Troca o portão do jardim pela vossa rua, o pai por outro adulto próximo ou a folha amarela por uma castanha e enrolada. Mantém uma palavra especial da família. Estas pequenas escolhas dão um toque vosso à história sem acrescentar um longo relato familiar.
adapt.2.title=Explica onde começa o faz de conta
adapt.2.body=Podes dizer: «Nesse dia pusemos mesmo uma folha a navegar. O que o pardal disse foi invenção minha.» Se também quiseres guardar uma memória fiel, anota à parte o lugar, as pessoas e o que aconteceu. Assim, o conto pode mudar sem substituir o registo do que se passou.
adapt.3.title=Adapta o tamanho a quem ouve
adapt.3.body=Para uma versão mais curta, mantém a folha, a pedrinha e o porto; salta a procura nos bolsos. Uma criança que queira participar pode dar um nome ao barco ou sugerir um passageiro. Guarda a ideia de que ela mais gostar, mas deixa que se limite a ouvir, se preferir.
reading.title=Lê em voz alta e depois decide se queres gravar
reading.body1=Termina o texto antes de abrires o gravador. Diz os nomes em voz alta, divide as frases em que tropeças e confirma que se percebe quem está a falar. Lê também o final: deve concluir a aventura, sem abrir outro problema.
reading.body2=Para preservar a tua leitura tal como a fazes, grava a história toda no telemóvel. Assim guardas as tuas pausas, o riso e a pronúncia. O nosso guia explica como fazer um pequeno teste de som e guardar o ficheiro final:
reading.recording_link=como gravar uma história para a hora de deitar
reading.body3=Também podes deixar o texto pronto para outra noite. Não é preciso escrever, ensaiar e gravar tudo à hora de deitar. Para hoje, experimenta as opções do nosso guia para
reading.tired_link=pais demasiado cansados para ler
product.eyebrow=Em preparação · iOS e Android
product.title=O teu texto completo, preparado para ouvir
product.body=Estamos a desenvolver o Sleep2Story para transformar o texto completo fornecido por um adulto numa narração sintética, usando uma amostra de voz de um familiar adulto que tenha dado o seu consentimento. A aplicação prevista inclui uma biblioteca pessoal de histórias e um leitor de áudio. Não escreve a história nem preserva a leitura original dessas palavras feita pelo adulto.
product.body2=A aplicação ainda está em preparação para o lançamento. A narração está prevista em inglês e russo; as outras línguas do site não significam que a aplicação possa narrar nessas línguas. Já podes escrever, ler e fazer uma gravação normal da tua história de família com o telemóvel.
product.cta=Descobre como funciona o Sleep2Story
faq.title=Perguntas sobre transformar memórias em histórias
faq.1.question=Todos os pormenores têm de ser verdadeiros?
faq.1.answer=Não. Explica ao teu filho que parte recordas e que parte inventaste. Se também quiseres guardar um registo familiar, mantém as notas dos factos separadas do conto.
faq.2.question=Podemos inventar a personagem principal?
faq.2.answer=Sim. Uma raposa, um barco de brincar ou uma criança inventada podem ocupar o lugar de uma pessoa real. Mantém um pormenor familiar para a história continuar ligada à memória.
faq.3.question=E se o meu filho não quiser participar?
faq.3.answer=Escreve tu a história e propõe-lhe que a ouça. O teu filho pode ouvir, escolher um nome mais tarde ou pedir outra história. A participação é opcional.
faq.4.question=Que tamanho deve ter a nossa história de família?
faq.4.answer=Começa pela versão de cinco frases e lê-a em voz alta. Acrescenta pormenores se os dois quiserem continuar. Escolhe um final a que consigas chegar sem pressa; não há uma duração obrigatória de leitura.
faq.5.question=O Sleep2Story escreve a história por mim?
faq.5.answer=Não. O adulto fornece o texto completo. O Sleep2Story está em preparação para gerar narração em inglês ou russo a partir desse texto e de uma amostra de voz de um adulto que tenha dado o seu consentimento. Ainda não está disponível nas lojas de aplicações.
