memory.title=Que memória de família pode dar uma história?
memory.body1=Escolhe uma cena que consigas imaginar: a poça junto ao portão, a mesa da cozinha coberta de farinha ou uma viagem de autocarro com os avós. É difícil fazer caber umas férias inteiras numa história curta. A tarde em que tiraste um chapéu de uma sebe já te dá um lugar, um problema e um final.
memory.body2=Escolhe uma memória que as pessoas envolvidas se sintam à vontade para recordar. Pergunta antes de usares uma história pessoal de outro adulto, sobretudo se pensas partilhá-la fora da família. Deixa de fora os episódios embaraçosos do teu filho se ele não gostar de os ouvir. Um pequeno pormenor feliz do dia a dia chega para começar.
memory.source=A PBS KIDS for Parents propõe uma atividade da Fred Rogers Productions próxima desta ideia: fazer um livro à mão a partir de uma memória de família.
memory.source_link=Ver a atividade do livro de memórias de família
memory.grandparents_link=Pede a um avô ou a uma avó que te conte uma memória.
memory.grandparents_body=Uma fotografia ou um objeto familiar podem servir de ponto de partida para a conversa.
