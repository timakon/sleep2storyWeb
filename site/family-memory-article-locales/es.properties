memory.title=¿Qué recuerdo familiar puede convertirse en un cuento?
memory.body1=Elige una escena que puedas imaginar con claridad: el charco junto a la verja, una mesa de cocina cubierta de harina o un viaje en autobús con los abuelos. Cuesta meter unas vacaciones enteras en un cuento corto. En cambio, la tarde en que rescatasteis un sombrero de un seto ya te da un lugar, un problema y un final.
memory.body2=Escoge un recuerdo que las personas implicadas quieran revivir. Pregunta antes de usar una historia personal de otro adulto, sobre todo si piensas compartirla fuera de la familia. Deja fuera las anécdotas que avergüencen a tu hijo si no le gusta escucharlas. Basta un detalle cotidiano y agradable para empezar.
memory.source=PBS KIDS for Parents propone una actividad de Fred Rogers Productions relacionada con esta idea: hacer un libro a mano a partir de un recuerdo familiar.
memory.source_link=Ver la actividad del libro de recuerdos familiares
