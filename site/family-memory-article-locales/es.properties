product.eyebrow=En preparación · iOS y Android
product.title=Tu texto terminado, listo para escucharlo
product.body=Estamos desarrollando Sleep2Story para convertir el texto completo que aporta un adulto en una narración sintética, a partir de una muestra de voz de un familiar adulto que haya dado su consentimiento. La aplicación prevista incluye una biblioteca personal de cuentos y un reproductor. No escribe el cuento ni conserva la lectura original de ese adulto.
product.body2=La aplicación sigue en preparación para su lanzamiento. La narración está prevista en inglés y ruso; que la web esté en otros idiomas no significa que la aplicación pueda narrar en ellos. Ya puedes escribir, leer y grabar tu cuento familiar con la grabadora del móvil.
product.cta=Descubre cómo funciona Sleep2Story
faq.title=Preguntas sobre cómo convertir recuerdos en cuentos
faq.1.question=¿Todos los detalles tienen que ser reales?
faq.1.answer=No. Cuéntale a tu hijo qué parte recuerdas y cuál has inventado. Si también quieres conservar lo que ocurrió, guarda las notas de los hechos por separado del cuento.
faq.2.question=¿Podemos inventar al protagonista?
faq.2.answer=Sí. Un zorro, un barco de juguete o un niño inventado pueden ocupar el lugar de una persona real. Conserva un detalle conocido para que el cuento siga unido al recuerdo.
faq.3.question=¿Y si mi hijo no quiere participar?
faq.3.answer=Escríbelo tú y ofréceselo como un cuento para escuchar. Tu hijo puede escuchar, elegir un nombre más adelante o pedir otra historia. Participar es opcional.
faq.4.question=¿Cuánto debe durar nuestro cuento familiar?
faq.4.answer=Empieza con la versión de cinco frases y léela en voz alta. Añade detalles si a los dos os apetece seguir. Elige un final al que puedas llegar sin prisas; no hay un tiempo de lectura obligatorio.
faq.5.question=¿Sleep2Story escribe el cuento por mí?
faq.5.answer=No. El adulto aporta el texto completo. Sleep2Story se está preparando para generar una narración en inglés o ruso a partir de ese texto y de una muestra de voz de un adulto que haya dado su consentimiento. Todavía no está disponible en las tiendas de aplicaciones.
