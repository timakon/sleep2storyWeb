sources.body=La actividad de PBS propone hacer un libro a partir de recuerdos familiares. Las ocho preguntas, el esquema de cinco frases y El barquito de hoja son material editorial original de Sleep2Story. El ejemplo es ficticio, no el testimonio de una familia; la fuente no evalúa Sleep2Story.
