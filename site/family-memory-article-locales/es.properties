prompts.kicker=Primero, unas notas
prompts.title=Ocho preguntas para encontrar tu cuento
prompts.intro=Si te preguntas cómo inventar un cuento para niños, usa estas preguntas para conversar o respóndelas por tu cuenta. Bastan unas palabras por pregunta. Tu hijo puede elegir un detalle sin tener que ayudar a escribir toda la historia.
prompt.1.title=¿Dónde estábamos?
prompt.1.body=Elige un lugar y un momento: junto a la verja del jardín después de llover, en vez de todo lo que pasó el domingo.
prompt.2.title=¿Qué pequeño detalle recordamos?
prompt.2.body=Escoge algo que pudieras ver, oír, tocar u oler: una hoja amarilla, unas botas que chirriaban o el olor a pan recién hecho.
prompt.3.title=¿Quién protagonizará el cuento?
prompt.3.body=Puede ser tu hijo, un niño inventado, un animal o el propio objeto. Deja la acción principal en manos de un solo personaje.
prompt.4.title=¿Qué quiere ese personaje?
prompt.4.body=Elige un deseo sencillo: echar un barco al agua, encontrar una manopla o llevar una tarta a casa. Así el cuento tendrá un rumbo.
prompt.5.title=¿Qué se lo impide?
prompt.5.body=Prueba con un pequeño obstáculo: una piedrecita bloquea el barco o la bolsa no se cierra. Un cuento para dormir no necesita peligros que den miedo.
prompt.6.title=¿Quién o qué podría ayudar?
prompt.6.body=Un familiar, una brisa o un gorrión que habla pueden aportar una idea. Este es un buen momento para añadir un elemento imaginario.
prompt.7.title=¿Qué intenta hacer el personaje?
prompt.7.body=Elige una acción que quien escucha pueda imaginar. El niño aparta una ramita, sigue un sonido o encuentra un pasajero que pesa menos.
prompt.8.title=¿Dónde termina la aventura?
prompt.8.body=Dale al cuento un lugar donde descansar: el barco llega a puerto, la manopla encuentra a su pareja o todos vuelven a casa.
outline.title=Convierte tus respuestas en cinco frases
outline.intro=Copia este esquema en un papel y rellena los corchetes. Tendrás un principio, una parte central y un final antes de pulir las palabras.
outline.1.label=1. Un comienzo conocido
outline.1.text=Un [día], [personaje] estaba en [lugar], donde [detalle del recuerdo].
outline.2.label=2. Un deseo
outline.2.text=[Personaje] quería [objetivo sencillo].
outline.3.label=3. Un problema
outline.3.text=Pero [obstáculo] le impidió seguir con su plan.
outline.4.label=4. Un intento
outline.4.text=Con la ayuda de [ayudante], [personaje] intentó [acción].
outline.5.label=5. Un lugar donde descansar
outline.5.text=Al final, [resultado], y [personaje] [última acción tranquila].
outline.body=Lee las frases en orden. Si la acción se entiende, añade una línea de diálogo y un detalle que te guste. Si el cuento se dispersa, quita un personaje o un segundo problema. Ten presente el final mientras amplías la parte central.
story.kicker=Un cuento original para leer en voz alta
story.title=El barquito de hoja
story.intro=Este ejemplo inventado parte de una escena familiar cotidiana: una niña y su padre hacen navegar una hoja en un charco. El gorrión que habla y la nube pasajera aportan la fantasía.
story.1=El domingo, Mina y papá encontraron una hoja amarilla con forma de barquito. La pusieron en un charco junto a la verja del jardín.
story.2=—¿Adónde irá? —preguntó papá.
story.3=—Al mar —dijo Mina. Pero la hoja chocó contra una piedrecita y se paró.
story.4=Un gorrión se posó cerca y pió: «Yo conozco el camino al mar. Pero primero tenéis que llevar algo que merezca la pena».
story.5=Mina rebuscó en sus bolsillos. Encontró un botón, una piedra lisa y un trozo de cuerda. Todo pesaba demasiado.
story.6=Entonces vio una nube reflejada en el charco y le preguntó a la hoja: «¿Podrías llevarla a ella?».
story.7=La hoja se meció suavemente. La nube se acomodó en su centro amarillo, blanda y blanca.
story.8=Una brisa empujó el barquito y lo ayudó a pasar la piedrecita. Navegó alrededor de la bota de papá y entre dos islas de barro. Mina caminaba a su lado, señalando cada lugar nuevo.
story.9=En el otro extremo del charco, la hoja llegó a una orilla de hierba.
story.10=—Esto no es el mar —dijo Mina.
story.11=—No —respondió papá—. Pero mira quiénes han venido con nosotros.
story.12=La nube seguía flotando sobre sus cabezas. El gorrión esperaba en la verja. Y el barquito los había llevado de viaje por una tarde entera.
story.13=Mina sacó la hoja del agua y la dejó sobre una piedra plana.
story.14=—Tu puerto —le dijo.
story.15=Después entró en casa con papá. Dejó las botas junto a la puerta y se acercó a la ventana para mirar una última vez.
story.16=El barco amarillo parecía muy pequeño, y el cielo que tenía encima parecía inmenso.
adapt.title=Haz que el cuento sea de vuestra familia
adapt.1.title=Conserva el detalle que os pertenece
adapt.1.body=Cambia la verja del jardín por vuestra calle, a papá por otro adulto cercano o la hoja amarilla por una marrón y enrollada. Conserva una palabra especial de vuestra familia. Esas pequeñas elecciones hacen que el cuento sea vuestro sin añadir toda la historia familiar.
adapt.2.title=Cuenta dónde empieza la fantasía
adapt.2.body=Puedes decir: «Ese día sí que hicimos navegar una hoja. Lo que dijo el gorrión me lo he inventado». Si también quieres guardar un recuerdo fiel, anota aparte el lugar, las personas y lo que ocurrió. Así el cuento podrá cambiar sin sustituir el relato de lo que pasó.
adapt.3.title=Adapta la extensión a quien escucha
adapt.3.body=Para una versión más corta, conserva la hoja, la piedrecita y el puerto; omite la búsqueda en los bolsillos. Si tu hijo quiere participar, puede ponerle nombre al barco o proponer un pasajero. Quédate con su idea favorita, pero deja que se limite a escuchar si lo prefiere.
reading.title=Léelo en voz alta y después decide si quieres grabarlo
reading.body1=Termina el texto antes de abrir la grabadora. Di los nombres en voz alta, divide las frases en las que tropieces y comprueba que se entiende quién habla. Lee también el final: debe cerrar la aventura, sin plantear otro problema.
reading.body2=Para conservar tu lectura tal como la haces, graba el cuento entero con el móvil. Así guardarás tus pausas, tu risa y tu pronunciación. Nuestra guía explica cómo hacer una breve prueba de sonido y guardar el archivo final:
