answer.title=Conserva un detalle real. Añade una pequeña aventura.
answer.body=Elige un recuerdo, dale al protagonista algo que hacer, añade un obstáculo sencillo y lleva el cuento hasta un final claro. Escribe primero cinco frases. Incorpora un poco de diálogo y una sorpresa inventada: ya tienes una historia para leer en voz alta.
