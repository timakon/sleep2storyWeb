schema.description=Guía práctica para convertir un recuerdo familiar en un cuento infantil para dormir, con ocho preguntas, un esquema de cinco frases y un ejemplo original completo.
hero.eyebrow=Cuentos en familia · Guía 05
hero.title=Convierte un recuerdo familiar en un cuento para dormir
hero.dek=Un paseo, una manopla perdida o un bizcocho que salió torcido pueden convertirse en el cuento de esta noche. Elige un momento sencillo y empieza con las preguntas y el ejemplo completo que encontrarás aquí.
