prompts.kicker=Сначала заметки
prompts.title=Восемь вопросов, с которых начинается сказка
prompts.intro=Обсудите вопросы с ребёнком или ответьте на них сами. Для каждого хватит нескольких слов. Ребёнок может выбрать одну деталь: сочинять всю сказку вместе необязательно.
prompt.1.title=Где мы были?
prompt.1.body=Назовите одно место и один момент: у садовой калитки после дождя. Не нужно перечислять всё, что произошло за воскресенье.
prompt.2.title=Какая мелочь запомнилась?
prompt.2.body=Выберите то, что можно увидеть, услышать или потрогать: жёлтый лист, скрипучие сапоги, запах тёплого хлеба.
prompt.3.title=Кто станет главным героем?
prompt.3.body=Ваш ребёнок, выдуманный мальчик или девочка, зверёк или сам предмет. Пусть основные события происходят с одним героем.
prompt.4.title=Чего герой хочет?
prompt.4.body=Для начала подойдёт простая цель: спустить кораблик на воду, найти варежку, донести домой пирог. Она задаст истории направление.
prompt.5.title=Что ему мешает?
prompt.5.body=Придумайте небольшую помеху: кораблик упёрся в камешек или сумка не закрывается. Для сказки на ночь страшная опасность не нужна.
prompt.6.title=Кто или что может помочь?
prompt.6.body=Близкий взрослый, ветерок или говорящий воробей могут подсказать выход. Здесь удобно добавить одно сказочное событие.
prompt.7.title=Что герой попробует сделать?
prompt.7.body=Выберите действие, которое легко представить: ребёнок отодвигает веточку, идёт на звук или находит пассажира полегче.
prompt.8.title=Где закончится приключение?
prompt.8.body=Найдите место, где история сможет остановиться: кораблик приходит в гавань, варежка находит пару, все возвращаются домой.
outline.title=Как собрать сказку из пяти предложений
outline.intro=Перепишите схему на бумагу и заполните скобки. Начало, середина и конец появятся раньше, чем вы начнёте подбирать красивые слова.
outline.1.label=1. Знакомое начало
outline.1.text=Однажды [когда] [герой] оказался [где], и там [запомнившаяся деталь].
outline.2.label=2. Желание
outline.2.text=[Герой] захотел [небольшая цель].
outline.3.label=3. Помеха
outline.3.text=Но тут [препятствие], и задуманное не получилось.
outline.4.label=4. Попытка
outline.4.text=С помощью [помощник] [герой] попробовал [действие].
outline.5.label=5. Спокойный финал
outline.5.text=Наконец [результат], и [герой] [последнее спокойное действие].
outline.body=Прочитайте предложения по порядку. Если события связаны, добавьте реплику и деталь, которая вам нравится. Если история путается, уберите лишнего персонажа или вторую задачу. Дополняя середину, помните, к какому финалу вы идёте.
story.kicker=Авторская сказка для чтения вслух
story.title=Кораблик из листа
story.intro=Этот выдуманный пример начинается с обычной семейной сцены: ребёнок и папа пускают лист по луже. Говорящий воробей и облако-пассажир — сказочные добавления.
story.1=В воскресенье Мина и папа нашли жёлтый лист, похожий на лодочку. Они опустили его в лужу у садовой калитки.
story.2=— Куда поплывём? — спросил папа.
story.3=— К морю! — ответила Мина. Но лист упёрся в камешек и остановился.
story.4=Рядом сел воробей. «Я знаю дорогу к морю, — чирикнул он. — Только сначала возьмите на борт что-нибудь стоящее».
story.5=Мина проверила карманы. Там нашлись пуговица, гладкий камень и кусочек верёвки. Всё было слишком тяжёлым.
story.6=Тут она заметила облако, отражавшееся в луже. «А его возьмёшь?»
story.7=Лист покачнулся. Белое облако устроилось в самой середине жёлтой лодочки.
story.8=Ветерок подтолкнул кораблик, и тот обогнул камешек. Потом проплыл вокруг папиного сапога и между двумя островами из мокрой земли. Мина шла рядом и показывала ему новые места.
story.9=У дальнего края лужи лист пристал к траве.
story.10=— Но это же не море, — сказала Мина.
story.11=— Зато посмотри, кто добрался сюда вместе с нами.
story.12=Над ними по-прежнему плыло облако. На калитке ждал воробей. А маленький кораблик провёз их через целый воскресный день.
story.13=Мина переложила лист на плоский камень.
story.14=— Вот твоя гавань.
story.15=Они с папой вошли в дом. Мина оставила сапоги у двери и подошла к окну, чтобы ещё раз посмотреть на кораблик.
story.16=Жёлтая лодочка казалась совсем крошечной, а небо над ней — очень большим.
adapt.title=Как сделать сказку своей
adapt.1.title=Сохраните деталь, которая принадлежит вашей семье
adapt.1.body=Замените садовую калитку на свой двор, папу — на другого близкого взрослого, а жёлтый лист — на скрученный коричневый. Оставьте любимое семейное словечко. Так сказка по воспоминаниям станет узнаваемой без долгого рассказа обо всех родственниках.
adapt.2.title=Обозначьте, где начинается вымысел
adapt.2.body=Например: «Мы правда пускали лист по воде в тот день. А слова воробья я придумал». Если хочется сохранить и точное воспоминание, отдельно запишите место, участников и то, что случилось. Тогда семейная сказка сможет меняться, а запись настоящего события останется.
adapt.3.title=Подстройте длину под слушателя
adapt.3.body=Для короткой версии оставьте лист, камешек и гавань, а поиск по карманам пропустите. Ребёнок, которому хочется участвовать, может назвать кораблик или предложить пассажира. Сохраните его любимую идею, но разрешите просто слушать, если сочинять сейчас не хочется.
reading.title=Как прочитать готовый текст и подготовить запись
reading.body1=Закончите текст, прежде чем открывать диктофон. Произнесите имена вслух, разделите предложения, на которых запинаетесь, и проверьте, понятно ли, кто говорит. Прочитайте и финал: он должен завершать приключение, а не начинать новую задачу.
reading.body2=Если хотите сохранить именно своё чтение, запишите сказку целиком на телефон. Так останутся ваши паузы, смех и произношение. Короткая проверка звука и сохранение файла разобраны в инструкции:
reading.recording_link=как записать сказку на ночь
reading.body3=Можно оставить готовый текст на другой вечер. Сочинять, репетировать и записывать прямо перед сном необязательно. А на сегодня подойдут варианты из руководства для
reading.tired_link=родителей, у которых нет сил читать сказку
product.eyebrow=Готовится для iOS и Android
product.title=Готовая сказка — для будущих прослушиваний
product.body=Sleep2Story создаётся для синтетической озвучки полного текста сказки, который добавляет взрослый. Для неё используется образец голоса взрослого близкого человека с его согласия. В приложении планируются личная библиотека и плеер. Оно не сочиняет сказку и не сохраняет подлинное чтение именно этих слов.
product.body2=Приложение ещё готовится к выпуску. Озвучка планируется на русском и английском; наличие других языков на сайте не означает поддержку озвучки на них. Написать семейную сказку, прочитать её и сделать обычную запись на телефон можно уже сейчас.
product.cta=Посмотреть, как работает Sleep2Story
faq.title=Вопросы о сказках по семейным воспоминаниям
faq.1.question=Нужно ли помнить всё точно?
faq.1.answer=Нет. Объясните ребёнку, что вы помните, а что придумали. Если хотите сохранить семейную хронику, запишите реальные события отдельно от сказки.
faq.2.question=Можно ли придумать главного героя?
faq.2.answer=Да. Вместо настоящего человека героем может стать лисёнок, игрушечный кораблик или выдуманный ребёнок. Оставьте одну знакомую деталь, чтобы сохранить связь с воспоминанием.
faq.3.question=Что делать, если ребёнок не хочет участвовать?
faq.3.answer=Напишите сказку сами и предложите её послушать. Ребёнок может придумать имя позже или попросить другую историю. Участвовать в сочинении необязательно.
faq.4.question=Какой длины должна быть семейная сказка?
faq.4.answer=Начните с пяти предложений и прочитайте их вслух. Добавьте детали, если вам обоим хочется продолжения. Выберите финал, до которого удобно дойти: обязательного времени чтения нет.
faq.5.question=Sleep2Story сам пишет сказку?
faq.5.answer=Нет. Полный текст добавляет взрослый. Sleep2Story готовится создавать озвучку на русском или английском по этому тексту и образцу голоса взрослого человека с его согласия. Приложение ещё недоступно в магазинах.
