memory.title=Какое воспоминание выбрать?
memory.body1=Возьмите сцену, которую легко представить: лужу у калитки, кухонный стол в муке, поездку в автобусе с бабушкой. Целый отпуск трудно уместить в короткую сказку. А у истории про то, как вы доставали шляпу из кустов, уже есть место действия, задача и финал.
memory.body2=Выберите событие, к которому его участникам приятно возвращаться. Спросите разрешения, прежде чем использовать личную историю другого взрослого, особенно если собираетесь делиться ею за пределами семьи. Не берите неловкий случай с ребёнком, если ему неприятно о нём слышать. Для начала хватит обычной радостной детали.
memory.source=PBS KIDS for Parents предлагает похожее занятие от Fred Rogers Productions: сделать своими руками книжку по семейному воспоминанию.
