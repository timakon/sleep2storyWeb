answer.title=Оставьте одну настоящую деталь. Добавьте маленькое приключение.
answer.body=Выберите воспоминание, придумайте герою цель и небольшую помеху, а затем доведите историю до понятного конца. Сначала напишите пять предложений. Добавьте немного диалога и одно сказочное событие — получится текст, который можно прочитать вслух.
