sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: книжка по семейным воспоминаниям (на английском)
sources.body=PBS предлагает сделать книжку по семейным воспоминаниям. Восемь вопросов, схема из пяти предложений и «Кораблик из листа» — авторские материалы редакции Sleep2Story. Пример вымышленный и не является отзывом семьи; источник не оценивает Sleep2Story.
