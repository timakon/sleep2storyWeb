faq.eyebrow=माता-पिता के सवाल
faq.title=रिकॉर्ड करने से पहले कुछ जवाब
faq.1.question=क्या अलग माइक्रोफ़ोन चाहिए?
faq.1.answer=नहीं। फ़ोन के अपने माइक्रोफ़ोन से शुरुआत करें। पहली रिकॉर्डिंग से पहले उपकरण खरीदने की तुलना में शांत कमरा और फ़ोन से एक जैसी दूरी ज़्यादा फ़ायदा देती है।
faq.2.question=क्या हर साँस और हर गलती हटानी चाहिए?
faq.2.answer=ध्यान भटकाने वाली गलतियाँ, लंबे व्यवधान और फ़ोन हिलने की आवाज़ हटाएँ। छोटे विराम और साँसें रहने दें; इन्हीं से पढ़ना मानवीय लगता है।
faq.3.question=क्या दादा-दादी या नाना-नानी कहानी रिकॉर्ड कर सकते हैं?
faq.3.answer=हाँ, यदि वे समझते हों कि रिकॉर्डिंग कैसे उपयोग होगी और साफ़ सहमति दें। Sleep2Story की प्रक्रिया आपकी अपनी या अनुमति मिली आवाज़ के उपयोग के लिए बनाई गई है।
faq.4.question=क्या कोई भी बच्चों की किताब रिकॉर्ड कर सकता हूँ?
faq.4.answer=ज़रूरी नहीं। किताबें और ऑडियो रिकॉर्डिंग कॉपीराइट से सुरक्षित हो सकती हैं। अपनी लिखी कहानी, सार्वजनिक अधिकार क्षेत्र में उपलब्ध रचना या अनुमति मिला पाठ चुनें; अपने देश के लागू नियम भी जाँचें।
