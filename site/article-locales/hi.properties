product.title=आवाज़ का एक छोटा नमूना। पूरे परिवार की कहानी लाइब्रेरी।
product.body=Sleep2Story उन परिवारों के लिए बन रहा है जो पूरी सोने से पहले की कहानियाँ किसी अपने की अनुमति-प्राप्त आवाज़ में सुनना चाहते हैं। अपनी या अनुमति मिली आवाज़ का नमूना रिकॉर्ड या अपलोड करें, कहानी का पूरा पाठ जोड़ें और ऑडियो को बैकग्राउंड में तैयार होने दें।
