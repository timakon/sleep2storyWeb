setup.kicker=रिकॉर्ड बटन दबाने से पहले
setup.title=शुरुआत माइक्रोफ़ोन से नहीं, कमरे से करें
setup.lead=रिकॉर्डिंग का सबसे बड़ा सुधार अक्सर जगह बदलने से मिलता है। पर्दों, बिस्तर और कालीन वाला बंद बेडरूम आम तौर पर खाली रसोई या गलियारे से कम गूँजता है।
setup.body=पहली रिकॉर्डिंग के लिए फ़ोन का अपना माइक्रोफ़ोन काफ़ी है। फ़ोन को मुँह से लगभग एक हथेली दूर किसी स्थिर जगह पर रखें और माइक्रोफ़ोन का छेद खुला रहने दें। सीधे उसमें बोलने के बजाय थोड़ा एक ओर मुँह करके पढ़ें, ताकि 'प' और 'ब' जैसी ध्वनियों की तेज़ हवा रिकॉर्डिंग पर न लगे।
kit.label=क्या तैयार रखें
kit.1.title=आपका फ़ोन
kit.1.body=चार्ज हो, सूचनाएँ बंद हों और माइक्रोफ़ोन खुला हो।
kit.2.title=कम गूँज वाला कमरा
kit.2.body=खिड़की-दरवाज़े बंद करें; पर्दे और बिस्तर गूँज कम करेंगे।
kit.3.title=कहानी
kit.3.body=पात्रों की आवाज़ें, पन्ने पलटने और विराम लेने की जगह पहले से चिह्नित करें।
legal.label=कानूनी बात भी ध्यान रखें:
legal.body=अगर कहानी आपकी अपनी नहीं है, तो उसे रिकॉर्ड करने और उपयोग करने की अनुमति जाँच लें। कॉपीराइट के नियम देश के अनुसार बदलते हैं; केवल परिवार में सुनाना और रिकॉर्डिंग सार्वजनिक रूप से बाँटना अलग बातें हैं।
steps.kicker=रिकॉर्डिंग
steps.title=सात कदम, ताकि कहानी में आपकी अपनी आवाज़ बनी रहे
step.1.title=वही कहानी चुनें जिसे पढ़ना आपको अच्छा लगता है
step.1.body=परिचित कहानी पढ़ना आसान होता है। उसे एक बार मन में पढ़ लें, कठिन नामों पर निशान लगाएँ और तय करें कि कहाँ गति धीमी रखनी है। तीसरे पन्ने तक आपका मन ही न लगे तो बेहतर माइक्रोफ़ोन भी वह कमी नहीं भर पाएगा।
step.2.title=कमरे को पर्याप्त शांत करें
step.2.body=पंखा, टीवी, वॉशिंग मशीन और तेज़ आवाज़ वाला एसी बंद करें। घरवालों से दस मिनट शांत रहने को कहें। लक्ष्य सुकून है, प्रयोगशाला जैसी पूर्ण चुप्पी नहीं।
step.3.title=फ़ोन एक जगह रखें और वहीं रहने दें
step.3.body=फ़ोन को मोड़े हुए तौलिये या किसी स्थिर, मुलायम सतह पर रखें। आवाज़ का स्तर ठीक लगे तो उसे हाथ में न उठाएँ और न हिलाएँ; फ़ोन छूने की आवाज़, साँस की स्वाभाविक आवाज़ से ज़्यादा खलती है।
step.4.title=30 सेकंड की जाँच रिकॉर्डिंग करें
step.4.body=सबसे ऊँची और सबसे धीमी पंक्ति पढ़ें, फिर हेडफ़ोन लगाकर सुनें। आवाज़ दूर लगे तो थोड़ा पास आएँ। कर्कश या फटी हुई लगे तो थोड़ा पीछे हटकर फिर जाँचें।
step.5.title=भीड़ के लिए नहीं, अपने बच्चे के लिए पढ़ें
step.5.body=सोचें कि आपका बच्चा बिस्तर पर लेटा सुन रहा है। थोड़ा धीमे बोलें, वाक्यों का प्रवाह बनाए रखें और मज़ाक, आश्चर्य या पन्ने के अंत पर विराम दें। बनावटी अभिनय से ज़्यादा आपकी अपनी सहज गर्माहट मायने रखती है।
step.6.title=रुकें, पंक्ति दोहराएँ और आगे बढ़ें
step.6.body=कोई पंक्ति बिगड़ जाए तो दो सेकंड चुप रहें और वही वाक्य फिर पढ़ें। पूरी कहानी दोबारा शुरू न करें। यह साफ़ विराम बाद में बेहतर टेक पहचानने में मदद करेगा।
step.7.title=सहेजने से पहले एक बार सुनें
step.7.body=शुरुआत, एक ऊँची पंक्ति, एक धीमी पंक्ति और अंत सुन लें। फ़ाइल को पहचानने योग्य नाम दें, मूल रिकॉर्डिंग रखें और अपने नियंत्रण वाली जगह पर बैकअप बनाएँ।
quote.text=मकसद बिल्कुल निर्दोष आवाज़ नहीं, वह परिचित आवाज़ है जिसे आपका बच्चा शांत कमरे में पहचान ले।
