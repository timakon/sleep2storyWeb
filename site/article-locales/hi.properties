answer.label=संक्षेप में
answer.title=अपना मौजूदा फ़ोन लें, घर का सबसे शांत और मुलायम साज-सज्जा वाला कमरा चुनें, छोटी जाँच रिकॉर्डिंग करें और सामान्य से थोड़ा धीमे पढ़ें।
answer.body=हर साँस या हल्की अटकन हटाने की ज़रूरत नहीं। सोते समय सुनाई देने वाली कहानी में बच्चे को अपने परिचित व्यक्ति की आवाज़ महसूस होनी चाहिए।
