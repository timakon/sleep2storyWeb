problems.kicker=समस्या और समाधान
problems.title=फ़ाइल ठीक करने से पहले कमरे को ठीक करें
problem.1.question=आवाज़ दूर या खोखली लगती है
problem.1.answer=फ़ोन के थोड़ा पास आएँ और कम गूँज वाला कमरा चुनें। खाली दीवारें, टाइल और बड़े खुले कमरे आवाज़ को लौटाकर दूर-दूर-सा सुनाते हैं।
problem.2.question='प' से शुरू होने वाले शब्दों पर फटने जैसी आवाज़ आती है
problem.2.answer=मुँह को माइक्रोफ़ोन से थोड़ा एक ओर मोड़ें और थोड़ी दूरी बढ़ाएँ। आगे बढ़ने से पहले एक और छोटी जाँच करें।
problem.3.question=हर पंक्ति में आवाज़ की तेज़ी बदल जाती है
problem.3.answer=बैठने का ढंग और फ़ोन से दूरी लगभग एक जैसी रखें। पात्र ज़ोर से बोलता हो तो भाव से पढ़ें, फ़ोन की ओर अचानक न झुकें।
problem.4.question=पीछे लगातार भनभनाहट सुनाई देती है
problem.4.answer=चार्जर, फ़्रिज, कंप्यूटर के पंखे या हीटर की आवाज़ पर ध्यान दें। यदि स्रोत सुरक्षित ढंग से बंद न कर सकें तो कमरा बदलें।
problem.5.question=एक ही वाक्य पर बार-बार अटक जाता हूँ
problem.5.answer=यदि कहानी आपकी लिखी है तो वाक्य को अपनी बोलने की लय में बदलें। अन्यथा साँस लेने की जगह चिह्नित करें और अनुच्छेद को छोटे हिस्सों में रिकॉर्ड करें।
