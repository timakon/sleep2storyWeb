product.title=Uma amostra de voz curta. Uma biblioteca familiar inteira.
product.body=O Sleep2Story está a ser criado para famílias que querem histórias completas numa voz familiar e autorizada. Adicione uma amostra que tenha direito de usar, introduza o texto completo e deixe a narração preparar-se em segundo plano.
