setup.kicker=Antes de gravar
setup.title=Comece pela divisão, não pelo microfone
setup.lead=A maior melhoria costuma vir do local. Um quarto com cortinas, roupa de cama, tapete e porta fechada soa mais suave do que uma cozinha vazia ou um corredor.
setup.body=O microfone do telemóvel chega para começar. Apoie-o de forma estável, a cerca de um palmo da boca, sem tapar o microfone. Fale ligeiramente para o lado para evitar que os sons p e b provoquem sopros fortes.
kit.label=O que preparar
kit.1.title=O telemóvel
kit.1.body=Carregado, notificações silenciadas, microfone livre.
kit.2.title=Uma divisão acolhedora
kit.2.body=Feche portas e janelas; cortinas e roupa de cama reduzem o eco.
kit.3.title=A história
kit.3.body=Marque vozes, mudanças de página e os pontos onde quer fazer pausa.
legal.label=Uma breve nota jurídica:
legal.body=se a história não for sua, confirme que a pode gravar e usar. Os direitos de autor variam, e uma gravação familiar privada não é o mesmo que a sua distribuição.
steps.kicker=A gravação
steps.title=Sete passos para uma história que continue a soar a si
step.1.title=Escolha uma história que goste de ler
step.1.body=Conhecer o texto dá confiança. Leia-o em silêncio, marque nomes difíceis e pontos para abrandar. Um som perfeito não esconde uma leitura sem entusiasmo.
step.2.title=Deixe a divisão suficientemente silenciosa
step.2.body=Desligue ventoinha, televisão, máquina de lavar e ar condicionado ruidoso. Peça dez minutos de calma em casa. Procura tranquilidade, não silêncio de laboratório.
step.3.title=Apoie o telemóvel e não o mova
step.3.body=Coloque-o sobre uma toalha dobrada ou outra superfície macia e estável. Quando a distância estiver certa, não o segure: os ruídos de manuseamento distraem mais do que a respiração.
step.4.title=Grave um teste de 30 segundos
step.4.body=Leia a frase mais forte e a mais suave e ouça com auscultadores. A voz está longe? Aproxime-se. Está áspera ou distorcida? Afaste-se e repita.
step.5.title=Leia para uma criança, não para uma plateia
step.5.body=Imagine a criança na cama e fale com ela. Abrande um pouco e deixe espaço depois de uma graça, surpresa ou fim de página. A proximidade importa mais do que atuar na perfeição.
step.6.title=Pare, repita e continue
step.6.body=Se uma frase correr mal, guarde dois segundos de silêncio e recomece-a. Não volte ao início da história; a pausa limpa facilita encontrar a melhor tentativa.
step.7.title=Ouça antes de guardar
step.7.body=Verifique o início, uma passagem forte, uma suave e o final. Dê um nome claro ao ficheiro, guarde o original e faça uma cópia de segurança.
quote.text=O objetivo não é uma voz perfeita, mas a voz que a criança reconhece quando o quarto fica em silêncio.
