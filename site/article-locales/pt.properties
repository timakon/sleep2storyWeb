problems.kicker=Resolver problemas
problems.title=Corrija primeiro a divisão, depois o ficheiro
problem.1.question=A voz soa distante ou oca
problem.1.answer=Aproxime-se e escolha uma divisão com mais superfícies macias. Paredes nuas, azulejos e espaços vazios criam reflexos que afastam a voz.
problem.2.question=As palavras com «p» estalam
problem.2.answer=Vire a boca ligeiramente para o lado do microfone e aumente a distância. Faça outro teste curto antes de continuar.
problem.3.question=O volume muda entre frases
problem.3.answer=Mantenha a postura e a distância. Quando uma personagem grita, dê energia à voz sem se inclinar de repente para o telemóvel.
problem.4.question=Há um zumbido constante
problem.4.answer=Verifique carregadores, frigorífico, ventoinhas do computador e aquecimento. Mude de divisão se não puder desligar a fonte em segurança.
problem.5.question=Tropeço sempre na mesma frase
problem.5.answer=Se o texto for seu, adapte-o ao seu ritmo de fala. Caso contrário, marque as respirações e grave o parágrafo em partes menores.
