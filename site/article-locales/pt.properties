answer.label=Em resumo
answer.title=Use o telemóvel que já tem, escolha a divisão mais silenciosa e confortável, faça um teste curto e leia um pouco mais devagar do que o habitual.
answer.body=Não precisa de apagar cada respiração ou tropeço. A história deve continuar a soar a alguém que a criança conhece.
