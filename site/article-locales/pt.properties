faq.eyebrow=Perguntas das famílias
faq.title=O que saber antes de gravar
faq.1.question=Preciso de um microfone externo?
faq.1.answer=Não. Comece pelo microfone do telemóvel. Uma divisão tranquila e macia e uma distância constante costumam valer mais do que comprar equipamento.
faq.2.question=Devo remover cada respiração e erro?
faq.2.answer=Remova erros que distraiam, interrupções longas e ruídos de toque. Mantenha as pequenas pausas e respirações que tornam a leitura humana.
faq.3.question=Um avô ou uma avó pode gravar a história?
faq.3.answer=Sim, se compreender como será usada e der consentimento claro. O Sleep2Story foi pensado apenas para vozes próprias ou usadas com autorização.
faq.4.question=Posso gravar qualquer livro infantil?
faq.4.answer=Nem sempre. Livros e gravações podem estar protegidos. Use uma história sua, uma obra de domínio público ou material que tenha permissão para gravar.
