faq.eyebrow=Questions parents ask
faq.title=A few answers before you record
faq.1.question=Do I need an external microphone?
faq.1.answer=No. Start with the built-in microphone on your phone. A quieter, softer room and consistent distance will usually make a bigger difference than buying equipment before your first recording.
faq.2.question=Should I remove every breath and mistake?
faq.2.answer=Remove distracting mistakes, long interruptions, and obvious handling noise. Keep the small pauses and breaths that make the reading sound human.
faq.3.question=Can a grandparent record the story?
faq.3.answer=Yes, when they understand how the recording will be used and give clear consent. Sleep2Story’s voice flow is designed around using a voice you own or have permission to use.
faq.4.question=Can I record any children’s book?
faq.4.answer=Not automatically. Books and sound recordings can be protected by copyright. Use your own story, a work in the public domain, or material you have permission to record; check the rules that apply where you live.
