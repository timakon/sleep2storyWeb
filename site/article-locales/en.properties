setup.kicker=Before you press record
setup.title=Start with a room, not a microphone
setup.lead=The biggest improvement usually comes from changing where you record. A bedroom with curtains, bedding, a rug, and a closed door will normally sound gentler than an empty kitchen or hallway.
setup.body=Your phone’s built-in microphone is enough for a first recording. Place it on a stable surface about a hand’s width from your mouth, with the microphone uncovered. Face slightly past it rather than directly into it so hard p and b sounds do not hit the microphone with a burst of air.
kit.label=What to prepare
kit.1.title=Your phone
kit.1.body=Charged, notifications silenced, microphone uncovered.
kit.2.title=A soft room
kit.2.body=Close windows and doors; let curtains and bedding tame the echo.
kit.3.title=The story
kit.3.body=Mark character voices, page turns, and places where you want to pause.
legal.label=A small legal note:
legal.body=if the story is not your own, check that you have permission to record and use it. Copyright rules differ by country, and distributing a recording is not the same as keeping a private family reading.
steps.kicker=The recording
steps.title=Seven steps to a story that still sounds like you
step.1.title=Choose a story you enjoy reading
step.1.body=Familiarity helps. Read it once silently, circle difficult names, and decide where the story should slow down. If you sound bored on page three, better audio will not rescue the moment.
step.2.title=Make the room quiet enough
step.2.body=Turn off fans, television, washing machines, and noisy air conditioning. Ask the rest of the house for ten quiet minutes. You are aiming for calm, not laboratory silence.
step.3.title=Set the phone and leave it there
step.3.body=Put the phone on a folded towel or another steady, soft surface. Once the level sounds right, avoid holding or moving it; handling noise is harder to ignore than a natural breath.
step.4.title=Record a 30-second test
step.4.body=Read the loudest line and the quietest line, then listen with headphones. If the voice is faint, move closer. If it sounds harsh or distorted, move back and test again.
step.5.title=Read for one child, not an audience
step.5.body=Picture your child in bed and speak to them. Slow down slightly, keep sentences connected, and leave room after a joke, a surprise, or the end of a page. Natural warmth matters more than perfect acting.
step.6.title=Pause, repeat, continue
step.6.body=If a line goes wrong, stop for two quiet seconds and begin the sentence again. Do not restart the whole story. The clean pause makes the better take easy to find later.
step.7.title=Listen once before you save it
step.7.body=Check the beginning, one loud passage, one soft passage, and the ending. Give the file a useful name, keep the original, and store a backup somewhere you control.
quote.text=The goal is not a flawless voice. It is the voice your child recognises when the room goes quiet.
quote.attribution=Sleep2Story recording principle
