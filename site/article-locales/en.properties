problems.kicker=Troubleshooting
problems.title=Fix the room before you fix the file
problem.1.question=The voice sounds distant or hollow
problem.1.answer=Move closer and choose a softer room. Bare walls, tile, and large empty spaces create reflections that make a voice feel far away.
problem.2.question=Words beginning with “p” pop
problem.2.answer=Turn your mouth slightly to one side of the microphone and add a little distance. Do another short test before continuing.
problem.3.question=The volume jumps between lines
problem.3.answer=Keep your posture and distance consistent. When a character shouts, perform the energy without suddenly leaning into the phone.
problem.4.question=There is a constant background hum
problem.4.answer=Listen for chargers, refrigerators, computer fans, or heating systems. Move rooms if you cannot switch the source off safely.
problem.5.question=I keep stumbling over the same sentence
problem.5.answer=Rewrite it in your own speaking rhythm if it is your text. Otherwise, mark breathing points and record the paragraph in smaller pieces.
