product.title=짧은 목소리 샘플 하나로 우리 가족의 이야기 보관함을
product.body=Sleep2Story는 동의받은 가족의 익숙한 목소리로 잠자리 이야기 전체를 들려주고 싶은 부모를 위해 만들고 있습니다. 사용할 권리가 있는 목소리 샘플을 녹음하거나 업로드하고 이야기의 전체 글을 추가하면, 백그라운드에서 낭독이 준비됩니다.
