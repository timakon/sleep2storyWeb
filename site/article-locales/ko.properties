setup.kicker=녹음 버튼을 누르기 전에
setup.title=마이크보다 방부터 고르세요
setup.lead=녹음 장소를 바꾸는 것만으로도 소리가 크게 좋아질 때가 많습니다. 커튼과 침구, 카펫이 있고 문을 닫을 수 있는 침실은 텅 빈 부엌이나 복도보다 대체로 부드럽게 들립니다.
setup.body=첫 녹음에는 휴대전화 내장 마이크로 충분합니다. 마이크를 가리지 않은 상태로 입에서 손바닥 한 뼘쯤 떨어진 안정적인 곳에 두세요. 마이크 정면이 아닌 살짝 옆을 향해 말하면 ‘ㅍ’이나 ‘ㅂ’ 같은 소리에서 바람이 세게 부딪히는 것을 줄일 수 있습니다.
kit.label=준비할 것
kit.1.title=휴대전화
kit.1.body=충전하고 알림을 끈 뒤 마이크가 가려지지 않았는지 확인하세요.
kit.2.title=소리가 부드러운 방
kit.2.body=창문과 문을 닫고 커튼과 침구로 울림을 줄이세요.
kit.3.title=읽을 이야기
kit.3.body=등장인물의 대사, 페이지 넘기는 곳, 쉬어 갈 부분을 표시해 두세요.
legal.label=작은 저작권 안내:
legal.body=직접 쓴 이야기가 아니라면 녹음하고 사용하는 데 필요한 허락이 있는지 확인하세요. 저작권 규정은 국가마다 다르고, 가족끼리 간직하는 녹음과 외부에 배포하는 녹음은 다릅니다.
steps.kicker=녹음하기
steps.title=내 목소리답게 이야기를 남기는 일곱 단계
step.1.title=읽는 즐거움이 있는 이야기를 고르세요
step.1.body=익숙한 이야기가 좋습니다. 먼저 조용히 한 번 읽고 어려운 이름에 표시한 뒤 어디에서 속도를 늦출지 정하세요. 세 번째 장에서 지루함이 묻어난다면 음질을 높여도 분위기가 살아나기는 어렵습니다.
step.2.title=방을 충분히 조용하게 만드세요
step.2.body=선풍기, 텔레비전, 세탁기, 시끄러운 에어컨을 끄세요. 집에 있는 사람들에게 10분만 조용히 해 달라고 부탁해도 좋습니다. 실험실 같은 정적이 아니라 차분한 환경이면 됩니다.
step.3.title=휴대전화를 놓고 움직이지 마세요
step.3.body=접은 수건처럼 안정적이고 부드러운 곳에 휴대전화를 두세요. 소리가 적당하게 잡히면 들거나 옮기지 마세요. 손으로 만지는 잡음은 자연스러운 숨소리보다 훨씬 거슬립니다.
step.4.title=30초 시험 녹음을 해 보세요
step.4.body=가장 큰 소리로 읽는 대목과 가장 조용한 대목을 읽고 이어폰으로 들어 보세요. 목소리가 작으면 조금 가까이, 거칠거나 찌그러져 들리면 조금 멀리 둔 뒤 다시 시험하세요.
step.5.title=청중이 아닌 아이 한 명에게 읽어 주세요
step.5.body=침대에 누운 아이를 떠올리고 그 아이에게 말을 건네세요. 조금 천천히 읽되 문장이 끊기지 않게 하고, 웃긴 장면이나 뜻밖의 장면, 한 페이지가 끝난 뒤에는 잠깐 쉬세요. 완벽한 연기보다 자연스러운 따뜻함이 중요합니다.
step.6.title=잠깐 멈추고 다시 읽은 뒤 이어 가세요
step.6.body=한 문장을 잘못 읽었다면 2초쯤 조용히 멈췄다가 그 문장부터 다시 시작하세요. 이야기 전체를 처음부터 녹음할 필요는 없습니다. 그 짧은 틈이 나중에 더 나은 부분을 찾기 쉽게 해 줍니다.
step.7.title=저장하기 전에 한 번 들어 보세요
step.7.body=시작 부분, 큰 소리로 읽은 대목, 조용히 읽은 대목, 마지막 부분을 확인하세요. 파일에 알아보기 쉬운 이름을 붙이고 원본을 남긴 뒤, 직접 관리할 수 있는 곳에 백업하세요.
quote.text=목표는 흠 없는 목소리가 아닙니다. 방이 조용해졌을 때 아이가 알아보는 바로 그 목소리입니다.
quote.attribution=Sleep2Story의 녹음 원칙
