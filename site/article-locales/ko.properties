checklist.1=휴대전화 충전 또는 전원 연결
checklist.2=방해 금지 모드 또는 비행기 모드 켜기
checklist.3=문과 창문 닫기
checklist.4=선풍기와 텔레비전 끄기
checklist.5=마이크 구멍이 가려지지 않았는지 확인
checklist.6=마실 물 준비
checklist.7=30초 시험 녹음 다시 들어 보기
