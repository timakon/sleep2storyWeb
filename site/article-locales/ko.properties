faq.eyebrow=부모들이 묻는 질문
faq.title=녹음 전에 알아둘 몇 가지
faq.1.question=외장 마이크가 필요한가요?
faq.1.answer=아니요. 휴대전화 내장 마이크로 시작하세요. 첫 녹음부터 장비를 사는 것보다 조용하고 소리가 부드러운 방을 고르고 거리를 일정하게 유지하는 편이 대개 더 도움이 됩니다.
faq.2.question=숨소리와 말실수를 모두 지워야 하나요?
faq.2.answer=듣기에 방해되는 말실수, 긴 중단, 뚜렷한 기기 잡음은 빼세요. 사람답게 들리는 짧은 쉼과 숨소리는 남겨도 좋습니다.
faq.3.question=조부모님이 이야기를 녹음해도 되나요?
faq.3.answer=네. 녹음이 어떻게 쓰일지 이해하고 분명히 동의하셔야 합니다. Sleep2Story의 목소리 녹음 과정은 본인의 목소리나 사용 허락을 받은 목소리를 전제로 설계했습니다.
faq.4.question=어떤 아동 도서든 녹음해도 되나요?
faq.4.answer=그렇지는 않습니다. 책과 녹음물은 저작권 보호를 받을 수 있습니다. 직접 쓴 이야기나 저작권 보호 기간이 끝난 작품, 녹음 허락을 받은 자료를 사용하고 거주 지역의 규정을 확인하세요.
