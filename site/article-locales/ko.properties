answer.label=간단히 말하면
answer.title=지금 쓰는 휴대전화를 들고 집에서 소리가 가장 부드러운 방을 고르세요. 짧게 시험 녹음한 뒤 평소보다 조금 천천히 읽으면 됩니다.
answer.body=숨소리나 작은 말실수를 전부 없앨 필요는 없어요. 잠자리 이야기는 아이가 아는 사람의 목소리처럼 들려야 하니까요.
