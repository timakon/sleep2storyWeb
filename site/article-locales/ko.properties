problems.kicker=문제가 생겼다면
problems.title=파일을 고치기 전에 방부터 바꿔 보세요
problem.1.question=목소리가 멀거나 울려서 들려요
problem.1.answer=휴대전화에 조금 더 가까이 가고 소리가 부드러운 방을 고르세요. 맨벽과 타일, 넓고 빈 공간에서는 소리가 반사되어 목소리가 멀게 들립니다.
problem.2.question=‘ㅍ’으로 시작하는 말에서 퍽 하는 소리가 나요
problem.2.answer=마이크를 향해 정면으로 말하지 말고 입을 살짝 옆으로 돌린 다음 거리를 조금 늘리세요. 이어서 짧게 다시 시험 녹음하세요.
problem.3.question=문장마다 소리 크기가 달라져요
problem.3.answer=자세와 휴대전화까지의 거리를 일정하게 유지하세요. 등장인물이 외칠 때는 몸을 갑자기 휴대전화 쪽으로 기울이기보다 목소리의 기운으로 표현해 보세요.
problem.4.question=계속 웅웅거리는 배경음이 있어요
problem.4.answer=충전기, 냉장고, 컴퓨터 팬, 난방 장치 소리인지 들어 보세요. 안전하게 끌 수 없다면 방을 옮기세요.
problem.5.question=같은 문장에서 자꾸 말이 꼬여요
problem.5.answer=직접 쓴 글이라면 평소 말하는 리듬에 맞게 문장을 고쳐 보세요. 다른 사람의 글이라면 숨 쉴 곳을 표시하고 문단을 나누어 녹음하세요.
