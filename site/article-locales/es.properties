answer.label=La respuesta corta
answer.title=Usa el móvil que ya tienes, busca la habitación más tranquila y acogedora, haz una prueba breve y lee un poco más despacio de lo habitual.
answer.body=No hace falta borrar cada respiración o tropiezo. El cuento debe seguir sonando a alguien que el niño conoce.
