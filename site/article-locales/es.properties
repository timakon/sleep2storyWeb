problems.kicker=Solución de problemas
problems.title=Arregla primero la habitación y después el archivo
problem.1.question=La voz suena lejana o hueca
problem.1.answer=Acércate y elige un espacio más acogedor. Las paredes desnudas, los azulejos y las habitaciones vacías crean reflejos que alejan la voz.
problem.2.question=Las palabras con «p» golpean
problem.2.answer=Gira la boca un poco hacia un lado del micrófono y aumenta la distancia. Haz otra prueba breve antes de seguir.
problem.3.question=El volumen cambia entre frases
problem.3.answer=Mantén la postura y la distancia. Si un personaje grita, pon energía en la voz sin inclinarte de golpe hacia el móvil.
problem.4.question=Se oye un zumbido constante
problem.4.answer=Revisa cargadores, frigorífico, ventiladores del ordenador y calefacción. Cambia de habitación si no puedes apagar la fuente con seguridad.
problem.5.question=Siempre tropiezo con la misma frase
problem.5.answer=Si el texto es tuyo, adáptalo a tu ritmo al hablar. Si no, marca dónde respirar y graba el párrafo en partes más pequeñas.
