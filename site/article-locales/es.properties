product.title=Una muestra de voz breve. Toda una biblioteca familiar.
product.body=Sleep2Story se está creando para familias que quieren cuentos completos narrados con una voz familiar y autorizada. Añade una muestra que tengas derecho a usar, incorpora el texto completo y deja que la narración se prepare en segundo plano.
