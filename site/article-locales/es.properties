setup.kicker=Antes de pulsar grabar
setup.title=Empieza por la habitación, no por el micrófono
setup.lead=El mayor cambio suele venir del lugar. Un dormitorio con cortinas, ropa de cama, alfombra y puerta cerrada sonará más suave que una cocina vacía o un pasillo.
setup.body=El micrófono del móvil basta para empezar. Déjalo estable a una distancia aproximada de un palmo, sin tapar el micro. Habla ligeramente hacia un lado para que las consonantes p y b no lancen aire directo.
kit.label=Qué necesitas
kit.1.title=Tu móvil
kit.1.body=Cargado, notificaciones silenciadas y micrófono libre.
kit.2.title=Una habitación acogedora
kit.2.body=Cierra puertas y ventanas; las cortinas y la cama reducirán el eco.
kit.3.title=El cuento
kit.3.body=Marca voces, cambios de página y lugares donde quieras hacer una pausa.
legal.label=Una breve nota legal:
legal.body=si el cuento no es tuyo, comprueba que puedes grabarlo y usarlo. Las normas de derechos de autor varían, y una grabación familiar privada no es lo mismo que distribuirla.
steps.kicker=La grabación
steps.title=Siete pasos para un cuento que siga sonando a ti
step.1.title=Elige un cuento que disfrutes leyendo
step.1.body=Conocerlo da soltura. Léelo antes en silencio, marca los nombres difíciles y decide dónde bajar el ritmo. Un audio impecable no compensa una lectura sin ganas.
step.2.title=Deja la habitación suficientemente tranquila
step.2.body=Apaga ventilador, televisión, lavadora y aire acondicionado ruidoso. Pide diez minutos de calma en casa. Buscas tranquilidad, no silencio de laboratorio.
step.3.title=Apoya el móvil y no lo muevas
step.3.body=Ponlo sobre una toalla doblada u otra superficie blanda y estable. Cuando la distancia funcione, no lo sujetes: los roces distraen más que una respiración natural.
step.4.title=Graba una prueba de 30 segundos
step.4.body=Lee la frase más fuerte y la más suave y escucha con auriculares. Si la voz queda lejos, acércate. Si suena áspera o distorsionada, aléjate y repite.
step.5.title=Lee para un niño, no para un público
step.5.body=Imagina a tu hijo en la cama y háblale a él. Reduce un poco el ritmo y deja espacio tras una broma, una sorpresa o el final de la página. La cercanía importa más que actuar perfecto.
step.6.title=Pausa, repite y continúa
step.6.body=Si una frase sale mal, guarda dos segundos de silencio y empieza de nuevo. No reinicies todo el cuento: la pausa limpia permitirá localizar fácilmente la toma buena.
step.7.title=Escucha una vez antes de guardar
step.7.body=Revisa el inicio, un pasaje fuerte, uno suave y el final. Pon un nombre claro al archivo, conserva el original y guarda una copia en un lugar que controles.
quote.text=No buscamos una voz perfecta, sino la voz que el niño reconoce cuando la habitación queda en silencio.
