faq.eyebrow=Preguntas de las familias
faq.title=Lo que conviene saber antes de grabar
faq.1.question=¿Necesito un micrófono externo?
faq.1.answer=No. Empieza con el micrófono del móvil. Una habitación tranquila, superficies blandas y una distancia constante suelen aportar más que comprar equipo.
faq.2.question=¿Debo quitar cada respiración y error?
faq.2.answer=Elimina errores que distraigan, interrupciones largas y roces claros. Conserva las pequeñas pausas y respiraciones que hacen humana la lectura.
faq.3.question=¿Puede grabar el cuento un abuelo o una abuela?
faq.3.answer=Sí, si entiende cómo se utilizará y da su consentimiento claro. Sleep2Story está pensado para voces propias o usadas con permiso.
faq.4.question=¿Puedo grabar cualquier libro infantil?
faq.4.answer=No siempre. Los libros y audios pueden estar protegidos. Usa un cuento propio, una obra de dominio público o material que tengas permiso para grabar.
