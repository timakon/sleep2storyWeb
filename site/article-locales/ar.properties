setup.kicker=قبل بدء التسجيل
setup.title=ابدأ بالغرفة، لا بالميكروفون
setup.lead=غالبًا ما يحدث أكبر تحسّن عندما تغيّر مكان التسجيل. غرفة نوم فيها ستائر وفراش وسجادة وباب مغلق تجعل الصوت ألطف من مطبخ فارغ أو ممرّ واسع.
setup.body=يكفي ميكروفون هاتفك المدمج لأول تسجيل. ضع الهاتف على سطح ثابت، على بُعد نحو كفّ من فمك، مع إبقاء فتحة الميكروفون مكشوفة. تحدّث باتجاه جانبه قليلًا بدلًا من مواجهته مباشرةً، حتى لا تُحدث أصوات الحروف القوية دفعة هواء في التسجيل.
kit.label=ما الذي تحتاج إليه؟
kit.1.title=هاتفك
kit.1.body=مشحون، وإشعاراته صامتة، وميكروفونه غير مغطّى.
kit.2.title=غرفة هادئة
kit.2.body=أغلق النوافذ والأبواب؛ فالستائر والفراش يخففان الصدى.
kit.3.title=الحكاية
kit.3.body=حدّد أصوات الشخصيات، ومواضع تقليب الصفحات، والوقفات التي تريدها.
legal.label=ملاحظة قانونية قصيرة:
legal.body=إذا لم تكن الحكاية من تأليفك، فتأكّد من امتلاكك الإذن بتسجيلها واستخدامها. تختلف قواعد حقوق النشر من بلد إلى آخر، كما أن نشر التسجيل يختلف عن الاحتفاظ بقراءة خاصة داخل العائلة.
steps.kicker=وقت التسجيل
steps.title=سبع خطوات لحكاية ما زالت تشبه صوتك
step.1.title=اختر حكاية تحب قراءتها
step.1.body=الألفة تساعدك. اقرأ الحكاية بصمت أولًا، وضع علامة على الأسماء الصعبة، وحدّد المواضع التي يستحسن أن تُبطئ فيها. إذا بدا الملل في صوتك عند الصفحة الثالثة، فلن تُصلحه جودة الصوت وحدها.
step.2.title=اجعل الغرفة هادئة بما يكفي
step.2.body=أطفئ المروحة والتلفاز والغسالة ومكيّف الهواء المزعج. اطلب من أهل البيت عشر دقائق من الهدوء. المطلوب جو مريح، لا صمت مختبر.
step.3.title=ثبّت الهاتف في مكانه
step.3.body=ضعه فوق منشفة مطوية أو سطح لين وثابت. بعد أن تضبط مستوى الصوت، تجنّب حمله أو تحريكه؛ فصوت احتكاك اليد بالهاتف يشتّت الانتباه أكثر من التنفس الطبيعي.
step.4.title=سجّل تجربة مدتها 30 ثانية
step.4.body=اقرأ أعلى جملة صوتًا وأهدأ جملة، ثم استمع بسماعات. إذا بدا الصوت بعيدًا، اقترب قليلًا. وإذا بدا حادًا أو مشوّهًا، ابتعد وأعد التجربة.
step.5.title=اقرأ لطفل واحد، لا لجمهور
step.5.body=تخيّل طفلك مستلقيًا في سريره وتحدّث إليه. أبطئ قليلًا، وحافظ على سلاسة الجمل، واترك فسحة بعد طرفة أو مفاجأة أو نهاية صفحة. الدفء الطبيعي أهم من التمثيل المتقن.
step.6.title=توقّف، وأعد الجملة، ثم واصل
step.6.body=إذا أخطأت في جملة، توقّف ثانيتين بهدوء ثم ابدأ الجملة من جديد. لا تُعد الحكاية كلها. تساعد الوقفة الواضحة على العثور على النسخة الأفضل لاحقًا.
step.7.title=استمع مرة قبل الحفظ
step.7.body=افحص البداية، ومقطعًا مرتفعًا، وآخر هادئًا، والنهاية. سمِّ الملف باسم واضح، واحتفظ بالأصل ونسخة احتياطية في مكان تتحكّم فيه.
quote.text=الهدف ليس صوتًا بلا عيوب، بل صوتًا يعرفه طفلك حين تهدأ الغرفة.
