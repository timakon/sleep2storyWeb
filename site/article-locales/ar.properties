faq.eyebrow=أسئلة الوالدين
faq.title=إجابات سريعة قبل التسجيل
faq.1.question=هل أحتاج إلى ميكروفون خارجي؟
faq.1.answer=لا. ابدأ بميكروفون هاتفك المدمج. غالبًا ما تُحدث الغرفة الأهدأ والأقل صدىً، مع مسافة ثابتة، فرقًا أكبر من شراء معدات قبل أول تسجيل.
faq.2.question=هل أحذف كل نَفَس وخطأ؟
faq.2.answer=احذف الأخطاء المشتّتة والانقطاعات الطويلة وأصوات لمس الهاتف الواضحة. واترك الوقفات والأنفاس الصغيرة التي تجعل القراءة إنسانية.
faq.3.question=هل يمكن لأحد الجدّين تسجيل الحكاية؟
faq.3.answer=نعم، إذا فهم كيف سيُستخدم التسجيل ووافق بوضوح. صُمّم مسار تسجيل الصوت في Sleep2Story لاستخدام صوتك أو صوت شخص أذن لك باستخدامه.
faq.4.question=هل يمكنني تسجيل أي كتاب للأطفال؟
faq.4.answer=ليس بالضرورة. قد تكون الكتب والتسجيلات الصوتية محمية بحقوق النشر. استخدم حكاية من تأليفك، أو عملًا من الملكية العامة، أو مادة حصلت على إذن بتسجيلها؛ وتحقّق من القواعد السارية حيث تعيش.
