problems.kicker=حل المشكلات
problems.title=أصلح صوت الغرفة قبل تعديل الملف
problem.1.question=يبدو الصوت بعيدًا أو أجوف
problem.1.answer=اقترب من الهاتف واختر غرفة أكثر امتلاءً بالأقمشة. الجدران العارية والبلاط والمساحات الفارغة الكبيرة تعكس الصوت وتجعله يبدو بعيدًا.
problem.2.question=تُحدث بعض الحروف فرقعة في التسجيل
problem.2.answer=أدر فمك قليلًا إلى جانب الميكروفون وزد المسافة بينكما. سجّل تجربة قصيرة أخرى قبل المتابعة.
problem.3.question=يرتفع الصوت ويهبط بين الجمل
problem.3.answer=حافظ على وضعية جلوسك وبُعدك عن الهاتف. عندما تصرخ شخصية في الحكاية، عبّر عن الحماس من غير أن تقترب فجأةً من الميكروفون.
problem.4.question=توجد طنين ثابت في الخلفية
problem.4.answer=تحقّق من الشواحن والثلاجة ومراوح الكمبيوتر والتدفئة. انتقل إلى غرفة أخرى إذا لم تستطع إيقاف المصدر بأمان.
problem.5.question=أتعثّر في الجملة نفسها مرارًا
problem.5.answer=إذا كان النص من تأليفك، فأعد صياغته بما يوافق طريقة كلامك. وإلا فحدّد مواضع التنفس وسجّل الفقرة على أجزاء أقصر.
