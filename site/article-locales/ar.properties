answer.label=الخلاصة السريعة
answer.title=استخدم هاتفك الحالي، واختر أكثر غرف البيت هدوءًا وليونةً في الصوت، وسجّل تجربة قصيرة، ثم اقرأ أبطأ قليلًا من المعتاد.
answer.body=لا تحتاج إلى حذف كل نَفَس أو تعثّر. ما يريح الطفل قبل النوم هو سماع صوت يعرفه.
