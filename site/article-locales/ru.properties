answer.label=Если коротко
answer.title=Возьмите обычный телефон, выберите самую тихую и мягкую комнату, сделайте пробную запись и читайте немного медленнее привычного.
answer.body=Не вырезайте каждый вдох и каждую запинку. Сказка должна звучать как живой голос близкого человека.
