faq.eyebrow=Вопросы родителей
faq.title=Что стоит знать перед записью
faq.1.question=Нужен ли внешний микрофон?
faq.1.answer=Нет. Начните со встроенного микрофона телефона. Тихая мягкая комната и постоянное расстояние обычно дают больше, чем покупка техники до первой записи.
faq.2.question=Нужно ли удалять каждый вдох и ошибку?
faq.2.answer=Уберите заметные ошибки, долгие помехи и шорохи от телефона. Небольшие паузы и дыхание оставьте — они делают чтение живым.
faq.3.question=Может ли сказку записать бабушка или дедушка?
faq.3.answer=Да, если человек понимает, как будет использоваться запись, и явно согласен. Sleep2Story рассчитан только на голос, который принадлежит вам или используется с разрешения.
faq.4.question=Можно ли записать любую детскую книгу?
faq.4.answer=Не всегда. Книги и аудиозаписи могут охраняться авторским правом. Используйте собственную сказку, произведение из общественного достояния или текст, на запись которого у вас есть разрешение.
