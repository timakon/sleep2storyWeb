problems.kicker=Если что-то не так
problems.title=Сначала исправьте комнату, потом файл
problem.1.question=Голос звучит далеко или гулко
problem.1.answer=Подвиньтесь ближе и выберите комнату с мягкими поверхностями. Голые стены, плитка и пустое пространство создают отражения и отдаляют голос.
problem.2.question=Согласная «п» резко хлопает
problem.2.answer=Повернитесь немного в сторону от микрофона и чуть увеличьте расстояние. Перед продолжением снова сделайте короткий тест.
problem.3.question=Громкость скачет от фразы к фразе
problem.3.answer=Сохраняйте одинаковую позу и расстояние. Когда герой кричит, передайте энергию голосом, но не наклоняйтесь резко к телефону.
problem.4.question=На записи постоянный гул
problem.4.answer=Проверьте зарядные устройства, холодильник, компьютер и отопление. Если источник нельзя безопасно выключить, перейдите в другую комнату.
problem.5.question=Я всё время спотыкаюсь на одной фразе
problem.5.answer=Если текст ваш, перепишите фразу под живую речь. Если нет — отметьте места вдоха и запишите абзац небольшими частями.
