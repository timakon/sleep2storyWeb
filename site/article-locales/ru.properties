setup.kicker=До нажатия кнопки записи
setup.title=Сначала выберите комнату, а не микрофон
setup.lead=Лучший способ улучшить звук — сменить место. Спальня со шторами, постелью, ковром и закрытой дверью почти всегда звучит мягче пустой кухни или коридора.
setup.body=Для первой записи достаточно встроенного микрофона телефона. Поставьте его устойчиво примерно в ладони от лица и не закрывайте отверстие микрофона. Говорите чуть в сторону, чтобы согласные «п» и «б» не давали резкого выдоха в запись.
kit.label=Что подготовить
kit.1.title=Телефон
kit.1.body=Заряжен, уведомления отключены, микрофон открыт.
kit.2.title=Мягкая комната
kit.2.body=Закройте окна и двери; шторы и постель приглушат эхо.
kit.3.title=Текст сказки
kit.3.body=Отметьте голоса героев, перевороты страниц и места для пауз.
legal.label=Небольшое юридическое уточнение:
legal.body=если сказка написана не вами, проверьте, можно ли её записывать и использовать. Авторское право различается по странам, а семейная запись для себя и её распространение — не одно и то же.
steps.kicker=Запись
steps.title=Семь шагов к сказке, которая звучит по-вашему
step.1.title=Выберите сказку, которую вам нравится читать
step.1.body=Знакомый текст звучит увереннее. Сначала прочитайте его про себя, отметьте сложные имена и места, где хочется замедлиться. Даже идеальный звук не скроет скуку в голосе.
step.2.title=Сделайте комнату достаточно тихой
step.2.body=Выключите телевизор, вентилятор, стиральную машину и шумный кондиционер. Попросите домашних о десяти спокойных минутах. Нужна тишина для сказки, а не лаборатория.
step.3.title=Поставьте телефон и больше не трогайте
step.3.body=Положите телефон на сложенное полотенце или другую мягкую устойчивую поверхность. Когда расстояние выбрано, не держите и не двигайте его: шорохи рук заметнее естественного дыхания.
step.4.title=Запишите пробные 30 секунд
step.4.body=Прочитайте самую громкую и самую тихую фразу и послушайте в наушниках. Голос далеко — придвиньтесь. Звук резкий или хрипит — отодвиньтесь и повторите тест.
step.5.title=Читайте одному ребёнку, а не залу
step.5.body=Представьте ребёнка в кровати и обращайтесь именно к нему. Читайте чуть медленнее, оставляйте паузы после шутки, неожиданности и в конце страницы. Тепло важнее актёрского совершенства.
step.6.title=Остановитесь, повторите и продолжайте
step.6.body=Если фраза не удалась, помолчите две секунды и начните предложение заново. Не перезаписывайте всю сказку: чистая пауза поможет быстро найти удачный дубль.
step.7.title=Прослушайте запись перед сохранением
step.7.body=Проверьте начало, громкий и тихий отрывки и финал. Дайте файлу понятное имя, сохраните оригинал и сделайте резервную копию в надёжном месте.
quote.text=Цель не в безупречном голосе, а в голосе, который ребёнок узнаёт, когда в комнате становится тихо.
quote.attribution=Принцип записи Sleep2Story
