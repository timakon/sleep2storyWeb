faq.eyebrow=Ebeveynlerin soruları
faq.title=Kaydetmeden önce bilinmesi gerekenler
faq.1.question=Harici mikrofon gerekir mi?
faq.1.answer=Hayır. Telefonun mikrofonuyla başlayın. Sessiz, yumuşak bir oda ve sabit uzaklık genellikle yeni ekipmandan daha çok fark yaratır.
faq.2.question=Her nefesi ve hatayı silmeli miyim?
faq.2.answer=Dikkat dağıtan hataları, uzun kesintileri ve temas seslerini kaldırın. Okumayı insani kılan küçük durakları ve nefesleri koruyun.
faq.3.question=Masalı büyükanne ya da büyükbaba kaydedebilir mi?
faq.3.answer=Evet; nasıl kullanılacağını anlayıp açıkça onay veriyorsa. Sleep2Story yalnızca size ait veya izinli sesler için tasarlanmıştır.
faq.4.question=Her çocuk kitabını kaydedebilir miyim?
faq.4.answer=Her zaman değil. Kitap ve kayıtlar telifle korunabilir. Kendi masalınızı, kamu malı eseri veya kaydetme izniniz olan içeriği kullanın.
