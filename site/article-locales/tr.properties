problems.kicker=Sorun giderme
problems.title=Önce odayı, sonra dosyayı düzeltin
problem.1.question=Ses uzak ya da boş geliyor
problem.1.answer=Yaklaşın ve daha yumuşak yüzeyli bir oda seçin. Çıplak duvarlar, fayans ve boş alanlar sesi uzaklaştıran yansımalar oluşturur.
problem.2.question=P ile başlayan kelimeler patlıyor
problem.2.answer=Ağzınızı mikrofondan biraz yana çevirip uzaklığı artırın. Devam etmeden önce kısa bir test daha yapın.
problem.3.question=Cümleler arasında ses seviyesi değişiyor
problem.3.answer=Duruşunuzu ve uzaklığı sabit tutun. Bir karakter bağırırken telefona eğilmeden sesinize enerji katın.
problem.4.question=Arka planda sürekli uğultu var
problem.4.answer=Şarj cihazı, buzdolabı, bilgisayar fanı ve ısıtmayı kontrol edin. Kaynağı güvenle kapatamıyorsanız oda değiştirin.
problem.5.question=Hep aynı cümlede takılıyorum
problem.5.answer=Metin sizinse doğal konuşma ritminize göre düzenleyin. Değilse nefes yerlerini işaretleyip paragrafı küçük parçalara bölün.
