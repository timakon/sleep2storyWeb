setup.kicker=Kayda basmadan önce
setup.title=Mikrofondan önce odayı seçin
setup.lead=En büyük iyileşme çoğu zaman mekânı değiştirmekle gelir. Perdeli, yataklı, halılı ve kapısı kapalı bir oda; boş mutfak ya da koridordan daha yumuşak duyulur.
setup.body=İlk kayıt için telefonun mikrofonu yeterlidir. Telefonu ağzınızdan yaklaşık bir karış uzakta, sabit biçimde yerleştirin ve mikrofonu kapatmayın. P ve b seslerinin hava patlaması yaratmaması için hafifçe yana doğru konuşun.
kit.label=Neler gerekli?
kit.1.title=Telefonunuz
kit.1.body=Şarjı dolu, bildirimleri sessizde, mikrofonu açık.
kit.2.title=Yumuşak bir oda
kit.2.body=Kapı ve pencereleri kapatın; perde ve yatak yankıyı azaltır.
kit.3.title=Masal
kit.3.body=Karakter seslerini, sayfa geçişlerini ve durakları işaretleyin.
legal.label=Kısa bir hukuki not:
legal.body=masal size ait değilse kaydetme ve kullanma izniniz olduğunu kontrol edin. Telif kuralları ülkeye göre değişir; özel aile kaydı ile dağıtım aynı şey değildir.
steps.kicker=Kayıt
steps.title=Hâlâ sizin gibi duyulan bir masal için yedi adım
step.1.title=Okumaktan keyif aldığınız bir masal seçin
step.1.body=Metni tanımak rahatlık verir. Önce sessizce okuyun, zor isimleri ve yavaşlayacağınız yerleri işaretleyin. Kusursuz ses bile isteksiz okumayı kurtaramaz.
step.2.title=Odayı yeterince sessizleştirin
step.2.body=Vantilatör, televizyon, çamaşır makinesi ve gürültülü klimayı kapatın. Evdekilerden on sakin dakika isteyin. Amaç laboratuvar sessizliği değil, huzurdur.
step.3.title=Telefonu bırakın ve oynatmayın
step.3.body=Katlanmış bir havlu ya da başka yumuşak, sabit bir yüzey kullanın. Uzaklık ayarlanınca telefonu elde tutmayın; temas gürültüsü doğal nefesten daha rahatsız edicidir.
step.4.title=30 saniyelik bir test kaydedin
step.4.body=En yüksek ve en alçak cümleyi okuyup kulaklıkla dinleyin. Ses uzaktaysa yaklaşın. Sert ya da bozuksa uzaklaşıp yeniden deneyin.
step.5.title=Bir çocuğa okuyun, salona değil
step.5.body=Çocuğunuzu yatakta hayal edip ona konuşun. Biraz yavaşlayın; şaka, şaşkınlık ve sayfa sonunda boşluk bırakın. Sıcaklık, kusursuz oyunculuktan önemlidir.
step.6.title=Durun, tekrarlayın, devam edin
step.6.body=Bir cümle yanlış giderse iki saniye sessiz kalıp yeniden başlayın. Tüm masalı başa almayın; temiz durak iyi kaydı sonra kolayca buldurur.
step.7.title=Kaydetmeden önce bir kez dinleyin
step.7.body=Başı, yüksek ve alçak bir bölümü ve sonu kontrol edin. Dosyaya anlaşılır ad verin, orijinali saklayın ve yedek alın.
quote.text=Amaç kusursuz bir ses değil, oda sessizleştiğinde çocuğun tanıdığı sestir.
