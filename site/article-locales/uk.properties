setup.kicker=Перш ніж натиснути «Запис»
setup.title=Почніть із кімнати, а не з мікрофона
setup.lead=Найбільше на звук впливає місце. Спальня зі шторами, постіллю, килимом і зачиненими дверима зазвичай звучить м’якше, ніж порожня кухня чи коридор.
setup.body=Для першої спроби вистачить вбудованого мікрофона телефона. Покладіть телефон стійко приблизно за долоню від обличчя й не закривайте мікрофон. Говоріть трохи повз нього, щоб звуки «п» і «б» не створювали різкого подиху.
kit.label=Що підготувати
kit.1.title=Телефон
kit.1.body=Заряджений, сповіщення вимкнені, мікрофон відкритий.
kit.2.title=Затишна кімната
kit.2.body=Зачиніть вікна й двері; штори та постіль поглинуть луну.
kit.3.title=Текст казки
kit.3.body=Позначте голоси героїв, перегортання сторінок і місця для пауз.
legal.label=Коротке юридичне уточнення:
legal.body=якщо казка не ваша, перевірте, чи маєте право її записувати й використовувати. Правила авторського права різняться, а приватний родинний запис і його поширення — не те саме.
steps.kicker=Запис
steps.title=Сім кроків до казки, що звучить як ви
step.1.title=Оберіть казку, яку любите читати
step.1.body=Знайомий текст додає впевненості. Прочитайте його подумки, позначте складні імена й місця, де варто сповільнитися. Байдужість не врятує навіть ідеальний звук.
step.2.title=Зробіть кімнату достатньо тихою
step.2.body=Вимкніть телевізор, вентилятор, пральну машину й гучний кондиціонер. Попросіть домашніх про десять тихих хвилин. Потрібен спокій, а не лабораторна тиша.
step.3.title=Покладіть телефон і не рухайте його
step.3.body=Складений рушник дасть м’яку стійку основу. Коли відстань підходить, не тримайте телефон у руці: шурхіт пальців помітніший за природне дихання.
step.4.title=Запишіть тестові 30 секунд
step.4.body=Прочитайте найтихіший і найгучніший рядок та послухайте в навушниках. Голос далеко — присуньтеся. Звук різкий або спотворений — відсуньтеся й повторіть.
step.5.title=Читайте одній дитині, а не залу
step.5.body=Уявіть дитину в ліжку й говоріть саме до неї. Читайте трохи повільніше, робіть паузи після жарту, несподіванки чи наприкінці сторінки. Тепло важливіше за бездоганну акторську гру.
step.6.title=Зупиніться, повторіть і продовжуйте
step.6.body=Якщо фраза не вдалася, помовчіть дві секунди й почніть речення знову. Не перезаписуйте всю казку: чиста пауза допоможе швидко знайти вдалий дубль.
step.7.title=Прослухайте перед збереженням
step.7.body=Перевірте початок, гучний і тихий уривки та фінал. Дайте файлу зрозумілу назву, збережіть оригінал і зробіть резервну копію.
quote.text=Мета не в бездоганному голосі, а в голосі, який дитина впізнає, коли в кімнаті стає тихо.
quote.attribution=Принцип запису Sleep2Story
checklist.kicker=Перед повним записом
checklist.title=Перевірка за одну хвилину
checklist.1=Телефон заряджений або під’єднаний до живлення
checklist.2=Увімкнено режим «Не турбувати» або авіарежим
checklist.3=Вікна й двері зачинені
checklist.4=Телевізор і вентилятор вимкнені
checklist.5=Отвір мікрофона не закритий
checklist.6=Вода поруч
checklist.7=Тестові 30 секунд прослухані
checklist.8=Назву й право на запис перевірено
problems.kicker=Як виправити звук
problems.title=Спочатку виправте кімнату, потім файл
problem.1.question=Голос звучить далеко або гулко
problem.1.answer=Посуньтеся ближче й оберіть кімнату з м’якими поверхнями. Голі стіни, плитка та порожній простір створюють відлуння.
problem.2.question=Звук «п» різко ляскає
problem.2.answer=Поверніться трохи вбік від мікрофона й збільште відстань. Перед продовженням зробіть ще один короткий тест.
problem.3.question=Гучність стрибає між фразами
problem.3.answer=Тримайте однакову позу й відстань. Крик героя передавайте енергією голосу, не нахиляючись різко до телефона.
problem.4.question=У записі постійний гул
problem.4.answer=Перевірте зарядні пристрої, холодильник, вентилятор комп’ютера й опалення. Якщо джерело не можна безпечно вимкнути, змініть кімнату.
problem.5.question=Я постійно спотикаюся на одному реченні
problem.5.answer=Власний текст перепишіть у природному ритмі. В іншому разі позначте місця для вдиху й запишіть абзац коротшими частинами.
product.eyebrow=Незабаром · iOS та Android
product.title=Короткий зразок голосу. Ціла родинна бібліотека.
product.body=Sleep2Story створюється для батьків, які хочуть слухати повні казки знайомим родинним голосом, записаним за згодою. Додайте зразок голосу, який маєте право використовувати, внесіть повний текст — озвучення підготується у фоні.
product.1=Кілька збережених голосів рідних
product.2=Озвучення англійською та російською на старті
product.3=Особиста бібліотека зі збереженням позиції
product.cta=Подивитися, як працює Sleep2Story
product.screen_alt=Англомовний екран Tonight у Sleep2Story з казками та прогресом прослуховування
product.screen_caption=Поточний інтерфейс застосунку англійською
faq.eyebrow=Запитання батьків
faq.title=Що варто знати перед записом
faq.1.question=Чи потрібен зовнішній мікрофон?
faq.1.answer=Ні. Почніть із мікрофона телефона. Тиха затишна кімната й стала відстань зазвичай важливіші за нову техніку.
faq.2.question=Чи треба прибирати кожен вдих і помилку?
faq.2.answer=Приберіть помітні помилки, довгі перерви й шурхіт телефона. Невеликі паузи та вдихи залиште — вони роблять читання живим.
faq.3.question=Чи можуть записати казку бабуся або дідусь?
faq.3.answer=Так, якщо вони розуміють, як використають запис, і чітко погоджуються. Sleep2Story працює лише з голосом, на використання якого є дозвіл.
faq.4.question=Чи можна записати будь-яку дитячу книжку?
faq.4.answer=Не завжди. Книжки й аудіозаписи можуть охоронятися авторським правом. Використовуйте власний текст, твір у суспільному надбанні або матеріал із дозволом.
