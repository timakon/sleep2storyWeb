answer.label=Якщо коротко
answer.title=Візьміть свій телефон, знайдіть найтихішу кімнату з м’якими поверхнями, зробіть короткий тест і читайте трохи повільніше, ніж зазвичай.
answer.body=Не треба прибирати кожен вдих чи обмовку. Казка має звучати як голос близької людини.
