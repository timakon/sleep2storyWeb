faq.eyebrow=Fragen von Eltern
faq.title=Wissenswertes vor der Aufnahme
faq.1.question=Brauche ich ein externes Mikrofon?
faq.1.answer=Nein. Beginnen Sie mit dem eingebauten Mikrofon. Ein ruhiger, weicher Raum und ein gleichmäßiger Abstand bewirken meist mehr als neue Technik vor der ersten Aufnahme.
faq.2.question=Soll ich jeden Atemzug und Fehler entfernen?
faq.2.answer=Entfernen Sie störende Fehler, lange Unterbrechungen und deutliche Griffgeräusche. Kleine Pausen und Atemzüge dürfen bleiben — sie lassen das Vorlesen menschlich klingen.
faq.3.question=Können Großeltern die Geschichte aufnehmen?
faq.3.answer=Ja, wenn sie verstehen, wie die Aufnahme verwendet wird, und ausdrücklich zustimmen. Sleep2Story ist für Stimmen gedacht, die Ihnen gehören oder die Sie mit Erlaubnis verwenden.
faq.4.question=Darf ich jedes Kinderbuch aufnehmen?
faq.4.answer=Nicht automatisch. Bücher und Tonaufnahmen können urheberrechtlich geschützt sein. Nutzen Sie eigene Texte, gemeinfreie Werke oder Material, für dessen Aufnahme Sie eine Erlaubnis haben.
