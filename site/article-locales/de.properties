problems.kicker=Fehlerbehebung
problems.title=Verbessern Sie zuerst den Raum, dann die Datei
problem.1.question=Die Stimme klingt weit entfernt oder hohl
problem.1.answer=Gehen Sie näher an das Smartphone und wählen Sie einen weicher eingerichteten Raum. Kahle Wände, Fliesen und große leere Flächen erzeugen störende Reflexionen.
problem.2.question=p-Laute knallen in der Aufnahme
problem.2.answer=Sprechen Sie leicht seitlich am Mikrofon vorbei und vergrößern Sie den Abstand etwas. Machen Sie vor dem Weiterlesen einen kurzen Test.
problem.3.question=Die Lautstärke springt zwischen den Sätzen
problem.3.answer=Halten Sie Haltung und Abstand konstant. Wenn eine Figur ruft, geben Sie ihr Energie, ohne sich plötzlich zum Smartphone zu beugen.
problem.4.question=Ein gleichmäßiges Brummen ist zu hören
problem.4.answer=Prüfen Sie Ladegeräte, Kühlschrank, Computerlüfter und Heizung. Wechseln Sie den Raum, wenn sich die Quelle nicht sicher ausschalten lässt.
problem.5.question=Ich stolpere immer über denselben Satz
problem.5.answer=Ist es Ihr Text, formulieren Sie den Satz in Ihrem natürlichen Sprechrhythmus. Andernfalls markieren Sie Atemstellen und nehmen den Absatz in kleineren Teilen auf.
product.eyebrow=Bald verfügbar · iOS und Android
product.title=Eine kurze Stimmprobe. Viele Geschichten für die Familie.
product.body=Sleep2Story entsteht für Eltern, die vollständige Gute-Nacht-Geschichten mit einer vertrauten und ausdrücklich freigegebenen Familienstimme hören möchten. Nehmen Sie eine berechtigte Stimmprobe auf, fügen Sie den gesamten Text hinzu und lassen Sie die Erzählung im Hintergrund vorbereiten.
