answer.label=Kurz gesagt
answer.title=Nehmen Sie das Smartphone, das Sie bereits haben, wählen Sie den ruhigsten, weich eingerichteten Raum, machen Sie einen kurzen Test und lesen Sie etwas langsamer als sonst.
answer.body=Nicht jeder Atemzug und Versprecher muss verschwinden. Eine Gute-Nacht-Geschichte darf weiterhin nach einem vertrauten Menschen klingen.
