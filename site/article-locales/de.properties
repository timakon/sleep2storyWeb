setup.kicker=Bevor Sie aufnehmen
setup.title=Beginnen Sie mit dem Raum, nicht mit dem Mikrofon
setup.lead=Die größte Verbesserung bringt meist ein anderer Aufnahmeort. Ein Schlafzimmer mit Vorhängen, Bettzeug, Teppich und geschlossener Tür klingt in der Regel angenehmer als eine leere Küche oder ein Flur.
setup.body=Für die erste Aufnahme reicht das eingebaute Mikrofon Ihres Smartphones. Legen Sie es stabil etwa eine Handbreit vom Mund entfernt ab und lassen Sie das Mikrofon frei. Sprechen Sie leicht daran vorbei, damit harte p- und b-Laute keinen Luftstoß erzeugen.
kit.label=Das brauchen Sie
kit.1.title=Ihr Smartphone
kit.1.body=Geladen, Benachrichtigungen stumm, Mikrofon frei.
kit.2.title=Ein weicher Raum
kit.2.body=Fenster und Türen schließen; Vorhänge und Bettzeug dämpfen den Hall.
kit.3.title=Die Geschichte
kit.3.body=Figurenstimmen, Seitenwechsel und gewünschte Pausen markieren.
legal.label=Ein kurzer rechtlicher Hinweis:
legal.body=Wenn die Geschichte nicht von Ihnen stammt, prüfen Sie bitte, ob Sie sie aufnehmen und verwenden dürfen. Das Urheberrecht unterscheidet sich je nach Land; eine private Familienaufnahme ist nicht dasselbe wie deren Verbreitung.
steps.kicker=Die Aufnahme
steps.title=Sieben Schritte zu einer Geschichte, die nach Ihnen klingt
step.1.title=Wählen Sie eine Geschichte, die Sie gern lesen
step.1.body=Vertrautheit schafft Sicherheit. Lesen Sie den Text einmal still, markieren Sie schwierige Namen und Stellen zum Verlangsamen. Wenn die Freude fehlt, hilft auch perfekter Ton nicht.
step.2.title=Machen Sie den Raum ruhig genug
step.2.body=Schalten Sie Ventilator, Fernseher, Waschmaschine und laute Klimaanlage aus. Bitten Sie den Haushalt um zehn ruhige Minuten. Es geht um Ruhe, nicht um Laborbedingungen.
step.3.title=Legen Sie das Smartphone ab und lassen Sie es liegen
step.3.body=Eine gefaltete Decke oder ein Handtuch bietet eine stabile, weiche Unterlage. Wenn Abstand und Pegel stimmen, bewegen Sie das Gerät nicht mehr; Griffgeräusche stören stärker als ein natürlicher Atemzug.
step.4.title=Machen Sie einen 30-Sekunden-Test
step.4.body=Lesen Sie die lauteste und die leiseste Zeile und hören Sie mit Kopfhörern nach. Klingt die Stimme fern, gehen Sie näher heran. Klingt sie hart oder verzerrt, vergrößern Sie den Abstand.
step.5.title=Lesen Sie für ein Kind, nicht für ein Publikum
step.5.body=Stellen Sie sich Ihr Kind im Bett vor und sprechen Sie zu ihm. Lesen Sie etwas langsamer und lassen Sie Raum nach einem Witz, einer Überraschung oder am Seitenende. Wärme ist wichtiger als perfektes Schauspiel.
step.6.title=Pause machen, wiederholen, weiterlesen
step.6.body=Geht ein Satz schief, warten Sie zwei stille Sekunden und beginnen ihn erneut. Die ganze Geschichte muss nicht von vorn starten; die saubere Pause macht den guten Take später leicht auffindbar.
step.7.title=Vor dem Speichern einmal anhören
step.7.body=Prüfen Sie Anfang, eine laute und eine leise Passage sowie das Ende. Benennen Sie die Datei verständlich, behalten Sie das Original und speichern Sie eine Sicherung an einem Ort unter Ihrer Kontrolle.
quote.text=Es geht nicht um eine makellose Stimme, sondern um die Stimme, die Ihr Kind erkennt, wenn es im Zimmer still wird.
quote.attribution=Aufnahmeprinzip von Sleep2Story
