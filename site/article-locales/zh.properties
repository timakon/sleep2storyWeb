problems.kicker=遇到问题时
problems.title=先调整房间，再修录音文件
problem.1.question=声音听起来很远、很空
problem.1.answer=靠近手机一些，换到有柔软家具的房间。光秃的墙面、瓷砖和宽敞空荡的空间会产生反射，让声音显得遥远。
problem.2.question=以“p”开头的词有爆破声
problem.2.answer=让嘴稍微偏离麦克风正面，并拉开一点距离。继续之前，再录一小段试听。
problem.3.question=每句话的音量忽大忽小
problem.3.answer=保持姿势和距离稳定。角色喊叫时可以表现出情绪，但别突然凑到手机跟前。
problem.4.question=背景里一直有嗡嗡声
problem.4.answer=留意充电器、冰箱、电脑风扇或暖气设备。如果不能安全地关掉噪声源，就换个房间。
problem.5.question=总在同一句话卡壳
problem.5.answer=如果是你自己写的故事，可以把这句改成更符合说话习惯的表达。否则，标好换气处，把这一段分成更短的片段录。
