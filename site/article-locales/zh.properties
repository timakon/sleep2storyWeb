faq.eyebrow=家长常问
faq.title=录音前的几个问题
faq.1.question=需要外接麦克风吗？
faq.1.answer=不需要。先用手机自带的麦克风。第一次录音时，安静柔软的房间和稳定的录音距离，通常比提前购买设备更有用。
faq.2.question=需要删掉每次呼吸和口误吗？
faq.2.answer=可以删掉明显的错误、长时间的打断和碰到手机的杂音。自然的小停顿和呼吸声不妨保留，听起来才像真人在讲故事。
faq.3.question=祖父母可以录故事吗？
faq.3.answer=可以，前提是他们了解录音将如何使用，并明确表示同意。Sleep2Story 的声音流程旨在使用你自己的声音，或已获本人许可使用的声音。
faq.4.question=任何儿童读物都能录吗？
faq.4.answer=不能一概而论。书籍和录音可能受到版权保护。请使用自己的故事、已进入公有领域的作品，或已取得录制许可的材料，并核对你所在地区的规定。
