setup.kicker=按下录音键之前
setup.title=先挑房间，再考虑麦克风
setup.lead=通常，换一个录音地点比换设备更有效。有窗帘、床品和地毯、关上门的卧室，往往比空荡的厨房或走廊听起来柔和。
setup.body=第一次录音，用手机自带的麦克风就够了。把手机稳稳放在离嘴约一掌远的地方，不要挡住麦克风。说话时稍微偏离麦克风正面，避免“p”和“b”一类送气音直冲麦克风，发出爆破声。
kit.label=事先准备好
kit.1.title=手机
kit.1.body=充好电、关闭通知，确认麦克风没有被遮住。
kit.2.title=柔软安静的房间
kit.2.body=关上门窗，让窗帘和床品减轻回声。
kit.3.title=要读的故事
kit.3.body=标记角色的说话方式、翻页处，以及你想稍作停顿的地方。
legal.label=关于版权的一点提醒：
legal.body=如果故事不是你创作的，请确认自己有权录制和使用。各国版权规定不同，把录音私下留给家人听和公开传播，也不是一回事。
steps.kicker=开始录音
steps.title=七步录出仍然像你的故事
step.1.title=选一个你喜欢读的故事
step.1.body=熟悉故事会让朗读更自然。先默读一遍，圈出难念的名字，想好哪里需要放慢。如果读到第三页你自己都提不起兴趣，音质再好也难以弥补。
step.2.title=让房间足够安静
step.2.body=关掉风扇、电视、洗衣机和吵闹的空调。请家里其他人给你十分钟安静的时间。你需要的是平静，不是实验室般的绝对静音。
step.3.title=放好手机，尽量别移动
step.3.body=把手机放在折好的毛巾或其他稳定柔软的表面。确认声音大小合适后，不要一直拿在手里或挪来挪去；摩擦和碰撞声比自然的呼吸更容易让人分心。
step.4.title=先录 30 秒试听
step.4.body=读一遍故事里最大声和最轻声的句子，然后戴耳机听。声音太小就靠近一些；听起来刺耳或失真，就退远一点再试。
step.5.title=像给一个孩子讲，而不是对观众表演
step.5.body=想象孩子正躺在床上，直接对他或她说话。语速稍慢一点，让句子自然连贯；笑点、惊喜和翻页之后，留一点停顿。亲切自然比完美表演更重要。
step.6.title=停一下，重读，再继续
step.6.body=读错一句时，停两秒，再从这句开头重读。不必把整篇从头录起。这个干净的停顿，之后也方便找到更好的一遍。
step.7.title=保存前听一遍
step.7.body=检查开头、一处大声的段落、一处轻声的段落和结尾。给文件起个容易辨认的名字，保留原始录音，并在自己可控的地方存一份备份。
quote.text=目标不是毫无瑕疵的声音，而是在房间安静下来时，孩子一听就认得的声音。
quote.attribution=Sleep2Story 的录音原则
