answer.label=先说结论
answer.title=用你已有的手机，找家里最安静柔软的房间，先试听一小段，再比平时稍慢一点朗读。
answer.body=不必抹去每一次呼吸或口误。睡前故事听起来，应该仍像孩子熟悉的人在身边。
