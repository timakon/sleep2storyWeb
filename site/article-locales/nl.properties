problems.kicker=Problemen oplossen
problems.title=Verbeter eerst de kamer, daarna het bestand
problem.1.question=De stem klinkt ver weg of hol
problem.1.answer=Ga dichterbij en kies een zachter ingerichte kamer. Kale muren, tegels en lege ruimtes veroorzaken reflecties die de stem op afstand zetten.
problem.2.question=Woorden met een p ploffen
problem.2.answer=Praat iets langs de microfoon en neem wat meer afstand. Maak nog een korte test voordat je verdergaat.
problem.3.question=Het volume springt tussen zinnen
problem.3.answer=Houd houding en afstand gelijk. Geef een roepend personage energie zonder plotseling naar de telefoon te buigen.
problem.4.question=Er klinkt steeds een brom op de achtergrond
problem.4.answer=Controleer opladers, koelkast, computerventilator en verwarming. Ga naar een andere kamer als je de bron niet veilig kunt uitschakelen.
problem.5.question=Ik struikel steeds over dezelfde zin
problem.5.answer=Is de tekst van jou, herschrijf hem dan in je spreekritme. Markeer anders adempunten en neem de alinea in kleinere stukken op.
product.eyebrow=Binnenkort · iOS en Android
product.title=Een kort stemfragment. Een hele familiebibliotheek.
product.body=Sleep2Story wordt gemaakt voor ouders die volledige verhalen willen horen in een vertrouwde familiestem die met toestemming wordt gebruikt. Voeg een toegestaan stemfragment en de volledige tekst toe; de vertelling wordt op de achtergrond voorbereid.
