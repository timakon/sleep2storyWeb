faq.eyebrow=Vragen van ouders
faq.title=Wat je moet weten voor je opneemt
faq.1.question=Heb ik een externe microfoon nodig?
faq.1.answer=Nee. Begin met de microfoon van je telefoon. Een stille, zachte kamer en vaste afstand leveren meestal meer op dan nieuwe apparatuur.
faq.2.question=Moet elke ademhaling en fout eruit?
faq.2.answer=Verwijder storende fouten, lange onderbrekingen en duidelijk contactgeluid. Bewaar kleine pauzes en ademhalingen die de lezing menselijk maken.
faq.3.question=Kan een grootouder het verhaal opnemen?
faq.3.answer=Ja, als die begrijpt hoe de opname wordt gebruikt en duidelijk toestemming geeft. Sleep2Story is alleen bedoeld voor stemmen die van jou zijn of met toestemming worden gebruikt.
faq.4.question=Mag ik ieder kinderboek opnemen?
faq.4.answer=Niet automatisch. Boeken en opnames kunnen beschermd zijn. Gebruik je eigen verhaal, werk in het publieke domein of materiaal waarvoor je toestemming hebt.
