setup.kicker=Voordat je op opnemen drukt
setup.title=Begin met de kamer, niet met de microfoon
setup.lead=De grootste verbetering komt vaak van de plek. Een slaapkamer met gordijnen, beddengoed, vloerkleed en gesloten deur klinkt zachter dan een lege keuken of gang.
setup.body=De ingebouwde microfoon van je telefoon is genoeg om te beginnen. Leg hem stabiel op ongeveer een handbreedte van je mond en houd de microfoon vrij. Praat er iets langs, zodat p- en b-klanken geen harde luchtstoot geven.
kit.label=Wat je nodig hebt
kit.1.title=Je telefoon
kit.1.body=Opgeladen, meldingen stil, microfoon vrij.
kit.2.title=Een zachte kamer
kit.2.body=Sluit ramen en deuren; gordijnen en beddengoed dempen de galm.
kit.3.title=Het verhaal
kit.3.body=Markeer stemmen, omslaande pagina’s en plaatsen voor een pauze.
legal.label=Een korte juridische opmerking:
legal.body=is het verhaal niet van jou, controleer dan of je het mag opnemen en gebruiken. Auteursrecht verschilt per land; een privé-opname voor het gezin is iets anders dan verspreiding.
steps.kicker=De opname
steps.title=Zeven stappen naar een verhaal dat als jou blijft klinken
step.1.title=Kies een verhaal dat je graag leest
step.1.body=Een bekende tekst geeft rust. Lees hem eerst stil, markeer lastige namen en bepaal waar je vertraagt. Perfect geluid kan een ongeïnteresseerde stem niet redden.
step.2.title=Maak de kamer stil genoeg
step.2.body=Zet ventilator, televisie, wasmachine en luide airco uit. Vraag thuis om tien rustige minuten. Je zoekt kalmte, geen laboratoriumstilte.
step.3.title=Leg de telefoon neer en laat hem liggen
step.3.body=Gebruik een opgevouwen handdoek of andere zachte, stabiele ondergrond. Beweeg de telefoon niet meer als de afstand klopt; contactgeluid stoort meer dan een natuurlijke ademhaling.
step.4.title=Neem een test van 30 seconden op
step.4.body=Lees de luidste en zachtste zin en luister met een koptelefoon. Klinkt de stem ver weg, ga dichterbij. Klinkt hij hard of vervormd, neem meer afstand en test opnieuw.
step.5.title=Lees voor één kind, niet voor een zaal
step.5.body=Stel je kind in bed voor en spreek tot hem of haar. Lees iets langzamer en geef ruimte na een grap, verrassing of het einde van een pagina. Warmte telt meer dan perfect acteren.
step.6.title=Pauzeer, herhaal en ga verder
step.6.body=Gaat een zin mis, wacht dan twee stille seconden en begin opnieuw. Start niet het hele verhaal over; de schone pauze maakt de goede opname later makkelijk vindbaar.
step.7.title=Luister één keer voor je opslaat
step.7.body=Controleer het begin, een luide passage, een zachte passage en het einde. Geef het bestand een duidelijke naam, bewaar het origineel en maak een back-up.
quote.text=Het doel is geen vlekkeloze stem, maar de stem die je kind herkent wanneer de kamer stil wordt.
