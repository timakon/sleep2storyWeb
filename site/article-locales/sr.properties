faq.eyebrow=Pitanja roditelja
faq.title=Šta treba znati pre snimanja
faq.1.question=Da li mi treba spoljni mikrofon?
faq.1.answer=Ne. Počnite mikrofonom telefona. Tiha, meka prostorija i stalna udaljenost obično znače više od kupovine opreme.
faq.2.question=Da li treba ukloniti svaki udah i grešku?
faq.2.answer=Uklonite greške koje odvlače pažnju, duge prekide i šum dodira. Sačuvajte male pauze i udaha zbog kojih čitanje zvuči ljudski.
faq.3.question=Mogu li baka ili deka da snime priču?
faq.3.answer=Da, ako razumeju kako će se snimak koristiti i jasno pristanu. Sleep2Story koristi samo glas koji je vaš ili za koji imate dozvolu.
faq.4.question=Mogu li snimiti bilo koju dečju knjigu?
faq.4.answer=Ne uvek. Knjige i snimci mogu biti zaštićeni. Koristite svoju priču, delo u javnom domenu ili materijal za koji imate dozvolu.
