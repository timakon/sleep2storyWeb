setup.kicker=Pre nego što uključite snimanje
setup.title=Počnite od prostorije, ne od mikrofona
setup.lead=Najveće poboljšanje obično donosi promena mesta. Spavaća soba sa zavesama, posteljinom, tepihom i zatvorenim vratima zvučaće nežnije od prazne kuhinje ili hodnika.
setup.body=Za prvi snimak dovoljan je mikrofon telefona. Postavite ga stabilno, otprilike jedan dlan od usta, i ne prekrivajte mikrofon. Govorite malo ukoso da glasovi p i b ne šalju jak vazduh pravo u njega.
kit.label=Šta pripremiti
kit.1.title=Telefon
kit.1.body=Napunjen telefon, obaveštenja utišana, mikrofon slobodan.
kit.2.title=Meka prostorija
kit.2.body=Zatvorite vrata i prozore; zavese i posteljina ublažiće odjek.
kit.3.title=Priča
kit.3.body=Označite glasove likova, okretanje stranica i mesta za pauzu.
legal.label=Kratka pravna napomena:
legal.body=ako priča nije vaša, proverite da li smete da je snimite i koristite. Autorska prava se razlikuju, a privatni porodični snimak nije isto što i objavljivanje.
steps.kicker=Snimanje
steps.title=Sedam koraka do priče koja i dalje zvuči kao vi
step.1.title=Izaberite priču koju volite da čitate
step.1.body=Poznat tekst daje sigurnost. Pročitajte ga u sebi, označite teška imena i mesta gde želite da usporite. Savršen zvuk ne može sakriti dosadu u glasu.
step.2.title=Utišajte prostoriju dovoljno
step.2.body=Isključite ventilator, televizor, veš-mašinu i bučnu klimu. Zamolite ukućane za deset mirnih minuta. Cilj je spokoj, ne laboratorijska tišina.
step.3.title=Spustite telefon i ne pomerajte ga
step.3.body=Stavite ga na presavijen peškir ili drugu meku, stabilnu podlogu. Kada nađete dobru udaljenost, ne držite ga u ruci: šum dodira smeta više od prirodnog daha.
step.4.title=Snimite probnih 30 sekundi
step.4.body=Pročitajte najglasniji i najtiši deo, pa poslušajte sa slušalicama. Glas je daleko — približite se. Zvuk je grub ili izobličen — odmaknite se i ponovite.
step.5.title=Čitajte jednom detetu, ne publici
step.5.body=Zamislite dete u krevetu i govorite njemu. Malo usporite i ostavite prostor posle šale, iznenađenja ili kraja stranice. Toplina je važnija od savršene glume.
step.6.title=Stanite, ponovite i nastavite
step.6.body=Ako rečenica ne uspe, sačekajte dve tihe sekunde i počnite je ponovo. Ne vraćajte celu priču na početak; čista pauza olakšaće pronalaženje boljeg pokušaja.
step.7.title=Poslušajte pre čuvanja
step.7.body=Proverite početak, jedan glasan i jedan tih deo i završetak. Dajte fajlu jasno ime, sačuvajte original i napravite rezervnu kopiju.
quote.text=Cilj nije besprekoran glas, već glas koji dete prepoznaje kada soba utihne.
quote.attribution=Princip snimanja Sleep2Story
