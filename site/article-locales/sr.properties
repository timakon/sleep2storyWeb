problems.kicker=Rešavanje problema
problems.title=Prvo popravite prostoriju, pa onda fajl
problem.1.question=Glas zvuči daleko ili šuplje
problem.1.answer=Približite se i izaberite prostoriju sa više mekih površina. Goli zidovi, pločice i prazan prostor stvaraju odjek.
problem.2.question=Reči na „p“ pucaju
problem.2.answer=Okrenite usta malo u stranu od mikrofona i povećajte udaljenost. Uradite još jedan kratak test.
problem.3.question=Jačina skače između rečenica
problem.3.answer=Držite isti položaj i udaljenost. Kada lik viče, unesite energiju u glas bez naglog naginjanja ka telefonu.
problem.4.question=U pozadini se stalno čuje brujanje
problem.4.answer=Proverite punjače, frižider, ventilator računara i grejanje. Promenite prostoriju ako izvor ne možete bezbedno da isključite.
problem.5.question=Stalno zastajem na istoj rečenici
problem.5.answer=Ako je tekst vaš, prilagodite ga prirodnom govoru. U suprotnom označite udaha i snimite pasus iz manjih delova.
