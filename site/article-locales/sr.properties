answer.label=Ukratko
answer.title=Upotrebite telefon koji već imate, izaberite najtišu prostoriju sa mekim površinama, napravite kratak test i čitajte malo sporije nego obično.
answer.body=Ne morate ukloniti svaki udah ili zastajkivanje. Priča treba i dalje da zvuči kao neko koga dete poznaje.
