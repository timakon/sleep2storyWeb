setup.kicker=Înainte să pornești înregistrarea
setup.title=Începe cu încăperea, nu cu microfonul
setup.lead=Cea mai mare îmbunătățire vine adesea din schimbarea locului. Un dormitor cu perdele, lenjerie, covor și ușă închisă va suna mai blând decât o bucătărie goală sau un hol.
setup.body=Microfonul telefonului este suficient pentru început. Așază-l stabil, la aproximativ o palmă de gură, fără să acoperi microfonul. Vorbește puțin pe lângă el, astfel încât sunetele p și b să nu producă rafale de aer.
kit.label=Ce să pregătești
kit.1.title=Telefonul
kit.1.body=Încărcat, notificări oprite, microfon liber.
kit.2.title=O cameră primitoare
kit.2.body=Închide ușile și ferestrele; perdelele și lenjeria reduc ecoul.
kit.3.title=Povestea
kit.3.body=Marchează vocile, întoarcerea paginilor și locurile pentru pauze.
legal.label=O scurtă precizare juridică:
legal.body=dacă povestea nu este a ta, verifică dacă ai voie să o înregistrezi și să o folosești. Drepturile de autor diferă, iar o înregistrare privată de familie nu este același lucru cu distribuirea ei.
steps.kicker=Înregistrarea
steps.title=Șapte pași pentru o poveste care sună în continuare ca tine
step.1.title=Alege o poveste pe care îți place să o citești
step.1.body=Un text cunoscut aduce siguranță. Citește-l întâi în gând, marchează numele dificile și locurile unde vrei să încetinești. Un sunet perfect nu ascunde lipsa de entuziasm.
step.2.title=Fă încăperea suficient de liniștită
step.2.body=Oprește ventilatorul, televizorul, mașina de spălat și aerul condiționat zgomotos. Cere zece minute de liniște. Ai nevoie de calm, nu de tăcere de laborator.
step.3.title=Așază telefonul și nu-l mai mișca
step.3.body=Pune-l pe un prosop împăturit sau pe altă suprafață moale și stabilă. Când distanța este bună, nu-l ține în mână: zgomotele de atingere deranjează mai mult decât respirația.
step.4.title=Înregistrează un test de 30 de secunde
step.4.body=Citește fraza cea mai tare și cea mai șoptită, apoi ascultă în căști. Vocea pare departe? Apropie-te. Sună aspru sau distorsionat? Îndepărtează-te și repetă.
step.5.title=Citește pentru un copil, nu pentru public
step.5.body=Imaginează-ți copilul în pat și vorbește-i lui. Încetinește puțin și lasă spațiu după o glumă, o surpriză sau la sfârșitul paginii. Căldura contează mai mult decât interpretarea perfectă.
step.6.title=Oprește-te, repetă și continuă
step.6.body=Dacă o frază nu iese, păstrează două secunde de liniște și reia-o. Nu porni toată povestea de la început; pauza curată va face varianta bună ușor de găsit.
step.7.title=Ascultă o dată înainte să salvezi
step.7.body=Verifică începutul, un fragment tare, unul încet și finalul. Dă fișierului un nume clar, păstrează originalul și fă o copie de siguranță.
quote.text=Scopul nu este o voce fără cusur, ci vocea pe care copilul o recunoaște atunci când camera devine liniștită.
quote.attribution=Principiul de înregistrare Sleep2Story
