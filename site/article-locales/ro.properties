answer.label=Pe scurt
answer.title=Folosește telefonul pe care îl ai, alege cea mai liniștită cameră cu suprafețe moi, fă un test scurt și citește puțin mai rar decât de obicei.
answer.body=Nu trebuie să ștergi fiecare respirație sau poticnire. Povestea ar trebui să sune în continuare ca o persoană dragă copilului.
