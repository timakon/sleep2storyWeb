faq.eyebrow=Întrebările părinților
faq.title=Ce trebuie să știi înainte să înregistrezi
faq.1.question=Am nevoie de un microfon extern?
faq.1.answer=Nu. Începe cu microfonul telefonului. O cameră liniștită și moale și o distanță constantă ajută de obicei mai mult decât echipamentul nou.
faq.2.question=Trebuie să elimin fiecare respirație și greșeală?
faq.2.answer=Elimină greșelile care distrag, întreruperile lungi și zgomotele de atingere. Păstrează pauzele mici și respirațiile care fac lectura umană.
faq.3.question=Poate un bunic să înregistreze povestea?
faq.3.answer=Da, dacă înțelege cum va fi folosită și își dă acordul clar. Sleep2Story este destinat doar vocilor proprii sau folosite cu permisiune.
faq.4.question=Pot înregistra orice carte pentru copii?
faq.4.answer=Nu întotdeauna. Cărțile și înregistrările pot fi protejate. Folosește povestea ta, o operă din domeniul public sau material pentru care ai permisiune.
