product.title=O mostră scurtă de voce. O bibliotecă întreagă de familie.
product.body=Sleep2Story este creat pentru părinții care vor povești complete într-o voce familiară, folosită cu acord. Adaugă o mostră pe care ai dreptul să o folosești, introdu textul complet și lasă narațiunea să se pregătească în fundal.
