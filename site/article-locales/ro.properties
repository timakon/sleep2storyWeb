problems.kicker=Depanare
problems.title=Corectează întâi camera, apoi fișierul
problem.1.question=Vocea sună departe sau goală
problem.1.answer=Apropie-te și alege o cameră cu mai multe suprafețe moi. Pereții goi, gresia și spațiile libere creează reflexii care îndepărtează vocea.
problem.2.question=Cuvintele cu „p” pocnesc
problem.2.answer=Întoarce gura puțin în lateral față de microfon și mărește distanța. Fă încă un test scurt înainte să continui.
problem.3.question=Volumul sare între fraze
problem.3.answer=Păstrează aceeași poziție și distanță. Când un personaj strigă, dă energie vocii fără să te apleci brusc spre telefon.
problem.4.question=Se aude constant un bâzâit
problem.4.answer=Verifică încărcătoarele, frigiderul, ventilatorul computerului și încălzirea. Schimbă încăperea dacă sursa nu poate fi oprită în siguranță.
problem.5.question=Mă poticnesc mereu la aceeași frază
problem.5.answer=Dacă textul este al tău, adaptează-l ritmului natural al vorbirii. Altfel, marchează respirațiile și înregistrează paragraful în bucăți mai mici.
