product.title=Un breve campione vocale. Un’intera biblioteca di famiglia.
product.body=Sleep2Story nasce per chi desidera storie complete narrate da una voce familiare usata con consenso. Aggiungi un campione che hai il diritto di usare, inserisci il testo completo e lascia preparare la narrazione in sottofondo.
