setup.kicker=Prima di registrare
setup.title=Parti dalla stanza, non dal microfono
setup.lead=Il miglioramento più grande arriva spesso dal luogo. Una camera con tende, biancheria, tappeto e porta chiusa suonerà più morbida di una cucina vuota o di un corridoio.
setup.body=Per iniziare basta il microfono del telefono. Appoggialo stabilmente a circa un palmo dalla bocca, senza coprirlo. Parla leggermente di lato per evitare che le consonanti p e b colpiscano il microfono con un soffio.
kit.label=Cosa preparare
kit.1.title=Il telefono
kit.1.body=Carico, notifiche disattivate, microfono libero.
kit.2.title=Una stanza morbida
kit.2.body=Chiudi porte e finestre; tende e letto attenueranno l’eco.
kit.3.title=La storia
kit.3.body=Segna voci, cambi di pagina e punti in cui vuoi fare una pausa.
legal.label=Una breve nota legale:
legal.body=se la storia non è tua, verifica di poterla registrare e utilizzare. Il diritto d’autore varia da paese a paese; una registrazione privata non equivale alla sua distribuzione.
steps.kicker=La registrazione
steps.title=Sette passaggi per una storia che suoni ancora come te
step.1.title=Scegli una storia che ami leggere
step.1.body=Conoscere il testo aiuta. Leggilo prima in silenzio, segna i nomi difficili e i punti in cui rallentare. Un audio perfetto non salva una lettura annoiata.
step.2.title=Rendi la stanza abbastanza silenziosa
step.2.body=Spegni ventilatore, televisore, lavatrice e condizionatore rumoroso. Chiedi dieci minuti di calma in casa. Cerchi tranquillità, non un laboratorio.
step.3.title=Appoggia il telefono e lascialo fermo
step.3.body=Mettilo su un asciugamano piegato o un’altra superficie morbida e stabile. Quando la distanza è giusta, non tenerlo in mano: i rumori di contatto distraggono più del respiro.
step.4.title=Registra una prova di 30 secondi
step.4.body=Leggi la frase più forte e quella più piano, poi ascolta in cuffia. La voce è lontana? Avvicinati. È aspra o distorta? Allontanati e riprova.
step.5.title=Leggi per un bambino, non per un pubblico
step.5.body=Immagina tuo figlio a letto e parla proprio a lui. Rallenta appena e lascia spazio dopo una battuta, una sorpresa o a fine pagina. Il calore conta più della recitazione perfetta.
step.6.title=Fermati, ripeti e continua
step.6.body=Se una frase non riesce, resta in silenzio due secondi e ricomincia. Non ripartire dall’inizio: la pausa pulita renderà facile trovare la versione migliore.
step.7.title=Ascolta una volta prima di salvare
step.7.body=Controlla l’inizio, un passaggio forte, uno dolce e la fine. Dai al file un nome chiaro, conserva l’originale e crea una copia di sicurezza.
quote.text=L’obiettivo non è una voce perfetta, ma la voce che il bambino riconosce quando la stanza diventa silenziosa.
