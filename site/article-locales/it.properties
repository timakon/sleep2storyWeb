problems.kicker=Risoluzione dei problemi
problems.title=Correggi prima la stanza, poi il file
problem.1.question=La voce sembra lontana o vuota
problem.1.answer=Avvicinati e scegli una stanza più morbida. Pareti nude, piastrelle e spazi vuoti creano riflessi che allontanano la voce.
problem.2.question=Le parole con la «p» scoppiano
problem.2.answer=Parla leggermente di lato rispetto al microfono e aumenta un po’ la distanza. Fai un’altra breve prova prima di continuare.
problem.3.question=Il volume cambia tra le frasi
problem.3.answer=Mantieni postura e distanza costanti. Se un personaggio urla, usa più energia senza avvicinarti all’improvviso al telefono.
problem.4.question=C’è un ronzio continuo
problem.4.answer=Controlla caricabatterie, frigorifero, ventole del computer e riscaldamento. Cambia stanza se non puoi spegnere la fonte in sicurezza.
problem.5.question=Inciampo sempre sulla stessa frase
problem.5.answer=Se il testo è tuo, riscrivila nel tuo ritmo parlato. Altrimenti segna i respiri e registra il paragrafo in parti più brevi.
