answer.label=In breve
answer.title=Usa il telefono che hai già, scegli la stanza più tranquilla e morbida, fai una breve prova e leggi un po’ più lentamente del solito.
answer.body=Non serve eliminare ogni respiro o esitazione. La storia deve continuare a sembrare raccontata da una persona cara.
