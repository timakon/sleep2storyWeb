faq.eyebrow=Domande dei genitori
faq.title=Cosa sapere prima di registrare
faq.1.question=Serve un microfono esterno?
faq.1.answer=No. Inizia dal microfono del telefono. Una stanza tranquilla e morbida e una distanza costante aiutano più dell’acquisto di attrezzatura.
faq.2.question=Devo eliminare ogni respiro ed errore?
faq.2.answer=Rimuovi gli errori che distraggono, le lunghe interruzioni e i rumori di contatto. Conserva le piccole pause e i respiri che rendono umana la lettura.
faq.3.question=Può registrare la storia un nonno?
faq.3.answer=Sì, se comprende come verrà usata e dà un consenso chiaro. Sleep2Story è pensato per voci proprie o utilizzate con autorizzazione.
faq.4.question=Posso registrare qualsiasi libro per bambini?
faq.4.answer=Non sempre. Libri e registrazioni possono essere protetti. Usa una storia tua, un’opera di pubblico dominio o materiale che hai il permesso di registrare.
