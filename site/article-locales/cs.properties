problems.kicker=Řešení problémů
problems.title=Nejdřív opravte místnost, potom soubor
problem.1.question=Hlas zní vzdáleně nebo dutě
problem.1.answer=Přibližte se a vyberte místnost s měkčími povrchy. Holé stěny, dlaždice a prázdný prostor vytvářejí odrazy.
problem.2.question=Slova s „p“ praskají
problem.2.answer=Natočte ústa lehce vedle mikrofonu a přidejte odstup. Před pokračováním udělejte další krátký test.
problem.3.question=Hlasitost mezi větami skáče
problem.3.answer=Udržujte stejnou polohu a vzdálenost. Křičící postavě dejte energii, ale nenaklánějte se náhle k telefonu.
problem.4.question=V pozadí je stálé hučení
problem.4.answer=Zkontrolujte nabíječky, lednici, ventilátor počítače a topení. Pokud zdroj nelze bezpečně vypnout, změňte místnost.
problem.5.question=Pořád se zadrhávám u stejné věty
problem.5.answer=Vlastní text upravte do přirozeného rytmu řeči. Jinak označte místa nádechu a nahrajte odstavec po kratších částech.
