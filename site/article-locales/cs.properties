setup.kicker=Než spustíte nahrávání
setup.title=Začněte místností, ne mikrofonem
setup.lead=Největší zlepšení obvykle přinese jiné místo. Ložnice se závěsy, lůžkovinami, kobercem a zavřenými dveřmi zní jemněji než prázdná kuchyň nebo chodba.
setup.body=Pro první nahrávku stačí mikrofon telefonu. Položte ho stabilně asi dlaň od úst a mikrofon nezakrývejte. Mluvte lehce vedle něj, aby hlásky p a b nevytvářely prudký závan.
kit.label=Co připravit
kit.1.title=Telefon
kit.1.body=Nabitý, oznámení ztišená, mikrofon volný.
kit.2.title=Měkká místnost
kit.2.body=Zavřete okna a dveře; závěsy a lůžkoviny ztlumí ozvěnu.
kit.3.title=Pohádka
kit.3.body=Označte hlasy postav, otáčení stránek a místa pro pauzu.
legal.label=Krátká právní poznámka:
legal.body=pokud příběh není váš, ověřte si právo jej nahrát a použít. Autorské právo se liší podle země a soukromá rodinná nahrávka není totéž co její šíření.
steps.kicker=Nahrávání
steps.title=Sedm kroků k pohádce, která pořád zní jako vy
step.1.title=Vyberte pohádku, kterou rádi čtete
step.1.body=Známý text dodá jistotu. Nejprve si ho přečtěte potichu, označte složitá jména a místa ke zpomalení. Dokonalý zvuk nezachrání nezájem v hlase.
step.2.title=Ztište místnost dostatečně
step.2.body=Vypněte ventilátor, televizi, pračku a hlučnou klimatizaci. Požádejte domácnost o deset klidných minut. Cílem je pohoda, ne laboratorní ticho.
step.3.title=Položte telefon a nehýbejte s ním
step.3.body=Dejte ho na složený ručník nebo jiný měkký, stabilní povrch. Když vzdálenost vyhovuje, nedržte ho v ruce; dotykové ruchy vadí víc než přirozený dech.
step.4.title=Nahrajte 30sekundovou zkoušku
step.4.body=Přečtěte nejhlasitější a nejtišší větu a poslechněte si je ve sluchátkách. Hlas je daleko? Přibližte se. Je tvrdý nebo zkreslený? Ustupte a test zopakujte.
step.5.title=Čtěte jednomu dítěti, ne publiku
step.5.body=Představte si dítě v posteli a mluvte k němu. Trochu zpomalte a nechte prostor po vtipu, překvapení či konci stránky. Vřelost je důležitější než dokonalé herectví.
step.6.title=Zastavte se, zopakujte a pokračujte
step.6.body=Když se věta nepovede, nechte dvě sekundy ticha a začněte znovu. Nevracejte se na začátek; čistá pauza pomůže později najít lepší pokus.
step.7.title=Před uložením si nahrávku poslechněte
step.7.body=Zkontrolujte začátek, hlasitou a tichou pasáž i konec. Dejte souboru jasný název, uchovejte originál a vytvořte zálohu.
quote.text=Cílem není bezchybný hlas, ale hlas, který dítě pozná, když pokoj ztichne.
quote.attribution=Princip nahrávání Sleep2Story
