answer.label=Stručně
answer.title=Použijte telefon, který už máte, vyberte nejtišší místnost s měkkými povrchy, udělejte krátký test a čtěte o něco pomaleji než obvykle.
answer.body=Není třeba odstranit každý nádech nebo přeřeknutí. Pohádka má stále znít jako někdo, koho dítě zná.
