faq.eyebrow=Otázky rodičů
faq.title=Co vědět před nahráváním
faq.1.question=Potřebuji externí mikrofon?
faq.1.answer=Ne. Začněte mikrofonem telefonu. Tichá, měkká místnost a stálá vzdálenost obvykle pomohou víc než nákup vybavení.
faq.2.question=Mám odstranit každý nádech a chybu?
faq.2.answer=Odstraňte rušivé chyby, dlouhé přestávky a dotykové ruchy. Malé pauzy a dechy, díky nimž čtení zní lidsky, nechte.
faq.3.question=Může pohádku nahrát prarodič?
faq.3.answer=Ano, pokud rozumí použití nahrávky a jasně souhlasí. Sleep2Story je určen jen pro vlastní hlasy nebo hlasy použité se svolením.
faq.4.question=Mohu nahrát jakoukoli dětskou knihu?
faq.4.answer=Ne vždy. Knihy a nahrávky mohou být chráněné. Použijte vlastní příběh, volné dílo nebo materiál, který smíte nahrát.
