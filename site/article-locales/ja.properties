setup.kicker=録音ボタンを押す前に
setup.title=マイクより先に、部屋を選ぶ
setup.lead=録音場所を変えるだけで、音が大きく改善することがあります。カーテンや寝具、ラグがあり、ドアを閉められる寝室は、何もないキッチンや廊下より声が柔らかく聞こえやすいものです。
setup.body=最初の録音なら、スマホの内蔵マイクで十分です。マイクをふさがず、口から手のひらひとつ分ほど離れた安定した場所に置きます。「パ」「バ」などの音で息が直接当たらないよう、マイクの真正面ではなく少し横を向いて話しましょう。
kit.label=用意するもの
kit.1.title=スマホ
kit.1.body=充電して、通知を消し、マイクをふさがないようにします。
kit.2.title=音が響きにくい部屋
kit.2.body=窓とドアを閉め、カーテンや寝具で反響を和らげます。
kit.3.title=読む物語
kit.3.body=登場人物の声、ページをめくる場所、間を置きたい場所に印をつけます。
legal.label=権利についてひとこと：
legal.body=自作ではない物語を録る場合は、録音や利用の許可があるか確認してください。著作権のルールは国によって異なり、家族だけで聴くことと録音を配布することは同じではありません。
steps.kicker=いよいよ録音
steps.title=いつもの声を残す7つの手順
step.1.title=自分が読んで楽しい物語を選ぶ
step.1.body=読み慣れていると自然に話せます。一度目で読み、難しい名前に丸をつけ、どこでゆっくり読むか決めましょう。途中で退屈そうな声になってしまうなら、音質を上げても伝わりにくいものです。
step.2.title=部屋を十分静かにする
step.2.body=扇風機、テレビ、洗濯機、音の大きいエアコンを止めます。家族にも10分ほど静かにしてもらいましょう。目指すのは落ち着いた環境で、実験室のような無音ではありません。
step.3.title=スマホを置いたら動かさない
step.3.body=折りたたんだタオルなど、安定していて柔らかい場所にスマホを置きます。音量がちょうどよければ、手に持ったり動かしたりしないこと。触れる音は自然な呼吸より気になりやすいからです。
step.4.title=30秒の試し録りをする
step.4.body=いちばん大きな声の一節と、いちばん静かな一節を読み、イヤホンで聴いてみます。声が小さければ近づけ、きつく歪んで聞こえるなら離してもう一度試しましょう。
step.5.title=大勢ではなく、わが子に向けて読む
step.5.body=ベッドにいる子どもを思い浮かべて話しましょう。少しゆっくり読みつつ、文の流れは途切れさせず、冗談や驚き、ページの終わりには間を置きます。完璧な演技より自然な温かさが大切です。
step.6.title=間を置き、言い直し、続ける
step.6.body=読み間違えたら、2秒ほど静かに止まり、その文の最初から読み直します。物語全体を最初から録り直す必要はありません。はっきりした間があれば、後から良いほうの音声を見つけやすくなります。
step.7.title=保存前に一度聴く
step.7.body=冒頭、大きな声の箇所、静かな箇所、結末を確認します。分かりやすいファイル名をつけ、元データを残し、自分で管理できる場所にもバックアップを保存しましょう。
quote.text=目指すのは完璧な声ではありません。部屋が静かになったとき、子どもが「あの人の声だ」と分かることです。
quote.attribution=Sleep2Story の録音の考え方
checklist.kicker=通して録る前に
checklist.title=1分で確認できる録音チェックリスト
checklist.1=スマホは充電済み、または電源につないでいる
checklist.2=おやすみモードか機内モードをオンにした
checklist.3=ドアと窓を閉めた
checklist.4=扇風機とテレビを消した
checklist.5=マイクの穴をふさいでいない
checklist.6=手元に水を用意した
checklist.7=30秒の試し録りを再生して確認した
checklist.8=物語のタイトルと利用する権利を確認した
problems.kicker=困ったときは
problems.title=ファイルを直す前に、部屋を見直す
problem.1.question=声が遠く、こもって聞こえる
problem.1.answer=スマホに少し近づき、音が響きにくい部屋を選びます。むき出しの壁、タイル、広くて物の少ない空間では音が反射し、声が遠く感じられます。
problem.2.question=「パ」行の音が破裂したように聞こえる
problem.2.answer=口をマイクから少し横へ向け、距離を少し取ります。続ける前に短く試し録りをしましょう。
problem.3.question=行によって音量が大きく変わる
problem.3.answer=姿勢とマイクまでの距離を一定に保ちます。登場人物が叫ぶ場面でも、勢いは声で表し、急にスマホへ顔を近づけないようにします。
problem.4.question=ずっと低い雑音が入る
problem.4.answer=充電器、冷蔵庫、パソコンのファンや暖房が原因かもしれません。安全に止められない場合は、別の部屋で録りましょう。
problem.5.question=同じ文で何度もつかえてしまう
problem.5.answer=自分が書いた文章なら、話しやすい言い回しに直してみましょう。そうでなければ、息継ぎする場所に印をつけ、段落を短く区切って録ります。
