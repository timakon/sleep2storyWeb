answer.label=先に答えを知りたい方へ
answer.title=手元のスマホを使い、家でいちばん音が響きにくい部屋を選び、短く試し録りをして、普段より少しゆっくり読みましょう。
answer.body=息づかいや言い直しをすべて消す必要はありません。子どもが知っている人の声らしさが、寝る前の物語には大切です。
