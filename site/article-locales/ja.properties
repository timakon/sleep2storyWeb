faq.eyebrow=保護者からの質問
faq.title=録音前に知っておきたいこと
faq.1.question=外付けマイクは必要ですか？
faq.1.answer=いいえ。まずはスマホの内蔵マイクで始めましょう。最初の録音のために機材を買うより、静かで音が響きにくい部屋と、一定の距離を保つことのほうが役立つ場合が多いです。
faq.2.question=息づかいや間違いはすべて消すべきですか？
faq.2.answer=気になる読み間違い、長い中断、明らかな接触音は取り除きましょう。人が読んでいると感じられる小さな間や息づかいは残して大丈夫です。
faq.3.question=祖父母が物語を録音してもいいですか？
faq.3.answer=はい。録音がどう使われるかを理解し、はっきり同意していることが前提です。Sleep2Story は、自分の声か、使用許可を得た声を使うよう設計されています。
faq.4.question=どんな児童書でも録音できますか？
faq.4.answer=必ずしもそうではありません。本や録音物は著作権で保護される場合があります。自作の物語、著作権の保護期間が満了した作品、録音の許可を得た素材を使い、お住まいの地域に適用されるルールを確認してください。
