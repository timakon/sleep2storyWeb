problems.kicker=Rozwiązywanie problemów
problems.title=Najpierw popraw pokój, później plik
problem.1.question=Głos brzmi daleko lub pusto
problem.1.answer=Przysuń się i wybierz bardziej miękko urządzony pokój. Gołe ściany, płytki i pusta przestrzeń tworzą odbicia, które oddalają głos.
problem.2.question=Głoska „p” mocno uderza
problem.2.answer=Skieruj usta lekko obok mikrofonu i zwiększ odległość. Przed dalszym czytaniem zrób kolejny krótki test.
problem.3.question=Głośność skacze między zdaniami
problem.3.answer=Utrzymuj tę samą pozycję i odległość. Gdy postać krzyczy, dodaj energii głosem, ale nie pochylaj się nagle nad telefonem.
problem.4.question=W tle słychać stałe buczenie
problem.4.answer=Sprawdź ładowarki, lodówkę, wentylator komputera i ogrzewanie. Jeśli źródła nie da się bezpiecznie wyłączyć, zmień pokój.
problem.5.question=Ciągle potykam się na tym samym zdaniu
problem.5.answer=Własny tekst przeredaguj pod naturalny rytm mowy. W innym zaznacz miejsca oddechu i nagraj akapit krótszymi fragmentami.
product.eyebrow=Wkrótce · iOS i Android
product.title=Krótka próbka głosu. Cała rodzinna biblioteka.
product.body=Sleep2Story powstaje dla rodziców, którzy chcą słuchać pełnych bajek znajomym rodzinnym głosem, użytym za zgodą. Dodaj próbkę głosu, do którego masz prawo, wklej cały tekst, a narracja przygotuje się w tle.
