faq.eyebrow=Pytania rodziców
faq.title=Co warto wiedzieć przed nagraniem
faq.1.question=Czy potrzebuję zewnętrznego mikrofonu?
faq.1.answer=Nie. Zacznij od mikrofonu telefonu. Cichy, miękki pokój i stała odległość zwykle dadzą więcej niż zakup sprzętu przed pierwszym nagraniem.
faq.2.question=Czy usuwać każdy oddech i błąd?
faq.2.answer=Usuń wyraźne pomyłki, długie przerwy i odgłosy dotykania telefonu. Zostaw krótkie pauzy i oddechy, dzięki którym czytanie brzmi po ludzku.
faq.3.question=Czy bajkę mogą nagrać dziadkowie?
faq.3.answer=Tak, jeśli wiedzą, jak nagranie będzie używane, i jasno się zgadzają. Sleep2Story działa tylko z głosem, który należy do Ciebie lub jest używany za zgodą.
faq.4.question=Czy mogę nagrać każdą książkę dla dzieci?
faq.4.answer=Nie zawsze. Książki i nagrania mogą być chronione prawem autorskim. Użyj własnej historii, utworu z domeny publicznej albo materiału, na którego nagranie masz zgodę.
