answer.label=W skrócie
answer.title=Użyj telefonu, który już masz, wybierz najcichszy pokój z miękkimi powierzchniami, zrób krótki test i czytaj nieco wolniej niż zwykle.
answer.body=Nie usuwaj każdego oddechu ani potknięcia. Bajka powinna nadal brzmieć jak ktoś bliski dziecku.
