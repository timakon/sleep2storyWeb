setup.kicker=Zanim włączysz nagrywanie
setup.title=Zacznij od pokoju, nie od mikrofonu
setup.lead=Największą poprawę zwykle daje zmiana miejsca. Sypialnia z zasłonami, pościelą, dywanem i zamkniętymi drzwiami zabrzmi łagodniej niż pusta kuchnia lub korytarz.
setup.body=Na pierwsze nagranie wystarczy mikrofon telefonu. Połóż urządzenie stabilnie, mniej więcej na szerokość dłoni od ust, i nie zasłaniaj mikrofonu. Mów lekko obok niego, aby głoski p i b nie powodowały podmuchów.
kit.label=Co przygotować
kit.1.title=Telefon
kit.1.body=Naładowany, powiadomienia wyciszone, mikrofon odsłonięty.
kit.2.title=Przytulny pokój
kit.2.body=Zamknij okna i drzwi; zasłony oraz pościel wytłumią echo.
kit.3.title=Tekst bajki
kit.3.body=Zaznacz głosy postaci, przewracanie stron i miejsca na pauzę.
legal.label=Krótka uwaga prawna:
legal.body=jeżeli historia nie jest Twoja, sprawdź prawo do jej nagrania i użycia. Przepisy różnią się między krajami, a prywatne rodzinne nagranie nie jest tym samym co rozpowszechnianie.
steps.kicker=Nagranie
steps.title=Siedem kroków do bajki, która nadal brzmi jak Ty
step.1.title=Wybierz bajkę, którą lubisz czytać
step.1.body=Znajomy tekst daje swobodę. Przeczytaj go po cichu, zaznacz trudne imiona i miejsca, w których chcesz zwolnić. Nudy w głosie nie naprawi nawet idealny dźwięk.
step.2.title=Wycisz pokój wystarczająco
step.2.body=Wyłącz wentylator, telewizor, pralkę i głośną klimatyzację. Poproś domowników o dziesięć spokojnych minut. Potrzebujesz ciszy, nie warunków laboratoryjnych.
step.3.title=Połóż telefon i już go nie ruszaj
step.3.body=Ułóż go na złożonym ręczniku lub innej miękkiej, stabilnej powierzchni. Gdy odległość jest dobra, nie trzymaj urządzenia w dłoni — szelest przeszkadza bardziej niż naturalny oddech.
step.4.title=Nagraj 30-sekundową próbkę
step.4.body=Przeczytaj najgłośniejszy i najcichszy fragment, a potem posłuchaj w słuchawkach. Głos jest daleko — przysuń się. Brzmi ostro lub przesterowuje — odsuń się i sprawdź ponownie.
step.5.title=Czytaj jednemu dziecku, nie publiczności
step.5.body=Wyobraź sobie dziecko w łóżku i mów właśnie do niego. Zwolnij odrobinę, zostaw miejsce po żarcie, niespodziance i na końcu strony. Ciepło jest ważniejsze od perfekcyjnej gry.
step.6.title=Zatrzymaj się, powtórz i czytaj dalej
step.6.body=Gdy zdanie nie wyjdzie, odczekaj dwie ciche sekundy i zacznij je ponownie. Nie wracaj do początku bajki; czysta pauza ułatwi później znalezienie dobrego ujęcia.
step.7.title=Posłuchaj przed zapisaniem
step.7.body=Sprawdź początek, głośny i cichy fragment oraz zakończenie. Nazwij plik jasno, zachowaj oryginał i zrób kopię zapasową w miejscu, które kontrolujesz.
quote.text=Celem nie jest nieskazitelny głos, lecz głos, który dziecko rozpoznaje, gdy w pokoju robi się cicho.
quote.attribution=Zasada nagrywania Sleep2Story
