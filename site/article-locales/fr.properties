faq.eyebrow=Questions de parents
faq.title=À savoir avant d’enregistrer
faq.1.question=Faut-il un micro externe ?
faq.1.answer=Non. Commencez avec le micro du téléphone. Une pièce calme et feutrée, ainsi qu’une distance régulière, feront généralement plus qu’un achat de matériel.
faq.2.question=Faut-il retirer chaque souffle et chaque erreur ?
faq.2.answer=Retirez les erreurs gênantes, les longues interruptions et les bruits de manipulation. Gardez les petites pauses et respirations qui rendent la lecture humaine.
faq.3.question=Un grand-parent peut-il enregistrer l’histoire ?
faq.3.answer=Oui, s’il comprend l’usage prévu et donne un accord clair. Sleep2Story est conçu pour une voix qui vous appartient ou que vous avez l’autorisation d’utiliser.
faq.4.question=Puis-je enregistrer n’importe quel livre jeunesse ?
faq.4.answer=Pas automatiquement. Livres et enregistrements peuvent être protégés. Utilisez votre texte, une œuvre du domaine public ou un contenu que vous êtes autorisé à enregistrer.
