setup.kicker=Avant d’enregistrer
setup.title=Commencez par la pièce, pas par le micro
setup.lead=Le changement le plus efficace est souvent celui du lieu. Une chambre avec rideaux, literie, tapis et porte fermée sonnera plus douce qu’une cuisine vide ou un couloir.
setup.body=Le micro intégré du téléphone suffit pour commencer. Posez-le de façon stable à environ une largeur de main de votre bouche, micro dégagé. Parlez légèrement de biais pour que les consonnes p et b ne créent pas de souffle brutal.
kit.label=À préparer
kit.1.title=Votre téléphone
kit.1.body=Chargé, notifications coupées, micro dégagé.
kit.2.title=Une pièce feutrée
kit.2.body=Fermez portes et fenêtres ; rideaux et literie calmeront l’écho.
kit.3.title=L’histoire
kit.3.body=Repérez les voix, les pages à tourner et les pauses souhaitées.
legal.label=Un bref point juridique :
legal.body=si l’histoire n’est pas de vous, vérifiez que vous pouvez l’enregistrer et l’utiliser. Le droit d’auteur varie selon les pays ; un enregistrement familial privé n’équivaut pas à une diffusion.
steps.kicker=L’enregistrement
steps.title=Sept étapes pour une histoire qui vous ressemble
step.1.title=Choisissez une histoire que vous aimez lire
step.1.body=Un texte familier donne de l’aisance. Lisez-le d’abord en silence, repérez les noms difficiles et les passages à ralentir. Un son parfait ne masque pas une lecture sans plaisir.
step.2.title=Rendez la pièce suffisamment calme
step.2.body=Éteignez ventilateur, télévision, lave-linge et climatisation bruyante. Demandez dix minutes de calme à la maison. Il faut de la sérénité, pas un silence de laboratoire.
step.3.title=Posez le téléphone et n’y touchez plus
step.3.body=Un linge plié offre un support doux et stable. Une fois la distance choisie, ne tenez plus le téléphone : les bruits de manipulation gênent davantage qu’une respiration naturelle.
step.4.title=Faites un essai de 30 secondes
step.4.body=Lisez le passage le plus fort puis le plus doux et écoutez au casque. La voix semble loin ? Rapprochez-vous. Elle sature ou devient dure ? Reculez et recommencez.
step.5.title=Lisez pour un enfant, pas pour une salle
step.5.body=Imaginez votre enfant dans son lit et adressez-vous à lui. Ralentissez légèrement et laissez respirer une blague, une surprise ou la fin d’une page. La chaleur compte plus que le jeu parfait.
step.6.title=Faites une pause, reprenez, continuez
step.6.body=Si une phrase dérape, gardez deux secondes de silence puis recommencez-la. Ne reprenez pas toute l’histoire : cette pause nette permettra de retrouver facilement la bonne prise.
step.7.title=Écoutez une fois avant de sauvegarder
step.7.body=Vérifiez le début, un passage fort, un passage doux et la fin. Donnez un nom clair au fichier, gardez l’original et faites une sauvegarde dans un espace que vous contrôlez.
quote.text=Le but n’est pas une voix parfaite, mais celle que l’enfant reconnaît lorsque la chambre devient silencieuse.
