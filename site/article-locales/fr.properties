answer.label=En bref
answer.title=Prenez le téléphone que vous avez déjà, choisissez la pièce la plus calme et la plus feutrée, faites un court essai et lisez un peu plus lentement que d’habitude.
answer.body=Inutile d’effacer chaque respiration ou hésitation. Une histoire du soir doit garder la voix d’une personne que l’enfant connaît.
