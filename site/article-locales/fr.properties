problems.kicker=Résoudre les problèmes
problems.title=Corrigez d’abord la pièce, ensuite le fichier
problem.1.question=La voix semble lointaine ou creuse
problem.1.answer=Rapprochez-vous et choisissez une pièce plus feutrée. Murs nus, carrelage et grands espaces vides créent des réflexions qui éloignent la voix.
problem.2.question=Les mots en « p » claquent
problem.2.answer=Tournez légèrement la bouche à côté du micro et ajoutez un peu de distance. Faites un nouvel essai avant de poursuivre.
problem.3.question=Le volume varie entre les phrases
problem.3.answer=Gardez la même posture et la même distance. Pour un personnage qui crie, mettez de l’énergie dans la voix sans vous pencher brusquement vers le téléphone.
problem.4.question=Un bourdonnement reste en fond
problem.4.answer=Vérifiez chargeurs, réfrigérateur, ventilateur d’ordinateur et chauffage. Changez de pièce si la source ne peut pas être coupée en toute sécurité.
problem.5.question=Je bute toujours sur la même phrase
problem.5.answer=Si le texte est à vous, reformulez-la selon votre rythme oral. Sinon, marquez les respirations et enregistrez le paragraphe en petites parties.
product.eyebrow=Bientôt · iOS et Android
product.title=Un court échantillon de voix. Toute une bibliothèque familiale.
product.body=Sleep2Story s’adresse aux parents qui souhaitent écouter des histoires complètes avec une voix familiale familière et consentie. Ajoutez un échantillon que vous avez le droit d’utiliser, saisissez le texte complet et laissez la narration se préparer en arrière-plan.
