<!doctype html>
<html lang="{{locale}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8f4" />
    <title>{{index.meta_title}}</title>
    <meta name="description" content="{{index.meta_description}}" />
    <link rel="canonical" href="{{canonical_url}}" />
{{hreflang_links}}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sleep2Story" />
    <meta property="og:locale" content="{{og_locale}}" />
    <meta property="og:title" content="{{index.meta_title}}" />
    <meta property="og:description" content="{{index.meta_description}}" />
    <meta property="og:url" content="{{canonical_url}}" />
    <meta property="og:image" content="https://sleep2story.com/assets/og-{{locale}}.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>{{styles}}</style>
    <script type="application/ld+json">
{{structured_data}}
    </script>
    <script src="/assets/site.js" defer></script>
  </head>
  <body class="guide guide-index">
    <a class="skip" href="#main">{{skip}}</a>
    <header class="v3-header guide-header">
      <a class="brand brand-bold" href="{{locale_path}}" aria-label="Sleep2Story">
        <img src="/assets/app-icon-512.png" width="38" height="38" alt="" />
        <span>Sleep2Story</span>
      </a>
      <nav aria-label="{{nav.label}}">
        <a href="#guides">{{index.available}}</a>
      </nav>
      <div class="header-actions">
        <a class="variant-link variant-link-bold guide-home-link" href="{{locale_path}}">{{footer.back}}</a>
        <details class="locale-switcher">
          <summary aria-label="{{language.label}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
            </svg>
            <span>{{locale_code}}</span>
          </summary>
          <nav class="locale-menu" aria-label="{{language.label}}">
{{locale_links}}
          </nav>
        </details>
      </div>
    </header>

    <main id="main">
      <section class="guide-index__hero">
        <p class="broadcast-label">{{index.eyebrow}}</p>
        <h1>{{index.title}}</h1>
        <p>{{index.lead}}</p>
      </section>

      <section class="guide-index__list" id="guides" aria-labelledby="guides-title">
        <p class="guide-kicker">{{index.available}}</p>
        <a class="guide-index__card" href="{{article_path}}">
          <span class="guide-index__number" aria-hidden="true">01</span>
          <span class="guide-index__copy">
            <span class="broadcast-label">{{hero.eyebrow}}</span>
            <span class="guide-index__title" id="guides-title">{{meta.og_title}}</span>
            <span class="guide-index__summary">{{meta.description}}</span>
          </span>
          <span class="guide-index__cta">{{index.read_more}} <span aria-hidden="true">→</span></span>
        </a>
      </section>
    </main>

    <footer class="simple-footer simple-footer-bold guide-footer">
      <span>Sleep2Story</span>
      <a href="{{locale_path}}">{{footer.back}}</a>
    </footer>
  </body>
</html>
