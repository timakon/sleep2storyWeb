schema.description=Guia prático para manter familiar a história de embalar quando um dos pais viaja, trabalha de noite ou vive noutra casa.
hero.eyebrow=Família à distância · Guia 06
hero.title=Mantenha familiar a hora da história quando um dos pais está longe
hero.dek=Uma viagem de trabalho, um turno noturno ou uma noite noutra casa mudam quem se senta junto à cama. Um plano pequeno preserva a história, as palavras conhecidas e o papel do adulto presente.
