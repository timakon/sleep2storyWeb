prepare.title=Comece pelo serão que a criança já conhece
prepare.body1=Não reconstrua toda a noite à volta de quem vai viajar. Anote a parte que já anuncia a história: pijama, um gole de água, o cobertor azul e depois ler. Escolha dois ou três detalhes que o adulto presente consiga repetir sem encenação.
prepare.body2=Explique a ausência com palavras simples e diga quem estará presente à hora de deitar. Se as datas forem conhecidas, marque as noites num calendário. Não prometa uma videochamada diária se o horário ou a ligação não a tornam fiável.
prepare.source=PBS KIDS for Parents também sugere explicar a viagem, usar um calendário e pedir à pessoa cuidadora que mantenha as rotinas diárias
prepare.source_link=ler os conselhos de preparação
figure.alt=Ilustração acolhedora: um adulto lê a uma criança, com uma gravação e a fotografia do progenitor ausente por perto
figure.caption=O adulto presente continua a conduzir o serão; uma voz ou mensagem familiar é apenas uma parte da rotina.
plan.kicker=Antes da primeira noite separados
plan.title=Prepare o plano da história em quatro passos
plan.intro=Faça o plano mais pequeno que outro adulto consiga realmente usar. Uma história terminada é mais útil do que uma pasta de gravações incompletas.
plan.1.title=Escolha um ponto de referência
plan.1.body=Mantenha um objeto, frase ou ação no mesmo ponto: o cobertor às riscas, escolher entre duas histórias ou «Vemo-nos depois do pequeno-almoço». Este ponto deve funcionar mesmo sem contacto.
plan.2.title=Escolha a história
plan.2.body=Use uma história de que a criança já gosta ou prepare um texto original completo. Deixe o livro ou texto fácil de encontrar. Mantenha privada a gravação de um livro publicado e confirme os direitos antes de a partilhar fora de casa.
plan.3.title=Prepare uma participação de quem está longe
plan.3.body=Escolha uma: uma chamada a hora marcada, a gravação da história completa ou uma breve saudação e boa noite. Dê um nome claro ao ficheiro e teste-o no dispositivo que será usado.
plan.4.title=Ensaiem uma vez a versão normal
plan.4.body=Experimentem a rotina antes da viagem ou do novo turno. O adulto que fica inicia a história e termina o deitar. Assim, a criança vê que a noite mantém princípio e fim mesmo com papéis diferentes.
handoff.title=Deixe uma nota de cinco linhas
handoff.intro=Uma nota curta retira pequenas decisões de uma noite já preenchida. Envie-a na conversa que os dois adultos realmente consultam.
handoff.1.label=1. Início
handoff.1.text=História depois dos dentes e do pijama, por volta das 19h40.
handoff.2.label=2. Escolha
handoff.2.text=Propor o livro do coelho ou a história da lua; uma história esta noite.
handoff.3.label=3. Parte do progenitor
handoff.3.text=Chamada às 19h45. Sem resposta após uma tentativa, reproduzir «História de terça-feira».
handoff.4.label=4. Últimas palavras
handoff.4.text=Depois da história dizer: «Boa noite. Estamos aqui e depois chega a manhã».
handoff.5.label=5. Amanhã
handoff.5.text=A criança pode enviar um desenho ou mensagem de voz; não é preciso esperar por resposta antes de dormir.
handoff.body=Adapte o exemplo à sua família. O que ajuda é a precisão: um início, uma escolha, uma alternativa e um final. Não transforme a nota numa página de regras a representar na perfeição.
options.kicker=Escolha pela fiabilidade, não pela novidade
options.title=Chamada em direto, gravação completa ou mensagem curta?
options.intro=Cada formato cumpre uma função diferente. Escolha um como principal durante a viagem e guarde outro como alternativa.
option.1.title=Uma chamada em direto para uma conversa curta
option.1.body=A chamada resulta quando a hora é previsível e a criança quer conversar. Cumprimente, leia um trecho curto ou faça uma pergunta e deixe o adulto no quarto terminar o deitar. Se as chamadas costumam atrasar, faça-as mais cedo.
option.2.title=Uma gravação completa para repetir a história
option.2.body=A gravação está pronta apesar de fusos horários e rede fraca. Guarda o ritmo real, o riso e as vozes das personagens. Grave toda a história antes e ouça-a uma vez no dispositivo da noite.
option.3.title=Uma mensagem curta junto à leitura do adulto presente
option.3.body=Dez ou vinte segundos bastam se não houver tempo para gravar um livro. O adulto lê e reproduz a mensagem no momento combinado. «Espero que hoje escolhas a história da lua» aproxima mais do que um discurso genérico.
options.source=United Through Reading descreve como iniciar leituras familiares gravadas antes de uma missão e integrá-las num ritual; o programa serve famílias militares, mas a ideia de preparação pode ser adaptada sem equiparar todas as circunstâncias
options.source_link=ler o artigo sobre leitura em família
backup.title=Escreva o plano para uma chamada falhada antes de precisar dele
backup.intro=Uma chamada falhada muda o meio, não cancela a história. Combinem esta sequência quando ninguém tem pressa.
backup.1.title=Explique brevemente o que aconteceu
backup.1.body=O adulto pode dizer: «A chamada não funcionou hoje. Temos a história pronta». Não faça a criança esperar por muitas tentativas enquanto a hora de dormir se atrasa.
backup.2.title=Use a alternativa preparada
backup.2.body=Reproduza a gravação, junte a mensagem curta à leitura ou continue apenas com o adulto presente. Mantenha o mesmo cobertor, escolha e frase final.
backup.3.title=Deixe o próximo contacto para amanhã
backup.3.body=No dia seguinte podem enviar um desenho, fotografia ou mensagem de voz. Não prometa uma hora exata de resposta que o progenitor ausente possa voltar a falhar.
return.title=No regresso, junte-se à rotina que continuou
return.body1=Pergunte à criança o que gostou e ao outro adulto o que funcionou de facto. A primeira noite de regresso não precisa de uma história maior nem de deitar mais tarde. Retomem a ordem conhecida e leiam juntos se apetecer.
return.body2=Guarde as gravações que querem voltar a ouvir e dê-lhes nomes claros. Apague testes falhados e ficheiros privados de conversas partilhadas ou dispositivos que já não precisam deles. Uma biblioteca pequena e arrumada será mais fácil de reutilizar.
product.eyebrow=Em preparação · iOS e Android
product.title=O teu texto completo, preparado para ouvir
product.body=Estamos a desenvolver o Sleep2Story para transformar o texto completo fornecido por um adulto numa narração sintética, usando uma amostra de voz de um familiar adulto que tenha dado o seu consentimento. A aplicação prevista inclui uma biblioteca pessoal de histórias e um leitor de áudio. Não escreve a história nem preserva a leitura original dessas palavras feita pelo adulto.
product.body2=A aplicação ainda está em preparação para o lançamento. A narração está prevista em inglês e russo; as outras línguas do site não significam que a aplicação possa narrar nessas línguas. Já podes escrever, ler e fazer uma gravação normal da tua história de família com o telemóvel.
product.cta=Descobre como funciona o Sleep2Story
faq.title=Perguntas sobre a noite quando um progenitor está longe
faq.1.question=Uma videochamada é melhor do que uma gravação?
faq.1.answer=Use a chamada se a hora e a ligação forem fiáveis e a interação for importante. Use a gravação se trabalho, fusos horários ou rede puderem interromper a chamada. Podem fazer uma saudação curta mais cedo e ouvir a gravação ao deitar.
faq.2.question=Quantas histórias devemos gravar antes de uma viagem?
faq.2.answer=Comece com uma gravação completa e testada e uma mensagem curta de reserva. Adicione mais só quando a família souber que o plano funciona. A fiabilidade conta mais do que a quantidade.
faq.3.question=E se a criança pedir apenas pelo progenitor ausente?
faq.3.answer=Reconheça o pedido sem prometer o impossível: «Hoje querias que a mãe lesse. Ela está fora e eu estou contigo. Podemos ouvir a mensagem dela e depois leio eu». Use os nomes e palavras da sua família.
faq.4.question=O mesmo plano pode funcionar entre duas casas?
faq.4.answer=Sim, se os dois adultos quiserem. Combinem um sinal conhecido, o acesso ao ficheiro e uma frase final. O resto da rotina pode ser diferente em cada casa.
faq.5.question=O Sleep2Story substitui o progenitor ou adulto presente?
faq.5.answer=Não. O adulto presente continua a escolher, iniciar e terminar a rotina. O Sleep2Story está a ser preparado como uma opção para ouvir um texto completo em inglês ou russo com uma amostra de voz de um adulto que consente; ainda não está nas lojas.
