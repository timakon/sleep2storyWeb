nav.plan=Plano em quatro passos
nav.options=Chamada ou gravação
nav.backup=Se a chamada falhar
answer.title=Mantenha três coisas: a ordem, o sinal que inicia a história e as últimas palavras.
answer.body=Decidam antes se o progenitor ausente vai participar em direto, gravar toda a história ou enviar uma mensagem curta. Deixe ao adulto presente a escolha da história e a frase exata de boa noite. Tenha uma gravação testada para que um atraso, a rede fraca ou uma mudança de turno não decidam o serão.
