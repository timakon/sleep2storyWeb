prepare.title=从孩子已经熟悉的睡前习惯开始
prepare.body1=不必围绕即将离开的人，把整晚的流程重新设计一遍。记下原本提示故事时间到来的环节：换睡衣、喝一口水、盖上蓝色小毯子，然后听故事。挑两三件留在家里的大人可以轻松重复的小事，不要把睡前变成表演。
prepare.body2=用符合你们家庭情况的简单话说明这段分离，并告诉孩子睡前谁会陪着他或她。如果日期确定，可以在简易日历上标出几个夜晚。除非时间和网络确实可靠，否则不要承诺每天都能视频或语音通话。
prepare.source=PBS KIDS for Parents 也建议向孩子解释出行计划、使用日历，并请照顾者维持日常习惯
prepare.source_link=阅读他们的出行准备建议
figure.alt=温暖的绘本风插画：照顾者陪孩子读书，旁边放着远行家长的照片和录音
figure.caption=留在家里的成年人仍负责带领睡前流程；熟悉的声音或消息是其中一环。
plan.kicker=第一次分开过夜之前
plan.title=四步准备睡前故事计划
plan.intro=做一份另一位成年人真正用得上的最简单计划。一个可靠的故事，比一整个没录完的文件夹更有用。
plan.1.title=选一个固定环节
plan.1.body=每晚把一件熟悉的物品、一句话或一个动作放在相同位置：条纹毯子、从两个故事中选一个，或“早饭后见”。即使远方的家长无法连线，这个环节也要能照常进行。
plan.2.title=选好故事
plan.2.body=用孩子已经喜欢的故事，或提前写好一篇完整原创故事。把书或正文放在照顾者找得到的地方。如果录制出版书籍，录音先留作家庭私用；向家庭以外分享前，请确认相关权利。
plan.3.title=让远方的家长准备一种参与方式
plan.3.body=选一个：约定时间通话、把完整故事录下来，或留一段简短问候和晚安。给文件起个清楚的名字，并在睡前要用的设备上试播。
plan.4.title=预演普通的那个版本
plan.4.body=出行或换班前，先按新安排过一次睡前流程。让留在家的大人开始故事、说最后的晚安。孩子就能看到，即使分工变了，熟悉的开始和结束仍在。
handoff.title=给照顾者一张五行交接便签
handoff.intro=一张便签能减少忙碌夜晚的小决定。发到两位成年人平时都会打开的聊天里。
handoff.1.label=1. 开始
handoff.1.text=刷牙、换睡衣后开始故事，大约 19:40。
handoff.2.label=2. 选择
handoff.2.text=给孩子选小兔子的书或月亮故事；今晚只讲一个。
handoff.3.label=3. 远方家长的部分
handoff.3.text=19:45 打电话。拨一次没接通，就播放“星期二的故事”。
handoff.4.label=4. 结束语
handoff.4.text=故事结束后说：“晚安。我们在这里，明早又是新的一天。”
handoff.5.label=5. 明天
handoff.5.text=孩子可以发一张画或一条语音；睡前不必等回复。
handoff.body=把示例换成你们真正的习惯。关键是具体：一个开始点、一个选择、一种备选方法、一句结束语。不必写成一整页要求照顾者完美照做的规则。
options.kicker=按可靠程度选，不必追求新鲜
options.title=实时通话、完整录音，还是简短消息？
options.intro=三种方式各有用途。为这段分离选一种主要方式，再留一种作备选。
option.1.title=想简短交流，就实时通话
option.1.body=时间可预期、孩子也想互动时，通话很合适。简单问候，读一小段或问一个问题，然后让房间里的大人结束睡前流程。如果通话经常拖晚，就安排在更早的时段。
option.2.title=想反复听，就提前录完整故事
option.2.body=录音不受时区和信号影响，还能留下家长真实的语速、笑声和角色声音。提前录完整篇，并在睡前设备上试听一次，确认能正常播放。
option.3.title=照顾者读书时，加入一段短消息
option.3.body=没时间录整本书时，十到二十秒的问候也够了。照顾者读完约定的部分，再播放消息。“希望你今晚选月亮故事”这样具体的话，比泛泛的长篇讲话更有连接感。
options.source=United Through Reading 介绍了在分开前开始录制家庭故事，并把它放进可重复的睡前习惯；其项目服务军人家庭，但这种提前准备的思路也可用于其他家庭，不必假设各家的处境相同
options.source_link=阅读他们的家庭故事时间文章
backup.title=没错过通话之前，就写好应对方案
backup.intro=通话没接通，应改变方式，而不是取消故事。趁大家都平静时，先约定以下顺序。
backup.1.title=简短说明发生了什么
backup.1.body=照顾者可以说：“今晚电话没接通，不过故事已经准备好了。”别让孩子在反复拨号中越等越晚。
backup.2.title=用准备好的替代方式
backup.2.body=播放完整录音，或播一段短消息再读书，也可以由照顾者直接继续。保持同一条毯子、同一个故事选择和同一句结束语。
backup.3.title=明天再联系
backup.3.body=如果家人愿意，第二天可以发一张画、照片或语音。别答应远方家长可能再次错过的准确回复时间。
return.title=家长回家后，重新加入延续下来的习惯
return.body1=问问孩子喜欢什么，也听听照顾者说哪些办法实际有效。回家的第一个晚上，不必讲更长的故事或更晚睡。重新加入熟悉的顺序；自然的话，就一起读。
return.body2=把家人还想再听的录音留好，并清楚命名。从不再需要保存它们的群聊或设备里删除失败的测试文件和私人文件。小而整齐的故事库，更方便下次分开时使用。
product.eyebrow=即将推出 · iOS 和 Android
product.title=由你提供完整正文，提前准备好可听的故事
product.body=Sleep2Story 正在开发，计划用成年人提供的完整故事正文和一位已同意使用其声音的成年家人的声音样本，制作合成讲述音频。应用计划提供个人故事库和播放器。它不会保存这位成年人亲自朗读整篇故事时的原始表演。
product.body2=应用仍在上线准备中。如果想原样留住家长亲自朗读的声音，请直接用手机录下整个故事。
product.cta=了解 Sleep2Story 的使用方法
faq.title=家长不在身边时的睡前问题
faq.1.question=视频通话比录音更好吗？
faq.1.answer=互动和时间都可靠时，可以通话；如果时区、工作或信号可能打断，就用录音。很多家庭可以更早短暂通话问候，睡前再播放故事录音。
faq.2.question=出发前要录多少个故事？
faq.2.answer=先准备一篇完整且试听过的录音，再加一段简短的备用消息。确定方法有效后再慢慢增加。可靠比数量多更重要。
faq.3.question=孩子只想要远方的那位家长，怎么办？
faq.3.answer=承认孩子的愿望，不假装那位家长马上能出现：“你今晚很想妈妈。妈妈不在家，我会陪着你。我们先听她的留言，然后我来读。”请换成适合你们家的称呼和说法。
faq.4.question=两个家之间也能用同样的办法吗？
faq.4.answer=可以，只要两位成年人都愿意。约定一个小小的共同提示、录音访问方式和结束语。每个家仍可保留自己的其他习惯，不要求两边的睡觉时间和家规完全一样。
faq.5.question=Sleep2Story 会取代睡前陪伴孩子的家长或照顾者吗？
faq.5.answer=不会。在场的成年人仍负责选择故事、开始和结束睡前流程。Sleep2Story 正在为完整故事正文和经本人同意的成年人的声音样本提供一种聆听方式；目前尚未在应用商店上架。
