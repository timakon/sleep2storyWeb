nav.backup=错过通话怎么办
answer.title=把三件事保持不变：顺序、故事开始的提示，以及最后那句晚安。
answer.body=睡前提前决定，远行的家长是实时参与、留下完整录音，还是发一小段问候。把故事选择和准确的晚安语告诉陪在家里的大人。再备一段随时能播放的录音，别让火车晚点、信号不好或临时换班决定今晚能否讲故事。
