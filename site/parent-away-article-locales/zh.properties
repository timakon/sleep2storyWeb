hero.title=家长不在家，睡前故事也能保持熟悉
hero.dek=出差、夜班，或在另一个家度过的日子，会改变谁坐在床边。一份简单的安排，能让故事、熟悉的话，以及留在身边的大人，继续陪孩子度过夜晚。
