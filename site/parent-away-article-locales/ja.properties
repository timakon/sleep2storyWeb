sources.body=PBS の資料は準備、カレンダー、習慣に関する提案の参考です。United Through Reading は軍人の家族について、離れる前の録音と読み聞かせの習慣の例を紹介しています。引き継ぎメモ、方法の比較、通話できないときの計画は Sleep2Story 編集部のオリジナルです。いずれの資料も Sleep2Story を評価したものではありません。
