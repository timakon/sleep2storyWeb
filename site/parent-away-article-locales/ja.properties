prepare.title=子どもが知っている寝る前の流れから始める
prepare.body1=家を離れる人を中心に、夜の流れを全部作り直す必要はありません。パジャマ、ひと口の水、青い毛布、それからお話。すでにお話の合図になっている部分を書き出します。家にいる大人が無理なく繰り返せるものを2つか3つ選びましょう。
prepare.body2=家族の状況に合う簡単な言葉で不在を説明し、寝るときには誰がそばにいるか伝えます。日程が分かっていれば、簡単なカレンダーに夜を記しましょう。予定と通信環境が本当に確実でない限り、毎晩の通話は約束しないほうが安心です。
prepare.source=PBS KIDS for Parents も、旅行の予定を説明し、カレンダーを使い、世話をする大人が日々の習慣を保つことを提案しています
prepare.source_link=旅行前の準備のヒントを読む
figure.alt=子どものそばで世話をする大人が物語を読み、近くに録音と旅行中の親の写真が置かれた温かな絵本風イラスト
figure.caption=夜の流れを進めるのは家にいる大人。聞き慣れた声やメッセージは、その一部です。
plan.kicker=最初の離れた夜を迎える前に
plan.title=寝る前の物語を4ステップで準備
plan.intro=別の大人が本当に使える、できるだけ小さな計画にしましょう。未完成の録音がたくさんあるより、確実に使える話がひとつあるほうが助かります。
plan.1.title=変えない合図をひとつ選ぶ
plan.1.body=しま模様の毛布、2つの物語から選ぶこと、「朝ごはんの後に会おうね」という言葉など、毎晩同じ場所に置けるものを残します。離れている親とつながれなくても使える合図にしましょう。
plan.2.title=物語を選ぶ
plan.2.body=子どもがすでに好きな話を使うか、オリジナルの文章を全文用意します。本や原稿は、世話をする大人が見つけられる場所に。出版された本を録る場合、録音は家族内にとどめ、家庭外に共有する前に権利を確認してください。
plan.3.title=離れている親の参加方法をひとつ準備する
plan.3.body=時間を決めた通話、物語全文の録音、短い「こんばんは」と「おやすみ」のメッセージから選びます。ファイル名を分かりやすくし、寝るときに使う端末で試しておきましょう。
plan.4.title=普段どおりの形を一度練習する
plan.4.body=出発や新しい勤務の前に、一度試してみます。家にいる大人がお話を始め、最後の「おやすみ」まで進めます。役割が変わっても、始まりと終わりはあると子どもに伝わります。
handoff.title=世話をする大人に5行の引き継ぎメモを
handoff.intro=メモがあれば、忙しい夜の小さな判断が減ります。大人同士が普段使っているメッセージのやり取りに送っておきましょう。
handoff.1.label=1. 始めるとき
handoff.1.text=歯みがきとパジャマの後、19時40分ごろにお話を始める。
handoff.2.label=2. 選ぶもの
handoff.2.text=うさぎの本か月のお話を選んでもらう。今夜は1つだけ。
handoff.3.label=3. 離れている親の出番
handoff.3.text=19時45分に通話。1回かけて出なければ「火曜日のお話」を再生する。
handoff.4.label=4. 終わりの言葉
handoff.4.text=お話の後に「おやすみ。ここにいるよ。次は朝だね」と言う。
handoff.5.label=5. 明日
handoff.5.text=子どもから絵や音声メッセージをひとつ送ってもよい。寝る前の返事は不要。
handoff.body=例は実際の生活に合わせて変えてください。大切なのは具体的であること。始まり、選択肢、予備の方法、終わりをそれぞれひとつ。世話をする大人が完璧に再現しなければならない長い規則にはしないでください。
options.kicker=新しさより確実さで選ぶ
options.title=生の通話、物語全文の録音、短いメッセージ？
options.intro=それぞれ役割が違います。離れている間の主な方法をひとつ、予備をもうひとつ選びましょう。
option.1.title=短い会話には生の通話を
option.1.body=時間が読めて、子どもがやり取りを望むなら通話が合います。挨拶をし、短い部分を読むか質問をひとつして、寝る前の締めくくりは部屋にいる大人に任せましょう。通話が遅くなりがちなら、夕方の早い時間に移します。
option.2.title=繰り返し聴く話には全文の録音を
option.2.body=録音なら時差や通信不良があっても使えます。親本人の話す速さ、笑い声、登場人物の声色も残ります。物語を前もって最後まで録り、使う端末で一度聴いて確かめましょう。
option.3.title=世話をする大人の朗読に短いメッセージを添える
option.3.body=本を録る時間がなければ、10秒か20秒の挨拶だけでも十分なことがあります。世話をする大人が物語を読み、決めたところでメッセージを流します。「今夜は月のお話を選んでくれたらうれしいな」のような具体的な言葉は、決まり文句より身近に感じられます。
options.source=United Through Reading は、派遣前から家族の読み聞かせを録り始め、繰り返せる習慣に組み込む方法を紹介しています。軍人の家族向けの取り組みですが、すべての家庭が同じ状況にあると決めつけず、準備の考え方を参考にできます
options.source_link=家族の読み聞かせについての記事を読む
backup.title=通話できない夜の計画を、先に書いておく
backup.intro=通話できなくても、方法を変えるだけで、物語の時間をなくす必要はありません。皆が落ち着いているうちに、次の順番を決めておきます。
backup.1.title=起きたことを短く伝える
backup.1.body=世話をする大人は「今日は電話がつながらなかったね。でもお話は用意してあるよ」と言えます。寝る時間が遅くなるまで何度もかけ直して待たせないようにします。
backup.2.title=用意した代わりの方法を使う
backup.2.body=全文の録音を流す、短いメッセージの後に本を読む、またはそばにいる大人だけで続けます。毛布、物語の選び方、最後の言葉は同じにしましょう。
backup.3.title=再びつながるのは明日に
backup.3.body=家族が望むなら、翌日に絵や写真、音声メッセージを送ります。離れている親がまた守れないかもしれない返信時刻を、正確に約束しないようにしましょう。
return.title=親が帰ってきたら、続いていた習慣に加わる
return.body1=子どもに何が楽しかったか聞き、世話をしていた大人に実際にうまくいったことを教えてもらいます。戻った最初の夜に、長い話や遅い就寝時間は必要ありません。いつもの順番に戻り、自然なら一緒に読みましょう。
return.body2=家族がまた聴きたい録音は残し、名前を分かりやすくします。失敗した試し録りや不要になった私的なファイルは、共有チャットや端末から削除しましょう。小さく整ったライブラリなら、次に離れる夜にも使いやすくなります。
product.eyebrow=公開準備中 · iOS と Android
product.title=書き終えた物語を、聴ける形に
product.body=Sleep2Story は、大人が提供する物語の全文を、本人が同意した成年の家族の声のサンプルで合成朗読にするアプリとして開発中です。個人の物語ライブラリとプレーヤーを予定しています。その大人が実際に物語を読み上げた音声を保存するものではありません。
product.body2=アプリはまだ公開準備中です。親が実際に読んだ声をそのまま記念に残したい場合は、スマホで物語を全文録音してください。
product.cta=Sleep2Story の使い方を見る
faq.title=親が離れている夜のお話についての質問
faq.1.question=録音よりビデオ通話のほうがよいですか？
faq.1.answer=やり取りの時間が確実なら通話を、時差や仕事、電波で中断しそうなら録音を使いましょう。夕方に短く顔を見て挨拶し、お話の時間には録音を流す方法もあります。
faq.2.question=出発前に何話録ればよいですか？
faq.2.answer=まずは最後まで録れて再生を試した話を1つと、短い予備メッセージを1つ。家族にとって使いやすいと分かってから増やしましょう。たくさん揃えるより確実に使えることが大切です。
faq.3.question=子どもが離れている親にしか読んでほしくないと言ったら？
faq.3.answer=その気持ちを受け止め、今すぐ帰ってくるようなふりはしないで。「今夜はママに読んでほしかったんだね。ママは離れた所にいて、私はここにいるよ。メッセージを聴いてから、私が読むね」。家族に合う呼び方と言葉に変えてください。
faq.4.question=2つの家を行き来する場合にも使えますか？
faq.4.answer=はい、双方の大人が望むなら。共通の小さな合図、ファイルへのアクセス、締めくくりの言葉を決めましょう。それぞれの家に独自の習慣があってよく、就寝時刻や家の決まりを同じにする必要はありません。
faq.5.question=Sleep2Story は寝る前の親や世話をする大人の代わりになりますか？
faq.5.answer=いいえ。そばにいる大人が、物語を選び、始め、夜を締めくくります。Sleep2Story は、物語の全文と本人が同意した大人の声のサンプルを使う、聴くための選択肢として準備中です。アプリストアではまだ公開されていません。
