answer.title=順番、お話を始める合図、最後の言葉。この3つを変えずに。
answer.body=離れている親が生で参加するか、物語を全文録音するか、短いメッセージを送るかを、夜になる前に決めます。家にいる大人には、読む話と「おやすみ」の言葉を伝えておきましょう。電車の遅れや通信不良、勤務の変更に夜の時間を左右されないよう、すぐ再生できる予備もひとつ用意します。
