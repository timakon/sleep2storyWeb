answer.title=Păstrați trei lucruri: ordinea, semnalul de început și ultimele cuvinte.
answer.body=Decideți înainte dacă părintele plecat va participa în direct, va înregistra toată povestea sau va trimite un mesaj scurt. Dați adultului de acasă alegerea poveștii și fraza exactă de noapte bună. Pregătiți o înregistrare testată, astfel încât întârzierea, semnalul slab sau schimbarea turei să nu decidă seara.
