hero.title=Păstrați familiară povestea de seară când un părinte este plecat
hero.dek=O deplasare, o tură de noapte sau o seară în cealaltă casă schimbă persoana de lângă pat. Un plan mic păstrează povestea, cuvintele cunoscute și rolul adultului prezent.
