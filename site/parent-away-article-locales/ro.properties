prepare.title=Porniți de la seara pe care copilul o cunoaște
prepare.body1=Nu reconstruiți toată seara în jurul persoanei care pleacă. Notați partea care anunță deja povestea: pijamaua, o gură de apă, pătura albastră, apoi cititul. Alegeți două sau trei detalii pe care adultul prezent le poate repeta ușor.
prepare.body2=Explicați absența în cuvinte simple și spuneți cine va fi acolo la culcare. Dacă datele sunt cunoscute, marcați nopțile într-un calendar. Nu promiteți un apel video zilnic dacă programul sau conexiunea nu îl fac sigur.
prepare.source=PBS KIDS for Parents recomandă și explicarea călătoriei, folosirea unui calendar și păstrarea rutinelor zilnice de către persoana care îngrijește copilul
prepare.source_link=citiți sfaturile de pregătire
figure.alt=Ilustrație caldă: un adult îi citește copilului, iar alături sunt o înregistrare și fotografia părintelui plecat
figure.caption=Adultul prezent conduce seara; vocea sau mesajul familiar este doar o parte a rutinei.
plan.kicker=Înainte de prima seară separați
plan.title=Pregătiți povestea de seară în patru pași
plan.intro=Faceți cel mai scurt plan pe care alt adult îl poate folosi cu adevărat. O poveste terminată ajută mai mult decât un dosar cu înregistrări neterminate.
plan.1.title=Alegeți un singur reper
plan.1.body=Păstrați un obiect, o frază sau o acțiune în același loc al serii: pătura în dungi, alegerea dintre două povești sau „Ne vedem după micul dejun”. Reperul trebuie să funcționeze și fără conexiune.
plan.2.title=Alegeți povestea
plan.2.body=Folosiți o poveste pe care copilul o iubește sau pregătiți un text original complet. Lăsați cartea ori textul ușor de găsit. Păstrați privată înregistrarea unei cărți publicate și verificați drepturile înainte de a o distribui în afara casei.
plan.3.title=Pregătiți o contribuție a părintelui plecat
plan.3.body=Alegeți una: un apel la o oră stabilită, înregistrarea întregii povești sau un salut și noapte bună scurte. Dați fișierului un nume clar și testați-l pe dispozitivul folosit seara.
plan.4.title=Repetați o dată varianta obișnuită
plan.4.body=Încercați rutina înainte de plecare sau de noua tură. Adultul care rămâne începe povestea și încheie culcarea. Copilul vede astfel că seara are început și sfârșit cunoscute chiar dacă rolurile se schimbă.
handoff.title=Lăsați o notă în cinci rânduri
handoff.intro=O notă scurtă elimină deciziile mici dintr-o seară deja aglomerată. Trimiteți-o în conversația pe care ambii adulți o deschid cu adevărat.
handoff.1.label=1. Început
handoff.1.text=Poveste după spălatul pe dinți și pijama, în jur de 19:40.
handoff.2.label=2. Alegere
handoff.2.text=Oferă cartea cu iepurele sau povestea cu luna; o poveste în seara aceasta.
handoff.3.label=3. Partea părintelui
handoff.3.text=Apel la 19:45. Dacă nu răspunde după o încercare, redă „Povestea de marți”.
handoff.4.label=4. Ultimele cuvinte
handoff.4.text=După poveste spune: „Noapte bună. Suntem aici, iar apoi vine dimineața.”
handoff.5.label=5. Mâine
handoff.5.text=Copilul poate trimite un desen sau mesaj vocal; nu trebuie așteptat răspunsul înainte de somn.
handoff.body=Adaptați exemplul la familia voastră. Ajută precizia: un început, o alegere, o rezervă și o încheiere. Nu transformați nota într-o pagină de reguli care trebuie reprodusă perfect.
options.kicker=Alegeți după fiabilitate, nu după noutate
options.title=Apel în direct, înregistrare completă sau mesaj scurt?
options.intro=Fiecare format are alt rol. Alegeți unul principal pentru deplasare și păstrați altul ca rezervă.
option.1.title=Un apel în direct pentru o conversație scurtă
option.1.body=Apelul este potrivit când ora este previzibilă și copilul vrea interacțiune. Salutați, citiți un fragment scurt sau puneți o întrebare; adultul din cameră încheie seara. Dacă apelurile întârzie, mutați-le mai devreme.
option.2.title=O înregistrare completă pentru o poveste repetabilă
option.2.body=Înregistrarea rămâne disponibilă în ciuda fusurilor orare și a semnalului slab. Păstrează ritmul real, râsul și vocile personajelor. Înregistrați totul dinainte și ascultați o dată pe dispozitivul de seară.
option.3.title=Un mesaj scurt lângă lectura adultului prezent
option.3.body=Zece sau douăzeci de secunde sunt suficiente dacă nu există timp pentru o carte. Adultul citește și redă mesajul la momentul stabilit. „Sper că alegi povestea cu luna în seara asta” este mai apropiat decât un discurs general.
options.source=United Through Reading descrie începerea lecturilor de familie înregistrate înaintea unei detașări și includerea lor într-un ritual; programul deservește familii de militari, dar ideea pregătirii poate fi adaptată fără a echivala toate situațiile
options.source_link=citiți articolul despre lectura în familie
backup.title=Scrieți planul pentru un apel ratat înainte să fie necesar
backup.intro=Un apel ratat schimbă metoda, nu anulează povestea. Stabiliți această ordine cât timp nimeni nu se grăbește.
backup.1.title=Spuneți pe scurt ce s-a întâmplat
backup.1.body=Adultul poate spune: „Apelul nu a mers în seara asta. Povestea este pregătită.” Nu lăsați copilul să aștepte multe încercări în timp ce ora de culcare se amână.
backup.2.title=Folosiți alternativa pregătită
backup.2.body=Redați înregistrarea, combinați mesajul scurt cu cititul sau continuați doar cu adultul prezent. Păstrați aceeași pătură, alegerea poveștii și fraza finală.
backup.3.title=Lăsați următorul contact pentru mâine
backup.3.body=A doua zi puteți trimite un desen, o fotografie sau un mesaj vocal. Nu promiteți o oră exactă de răspuns pe care părintele plecat ar putea să o rateze iar.
return.title=La întoarcere, intrați în rutina care a continuat
return.body1=Întrebați copilul ce i-a plăcut și adultul ce a funcționat în realitate. Prima seară nu are nevoie de o poveste mai lungă sau de culcare mai târzie. Reluați ordinea cunoscută și citiți împreună dacă vă doriți.
return.body2=Păstrați înregistrările pe care vreți să le reascultați și dați-le nume clare. Ștergeți testele nereușite și fișierele private din conversații sau dispozitive care nu mai au nevoie de ele. O bibliotecă mică și ordonată se folosește mai ușor data viitoare.
product.eyebrow=În pregătire · iOS și Android
product.title=Textul tău complet, pregătit pentru ascultare
product.body=Sleep2Story este în curs de dezvoltare pentru a transforma textul complet al unei povești, furnizat de un adult, în narațiune sintetică. Va folosi o mostră de voce a unui membru adult al familiei, cu acordul acestuia. Aplicația planificată include o bibliotecă personală de povești și un player audio. Nu scrie povestea, iar narațiunea generată nu este o înregistrare a adultului citind el însuși întregul text.
product.body2=Aplicația este încă în pregătire pentru lansare. Narațiunea este planificată în engleză și rusă; celelalte limbi ale site-ului nu înseamnă că narațiunea este disponibilă și în acele limbi. Poți deja să scrii, să citești și să înregistrezi povestea familiei cu un simplu telefon.
product.cta=Vezi cum funcționează Sleep2Story
faq.title=Întrebări despre seară când un părinte este plecat
faq.1.question=Este apelul video mai bun decât înregistrarea?
faq.1.answer=Folosiți apelul dacă ora și conexiunea sunt sigure și interacțiunea contează. Folosiți înregistrarea dacă munca, fusurile orare sau semnalul pot întrerupe apelul. Un salut scurt mai devreme și povestea înregistrată la culcare pot funcționa împreună.
faq.2.question=Câte povești să înregistrăm înainte de o călătorie?
faq.2.answer=Începeți cu o înregistrare completă și testată și un mesaj scurt de rezervă. Adăugați mai multe doar după ce familia știe că planul funcționează. Fiabilitatea contează mai mult decât numărul.
faq.3.question=Ce facem dacă copilul îl cere doar pe părintele plecat?
faq.3.answer=Recunoașteți dorința fără a promite imposibilul: „Ai vrut ca mama să citească în seara asta. Ea este plecată, iar eu sunt cu tine. Putem asculta mesajul ei și apoi citesc eu.” Folosiți numele și cuvintele familiei voastre.
faq.4.question=Poate același plan să funcționeze între două case?
faq.4.answer=Da, dacă ambii adulți doresc. Stabiliți un reper comun, accesul la fișier și o frază finală. Restul rutinei poate fi diferit în fiecare casă.
faq.5.question=Sleep2Story înlocuiește părintele sau adultul prezent?
faq.5.answer=Nu. Adultul prezent continuă să aleagă, să înceapă și să încheie rutina. Sleep2Story este în pregătire ca opțiune de ascultare a unui text complet în engleză sau rusă cu mostra vocală a unui adult care consimte; aplicația nu este încă în magazine.
