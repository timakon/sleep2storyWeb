hero.title=Ebeveyn uzaktayken masal saatini tanıdık tutun
hero.dek=İş seyahati, gece vardiyası ya da diğer evde geçirilen akşam, yatağın yanında kimin oturduğunu değiştirir. Küçük bir plan masalı, tanıdık sözleri ve o akşam orada olan yetişkinin rolünü korur.
