answer.title=Üç şeyi aynı tutun: sıra, masalın başlangıç işareti ve son sözler.
answer.body=Uzaktaki ebeveynin canlı bağlanacağına, tüm masalı kaydedeceğine ya da kısa mesaj göndereceğine önceden karar verin. Evdeki yetişkine masal seçimini ve iyi geceler cümlesini bırakın. Gecikme, zayıf bağlantı veya vardiya değişikliği masal saatini belirlemesin diye denenmiş bir kayıt hazırlayın.
