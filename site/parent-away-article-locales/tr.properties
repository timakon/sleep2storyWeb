prepare.title=Çocuğun zaten bildiği akşamdan başlayın
prepare.body1=Bütün akşamı giden kişinin etrafında yeniden kurmayın. Masalın başladığını zaten anlatan bölümü yazın: pijama, bir yudum su, mavi battaniye, ardından okuma. Evdeki yetişkinin gösteriye çevirmeden tekrarlayabileceği iki ya da üç ayrıntı seçin.
prepare.body2=Yokluğu basit sözlerle açıklayın ve uyku saatinde kimin yanında olacağını söyleyin. Tarihler belliyse geceleri sade bir takvimde işaretleyin. Program veya bağlantı güvenilir değilse her akşam görüntülü arama sözü vermeyin.
prepare.source=PBS KIDS for Parents da seyahat planını açıklamayı, takvim kullanmayı ve bakım veren kişiden günlük düzeni sürdürmesini istemeyi öneriyor
prepare.source_link=seyahate hazırlık önerilerini okuyun
figure.alt=Sıcak kitap illüstrasyonu: bir yetişkin çocuğa okurken yakında uzaktaki ebeveynin fotoğrafı ve kaydı duruyor
figure.caption=Akşamı odadaki yetişkin yönetir; tanıdık ses ya da mesaj düzenin yalnızca bir parçasıdır.
plan.kicker=Ayrı geçirilen ilk akşamdan önce
plan.title=Uyku masalı planını dört adımda hazırlayın
plan.intro=Başka bir yetişkinin gerçekten kullanabileceği en küçük planı yapın. Tamamlanmış tek bir masal, yarım kayıtlarla dolu klasörden daha yararlıdır.
plan.1.title=Tek bir dayanak seçin
plan.1.body=Tanıdık bir nesneyi, sözü veya adımı her akşam aynı yerde tutun: çizgili battaniye, iki masal arasından seçim ya da “Kahvaltıdan sonra görüşürüz.” Bu dayanak bağlantı olmasa da çalışmalıdır.
plan.2.title=Masalı seçin
plan.2.body=Çocuğun sevdiği bir hikâyeyi kullanın veya özgün ve tamamlanmış bir metin hazırlayın. Kitabı ya da metni kolay bulunacak yere koyun. Yayımlanmış kitabın kaydını özel tutun; ev dışına paylaşmadan önce haklarını kontrol edin.
plan.3.title=Uzaktaki ebeveynden tek bir katkı hazırlayın
plan.3.body=Birini seçin: belirlenmiş saatte arama, masalın tamamının kaydı veya kısa merhaba ve iyi geceler mesajı. Dosyayı açıkça adlandırın ve akşam kullanılacak cihazda deneyin.
plan.4.title=Sıradan sürümü bir kez prova edin
plan.4.body=Seyahat ya da yeni vardiya öncesinde düzeni deneyin. Evde kalacak yetişkin masalı başlatsın ve uyku saatini bitirsin. Böylece çocuk roller değişse de akşamın tanıdık başlangıcı ve sonu olduğunu görür.
handoff.title=Beş satırlık bir devir notu bırakın
handoff.intro=Kısa not zaten yoğun olan akşamdan küçük kararları çıkarır. İki yetişkinin de gerçekten açtığı mesajlaşmaya gönderin.
handoff.1.label=1. Başlangıç
handoff.1.text=Dişler ve pijamadan sonra, yaklaşık 19.40’ta masal.
handoff.2.label=2. Seçim
handoff.2.text=Tavşan kitabını veya ay masalını öner; bu akşam bir masal.
handoff.3.label=3. Ebeveynin bölümü
handoff.3.text=19.45’te arama. Bir denemede yanıt yoksa “Salı masalı”nı oynat.
handoff.4.label=4. Son sözler
handoff.4.text=Masaldan sonra: “İyi geceler. Biz buradayız, sonra sabah gelecek.”
handoff.5.label=5. Yarın
handoff.5.text=Çocuk bir resim ya da sesli mesaj gönderebilir; yatmadan cevap beklemek gerekmez.
handoff.body=Örneği ailenize uyarlayın. İşe yarayan şey netliktir: tek başlangıç, tek seçim, tek yedek ve tek kapanış. Notu kusursuz uygulanması gereken bir kurallar sayfasına çevirmeyin.
options.kicker=Yeniliğe değil güvenilirliğe göre seçin
options.title=Canlı arama, tam kayıt veya kısa mesaj mı?
options.intro=Her biçim farklı iş yapar. Seyahat için birini ana yol seçin, diğerini yedek tutun.
option.1.title=Kısa sohbet için canlı arama
option.1.body=Saat öngörülebilir ve çocuk etkileşim istiyorsa arama uygundur. Merhaba deyin, kısa bölüm okuyun veya tek soru sorun; akşamı odadaki yetişkin bitirsin. Aramalar gecikiyorsa daha erken yapın.
option.2.title=Tekrar dinlenebilen masal için tam kayıt
option.2.body=Kayıt, saat farkına ve zayıf bağlantıya rağmen hazırdır. Gerçek okuma hızını, kahkahayı ve karakter seslerini korur. Masalın tamamını önceden kaydedip akşam cihazında bir kez dinleyin.
option.3.title=Evdeki yetişkinin okumasına kısa mesaj eklemek
option.3.body=Kitabı kaydetmeye vakit yoksa on ya da yirmi saniye yeter. Yetişkin okur ve mesajı kararlaştırılan yerde oynatır. “Umarım bu akşam ay masalını seçersin” gibi belirli bir cümle genel konuşmadan daha yakındır.
options.source=United Through Reading, görevlendirme öncesinde kayıtlı aile okumasına başlamayı ve bunu tekrarlanan düzene yerleştirmeyi anlatıyor; program asker ailelerine hizmet verir, ancak hazırlık fikri bütün koşulları eşitlemeden uyarlanabilir
options.source_link=aile okuması yazısını okuyun
backup.title=Kaçırılan arama planını ihtiyaç olmadan yazın
backup.intro=Kaçırılan arama yöntemi değiştirir, masalı iptal etmez. Kimse acele etmiyorken şu sırada anlaşın.
backup.1.title=Ne olduğunu kısaca söyleyin
backup.1.body=Yetişkin “Arama bu akşam olmadı. Masalımız hazır” diyebilir. Uyku saati gecikirken çocuğu tekrar tekrar arama denemeleriyle bekletmeyin.
backup.2.title=Hazırlanmış yedeği kullanın
backup.2.body=Tam kaydı oynatın, kısa mesajı okumayla birleştirin veya yalnızca odadaki yetişkinle devam edin. Aynı battaniyeyi, masal seçimini ve kapanış cümlesini koruyun.
backup.3.title=Sonraki bağlantıyı yarına bırakın
backup.3.body=Ertesi gün istenirse resim, fotoğraf veya sesli mesaj gönderin. Uzaktaki ebeveynin yine kaçırabileceği kesin bir cevap saati vaat etmeyin.
return.title=Ebeveyn dönünce sürmüş olan düzene katılsın
return.body1=Çocuğa neyi sevdiğini, diğer yetişkine neyin gerçekten işe yaradığını sorun. İlk dönüş akşamı daha uzun masala veya daha geç saate gerek yoktur. Tanıdık sıraya dönün ve isterseniz birlikte okuyun.
return.body2=Yeniden dinlemek istediğiniz kayıtları açık adlarla saklayın. Başarısız denemeleri ve özel dosyaları artık gerekmeyen ortak sohbet ya da cihazlardan silin. Küçük, düzenli kitaplık bir sonraki ayrılıkta daha kolay kullanılır.
product.eyebrow=Hazırlık aşamasında · iOS ve Android
product.title=Tamamladığınız metin dinlemeye hazır hâle gelsin
product.body=Sleep2Story, bir yetişkinin sağladığı tam hikâye metnini, rızasını vermiş yetişkin bir aile üyesinin ses örneğini kullanarak sentetik seslendirmeye dönüştürmek üzere geliştiriliyor. Planlanan uygulamada kişisel hikâye kütüphanesi ve ses oynatıcısı bulunuyor. Hikâyeyi uygulama yazmaz; üretilen seslendirme, yetişkinin metnin tamamını kendi sesiyle okuduğu gerçek bir kayıt değildir.
product.body2=Uygulama henüz yayımlanmaya hazırlanıyor. Seslendirme İngilizce ve Rusça için planlanıyor; sitedeki diğer diller, o dillerde seslendirme desteği olduğu anlamına gelmiyor. Aile hikâyenizi şimdiden yazabilir, okuyabilir ve telefonunuzun sıradan ses kaydedicisiyle kaydedebilirsiniz.
product.cta=Sleep2Story'nin nasıl çalıştığını görün
faq.title=Ebeveyn uzaktayken uyku saati soruları
faq.1.question=Görüntülü arama kayıttan daha mı iyi?
faq.1.answer=Saat ve bağlantı güvenilir, etkileşim önemliyse aramayı seçin. İş, saat farkı veya sinyal aramayı bozabilecekse kayıt kullanın. Daha erken kısa bir selam ve uyku saatinde kayıt da birlikte kullanılabilir.
faq.2.question=Seyahatten önce kaç masal kaydetmeliyiz?
faq.2.answer=Tamamlanmış ve denenmiş tek kayıtla kısa bir yedek mesajla başlayın. Aile düzenin çalıştığını gördükten sonra ekleyin. Güvenilirlik sayıdan önemlidir.
faq.3.question=Çocuk yalnızca uzaktaki ebeveyni isterse ne denir?
faq.3.answer=İsteği kabul edin, imkânsızı vaat etmeyin: “Bu akşam annenin okumasını istedin. O uzakta, ben yanındayım. Mesajını dinleyip sonra ben okuyabilirim.” Ailenize uygun isim ve sözleri kullanın.
faq.4.question=Aynı plan iki ev arasında çalışır mı?
faq.4.answer=İki yetişkin de isterse evet. Ortak bir işaret, dosya erişimi ve kapanış cümlesinde anlaşın. Düzenin geri kalanı her evde farklı olabilir.
faq.5.question=Sleep2Story ebeveynin veya odadaki yetişkinin yerini alır mı?
faq.5.answer=Hayır. Odadaki yetişkin düzeni seçmeye, başlatmaya ve bitirmeye devam eder. Sleep2Story, onay veren bir yetişkinin ses örneğiyle tamamlanmış İngilizce veya Rusça metni dinleme seçeneklerinden biri olarak hazırlanıyor; uygulama henüz mağazalarda yok.
