prepare.title=Zacznij od wieczoru, który dziecko już zna
prepare.body1=Nie przebudowuj całego wieczoru wokół wyjeżdżającej osoby. Zapisz fragment, który już zapowiada bajkę: piżama, łyk wody, niebieski koc, potem czytanie. Wybierz dwa lub trzy elementy, które opiekun powtórzy bez tworzenia przedstawienia.
prepare.body2=Prosto wyjaśnij nieobecność i powiedz, kto będzie przy dziecku wieczorem. Jeśli daty są znane, zaznacz noce w zwykłym kalendarzu. Nie obiecuj codziennej wideorozmowy, jeśli grafik lub internet nie dają takiej pewności.
prepare.source=PBS KIDS for Parents podobnie zaleca wyjaśnienie planu podróży, użycie kalendarza i poproszenie opiekuna o utrzymanie codziennych rytuałów
prepare.source_link=przeczytaj wskazówki przed wyjazdem
figure.alt=Ciepła ilustracja książkowa: opiekun czyta dziecku, obok leżą nagranie i zdjęcie wyjeżdżającego rodzica
figure.caption=Wieczór prowadzi dorosły, który jest obok; znajomy głos lub wiadomość to jedna część rytuału.
plan.kicker=Przed pierwszym wieczorem osobno
plan.title=Przygotuj bajkę na dobranoc w czterech krokach
plan.intro=Ułóż najkrótszy plan, z którego druga osoba naprawdę skorzysta. Jedna gotowa historia jest cenniejsza niż folder niedokończonych nagrań.
plan.1.title=Wybierz jeden stały punkt
plan.1.body=Zostaw w tym samym miejscu znajomy przedmiot, zdanie lub czynność: pasiasty koc, wybór jednej z dwóch bajek albo „Zobaczymy się po śniadaniu”. Ten punkt ma działać także bez kontaktu z wyjeżdżającym rodzicem.
plan.2.title=Wybierz historię
plan.2.body=Sięgnij po opowieść, którą dziecko już lubi, albo przygotuj pełny własny tekst. Połóż książkę tam, gdzie opiekun łatwo ją znajdzie. Nagranie opublikowanej książki zachowaj prywatnie i sprawdź prawa przed udostępnieniem go poza domem.
plan.3.title=Przygotuj jeden udział rodzica na odległość
plan.3.body=Wybierz jedno: rozmowę o ustalonej porze, nagranie całej bajki albo krótkie powitanie i dobranoc. Nazwij plik jasno i sprawdź go na urządzeniu używanym wieczorem.
plan.4.title=Przećwiczcie zwyczajną wersję
plan.4.body=Wypróbujcie plan przed wyjazdem lub nową zmianą. Niech opiekun, który zostaje, zacznie historię i zakończy usypianie. Dziecko zobaczy wtedy, że mimo zmiany ról wieczór ma znajomy początek i koniec.
handoff.title=Zostaw opiekunowi notatkę w pięciu wierszach
handoff.intro=Krótka notatka usuwa drobne decyzje z i tak zajętego wieczoru. Wyślij ją w rozmowie, którą oboje dorośli naprawdę otwierają.
handoff.1.label=1. Początek
handoff.1.text=Bajka po myciu zębów i założeniu piżamy, około 19:40.
handoff.2.label=2. Wybór
handoff.2.text=Zaproponuj książkę o króliku albo opowieść o księżycu; dziś jedna historia.
handoff.3.label=3. Udział rodzica
handoff.3.text=Rozmowa o 19:45. Po jednej nieudanej próbie włącz „Wtorkową bajkę”.
handoff.4.label=4. Ostatnie słowa
handoff.4.text=Po bajce powiedz: „Dobranoc. Jesteśmy tutaj, a potem przyjdzie rano”.
handoff.5.label=5. Jutro
handoff.5.text=Dziecko może wysłać jeden rysunek lub wiadomość głosową; nie trzeba czekać na odpowiedź przed snem.
handoff.body=Dopasuj przykład do waszej rodziny. Liczy się konkret: jeden moment rozpoczęcia, jeden wybór, jeden plan zapasowy i jedno zakończenie. Nie twórz strony zasad, które opiekun ma odegrać idealnie.
options.kicker=Wybieraj według niezawodności, nie nowości
options.title=Rozmowa na żywo, pełne nagranie czy krótka wiadomość?
options.intro=Każdy format ma inne zadanie. Wybierz jeden jako główny na czas wyjazdu, a drugi zachowaj w rezerwie.
option.1.title=Rozmowa na żywo do krótkiego kontaktu
option.1.body=Rozmowa działa, gdy pora jest przewidywalna i dziecko chce interakcji. Przywitaj się, przeczytaj krótki fragment lub zadaj jedno pytanie, a zakończenie wieczoru zostaw osobie w pokoju. Jeśli rozmowy się opóźniają, przenieś je wcześniej.
option.2.title=Pełne nagranie do powtarzalnej bajki
option.2.body=Nagranie jest gotowe mimo stref czasowych i słabego zasięgu. Zachowuje prawdziwe tempo, śmiech i głosy postaci. Nagraj całość wcześniej i raz odsłuchaj na urządzeniu używanym przed snem.
option.3.title=Krótka wiadomość obok czytania opiekuna
option.3.body=Gdy nie ma czasu nagrać książki, wystarczy dziesięć lub dwadzieścia sekund. Opiekun czyta i odtwarza wiadomość w umówionym miejscu. „Mam nadzieję, że dziś wybierzesz opowieść o księżycu” brzmi bliżej niż ogólna przemowa.
options.source=United Through Reading opisuje rozpoczynanie nagrywanego rodzinnego czytania przed służbową rozłąką i włączanie go w powtarzalny rytuał; program służy rodzinom wojskowym, ale sam pomysł przygotowania można dostosować bez utożsamiania wszystkich sytuacji
options.source_link=przeczytaj artykuł o rodzinnym czytaniu
backup.title=Ustal plan na brak połączenia, zanim będzie potrzebny
backup.intro=Nieudana rozmowa zmienia sposób udziału, a nie odwołuje bajki. Ustalcie tę kolejność wcześniej, gdy nikt się nie spieszy.
backup.1.title=Krótko nazwij sytuację
backup.1.body=Opiekun może powiedzieć: „Dziś nie udało się połączyć. Mamy gotową bajkę”. Nie każ dziecku czekać na kolejne próby, gdy robi się coraz później.
backup.2.title=Skorzystaj z przygotowanego zastępstwa
backup.2.body=Włącz pełne nagranie, połącz krótką wiadomość z czytaniem albo kontynuuj tylko z dorosłym na miejscu. Zachowaj ten sam koc, wybór historii i zdanie kończące.
backup.3.title=Zostaw ponowny kontakt na jutro
backup.3.body=Następnego dnia można wysłać rysunek, zdjęcie lub wiadomość głosową. Nie obiecuj dokładnej pory odpowiedzi, której rodzic może znów nie dotrzymać.
return.title=Po powrocie dołącz do rytuału, który trwał dalej
return.body1=Zapytaj dziecko, co mu się podobało, a opiekuna — co rzeczywiście działało. Pierwszy wieczór po powrocie nie wymaga dłuższej bajki ani późniejszego snu. Wróćcie do znajomej kolejności i poczytajcie razem, jeśli macie ochotę.
return.body2=Zachowajcie nagrania, których chcecie słuchać ponownie, i nadajcie im jasne nazwy. Usuńcie nieudane próby i prywatne pliki ze wspólnych czatów oraz niepotrzebnych urządzeń. Małą, uporządkowaną bibliotekę łatwiej wykorzystać następnym razem.
product.eyebrow=W przygotowaniu · iOS i Android
product.title=Twój gotowy tekst do słuchania
product.body=Sleep2Story powstaje po to, by zamieniać pełny tekst bajki dostarczony przez dorosłego w syntetyczną narrację na podstawie próbki głosu dorosłego członka rodziny, za jego zgodą. W aplikacji zaplanowano osobistą bibliotekę opowieści i odtwarzacz. Aplikacja nie pisze bajki ani nie zachowuje oryginalnego nagrania, na którym ta osoba czyta jej słowa.
product.body2=Aplikacja jest jeszcze przygotowywana do wydania. Narracja jest planowana po angielsku i rosyjsku; inne języki strony nie oznaczają obsługi narracji w tych językach. Już teraz możesz napisać rodzinną bajkę, przeczytać ją i nagrać zwykłym dyktafonem w telefonie.
product.cta=Zobacz, jak działa Sleep2Story
faq.title=Pytania o dobranoc, gdy rodzic jest daleko
faq.1.question=Czy wideorozmowa jest lepsza niż nagranie?
faq.1.answer=Wybierz rozmowę, gdy czas i połączenie są pewne, a dziecku zależy na kontakcie. Nagranie sprawdzi się przy strefach czasowych, pracy zmianowej i słabym internecie. Można też krótko porozmawiać wcześniej, a historię odtworzyć przed snem.
faq.2.question=Ile bajek nagrać przed wyjazdem?
faq.2.answer=Zacznij od jednego pełnego, sprawdzonego nagrania i krótkiej wiadomości awaryjnej. Dodawaj kolejne, gdy wiecie, że sposób działa. Niezawodność jest ważniejsza niż duża biblioteka.
faq.3.question=Co powiedzieć, gdy dziecko chce tylko nieobecnego rodzica?
faq.3.answer=Uznaj tę prośbę bez obiecywania niemożliwego: „Chciałeś dziś mamę. Mama wyjechała, a ja jestem z tobą. Posłuchamy jej wiadomości, potem poczytam”. Użyj imion i słów właściwych dla waszej rodziny.
faq.4.question=Czy plan działa między dwoma domami?
faq.4.answer=Tak, jeśli oboje dorośli tego chcą. Ustalcie jeden wspólny sygnał, dostęp do pliku i zdanie na koniec. Reszta wieczornego rytmu może być w każdym domu inna.
faq.5.question=Czy Sleep2Story zastępuje rodzica lub opiekuna?
faq.5.answer=Nie. Obecny dorosły nadal wybiera, zaczyna i kończy rytuał. Sleep2Story powstaje jako jedna z opcji słuchania pełnego tekstu po angielsku lub rosyjsku z próbką głosu dorosłego za jego zgodą; aplikacji nie ma jeszcze w sklepach.
