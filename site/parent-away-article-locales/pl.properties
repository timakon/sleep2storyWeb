nav.backup=Plan na brak połączenia
answer.title=Zachowaj trzy stałe rzeczy: kolejność, sygnał rozpoczęcia bajki i ostatnie słowa.
answer.body=Przed wieczorem ustalcie, czy nieobecny rodzic dołączy na żywo, nagra całą historię czy wyśle krótką wiadomość. Przekaż opiekunowi wybór bajki i dokładne słowa na dobranoc. Miej gotowe sprawdzone nagranie, aby opóźnienie, słaby zasięg albo zmiana grafiku nie decydowały o czytaniu.
