sources.body=PBS wspiera wskazówki o przygotowaniu, kalendarzu i utrzymaniu rytmu dnia. United Through Reading podaje przykłady nagrywania przed rozłąką i stałego rytuału w rodzinach wojskowych. Notatka dla opiekuna, porównanie formatów i plan awaryjny są oryginalnym materiałem redakcyjnym Sleep2Story; żadne źródło nie ocenia Sleep2Story.
