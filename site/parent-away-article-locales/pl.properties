hero.eyebrow=Rodzina na odległość · Poradnik 06
hero.title=Zachowaj znajome czytanie, gdy rodzic jest daleko
hero.dek=Wyjazd służbowy, nocna zmiana lub wieczór w drugim domu zmieniają osobę siedzącą przy łóżku. Krótki plan pozwala zachować opowieść, znajome słowa i rolę dorosłego, który dziś jest obok.
