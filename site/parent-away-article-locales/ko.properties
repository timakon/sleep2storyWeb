sources.utr=United Through Reading: How to Start Family Storytime Traditions, Even Through Deployment
sources.body=PBS는 여행 전 준비와 달력 사용, 일상적인 순서 유지에 관한 제안을 뒷받침합니다. United Through Reading은 군인 가족을 대상으로 떨어져 지내기 전 녹음과 반복되는 이야기 시간의 예를 소개합니다. 인수인계 메모, 방식 비교, 통화를 놓쳤을 때의 계획은 Sleep2Story가 직접 작성한 내용이며 두 출처 모두 Sleep2Story를 평가하지 않았습니다.
