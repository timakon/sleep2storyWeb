prepare.title=아이가 이미 알고 있는 잠자리 순서에서 시작하세요
prepare.body1=집을 떠나는 사람에 맞춰 저녁 전체를 다시 짜지는 마세요. 잠옷 입기, 물 한 잔 마시기, 파란 담요 덮기, 그리고 이야기처럼 이미 이야기 시간을 알리는 순서를 적어 보세요. 집에 있는 어른이 부담 없이 반복할 수 있는 두세 가지면 충분합니다.
prepare.body2=가족의 상황에 맞는 쉬운 말로 왜 함께 있지 못하는지 설명하고, 잠자리에는 누가 곁에 있을지 알려 주세요. 날짜를 안다면 간단한 달력에 해당하는 밤을 표시하세요. 일정과 통신 상태가 확실하지 않다면 매일 저녁 영상 통화를 하겠다고 약속하지 않는 편이 좋습니다.
prepare.source=PBS KIDS for Parents도 여행 계획을 설명하고 달력을 사용하며 돌보는 사람이 일상의 순서를 이어 가도록 권합니다
prepare.source_link=여행 전 준비 팁 읽기
figure.alt=아이가 있는 침대 옆에서 보호자가 책을 읽고, 가까이에 떠나 있는 부모의 녹음과 사진이 놓인 따뜻한 그림책 삽화
figure.caption=집에 있는 어른이 잠자리를 이끕니다. 익숙한 목소리나 메시지는 그 순서의 한 부분입니다.
plan.kicker=떨어져 보내는 첫날 밤 전에
plan.title=네 단계로 잠자리 이야기 계획 세우기
plan.intro=다른 어른이 실제로 쓸 수 있는 가장 간단한 계획을 만드세요. 미완성 녹음 파일이 가득한 폴더보다 믿고 쓸 수 있는 이야기 하나가 낫습니다.
plan.1.title=변하지 않을 것 하나 고르기
plan.1.body=줄무늬 담요, 두 이야기 중 하나 고르기, “아침밥 먹고 보자” 같은 익숙한 물건이나 말, 행동을 매일 같은 자리에 두세요. 떠나 있는 부모와 연결되지 않아도 가능한 것이어야 합니다.
plan.2.title=이야기 고르기
plan.2.body=아이가 이미 좋아하는 이야기나 완성된 창작 이야기 글 하나를 준비하세요. 돌봄을 맡은 사람이 쉽게 찾을 수 있는 곳에 책이나 글을 두세요. 출판된 책을 녹음한다면 가족끼리만 듣고, 집 밖에 공유하기 전에는 권리를 확인하세요.
plan.3.title=떠나 있는 부모가 할 일 하나 준비하기
plan.3.body=정해진 시간의 통화, 이야기 전체 녹음, 짧은 안부와 잘 자라는 메시지 중 하나를 고르세요. 파일 이름을 알아보기 쉽게 짓고 잠자리에 사용할 기기에서 재생되는지 확인하세요.
plan.4.title=평소 방식으로 한번 연습하기
plan.4.body=여행이나 새 근무가 시작되기 전에 그 순서대로 한번 해 보세요. 집에 있는 어른이 이야기를 시작하고 잠자리 인사로 마무리하도록 하세요. 그러면 역할이 바뀌어도 잠자리에는 시작과 끝이 있다는 것을 아이가 알 수 있습니다.
handoff.title=돌봄을 맡은 사람에게 다섯 줄짜리 메모를 남기세요
handoff.intro=작은 결정을 미리 적어 두면 바쁜 저녁이 한결 수월해집니다. 두 어른이 실제로 확인하는 메시지 대화방에 보내 두세요.
handoff.1.label=1. 시작
handoff.1.text=양치질하고 잠옷을 입은 뒤, 7시 40분쯤 이야기를 시작해요.
handoff.2.label=2. 선택
handoff.2.text=토끼 책과 달 이야기 중 하나를 고르게 해 주세요. 오늘 밤엔 한 편만 읽어요.
handoff.3.label=3. 떠나 있는 부모의 몫
handoff.3.text=7시 45분에 통화해요. 한 번 걸어도 받지 않으면 ‘화요일 이야기’를 재생해 주세요.
handoff.4.label=4. 마무리 인사
handoff.4.text=이야기가 끝나면 “잘 자. 우리는 여기 있고, 자고 나면 아침이 올 거야”라고 말해 주세요.
handoff.5.label=5. 내일
handoff.5.text=아이가 그림이나 음성 메시지 하나를 보낼 수 있어요. 잠들기 전 답장을 기다릴 필요는 없어요.
handoff.body=예시는 가족의 실제 생활에 맞게 바꾸세요. 중요한 것은 시작할 때, 고를 것, 대안, 끝맺음을 분명히 적는 것입니다. 보호자가 완벽하게 따라야 할 긴 규칙 목록을 만들 필요는 없습니다.
options.kicker=새로움보다 믿을 수 있는 방법을
options.title=실시간 통화, 전체 녹음, 짧은 메시지 중 무엇이 좋을까요?
options.intro=각 방법의 쓰임이 다릅니다. 떨어져 있는 동안 주로 쓸 방법 하나를 고르고 다른 하나를 대안으로 준비하세요.
option.1.title=짧은 대화가 필요하면 실시간 통화
option.1.body=통화 시간이 예측 가능하고 아이가 주고받는 대화를 원할 때 적합합니다. 인사를 하고 짧은 부분을 읽거나 질문 하나를 한 뒤, 방에 있는 어른이 잠자리를 마무리하게 하세요. 통화가 자주 늦어진다면 저녁의 더 이른 시간으로 옮기세요.
option.2.title=반복해서 듣고 싶다면 이야기 전체 녹음
option.2.body=녹음은 시간대가 다르거나 통신 상태가 좋지 않아도 재생할 수 있습니다. 부모가 실제로 읽는 속도와 웃음, 등장인물의 목소리도 남길 수 있지요. 이야기 전체를 미리 녹음하고, 잠자리에 쓸 기기에서 한번 들어 보세요.
option.3.title=보호자가 책을 읽을 때 곁들이는 짧은 메시지
option.3.body=책 한 권을 녹음할 시간이 없다면 10~20초짜리 인사만으로도 충분할 수 있습니다. 보호자가 이야기를 읽고 정해 둔 때에 메시지를 들려주세요. “오늘 밤엔 달 이야기를 골랐으면 좋겠어”처럼 구체적인 말이 일반적인 인사보다 더 가깝게 느껴집니다.
options.source=United Through Reading은 가족이 떨어지기 전에 이야기 녹음을 시작하고 이를 반복 가능한 잠자리 습관에 넣는 방법을 소개합니다. 해당 프로그램은 군인 가족을 위한 것이지만 준비 방식은 각 가족의 사정에 맞게 참고할 수 있습니다
options.source_link=가족 이야기 시간에 관한 글 읽기
backup.title=통화를 놓쳤을 때의 계획을 미리 적어 두세요
backup.intro=통화가 안 되더라도 이야기를 취소할 필요는 없습니다. 모두가 차분할 때 다음 순서를 정해 두세요.
backup.1.title=무슨 일이 있었는지 짧게 말하기
backup.1.body=보호자는 “오늘은 통화가 안 됐네. 대신 준비한 이야기가 있어”라고 말할 수 있습니다. 잠자는 시간이 늦어지도록 계속 전화를 거는 동안 아이를 기다리게 하지 마세요.
backup.2.title=준비한 대안 사용하기
backup.2.body=전체 녹음을 재생하거나, 짧은 메시지를 들려준 뒤 책을 읽거나, 집에 있는 보호자가 혼자 이야기를 이어 가세요. 담요와 이야기 선택, 마지막 인사는 그대로 두세요.
backup.3.title=다시 연락하는 일은 내일로 미루기
backup.3.body=가족이 원한다면 다음 날 그림이나 사진, 음성 메시지를 보내세요. 떠나 있는 부모가 또 놓칠 수 있는 정확한 답장 시간을 약속하지는 마세요.
return.title=부모가 돌아오면 그동안 이어 온 순서에 다시 함께하세요
return.body1=아이가 무엇을 좋아했는지 묻고, 돌봄을 맡았던 사람에게 실제로 무엇이 잘됐는지 들어 보세요. 돌아온 첫날이라고 더 긴 이야기를 읽거나 잠자리를 늦출 필요는 없습니다. 익숙한 순서에 다시 참여하고 자연스럽다면 함께 읽어 주세요.
return.body2=가족이 다시 듣고 싶은 녹음은 알아보기 쉽게 이름을 바꿔 저장하세요. 실패한 시험 녹음과 더 이상 필요 없는 개인 파일은 공유 채팅이나 기기에서 삭제하세요. 작고 정돈된 보관함이 다음에 떨어져 지낼 때 더 쓰기 쉽습니다.
product.eyebrow=출시 준비 중 · iOS 및 Android
product.title=완성된 글을 들을 수 있도록 준비합니다
product.body=Sleep2Story는 성인이 제공한 이야기 전체 글과 동의한 성인 가족의 목소리 샘플을 이용해 합성 낭독을 만드는 앱으로 개발 중입니다. 계획된 앱에는 개인 이야기 보관함과 플레이어가 포함됩니다. 그 성인이 이야기 전체를 직접 읽은 원본 음성을 보존하는 것은 아닙니다.
product.body2=앱은 아직 출시 준비 중입니다. 부모가 직접 읽은 모습을 소리 그대로 간직하고 싶다면 휴대전화로 이야기 전체를 녹음하세요.
product.cta=Sleep2Story 이용 방법 보기
faq.title=부모가 집을 비운 날의 잠자리에 관한 질문
faq.1.question=영상 통화가 녹음보다 나은가요?
faq.1.answer=아이와 주고받는 대화가 필요하고 통화 시간을 지킬 수 있다면 통화가 좋습니다. 시간대나 일, 통신 상태 때문에 통화가 끊길 수 있다면 녹음을 쓰세요. 이른 저녁에 짧게 통화하고 잠자리에는 녹음을 들려주는 방법도 있습니다.
faq.2.question=여행 전에 이야기를 몇 편 녹음해야 하나요?
faq.2.answer=완성해서 재생까지 확인한 녹음 하나와 짧은 대안 메시지 하나부터 시작하세요. 가족에게 잘 맞는지 확인한 다음 더해도 됩니다. 많은 파일보다 믿고 쓸 수 있는 파일이 중요합니다.
faq.3.question=아이가 떠나 있는 부모만 찾으면 어떻게 하나요?
faq.3.answer=부모가 지금 나타날 수 있는 것처럼 말하지 말고 마음을 인정해 주세요. “오늘은 엄마가 보고 싶구나. 엄마는 지금 다른 곳에 있고, 나는 여기 너와 함께 있어. 엄마 목소리를 듣고 내가 책을 읽어 줄게.” 가족에게 맞는 호칭과 말을 쓰세요.
faq.4.question=두 집을 오가는 아이에게도 같은 방법이 통할까요?
faq.4.answer=두 어른이 모두 원한다면 가능합니다. 공통으로 쓸 작은 신호와 파일 접근 방법, 마지막 인사를 정하세요. 나머지 잠자리 순서는 집마다 달라도 괜찮습니다. 취침 시간이나 집안 규칙까지 똑같을 필요는 없습니다.
faq.5.question=Sleep2Story가 잠자리에서 부모나 보호자를 대신하나요?
faq.5.answer=아니요. 곁에 있는 어른이 여전히 이야기를 고르고 시작하며 잠자리를 마무리합니다. Sleep2Story는 성인이 제공한 이야기 전체 글과 동의한 성인의 목소리 샘플로 듣는 방법 하나를 준비 중이며, 아직 앱 스토어에 출시되지 않았습니다.
