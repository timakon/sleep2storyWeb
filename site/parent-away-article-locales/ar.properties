sources.body=تدعم PBS نصائح التحضير والتقويم والروتين. وتقدّم United Through Reading أمثلة لتسجيل الحكايات قبل البعد والطقوس المسائية لدى العائلات العسكرية. ملاحظة التسليم ومقارنة الوسائل وخطة المكالمة الفائتة مواد تحريرية أصلية من Sleep2Story؛ ولا يقيّم أيٌّ من المصدرين التطبيق.
