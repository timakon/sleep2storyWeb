answer.title=ثبّت ثلاثة أمور: الترتيب، وإشارة بدء الحكاية، وكلمات الختام.
answer.body=قرّر قبل المساء هل سيشارك الوالد البعيد مباشرةً، أم يترك تسجيلًا كاملًا، أم يرسل رسالة قصيرة. أعطِ الشخص الموجود في المنزل خيار الحكاية وعبارة تصبح على خير كما تقولونها عادةً. واحتفظ ببديل جاهز للتشغيل حتى لا يحدد تأخر القطار أو ضعف الاتصال أو تغيّر المناوبة وقت نوم الطفل.
