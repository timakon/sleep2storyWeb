prepare.title=ابدأ بروتين النوم الذي يعرفه طفلك
prepare.body1=لا تُعِد بناء المساء كله حول الشخص الذي سيغيب. دوّن الجزء الذي يشير إلى بدء الحكاية بالفعل: ملابس النوم، ورشفة ماء، والبطانية الزرقاء، ثم الحكاية. اختر تفصيلين أو ثلاثة يستطيع الشخص الموجود في المنزل تكرارها من غير تحويل النوم إلى أداء مرهق.
prepare.body2=اشرح الغياب بكلمات بسيطة تناسب وضع عائلتكم، وقل للطفل مَن سيكون معه عند النوم. إذا كانت المواعيد معروفة، فضع علامة على الليالي في تقويم بسيط. تجنّب الوعد بمكالمة مباشرة كل مساء ما لم يكن الوقت والاتصال موثوقين فعلًا.
prepare.source=تقترح PBS KIDS للوالدين أيضًا شرح خطط السفر واستخدام التقويم وطلب الحفاظ على الروتين اليومي من مقدّم الرعاية
prepare.source_link=اقرأ نصائح التحضير للسفر
figure.alt=رسم قصصي دافئ لمقدّم رعاية يقرأ بجانب طفل، مع تسجيل وصورة للوالد المسافر بالقرب منهما
figure.caption=الشخص البالغ الموجود في المنزل يقود وقت النوم؛ ويكون الصوت المألوف أو الرسالة جزءًا من الروتين.
plan.kicker=قبل أول ليلة من البعد
plan.title=حضّر خطة الحكاية في أربع خطوات
plan.intro=ضع أبسط خطة يستطيع شخص بالغ آخر اتباعها. حكاية موثوقة واحدة أنفع من مجلد مليء بتسجيلات غير مكتملة.
plan.1.title=اختر علامة ثابتة
plan.1.body=أبقِ شيئًا أو جملة أو خطوة مألوفة في موضعها كل ليلة: البطانية المخططة، أو الاختيار بين حكايتين، أو «أراك بعد الفطور». ينبغي أن تنجح هذه العلامة حتى لو تعذّر اتصال الوالد البعيد.
plan.2.title=اختر الحكاية
plan.2.body=استخدم حكاية يحبها الطفل بالفعل، أو أعدّ نصًا أصليًا كاملًا. ضع الكتاب أو النص في متناول مقدّم الرعاية. إذا سجّلت كتابًا منشورًا، فاحتفظ بالتسجيل خاصًا وتحقّق من الحقوق قبل مشاركته خارج المنزل.
plan.3.title=حضّر مشاركة واحدة من الوالد البعيد
plan.3.body=اختر واحدة: مكالمة بموعد محدد، أو تسجيلًا للحكاية كاملة، أو رسالة تحية وتصبح على خير قصيرة. سمِّ الملف بوضوح واختبره على الجهاز الذي سيُستخدم عند النوم.
plan.4.title=جرّب النسخة العادية من الروتين
plan.4.body=جرّب الخطوات مرة قبل الرحلة أو المناوبة الجديدة. دع الشخص الموجود في المنزل يبدأ الحكاية ويختم وقت النوم. هكذا يرى الطفل أن الروتين لا يزال له بداية ونهاية حتى عندما تتبدّل الأدوار.
handoff.title=أعطِ مقدّم الرعاية ملاحظة من خمسة أسطر
handoff.intro=تخفّف الملاحظة القرارات الصغيرة في مساء مزدحم أصلًا. أرسلها في المحادثة التي يفتحها الشخصان البالغان بالفعل.
handoff.1.label=1. البداية
handoff.1.text=تبدأ الحكاية بعد غسل الأسنان وارتداء ملابس النوم، نحو الساعة 7:40.
handoff.2.label=2. الاختيار
handoff.2.text=اعرض كتاب الأرنب أو حكاية القمر؛ حكاية واحدة الليلة.
handoff.3.label=3. دور الوالد البعيد
handoff.3.text=المكالمة الساعة 7:45. إذا لم يردّ بعد محاولة واحدة، شغّل «حكاية الثلاثاء».
handoff.4.label=4. كلمات الختام
handoff.4.text=بعد الحكاية قل: «تصبح على خير. نحن هنا معك، وسيأتي الصباح».
handoff.5.label=5. الغد
handoff.5.text=يمكن للطفل إرسال رسمة أو رسالة صوتية واحدة؛ لا يلزم ردّ قبل النوم.
handoff.body=عدّل المثال ليلائم روتينكم الحقيقي. المفيد فيه هو الوضوح: نقطة بداية واحدة، وخيار واحد، وبديل واحد، ونهاية واحدة. لا تجعل الملاحظة صفحة قواعد يُطالَب مقدّم الرعاية بتطبيقها بحذافيرها.
options.kicker=اختر بحسب الموثوقية، لا الجِدّة
options.title=مكالمة مباشرة أم تسجيل كامل أم رسالة قصيرة؟
options.intro=لكل طريقة دور مختلف. اختر طريقة أساسية للرحلة واحتفظ بأخرى بديلة.
option.1.title=استخدم المكالمة المباشرة لحديث قصير
option.1.body=تنجح المكالمة حين يمكن الاعتماد على موعدها ويرغب الطفل في التفاعل. اجعلها بسيطة: تحية، ومقطع قصير أو سؤال واحد، ثم دع الشخص الموجود في الغرفة يختم وقت النوم. إذا كانت المكالمات تتأخر عادةً، فاجعلها في وقت أبكر من المساء.
option.2.title=استخدم التسجيل الكامل لحكاية قابلة للإعادة
option.2.body=يكون التسجيل جاهزًا رغم فروق التوقيت وضعف الاتصال. كما يحتفظ بإيقاع الوالد الحقيقي وضحكته وأصوات الشخصيات. سجّل الحكاية كاملة مسبقًا واستمع إليها مرة على جهاز وقت النوم قبل الاعتماد عليها.
option.3.title=أضف رسالة قصيرة إلى قراءة مقدّم الرعاية
option.3.body=قد تكفي تحية من عشر أو عشرين ثانية حين لا يتوفر وقت لتسجيل كتاب. يقرأ مقدّم الرعاية الحكاية ثم يشغّل الرسالة في الموضع المتفق عليه. جملة محددة مثل «أتمنى أن تختار حكاية القمر الليلة» أقرب من خطاب عام.
options.source=تصف منظمة United Through Reading بدء تسجيل الحكايات العائلية قبل غياب أحد الوالدين وإدخالها في طقس متكرر؛ يخدم برنامجها العائلات العسكرية، لكن يمكن تكييف فكرة الاستعداد من دون افتراض تطابق ظروف جميع العائلات
options.source_link=اقرأ مقال الحكايات العائلية
backup.title=اكتب خطة المكالمة الفائتة قبل الحاجة إليها
backup.intro=ينبغي أن يغيّر تعذّر المكالمة الوسيلة، لا أن يلغي الحكاية. اتفقوا على الخطوات التالية والجميع هادئ.
backup.1.title=اشرح ما حدث باختصار
backup.1.body=يمكن لمقدّم الرعاية أن يقول: «لم تنجح المكالمة الليلة. الحكاية جاهزة لدينا». لا تُبقِ الطفل منتظرًا وسط محاولات اتصال متكررة بينما يتأخر النوم.
backup.2.title=استخدم البديل الذي أعددتموه
backup.2.body=شغّل التسجيل الكامل، أو شغّل الرسالة القصيرة واقرأ الكتاب، أو دع مقدّم الرعاية يكمل وحده. احتفظ بالبطانية نفسها وخيار الحكاية وكلمات الختام.
backup.3.title=اترك التواصل من جديد إلى الغد
backup.3.body=أرسلوا رسمة أو صورة أو رسالة صوتية في اليوم التالي إذا أرادت العائلة. تجنّب الوعد بوقت محدد للرد قد يفوته الوالد البعيد مجددًا.
return.title=حين يعود الوالد، ينضم إلى الروتين الذي استمر
return.body1=اسأل عمّا أعجب الطفل ودع مقدّم الرعاية يشرح ما نجح بالفعل. لا تحتاج أول ليلة بعد العودة إلى حكاية أكبر أو نوم متأخر. عُد إلى الترتيب المألوف واقرآ معًا إذا بدا ذلك طبيعيًا.
return.body2=احتفظوا بأي تسجيل تريد العائلة سماعه من جديد وسمّوه بوضوح. احذفوا التجارب الفاشلة والملفات الخاصة من المحادثات أو الأجهزة المشتركة التي لم تعد تحتاجها. المكتبة الصغيرة المرتّبة أسهل في الليلة المقبلة بعيدًا عن المنزل.
product.eyebrow=قيد التحضير · iOS وAndroid
product.title=نصك الكامل، يُجهَّز للاستماع
product.body=يُطوَّر Sleep2Story لتحويل النص الكامل للحكاية الذي يقدّمه شخص بالغ إلى سرد صوتي اصطناعي باستخدام عيّنة من صوت أحد أفراد العائلة البالغين بموافقته. يتضمن التطبيق المخطّط له مكتبة حكايات شخصية ومشغّلًا. وهو لا يحتفظ بأداء ذلك الشخص الأصلي للحكاية.
product.body2=لا يزال التطبيق قيد التجهيز للنشر. إذا أردت الاحتفاظ بقراءة الوالد نفسها كتذكار، فسجّل الحكاية كاملة بالهاتف.
product.cta=تعرّف إلى Sleep2Story
faq.title=أسئلة عن وقت النوم أثناء غياب أحد الوالدين
faq.1.question=هل مكالمة الفيديو أفضل من التسجيل؟
faq.1.answer=استخدم المكالمة عندما تكون المشاركة والموعد موثوقين. واستخدم التسجيل عندما قد تعيق فروق التوقيت أو العمل أو الشبكة المكالمة. ويمكن لعائلات كثيرة الجمع بين تحية مباشرة قصيرة في وقت أبكر وتسجيل عند وقت الحكاية.
faq.2.question=كم حكاية ينبغي تسجيلها قبل السفر؟
faq.2.answer=ابدأ بتسجيل كامل واحد جُرّب تشغيله ورسالة قصيرة بديلة. أضف المزيد فقط بعد أن تعرف العائلة أن الإعداد يعمل. الموثوقية أهم من مكتبة كبيرة.
faq.3.question=ماذا لو طلب الطفل الوالد الغائب وحده؟
faq.3.answer=اعترف برغبته من غير التظاهر بأن الوالد يمكنه الظهور فورًا: «كنت تريد أمك الليلة. هي بعيدة الآن، وأنا هنا معك. يمكننا سماع رسالتها، ثم أقرأ لك». استخدموا الأسماء والكلمات التي تناسب عائلتكم.
faq.4.question=هل تصلح الخطة بين منزلين؟
faq.4.answer=نعم، إذا أراد الشخصان البالغان ذلك. اتفقا على إشارة صغيرة مشتركة، وإمكانية الوصول إلى الملف، وعبارة ختام. يمكن لكل منزل الاحتفاظ ببقية روتينه؛ فلا تتطلب الخطة تطابق وقت النوم أو قواعد البيت.
faq.5.question=هل يحل Sleep2Story محل الوالد أو مقدّم الرعاية عند النوم؟
faq.5.answer=لا. يظل الشخص البالغ الحاضر هو من يختار الروتين ويبدأه ويختمه. يُجهَّز Sleep2Story كخيار للاستماع إلى نص حكاية كامل بعينة من صوت بالغ وافق على استخدامها؛ ولم يُنشر بعد في متاجر التطبيقات.
