prepare.title=Beginnen Sie mit dem Abend, den Ihr Kind schon kennt
prepare.body1=Bauen Sie den ganzen Abend nicht um die abreisende Person herum. Schreiben Sie den Teil auf, der bereits die Geschichte ankündigt: Schlafanzug, ein Schluck Wasser, die blaue Decke, dann Vorlesen. Wählen Sie zwei oder drei Details, die die Person zu Hause ohne Inszenierung wiederholen kann.
prepare.body2=Erklären Sie die Abwesenheit in einfachen Worten und sagen Sie, wer abends da sein wird. Sind die Daten bekannt, markieren Sie die Nächte in einem schlichten Kalender. Versprechen Sie keinen täglichen Videoanruf, wenn Arbeitsplan oder Verbindung ihn nicht zuverlässig zulassen.
prepare.source=PBS KIDS for Parents empfiehlt ebenfalls, die Reise vorab zu erklären, einen Kalender zu nutzen und die Betreuungsperson zu bitten, tägliche Abläufe beizubehalten
prepare.source_link=Tipps zur Reisevorbereitung lesen
figure.alt=Warme Bilderbuchszene: Eine Betreuungsperson liest einem Kind vor, daneben liegen Aufnahme und Foto des verreisten Elternteils
figure.caption=Die anwesende Person führt durch den Abend; die vertraute Stimme oder Nachricht ist ein Teil des Ablaufs.
plan.kicker=Vor dem ersten Abend getrennt
plan.title=Den Vorleseplan in vier Schritten vorbereiten
plan.intro=Erstellen Sie den kleinsten Plan, den eine andere Person wirklich nutzen kann. Eine fertige Geschichte hilft mehr als ein Ordner voller unfertiger Aufnahmen.
plan.1.title=Einen Anker wählen
plan.1.body=Lassen Sie einen vertrauten Gegenstand, Satz oder Schritt jeden Abend an derselben Stelle: die gestreifte Decke, die Wahl zwischen zwei Geschichten oder „Wir sehen uns nach dem Frühstück“. Der Anker muss auch ohne Verbindung funktionieren.
plan.2.title=Die Geschichte auswählen
plan.2.body=Nehmen Sie eine Geschichte, die das Kind schon mag, oder schreiben Sie einen vollständigen eigenen Text. Legen Sie Buch oder Text gut auffindbar bereit. Eine Aufnahme eines veröffentlichten Buches bleibt privat; vor einer Weitergabe außerhalb des Haushalts sind die Rechte zu prüfen.
plan.3.title=Einen Beitrag des abwesenden Elternteils vorbereiten
plan.3.body=Wählen Sie eine Form: einen Anruf zu fester Zeit, die Aufnahme der ganzen Geschichte oder eine kurze Hallo-und-Gute-Nacht-Nachricht. Benennen Sie die Datei eindeutig und testen Sie sie auf dem Gerät für den Abend.
plan.4.title=Die gewöhnliche Variante einmal proben
plan.4.body=Probieren Sie den Ablauf vor der Reise oder der neuen Schicht aus. Die Person, die zu Hause bleibt, beginnt die Geschichte und beendet das Zubettgehen. So erlebt das Kind, dass der Abend trotz anderer Rollen Anfang und Ende behält.
handoff.title=Eine Übergabenotiz in fünf Zeilen
handoff.intro=Eine kurze Notiz nimmt einem ohnehin vollen Abend kleine Entscheidungen ab. Senden Sie sie in dem Chat, den beide Erwachsenen tatsächlich öffnen.
handoff.1.label=1. Beginn
handoff.1.text=Geschichte nach Zähneputzen und Schlafanzug, etwa um 19:40 Uhr.
handoff.2.label=2. Auswahl
handoff.2.text=Hasenbuch oder Mondgeschichte anbieten; heute eine Geschichte.
handoff.3.label=3. Beitrag des Elternteils
handoff.3.text=Anruf um 19:45 Uhr. Nach einem erfolglosen Versuch „Dienstagsgeschichte“ abspielen.
handoff.4.label=4. Letzte Worte
handoff.4.text=Nach der Geschichte sagen: „Gute Nacht. Wir sind hier, und als Nächstes kommt der Morgen.“
handoff.5.label=5. Morgen
handoff.5.text=Das Kind kann ein Bild oder eine Sprachnachricht schicken; vor dem Einschlafen muss keine Antwort kommen.
handoff.body=Passen Sie das Beispiel an Ihren Alltag an. Entscheidend ist die Klarheit: ein Startpunkt, eine Auswahl, ein Ersatz und ein Abschluss. Machen Sie daraus keine Seite voller Regeln, die perfekt nachgespielt werden muss.
options.kicker=Nach Verlässlichkeit wählen, nicht nach Neuheit
options.title=Live-Anruf, vollständige Aufnahme oder kurze Nachricht?
options.intro=Jedes Format erfüllt eine andere Aufgabe. Wählen Sie eines als Hauptweg für die Reise und ein zweites als Ersatz.
option.1.title=Ein Live-Anruf für ein kurzes Gespräch
option.1.body=Ein Anruf passt, wenn die Zeit vorhersehbar ist und das Kind Austausch möchte. Kurz begrüßen, einen Abschnitt lesen oder eine Frage stellen; den Abend beendet die Person im Zimmer. Wenn Anrufe oft spät werden, legen Sie sie früher.
option.2.title=Eine vollständige Aufnahme für eine wiederholbare Geschichte
option.2.body=Eine Aufnahme funktioniert trotz Zeitzonen und schwacher Verbindung. Sie bewahrt das echte Tempo, Lachen und die Figurenstimmen. Nehmen Sie die ganze Geschichte vorher auf und hören Sie sie einmal auf dem später verwendeten Gerät an.
option.3.title=Eine kurze Nachricht neben dem Vorlesen der Betreuungsperson
option.3.body=Wenn keine Zeit für ein ganzes Buch ist, reichen zehn oder zwanzig Sekunden. Die Betreuungsperson liest und spielt die Nachricht an der vereinbarten Stelle ab. „Ich hoffe, du wählst heute die Mondgeschichte“ wirkt verbundener als eine allgemeine Ansprache.
options.source=United Through Reading beschreibt, wie aufgezeichnete Familienlesezeit vor einem Einsatz beginnt und Teil eines wiederkehrenden Rituals wird; das Programm richtet sich an Militärfamilien, die Vorbereitungsidee lässt sich jedoch ohne Gleichsetzung der Lebenslagen anpassen
options.source_link=Beitrag zur Familienlesezeit lesen
backup.title=Den Plan für einen verpassten Anruf vorher festlegen
backup.intro=Ein verpasster Anruf ändert den Weg, nicht die Geschichte. Vereinbaren Sie die folgende Reihenfolge, solange alle ruhig sind.
backup.1.title=Kurz benennen, was passiert ist
backup.1.body=Die Betreuungsperson kann sagen: „Der Anruf hat heute nicht geklappt. Die Geschichte ist bereit.“ Lassen Sie das Kind nicht auf wiederholte Wahlversuche warten, während es immer später wird.
backup.2.title=Den vorbereiteten Ersatz nutzen
backup.2.body=Spielen Sie die vollständige Aufnahme, kombinieren Sie die kurze Nachricht mit Vorlesen oder machen Sie nur mit der anwesenden Person weiter. Decke, Auswahl und Abschlusssatz bleiben gleich.
backup.3.title=Die nächste Verbindung auf morgen verschieben
backup.3.body=Am nächsten Tag kann die Familie ein Bild, Foto oder eine Sprachnachricht schicken. Versprechen Sie keine genaue Antwortzeit, die erneut verpasst werden könnte.
return.title=Wenn der Elternteil zurück ist, steigt er in den weitergeführten Ablauf ein
return.body1=Fragen Sie, was dem Kind gefallen hat, und lassen Sie sich erzählen, was tatsächlich funktioniert hat. Der erste Abend zurück braucht weder eine längere Geschichte noch eine spätere Schlafenszeit. Kehren Sie in die vertraute Reihenfolge zurück und lesen Sie gemeinsam, wenn es passt.
return.body2=Bewahren Sie gewünschte Aufnahmen unter klaren Namen auf. Löschen Sie Fehlversuche und private Dateien aus gemeinsamen Chats oder von Geräten, die sie nicht mehr brauchen. Eine kleine ordentliche Bibliothek ist beim nächsten Abstand leichter nutzbar.
product.eyebrow=In Vorbereitung · iOS und Android
product.title=Ihr fertiger Text wird zur Hörgeschichte
product.body=Sleep2Story wird entwickelt, um den vollständigen Text, den ein Erwachsener bereitstellt, in eine synthetisch erzeugte Hörfassung umzuwandeln. Grundlage ist die Stimmprobe eines erwachsenen Familienmitglieds, das der Nutzung zugestimmt hat. Die geplante App umfasst eine persönliche Geschichtenbibliothek und einen Audioplayer. Sie schreibt die Geschichte nicht und bewahrt auch keine Originalaufnahme, in der dieser Erwachsene den gesamten Text vorgelesen hat.
product.body2=Die App wird noch für die Veröffentlichung vorbereitet. Die Sprachausgabe ist für Englisch und Russisch geplant. Die weiteren Sprachen der Website bedeuten nicht, dass die App Geschichten in diesen Sprachen vertont. Ihre Familiengeschichte können Sie schon jetzt schreiben, vorlesen und ganz normal mit dem Handy aufnehmen.
product.cta=So funktioniert Sleep2Story
faq.title=Fragen zur Vorlesezeit, wenn ein Elternteil weg ist
faq.1.question=Ist ein Videoanruf besser als eine Aufnahme?
faq.1.answer=Ein Anruf passt bei verlässlicher Zeit und gewünschtem Austausch. Eine Aufnahme hilft bei Zeitzonen, Arbeit oder schwachem Empfang. Möglich ist auch ein kurzes Live-Hallo früher und die Aufnahme zur Vorlesezeit.
faq.2.question=Wie viele Geschichten sollten wir vor einer Reise aufnehmen?
faq.2.answer=Beginnen Sie mit einer vollständigen, getesteten Aufnahme und einer kurzen Ersatznachricht. Mehr kommt erst hinzu, wenn die Familie weiß, dass der Ablauf funktioniert. Verlässlichkeit ist wichtiger als Menge.
faq.3.question=Was, wenn das Kind nur nach dem abwesenden Elternteil fragt?
faq.3.answer=Bestätigen Sie den Wunsch, ohne Unmögliches zu versprechen: „Du wolltest heute Mama. Sie ist weg, und ich bin bei dir. Wir hören ihre Nachricht, dann lese ich.“ Verwenden Sie die Namen und Worte Ihrer Familie.
faq.4.question=Funktioniert der Plan auch zwischen zwei Zuhause?
faq.4.answer=Ja, wenn beide Erwachsenen das möchten. Vereinbaren Sie einen gemeinsamen Anker, den Dateizugriff und einen Abschlusssatz. Der restliche Ablauf darf in jedem Zuhause anders sein.
faq.5.question=Ersetzt Sleep2Story einen Elternteil oder eine Betreuungsperson?
faq.5.answer=Nein. Die anwesende Person wählt, beginnt und beendet den Ablauf. Sleep2Story wird als Hörmöglichkeit für vollständige englische oder russische Texte mit der Stimmprobe eines zustimmenden Erwachsenen vorbereitet und ist noch nicht in App-Stores erhältlich.
