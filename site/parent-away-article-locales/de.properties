schema.description=Praktischer Ratgeber für eine vertraute Vorlesezeit, wenn ein Elternteil verreist, nachts arbeitet oder an einem anderen Ort lebt.
hero.eyebrow=Familienzeit auf Abstand · Ratgeber 06
hero.title=So bleibt die Vorlesezeit vertraut, wenn ein Elternteil weg ist
hero.dek=Dienstreise, Nachtschicht oder ein Abend im anderen Zuhause verändern, wer am Bett sitzt. Ein kleiner Plan bewahrt die Geschichte, vertraute Worte und die Rolle der Person, die heute da ist.
byline.read_time=8 Minuten Lesezeit
byline.date=19. September 2026
nav.plan=Plan in vier Schritten
nav.options=Anruf oder Aufnahme
nav.backup=Plan bei verpasstem Anruf
answer.title=Drei Dinge bleiben gleich: die Reihenfolge, das Signal für die Geschichte und die letzten Worte.
answer.body=Entscheiden Sie vor dem Abend, ob der abwesende Elternteil live dabei ist, die ganze Geschichte aufnimmt oder eine kurze Nachricht schickt. Geben Sie der Person zu Hause die Buchauswahl und den genauen Gute-Nacht-Satz. Halten Sie eine getestete Aufnahme bereit, damit Verspätung, schlechter Empfang oder Schichtwechsel nicht über die Vorlesezeit entscheiden.
