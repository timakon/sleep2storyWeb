prepare.title=Begin bij de avond die je kind al kent
prepare.body1=Bouw niet de hele avond om rond degene die vertrekt. Schrijf het deel op dat het verhaal al aankondigt: pyjama, een slok water, de blauwe deken en dan lezen. Kies twee of drie details die de volwassene thuis eenvoudig kan herhalen.
prepare.body2=Leg de afwezigheid in gewone woorden uit en vertel wie er bij bedtijd is. Zijn de data bekend, kruis de nachten dan aan op een eenvoudige kalender. Beloof geen dagelijks videogesprek als planning of verbinding dat niet betrouwbaar maken.
prepare.source=PBS KIDS for Parents raadt eveneens aan om de reis uit te leggen, een kalender te gebruiken en de verzorger te vragen de dagelijkse routine voort te zetten
prepare.source_link=lees de voorbereidingstips
figure.alt=Warme boekillustratie: een verzorger leest een kind voor, met een opname en de foto van de ouder op afstand in de buurt
figure.caption=De volwassene in de kamer leidt bedtijd; een vertrouwde stem of boodschap is één onderdeel van de routine.
plan.kicker=Voor de eerste avond apart
plan.title=Bereid het bedtijdverhaal in vier stappen voor
plan.intro=Maak het kleinste plan dat een ander echt kan gebruiken. Eén af verhaal is nuttiger dan een map vol halve opnamen.
plan.1.title=Kies één anker
plan.1.body=Laat een vertrouwd voorwerp, zinnetje of gebaar op dezelfde plek terugkomen: de gestreepte deken, kiezen uit twee verhalen of ‘Tot na het ontbijt’. Het anker moet ook zonder contact werken.
plan.2.title=Kies het verhaal
plan.2.body=Neem een verhaal dat je kind al graag hoort of schrijf een complete eigen tekst. Leg boek of tekst waar de verzorger die meteen vindt. Houd een opname van een uitgegeven boek privé en controleer de rechten voor je die buiten het huishouden deelt.
plan.3.title=Bereid één bijdrage van de ouder op afstand voor
plan.3.body=Kies één vorm: een gesprek op een afgesproken tijd, een opname van het hele verhaal of een korte hallo-en-welterustenboodschap. Geef het bestand een duidelijke naam en test het op het bedtijdapparaat.
plan.4.title=Oefen de gewone versie één keer
plan.4.body=Probeer de routine vóór de reis of nieuwe dienst. Laat de volwassene die thuisblijft het verhaal beginnen en bedtijd afsluiten. Zo ziet het kind dat de avond ook bij andere rollen een bekend begin en einde heeft.
handoff.title=Laat een overdrachtsbriefje van vijf regels achter
handoff.intro=Een kort briefje haalt kleine beslissingen uit een al drukke avond. Stuur het in het gesprek dat beide volwassenen werkelijk openen.
handoff.1.label=1. Begin
handoff.1.text=Verhaal na tandenpoetsen en pyjama, rond 19.40 uur.
handoff.2.label=2. Keuze
handoff.2.text=Bied het konijnenboek of het maanverhaal aan; vanavond één verhaal.
handoff.3.label=3. Deel van de ouder
handoff.3.text=Bellen om 19.45 uur. Na één poging zonder antwoord ‘Dinsdagverhaal’ afspelen.
handoff.4.label=4. Laatste woorden
handoff.4.text=Na het verhaal: ‘Welterusten. We zijn hier en daarna komt de ochtend.’
handoff.5.label=5. Morgen
handoff.5.text=Het kind kan één tekening of spraakbericht sturen; voor bed hoeft geen antwoord te komen.
handoff.body=Pas het voorbeeld aan je gezin aan. De helderheid helpt: één startpunt, één keuze, één alternatief en één afsluiting. Maak er geen pagina met regels van die perfect moeten worden nagespeeld.
options.kicker=Kies op betrouwbaarheid, niet op nieuwigheid
options.title=Live bellen, een volledige opname of een kort bericht?
options.intro=Elk formaat doet iets anders. Kies er één als hoofdvorm voor de reis en bewaar een tweede als reserve.
option.1.title=Live bellen voor een kort gesprek
option.1.body=Een gesprek past als het tijdstip voorspelbaar is en het kind contact wil. Zeg hallo, lees een klein stukje of stel één vraag; laat de volwassene in de kamer bedtijd afsluiten. Loopt bellen vaak uit, doe het dan eerder.
option.2.title=Een volledige opname voor een herhaalbaar verhaal
option.2.body=Een opname staat klaar ondanks tijdzones en slecht bereik. Ze bewaart het echte tempo, de lach en de stemmetjes. Neem alles vooraf op en luister het één keer op het apparaat voor bedtijd.
option.3.title=Een kort bericht bij het voorlezen door de verzorger
option.3.body=Tien of twintig seconden is genoeg als er geen tijd is voor een heel boek. De verzorger leest en speelt het bericht op het afgesproken moment. ‘Ik hoop dat je vanavond het maanverhaal kiest’ voelt dichterbij dan een algemene boodschap.
options.source=United Through Reading beschrijft hoe gezinnen vóór een uitzending met opgenomen voorlezen beginnen en het in een terugkerend ritueel plaatsen; het programma is voor militaire gezinnen, maar het idee van voorbereiding is aanpasbaar zonder situaties gelijk te stellen
options.source_link=lees het artikel over samen lezen
backup.title=Schrijf het plan voor een gemist gesprek voordat je het nodig hebt
backup.intro=Een gemist gesprek verandert de vorm, niet het verhaal. Spreek deze volgorde af als niemand haast heeft.
backup.1.title=Vertel kort wat er gebeurde
backup.1.body=De verzorger kan zeggen: ‘Bellen lukte vanavond niet. Het verhaal ligt klaar.’ Laat het kind niet wachten op steeds nieuwe pogingen terwijl het later wordt.
backup.2.title=Gebruik het voorbereide alternatief
backup.2.body=Speel de volledige opname, combineer het korte bericht met voorlezen of ga alleen verder met de aanwezige volwassene. Houd dezelfde deken, verhaalkeuze en slotzin.
backup.3.title=Bewaar het volgende contact voor morgen
backup.3.body=Stuur de volgende dag eventueel een tekening, foto of spraakbericht. Beloof geen precies antwoordmoment dat de ouder opnieuw kan missen.
return.title=Sluit bij thuiskomst aan bij de routine die doorging
return.body1=Vraag wat het kind fijn vond en wat voor de verzorger werkelijk werkte. De eerste avond terug hoeft geen langer verhaal of later bedtijd. Pak de bekende volgorde op en lees samen als dat prettig voelt.
return.body2=Bewaar opnamen die jullie opnieuw willen horen onder duidelijke namen. Verwijder mislukte tests en privébestanden uit gedeelde chats of apparaten die ze niet meer nodig hebben. Een kleine nette bibliotheek is een volgende keer sneller bruikbaar.
product.eyebrow=In voorbereiding · iOS en Android
product.title=Je afgeronde tekst wordt een verhaal om te beluisteren
product.body=Sleep2Story wordt ontwikkeld om de volledige verhaaltekst die een volwassene aanlevert met een synthetische stem voor te lezen. Daarvoor gebruikt de app een stemfragment van een volwassen familielid dat toestemming heeft gegeven. De geplande app krijgt een persoonlijke verhalenbibliotheek en een audiospeler. De app schrijft het verhaal niet en bewaart geen oorspronkelijke opname waarin die volwassene deze woorden zelf voorleest.
product.body2=De app wordt nog voorbereid op de release. Vertelling is gepland in het Engels en Russisch; de andere talen van de website betekenen niet dat de app ook in die talen kan vertellen. Je kunt je familieverhaal nu al schrijven, voorlezen en gewoon met je telefoon opnemen.
product.cta=Bekijk hoe Sleep2Story werkt
faq.title=Vragen over bedtijd als een ouder weg is
faq.1.question=Is videobellen beter dan een opname?
faq.1.answer=Kies bellen als tijd en verbinding betrouwbaar zijn en contact belangrijk is. Kies een opname als werk, tijdzones of bereik het gesprek kunnen verstoren. Een korte live begroeting eerder en de opname bij bedtijd kunnen ook samen.
faq.2.question=Hoeveel verhalen nemen we op voor een reis?
faq.2.answer=Begin met één complete, geteste opname en één kort reservebericht. Voeg pas meer toe als het gezin weet dat de opzet werkt. Betrouwbaarheid telt meer dan aantallen.
faq.3.question=Wat als het kind alleen om de ouder op afstand vraagt?
faq.3.answer=Erken de wens zonder iets onmogelijks te beloven: ‘Je wilde mama vanavond. Zij is weg en ik ben bij je. We kunnen haar bericht horen en daarna lees ik.’ Gebruik de namen en woorden van jullie gezin.
faq.4.question=Werkt dit plan ook tussen twee huizen?
faq.4.answer=Ja, als beide volwassenen dat willen. Spreek één vertrouwd signaal, toegang tot het bestand en een slotzin af. De rest van de routine mag per huis verschillen.
faq.5.question=Vervangt Sleep2Story de ouder of verzorger?
faq.5.answer=Nee. De aanwezige volwassene kiest, begint en sluit de routine. Sleep2Story wordt ontwikkeld als luisteroptie voor een complete Engelse of Russische tekst met een stemvoorbeeld van een instemmende volwassene; de app staat nog niet in de stores.
