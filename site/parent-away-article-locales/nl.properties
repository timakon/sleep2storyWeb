schema.description=Praktische gids voor een vertrouwd bedtijdverhaal als een ouder reist, nachtdienst heeft of in een ander huis woont.
hero.eyebrow=Gezin op afstand · Gids 06
hero.title=Houd voorlezen vertrouwd als een ouder weg is
hero.dek=Een werkreis, nachtdienst of avond in het andere huis verandert wie naast het bed zit. Een klein plan bewaart het verhaal, de vertrouwde woorden en de rol van de volwassene die er vanavond is.
byline.read_time=8 minuten lezen
byline.date=19 september 2026
nav.plan=Plan in vier stappen
nav.options=Bellen of opnemen
nav.backup=Als het gesprek uitvalt
answer.title=Houd drie dingen gelijk: de volgorde, het beginsein en de laatste woorden.
answer.body=Beslis vooraf of de ouder op afstand live meedoet, het hele verhaal opneemt of een kort bericht stuurt. Geef de volwassene thuis de verhaalkeuze en de precieze welterustenzin. Houd een geteste opname klaar, zodat vertraging, slecht bereik of een roosterwijziging niet over het voorlezen beslist.
