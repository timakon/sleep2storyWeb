sources.body=PBS onderbouwt de tips over voorbereiding, kalender en dagelijkse routine. United Through Reading geeft voorbeelden van opnemen vóór de scheiding en een terugkerend ritueel in militaire gezinnen. Het overdrachtsbriefje, de vergelijking en het reserveplan zijn eigen redactioneel materiaal van Sleep2Story; geen van beide bronnen beoordeelt Sleep2Story.
