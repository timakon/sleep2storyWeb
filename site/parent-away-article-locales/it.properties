prepare.title=Parti dalla sera che tuo figlio conosce già
prepare.body1=Non ricostruire tutta la serata intorno a chi parte. Annota la parte che già annuncia la storia: pigiama, un sorso d’acqua, la coperta blu, poi la lettura. Scegli due o tre dettagli che l’adulto presente può ripetere senza mettere in scena uno spettacolo.
prepare.body2=Spiega l’assenza con parole semplici e indica chi sarà presente all’ora di dormire. Se le date sono note, segna le notti su un calendario. Non promettere una videochiamata ogni sera se orari o connessione non la rendono affidabile.
prepare.source=PBS KIDS for Parents consiglia inoltre di spiegare il viaggio, usare un calendario e chiedere a chi si prende cura del bambino di mantenere le abitudini quotidiane
prepare.source_link=leggi i consigli di preparazione
figure.alt=Calda illustrazione da libro: un adulto legge a un bambino, con una registrazione e la foto del genitore lontano accanto
figure.caption=L’adulto presente guida la sera; una voce o un messaggio familiare è solo una parte della routine.
plan.kicker=Prima della prima sera separati
plan.title=Prepara il piano della storia in quattro passi
plan.intro=Crea il piano più piccolo che un altro adulto possa usare davvero. Una storia completa è più utile di una cartella di registrazioni a metà.
plan.1.title=Scegli un punto fermo
plan.1.body=Mantieni un oggetto, una frase o un gesto nello stesso momento: la coperta a righe, la scelta fra due storie o «Ci vediamo dopo colazione». Deve funzionare anche senza contatto con il genitore lontano.
plan.2.title=Scegli la storia
plan.2.body=Usa un racconto che il bambino ama già oppure prepara un testo originale completo. Lascia libro o testo dove l’adulto li trova subito. Tieni privata la registrazione di un libro pubblicato e verifica i diritti prima di condividerla fuori casa.
plan.3.title=Prepara un contributo del genitore lontano
plan.3.body=Scegli una cosa: una chiamata a un’ora stabilita, la registrazione completa o un breve saluto e buonanotte. Dai al file un nome chiaro e provalo sul dispositivo che verrà usato.
plan.4.title=Provate una volta la versione normale
plan.4.body=Provate la routine prima del viaggio o del nuovo turno. L’adulto che resta inizia la storia e conclude la buonanotte. Il bambino vede così che la sera ha ancora un inizio e una fine, anche se cambiano i ruoli.
handoff.title=Lascia una nota di cinque righe
handoff.intro=Una nota breve toglie piccole decisioni da una sera già impegnativa. Mandala nella conversazione che entrambi gli adulti aprono davvero.
handoff.1.label=1. Inizio
handoff.1.text=Storia dopo denti e pigiama, verso le 19:40.
handoff.2.label=2. Scelta
handoff.2.text=Proporre il libro del coniglio o la storia della luna; una storia stasera.
handoff.3.label=3. Parte del genitore
handoff.3.text=Chiamata alle 19:45. Se non risponde dopo un tentativo, riprodurre «Storia del martedì».
handoff.4.label=4. Ultime parole
handoff.4.text=Dopo la storia dire: «Buonanotte. Noi siamo qui e poi arriva il mattino».
handoff.5.label=5. Domani
handoff.5.text=Il bambino può inviare un disegno o un messaggio vocale; non serve aspettare una risposta prima di dormire.
handoff.body=Adatta l’esempio alla vostra famiglia. Conta la precisione: un inizio, una scelta, un’alternativa e una conclusione. Non trasformarlo in una pagina di regole da riprodurre alla perfezione.
options.kicker=Scegli l’affidabilità, non la novità
options.title=Chiamata in diretta, registrazione completa o breve messaggio?
options.intro=Ogni formato svolge un compito diverso. Scegline uno come principale per il viaggio e tienine un altro di riserva.
option.1.title=Una chiamata in diretta per parlare un momento
option.1.body=La chiamata funziona quando l’orario è prevedibile e il bambino vuole interagire. Saluta, leggi un breve passaggio o fai una domanda, poi lascia concludere la sera all’adulto nella stanza. Se le chiamate ritardano, falle prima.
option.2.title=Una registrazione completa per una storia ripetibile
option.2.body=La registrazione è pronta nonostante fusi orari e segnale debole. Conserva il ritmo vero, le risate e le voci dei personaggi. Registra tutto in anticipo e ascolta una volta sul dispositivo serale.
option.3.title=Un breve messaggio accanto alla lettura dell’adulto
option.3.body=Dieci o venti secondi bastano se non c’è tempo per un libro. L’adulto legge e riproduce il messaggio nel punto concordato. «Spero che stasera sceglierai la storia della luna» è più vicino di un discorso generico.
options.source=United Through Reading descrive come avviare letture familiari registrate prima di un dispiegamento e inserirle in un rituale; il programma serve famiglie militari, ma l’idea di preparazione si può adattare senza equiparare tutte le situazioni
options.source_link=leggi l’articolo sulla lettura in famiglia
backup.title=Scrivi il piano per una chiamata mancata prima che serva
backup.intro=Una chiamata saltata cambia il mezzo, non cancella la storia. Concordate questa sequenza quando nessuno ha fretta.
backup.1.title=Spiega in breve cosa è successo
backup.1.body=L’adulto può dire: «La chiamata non ha funzionato stasera. La storia è pronta». Non far aspettare il bambino durante molti tentativi mentre si fa tardi.
backup.2.title=Usa l’alternativa preparata
backup.2.body=Riproduci la registrazione, abbina il messaggio breve alla lettura o continua solo con l’adulto presente. Mantieni la stessa coperta, la scelta e la frase finale.
backup.3.title=Lascia il prossimo contatto a domani
backup.3.body=Il giorno dopo potete inviare un disegno, una foto o un messaggio vocale. Non promettere un’ora precisa di risposta che il genitore lontano potrebbe perdere di nuovo.
return.title=Al ritorno, rientra nella routine che è continuata
return.body1=Chiedi cosa è piaciuto al bambino e cosa ha funzionato davvero per l’altro adulto. La prima sera non richiede una storia più lunga né un orario più tardi. Riprendete l’ordine noto e leggete insieme se vi va.
return.body2=Conserva le registrazioni che volete riascoltare e assegna nomi chiari. Elimina prove fallite e file privati da chat condivise o dispositivi che non ne hanno più bisogno. Una piccola raccolta ordinata sarà più facile da riusare.
product.eyebrow=In preparazione · iOS e Android
product.title=Il tuo testo completo, pronto da ascoltare
product.body=Stiamo sviluppando Sleep2Story per trasformare il testo completo fornito da un adulto in una narrazione sintetica, usando un campione vocale di un familiare adulto che abbia dato il proprio consenso. L’app prevista comprende una biblioteca personale di storie e un lettore audio. Non scrive la storia e non conserva la lettura originale di quelle parole da parte dell’adulto.
product.body2=L’app è ancora in preparazione per il lancio. La narrazione è prevista in inglese e russo; le altre lingue del sito non indicano che la narrazione sia disponibile in quelle lingue. Puoi già scrivere e leggere la tua storia di famiglia, oppure registrarla normalmente con il telefono.
product.cta=Scopri come funziona Sleep2Story
faq.title=Domande sulla buonanotte quando un genitore è lontano
faq.1.question=È meglio una videochiamata o una registrazione?
faq.1.answer=Usa la chiamata se orario e connessione sono affidabili e conta l’interazione. Usa la registrazione se lavoro, fusi orari o segnale possono interromperla. Potete anche salutarvi prima e ascoltare la storia registrata a letto.
faq.2.question=Quante storie registrare prima di un viaggio?
faq.2.answer=Inizia con una registrazione completa e provata e un breve messaggio di riserva. Aggiungi altro solo quando sapete che il sistema funziona. L’affidabilità conta più della quantità.
faq.3.question=E se il bambino chiede solo del genitore lontano?
faq.3.answer=Riconosci la richiesta senza promettere l’impossibile: «Stasera volevi la mamma. Lei è via e io sono qui con te. Possiamo ascoltare il suo messaggio, poi leggo io». Usa nomi e parole adatti alla vostra famiglia.
faq.4.question=Lo stesso piano può funzionare tra due case?
faq.4.answer=Sì, se entrambi gli adulti lo desiderano. Concordate un riferimento, l’accesso al file e una frase finale. Il resto della routine può essere diverso in ciascuna casa.
faq.5.question=Sleep2Story sostituisce il genitore o l’adulto presente?
faq.5.answer=No. L’adulto presente continua a scegliere, iniziare e chiudere la routine. Sleep2Story è in preparazione come opzione per ascoltare un testo completo inglese o russo con il campione vocale di un adulto consenziente; non è ancora negli store.
