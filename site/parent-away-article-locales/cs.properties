hero.eyebrow=Rodina na dálku · Průvodce 06
hero.title=Zachovejte známé čtení, když je rodič pryč
hero.dek=Služební cesta, noční směna nebo večer v druhém domově mění, kdo sedí u postele. Krátký plán zachová příběh, známá slova i roli dospělého, který je dnes nablízku.
