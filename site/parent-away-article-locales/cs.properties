nav.backup=Když se hovor nezdaří
answer.title=Zachovejte tři věci: pořadí, signál k pohádce a poslední slova.
answer.body=Předem rozhodněte, zda se vzdálený rodič připojí živě, nahraje celou pohádku nebo pošle krátkou zprávu. Dospělému doma předejte výběr příběhu a přesnou větu na dobrou noc. Mějte připravenou vyzkoušenou nahrávku, aby zpoždění, slabý signál nebo změna směny nerozhodovaly o čtení.
