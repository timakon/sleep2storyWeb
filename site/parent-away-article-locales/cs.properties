sources.body=PBS podporuje doporučení k přípravě, kalendáři a udržení rutiny. United Through Reading uvádí příklady nahrávání před odloučením a opakovaného rituálu ve vojenských rodinách. Předávací poznámka, srovnání formátů a záložní plán jsou původní redakční materiály Sleep2Story; žádný zdroj Sleep2Story nehodnotí.
