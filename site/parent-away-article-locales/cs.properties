prepare.title=Začněte večerem, který dítě už zná
prepare.body1=Nepřestavujte celý večer kolem odjíždějícího rodiče. Zapište část, která už ohlašuje pohádku: pyžamo, doušek vody, modrá deka a potom čtení. Vyberte dva či tři detaily, které dospělý doma snadno zopakuje.
prepare.body2=Vysvětlete nepřítomnost jednoduchými slovy a řekněte, kdo bude večer přítomen. Znáte-li data, označte noci v obyčejném kalendáři. Neslibujte videohovor každý večer, pokud jej rozvrh nebo spojení nedělají spolehlivým.
prepare.source=PBS KIDS for Parents rovněž doporučuje cestu předem vysvětlit, použít kalendář a požádat pečujícího, aby zachoval každodenní režim
prepare.source_link=přečíst tipy k přípravě
figure.alt=Teplá knižní ilustrace: dospělý čte dítěti, vedle je nahrávka a fotografie vzdáleného rodiče
figure.caption=Večer vede přítomný dospělý; známý hlas či zpráva je jen jednou částí režimu.
plan.kicker=Před prvním večerem odděleně
plan.title=Připravte pohádku ve čtyřech krocích
plan.intro=Vytvořte nejkratší plán, který jiný dospělý opravdu použije. Jeden dokončený příběh je užitečnější než složka nedodělaných nahrávek.
plan.1.title=Vyberte jednu oporu
plan.1.body=Nechte známý předmět, větu nebo krok na stejném místě: pruhovanou deku, výběr ze dvou pohádek nebo „Uvidíme se po snídani“. Opora musí fungovat i bez spojení.
plan.2.title=Vyberte pohádku
plan.2.body=Použijte příběh, který má dítě rádo, nebo připravte úplný vlastní text. Položte knihu či text tak, aby je pečující našel. Nahrávku vydané knihy nechte soukromou a před sdílením mimo domácnost ověřte práva.
plan.3.title=Připravte jeden příspěvek vzdáleného rodiče
plan.3.body=Zvolte jednu možnost: hovor v domluvený čas, nahrávku celé pohádky nebo krátké pozdravení a dobrou noc. Soubor jasně pojmenujte a vyzkoušejte na večerním zařízení.
plan.4.title=Jednou nacvičte běžnou verzi
plan.4.body=Zkuste režim před cestou či novou směnou. Dospělý, který zůstává, začne příběh a dokončí ukládání. Dítě tak uvidí, že večer má známý začátek a konec i při změně rolí.
handoff.title=Nechte pečujícímu poznámku v pěti řádcích
handoff.intro=Krátká poznámka ubere drobná rozhodnutí z už tak rušného večera. Pošlete ji do konverzace, kterou oba dospělí skutečně otevírají.
handoff.1.label=1. Začátek
handoff.1.text=Pohádka po čištění zubů a pyžamu, kolem 19:40.
handoff.2.label=2. Výběr
handoff.2.text=Nabídnout knihu o králíčkovi nebo příběh o měsíci; dnes jedna pohádka.
handoff.3.label=3. Část rodiče
handoff.3.text=Hovor v 19:45. Když po jednom pokusu neodpoví, pustit „Úterní pohádku“.
handoff.4.label=4. Poslední slova
handoff.4.text=Po příběhu říct: „Dobrou noc. Jsme tady a potom přijde ráno.“
handoff.5.label=5. Zítra
handoff.5.text=Dítě může poslat obrázek nebo hlasovou zprávu; před spaním nemusí čekat na odpověď.
handoff.body=Upravte příklad podle své rodiny. Pomáhá přesnost: jeden začátek, jeden výběr, jedna záloha a jeden konec. Nedělejte z poznámky stránku pravidel, která se musí dokonale přehrát.
options.kicker=Vybírejte podle spolehlivosti, ne novosti
options.title=Živý hovor, celá nahrávka, nebo krátká zpráva?
options.intro=Každý formát má jiný úkol. Jeden zvolte jako hlavní na cestu a druhý si nechte jako zálohu.
option.1.title=Živý hovor pro krátký rozhovor
option.1.body=Hovor se hodí, když je čas předvídatelný a dítě chce kontakt. Pozdravte, přečtěte krátkou část nebo položte jednu otázku; večer dokončí dospělý v pokoji. Pokud se hovory zpožďují, přesuňte je dříve.
option.2.title=Celá nahrávka pro opakovatelnou pohádku
option.2.body=Nahrávka je připravená navzdory časovým pásmům a slabému signálu. Uchová skutečné tempo, smích i hlasy postav. Nahrajte vše předem a jednou poslechněte na zařízení pro večer.
option.3.title=Krátká zpráva k četbě přítomného dospělého
option.3.body=Když není čas na celou knihu, stačí deset či dvacet sekund. Pečující čte a zprávu pustí v domluveném místě. „Doufám, že dnes vybereš příběh o měsíci“ působí bližší než obecný proslov.
options.source=United Through Reading popisuje, jak začít s nahraným rodinným čtením před nasazením a začlenit je do opakujícího se rituálu; program slouží vojenským rodinám, ale samotnou myšlenku přípravy lze upravit bez směšování všech situací
options.source_link=přečíst článek o rodinném čtení
backup.title=Plán pro zmeškaný hovor napište dřív, než jej potřebujete
backup.intro=Zmeškaný hovor mění způsob, ne ruší pohádku. Domluvte si tuto posloupnost, když nikdo nespěchá.
backup.1.title=Stručně pojmenujte, co se stalo
backup.1.body=Dospělý může říct: „Dnes se hovor nepovedl. Pohádku máme připravenou.“ Nenechte dítě čekat na mnoho dalších pokusů, zatímco se spaní posouvá.
backup.2.title=Použijte připravenou náhradu
backup.2.body=Pusťte celou nahrávku, spojte krátkou zprávu s četbou nebo pokračujte jen s přítomným dospělým. Zachovejte deku, volbu příběhu a závěrečnou větu.
backup.3.title=Další kontakt nechte na zítřek
backup.3.body=Další den můžete poslat obrázek, fotografii nebo hlasovou zprávu. Neslibujte přesný čas odpovědi, který může vzdálený rodič znovu nestihnout.
return.title=Po návratu se připojte k režimu, který pokračoval
return.body1=Zeptejte se dítěte, co se mu líbilo, a pečujícího, co opravdu fungovalo. První večer po návratu nepotřebuje delší příběh ani pozdější spaní. Vraťte se ke známému pořadí a čtěte společně, pokud chcete.
return.body2=Uložte nahrávky, které chcete znovu slyšet, pod jasnými názvy. Smažte nepovedené pokusy a soukromé soubory ze sdílených chatů nebo zařízení, která je už nepotřebují. Malá uklizená knihovna se příště používá snáz.
product.eyebrow=Připravujeme · iOS a Android
product.title=Váš hotový text k poslechu
product.body=Sleep2Story vyvíjíme pro syntetické namluvení celého textu pohádky, který dodá dospělý. Hlas má vycházet ze vzorku hlasu dospělého člena rodiny s jeho souhlasem. Počítáme také s osobní knihovnou příběhů a přehrávačem. Aplikace pohádku nepíše ani neuchovává původní nahrávku toho, jak ji tento dospělý přečetl.
product.body2=Aplikace se stále připravuje k vydání. Příběhy má namlouvat anglicky a rusky; další jazyky webu neznamenají podporu namluvení v těchto jazycích. Svou rodinnou pohádku můžete už teď napsat, přečíst a nahrát běžným diktafonem v telefonu.
product.cta=Podívejte se, jak funguje Sleep2Story
faq.title=Otázky k večeru, když je rodič pryč
faq.1.question=Je videohovor lepší než nahrávka?
faq.1.answer=Hovor použijte při spolehlivém čase a spojení, když je důležitá interakce. Nahrávku zvolte, pokud může volání narušit práce, časová pásma či signál. Krátký živý pozdrav dříve a nahrávka večer se mohou doplnit.
faq.2.question=Kolik pohádek nahrát před cestou?
faq.2.answer=Začněte jednou úplnou, vyzkoušenou nahrávkou a krátkou záložní zprávou. Další přidejte, až když víte, že systém funguje. Spolehlivost je důležitější než počet.
faq.3.question=Co když dítě chce jen vzdáleného rodiče?
faq.3.answer=Uznáte přání bez nemožného slibu: „Dnes jsi chtěl maminku. Je pryč a já jsem s tebou. Můžeme si pustit její zprávu a potom budu číst já.“ Použijte jména a slova své rodiny.
faq.4.question=Funguje stejný plán mezi dvěma domovy?
faq.4.answer=Ano, pokud to oba dospělí chtějí. Domluvte jeden známý signál, přístup k souboru a závěrečnou větu. Zbytek režimu může být v každém domově jiný.
faq.5.question=Nahrazuje Sleep2Story rodiče či pečujícího?
faq.5.answer=Ne. Přítomný dospělý dál vybírá, začíná a končí režim. Sleep2Story se připravuje jako možnost poslechu úplného anglického či ruského textu se vzorkem hlasu souhlasícího dospělého; aplikace zatím není v obchodech.
