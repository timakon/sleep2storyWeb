sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: 11 Tips to Prepare Your Kids For When You’re Traveling Without Them
sources.utr=United Through Reading: How to Start Family Storytime Traditions, Even Through Deployment
sources.body=PBS podržava savete o pripremi, kalendaru i rutini. United Through Reading daje primere snimanja pre razdvajanja i ponovljivog čitanja u vojnim porodicama. Uputstvo za odraslog, poređenje formata i rezervni plan originalni su urednički materijal Sleep2Story; nijedan izvor ne ocenjuje Sleep2Story.
