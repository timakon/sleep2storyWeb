hero.title=Sačuvajte poznato vreme za priču kada je roditelj odsutan
hero.dek=Službeni put, noćna smena ili veče u drugom domu menjaju osobu koja sedi kraj kreveta. Mali plan čuva priču, poznate reči i ulogu odraslog koji je večeras tu.
