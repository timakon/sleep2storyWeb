nav.backup=Rezerva za propušten poziv
answer.title=Neka tri dela ostanu ista: redosled, znak za početak priče i poslednje reči.
answer.body=Pre večeri odlučite da li će odsutni roditelj biti uživo, snimiti celu priču ili poslati kratku poruku. Odrasloj osobi kod kuće ostavite izbor priče i tačnu završnu rečenicu. Pripremite provereni snimak da kašnjenje, loš signal ili promena smene ne odlučuju o priči.
