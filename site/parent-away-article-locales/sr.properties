prepare.title=Počnite od večeri koju dete već poznaje
prepare.body1=Ne menjajte celo veče zbog osobe koja odlazi. Zapišite deo koji već označava priču: pidžama, gutljaj vode, plavo ćebe, pa čitanje. Izaberite dva ili tri detalja koja odrasla osoba kod kuće može lako da ponovi.
prepare.body2=Objasnite odsustvo jednostavnim rečima i recite ko će biti tu pred spavanje. Ako su datumi poznati, označite noći na običnom kalendaru. Ne obećavajte video-poziv svake večeri ako raspored ili veza nisu pouzdani.
prepare.source=PBS KIDS for Parents takođe predlaže da unapred objasnite put, koristite kalendar i zamolite odraslog koji ostaje da održava dnevnu rutinu
prepare.source_link=pročitajte savete za pripremu puta
figure.alt=Topla ilustracija iz knjige: odrasla osoba čita detetu, a pored su snimak i fotografija odsutnog roditelja
figure.caption=Odrasli koji je prisutan vodi veče; poznat glas ili poruka samo su jedan deo rutine.
plan.kicker=Pre prve večeri odvojeno
plan.title=Pripremite plan za priču u četiri koraka
plan.intro=Napravite najkraći plan koji druga osoba zaista može da koristi. Jedna završena priča vredi više od fascikle nedovršenih snimaka.
plan.1.title=Izaberite jedno uporište
plan.1.body=Neka poznat predmet, rečenica ili radnja ostanu na istom mestu: prugasto ćebe, izbor između dve priče ili „Vidimo se posle doručka“. Uporište mora da radi i bez veze sa odsutnim roditeljem.
plan.2.title=Izaberite priču
plan.2.body=Uzmite priču koju dete već voli ili pripremite ceo originalni tekst. Ostavite knjigu ili tekst tamo gde će ih odrasli lako naći. Snimak objavljene knjige čuvajte privatno i proverite prava pre deljenja van domaćinstva.
plan.3.title=Pripremite jedan doprinos odsutnog roditelja
plan.3.body=Izaberite jedno: poziv u dogovoreno vreme, snimak cele priče ili kratko „zdravo“ i „laku noć“. Jasno nazovite datoteku i proverite je na uređaju koji će se koristiti.
plan.4.title=Jednom probajte običnu verziju
plan.4.body=Isprobajte rutinu pre puta ili nove smene. Neka odrasli koji ostaje počne priču i završi uspavljivanje. Dete tako vidi da veče i uz drugačije uloge ima poznat početak i kraj.
handoff.title=Ostavite uputstvo u pet redova
handoff.intro=Kratka poruka uklanja sitne odluke iz već zauzete večeri. Pošaljite je u razgovor koji obe odrasle osobe zaista otvaraju.
handoff.1.label=1. Početak
handoff.1.text=Priča posle pranja zuba i pidžame, oko 19.40.
handoff.2.label=2. Izbor
handoff.2.text=Ponuditi knjigu o zecu ili priču o mesecu; večeras jedna priča.
handoff.3.label=3. Deo roditelja
handoff.3.text=Poziv u 19.45. Ako nema odgovora posle jednog pokušaja, pustiti „Priču za utorak“.
handoff.4.label=4. Poslednje reči
handoff.4.text=Posle priče reći: „Laku noć. Mi smo ovde, a sledeće dolazi jutro.“
handoff.5.label=5. Sutra
handoff.5.text=Dete može da pošalje jedan crtež ili glasovnu poruku; odgovor nije potreban pre spavanja.
handoff.body=Prilagodite primer svojoj porodici. Važna je preciznost: jedan početak, jedan izbor, jedna rezerva i jedan završetak. Ne pravite stranicu pravila koju odrasli mora savršeno da odglumi.
options.kicker=Birajte pouzdanost, ne novinu
options.title=Poziv uživo, ceo snimak ili kratka poruka?
options.intro=Svaki format radi drugi posao. Izaberite jedan kao glavni tokom puta, a drugi zadržite kao rezervu.
option.1.title=Poziv uživo za kratak razgovor
option.1.body=Poziv odgovara kada je vreme predvidljivo i detetu znači razgovor. Pozdravite se, pročitajte kratak deo ili postavite jedno pitanje, a odrasli u sobi neka završi veče. Ako pozivi kasne, prebacite ih ranije.
option.2.title=Ceo snimak za priču koja se može ponoviti
option.2.body=Snimak radi uprkos vremenskim zonama i slabom signalu. Čuva pravi ritam, smeh i glasove likova. Snimite celu priču unapred i jednom je preslušajte na uređaju za veče.
option.3.title=Kratka poruka uz čitanje odraslog
option.3.body=Ako nema vremena za celu knjigu, dovoljno je deset ili dvadeset sekundi. Odrasli čita i pušta poruku na dogovorenom mestu. „Nadam se da ćeš večeras izabrati priču o mesecu“ zvuči bliže od opšteg govora.
options.source=United Through Reading opisuje kako se porodično čitanje snima pre vojnog raspoređivanja i stavlja u ponovljivu rutinu; program služi vojnim porodicama, dok se sama ideja pripreme može prilagoditi bez izjednačavanja svih okolnosti
options.source_link=pročitajte tekst o porodičnom čitanju
backup.title=Dogovorite rezervu pre nego što poziv izostane
backup.intro=Propušten poziv menja način učešća, ne otkazuje priču. Dogovorite sledeći redosled dok su svi mirni.
backup.1.title=Kratko recite šta se desilo
backup.1.body=Odrasli može reći: „Poziv večeras nije uspeo. Priča nam je spremna.“ Nemojte da dete čeka mnogo novih pokušaja dok se spavanje odlaže.
backup.2.title=Upotrebite pripremljenu zamenu
backup.2.body=Pustite ceo snimak, spojite kratku poruku sa čitanjem ili nastavite samo sa odraslim koji je tu. Zadržite isto ćebe, izbor priče i završnu rečenicu.
backup.3.title=Sledeći kontakt ostavite za sutra
backup.3.body=Sutradan možete poslati crtež, fotografiju ili glasovnu poruku. Ne obećavajte tačno vreme odgovora koje odsutni roditelj možda ponovo neće stići.
return.title=Kada se roditelj vrati, neka se priključi rutini koja je trajala
return.body1=Pitajte dete šta mu se dopalo i odraslog šta je zaista radilo. Prvo veče po povratku ne traži dužu priču ni kasnije spavanje. Vratite se poznatom redosledu i čitajte zajedno ako vam prija.
return.body2=Sačuvajte snimke koje porodica želi ponovo da sluša i jasno ih nazovite. Obrišite neuspele probe i privatne datoteke iz zajedničkih razgovora i sa nepotrebnih uređaja. Mala uredna biblioteka lakše se koristi sledeći put.
product.eyebrow=U pripremi · iOS i Android
product.title=Vaš gotov tekst, pripremljen za slušanje
product.body=Sleep2Story se razvija kako bi od celog teksta priče koji dostavi odrasla osoba napravio sintetičku naraciju, na osnovu uzorka glasa odraslog člana porodice koji je dao saglasnost. Planirana aplikacija sadrži ličnu biblioteku priča i plejer. Aplikacija ne piše priču, a tako dobijena naracija nije snimak na kojem ta osoba sama čita ceo tekst.
product.body2=Aplikacija se još priprema za objavljivanje. Naracija je planirana na engleskom i ruskom; drugi jezici sajta ne znače da je naracija dostupna i na tim jezicima. Svoju porodičnu priču već sada možete da napišete, pročitate i snimite običnim snimačem na telefonu.
product.cta=Pogledajte kako radi Sleep2Story
faq.title=Pitanja o pričama kada je roditelj odsutan
faq.1.question=Da li je video-poziv bolji od snimka?
faq.1.answer=Poziv birajte kada su vreme i veza pouzdani, a detetu znači razgovor. Snimak je bolji uz vremenske zone, smenski rad ili loš internet. Moguć je kratak poziv ranije i snimak u vreme priče.
faq.2.question=Koliko priča treba snimiti pre puta?
faq.2.answer=Počnite jednim celim, proverenim snimkom i jednom kratkom rezervnom porukom. Dodajte još tek kada porodica zna da plan radi. Pouzdanost je važnija od velike zbirke.
faq.3.question=Šta ako dete traži samo odsutnog roditelja?
faq.3.answer=Potvrdite želju bez nemogućeg obećanja: „Hteo si da mama večeras čita. Ona je na putu, a ja sam ovde. Možemo čuti njenu poruku, pa ću ja čitati.“ Koristite imena i reči svoje porodice.
faq.4.question=Može li isti plan da radi između dva doma?
faq.4.answer=Da, ako obe odrasle osobe to žele. Dogovorite jedan poznat znak, pristup datoteci i završnu rečenicu. Ostatak rutine može biti drugačiji u svakom domu.
faq.5.question=Da li Sleep2Story menja roditelja ili odraslog pred spavanje?
faq.5.answer=Ne. Odrasli koji je prisutan i dalje bira, počinje i završava rutinu. Sleep2Story se priprema kao opcija za slušanje celog engleskog ili ruskog teksta uz uzorak glasa odrasle osobe koja je pristala; aplikacija još nije u prodavnicama.
