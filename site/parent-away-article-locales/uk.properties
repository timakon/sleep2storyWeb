answer.title=Залиште незмінними три речі: порядок, сигнал до початку казки й останні слова.
answer.body=Заздалегідь вирішіть, чи дорослий, який поїхав, долучиться наживо, запише всю казку або надішле коротке повідомлення. Передайте тому, хто вдома, вибір історії та точну фразу на добраніч. Підготуйте перевірений запис, щоб затримка, слабкий зв’язок або зміна графіка не вирішували, чи буде сьогодні казка.
