prepare.title=Почніть із вечора, який дитина вже знає
prepare.body1=Не перебудовуйте весь вечір навколо того, хто їде. Запишіть послідовність, що вже означає початок казки: піжама, ковток води, синя ковдра, потім читання. Виберіть дві-три деталі, які інший дорослий зможе повторити без складної вистави.
prepare.body2=Поясніть відсутність простими словами й скажіть, хто буде поруч перед сном. Якщо дати відомі, позначте ночі у звичайному календарі. Не обіцяйте щовечірнього відеодзвінка, якщо графік або зв’язок не дають упевненості.
prepare.source=PBS KIDS for Parents також радить заздалегідь пояснити поїздку, скористатися календарем і попросити того, хто доглядає дитину, підтримувати щоденний розпорядок
prepare.source_link=поради з підготовки до поїздки
figure.alt=Тепла книжкова ілюстрація: дорослий читає дитині, а поруч лежить запис і стоїть фото того, хто поїхав
figure.caption=Вечір веде дорослий, який поруч; знайомий голос або повідомлення — лише одна частина звичного ритуалу.
plan.kicker=До першого вечора нарізно
plan.title=Підготуйте казку на ніч у чотири кроки
plan.intro=Складіть найкоротший план, яким інший дорослий справді зможе скористатися. Одна готова історія корисніша за теку незавершених записів.
plan.1.title=Виберіть одну опору
plan.1.body=Залиште на тому самому місці знайомий предмет, фразу або дію: смугасту ковдру, вибір із двох казок чи слова «Побачимося після сніданку». Ця опора має працювати й без зв’язку.
plan.2.title=Виберіть казку
plan.2.body=Візьміть історію, яку дитина вже любить, або підготуйте завершений авторський текст. Покладіть книжку чи текст там, де їх легко знайти. Запис опублікованої книжки залишайте приватним і перевіряйте права, перш ніж поширювати його поза домом.
plan.3.title=Підготуйте один матеріал від того, хто поїхав
plan.3.body=Виберіть одне: дзвінок у визначений час, запис усієї казки або коротке привітання й побажання на добраніч. Зрозуміло назвіть файл і перевірте його на пристрої, з якого його вмикатимуть.
plan.4.title=Один раз проведіть звичайний вечір за новим планом
plan.4.body=Спробуйте ритуал до поїздки чи нової зміни. Нехай дорослий, який залишиться вдома, почне читання й завершить укладання. Так дитина побачить, що зі зміною ролей вечір усе одно має знайомі початок і кінець.
handoff.title=Залиште пам’ятку з п’яти рядків
handoff.intro=Коротка пам’ятка прибирає дрібні рішення з і без того зайнятого вечора. Надішліть її в той чат, який обидва дорослі справді читають.
handoff.1.label=1. Початок
handoff.1.text=Казка після чищення зубів і піжами, приблизно о 19:40.
handoff.2.label=2. Вибір
handoff.2.text=Запропонувати книжку про зайчика або казку про місяць; сьогодні одна історія.
handoff.3.label=3. Участь того, хто поїхав
handoff.3.text=Дзвінок о 19:45. Якщо після однієї спроби відповіді немає, увімкнути файл «Казка на вівторок».
handoff.4.label=4. Останні слова
handoff.4.text=Після казки сказати: «На добраніч. Ми поруч, а далі настане ранок».
handoff.5.label=5. Завтра
handoff.5.text=Дитина може надіслати один малюнок або голосове повідомлення; чекати відповіді перед сном не треба.
handoff.body=Замініть приклад реальними деталями вашої сім’ї. Важлива точність: один час початку, один вибір, один запасний варіант і одна фінальна фраза. Не перетворюйте пам’ятку на сторінку правил, які треба відтворити бездоганно.
options.kicker=Вибирайте за надійністю, а не за новизною
options.title=Живий дзвінок, повний запис чи коротке повідомлення?
options.intro=Кожен формат виконує свою роботу. Виберіть один основним на час поїздки, а другий залиште про запас.
option.1.title=Дзвінок — для короткої розмови
option.1.body=Дзвінок доречний, коли час передбачуваний і дитині потрібне спілкування. Привітайтеся, прочитайте невеликий уривок або поставте одне запитання, а завершити укладання дозвольте дорослому в кімнаті. Якщо дзвінки запізнюються, перенесіть їх на раніший час.
option.2.title=Повний запис — для казки, яку можна повторити
option.2.body=Запис не залежить від часових поясів і якості зв’язку. Він зберігає справжній темп, сміх і голоси персонажів. Запишіть усю казку заздалегідь і один раз прослухайте її на вечірньому пристрої.
option.3.title=Коротке повідомлення — поруч із читанням дорослого
option.3.body=Якщо немає часу записати книжку, вистачить десяти-двадцяти секунд. Дорослий удома читає й вмикає повідомлення в домовленому місці. Конкретні слова на кшталт «Сподіваюся, сьогодні ти вибереш казку про місяць» звучать ближче за загальне побажання.
options.source=United Through Reading описує, як почати записувати сімейні читання до відрядження й зробити їх частиною повторюваного ритуалу; програма працює з родинами військових, але саму ідею підготовки можна адаптувати, не прирівнюючи до них усі сім’ї
options.source_link=стаття про сімейне читання
backup.title=Продумайте пропущений дзвінок до того, як він станеться
backup.intro=Якщо дзвінок не відбувся, змінюється спосіб участі, а не скасовується казка. Домовтеся про наступну послідовність заздалегідь.
backup.1.title=Коротко скажіть, що сталося
backup.1.body=Дорослий може сказати: «Сьогодні дзвінок не вийшов. Але казка в нас готова». Не змушуйте дитину чекати на багато повторних спроб, поки час сну відсувається.
backup.2.title=Скористайтеся готовою заміною
backup.2.body=Увімкніть повний запис, поставте коротке повідомлення перед читанням або продовжуйте вечір лише з дорослим удома. Збережіть ту саму ковдру, вибір історії та фінальну фразу.
backup.3.title=Залиште наступний зв’язок на завтра
backup.3.body=Наступного дня можна надіслати малюнок, фотографію чи голосове повідомлення. Не обіцяйте точної години відповіді, яку знову можна пропустити.
return.title=Коли дорослий повернеться, долучіться до ритуалу, що тривав без нього
return.body1=Запитайте, що сподобалося дитині, і дізнайтеся, що насправді спрацювало. Перший вечір після повернення не потребує довшої казки чи пізнішого сну. Поверніться до знайомої послідовності й почитайте разом, якщо це природно для сім’ї.
return.body2=Збережіть записи, які захочеться слухати знову, і дайте їм зрозумілі назви. Видаліть невдалі проби й приватні файли зі спільних чатів і непотрібних пристроїв. Невеликою охайною бібліотекою легше скористатися наступного разу.
product.eyebrow=Готуємо до випуску · iOS та Android
product.title=Ваш готовий текст — для прослуховування
product.body=Sleep2Story розробляють, щоб перетворювати повний текст казки, наданий дорослим, на синтезовану озвучку. Для цього використовуватиметься зразок голосу повнолітнього члена родини за його згодою. У застосунку заплановано особисту бібліотеку казок і програвач. Він не пише казку й не зберігає оригінальний запис того, як цей дорослий прочитав її слова.
product.body2=Застосунок іще готується до випуску. Озвучку заплановано англійською та російською; інші мови сайту не означають підтримки озвучки цими мовами. Написати, прочитати й записати сімейну казку звичайним диктофоном на телефоні можна вже зараз.
product.cta=Дізнатися, як працює Sleep2Story
faq.title=Запитання про казку на ніч, коли хтось із батьків далеко
faq.1.question=Що краще: відеодзвінок чи запис?
faq.1.answer=Вибирайте дзвінок, якщо час і зв’язок надійні та дитині важливе спілкування. Запис зручніший за різних часових поясів, змінної роботи чи нестабільного інтернету. Можна коротко поговорити раніше, а перед сном увімкнути готову історію.
faq.2.question=Скільки казок записати перед поїздкою?
faq.2.answer=Почніть з одного повного перевіреного запису й одного короткого запасного повідомлення. Додавайте нові, коли переконаєтеся, що такий спосіб зручний сім’ї. Надійність важливіша за велику бібліотеку.
faq.3.question=Що сказати, якщо дитина просить лише того, хто поїхав?
faq.3.answer=Визнайте прохання, не обіцяючи неможливого: «Ти хотів, щоб сьогодні читала мама. Вона поїхала, а я поруч. Ми можемо послухати її повідомлення, а потім я почитаю». Підставте звичні для вашої сім’ї імена й слова.
faq.4.question=Чи підійде план для життя у двох домівках?
faq.4.answer=Так, якщо обидва дорослі цього хочуть. Домовтеся про одну знайому деталь, доступ до запису й фінальну фразу. Решта режиму в кожному домі може бути своєю.
faq.5.question=Sleep2Story замінює дорослого перед сном?
faq.5.answer=Ні. Дорослий поруч і далі вибирає, починає та завершує ритуал. Sleep2Story готується як один із варіантів прослуховування готового англійського або російського тексту зі зразком голосу дорослого за його згодою; застосунку ще немає в магазинах.
