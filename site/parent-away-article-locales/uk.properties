sources.title=Джерела й редакційна примітка
sources.pbs=PBS KIDS for Parents / Fred Rogers Productions: 11 порад, як підготувати дитину до поїздки без неї
sources.utr=United Through Reading: як підтримувати сімейне читання навіть під час відрядження
sources.body=Матеріал PBS підтверджує поради про підготовку, календар і збереження розпорядку. United Through Reading наводить приклади запису до розлуки та повторюваного ритуалу для родин військових. Пам’ятка дорослому, порівняння форматів і запасний план — оригінальний редакційний матеріал Sleep2Story; жодне джерело не оцінює Sleep2Story.
