sources.body=PBS étaye les conseils sur la préparation, le calendrier et le maintien des habitudes. United Through Reading fournit des exemples d’enregistrement avant la séparation et de rituel dans les familles de militaires. Le mémo, la comparaison des formats et le plan de secours sont des contenus originaux de Sleep2Story ; aucune source n’évalue Sleep2Story.
