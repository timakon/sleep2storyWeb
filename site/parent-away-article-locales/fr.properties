schema.description=Guide pratique pour garder une histoire du soir familière lorsqu’un parent voyage, travaille de nuit ou vit dans un autre foyer.
hero.eyebrow=La famille à distance · Guide 06
hero.title=Gardez un rituel de lecture familier quand un parent est absent
hero.dek=Un déplacement, une garde de nuit ou une soirée dans l’autre foyer change la personne assise près du lit. Un petit plan préserve l’histoire, les mots familiers et la place de l’adulte présent ce soir-là.
byline.read_time=8 min de lecture
byline.date=19 septembre 2026
nav.plan=Plan en quatre étapes
nav.options=Appel ou enregistrement
nav.backup=Si l’appel est manqué
answer.title=Gardez trois repères : l’ordre, le signal qui lance l’histoire et les derniers mots.
answer.body=Décidez avant le soir si le parent absent appellera, enregistrera toute l’histoire ou enverra un court message. Donnez à l’adulte présent le choix du livre et la phrase exacte pour dire bonne nuit. Prévoyez un enregistrement testé afin qu’un retard, une mauvaise connexion ou un changement d’horaire ne décide pas du rituel.
