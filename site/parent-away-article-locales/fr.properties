prepare.title=Partez du coucher que votre enfant connaît déjà
prepare.body1=Ne reconstruisez pas toute la soirée autour de la personne qui part. Notez ce qui annonce déjà l’histoire : le pyjama, une gorgée d’eau, la couverture bleue, puis la lecture. Choisissez deux ou trois détails que l’adulte présent pourra répéter simplement.
prepare.body2=Expliquez l’absence avec des mots adaptés à votre situation et dites qui sera là le soir. Si les dates sont connues, marquez les nuits sur un calendrier simple. Ne promettez pas un appel vidéo chaque soir si l’emploi du temps ou le réseau ne le rendent pas fiable.
prepare.source=PBS KIDS for Parents conseille également d’expliquer le voyage, d’utiliser un calendrier et de demander à la personne qui garde l’enfant de maintenir les habitudes quotidiennes
prepare.source_link=lire les conseils de préparation
figure.alt=Illustration chaleureuse : un adulte lit à un enfant, avec un enregistrement et la photo du parent absent à proximité
figure.caption=L’adulte présent mène le coucher ; une voix ou un message familier n’est qu’une partie du rituel.
plan.kicker=Avant la première soirée séparée
plan.title=Préparez l’histoire du soir en quatre étapes
plan.intro=Faites le plan le plus court qu’un autre adulte pourra vraiment suivre. Une histoire terminée vaut mieux qu’un dossier d’enregistrements inachevés.
plan.1.title=Choisissez un seul repère
plan.1.body=Gardez un objet, une phrase ou un geste au même endroit chaque soir : la couverture rayée, le choix entre deux histoires ou « On se retrouve après le petit-déjeuner ». Ce repère doit fonctionner même sans connexion.
plan.2.title=Choisissez l’histoire
plan.2.body=Prenez une histoire que l’enfant aime déjà ou préparez un texte original complet. Posez le livre ou le texte là où l’adulte le trouvera. Gardez privé l’enregistrement d’un livre publié et vérifiez les droits avant tout partage hors du foyer.
plan.3.title=Préparez une contribution du parent absent
plan.3.body=Choisissez une option : un appel à heure fixe, l’enregistrement complet de l’histoire ou un court bonjour et bonne nuit. Nommez clairement le fichier et testez-le sur l’appareil utilisé le soir.
plan.4.title=Répétez une fois la version ordinaire
plan.4.body=Essayez le rituel avant le voyage ou le nouvel horaire. L’adulte qui reste commence l’histoire et termine le coucher. L’enfant voit ainsi que la soirée garde un début et une fin, même lorsque les rôles changent.
handoff.title=Laissez un mémo en cinq lignes
handoff.intro=Un mémo retire de petites décisions d’une soirée déjà chargée. Envoyez-le dans la conversation que les deux adultes consultent réellement.
handoff.1.label=1. Début
handoff.1.text=Histoire après les dents et le pyjama, vers 19 h 40.
handoff.2.label=2. Choix
handoff.2.text=Proposer le livre du lapin ou l’histoire de la lune ; une histoire ce soir.
handoff.3.label=3. Partie du parent
handoff.3.text=Appel à 19 h 45. Sans réponse après une tentative, lancer « Histoire du mardi ».
handoff.4.label=4. Derniers mots
handoff.4.text=Après l’histoire, dire : « Bonne nuit. Nous sommes là, et demain matin arrive ensuite. »
handoff.5.label=5. Demain
handoff.5.text=L’enfant peut envoyer un dessin ou un message vocal ; aucune réponse n’est attendue avant de dormir.
handoff.body=Adaptez l’exemple à votre famille. L’essentiel est la précision : un départ, un choix, une solution de secours et une fin. N’en faites pas une page de règles à reproduire parfaitement.
options.kicker=Choisissez la fiabilité, pas la nouveauté
options.title=Appel en direct, enregistrement complet ou court message ?
options.intro=Chaque format remplit un rôle différent. Choisissez-en un comme solution principale et gardez-en un autre en secours.
option.1.title=Un appel en direct pour un bref échange
option.1.body=L’appel convient si l’horaire est prévisible et si l’enfant veut échanger. Dites bonjour, lisez un court passage ou posez une question, puis laissez l’adulte dans la chambre terminer le coucher. Si les appels tardent souvent, placez-les plus tôt.
option.2.title=Un enregistrement complet pour une histoire répétable
option.2.body=L’enregistrement reste disponible malgré les fuseaux horaires et le réseau. Il conserve le vrai rythme, les rires et les voix des personnages. Enregistrez toute l’histoire à l’avance et écoutez-la une fois sur l’appareil du soir.
option.3.title=Un court message avec la lecture de l’adulte présent
option.3.body=Dix ou vingt secondes suffisent s’il n’y a pas le temps d’enregistrer un livre. L’adulte lit puis lance le message au moment prévu. « J’espère que tu choisiras l’histoire de la lune ce soir » crée plus de lien qu’un discours général.
options.source=United Through Reading décrit comment commencer les lectures enregistrées avant un déploiement et les intégrer à un rituel ; son programme s’adresse aux familles de militaires, mais l’idée de préparation peut être adaptée sans confondre toutes les situations
options.source_link=lire l’article sur la lecture en famille
backup.title=Écrivez le plan pour un appel manqué avant d’en avoir besoin
backup.intro=Un appel manqué change le moyen, pas l’histoire. Mettez-vous d’accord sur la suite pendant que tout le monde est calme.
backup.1.title=Nommez brièvement ce qui s’est passé
backup.1.body=L’adulte peut dire : « L’appel n’a pas marché ce soir. Notre histoire est prête. » Ne faites pas attendre l’enfant pendant de nombreuses tentatives qui retardent le coucher.
backup.2.title=Utilisez la solution préparée
backup.2.body=Lancez l’enregistrement complet, associez le court message à la lecture ou continuez seulement avec l’adulte présent. Gardez la même couverture, le même choix et les mêmes mots de fin.
backup.3.title=Gardez les retrouvailles pour demain
backup.3.body=Le lendemain, la famille peut envoyer un dessin, une photo ou un message vocal. Ne promettez pas une heure de réponse précise que le parent pourrait manquer à nouveau.
return.title=Au retour, rejoignez le rituel qui a continué
return.body1=Demandez ce que l’enfant a aimé et ce qui a vraiment fonctionné pour l’adulte présent. La première soirée du retour n’a besoin ni d’une histoire plus longue ni d’un coucher plus tardif. Reprenez l’ordre familier et lisez ensemble si vous en avez envie.
return.body2=Conservez les enregistrements que la famille souhaite réécouter et donnez-leur des noms clairs. Supprimez les essais ratés et les fichiers privés des discussions ou appareils qui n’en ont plus besoin. Une petite bibliothèque ordonnée sera plus facile à réutiliser.
product.eyebrow=En préparation · iOS et Android
product.title=Votre texte terminé, prêt à devenir une histoire à écouter
product.body=Sleep2Story est en cours de développement pour transformer le texte complet fourni par un adulte en narration de synthèse. La voix est créée à partir d’un échantillon enregistré par un adulte de la famille qui a donné son accord. L’application prévue comprend une bibliothèque personnelle d’histoires et un lecteur audio. Elle ne rédige pas le récit et ne conserve pas la lecture originale de ces mots par cet adulte.
product.body2=L’application est encore en préparation. La narration est prévue en anglais et en russe ; les autres langues du site ne correspondent pas à des langues de narration prises en charge. Vous pouvez dès maintenant écrire votre histoire, la lire et en faire un enregistrement ordinaire avec un téléphone.
product.cta=Découvrir le fonctionnement de Sleep2Story
faq.title=Questions sur le coucher quand un parent est absent
faq.1.question=Un appel vidéo vaut-il mieux qu’un enregistrement ?
faq.1.answer=Choisissez l’appel si l’horaire et la connexion sont fiables et si l’échange compte. Choisissez l’enregistrement si le travail, les fuseaux horaires ou le réseau risquent d’interrompre l’appel. Un bref bonjour plus tôt et un enregistrement au coucher peuvent se compléter.
faq.2.question=Combien d’histoires faut-il enregistrer avant un voyage ?
faq.2.answer=Commencez par un enregistrement complet et testé, plus un court message de secours. Ajoutez-en seulement quand la famille sait que le dispositif fonctionne. La fiabilité compte plus que le nombre.
faq.3.question=Et si l’enfant réclame uniquement le parent absent ?
faq.3.answer=Accueillez la demande sans promettre l’impossible : « Tu voulais maman ce soir. Elle est partie, et je suis avec toi. On peut écouter son message, puis je lirai. » Utilisez les noms et mots de votre famille.
faq.4.question=Le même plan peut-il fonctionner entre deux foyers ?
faq.4.answer=Oui, si les deux adultes le souhaitent. Convenez d’un repère, de l’accès au fichier et d’une phrase finale. Chaque foyer peut garder le reste de son propre rituel.
faq.5.question=Sleep2Story remplace-t-il le parent ou l’adulte présent ?
faq.5.answer=Non. L’adulte présent choisit, commence et termine toujours le rituel. Sleep2Story est en préparation comme option d’écoute d’un texte complet en anglais ou en russe avec l’échantillon vocal d’un adulte consentant ; l’application n’est pas encore disponible.
