sources.body=Материал PBS подтверждает советы о подготовке, календаре и сохранении распорядка. United Through Reading приводит примеры записи до разлуки и повторяемого ритуала для семей военнослужащих. Памятка взрослому, сравнение форматов и план на случай сорванного звонка — оригинальный редакционный материал Sleep2Story; ни один источник не оценивает Sleep2Story.
