answer.title=Оставьте неизменными три вещи: порядок, сигнал к началу сказки и последние слова.
answer.body=Заранее решите, будет ли родитель участвовать по видеосвязи, запишет всю сказку или пришлёт короткое сообщение. Передайте взрослому дома выбранную историю и точную фразу перед сном. Подготовьте запись про запас, чтобы задержка рейса, слабый интернет или смена графика не решали, состоится ли сказка.
