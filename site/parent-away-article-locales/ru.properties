prepare.title=Начните с того вечера, который ребёнок уже знает
prepare.body1=Не перестраивайте весь вечер вокруг уезжающего родителя. Запишите последовательность, которая уже означает начало сказки: пижама, глоток воды, синее одеяло, потом чтение. Выберите две-три детали, которые другой взрослый сможет повторить без сложной постановки.
prepare.body2=Объясните отсутствие простыми словами и скажите, кто будет рядом перед сном. Если даты известны, отметьте ночи в обычном календаре. Не обещайте ежедневный видеозвонок, если график или связь не позволяют уверенно его выполнить.
prepare.source=PBS KIDS for Parents также советует заранее объяснить поездку, использовать календарь и попросить остающегося взрослого поддерживать повседневный распорядок
prepare.source_link=советы по подготовке к поездке
figure.alt=Тёплая иллюстрация: взрослый читает ребёнку, а рядом лежит запись и стоит фотография уехавшего родителя
figure.caption=Вечер ведёт взрослый, который находится рядом; знакомый голос или сообщение остаются одной частью ритуала.
plan.kicker=До первого вечера в разлуке
plan.title=Подготовьте сказку на ночь в четыре шага
plan.intro=Составьте самый короткий план, которым другой взрослый действительно сможет воспользоваться. Одна готовая история полезнее папки незаконченных записей.
plan.1.title=Выберите одну опору
plan.1.body=Оставьте на прежнем месте знакомый предмет, фразу или действие: полосатое одеяло, выбор из двух сказок или слова «Увидимся после завтрака». Эта опора должна работать и без связи с уехавшим родителем.
plan.2.title=Выберите сказку
plan.2.body=Возьмите историю, которую ребёнок уже любит, или подготовьте законченный авторский текст. Положите книгу или текст туда, где взрослый дома сразу их найдёт. Запись опубликованной книги оставляйте для личного использования и проверяйте права, прежде чем делиться ею вне семьи.
plan.3.title=Подготовьте один материал от уехавшего родителя
plan.3.body=Выберите что-то одно: звонок в определённое время, запись всей сказки или короткое приветствие и пожелание спокойной ночи. Понятно назовите файл и проверьте его на том устройстве, с которого его будут включать.
plan.4.title=Один раз проведите обычный вечер по новому плану
plan.4.body=Попробуйте ритуал до поездки или новой смены. Пусть взрослый, который останется дома, начнёт чтение и закончит укладывание. Так ребёнок увидит, что при смене ролей у вечера всё равно есть знакомые начало и конец.
handoff.title=Оставьте взрослому памятку из пяти строк
handoff.intro=Короткая памятка избавит от мелких решений в и без того занятой вечер. Отправьте её туда, где оба взрослых действительно читают сообщения.
handoff.1.label=1. Начало
handoff.1.text=Сказка после чистки зубов и пижамы, примерно в 19:40.
handoff.2.label=2. Выбор
handoff.2.text=Предложить книгу про зайца или сказку про луну; сегодня читаем одну.
handoff.3.label=3. Участие родителя
handoff.3.text=Звонок в 19:45. Если после одной попытки ответа нет, включить файл «Сказка на вторник».
handoff.4.label=4. Последние слова
handoff.4.text=После сказки сказать: «Спокойной ночи. Мы рядом, а потом наступит утро».
handoff.5.label=5. Завтра
handoff.5.text=Ребёнок может отправить один рисунок или голосовое сообщение; ждать ответа перед сном не нужно.
handoff.body=Замените пример на реальные детали вашей семьи. Важна точность: одно время начала, один выбор, один запасной вариант и одна финальная фраза. Не превращайте памятку в страницу правил, которую другой взрослый обязан повторить идеально.
options.kicker=Выбирайте по надёжности, а не по новизне
options.title=Живой звонок, полная запись или короткое сообщение?
options.intro=Каждый формат решает свою задачу. Выберите один основным на время поездки, а второй оставьте про запас.
option.1.title=Звонок — для короткого разговора
option.1.body=Звонок подходит, когда время предсказуемо и ребёнку важно общение. Поздоровайтесь, прочитайте небольшой отрывок или задайте один вопрос, а закончить укладывание позвольте взрослому в комнате. Если звонки часто задерживаются, перенесите их на более раннюю часть вечера.
option.2.title=Полная запись — для сказки, которую можно повторить
option.2.body=Запись не зависит от часовых поясов и качества связи. Она сохраняет настоящий темп чтения, смех и голоса персонажей. Запишите всю сказку заранее и один раз прослушайте её на устройстве, которое будет использоваться вечером.
option.3.title=Короткое сообщение — рядом с чтением другого взрослого
option.3.body=Если нет времени записать книгу, хватит приветствия на десять-двадцать секунд. Взрослый дома читает сказку и включает сообщение в условленном месте. Конкретные слова вроде «Надеюсь, сегодня ты выберешь сказку про луну» звучат ближе, чем общее длинное пожелание.
options.source=United Through Reading описывает, как начать записывать семейные чтения до командировки и встроить их в повторяемый ритуал; программа работает с семьями военнослужащих, но сам принцип подготовки можно применять, не приравнивая к ним все семьи
options.source_link=статья о семейном чтении
backup.title=Продумайте сорванный звонок до того, как он случится
backup.intro=Если звонок не состоялся, меняется способ участия, а не отменяется сказка. Договоритесь о следующей последовательности заранее, когда никто не торопится.
backup.1.title=Коротко назовите, что произошло
backup.1.body=Взрослый может сказать: «Сегодня звонок не получился. Но сказка у нас готова». Не заставляйте ребёнка ждать, пока вы много раз пытаетесь дозвониться и время сна сдвигается.
backup.2.title=Используйте готовую замену
backup.2.body=Включите полную запись, поставьте короткое сообщение перед чтением или продолжите вечер только со взрослым дома. Сохраните прежнее одеяло, выбор истории и финальную фразу.
backup.3.title=Оставьте следующий контакт на завтра
backup.3.body=На следующий день можно отправить рисунок, фотографию или голосовое сообщение. Не обещайте точное время ответа, которое уехавший родитель снова может пропустить.
return.title=Когда родитель вернётся, присоединитесь к ритуалу, который продолжался без него
return.body1=Спросите, что понравилось ребёнку, и узнайте у второго взрослого, что реально сработало. Первый вечер после возвращения не требует более длинной сказки или позднего отбоя. Вернитесь в знакомую последовательность и почитайте вместе, если семье этого хочется.
return.body2=Сохраните записи, которые семья захочет слушать снова, и дайте им понятные названия. Удалите неудачные пробы и личные файлы из общих чатов и с ненужных устройств. Небольшую аккуратную библиотеку проще использовать при следующей разлуке.
product.eyebrow=Готовится к выпуску · iOS и Android
product.title=Ваш готовый текст — в формате для прослушивания
product.body=Sleep2Story создаётся для синтетической озвучки полного текста, который предоставляет взрослый, на основе образца голоса совершеннолетнего близкого человека с его согласия. В приложении планируются личная библиотека и плеер. Оно не сохраняет оригинальное исполнение сказки этим взрослым.
product.body2=Приложение ещё готовится к выпуску. Озвучка планируется на английском и русском; наличие других языков на сайте не означает поддержку озвучки на них. Чтобы сохранить точное чтение родителя, запишите всю сказку на телефон.
product.cta=Посмотреть, как работает Sleep2Story
faq.title=Вопросы о сказке на ночь, когда родитель в отъезде
faq.1.question=Что лучше: видеозвонок или запись?
faq.1.answer=Выбирайте звонок, если время и связь надёжны и ребёнку важно общение. Запись удобнее при разных часовых поясах, сменной работе или нестабильном интернете. Можно коротко позвонить раньше, а перед сном включить готовую историю.
faq.2.question=Сколько сказок записать перед поездкой?
faq.2.answer=Начните с одной полной проверенной записи и одного короткого запасного сообщения. Добавляйте новые, когда убедитесь, что семье удобен этот способ. Надёжность важнее большой библиотеки.
faq.3.question=Что сказать, если ребёнок просит только уехавшего родителя?
faq.3.answer=Признайте просьбу, не обещая невозможного: «Ты хотел, чтобы сегодня читала мама. Она в отъезде, а я рядом. Мы можем послушать её сообщение, а потом я прочитаю». Подставьте имена и слова, принятые в вашей семье.
faq.4.question=Подойдёт ли этот план семье, где ребёнок живёт в двух домах?
faq.4.answer=Да, если оба взрослых этого хотят. Договоритесь об одной знакомой детали, доступе к записи и финальной фразе. В остальном у каждого дома может быть свой режим; одинаковое время сна и одинаковые правила не обязательны.
faq.5.question=Sleep2Story заменяет родителя или другого взрослого перед сном?
faq.5.answer=Нет. Взрослый рядом по-прежнему выбирает, начинает и заканчивает ритуал. Sleep2Story готовится как один из вариантов прослушивания готового английского или русского текста с образцом голоса согласившегося взрослого; приложения пока нет в сторах.
