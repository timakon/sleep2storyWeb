schema.description=Практическое руководство для семей: как сохранить привычную сказку на ночь, когда родитель в командировке, работает ночью или живёт отдельно.
hero.eyebrow=Семья на расстоянии · Гайд 06
hero.title=Как сохранить сказку на ночь, когда родитель в отъезде
hero.dek=Командировка, ночная смена или вечер в другом доме меняют того, кто сидит рядом с кроватью. Небольшой план поможет сохранить знакомую историю, привычные слова и участие взрослого, который сегодня дома.
