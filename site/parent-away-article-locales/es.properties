answer.title=Mantén tres cosas: el orden, la señal que inicia el cuento y las últimas palabras.
answer.body=Decidid antes si el progenitor ausente se conectará en directo, grabará todo el cuento o enviará un mensaje corto. Deja a la persona que está en casa la elección del cuento y la frase exacta de buenas noches. Prepara una grabación probada para que un retraso, la mala cobertura o un cambio de turno no decidan la noche.
