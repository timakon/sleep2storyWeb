sources.body=PBS respalda las sugerencias de preparación, calendario y mantenimiento de la rutina. United Through Reading aporta ejemplos de grabación antes de la separación y de un ritual repetible en familias militares. La nota, la comparación de formatos y el plan alternativo son material editorial original de Sleep2Story; ninguna fuente evalúa Sleep2Story.
