hero.title=Mantén familiar la hora del cuento cuando un progenitor está lejos
hero.dek=Un viaje de trabajo, un turno nocturno o una noche en la otra casa cambian quién se sienta junto a la cama. Un plan pequeño conserva el cuento, las palabras conocidas y el papel del adulto que está presente.
