prepare.title=Empieza por la noche que tu hijo ya conoce
prepare.body1=No reconstruyas toda la noche alrededor de quien se marcha. Anota la parte que ya anuncia el cuento: pijama, un poco de agua, la manta azul y después leer. Elige dos o tres detalles que el adulto presente pueda repetir sin montar una función.
prepare.body2=Explica la ausencia con palabras sencillas y di quién estará a la hora de dormir. Si se conocen las fechas, marca las noches en un calendario simple. No prometas una videollamada diaria si el horario o la conexión no la hacen fiable.
prepare.source=PBS KIDS for Parents también recomienda explicar el viaje, usar un calendario y pedir a la persona cuidadora que mantenga las rutinas diarias
prepare.source_link=leer sus consejos de preparación
figure.alt=Ilustración cálida: un adulto lee a un niño mientras una grabación y la foto del progenitor ausente están cerca
figure.caption=El adulto presente sigue guiando la noche; una voz o un mensaje familiar es solo una parte de la rutina.
plan.kicker=Antes de la primera noche separados
plan.title=Prepara el plan del cuento en cuatro pasos
plan.intro=Haz el plan más pequeño que otro adulto pueda usar de verdad. Un cuento terminado sirve más que una carpeta de grabaciones incompletas.
plan.1.title=Elige un ancla
plan.1.body=Mantén un objeto, una frase o una acción en el mismo punto: la manta de rayas, elegir entre dos cuentos o «Nos vemos después de desayunar». El ancla debe funcionar aunque no haya conexión.
plan.2.title=Elige el cuento
plan.2.body=Usa una historia que ya le guste o prepara un texto original completo. Deja el libro o el texto donde se encuentre enseguida. Mantén privada la grabación de un libro publicado y comprueba los derechos antes de compartirla fuera de casa.
plan.3.title=Prepara una aportación de quien está lejos
plan.3.body=Elige una: una llamada a una hora acordada, la grabación del cuento completo o un breve hola y buenas noches. Pon un nombre claro al archivo y pruébalo en el dispositivo que se usará.
plan.4.title=Ensayad una vez la versión normal
plan.4.body=Probad la rutina antes del viaje o del nuevo turno. Que el adulto que se queda empiece el cuento y cierre la noche. Así el niño ve que la velada mantiene un principio y un final aunque cambien los papeles.
handoff.title=Deja una nota de cinco líneas
handoff.intro=Una nota breve elimina pequeñas decisiones de una noche ya ocupada. Envíala en el chat que ambos adultos abren de verdad.
handoff.1.label=1. Inicio
handoff.1.text=Cuento después de lavarse los dientes y ponerse el pijama, sobre las 19:40.
handoff.2.label=2. Elección
handoff.2.text=Ofrecer el libro del conejo o el cuento de la luna; un cuento esta noche.
handoff.3.label=3. Parte del progenitor
handoff.3.text=Llamada a las 19:45. Si no responde tras un intento, reproducir «Cuento del martes».
handoff.4.label=4. Últimas palabras
handoff.4.text=Después del cuento decir: «Buenas noches. Estamos aquí y después llega la mañana».
handoff.5.label=5. Mañana
handoff.5.text=El niño puede enviar un dibujo o una nota de voz; no hace falta esperar respuesta antes de dormir.
handoff.body=Adapta el ejemplo a vuestra familia. Lo útil es concretar: un inicio, una elección, una alternativa y un final. No conviertas la nota en una página de reglas que haya que representar a la perfección.
options.kicker=Elige por fiabilidad, no por novedad
options.title=¿Llamada en directo, grabación completa o mensaje corto?
options.intro=Cada formato cumple una función distinta. Elige uno como opción principal para el viaje y guarda otro de reserva.
option.1.title=Una llamada en directo para hablar un momento
option.1.body=La llamada funciona cuando la hora es previsible y el niño quiere conversar. Saluda, lee un fragmento corto o haz una pregunta; deja que el adulto de la habitación cierre la noche. Si las llamadas suelen retrasarse, hazlas antes.
option.2.title=Una grabación completa para repetir el cuento
option.2.body=La grabación está lista pese a los husos horarios o la mala cobertura. Conserva el ritmo real, la risa y las voces de los personajes. Graba toda la historia con antelación y escúchala una vez en el dispositivo de la noche.
option.3.title=Un mensaje corto junto a la lectura del adulto presente
option.3.body=Diez o veinte segundos bastan si no hay tiempo para grabar un libro. El adulto lee y reproduce el mensaje en el momento acordado. «Espero que hoy elijas el cuento de la luna» resulta más cercano que un discurso genérico.
options.source=United Through Reading explica cómo iniciar lecturas familiares grabadas antes de un despliegue e integrarlas en un ritual repetible; su programa atiende a familias militares, pero la idea de preparación puede adaptarse sin equiparar todas las circunstancias
options.source_link=leer el artículo sobre lectura familiar
backup.title=Escribe el plan para una llamada perdida antes de necesitarlo
backup.intro=Una llamada perdida cambia el medio, no cancela el cuento. Acordad esta secuencia cuando nadie tenga prisa.
backup.1.title=Di brevemente qué ha pasado
backup.1.body=El adulto puede decir: «La llamada no ha funcionado hoy. Tenemos el cuento preparado». No hagas esperar al niño durante muchos intentos mientras se retrasa la hora de dormir.
backup.2.title=Usa la alternativa preparada
backup.2.body=Pon la grabación completa, combina el mensaje corto con la lectura o continúa solo con el adulto presente. Mantén la misma manta, la elección del cuento y la frase final.
backup.3.title=Deja el próximo contacto para mañana
backup.3.body=Al día siguiente podéis enviar un dibujo, una foto o una nota de voz. No prometas una hora exacta de respuesta que el progenitor ausente pueda volver a perder.
return.title=Cuando vuelva, que se incorpore a la rutina que continuó
return.body1=Pregunta al niño qué le gustó y al otro adulto qué funcionó de verdad. La primera noche de vuelta no necesita un cuento más largo ni acostarse más tarde. Retomad el orden conocido y leed juntos si os apetece.
return.body2=Guarda las grabaciones que queráis volver a escuchar y ponles nombres claros. Borra las pruebas fallidas y los archivos privados de chats compartidos o dispositivos que ya no los necesiten. Una biblioteca pequeña y ordenada será más fácil de usar otra vez.
product.eyebrow=En preparación · iOS y Android
product.title=Tu texto terminado, listo para escucharlo
product.body=Estamos desarrollando Sleep2Story para convertir el texto completo que aporta un adulto en una narración sintética, a partir de una muestra de voz de un familiar adulto que haya dado su consentimiento. La aplicación prevista incluye una biblioteca personal de cuentos y un reproductor. No escribe el cuento ni conserva la lectura original de ese adulto.
product.body2=La aplicación sigue en preparación para su lanzamiento. La narración está prevista en inglés y ruso; que la web esté en otros idiomas no significa que la aplicación pueda narrar en ellos. Ya puedes escribir, leer y grabar tu cuento familiar con la grabadora del móvil.
product.cta=Descubre cómo funciona Sleep2Story
faq.title=Preguntas sobre la noche cuando un progenitor está lejos
faq.1.question=¿Es mejor una videollamada que una grabación?
faq.1.answer=Usa la llamada si la hora y la conexión son fiables y el intercambio importa. Usa la grabación si el trabajo, los husos horarios o la cobertura pueden interrumpirla. También podéis hacer un saludo breve antes y escuchar el cuento grabado al acostarse.
faq.2.question=¿Cuántos cuentos conviene grabar antes de un viaje?
faq.2.answer=Empieza con una grabación completa y probada y un mensaje corto de reserva. Añade más solo cuando sepáis que el sistema funciona. La fiabilidad importa más que una biblioteca grande.
faq.3.question=¿Y si el niño solo pide al progenitor ausente?
faq.3.answer=Reconoce lo que pide sin prometer lo imposible: «Hoy querías que leyera mamá. Está de viaje y yo estoy contigo. Podemos escuchar su mensaje y después leo yo». Usa los nombres y palabras de vuestra familia.
faq.4.question=¿Puede funcionar el mismo plan entre dos casas?
faq.4.answer=Sí, si ambos adultos quieren. Acordad una señal conocida, el acceso al archivo y una frase final. El resto de la rutina puede ser diferente en cada casa.
faq.5.question=¿Sleep2Story sustituye al progenitor o al adulto presente?
faq.5.answer=No. El adulto que está allí sigue eligiendo, empezando y cerrando la rutina. Sleep2Story se prepara como una opción para escuchar un texto completo en inglés o ruso con la muestra de voz de un adulto que consiente; aún no está en las tiendas.
