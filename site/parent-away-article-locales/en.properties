schema.description=A practical guide to keeping bedtime storytime familiar when a parent is traveling, working nights or living apart, with a handoff note and backup plan.
hero.eyebrow=Family time apart · Guide 06
hero.title=Keep storytime familiar when a parent is away
hero.dek=Work travel, a night shift or time in another home can change who is beside the bed. A small plan lets the story, the familiar words and the adult who is there still carry the evening.
