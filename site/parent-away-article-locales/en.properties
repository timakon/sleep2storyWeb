faq.title=Questions about bedtime when a parent is away
faq.1.question=Is a video call better than a recording?
faq.1.answer=Use a call when interaction and timing are dependable. Use a recording when time zones, work or signal may interrupt the call. Many families can use a short live hello earlier and a recording at storytime.
faq.2.question=How many stories should we record before a trip?
faq.2.answer=Start with one complete, tested recording and one short backup message. Add more only after the family knows the setup works. Reliability matters more than a large library.
faq.3.question=What if the child asks only for the parent who is away?
faq.3.answer=Acknowledge the request without pretending the parent can appear: “You wanted Mum tonight. She is away, and I am here with you. We can hear her message, then I will read.” Use the names and wording that fit your family.
faq.4.question=Can the same plan work between two homes?
faq.4.answer=Yes, if both adults want it. Agree on a small shared cue, file access and a closing phrase. Each home can keep its own wider routine; the plan does not require identical bedtimes or household rules.
faq.5.question=Does Sleep2Story replace the parent or caregiver at bedtime?
faq.5.answer=No. The adult who is present still chooses, starts and closes the routine. Sleep2Story is being prepared as one listening option for complete English or Russian story text and a consenting adult’s voice sample; it is not yet available in app stores.
