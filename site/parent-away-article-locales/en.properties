prepare.title=Start with the bedtime your child already knows
prepare.body1=Do not rebuild the whole evening around the person who is leaving. Write down the part that already signals storytime: pyjamas, one drink of water, the blue blanket, then a story. Choose two or three details the adult at home can repeat without turning bedtime into a performance.
prepare.body2=Explain the absence in plain words that match your family’s situation and say who will be there at bedtime. If the dates are known, mark the nights on a simple calendar. Avoid promising a live call every evening unless the schedule and connection really make that dependable.
prepare.source=PBS KIDS for Parents likewise suggests explaining travel plans, using a calendar and asking the caregiver to maintain daily routines
prepare.source_link=read its travel preparation tips
figure.alt=Warm storybook illustration of a caregiver reading beside a child while a recording and photograph of the traveling parent sit nearby
figure.caption=The adult at home still leads bedtime; a familiar voice or message is one part of the routine.
plan.kicker=Before the first night apart
plan.title=Prepare the bedtime story plan in four steps
plan.intro=Make the smallest plan another adult can actually use. One dependable story is more useful than a folder of unfinished recordings.
plan.1.title=Choose one anchor
plan.1.body=Keep a familiar object, line or action in the same place each night: the striped blanket, choosing between two stories, or “See you after breakfast.” The anchor should work even if the away parent cannot connect.
plan.2.title=Choose the story
plan.2.body=Use a story the child already likes, or prepare one complete original text. Put the book or text where the caregiver can find it. If you record a published book, keep the recording private and check the rights before sharing it outside your household.
plan.3.title=Prepare one contribution from the away parent
plan.3.body=Pick one: a scheduled call, a recording of the whole story, or a short hello and goodnight message. Name the file clearly and test it on the device that will be used at bedtime.
plan.4.title=Rehearse the ordinary version
plan.4.body=Try the routine once before the trip or new shift. Let the at-home adult start the story and finish the goodnight. The child then sees that the routine still has a beginning and an ending when roles change.
handoff.title=Give the caregiver a five-line handoff note
handoff.intro=A note removes small decisions from an already busy evening. Send it in the message thread both adults actually open.
handoff.1.label=1. Start
handoff.1.text=Story begins after teeth and pyjamas, at about 7:40.
handoff.2.label=2. Choice
handoff.2.text=Offer the rabbit book or the moon story; one story tonight.
handoff.3.label=3. Parent part
handoff.3.text=Call at 7:45. If there is no answer after one try, play “Tuesday story”.
handoff.4.label=4. Closing words
handoff.4.text=After the story say, “Goodnight. We are here, and morning comes next.”
handoff.5.label=5. Tomorrow
handoff.5.text=The child may send one drawing or voice note; no reply is needed before bed.
handoff.body=Change the sample to your real routine. The useful part is precision: one start point, one choice, one backup and one ending. Do not turn the note into a page of rules the caregiver must reproduce perfectly.
options.kicker=Choose by reliability, not novelty
options.title=Live call, full recording or short message?
options.intro=Each format does a different job. Choose one main option for the trip and keep another as backup.
option.1.title=Use a live call for a short conversation
option.1.body=A call works when the time is predictable and the child wants interaction. Keep it simple: say hello, read one short section or ask one question, then let the adult in the room close bedtime. If calls tend to run late, put them earlier in the evening.
option.2.title=Use a full recording for a repeatable story
option.2.body=A recording is ready across time zones and poor connections. It also preserves the parent’s actual pacing, laughter and character voices. Record the whole story in advance and listen once on the bedtime device before relying on it.
option.3.title=Use a short message beside a caregiver’s reading
option.3.body=A ten- or twenty-second hello can be enough when there is no time to record a book. The caregiver reads the story, then plays the message at the agreed point. A specific line such as “I hope you choose the moon story tonight” feels more connected than a generic speech.
options.source=United Through Reading describes starting recorded family storytime before deployment and placing it inside a repeatable ritual; its program serves military families, while the preparation idea can be adapted without assuming every family has the same circumstances
options.source_link=read the family storytime article
backup.title=Write the missed-call plan before anyone needs it
backup.intro=A missed call should change the method, not cancel the story. Agree on the following sequence while everyone is calm.
backup.1.title=Name what happened briefly
backup.1.body=The caregiver can say, “The call did not work tonight. We have the story ready.” Do not make the child wait through repeated dialing while bedtime gets later.
backup.2.title=Use the prepared substitute
backup.2.body=Play the full recording, use the short message and read the book, or continue with the caregiver alone. Keep the same blanket, story choice and closing words.
backup.3.title=Leave reconnection for tomorrow
backup.3.body=Send a drawing, photograph or voice note the next day if the family wants to. Avoid promising an exact reply time the away parent may miss again.
return.title=When the parent comes home, join the routine that continued
return.body1=Ask what the child enjoyed and let the caregiver describe what actually worked. The first evening back does not need a bigger story or a later bedtime. Rejoin the familiar order and read together if that feels natural.
return.body2=Save any recording the family wants to hear again and rename it clearly. Delete failed tests and private files from shared chats or devices that no longer need them. A small, tidy library is easier to use on the next night apart.
product.eyebrow=In preparation · iOS and Android
product.title=Your finished text, prepared for listening
product.body=Sleep2Story is being built to turn the complete story text an adult supplies into synthetic narration, using a consenting adult family member’s voice sample. The planned app includes a personal story library and player. It does not preserve that adult’s original performance of the story.
product.body2=The app is still being prepared for release. Narration is planned for English and Russian; other website languages do not mean narration is supported in those languages. For an exact keepsake of a parent reading, record the full story on a phone.
