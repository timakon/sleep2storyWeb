answer.title=Keep three things steady: the order, the story cue and the final words.
answer.body=Decide before the evening whether the away parent will join live, leave a full recording or send a short message. Give the adult at home the story choice and exact goodnight phrase. Keep one ready-to-play backup so a delayed train, weak signal or changed shift does not decide bedtime.
