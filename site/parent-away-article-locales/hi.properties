schema.description=सफ़र, रात की ड्यूटी या अलग रहने के दौरान बच्चे को सोते समय कहानी सुनाने का परिचित क्रम बनाए रखने की गाइड, जिसमें छोटा नोट और वैकल्पिक योजना है।
hero.eyebrow=परिवार से कुछ समय की दूरी · गाइड 06
hero.title=माता-पिता दूर हों तब भी कहानी का समय परिचित रखें
hero.dek=काम का सफ़र, रात की ड्यूटी या दूसरे घर में बिताई रात बदल सकती है कि बिस्तर के पास कौन है। छोटी सी योजना से कहानी, जाने-पहचाने शब्द और पास मौजूद बड़ा—तीनों शाम को सँभाल सकते हैं।
