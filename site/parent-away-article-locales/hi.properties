answer.title=तीन बातें एक जैसी रखें: क्रम, कहानी का संकेत और आखिरी शब्द।
answer.body=शाम से पहले तय करें कि दूर गए माता या पिता लाइव जुड़ेंगे, पूरी कहानी रिकॉर्ड करेंगे या छोटा संदेश भेजेंगे। घर पर मौजूद बड़े को कहानी की पसंद और शुभरात्रि के ठीक शब्द बताएँ। एक चलाने योग्य दूसरा विकल्प तैयार रखें, ताकि देर से चलती ट्रेन, कमजोर नेटवर्क या बदली ड्यूटी सोने का समय तय न करे।
