prepare.title=बच्चे की पहले से परिचित दिनचर्या से शुरू करें
prepare.body1=किसी के दूर जाने के कारण पूरी शाम नए सिरे से न बनाएँ। वह हिस्सा लिख लें जिससे बच्चे को कहानी का समय समझ आता है: रात के कपड़े, थोड़ा पानी, नीला कंबल, फिर कहानी। दो-तीन ऐसी बातें चुनें जिन्हें घर पर मौजूद बड़ा आसानी से दोहरा सके।
prepare.body2=अपनी परिस्थिति के हिसाब से सीधे शब्दों में बताएँ कि कौन दूर होगा और सोते समय कौन साथ रहेगा। तारीखें मालूम हों तो साधारण कैलेंडर पर रातें चिह्नित करें। हर शाम लाइव कॉल का वादा तभी करें जब समय और संपर्क वाकई भरोसेमंद हों।
prepare.source=PBS KIDS for Parents भी सफ़र के बारे में पहले बताने, कैलेंडर इस्तेमाल करने और देखभाल करने वाले से रोज़ की दिनचर्या बनाए रखने का सुझाव देता है
prepare.source_link=सफ़र की तैयारी के सुझाव पढ़ें
figure.alt=बच्चे को कहानी सुनाते देखभाल करने वाले का गर्मजोशी भरा चित्र; पास में दूर गए माता-पिता की रिकॉर्डिंग और तस्वीर
figure.caption=सोने का समय घर पर मौजूद बड़ा ही सँभालता है; जानी-पहचानी आवाज़ या संदेश दिनचर्या का एक हिस्सा है।
plan.kicker=अलग बिताई पहली रात से पहले
plan.title=सोते समय की कहानी के लिए चार कदम की योजना बनाएँ
plan.intro=इतनी छोटी योजना बनाएँ जिसे दूसरा बड़ा सच में अपना सके। अधूरी रिकॉर्डिंग के पूरे फ़ोल्डर से एक भरोसेमंद कहानी अधिक उपयोगी है।
plan.1.title=एक परिचित संकेत चुनें
plan.1.body=हर रात एक चीज़, बात या काम उसी जगह रखें: धारीदार कंबल, दो कहानियों में चुनाव या “सुबह नाश्ते के बाद मिलेंगे।” यह संकेत दूर गए माता या पिता से संपर्क न होने पर भी काम करे।
plan.2.title=कहानी चुनें
plan.2.body=बच्चे की पुरानी पसंदीदा कहानी लें या एक पूरी मौलिक कहानी लिखें। किताब या पाठ वहाँ रखें जहाँ देखभाल करने वाला उसे ढूँढ़ सके। प्रकाशित किताब रिकॉर्ड करें तो उसे निजी रखें और घर के बाहर साझा करने से पहले अधिकार जाँचें।
plan.3.title=दूर गए माता या पिता का एक योगदान तैयार करें
plan.3.body=एक विकल्प चुनें: तय समय की कॉल, पूरी कहानी की रिकॉर्डिंग या नमस्ते और शुभरात्रि का छोटा संदेश। फ़ाइल का नाम साफ़ रखें और सोते समय इस्तेमाल होने वाले उपकरण पर उसे चलाकर देखें।
plan.4.title=साधारण तरीके का अभ्यास करें
plan.4.body=सफ़र या नई ड्यूटी से पहले एक बार यही क्रम अपनाएँ। घर पर मौजूद बड़ा कहानी शुरू करे और शुभरात्रि कहकर खत्म करे। बच्चा देखेगा कि भूमिकाएँ बदलने पर भी इस क्रम की शुरुआत और अंत बने रहते हैं।
handoff.title=देखभाल करने वाले के लिए पाँच पंक्तियों का नोट
handoff.intro=नोट व्यस्त शाम में छोटी-छोटी बातें तय करने का बोझ घटाता है। इसे उसी चैट में भेजें जिसे दोनों बड़े सच में देखते हैं।
handoff.1.label=1. शुरुआत
handoff.1.text=दाँत साफ़ करने और रात के कपड़े पहनने के बाद, लगभग 7:40 पर कहानी शुरू होती है।
handoff.2.label=2. चुनाव
handoff.2.text=खरगोश वाली किताब या चाँद की कहानी में से चुनने दें; आज एक ही कहानी।
handoff.3.label=3. दूर गए माता या पिता की भूमिका
handoff.3.text=7:45 पर कॉल। एक बार कोशिश में जवाब न आए तो “मंगलवार की कहानी” चलाएँ।
handoff.4.label=4. आखिरी शब्द
handoff.4.text=कहानी के बाद कहें, “शुभरात्रि। हम यहीं हैं, अब सुबह होगी।”
handoff.5.label=5. कल
handoff.5.text=बच्चा एक चित्र या आवाज़ का संदेश भेज सकता है; सोने से पहले जवाब आना ज़रूरी नहीं।
handoff.body=इस नमूने को अपनी असली दिनचर्या के मुताबिक बदलें। काम की बात है स्पष्टता: एक शुरुआत, एक चुनाव, एक दूसरा विकल्प और एक अंत। नोट को इतने नियमों की सूची न बनाएँ जिसे देखभाल करने वाला हूबहू निभाने की चिंता करे।
options.kicker=नएपन के बजाय भरोसेमंद तरीके को चुनें
options.title=लाइव कॉल, पूरी रिकॉर्डिंग या छोटा संदेश?
options.intro=हर तरीके का काम अलग है। सफ़र के लिए एक मुख्य तरीका और दूसरा विकल्प चुनें।
option.1.title=छोटी बातचीत के लिए लाइव कॉल
option.1.body=समय तय हो और बच्चा बातचीत चाहता हो तो कॉल अच्छी है। इसे सरल रखें: नमस्ते कहें, थोड़ा पढ़ें या एक सवाल पूछें, फिर कमरे में मौजूद बड़े को शुभरात्रि का क्रम पूरा करने दें। कॉल देर से लगती हो तो उसे शाम में पहले रखें।
option.2.title=बार-बार सुनाने के लिए पूरी रिकॉर्डिंग
option.2.body=रिकॉर्डिंग अलग समय क्षेत्रों और खराब नेटवर्क में भी तैयार रहती है। इसमें माता या पिता की असली गति, हँसी और पात्रों की आवाज़ भी बचती है। पूरी कहानी पहले रिकॉर्ड करें और उस उपकरण पर एक बार सुनें जिस पर रात में चलाई जाएगी।
option.3.title=देखभाल करने वाले की कहानी के साथ छोटा संदेश
option.3.body=पूरी किताब रिकॉर्ड करने का समय न हो तो दस-बीस सेकंड की आवाज़ भी काफी हो सकती है। देखभाल करने वाला कहानी पढ़े और तय जगह पर संदेश चलाए। “उम्मीद है आज तुम चाँद वाली कहानी चुनोगे” जैसा खास वाक्य साधारण संबोधन से अधिक अपना लगता है।
options.source=United Through Reading बताता है कि दूर जाने से पहले परिवार की कहानी रिकॉर्ड करके उसे नियमित क्रम का हिस्सा कैसे बनाया जाए; उसका कार्यक्रम सैन्य परिवारों के लिए है, लेकिन तैयारी का विचार दूसरी परिस्थितियों में भी अपनाया जा सकता है
options.source_link=परिवार की कहानी वाले लेख को पढ़ें
backup.title=कॉल छूटने से पहले ही दूसरा तरीका तय कर लें
backup.intro=कॉल न लगे तो कहानी का तरीका बदले, कहानी रद्द न हो। सब शांत हों तभी यह क्रम तय कर लें।
backup.1.title=जो हुआ उसे थोड़े शब्दों में बताएँ
backup.1.body=देखभाल करने वाला कह सकता है, “आज कॉल नहीं लग पाई। हमारी कहानी तैयार है।” बार-बार फ़ोन मिलाते हुए बच्चे को जगाए न रखें।
backup.2.title=तैयार दूसरा विकल्प अपनाएँ
backup.2.body=पूरी रिकॉर्डिंग चलाएँ, छोटा संदेश सुनाकर किताब पढ़ें या घर पर मौजूद बड़ा खुद कहानी सुनाए। वही कंबल, कहानी चुनने का तरीका और शुभरात्रि के शब्द रखें।
backup.3.title=दोबारा बात कल पर छोड़ें
backup.3.body=परिवार चाहे तो अगले दिन चित्र, तस्वीर या आवाज़ का संदेश भेजे। जवाब का ऐसा पक्का समय न बताएँ जिसे दूर गए माता या पिता फिर चूक सकते हैं।
return.title=माता या पिता लौटें तो चलती रही दिनचर्या में शामिल हों
return.body1=पूछें बच्चे को क्या अच्छा लगा और देखभाल करने वाले से जानें कि सच में क्या काम आया। लौटने की पहली शाम बड़ी कहानी या देर से सोने की ज़रूरत नहीं। परिचित क्रम से जुड़ें और सहज लगे तो साथ पढ़ें।
return.body2=जिस रिकॉर्डिंग को परिवार फिर सुनना चाहे उसे साफ़ नाम देकर रखें। असफल परीक्षण और निजी फ़ाइलें उन साझा चैट या उपकरणों से हटा दें जहाँ उनकी अब ज़रूरत नहीं। छोटा, सधा संग्रह अगली दूरी के समय इस्तेमाल करना आसान रहता है।
product.eyebrow=तैयारी में · iOS और Android
product.title=आपका पूरा लिखा पाठ, सुनाने के लिए तैयार
product.body=Sleep2Story को इस तरह बनाया जा रहा है कि कोई बड़ा व्यक्ति जो पूरी कहानी लिखे, उसे परिवार के सहमति देने वाले वयस्क की आवाज़ के नमूने से कृत्रिम स्वर में सुनाया जा सके। नियोजित ऐप में निजी कहानी संग्रह और प्लेयर होगा। यह उस व्यक्ति के मूल कहानी पढ़ने की रिकॉर्डिंग सुरक्षित नहीं करता।
product.body2=ऐप अभी जारी होने की तैयारी में है। माता या पिता के असली पाठ की याद सँभालनी हो तो फ़ोन पर पूरी कहानी रिकॉर्ड करें।
product.cta=जानें Sleep2Story कैसे काम करेगा
faq.title=माता-पिता दूर हों तो कहानी से जुड़े सवाल
faq.1.question=वीडियो कॉल रिकॉर्डिंग से बेहतर है?
faq.1.answer=बातचीत और समय भरोसेमंद हों तो कॉल करें। समय क्षेत्र, काम या नेटवर्क बीच में आ सकते हों तो रिकॉर्डिंग रखें। कई परिवार शाम में छोटी लाइव बातचीत और कहानी के समय रिकॉर्डिंग दोनों इस्तेमाल कर सकते हैं।
faq.2.question=सफ़र से पहले कितनी कहानियाँ रिकॉर्ड करें?
faq.2.answer=एक पूरी, जाँची हुई रिकॉर्डिंग और एक छोटा वैकल्पिक संदेश तैयार करें। तरीका ठीक चले तब और जोड़ें। बड़े संग्रह से ज्यादा ज़रूरी है कि जो है वह चले।
faq.3.question=बच्चा सिर्फ दूर गए माता या पिता को ही बुलाए तो?
faq.3.answer=उसकी इच्छा मानें, बिना यह जताए कि दूर गया व्यक्ति तुरंत आ सकता है: “तुम आज मम्मी को चाहते थे। वह दूर हैं और मैं तुम्हारे साथ हूँ। उनका संदेश सुनेंगे, फिर मैं पढ़ूँगा।” अपने परिवार के मुताबिक नाम और शब्द बदलें।
faq.4.question=क्या यही योजना दो घरों के बीच चल सकती है?
faq.4.answer=हाँ, अगर दोनों बड़े चाहें। एक साझा संकेत, फ़ाइल तक पहुँच और शुभरात्रि की बात तय करें। बाकी दिनचर्या हर घर की अपनी हो सकती है; सोने के समय या नियम एक जैसे होना ज़रूरी नहीं।
faq.5.question=क्या Sleep2Story सोते समय माता-पिता या देखभाल करने वाले की जगह लेगा?
faq.5.answer=नहीं। पास मौजूद बड़ा ही क्रम चुनता, शुरू करता और पूरा करता है। Sleep2Story को पूरे लिखे पाठ और सहमति देने वाले वयस्क की आवाज़ के नमूने के लिए एक सुनने के विकल्प के रूप में तैयार किया जा रहा है; यह अभी ऐप स्टोर में उपलब्ध नहीं है।
