consent.body=La personne concernée enregistre elle-même l’échantillon, peut l’écouter et recommencer. Une confirmation explicite est requise avant l’envoi.
faq.title=Questions avant de dormir
faq.1.question=Sleep2Story écrit-il lui-même les histoires ?
faq.1.answer=Non. Vous ajoutez le titre et le texte intégral, puis l’application prépare une version audio avec la voix familiale choisie.
faq.2.question=Comment la voix est-elle enregistrée ?
faq.2.answer=Un adulte lit un court passage guidé, écoute l’enregistrement et peut recommencer. Son consentement explicite est requis avant l’envoi.
faq.3.question=Peut-on écouter et lire en même temps ?
faq.3.answer=Oui. Le lecteur affiche le texte de l’histoire et les commandes de lecture.
faq.4.question=Où télécharger Sleep2Story ?
faq.4.answer=Sleep2Story est en préparation pour iOS et Android. Les liens vers les boutiques apparaîtront après la publication de l’application.
