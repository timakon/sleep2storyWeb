consent.body=De persoon van wie de stem is neemt het fragment zelf op, kan het terugluisteren en opnieuw opnemen. Voor het uploaden is een uitdrukkelijke bevestiging nodig.
faq.title=Vragen voor het slapengaan
faq.1.question=Schrijft Sleep2Story zelf verhalen?
faq.1.answer=Nee. Je voegt de titel en de volledige tekst toe; de app maakt een audioversie met de gekozen familiestem.
faq.2.question=Hoe wordt de stem opgenomen?
faq.2.answer=Een volwassene leest een korte begeleide tekst, luistert de opname terug en kan opnieuw opnemen. Voor het uploaden is uitdrukkelijke toestemming nodig.
faq.3.question=Kun je tegelijk luisteren en meelezen?
faq.3.answer=Ja. De speler bevat de tekst van het verhaal en de afspeelbediening.
faq.4.question=Waar kan ik Sleep2Story downloaden?
faq.4.answer=Sleep2Story wordt voorbereid voor iOS en Android. Links naar de stores verschijnen zodra de app is gepubliceerd.
