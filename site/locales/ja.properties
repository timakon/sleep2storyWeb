faq.title=寝る前によくある質問
faq.1.question=Sleep2Story が物語を書いてくれますか？
faq.1.answer=いいえ。タイトルと物語の全文をあなたが追加し、アプリが選択した家族の声による音声版を準備します。
faq.2.question=声はどのように録音しますか？
faq.2.answer=大人が案内に沿って短い文章を読み、録音を確認します。録り直しも可能です。アップロード前には話し手本人の明確な同意が必要です。
faq.3.question=聴きながら文章を読むこともできますか？
faq.3.answer=はい。プレーヤーには物語の文章と再生操作が用意されています。
faq.4.question=Sleep2Story はどこでダウンロードできますか？
faq.4.answer=Sleep2Story は iOS と Android 向けに公開準備中です。アプリ公開後にストアへのリンクを掲載します。
