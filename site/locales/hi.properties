consent.line2=फिर रिकॉर्डिंग।
consent.body=जिसकी आवाज़ है, वह खुद नमूना रिकॉर्ड करता है, उसे सुन सकता है और दोबारा रिकॉर्ड कर सकता है। अपलोड से पहले उसकी स्पष्ट सहमति ज़रूरी है।
faq.title=सोने से पहले के सवाल
faq.1.question=क्या Sleep2Story खुद कहानियाँ लिखता है?
faq.1.answer=नहीं। आप कहानी का शीर्षक और पूरा पाठ जोड़ते हैं। ऐप परिवार की चुनी हुई आवाज़ में उसका ऑडियो तैयार करता है।
faq.2.question=आवाज़ कैसे रिकॉर्ड होती है?
faq.2.answer=कोई वयस्क छोटे निर्देशित पाठ को पढ़ता है, रिकॉर्डिंग सुनता है और चाहें तो दोबारा रिकॉर्ड करता है। अपलोड से पहले उसकी स्पष्ट सहमति ली जाती है।
faq.3.question=क्या कहानी सुनते हुए पढ़ भी सकते हैं?
faq.3.answer=हाँ। प्लेयर में कहानी का पाठ और ऑडियो चलाने के नियंत्रण दोनों मिलते हैं।
faq.4.question=Sleep2Story कहाँ से डाउनलोड करूँ?
faq.4.answer=Sleep2Story iOS और Android के लिए तैयार किया जा रहा है। ऐप प्रकाशित होने पर स्टोर के लिंक यहाँ दिखाई देंगे।
