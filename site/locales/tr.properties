faq.title=Uyumadan önce sorulanlar
faq.1.question=Sleep2Story hikâyeleri kendi mi yazıyor?
faq.1.answer=Hayır. Başlığı ve hikâyenin tam metnini siz eklersiniz; uygulama seçtiğiniz aile sesiyle bir sesli sürüm hazırlar.
faq.2.question=Ses nasıl kaydediliyor?
faq.2.answer=Bir yetişkin kısa yönlendirmeli metni okur, kaydı dinler ve yeniden kaydedebilir. Yüklemeden önce açık onayı gerekir.
faq.3.question=Aynı anda dinleyip okuyabilir miyiz?
faq.3.answer=Evet. Oynatıcıda hikâye metni ve oynatma kontrolleri bulunur.
faq.4.question=Sleep2Story’yi nereden indirebilirim?
faq.4.answer=Sleep2Story iOS ve Android için hazırlanıyor. Mağaza bağlantıları uygulama yayımlandıktan sonra eklenecek.
