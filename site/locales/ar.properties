consent.body=يسجّل صاحب الصوت العيّنة بنفسه، ويمكنه الاستماع إليها وإعادة تسجيلها. يلزم تأكيد موافقته صراحةً قبل رفعها.
faq.title=أسئلة قبل النوم
faq.1.question=هل يكتب Sleep2Story الحكايات؟
faq.1.answer=لا. أنت تضيف عنوان الحكاية ونصّها الكامل، ويُعدّ التطبيق نسخة صوتية بصوت أحد أفراد العائلة الذي اخترته.
faq.2.question=كيف يُسجَّل الصوت؟
faq.2.answer=يقرأ شخص بالغ مقطعًا قصيرًا بإرشادات واضحة، ويستمع إلى التسجيل، ويمكنه إعادته. لا تُرفع العيّنة إلا بعد موافقته الصريحة.
faq.3.question=هل يمكننا الاستماع والقراءة في الوقت نفسه؟
faq.3.answer=نعم. يعرض المشغّل نص الحكاية مع أدوات التحكّم في التشغيل.
faq.4.question=من أين يمكنني تنزيل Sleep2Story؟
faq.4.answer=يجري تجهيز Sleep2Story لنظامَي iOS وAndroid. ستظهر روابط المتاجر بعد نشر التطبيق.
