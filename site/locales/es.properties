faq.title=Preguntas antes de dormir
faq.1.question=¿Sleep2Story escribe los cuentos?
faq.1.answer=No. Tú añades el título y el texto completo, y la aplicación prepara una versión en audio con la voz familiar elegida.
faq.2.question=¿Cómo se graba la voz?
faq.2.answer=Una persona adulta lee un breve texto guiado, escucha la grabación y puede repetirla. Se requiere su consentimiento expreso antes del envío.
faq.3.question=¿Se puede escuchar y leer a la vez?
faq.3.answer=Sí. El reproductor incluye el texto del cuento y los controles de reproducción.
faq.4.question=¿Dónde puedo descargar Sleep2Story?
faq.4.answer=Sleep2Story se está preparando para iOS y Android. Los enlaces a las tiendas aparecerán cuando se publique la aplicación.
