consent.eyebrow=Uma voz familiar — com autorização
consent.line1=Primeiro, consentimento.
consent.line2=Depois, gravação.
consent.body=A própria pessoa grava a amostra, pode ouvi-la e voltar a gravar. É necessária uma confirmação explícita antes do envio.
faq.title=Perguntas antes de dormir
faq.1.question=O Sleep2Story escreve as histórias?
faq.1.answer=Não. Adiciona o título e o texto completo, e a aplicação prepara uma versão em áudio com a voz familiar escolhida.
faq.2.question=Como é gravada a voz?
faq.2.answer=Uma pessoa adulta lê um pequeno texto orientado, ouve a gravação e pode repeti-la. É necessário o seu consentimento explícito antes do envio.
faq.3.question=É possível ouvir e ler ao mesmo tempo?
faq.3.answer=Sim. O leitor inclui o texto da história e os controlos de reprodução.
faq.4.question=Onde posso descarregar o Sleep2Story?
faq.4.answer=O Sleep2Story está a ser preparado para iOS e Android. As ligações para as lojas aparecerão após a publicação da aplicação.
