faq.title=Pitanja pred spavanje
faq.1.question=Da li Sleep2Story sam piše priče?
faq.1.answer=Ne. Vi dodajete naslov i ceo tekst priče, a aplikacija priprema audio-verziju izabranim porodičnim glasom.
faq.2.question=Kako se snima glas?
faq.2.answer=Odrasla osoba čita kratak vođeni tekst, preslušava snimak i može ponovo da ga snimi. Pre slanja je potrebna njena izričita saglasnost.
faq.3.question=Možemo li istovremeno da slušamo i čitamo?
faq.3.answer=Da. Plejer sadrži tekst priče i kontrole reprodukcije.
faq.4.question=Gde mogu da preuzmem Sleep2Story?
faq.4.answer=Sleep2Story se priprema za iOS i Android. Linkovi do prodavnica biće dostupni nakon objavljivanja aplikacije.
