consent.body=Владелец голоса записывает образец сам, может прослушать и перезаписать его. Перед загрузкой нужно явное подтверждение.
faq.title=Перед сном спрашивают
faq.1.question=Sleep2Story сам сочиняет сказки?
faq.1.answer=Нет. Вы добавляете название и полный текст сказки, а приложение готовит её аудиоверсию выбранным семейным голосом.
faq.2.question=Как записывается голос?
faq.2.answer=Взрослый читает короткий предложенный текст, слушает запись и при необходимости перезаписывает её. Перед загрузкой требуется явное согласие владельца голоса.
faq.3.question=Можно слушать и читать одновременно?
faq.3.answer=Да. В плеере доступен текст истории и управление воспроизведением.
faq.4.question=Где скачать Sleep2Story?
faq.4.answer=Sleep2Story готовится для iOS и Android. Ссылки на магазины появятся после публикации приложения.
