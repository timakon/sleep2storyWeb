consent.eyebrow=동의를 받아 사용하는 익숙한 목소리
consent.line1=먼저 동의하고,
consent.line2=그다음 녹음합니다.
consent.body=목소리 제공자가 직접 샘플을 녹음하고 확인하거나 다시 녹음할 수 있습니다. 업로드 전에는 명시적인 동의 확인이 필요합니다.
faq.title=잠들기 전 궁금한 점
faq.1.question=Sleep2Story가 이야기를 써 주나요?
faq.1.answer=아니요. 제목과 이야기의 전체 글을 직접 넣으면, 앱이 선택한 가족 목소리로 오디오 버전을 준비합니다.
faq.2.question=목소리는 어떻게 녹음하나요?
faq.2.answer=성인이 짧은 안내문을 읽고 녹음 내용을 확인한 뒤 필요하면 다시 녹음할 수 있습니다. 업로드 전 목소리 제공자의 명시적인 동의가 필요합니다.
faq.3.question=들으면서 글도 읽을 수 있나요?
faq.3.answer=네. 플레이어에서 이야기 글과 재생 기능을 함께 이용할 수 있습니다.
faq.4.question=Sleep2Story는 어디서 다운로드하나요?
faq.4.answer=Sleep2Story는 iOS와 Android용으로 출시를 준비 중입니다. 앱이 공개되면 스토어 링크를 안내해 드리겠습니다.
end.line1=오늘 밤엔 좋아하는 이야기.
end.line2=내일도 곁에 있는 익숙한 목소리.
