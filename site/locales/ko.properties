step1.title=목소리
step1.body=짧은 안내문을 읽고 녹음된 샘플을 확인한 뒤, 목소리 제공자의 동의를 확인합니다.
step2.title=이야기
step2.body=좋아하는 이야기의 제목과 전체 글을 추가합니다.
step3.title=플레이어
step3.body=들으며 글을 읽고, 원하는 부분으로 이동하거나 멈춘 곳부터 이어 들을 수 있습니다.
inside.eyebrow=실제 앱 화면
inside.line1=앱의 모든 기능은
inside.line2=어른을 위해 만들었어요.
inside.body=실제 Sleep2Story 화면과 확인된 기능을 보여드립니다. 존재하지 않는 이야기 목록이나 즉시 생성 기능을 약속하지 않습니다.
inside.caption1=이야기 전체 글 추가
inside.caption2=우리 집 저녁 이야기 보관함
