faq.title=睡前常见问题
faq.1.question=Sleep2Story 会自己编故事吗？
faq.1.answer=不会。你需要添加故事标题和全文，应用会用选定的家人声音制作音频版本。
faq.2.question=声音是怎么录制的？
faq.2.answer=成年人按提示朗读一小段文字，试听后可以重新录制。上传前必须获得声音提供者的明确同意。
faq.3.question=可以一边听一边看文字吗？
faq.3.answer=可以。播放器提供故事正文和播放控制。
faq.4.question=在哪里下载 Sleep2Story？
faq.4.answer=Sleep2Story 正在为 iOS 和 Android 做上线准备。应用发布后，网站会提供商店链接。
