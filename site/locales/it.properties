consent.body=La persona interessata registra il campione, può riascoltarlo e registrarlo di nuovo. Prima dell’invio è richiesta una conferma esplicita.
faq.title=Domande prima di dormire
faq.1.question=Sleep2Story scrive le storie?
faq.1.answer=No. Aggiungi il titolo e il testo completo, poi l’app prepara una versione audio con la voce familiare scelta.
faq.2.question=Come viene registrata la voce?
faq.2.answer=Una persona adulta legge un breve testo guidato, ascolta la registrazione e può rifarla. Prima dell’invio è richiesto il suo consenso esplicito.
faq.3.question=Si può ascoltare e leggere insieme?
faq.3.answer=Sì. Il lettore include il testo della storia e i controlli di riproduzione.
faq.4.question=Dove posso scaricare Sleep2Story?
faq.4.answer=Sleep2Story è in preparazione per iOS e Android. I link agli store saranno disponibili dopo la pubblicazione dell’app.
