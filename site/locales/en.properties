faq.title=Questions before bedtime
faq.1.question=Does Sleep2Story write stories?
faq.1.answer=No. You add the title and full story text, and the app prepares an audio version in the selected family voice.
faq.2.question=How is the voice recorded?
faq.2.answer=An adult reads a short guided passage, reviews the recording, and can record it again. Explicit consent from the speaker is required before upload.
faq.3.question=Can we listen and read at the same time?
faq.3.answer=Yes. The player includes the story text and playback controls.
faq.4.question=Where can I download Sleep2Story?
faq.4.answer=Sleep2Story is being prepared for iOS and Android. Store links will appear after the app is published.
