consent.eyebrow=Eine vertraute Stimme — mit Erlaubnis
consent.line1=Erst die Einwilligung.
consent.line2=Dann die Aufnahme.
consent.body=Die sprechende Person nimmt die Stimmprobe selbst auf, kann sie anhören und erneut aufnehmen. Vor dem Hochladen ist eine ausdrückliche Bestätigung erforderlich.
faq.title=Fragen vor dem Einschlafen
faq.1.question=Schreibt Sleep2Story selbst Geschichten?
faq.1.answer=Nein. Sie fügen Titel und vollständigen Text hinzu; die App erstellt daraus eine Audioversion mit der gewählten vertrauten Stimme.
faq.2.question=Wie wird die Stimme aufgenommen?
faq.2.answer=Eine erwachsene Person liest einen kurzen vorgegebenen Text, hört die Aufnahme an und kann sie wiederholen. Vor dem Hochladen ist ihre ausdrückliche Einwilligung erforderlich.
faq.3.question=Kann man gleichzeitig hören und mitlesen?
faq.3.answer=Ja. Im Player stehen der Text der Geschichte und die Wiedergabesteuerung zur Verfügung.
faq.4.question=Wo kann ich Sleep2Story herunterladen?
faq.4.answer=Sleep2Story wird für iOS und Android vorbereitet. Die Links zu den Stores folgen nach der Veröffentlichung der App.
end.line1=Heute eine Lieblingsgeschichte.
