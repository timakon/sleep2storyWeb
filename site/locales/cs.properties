consent.eyebrow=Známý hlas — se svolením
consent.line1=Nejprve souhlas.
consent.line2=Potom nahrávání.
consent.body=Osoba, které hlas patří, nahraje ukázku sama, může si ji poslechnout a nahrát znovu. Před odesláním je vyžadováno výslovné potvrzení.
faq.title=Otázky před spaním
faq.1.question=Píše Sleep2Story příběhy samo?
faq.1.answer=Ne. Přidáte název a celý text příběhu a aplikace připraví audioverzi vybraným rodinným hlasem.
faq.2.question=Jak se hlas nahrává?
faq.2.answer=Dospělý přečte krátký vedený text, poslechne si nahrávku a může ji zopakovat. Před odesláním je vyžadován jeho výslovný souhlas.
faq.3.question=Lze zároveň poslouchat a číst?
faq.3.answer=Ano. Přehrávač obsahuje text příběhu a ovládání přehrávání.
faq.4.question=Kde si mohu Sleep2Story stáhnout?
faq.4.answer=Sleep2Story se připravuje pro iOS a Android. Odkazy na obchody se objeví po vydání aplikace.
end.line1=Dnes večer oblíbený příběh.
end.line2=Zítra znovu známý hlas.
