consent.eyebrow=Znajomy głos — za zgodą
consent.line1=Najpierw zgoda.
consent.line2=Potem nagranie.
consent.body=Osoba, do której należy głos, sama nagrywa próbkę, może jej odsłuchać i nagrać ją ponownie. Przed przesłaniem wymagane jest wyraźne potwierdzenie.
faq.title=Pytania przed snem
faq.1.question=Czy Sleep2Story sam pisze historie?
faq.1.answer=Nie. Dodajesz tytuł i pełny tekst historii, a aplikacja przygotowuje wersję audio wybranym rodzinnym głosem.
faq.2.question=Jak nagrywany jest głos?
faq.2.answer=Dorosła osoba czyta krótki przygotowany tekst, odsłuchuje nagranie i może nagrać je ponownie. Przed przesłaniem wymagana jest jej wyraźna zgoda.
faq.3.question=Czy można jednocześnie słuchać i czytać?
faq.3.answer=Tak. Odtwarzacz zawiera tekst historii i sterowanie odtwarzaniem.
faq.4.question=Skąd pobrać Sleep2Story?
faq.4.answer=Sleep2Story jest przygotowywane na iOS i Androida. Linki do sklepów pojawią się po publikacji aplikacji.
