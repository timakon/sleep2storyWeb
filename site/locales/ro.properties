consent.eyebrow=O voce familiară — cu permisiune
consent.line1=Mai întâi consimțământul.
consent.line2=Apoi înregistrarea.
consent.body=Persoana își înregistrează singură mostra de voce, o poate asculta și reînregistra. Înainte de încărcare este necesară o confirmare explicită.
faq.title=Întrebări înainte de culcare
faq.1.question=Sleep2Story scrie singur poveștile?
faq.1.answer=Nu. Tu adaugi titlul și textul integral, iar aplicația pregătește o versiune audio cu vocea aleasă din familie.
faq.2.question=Cum este înregistrată vocea?
faq.2.answer=Un adult citește un text scurt ghidat, ascultă înregistrarea și o poate repeta. Înainte de încărcare este necesar consimțământul său explicit.
faq.3.question=Putem asculta și citi în același timp?
faq.3.answer=Da. Playerul include textul poveștii și comenzile de redare.
faq.4.question=De unde pot descărca Sleep2Story?
faq.4.answer=Sleep2Story este în pregătire pentru iOS și Android. Linkurile către magazine vor apărea după publicarea aplicației.
end.line1=O poveste preferată în seara asta.
end.line2=O voce familiară și mâine.
