consent.body=Власник голосу сам записує зразок, може його прослухати й записати ще раз. Перед завантаженням потрібне явне підтвердження.
faq.title=Запитання перед сном
faq.1.question=Sleep2Story сам пише казки?
faq.1.answer=Ні. Ви додаєте назву й повний текст казки, а застосунок готує аудіоверсію вибраним сімейним голосом.
faq.2.question=Як записується голос?
faq.2.answer=Доросла людина читає короткий запропонований текст, слухає запис і за потреби записує його ще раз. Перед завантаженням потрібна її явна згода.
faq.3.question=Можна слухати й читати одночасно?
faq.3.answer=Так. У плеєрі доступні текст історії та керування відтворенням.
faq.4.question=Де завантажити Sleep2Story?
faq.4.answer=Sleep2Story готується до виходу на iOS та Android. Посилання на магазини з’являться після публікації застосунку.
