hero.eyebrow=Сказки на вашем языке · Гид 07
hero.title=Сказки на ночь на разных языках
hero.dek=Сказка перед сном должна звучать привычно для ребёнка. Sleep2Story готовится озвучивать готовые тексты на 30+ языках, чтобы каждая семья могла выбрать свой.
byline.read_time=5 минут чтения
byline.date=30 сентября 2026 года
answer.title=Начните с языка, который ребёнок хорошо знает.
answer.body=Напишите короткую законченную сказку на языке, на котором хотите её прочитать или озвучить. Оставьте знакомые ребёнку имена и домашние слова. Если нужна версия на другом языке, подготовьте её отдельно и естественно. Начните с языка, который звучит у вас дома.
plan.title=Как подготовить сказку на выбранном языке
plan.body1=Выберите героя, знакомую вещь и одно спокойное событие. Для начала хватит текста на две-три минуты чтения. Пишите на языке вашей семьи, даже если он не совпадает с языком этой страницы.
plan.body2=Используйте привычные ребёнку обращения, названия мест и домашние выражения. Если вы неуверенно пишете на выбранном языке, попросите близкого человека, который им владеет, вычитать текст. Живая фраза важнее дословного перевода.
plan.body3=Сохраните готовый текст до записи аудио. Уже сейчас его можно прочитать самим или целиком записать на телефон. Sleep2Story готовит синтетическую озвучку по полному тексту и образцу голоса взрослого с его согласия; приложения пока нет в магазинах.
