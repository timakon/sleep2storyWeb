hero.eyebrow=Двуязычная семейная сказка · Гид 07
hero.title=Сказка на ночь на двух языках
hero.dek=Одно небольшое приключение может звучать на двух языках семьи. Не нужно переводить каждую фразу на ходу или превращать вечер в урок слов.
byline.read_time=6 минут чтения
byline.date=30 сентября 2026 года
answer.title=Сохраните один сюжет и подготовьте две полноценные версии.
answer.body=Выберите короткую собственную сказку, оставьте тех же героев и финал, а на каждом языке расскажите её так, как говорят у вас дома. Читайте одну версию за раз: знакомая деталь поможет ребёнку узнать историю на любом языке.
plan.title=Как подготовить сказку на двух языках
plan.body1=Возьмите одну простую сцену: герой, знакомая вещь и маленькое событие. Для начала хватит сказки на две-три минуты. Первую версию напишите на языке, на котором вам легче всего разговаривать с ребёнком.
plan.body2=Вторую версию не переводите слово в слово. Сохраните события и финальный образ. «Бабушка» может стать тем словом, которым ребёнок зовёт её на другом языке. Если вы сомневаетесь в формулировке, попросите родственника, который свободно говорит на этом языке, прочитать текст.
plan.body3=Храните два законченных текста отдельно или на соседних страницах. Сегодня ребёнок может выбрать язык сам, а в разные вечера сказку могут читать разные взрослые. Не обязательно останавливать чтение ради перевода каждой строки или проверки новых слов.
story.kicker=Готовый пример для чтения
story.title=Пример одной сказки на двух языках
story.intro=Ниже — одна законченная история в двух версиях. В обеих есть бумажная звёздочка, дождливый вечер и спокойный финал. Имена и семейные обращения можно заменить на ваши.
story.first_title=Бумажная звёздочка
story.first_p1=Каждый вечер Ника и бабушка ставили бумажную звёздочку у кухонного окна. «Для кого она?» — спросила Ника. «Для тех, кто ищет дорогу домой», — ответила бабушка. Однажды дождливым вечером звёздочка упала за шкаф. Они заглянули под стол и между ботинками, но нашли только жёлтый карандаш.
story.first_p2=Бабушка сложила новую звёздочку из старого списка покупок. Ника нарисовала в середине яркую точку. Они прикрепили звёздочку к стеклу, чтобы сквозь неё светила кухонная лампа. Вскоре папа открыл дверь и стряхнул дождь с куртки. «Я видел нашу звезду», — сказал он. Ника улыбнулась. Потерявшуюся звёздочку можно поискать утром.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Меняйте слова, но берегите сюжет
adapt.body1=«Бабушка» может быть бабулей или носить другое домашнее имя. Используйте привычное ребёнку обращение в обеих версиях. Кухню тоже можно заменить знакомым местом. Важны порядок событий и настроение, а не одинаковое число слов в предложении.
adapt.body2=Если берёте за основу чужую опубликованную книгу, оставьте переделку для семьи и проверьте права, прежде чем выкладывать текст или запись публично. Собственную короткую историю использовать проще.
reading.title=План чтения на два вечера
reading.body1=В первый вечер прочитайте одну версию целиком и обратите внимание на звёздочку у окна. На следующий — другую, не прерываясь после каждого предложения. Если ребёнок спросит о слове, ответьте коротко и вернитесь к сказке. Повторить любимую версию тоже нормально.
reading.body2=Родственник, который говорит на другом языке, может прочитать свою версию рядом или записать её на телефон. Скажите ребёнку, чей голос он услышит. Взрослый, который сейчас рядом, по-прежнему может остановить запись, поговорить и завершить вечер так, как принято в семье.
product.body2=Приложение ещё готовится к выпуску. Пока сохраните два текста отдельно и читайте их сами или запишите на телефон. Обычная запись сохраняет настоящее чтение человека; планируемая синтетическая озвучка по образцу голоса работает иначе.
faq.title=Вопросы о двуязычных сказках
faq.1.question=Нужно ли переключать язык после каждого предложения?
faq.1.answer=Не обязательно. Две цельные версии проще слушать перед сном. Если ребёнок сам смешивает языки и ему это нравится, не нужно вводить жёсткое правило.
faq.2.question=Что делать, если я знаю только один из двух языков?
faq.2.answer=Читайте ту версию, в которой вам удобно. Попросите близкого человека, владеющего вторым языком, помочь с текстом или чтением. Изображать свободное владение языком не требуется.
sources.body=Colorín Colorado советует семьям читать детям на домашнем языке; план с двумя версиями и история о звёздочке — авторские примеры редакции Sleep2Story. Дополнительно:
