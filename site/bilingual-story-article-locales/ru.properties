languages.title=На каком языке может быть сказка?
languages.intro=Планируется озвучка более чем на 30 языках. Язык сайта нужен лишь для чтения этой статьи: он не определяет язык вашей сказки.
languages.examples=Например, семьи могут писать сказки на английском, немецком, французском, испанском, итальянском, португальском, нидерландском, польском, чешском, румынском, сербском, украинском, русском, турецком, арабском, хинди, китайском (путунхуа), японском, корейском и индонезийском.
languages.note=Эти 20 языков — примеры для текста, а не подтверждённый список озвучки на старте. Точный перечень Sleep2Story опубликует к выходу приложения. Если хотите несколько версий, для каждой понадобится готовый текст.
story.kicker=Готовый пример для чтения
story.title=Короткая сказка на русском языке
story.intro=Ниже — авторский пример на русском языке, потому что эта страница на русском. В других языковых версиях сайта та же история написана на языке соответствующей страницы. Возьмите за основу простой сюжет и спокойный финал, а имена и детали замените на близкие вашей семье.
story.first_title=Бумажная звёздочка
story.first_p1=Каждый вечер Ника и бабушка ставили бумажную звёздочку у кухонного окна. «Для кого она?» — спросила Ника. «Для тех, кто ищет дорогу домой», — ответила бабушка. Однажды дождливым вечером звёздочка упала за шкаф. Они заглянули под стол и между ботинками, но нашли только жёлтый карандаш.
story.first_p2=Бабушка сложила новую звёздочку из старого списка покупок. Ника нарисовала в середине яркую точку. Они прикрепили звёздочку к стеклу, чтобы сквозь неё светила кухонная лампа. Вскоре папа открыл дверь и стряхнул дождь с куртки. «Я видел нашу звезду», — сказал он. Ника улыбнулась. Потерявшуюся звёздочку можно поискать утром.
adapt.title=Пусть слова звучат по-домашнему
adapt.body1=«Бабушка» у вас дома может называться иначе, а кухню можно заменить знакомым ребёнку местом. Сохраните простую последовательность событий, но выбирайте естественные слова. Если делаете версию на другом языке, перескажите историю, а не переводите каждую строку дословно.
adapt.body2=Если берёте за основу опубликованную книгу, проверьте права, прежде чем делиться переделанным текстом или аудио публично. Собственную короткую историю использовать проще.
reading.title=Читайте сейчас, подготовьте аудио позже
reading.body1=Прочитайте готовую историю на языке, который нравится ребёнку. Покажите бумажную звёздочку, ответьте на вопросы и вернитесь к финалу. Повторять любимую сказку в другой вечер тоже нормально.
reading.body2=Близкий человек может прочитать сказку рядом или записать её на телефон. Скажите ребёнку, чей голос он услышит. После выхода Sleep2Story запланированная озвучка будет использовать полный текст и образец голоса взрослого с его согласия; она не сохранит точное чтение каждой фразы этим человеком.
product.title=Знакомый голос на выбранном языке
product.body=Sleep2Story разрабатывается для озвучки готовых текстов сказок более чем на 30 языках голосом взрослого близкого человека с его согласия. Приложение пока готовится к выпуску; точный список языков будет опубликован к запуску.
product.body2=Приложение не пишет и не переводит сказку за вас: подготовьте полный текст на языке, на котором хотите её слушать. Уже сегодня можно читать самим или записать сказку на телефон. Обычная запись сохранит настоящее чтение, а синтетическая озвучка по образцу голоса работает иначе.
faq.title=Вопросы о языках сказки
faq.1.question=Язык сказки должен совпадать с языком этой страницы?
faq.1.answer=Нет. Статья на русском, чтобы вам было удобно её читать. Текст сказки можно подготовить на языке вашей семьи. Запланированные 30+ языков озвучки приложения не равны 14 языкам сайта; точный список поддержки появится к запуску.
faq.2.question=Sleep2Story напишет или переведёт сказку за меня?
faq.2.answer=Нет. Взрослый готовит полный текст на каждом нужном языке. Если нужна ещё одна версия, напишите её естественно и попросите человека, хорошо владеющего языком, проверить текст перед чтением или озвучкой.
sources.body=Colorín Colorado советует семьям читать детям на домашнем языке. История о бумажной звёздочке и план подготовки текста — авторские примеры редакции Sleep2Story. Дополнительно:
