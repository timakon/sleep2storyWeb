meta.title=여러 언어로 들려주는 잠자리 이야기 | Sleep2Story
meta.description=가족이 쓰는 언어로 잠자리 이야기를 준비하는 방법을 알아보세요. 완성된 이야기 예시와 Sleep2Story가 준비 중인 30개 이상 언어 낭독 기능도 소개합니다.
meta.og_title=여러 언어로 들려주는 잠자리 이야기
schema.description=가족이 쓰는 언어로 잠자리 이야기를 준비하는 방법과 완성된 이야기 예시, Sleep2Story가 준비 중인 30개 이상 언어 낭독 기능을 소개합니다.
hero.eyebrow=우리 집 언어로 듣는 이야기 · 가이드 07
hero.title=여러 언어로 들려주는 잠자리 이야기
hero.dek=잠자리 이야기의 언어는 집처럼 편안하게 느껴져야 합니다. Sleep2Story는 완성된 이야기 글을 30개 이상의 언어로 들려주는 기능을 준비 중입니다. 가족마다 익숙한 언어를 고를 수 있도록요.
byline.read_time=읽는 시간 5분
byline.date=2026년 9월 30일
answer.title=아이에게 가장 익숙한 언어부터 시작하세요.
answer.body=아이에게 들려주고 싶은 언어로 짧지만 끝까지 완성된 이야기를 써 보세요. 익숙한 이름과 일상적인 표현을 쓰면 좋습니다. 다른 언어로도 들려주고 싶다면 그 언어에 자연스러운 별도 버전을 준비하세요. 가족이 평소 쓰는 언어가 출발점입니다.
plan.title=원하는 언어로 이야기 준비하기
plan.body1=인물 한 명, 익숙한 물건 하나, 그리고 작고 부드러운 변화 하나를 골라 보세요. 읽는 데 2~3분 걸리는 이야기면 충분합니다. 지금 보고 있는 웹페이지의 언어와 달라도 괜찮으니 가족이 실제로 쓰는 언어로 전체 글을 적으세요.
plan.body2=가족 호칭과 장소, 작은 일상에 관해서는 아이가 아는 말을 쓰세요. 능숙하지 않은 언어로 쓴다면 그 언어를 잘하는 믿을 만한 사람에게 검토를 부탁하세요. 직역보다 자연스러운 문장이 중요합니다.
plan.body3=오디오를 만들기 전에 완성된 글을 저장하세요. 오늘은 직접 읽거나 휴대전화로 이야기 전체를 녹음할 수 있습니다. Sleep2Story는 동의한 성인의 목소리 샘플과 사용자가 제공한 전체 글로 합성 낭독을 준비 중이며, 아직 앱 스토어에 출시되지 않았습니다.
nav.plan=준비하기
nav.languages=언어
nav.story=이야기
languages.title=어떤 언어로 이야기를 만들 수 있나요?
languages.intro=출시를 준비 중인 앱은 30개 이상의 언어로 낭독하는 것을 목표로 합니다. 이 웹페이지의 언어는 가이드를 읽는 언어일 뿐, 이야기의 언어를 결정하지 않습니다.
languages.examples=가족이 이야기 글에 쓸 수 있는 언어로는 영어, 독일어, 프랑스어, 스페인어, 이탈리아어, 포르투갈어, 네덜란드어, 폴란드어, 체코어, 루마니아어, 세르비아어, 우크라이나어, 러시아어, 튀르키예어, 아랍어, 힌디어, 중국어(표준 중국어), 일본어, 한국어, 인도네시아어 등이 있습니다.
languages.note=위 20개 언어는 글쓰기 예시이며, 출시 시 지원할 낭독 언어의 확정 목록이 아닙니다. Sleep2Story는 앱 출시 때 정확한 언어 목록을 공개할 예정입니다. 여러 언어 버전을 원한다면 각 언어로 완성된 전체 글을 따로 준비하세요.
story.kicker=바로 읽어 볼 수 있는 예시
story.title=한국어로 읽는 짧은 잠자리 이야기
story.intro=이 가이드가 한국어로 되어 있어 이야기 예시도 한국어로 썼습니다. 웹사이트의 다른 언어 버전에는 같은 이야기가 각 언어로 실려 있습니다. 장면과 차분한 결말을 참고해 우리 가족에게 자연스러운 이야기를 써 보세요.
story.first_title=종이별
story.first_p1=매일 저녁 니카와 할머니는 부엌 창가에 작은 종이별을 놓았어요. “이 별은 누구 거예요?” 니카가 물었어요. “집으로 오는 길을 찾는 누구에게나.” 할머니가 답했어요. 비가 오던 어느 날 밤, 별이 찬장 뒤로 미끄러져 들어갔어요. 둘은 식탁 아래와 신발 사이를 찾아봤지만 노란 연필 하나만 발견했어요.
story.first_p2=할머니는 오래된 장보기 목록 뒷면으로 새 별을 접었어요. 니카는 한가운데 밝은 점을 그렸지요. 둘은 부엌 불빛이 비쳐 보이도록 별을 창문에 붙였어요. 잠시 후 아빠가 외투의 빗방울을 털며 문을 열었어요. “우리 별이 보이더라.” 아빠가 말했어요. 니카는 웃었어요. 잃어버린 별은 아침에 찾아도 괜찮았어요.
adapt.title=우리 가족의 말투로 바꿔 보세요
adapt.body1=집에서 할머니를 다른 이름으로 부를 수도 있고, 부엌 대신 아이에게 익숙한 장소를 넣을 수도 있습니다. 단순한 이야기 흐름은 유지하되 지금 쓰는 언어에 자연스러운 표현을 고르세요. 다른 언어 버전을 만들 때는 문장마다 옮기기보다 새로 들려주듯 써 보세요.
adapt.body2=이 원작 예시 대신 출판된 책을 각색한다면, 바꾼 글이나 오디오를 공개하기 전에 권리를 확인하세요. 직접 쓴 짧은 이야기는 다시 활용하기가 더 간단합니다.
reading.title=지금은 읽어 주고, 오디오는 나중에 준비하세요
reading.body1=완성된 이야기를 아이가 좋아하는 언어로 한 번 읽어 주세요. 종이별을 가리켜 보여 주고, 아이가 묻는 것이 있으면 잠깐 멈췄다가 결말로 돌아오세요. 다른 날 같은 버전을 다시 읽어도 좋습니다.
reading.body2=가족이 직접 읽어 주거나 휴대전화로 평범한 녹음을 남길 수 있습니다. 아이에게 누구의 목소리인지 알려 주세요. Sleep2Story가 출시되면 전체 글과 동의한 성인의 목소리 샘플을 이용한 낭독을 제공할 예정입니다. 그 사람이 실제로 모든 단어를 읽은 원래의 표현까지 보존하는 방식은 아닙니다.
product.title=선택한 언어로 듣는 익숙한 목소리
product.body=Sleep2Story는 동의한 성인 가족의 목소리 샘플을 사용해 완성된 잠자리 이야기 글을 30개 이상의 언어로 낭독하는 기능을 개발 중입니다. 앱은 아직 출시 준비 단계이며, 정확한 언어 목록은 출시 때 공개됩니다.
product.body2=앱이 이야기를 대신 쓰거나 번역하지는 않습니다. 낭독을 원하는 언어로 전체 글을 제공해 주세요. 오늘 밤에는 직접 읽거나 휴대전화로 녹음해 보세요. 일반 녹음은 실제 읽은 목소리를 남기지만, 목소리 샘플로 만드는 합성 낭독은 방식이 다릅니다.
faq.title=이야기 언어에 관해 자주 묻는 질문
faq.1.question=이 페이지와 같은 언어로 이야기를 써야 하나요?
faq.1.answer=아니요. 이 페이지는 가이드를 읽기 쉽도록 한국어로 제공됩니다. 가족이 쓰는 언어로 이야기 글을 준비하세요. 앱이 준비 중인 30개 이상의 낭독 언어는 웹사이트의 14개 표시 언어와 별개입니다. 앱 출시 때 최종 지원 목록을 확인해 주세요.
faq.2.question=Sleep2Story가 이야기를 쓰거나 번역해 주나요?
faq.2.answer=아니요. 사용할 언어마다 성인이 전체 글을 제공해야 합니다. 다른 버전이 필요하다면 자연스럽게 새로 쓰고, 녹음하거나 낭독용으로 준비하기 전에 그 언어에 능숙한 사람에게 검토를 부탁하세요.
sources.body=Colorín Colorado는 가족이 집에서 쓰는 언어로 책을 나누어 읽도록 권합니다. 여기 실린 종이별 이야기와 글쓰기 계획은 Sleep2Story가 직접 만든 편집 예시입니다. 더 읽어 보기:
