hero.eyebrow=Dvojjazyčný rodinný příběh · Průvodce 07
hero.title=Pohádka na dobrou noc ve dvou jazycích
hero.dek=Jedno malé dobrodružství může patřit ke dvěma rodinným jazykům. Nemusíte nahlas překládat každou větu ani měnit večerní čtení v hodinu slovíček.
byline.read_time=6 minut čtení
byline.date=30. září 2026
answer.title=Zachovejte jednu zápletku a připravte dvě celé verze.
answer.body=Vyberte krátký vlastní příběh. Postavy a konec zůstanou stejné, ale v každém jazyce bude znít tak, jak vaše rodina skutečně mluví. Čtěte vždy jednu verzi vcelku.
plan.title=Připravte příběh ve dvou jazycích
plan.body1=Začněte malou scénou: člověk, známá věc a jemná změna. Stačí příběh na dvě až tři minuty čtení. První verzi napište jazykem, kterým se vám s dítětem mluví nejsnáze.
plan.body2=Druhou verzi převyprávějte, nepřekládejte slovo od slova. Zachovejte stejné události a závěrečný obraz. Pokud dítě říká babičce v druhém jazyce jinak, použijte jeho domácí oslovení. Nejisté formulace nechte zkontrolovat někým, kdo jazyk dobře zná.
plan.body3=Hotové texty uložte zvlášť nebo na protější stránky. Dítě si může vybrat jazyk pro dnešní večer; různí dospělí mohou číst každý svým jazykem. Po každé větě nemusíte přerušovat kvůli překladu ani zkoušet slovíčka.
story.kicker=Příklad k přečtení
story.title=Jeden původní příběh ve dvou jazycích
story.intro=Papírová hvězdička, deštivý večer a stejný klidný konec zůstávají v obou verzích. Jména a rodinná oslovení můžete změnit.
story.first_title=Papírová hvězdička
story.first_p1=Každý večer dávaly Nika s babičkou malou papírovou hvězdičku k oknu v kuchyni. „Pro koho je?“ zeptala se Nika. „Pro každého, kdo hledá cestu domů,“ řekla babička. Jednoho deštivého večera hvězdička zapadla za skříňku. Hledaly pod stolem a mezi botami, ale našly jen žlutou tužku.
story.first_p2=Babička složila novou hvězdičku z rubu starého nákupního seznamu. Nika jí doprostřed nakreslila světlou tečku. Přilepily ji na sklo, kterým prosvítalo světlo z kuchyně. Brzy tatínek otevřel dveře a setřásl déšť z bundy. „Viděl jsem naši hvězdu,“ řekl. Nika se usmála. Ztracenou hvězdičku mohly hledat až ráno.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Přizpůsobte slova, ne děj
adapt.body1=„Babička“ může mít u vás doma jiné jméno. Použijte oslovení, které dítě zná. Kuchyni můžete nahradit jiným známým místem. Důležité jsou stejné události, ne totožný slovosled.
adapt.body2=Pokud místo tohoto původního příběhu upravíte vydanou knihu, nechte úpravu pro rodinu a před veřejným sdílením textu či nahrávky si ověřte práva.
reading.title=Plán čtení na dva večery
reading.body1=První večer přečtěte jednu verzi celou. Další večer druhou, bez překladu po každé větě. Na otázku o slově krátce odpovězte a vraťte se k příběhu. Opakovat oblíbenou verzi je také v pořádku.
reading.body2=Příbuzný, který mluví druhým jazykem, může svou verzi přečíst nebo nahrát na telefon. Řekněte dítěti, čí hlas uslyší. Dospělý, který je s ním, může čtení kdykoli zastavit a večer ukončit po svém.
product.body2=Aplikace se stále připravuje k vydání. Zatím uchovejte oba texty zvlášť a čtěte je nebo nahrajte na telefon. Běžná nahrávka zachová skutečný přednes člověka; plánované syntetické vyprávění podle vzorku hlasu funguje jinak.
faq.title=Otázky ke dvojjazyčným pohádkám
faq.1.question=Musím po každé větě změnit jazyk?
faq.1.answer=Ne. Dvě souvislé verze se před spaním často poslouchají snadněji. Pokud dítě samo přirozeně jazyky míchá, není třeba zavádět přísné pravidlo.
faq.2.question=Co když mluvím jen jedním ze dvou jazyků?
faq.2.answer=Čtěte verzi, ve které se cítíte jistě. Požádejte někoho blízkého, kdo ovládá druhý jazyk, o pomoc s textem nebo čtením. Nemusíte předstírat plynulost.
sources.body=Colorín Colorado podporuje čtení v domácím jazyce. Plán dvou verzí a příběh o hvězdičce jsou naše původní redakční příklady. Více na:
