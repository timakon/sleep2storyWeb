languages.title=V jakém jazyce může příběh být?
languages.intro=Připravovaná aplikace má za cíl nabídnout vyprávění ve více než 30 jazycích. Jazyk webu je pouze jazykem tohoto průvodce; neurčuje jazyk vašeho příběhu.
languages.examples=Rodiny mohou své příběhy psát například anglicky, německy, francouzsky, španělsky, italsky, portugalsky, nizozemsky, polsky, česky, rumunsky, srbsky, ukrajinsky, rusky, turecky, arabsky, hindsky, mandarínskou čínštinou, japonsky, korejsky a indonésky.
languages.note=Těchto 20 jazyků slouží jako příklady pro psaní, nejde o potvrzený seznam jazyků vyprávění při spuštění. Sleep2Story zveřejní přesný výběr jazyků při vydání aplikace. Pokud chcete více verzí, dodejte pro každou úplný text.
story.kicker=Příklad k přečtení
story.title=Krátká pohádka na dobrou noc v češtině
story.intro=Tento původní příklad je v češtině, protože je v češtině i tento průvodce. Ostatní jazykové verze webu ukazují stejný příběh ve svém jazyce. Scénu a klidný závěr použijte jako vzor pro příběh, který bude vaší rodině znít přirozeně.
story.first_title=Papírová hvězdička
story.first_p1=Každý večer dávaly Nika s babičkou malou papírovou hvězdičku k oknu v kuchyni. „Pro koho je?“ zeptala se Nika. „Pro každého, kdo hledá cestu domů,“ řekla babička. Jednoho deštivého večera hvězdička zapadla za skříňku. Hledaly pod stolem a mezi botami, ale našly jen žlutou tužku.
story.first_p2=Babička složila novou hvězdičku z rubu starého nákupního seznamu. Nika jí doprostřed nakreslila světlou tečku. Přilepily ji na sklo, kterým prosvítalo světlo z kuchyně. Brzy tatínek otevřel dveře a setřásl déšť z bundy. „Viděl jsem naši hvězdu,“ řekl. Nika se usmála. Ztracenou hvězdičku mohly hledat až ráno.
adapt.title=Ať slova znějí jako u vás doma
adapt.body1=Babičce můžete doma říkat jinak a kuchyni lze nahradit místem, které dítě zná. Zachovejte jednoduchý sled událostí, ale vyberte výrazy přirozené pro jazyk, který používáte. Pokud připravujete další jazykovou verzi, příběh převyprávějte místo překládání řádek po řádku.
adapt.body2=Pokud místo tohoto původního příkladu upravujete vydanou knihu, před veřejným sdílením upraveného textu nebo zvukové verze si ověřte práva. Krátký příběh, který napíšete sami, se dá snáze použít znovu.
reading.title=Čtěte hned; zvukovou verzi připravte později
reading.body1=Přečtěte hotový příběh jednou v jazyce, který má dítě nejraději. Ukažte na papírovou hvězdičku, při otázce se zastavte a pak dočtěte do konce. Stejnou verzi můžete zopakovat jiný večer.
reading.body2=Příbuzný může příběh přečíst naživo nebo ho běžným způsobem nahrát na telefon. Řekněte dítěti, čí hlas uslyší. Po vydání má plánované vyprávění Sleep2Story využívat úplný text a vzorek hlasu dospělého s jeho souhlasem; nezachová původní přednes každého slova daným člověkem.
product.title=Známý hlas ve zvoleném jazyce
product.body=Sleep2Story se vyvíjí pro vyprávění hotových textů pohádek na dobrou noc ve více než 30 jazycích pomocí vzorku hlasu dospělého člena rodiny s jeho souhlasem. Aplikace se stále připravuje; přesný seznam jazyků bude zveřejněn při vydání.
product.body2=Aplikace za vás příběh nenapíše ani nepřeloží. Dodejte úplný text v jazyce, ve kterém chcete vyprávění. Dnes večer ho přečtěte sami nebo nahrajte na telefon; běžná nahrávka zachovává skutečný přednes, zatímco syntetické vyprávění ze vzorku hlasu funguje jinak.
faq.title=Otázky k jazykům příběhů
faq.1.question=Musí být příběh v jazyce této stránky?
faq.1.answer=Ne. Tato stránka je v češtině, abyste si mohli přečíst průvodce. Text příběhu připravte v jazyce, který vaše rodina používá. Více než 30 plánovaných jazyků vyprávění v aplikaci je oddělených od 14 jazyků dostupných na webu; při vydání aplikace se podívejte na konečný seznam podporovaných jazyků.
faq.2.question=Napíše nebo přeloží Sleep2Story příběh za mě?
faq.2.answer=Ne. Dospělý dodá úplný text v každém jazyce, který chce použít. Pokud potřebujete další verzi, napište ji přirozeně a před nahráváním nebo přípravou vyprávění ji nechte zkontrolovat někým, kdo jazyk plynně ovládá.
sources.body=Colorín Colorado podporuje rodiny ve společném čtení knih v domácím jazyce. Příběh o papírové hvězdičce a zdejší plán psaní jsou původní redakční příklady Sleep2Story. Další čtení:
