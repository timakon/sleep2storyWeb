hero.eyebrow=Příběhy ve vašem jazyce · Průvodce 07
hero.title=Pohádky na dobrou noc v různých jazycích
hero.dek=Jazyk pohádky na dobrou noc by měl navozovat pocit domova. Sleep2Story se připravuje na vyprávění hotových textů ve více než 30 jazycích, aby si každá rodina mohla vybrat to, co jí zní důvěrně známě.
byline.read_time=5 minut čtení
byline.date=30. září 2026
answer.title=Začněte jazykem, který vaše dítě zná nejlépe.
answer.body=Napište celý krátký příběh v jazyce, který má dítě slyšet. Používejte známá jména a běžná slova. Pokud chcete i jiný jazyk, připravte samostatnou přirozenou verzi. Začněte jazykem, který vaše rodina používá.
plan.title=Připravte příběh v jazyce, který si vyberete
plan.body1=Vyberte jednu osobu, známý předmět a jednu nenápadnou změnu. Stačí příběh na dvě až tři minuty čtení. Celý text napište v jazyce, který vaše rodina skutečně používá, i když se liší od jazyka této stránky.
plan.body2=Používejte slova, která dítě zná pro členy rodiny, místa a drobné každodenní zvyky. Pokud píšete v jazyce, který neovládáte plynně, požádejte někoho důvěryhodného, kdo ho dobře zná, o kontrolu. Přirozená věta je důležitější než doslovný překlad.
plan.body3=Než vytvoříte zvukovou verzi, uložte hotový text. Už dnes ho můžete přečíst nahlas nebo celý příběh nahrát na telefon. Sleep2Story připravuje syntetické vyprávění z úplného textu a vzorku hlasu dospělého, který k tomu dal souhlas; v obchodech s aplikacemi zatím není dostupné.
