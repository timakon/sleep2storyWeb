hero.eyebrow=Histórias na sua língua · Guia 07
hero.title=Histórias de embalar em várias línguas
hero.dek=A língua de uma história de embalar deve fazer-nos sentir em casa. O Sleep2Story está a ser preparado para narrar textos completos em mais de 30 línguas, para que cada família possa escolher o que lhe é familiar.
byline.read_time=5 minutos de leitura
byline.date=30 de setembro de 2026
answer.title=Comece pela língua que a criança conhece melhor.
answer.body=Escreva uma história curta e completa na língua que quer que a criança ouça. Use nomes familiares e palavras do dia a dia. Se quiser outra língua, prepare uma versão natural separada. Comece pela língua que a sua família usa.
plan.title=Prepare uma história na língua que escolher
plan.body1=Escolha uma pessoa, um objeto familiar e uma mudança tranquila. Uma história de dois ou três minutos de leitura chega. Escreva o texto completo na língua que a sua família usa, mesmo que seja diferente da língua desta página.
plan.body2=Use as palavras que a criança conhece para os familiares, os lugares e as pequenas rotinas. Se escrever numa língua que não domina, peça a alguém de confiança que a fale bem para rever o texto. Uma frase natural importa mais do que uma tradução literal.
plan.body3=Guarde o texto completo antes de criar o áudio. Já hoje pode lê-lo em voz alta ou gravar a história inteira no telemóvel. O Sleep2Story está a preparar narração sintética a partir de uma amostra de voz de um adulto que dê o seu consentimento e do seu texto completo; ainda não está disponível nas lojas de aplicações.
