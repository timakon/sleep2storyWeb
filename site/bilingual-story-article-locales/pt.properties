languages.title=Em que língua pode ser a história?
languages.intro=A aplicação em preparação pretende oferecer narração em mais de 30 línguas. A língua do site é apenas a deste guia; não determina a língua da sua história.
languages.examples=Algumas línguas que as famílias podem usar nas suas histórias são inglês, alemão, francês, espanhol, italiano, português, neerlandês, polaco, checo, romeno, sérvio, ucraniano, russo, turco, árabe, hindi, chinês mandarim, japonês, coreano e indonésio.
languages.note=Estas 20 línguas são exemplos para a escrita, não uma lista confirmada para a narração no lançamento. O Sleep2Story publicará a seleção exata de línguas quando a aplicação for lançada. Se quiser várias versões, forneça um texto completo para cada uma.
story.kicker=Um exemplo pronto a ler
story.title=Uma história de embalar curta em português
story.intro=Este exemplo original está em português porque este guia está em português. As outras versões do site apresentam a mesma história na respetiva língua. Use a cena e o final tranquilo como modelo para uma história que soe natural na sua família.
story.first_title=A estrela de papel
story.first_p1=Todas as noites, Nika e a avó punham uma estrelinha de papel junto à janela da cozinha. «Para quem é?», perguntou Nika. «Para quem procura o caminho de casa», respondeu a avó. Numa noite de chuva, a estrela caiu atrás do armário. Procuraram debaixo da mesa e entre os sapatos, mas encontraram apenas um lápis amarelo.
story.first_p2=A avó dobrou uma nova estrela no verso de uma lista de compras antiga. Nika desenhou um ponto brilhante no meio. Colaram-na ao vidro, iluminada pela luz da cozinha. Pouco depois, o pai abriu a porta e sacudiu a chuva do casaco. «Vi a nossa estrela», disse. Nika sorriu. Podiam procurar a estrela perdida de manhã.
adapt.title=Use palavras que soem como as da sua família
adapt.body1=A avó pode ter outro nome em sua casa, e a cozinha pode dar lugar a um espaço que a criança conhece. Mantenha a sequência simples, mas escolha expressões naturais na língua que está a usar. Se preparar outra versão, reconte a história em vez de a traduzir linha a linha.
adapt.body2=Se adaptar um livro publicado em vez deste exemplo original, verifique os direitos antes de partilhar publicamente o texto adaptado ou o áudio. Uma história curta da sua autoria é mais simples de reutilizar.
reading.title=Leia agora; prepare o áudio mais tarde
reading.body1=Leia a história completa uma vez na língua que a criança prefere. Aponte para a estrela de papel, faça uma pausa se ela perguntar alguma coisa e retome a história até ao final. Pode repetir a mesma versão noutra noite.
reading.body2=Um familiar pode ler em direto ou fazer uma gravação normal no telemóvel. Diga à criança de quem é a voz que vai ouvir. Após o lançamento do Sleep2Story, a narração prevista usará o texto completo e uma amostra de voz de um adulto que dê o seu consentimento; não preservará a leitura original dessa pessoa palavra por palavra.
product.title=Uma voz familiar na língua que escolher
product.body=O Sleep2Story está a ser desenvolvido para narrar textos completos de histórias de embalar em mais de 30 línguas, usando uma amostra de voz de um familiar adulto que dê o seu consentimento. A aplicação ainda está em preparação; a lista exata de línguas será publicada no lançamento.
product.body2=A aplicação não escreve nem traduz a história por si. Forneça o texto completo na língua em que quer a narração. Esta noite, leia-o ou grave-o no telemóvel; uma gravação normal preserva a leitura real, enquanto a narração sintética a partir de uma amostra de voz funciona de outra forma.
faq.title=Perguntas sobre as línguas das histórias
faq.1.question=A história tem de estar na língua desta página?
faq.1.answer=Não. Esta página está em português para que possa ler o guia. Prepare o texto da história numa língua que a sua família use. As mais de 30 línguas previstas para a narração na aplicação são distintas das 14 línguas disponíveis no site; consulte a lista final de línguas suportadas quando a aplicação for lançada.
faq.2.question=O Sleep2Story escreve ou traduz a história por mim?
faq.2.answer=Não. Um adulto fornece o texto completo em cada língua que pretende usar. Se precisar de outra versão, escreva-a de forma natural e peça a alguém fluente que a reveja antes de gravar ou preparar a narração.
sources.body=O Colorín Colorado incentiva as famílias a partilhar livros na língua de casa. A história da estrela de papel e o plano de escrita são exemplos editoriais originais do Sleep2Story. Saiba mais:
