hero.eyebrow=História familiar bilingue · Guia 07
hero.title=História de embalar em duas línguas
hero.dek=Uma pequena aventura pode fazer parte das duas línguas da família. Não é preciso traduzir cada frase em voz alta nem transformar a hora de dormir numa aula.
byline.read_time=6 minutos de leitura
byline.date=30 de setembro de 2026
answer.title=Mantenha a mesma história e prepare duas versões completas.
answer.body=Escolha um conto curto da sua autoria. As personagens e o final mantêm-se; em cada língua, use palavras que a sua família diria naturalmente. Leia uma versão de cada vez.
plan.title=Preparar duas versões para a hora de dormir
plan.body1=Comece com uma cena pequena: uma pessoa, um objeto familiar e uma mudança tranquila. Dois ou três minutos de leitura chegam. Escreva primeiro na língua em que fala mais à vontade com a criança.
plan.body2=Conte de novo a história na segunda língua em vez de traduzir palavra por palavra. Guarde os mesmos acontecimentos e o mesmo final. Se a avó tem um nome especial na família, use-o. Peça a alguém fluente que reveja expressões de que não tem a certeza.
plan.body3=Guarde os textos separados ou em páginas lado a lado. A criança pode escolher a língua nessa noite; dois adultos também podem ler cada um na sua. Não é preciso interromper cada frase para traduzir ou fazer perguntas de vocabulário.
story.kicker=Um exemplo pronto a ler
story.title=Um conto original em duas línguas
story.intro=A estrela de papel, a chuva e o mesmo final sereno aparecem nas duas versões. Pode trocar os nomes e as formas de tratamento pelas da sua família.
story.first_title=A estrela de papel
story.first_p1=Todas as noites, Nika e a avó punham uma estrelinha de papel junto à janela da cozinha. «Para quem é?», perguntou Nika. «Para quem procura o caminho de casa», respondeu a avó. Numa noite de chuva, a estrela caiu atrás do armário. Procuraram debaixo da mesa e entre os sapatos, mas encontraram apenas um lápis amarelo.
story.first_p2=A avó dobrou uma nova estrela no verso de uma lista de compras antiga. Nika desenhou um ponto brilhante no meio. Colaram-na ao vidro, iluminada pela luz da cozinha. Pouco depois, o pai abriu a porta e sacudiu a chuva do casaco. «Vi a nossa estrela», disse. Nika sorriu. Podiam procurar a estrela perdida de manhã.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Adapte as palavras sem mudar a história
adapt.body1=«Avó» pode ser o nome carinhoso que a criança usa em casa. A cozinha também pode tornar-se outro espaço conhecido. O importante é manter a sequência de acontecimentos, não a ordem exata de cada palavra.
adapt.body2=Se adaptar um livro publicado em vez deste conto original, mantenha a versão na família e verifique os direitos antes de partilhar publicamente o texto ou a gravação.
reading.title=Um plano de leitura para duas noites
reading.body1=Na primeira noite, leia uma versão inteira. Na seguinte, leia a outra sem parar para traduzir cada frase. Se a criança perguntar por uma palavra, responda brevemente e continue. Também pode repetir a versão de que ela mais gosta.
reading.body2=Um familiar que fale a outra língua pode ler a sua versão ou gravá-la no telemóvel. Diga à criança de quem é a voz. O adulto presente pode fazer uma pausa, conversar e terminar a noite como é habitual na família.
product.body2=A aplicação ainda está em preparação. Por agora, guarde os dois textos separadamente e leia-os ou grave-os no telemóvel. Uma gravação preserva a leitura real de alguém; a narração sintética prevista a partir de uma amostra de voz é diferente.
faq.title=Perguntas sobre histórias bilingues
faq.1.question=É preciso mudar de língua a cada frase?
faq.1.answer=Não. Duas versões completas costumam ser mais fáceis de acompanhar à noite. Se a criança mistura as línguas naturalmente, não é preciso impor uma regra.
faq.2.question=E se eu só falar uma das línguas?
faq.2.answer=Leia a versão em que se sente à vontade. Peça a um familiar ou amigo que fale a outra língua para ajudar a escrever ou ler a segunda. Não precisa de fingir fluência.
sources.body=Colorín Colorado incentiva as famílias a ler na língua de casa. O plano de duas versões e a estrela de papel são exemplos editoriais originais. Saiba mais:
