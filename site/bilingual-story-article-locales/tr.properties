languages.title=Hikâye hangi dilde olabilir?
languages.intro=Planlanan uygulama, 30’dan fazla dilde sesli anlatım sunmayı hedefliyor. Web sitesinin dili yalnızca bu rehberin dilidir; hikâyenizin dilini belirlemez.
languages.examples=Ailelerin hikâyeleri için kullanabileceği dillere İngilizce, Almanca, Fransızca, İspanyolca, İtalyanca, Portekizce, Felemenkçe, Lehçe, Çekçe, Rumence, Sırpça, Ukraynaca, Rusça, Türkçe, Arapça, Hintçe, Mandarin Çincesi, Japonca, Korece ve Endonezce örnek verilebilir.
languages.note=Bu 20 dil, hikâye yazmak için verilen örneklerdir; sesli anlatımın çıkışta destekleyeceği dillerin kesin listesi değildir. Sleep2Story, uygulama yayımlandığında kesin dil seçkisini duyuracak. Birkaç farklı sürüm istiyorsanız her biri için eksiksiz bir metin sağlayın.
story.kicker=Okumaya hazır bir örnek
story.title=Türkçe kısa bir uyku masalı
story.intro=Bu özgün örnek, rehber Türkçe olduğu için Türkçe sunuluyor. Web sitesinin diğer dil sürümleri aynı hikâyeyi kendi dillerinde gösteriyor. Sahneyi ve sakin sonu, ailenize doğal gelecek bir hikâye için örnek alın.
story.first_title=Kâğıt yıldız
story.first_p1=Nika ile büyükannesi her akşam mutfak penceresinin yanına küçük bir kâğıt yıldız koyardı. “Bu kimin için?” diye sordu Nika. “Evine giden yolu arayan herkes için,” dedi büyükanne. Yağmurlu bir akşam yıldız dolabın arkasına kaydı. Masanın altına ve ayakkabıların arasına baktılar ama yalnızca sarı bir kalem buldular.
story.first_p2=Büyükanne eski alışveriş listesinin arkasından yeni bir yıldız katladı. Nika ortasına parlak bir nokta çizdi. Mutfak ışığının vurduğu cama yapıştırdılar. Biraz sonra baba kapıyı açıp ceketindeki yağmuru silkeledi. “Yıldızımızı gördüm,” dedi. Nika gülümsedi. Kaybolan yıldızı sabah arayabilirlerdi.
adapt.title=Sözcükler ailenizin konuştuğu gibi olsun
adapt.body1=Evinizde büyükanneye başka bir adla sesleniliyor olabilir; mutfak da çocuğunuzun bildiği başka bir yere dönüşebilir. Basit olay sırasını koruyun, ancak kullandığınız dilde doğal ifadeler seçin. Başka bir dilde metin hazırlarsanız satır satır çevirmek yerine hikâyeyi yeniden anlatın.
adapt.body2=Bu özgün örnek yerine yayımlanmış bir kitabı uyarlıyorsanız yeniden yazdığınız metni veya ses kaydını herkese açık paylaşmadan önce hakları kontrol edin. Kendi yazdığınız kısa bir hikâyeyi yeniden kullanmak daha kolaydır.
reading.title=Şimdi okuyun; sesli anlatımı daha sonra hazırlayın
reading.body1=Tamamlanmış hikâyeyi çocuğunuzun tercih ettiği dilde bir kez okuyun. Kâğıt yıldızı gösterin, soru sorarsa duraklayın ve ardından sona kadar devam edin. Aynı metni başka bir akşam tekrar okuyabilirsiniz.
reading.body2=Bir aile üyesi hikâyeyi canlı okuyabilir veya telefonla sıradan bir ses kaydı yapabilir. Çocuğa kimin sesini duyacağını söyleyin. Sleep2Story yayımlandığında planlanan anlatım, metnin tamamını ve rıza gösteren bir yetişkinin ses örneğini kullanacak; o kişinin her sözcüğü ilk okuyuşunu korumayacak.
product.title=Seçtiğiniz dilde tanıdık bir ses
product.body=Sleep2Story, rıza gösteren yetişkin bir aile üyesinin ses örneğini kullanarak tamamlanmış uyku masalı metinlerini 30’dan fazla dilde seslendirmek üzere geliştiriliyor. Uygulama hâlâ hazırlık aşamasında; kesin dil listesi uygulama yayımlandığında duyurulacak.
product.body2=Uygulama hikâyeyi sizin için yazmaz veya çevirmez. Seslendirilmesini istediğiniz dilde eksiksiz metni sağlayın. Bu akşam kendiniz okuyun veya telefonla kaydedin; sıradan bir kayıt gerçek okuyuşu korurken ses örneğinden üretilen sentetik anlatım farklı şekilde çalışır.
faq.title=Hikâye dilleri hakkında sorular
faq.1.question=Hikâye bu sayfanın dilinde mi olmalı?
faq.1.answer=Hayır. Rehberi okuyabilmeniz için bu sayfa Türkçe. Hikâye metnini ailenizin kullandığı bir dilde hazırlayın. Uygulamanın planlanan 30’dan fazla anlatım dili, web sitesindeki 14 dilden ayrıdır; uygulama yayımlandığında desteklenen dillerin kesin listesini kontrol edin.
faq.2.question=Sleep2Story hikâyeyi benim için yazacak veya çevirecek mi?
faq.2.answer=Hayır. Bir yetişkin, kullanmak istediği her dilde eksiksiz metni sağlar. Başka bir sürüme ihtiyacınız varsa doğal bir dille yazın ve kaydetmeden ya da anlatımı hazırlamadan önce o dili akıcı konuşan birine kontrol ettirin.
sources.body=Colorín Colorado, aileleri evde konuştukları dilde çocuklarıyla kitap okumaya teşvik ediyor. Buradaki kâğıt yıldız hikâyesi ve yazma planı, Sleep2Story’nin özgün editoryal örnekleridir. Daha fazla bilgi:
