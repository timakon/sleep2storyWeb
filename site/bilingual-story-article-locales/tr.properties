hero.eyebrow=Sizin dilinizde hikâyeler · Rehber 07
hero.title=Farklı dillerde uyku masalları
hero.dek=Bir uyku masalının dili, eviniz kadar tanıdık gelmeli. Sleep2Story, her ailenin kendisine tanıdık gelen dili seçebilmesi için tamamlanmış hikâye metinlerini 30’dan fazla dilde seslendirmek üzere hazırlanıyor.
byline.read_time=5 dakikalık okuma
byline.date=30 Eylül 2026
answer.title=Çocuğunuzun en iyi bildiği dille başlayın.
answer.body=Çocuğunuzun duymasını istediğiniz dilde kısa ve eksiksiz bir hikâye yazın. Tanıdık isimler ve günlük sözcükler kullanın. Başka bir dil de istiyorsanız o dilde doğal bir metni ayrı hazırlayın. Ailenizin kullandığı dille başlayın.
plan.title=Seçtiğiniz dilde bir hikâye hazırlayın
plan.body1=Bir kişi, tanıdık bir eşya ve sakin bir değişim seçin. Okuması iki üç dakika süren bir hikâye yeterlidir. Metnin tamamını, bu sayfanın diliyle aynı olmasa da ailenizin kullandığı dilde yazın.
plan.body2=Aile üyeleri, yerler ve küçük günlük alışkanlıklar için çocuğunuzun bildiği sözcükleri kullanın. Akıcı konuşmadığınız bir dilde yazıyorsanız o dili iyi bilen, güvendiğiniz birinden metni gözden geçirmesini isteyin. Doğal bir cümle, sözcüğü sözcüğüne çeviriden daha önemlidir.
plan.body3=Ses kaydı oluşturmadan önce tamamlanmış metni kaydedin. Bugün bile yüksek sesle okuyabilir veya hikâyenin tamamını telefonunuza kaydedebilirsiniz. Sleep2Story, rıza gösteren bir yetişkinin ses örneği ve eksiksiz metninizden sentetik anlatım oluşturmak üzere hazırlanıyor; henüz uygulama mağazalarında bulunmuyor.
