hero.eyebrow=İki dilli aile masalı · Rehber 07
hero.title=İki dilde uyku masalı
hero.dek=Küçük bir macera, ailenin iki dilinde de anlatılabilir. Her cümleyi yüksek sesle çevirmek veya uyku vaktini kelime dersine dönüştürmek gerekmez.
byline.read_time=6 dakikalık okuma
byline.date=30 Eylül 2026
answer.title=Olay örgüsünü koruyup iki tam metin hazırlayın.
answer.body=Kısa ve özgün bir hikâye seçin. Kahramanlar ve son aynı kalsın; her dilde ailenizin gerçekten kullandığı sözcüklerle anlatın. Her seferinde bir versiyonu baştan sona okuyun.
plan.title=İki dilde bir masal hazırlamak
plan.body1=Küçük bir sahneyle başlayın: bir kişi, tanıdık bir eşya ve sakin bir değişim. İki üç dakikalık okuma yeterlidir. İlk metni çocuğunuzla en rahat konuştuğunuz dilde yazın.
plan.body2=İkinci dilde sözcük sözcük çevirmek yerine hikâyeyi yeniden anlatın. Olayları ve son görüntüyü koruyun. Çocuğunuz büyükanneye başka bir adla sesleniyorsa o aile sözcüğünü kullanın. Emin olmadığınız ifadeleri o dili iyi konuşan bir yakınınıza okutun.
plan.body3=İki metni ayrı notlarda veya karşılıklı sayfalarda saklayın. Çocuk bu akşamın dilini seçebilir; farklı yetişkinler kendi dillerinde okuyabilir. Her satırda çeviri için durmanız ya da kelime sınavı yapmanız gerekmez.
story.kicker=Okumaya hazır bir örnek
story.title=İki dilde özgün bir uyku masalı
story.intro=Kâğıt yıldız, yağmurlu akşam ve sakin son iki metinde de aynı. İsimleri ve aile içindeki hitapları değiştirebilirsiniz.
story.first_title=Kâğıt yıldız
story.first_p1=Nika ile büyükannesi her akşam mutfak penceresinin yanına küçük bir kâğıt yıldız koyardı. “Bu kimin için?” diye sordu Nika. “Evine giden yolu arayan herkes için,” dedi büyükanne. Yağmurlu bir akşam yıldız dolabın arkasına kaydı. Masanın altına ve ayakkabıların arasına baktılar ama yalnızca sarı bir kalem buldular.
story.first_p2=Büyükanne eski alışveriş listesinin arkasından yeni bir yıldız katladı. Nika ortasına parlak bir nokta çizdi. Mutfak ışığının vurduğu cama yapıştırdılar. Biraz sonra baba kapıyı açıp ceketindeki yağmuru silkeledi. “Yıldızımızı gördüm,” dedi. Nika gülümsedi. Kaybolan yıldızı sabah arayabilirlerdi.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Sözcükleri uyarlayın, hikâyeyi koruyun
adapt.body1=“Büyükanne” yerine çocuğunuzun evde kullandığı hitabı yazın. Mutfağı da bildiği başka bir yerle değiştirebilirsiniz. Önemli olan sözcüklerin bire bir sırası değil, aynı olayların anlatılmasıdır.
adapt.body2=Bu özgün örnek yerine yayımlanmış bir kitabı uyarlıyorsanız metni aile içinde tutun; yazıyı veya kaydı herkese açmadan önce hakları kontrol edin.
reading.title=İki akşamlık okuma planı
reading.body1=İlk akşam bir versiyonu bütünüyle okuyun. Ertesi akşam diğerini, her cümleyi çevirmek için durmadan okuyun. Çocuk bir sözcüğü sorarsa kısa yanıt verip hikâyeye dönün. Sevdiği versiyonu tekrar istemesi de olur.
reading.body2=Diğer dili konuşan bir aile üyesi kendi metnini okuyabilir veya telefonla kaydedebilir. Çocuğa hangi sesi duyacağını söyleyin. Yanındaki yetişkin istediği zaman duraklayabilir ve akşamı ailenin alıştığı gibi bitirebilir.
product.body2=Uygulama henüz yayımlanmaya hazırlanıyor. Şimdilik iki metni ayrı saklayın, kendiniz okuyun veya telefonla kaydedin. Sıradan bir kayıt kişinin gerçek okuyuşunu saklar; ses örneğinden planlanan sentetik anlatım farklıdır.
faq.title=İki dilli uyku masalları hakkında sorular
faq.1.question=Her cümleden sonra dil değiştirmeli miyim?
faq.1.answer=Hayır. İki tam metni uyku öncesinde takip etmek genellikle daha kolaydır. Çocuk dilleri kendiliğinden karıştırıyorsa katı bir kural koymanız gerekmez.
faq.2.question=Ya iki dilden yalnızca birini konuşuyorsam?
faq.2.answer=Rahat olduğunuz metni okuyun. Diğer dili konuşan güvendiğiniz bir yakınınızdan yazma veya okuma yardımı isteyin. Akıcı konuşuyormuş gibi davranmanız gerekmez.
sources.body=Colorín Colorado, aileleri evde konuştukları dilde çocuklarına kitap okumaya teşvik ediyor. İki metinli plan ve yıldız hikâyesi özgün editoryal örneklerdir. Ayrıntı için:
