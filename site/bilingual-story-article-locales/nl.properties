hero.title=Tweetalig verhaaltje voor het slapengaan
hero.dek=Een klein avontuur kan bij twee thuistalen horen. Je hoeft niet elke zin hardop te vertalen of van bedtijd een taalles te maken.
byline.read_time=6 minuten leestijd
byline.date=30 september 2026
answer.title=Houd de verhaallijn gelijk en schrijf twee volledige versies.
answer.body=Kies een kort verhaal dat je zelf hebt bedacht. De personages en afloop blijven gelijk, maar elke versie klinkt zoals jullie thuis praten. Lees steeds één versie helemaal voor.
plan.title=Twee versies maken voor het slapengaan
plan.body1=Begin met een kleine scène: een persoon, iets vertrouwds en een rustige wending. Twee of drie minuten voorlezen is genoeg. Schrijf eerst in de taal die je het gemakkelijkst met je kind spreekt.
plan.body2=Vertel het verhaal daarna opnieuw in de andere taal, in plaats van woord voor woord te vertalen. Bewaar dezelfde gebeurtenissen en hetzelfde einde. Gebruik de naam waarmee je kind oma echt aanspreekt. Laat iemand die de taal goed spreekt meelezen als je twijfelt.
plan.body3=Bewaar de teksten apart of op twee pagina’s naast elkaar. Je kind mag de taal van vanavond kiezen; volwassenen kunnen ook ieder in hun eigen taal lezen. Je hoeft niet na elke zin te stoppen voor een vertaling of een woordentoets.
story.kicker=Een verhaal om meteen te lezen
story.title=Een oorspronkelijk verhaal in twee talen
story.intro=De papieren ster, de regen en het rustige einde zijn in beide versies hetzelfde. Namen en familienamen kun je aanpassen.
story.first_title=De papieren ster
story.first_p1=Elke avond zetten Nika en oma een papieren sterretje bij het keukenraam. ‘Voor wie is het?’ vroeg Nika. ‘Voor iedereen die de weg naar huis zoekt,’ zei oma. Op een regenachtige avond gleed de ster achter de kast. Ze zochten onder de tafel en tussen de schoenen, maar vonden alleen een geel potlood.
story.first_p2=Oma vouwde een nieuwe ster van de achterkant van een oud boodschappenlijstje. Nika tekende een licht stipje in het midden. Ze plakten de ster op het raam, waar het keukenlicht doorheen scheen. Even later kwam papa binnen en schudde de regen van zijn jas. ‘Ik zag onze ster,’ zei hij. Nika glimlachte. De verloren ster kon wachten tot morgen.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Pas woorden aan, behoud het verhaal
adapt.body1=Oma kan in jullie gezin een andere naam hebben. Gebruik het woord dat je kind kent. Ook de keuken mag een andere vertrouwde plek worden. De volgorde van de gebeurtenissen telt, niet precies dezelfde woordvolgorde.
adapt.body2=Gebruik je een bestaand uitgegeven boek in plaats van dit eigen verhaal, houd je bewerking dan binnen het gezin en controleer de rechten voordat je tekst of opname openbaar deelt.
reading.title=Een leesplan voor twee avonden
reading.body1=Lees de eerste avond één versie helemaal. Lees de volgende avond de andere zonder elke zin te vertalen. Beantwoord een vraag kort en ga verder met het verhaal. De favoriete versie nog eens lezen mag natuurlijk ook.
reading.body2=Een familielid dat de andere taal spreekt, kan diens versie voorlezen of gewoon met een telefoon opnemen. Vertel je kind wiens stem het hoort. De aanwezige volwassene kan pauzeren en de avond op de vertrouwde manier afsluiten.
product.body2=De app wordt nog voorbereid op de release. Bewaar voorlopig beide teksten apart en lees ze zelf voor of neem ze op met je telefoon. Een gewone opname bewaart iemands echte voordracht; geplande synthetische vertelling op basis van een stemfragment werkt anders.
faq.title=Vragen over tweetalige bedtijdverhalen
faq.1.question=Moet ik na elke zin van taal wisselen?
faq.1.answer=Nee. Twee volledige versies zijn voor het slapengaan vaak gemakkelijker te volgen. Als je kind vanzelf talen mengt, hoef je daar geen strikte regel van te maken.
faq.2.question=Wat als ik maar één van de twee talen spreek?
faq.2.answer=Lees de versie waarin jij je thuis voelt. Vraag iemand die de andere taal goed spreekt om te helpen schrijven of voorlezen. Je hoeft geen vloeiendheid te veinzen.
sources.body=Colorín Colorado moedigt gezinnen aan om in hun thuistaal voor te lezen. Het plan met twee versies en de papieren ster zijn eigen redactionele voorbeelden. Lees verder bij:
