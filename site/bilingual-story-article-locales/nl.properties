languages.title=In welke taal kan het verhaal zijn?
languages.intro=De geplande app wil vertelling in meer dan 30 talen aanbieden. De taal van de website is alleen de taal van deze gids; die bepaalt niet de taal van je verhaal.
languages.examples=Voorbeelden van talen waarin gezinnen hun verhalen kunnen schrijven zijn Engels, Duits, Frans, Spaans, Italiaans, Portugees, Nederlands, Pools, Tsjechisch, Roemeens, Servisch, Oekraïens, Russisch, Turks, Arabisch, Hindi, Mandarijn, Japans, Koreaans en Indonesisch.
languages.note=Deze 20 talen zijn schrijfvoorbeelden, geen bevestigde lijst voor de vertelfunctie bij de lancering. Sleep2Story publiceert de exacte taalkeuze wanneer de app uitkomt. Wil je meerdere versies, lever dan voor elke versie een volledige tekst aan.
story.kicker=Een verhaal om meteen te lezen
story.title=Een kort bedtijdverhaal in het Nederlands
story.intro=Dit oorspronkelijke voorbeeld is in het Nederlands, omdat deze gids in het Nederlands is. De andere websiteversies tonen hetzelfde verhaal in hun eigen taal. Gebruik de scène en het rustige einde als voorbeeld voor een verhaal dat bij jullie thuis natuurlijk klinkt.
story.first_title=De papieren ster
story.first_p1=Elke avond zetten Nika en oma een papieren sterretje bij het keukenraam. ‘Voor wie is het?’ vroeg Nika. ‘Voor iedereen die de weg naar huis zoekt,’ zei oma. Op een regenachtige avond gleed de ster achter de kast. Ze zochten onder de tafel en tussen de schoenen, maar vonden alleen een geel potlood.
story.first_p2=Oma vouwde een nieuwe ster van de achterkant van een oud boodschappenlijstje. Nika tekende een licht stipje in het midden. Ze plakten de ster op het raam, waar het keukenlicht doorheen scheen. Even later kwam papa binnen en schudde de regen van zijn jas. ‘Ik zag onze ster,’ zei hij. Nika glimlachte. De verloren ster kon wachten tot morgen.
adapt.title=Laat de woorden klinken zoals jullie thuis praten
adapt.body1=Oma kan bij jullie thuis een andere naam hebben, en de keuken kan een plek worden die je kind kent. Houd de eenvoudige volgorde aan, maar kies uitdrukkingen die natuurlijk klinken in de taal die je gebruikt. Maak van een versie in een andere taal een hervertelling in plaats van een vertaling per zin.
adapt.body2=Pas je een uitgegeven boek aan in plaats van dit oorspronkelijke voorbeeld, controleer dan de rechten voordat je de bewerkte tekst of audio openbaar deelt. Een kort verhaal dat je zelf schrijft, kun je eenvoudiger hergebruiken.
reading.title=Lees het nu voor; maak de audio later
reading.body1=Lees het volledige verhaal één keer voor in de taal die je kind het liefst hoort. Wijs naar de papieren ster, pauzeer bij een vraag en lees daarna verder tot het einde. Dezelfde versie op een andere avond herhalen is prima.
reading.body2=Een familielid kan het verhaal live voorlezen of gewoon opnemen met een telefoon. Vertel je kind wiens stem het zal horen. Na de lancering zal de geplande vertelfunctie van Sleep2Story de volledige tekst en een stemfragment van een volwassene met diens toestemming gebruiken; die bewaart niet hoe die persoon elk woord oorspronkelijk heeft voorgelezen.
product.title=Een vertrouwde stem in de taal die jij kiest
product.body=Sleep2Story wordt ontwikkeld om volledige bedtijdverhalen in meer dan 30 talen te vertellen met een stemfragment van een volwassen familielid dat daarvoor toestemming geeft. De app is nog in voorbereiding; de exacte talenlijst verschijnt bij de lancering.
product.body2=De app schrijft of vertaalt het verhaal niet voor je. Lever de volledige tekst aan in de taal waarin je het wilt laten vertellen. Lees het vanavond zelf voor of neem het op met je telefoon; een gewone opname bewaart de echte voordracht, terwijl synthetische vertelling op basis van een stemfragment anders werkt.
faq.title=Vragen over de taal van verhalen
faq.1.question=Moet het verhaal in de taal van deze pagina zijn?
faq.1.answer=Nee. Deze pagina is in het Nederlands zodat je de gids kunt lezen. Schrijf de verhaaltekst in een taal die jullie thuis gebruiken. De meer dan 30 geplande verteltalen van de app staan los van de 14 talen van de website; bekijk de definitieve lijst met ondersteunde talen wanneer de app uitkomt.
faq.2.question=Schrijft of vertaalt Sleep2Story het verhaal voor mij?
faq.2.answer=Nee. Een volwassene levert de volledige tekst aan in elke gewenste taal. Heb je een andere versie nodig, schrijf die dan in natuurlijke zinnen en laat iemand die de taal vloeiend spreekt meelezen voordat je een opname of vertelling voorbereidt.
sources.body=Colorín Colorado moedigt gezinnen aan om boeken in hun thuistaal te delen. Het verhaal over de papieren ster en het schrijfplan zijn oorspronkelijke redactionele voorbeelden van Sleep2Story. Verder lezen:
