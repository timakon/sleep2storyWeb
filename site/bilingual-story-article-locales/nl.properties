hero.eyebrow=Verhalen in je eigen taal · Gids 07
hero.title=Bedtijdverhalen in verschillende talen
hero.dek=De taal van een bedtijdverhaal moet vertrouwd voelen. Sleep2Story wordt ontwikkeld om volledige verhaalteksten in meer dan 30 talen te vertellen, zodat elk gezin kan kiezen wat vertrouwd klinkt.
byline.read_time=5 minuten leestijd
byline.date=30 september 2026
answer.title=Begin met de taal die je kind het best kent.
answer.body=Schrijf een volledig, kort verhaal in de taal die je je kind wilt laten horen. Gebruik vertrouwde namen en alledaagse woorden. Wil je ook een andere taal, maak dan een aparte versie die natuurlijk klinkt. Begin met een taal die jullie thuis gebruiken.
plan.title=Maak een verhaal in de taal die jij kiest
plan.body1=Kies een persoon, een vertrouwd voorwerp en één rustige wending. Een verhaal van twee of drie minuten voorlezen is genoeg. Schrijf de volledige tekst in de taal die jullie thuis gebruiken, ook als dat niet de taal van deze pagina is.
plan.body2=Gebruik de woorden die je kind kent voor familieleden, plekken en dagelijkse gewoontes. Schrijf je in een taal die je niet vloeiend spreekt, laat dan iemand die je vertrouwt en de taal goed kent meelezen. Een natuurlijke zin is belangrijker dan een letterlijke vertaling.
plan.body3=Bewaar de volledige tekst voordat je audio maakt. Je kunt het verhaal vandaag al voorlezen of helemaal opnemen met je telefoon. Sleep2Story bereidt synthetische vertelling voor op basis van je volledige tekst en een stemfragment van een volwassene die daarvoor toestemming geeft; de app is nog niet beschikbaar in de appwinkels.
