hero.dek=ينبغي أن تبدو لغة قصة النوم مألوفة كأنها صوت البيت. يجري إعداد Sleep2Story لسرد النصوص المكتملة بأكثر من 30 لغة، حتى تختار كل عائلة اللغة الأقرب إليها.
