languages.title=بأي لغة يمكن أن تكون القصة؟
languages.intro=يهدف التطبيق المخطط له إلى تقديم السرد الصوتي بأكثر من 30 لغة. لغة الموقع هي لغة هذا الدليل فحسب؛ وهي لا تحدد لغة قصتك.
languages.examples=من اللغات التي قد تستخدمها العائلات في قصصها: العربية، والإنجليزية، والألمانية، والفرنسية، والإسبانية، والإيطالية، والبرتغالية، والهولندية، والبولندية، والتشيكية، والرومانية، والصربية، والأوكرانية، والروسية، والتركية، والهندية، والصينية الماندرين، واليابانية، والكورية، والإندونيسية.
languages.note=هذه أمثلة لعشرين لغة يمكن الكتابة بها، وليست قائمة مؤكدة بلغات السرد الصوتي عند الإطلاق. سينشر Sleep2Story قائمة اللغات الدقيقة عند صدور التطبيق. وإذا أردت نسخًا بلغات متعددة، فقدّم نصًا كاملًا لكل نسخة.
story.kicker=مثال جاهز للقراءة
story.title=قصة قصيرة قبل النوم بالعربية
story.intro=هذا مثال أصلي بالعربية لأن هذا الدليل مكتوب بها. وتعرض النسخ الأخرى من الموقع القصة نفسها بلغاتها. استلهم المشهد والخاتمة الهادئة، ثم اكتب حكاية تبدو طبيعية في بيتكم.
story.first_title=النجمة الورقية
story.first_p1=كل مساء، كانت نيكا وجدتها تضعان نجمة ورقية صغيرة قرب نافذة المطبخ. سألت نيكا: «لمن هذه النجمة؟» قالت الجدة: «لكل من يبحث عن طريق العودة إلى البيت». وفي ليلة ممطرة، انزلقت النجمة خلف خزانة. بحثتا تحت الطاولة وبين الأحذية، لكنهما لم تجدا سوى قلم أصفر.
story.first_p2=طوت الجدة نجمة جديدة من ظهر قائمة مشتريات قديمة. ورسمت نيكا نقطة لامعة في وسطها. ألصقتاها على الزجاج، فمرّ ضوء المطبخ من خلالها. وبعد قليل، فتح الأب الباب وهو ينفض المطر عن معطفه. قال: «رأيت نجمتنا». ابتسمت نيكا. يمكن للنجمة الضائعة أن تنتظر حتى الصباح.
adapt.title=اختر كلمات تشبه كلام عائلتكم
adapt.body1=ربما تسمون الجدة باسم آخر في بيتكم، ويمكن أن يصبح المطبخ مكانًا يعرفه طفلك. احتفظ بتسلسل الأحداث البسيط، لكن اختر تعابير مألوفة في اللغة التي تستخدمها. وإذا أعددت نسخة بلغة أخرى، فأعِد سردها بطبيعية بدل ترجمتها سطرًا بسطر.
adapt.body2=إذا عدّلت كتابًا منشورًا بدل هذا المثال الأصلي، فتحقق من حقوقه قبل مشاركة النص المعاد صياغته أو تسجيله علنًا. أمّا القصة القصيرة التي تكتبها بنفسك، فإعادة استخدامها أبسط.
reading.title=اقرأها الآن، وجهّز الصوت لاحقًا
reading.body1=اقرأ القصة المكتملة مرة باللغة التي يفضلها طفلك. أشر إلى النجمة الورقية، وتوقف إذا سألك شيئًا، ثم عُد إلى النهاية. ولا بأس بتكرار النسخة نفسها في أمسية أخرى.
reading.body2=يمكن لقريب أن يقرأها لطفلك مباشرة أو يسجلها بهاتفه تسجيلًا عاديًا. أخبر الطفل بصوت من سيستمع إليه. وعند إطلاق Sleep2Story، سيعتمد السرد الصوتي المخطط له على النص الكامل وعينة صوت من شخص بالغ وافق على استخدامها؛ ولن يحفظ أداءه الأصلي لكل كلمة.
product.title=صوت مألوف باللغة التي تختارها
product.body=يجري تطوير Sleep2Story لسرد نصوص قصص ما قبل النوم المكتملة بأكثر من 30 لغة باستخدام عينة صوت من فرد بالغ في العائلة وافق على ذلك. لا يزال التطبيق قيد الإعداد، وستُنشر قائمة اللغات الدقيقة عند الإطلاق.
product.body2=التطبيق لا يكتب القصة ولا يترجمها نيابةً عنك. قدّم النص كاملًا باللغة التي تريد سماع السرد بها. أما الليلة، فاقرأه بنفسك أو سجّله بهاتفك؛ فالتسجيل العادي يحفظ القراءة الحقيقية، بينما يعمل السرد الاصطناعي من عينة صوت بطريقة مختلفة.
faq.title=أسئلة عن لغات القصص
faq.1.question=هل يجب أن تكون القصة بلغة هذه الصفحة؟
faq.1.answer=لا. هذه الصفحة بالعربية لتقرأ الدليل. أعدّ نص القصة باللغة التي تستخدمها عائلتك. ولغات السرد الصوتي المخطط لها، وهي أكثر من 30 لغة، تختلف عن لغات الموقع الأربع عشرة؛ تحقّق من القائمة النهائية عند إطلاق التطبيق.
faq.2.question=هل يكتب Sleep2Story القصة أو يترجمها لي؟
faq.2.answer=لا. يقدّم شخص بالغ النص كاملًا لكل لغة يريد استخدامها. وإذا احتجت نسخة أخرى، فاكتبها بصياغة طبيعية واطلب من شخص يتقن اللغة مراجعتها قبل التسجيل أو إعداد السرد الصوتي.
sources.body=تشجع Colorín Colorado العائلات على مشاركة الكتب بلغتها المنزلية. قصة النجمة الورقية وخطة الكتابة هنا مثالان تحريريان أصليان من Sleep2Story. لمزيد من القراءة:
