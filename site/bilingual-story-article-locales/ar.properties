answer.title=ابدأ باللغة التي يعرفها طفلك أكثر.
answer.body=اكتب قصة قصيرة مكتملة باللغة التي تريد أن يسمعها طفلك. احتفظ بالأسماء والكلمات اليومية التي يألفها. وإذا أردت نسخة بلغة أخرى، فأعدّ لها نصًا مستقلًا بصياغة طبيعية. ابدأ باللغة التي تستخدمونها في البيت.
plan.title=أعدّ قصة باللغة التي تختارها
plan.body1=اختر شخصًا وغرضًا مألوفًا وتغييرًا لطيفًا واحدًا. تكفي قصة تستغرق قراءتها دقيقتين أو ثلاثًا. اكتب النص كاملًا باللغة التي تستخدمها عائلتك فعلًا، حتى لو اختلفت عن لغة هذه الصفحة.
plan.body2=استخدم الكلمات التي يعرفها طفلك لأفراد العائلة والأماكن والعادات الصغيرة. وإذا كنت تكتب بلغة لا تتقنها، فاطلب من شخص تثق بطلاقته مراجعة النص. الجملة الطبيعية أهم من الترجمة الحرفية.
plan.body3=احفظ النص المكتمل قبل إعداد الصوت. يمكنك قراءته أو تسجيل القصة كلها بهاتفك اليوم. يجهّز Sleep2Story سردًا صوتيًا اصطناعيًا اعتمادًا على النص الكامل وعينة صوت من شخص بالغ وافق على استخدامها؛ والتطبيق غير متاح بعد في متاجر التطبيقات.
