schema.description=如何用家里常说的语言准备睡前故事，附完整范例及 Sleep2Story 计划支持的30多种朗读语言介绍。
hero.eyebrow=用你的语言讲故事 · 指南 07
hero.title=用不同语言讲睡前故事
hero.dek=睡前故事用家里熟悉的语言来讲，听起来才亲切。Sleep2Story 正在准备支持30多种语言的故事朗读，让每个家庭都能选择熟悉的表达。
byline.read_time=阅读约5分钟
byline.date=2026年9月30日
answer.title=先用孩子最熟悉的语言。
answer.body=用你希望孩子听到的语言写好一篇完整的短故事，保留熟悉的人名和日常用语。如果还想要另一种语言，再单独写一个自然的版本。从家里平时说的语言开始就好。
plan.title=用你选择的语言准备故事
plan.body1=选一个人物、一件熟悉的物品，再安排一个温柔的小变化。能读两三分钟的故事就够了。用家里真正会说的语言写出完整文本，不必和这个网页的语言一致。
plan.body2=称呼家人、描述地点和日常小习惯时，尽量用孩子熟悉的词。如果你写的语言不够熟练，可以请信任的母语者帮忙看看。自然的一句话，比逐字翻译更重要。
plan.body3=做成音频之前，先保存写好的全文。今天你就能自己读给孩子听，或用手机录下整篇故事。Sleep2Story 正在准备根据完整文本和一位知情同意的成年人的声音样本生成合成朗读；应用尚未在应用商店上线。
