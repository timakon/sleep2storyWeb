languages.title=故事可以用什么语言？
languages.intro=计划中的应用希望提供30多种语言的朗读。你现在看到的网站语言，只决定这篇指南怎么呈现，不决定你家故事必须用什么语言。
languages.examples=家庭可能会用英语、德语、法语、西班牙语、意大利语、葡萄牙语、荷兰语、波兰语、捷克语、罗马尼亚语、塞尔维亚语、乌克兰语、俄语、土耳其语、阿拉伯语、印地语、普通话、日语、韩语或印尼语来写故事。
languages.note=这20种语言只是写作示例，并非已经确认的上线朗读语言名单。Sleep2Story 会在应用发布时公布准确的支持列表。如果想要几个语言版本，请分别提供每种语言的完整文本。
story.kicker=一篇可以直接读的范例
story.title=一篇简短的中文睡前故事
story.intro=这篇原创范例用中文写成，因为你正在阅读中文版指南。网站的其他语言版本也会用各自的语言讲述同一个故事。你可以借用它的场景和安静的结尾，写出符合自己家说话习惯的故事。
story.first_title=纸星星
story.first_p1=每天傍晚，小妮和奶奶都会在厨房窗边放一颗小小的纸星星。「这是给谁的呀？」小妮问。「给正在找回家路的人，」奶奶说。一个下雨的晚上，星星滑到了柜子后面。她们找遍桌子底下和鞋子中间，只找到一支黄色铅笔。
story.first_p2=奶奶拿一张旧购物清单，在背面折出一颗新星星。小妮在星星中间画了一个亮亮的点。她们把星星贴在玻璃上，厨房的灯光从后面透了出来。不久，爸爸推开门，抖了抖外套上的雨水。「我看见咱家的星星啦，」他说。小妮笑了。丢失的那颗星星，明天早上再找也不迟。
adapt.title=写出你家的语气
adapt.body1=你家也许用别的称呼叫奶奶，厨房也可以换成孩子熟悉的地方。保留简单的情节顺序，换成你所用语言里听起来自然的说法。如果要写另一种语言，就重新讲一遍这个故事，不必逐行翻译。
adapt.body2=如果改编的是已出版的书，而不是这篇原创范例，在公开分享改写文字或音频之前，请先确认相关权利。自己写的短故事，后续使用通常更简单。
reading.title=今晚就读，音频以后再准备
reading.body1=先用孩子喜欢的语言读一遍写好的故事。可以指给孩子看纸星星；孩子提问时停一停，然后再回到结尾。下一个晚上重复同一个版本也很好。
reading.body2=家人可以现场朗读，也可以用手机做普通录音。告诉孩子将听到谁的声音。Sleep2Story 上线后，计划中的合成朗读会使用完整文本和一位知情同意的成年人的声音样本；它不会保存此人逐字朗读时的原始表演。
product.title=用熟悉的声音，讲你选择的语言
product.body=Sleep2Story 正在开发中，计划利用一位成年家庭成员在知情同意下提供的声音样本，朗读30多种语言的完整睡前故事文本。应用尚在准备阶段，确切的语言名单会在发布时公布。
product.body2=应用不会替你写故事或翻译故事。请提供你想让它朗读的语言的完整文本。今晚可以自己读，也可以用手机录音；普通录音会保留真实朗读，而根据声音样本生成的合成朗读则不同。
faq.title=关于故事语言的常见问题
faq.1.question=故事必须和这个网页使用同一种语言吗？
faq.1.answer=不用。这个网页用中文，是为了让你读懂指南。故事文本可以用家里常说的语言来写。应用计划支持的30多种朗读语言，和网站提供的14种阅读语言是两回事；请在应用上线时查看最终支持列表。
faq.2.question=Sleep2Story 能帮我写故事或翻译吗？
faq.2.answer=不能。成年人需要为想使用的每种语言分别提供完整文本。如果需要另一种语言的版本，请用自然的说法重新写，并在录音或准备合成朗读前请熟练使用该语言的人帮忙审阅。
sources.body=Colorín Colorado 鼓励家庭用家里常说的语言分享书籍。本文的纸星星故事和写作方法是 Sleep2Story 原创编辑范例。延伸阅读：
