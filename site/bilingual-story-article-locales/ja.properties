schema.description=家族の言葉で寝る前の物語を用意する方法。完成例と、Sleep2Story が予定する30以上の言語での朗読について紹介します。
hero.eyebrow=わが家の言葉で語る物語 · ガイド 07
hero.title=いろいろな言語で聴く寝る前の物語
hero.dek=寝る前の物語は、家族にとって身近な言葉で聴きたいものです。Sleep2Story は、書き終えた物語を30以上の言語で朗読できるよう準備中。各家庭が聞き慣れた言葉を選べることを目指しています。
byline.read_time=読了目安：5分
byline.date=2026年9月30日
answer.title=まずは子どもがいちばんよく知る言葉から。
answer.body=子どもに聴かせたい言語で、短い物語を最初から最後まで書きましょう。いつもの名前や日常の言葉を残します。別の言語でも聴かせたいなら、その言語らしい別バージョンを用意します。家族が普段使う言葉から始めてください。
plan.title=選んだ言語で物語を準備する
plan.body1=ひとりの登場人物、身近な物、やさしい変化をひとつ選びます。2〜3分で読める話で十分です。このページと同じ言語かどうかにかかわらず、家族が実際に使う言葉で全文を書きましょう。
plan.body2=家族の呼び方や場所、日々の小さな習慣には、子どもが知っている言葉を使います。あまり得意ではない言語で書くなら、信頼できる話し手に文章を見てもらいましょう。逐語訳より自然な一文が大切です。
plan.body3=音声にする前に、書き終えた全文を保存します。今は自分で読み聞かせたり、スマホで物語を最後まで録音したりできます。Sleep2Story は、本人が同意した大人の声のサンプルと、あなたが用意した全文による合成朗読を準備中です。アプリストアではまだ公開されていません。
nav.plan=準備
nav.languages=言語
nav.story=物語
languages.title=物語にはどんな言語を使える？
languages.intro=開発中のアプリは、30以上の言語での朗読を目指しています。このウェブサイトの表示言語は、ガイドを読むための言語です。物語の言語を決めるものではありません。
languages.examples=家族がお話に使う言語には、英語、ドイツ語、フランス語、スペイン語、イタリア語、ポルトガル語、オランダ語、ポーランド語、チェコ語、ルーマニア語、セルビア語、ウクライナ語、ロシア語、トルコ語、アラビア語、ヒンディー語、中国語（普通話）、日本語、韓国語、インドネシア語などがあります。
languages.note=ここに挙げた20言語は文章作りの例であり、公開時の朗読対応が確定した一覧ではありません。Sleep2Story はアプリ公開時に正確な対応言語を発表します。複数の言語版が欲しい場合は、それぞれの言語で全文を用意してください。
story.kicker=すぐ読めるお話の例
story.title=日本語の短い寝る前の物語
story.intro=このオリジナルの例は、日本語版のガイドに合わせて日本語で書いています。サイトのほかの言語版にも、同じ物語をそれぞれの言葉で掲載しています。身近な場面と静かな結末を参考に、家族らしい言葉でお話を作ってみてください。
story.first_title=紙の星
story.first_p1=毎晩、ニカとおばあちゃんは、キッチンの窓のそばに小さな紙の星を置きました。「誰のための星なの？」と、ニカが聞きました。「おうちへの道を探している人のためよ」と、おばあちゃん。雨の降る夜、星は戸棚の後ろへ落ちてしまいました。テーブルの下も靴の間も探しましたが、見つかったのは黄色い鉛筆だけ。
story.first_p2=おばあちゃんは、古い買い物メモの裏を使って新しい星を折りました。ニカは真ん中に明るい点を描きました。ふたりが窓ガラスに貼ると、キッチンの灯りが星を照らしました。やがてお父さんが帰ってきて、上着の雨粒を払いながらドアを開けました。「うちの星が見えたよ」。ニカはにっこりしました。なくした星を探すのは、明日の朝でも大丈夫。
adapt.title=わが家らしい言葉にする
adapt.body1=家ではおばあちゃんを別の呼び名で呼ぶかもしれませんし、キッチンも子どもになじみのある場所に替えられます。シンプルな流れは残し、使う言語で自然に聞こえる表現を選びましょう。別の言語版を作るときは、一行ずつ訳すより、その言語で語り直してみてください。
adapt.body2=このオリジナルの例ではなく出版された本を翻案する場合、書き直した文章や音声を一般公開する前に権利を確認しましょう。自分で書いた短い物語なら、再利用は比較的簡単です。
reading.title=今は声に出して読み、音声の準備は後で
reading.body1=書き終えた物語を、子どもが好きな言葉で一度読みましょう。紙の星を指さし、質問があれば少し止まり、また結末へ戻ります。別の夜に同じバージョンを繰り返し読んでもかまいません。
reading.body2=親族がその場で読んだり、スマホで普通の録音を作ったりできます。誰の声が聞こえるのか子どもに伝えましょう。Sleep2Story 公開後に予定する朗読は、全文と、本人が同意した大人の声のサンプルを使います。その人が一語一語実際に読んだ音声を保存するものではありません。
product.title=選んだ言語を、聞き慣れた声で
product.body=Sleep2Story は、本人が同意した成年の家族の声のサンプルを使い、完成した寝る前の物語の文章を30以上の言語で朗読するアプリとして開発中です。アプリはまだ準備段階で、正確な対応言語の一覧は公開時にお知らせします。
product.body2=アプリが物語を書いたり翻訳したりするわけではありません。朗読したい言語で、文章の全文を用意してください。今夜は自分で読むか、スマホで録音しましょう。通常の録音には実際の読み方が残りますが、声のサンプルから作る合成朗読は仕組みが異なります。
faq.title=物語の言語についての質問
faq.1.question=物語はこのページと同じ言語でなければいけませんか？
faq.1.answer=いいえ。このページはガイドを読めるよう日本語で表示しています。物語の文章は家族が使う言語で用意してください。アプリが予定する30以上の朗読言語と、ウェブサイトで読める14言語は別のものです。アプリ公開時に最終的な対応一覧を確認してください。
faq.2.question=Sleep2Story が物語を書いたり翻訳したりしてくれますか？
faq.2.answer=いいえ。使いたい言語ごとに、大人が文章の全文を用意します。別の言語版が必要なら自然な言葉で書き、録音や合成朗読の準備前に、その言語をよく知る人に見てもらいましょう。
sources.body=Colorín Colorado は、家庭で使う言語で本を分かち合うことを勧めています。紙の星の物語と文章作りの手順は、Sleep2Story 編集部のオリジナルの例です。参考資料：
