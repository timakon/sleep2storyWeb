nav.story=कहानी
languages.title=कहानी किस भाषा में हो सकती है?
languages.intro=नियोजित ऐप का लक्ष्य 30 से अधिक भाषाओं में कहानी सुनाना है। इस गाइड की भाषा सिर्फ इसे पढ़ने के लिए है; इससे आपकी कहानी की भाषा तय नहीं होती।
languages.examples=परिवार अपनी कहानियों के लिए अंग्रेज़ी, जर्मन, फ़्रेंच, स्पैनिश, इतालवी, पुर्तगाली, डच, पोलिश, चेक, रोमानियाई, सर्बियाई, यूक्रेनी, रूसी, तुर्की, अरबी, हिंदी, मंदारिन चीनी, जापानी, कोरियाई या इंडोनेशियाई जैसी भाषाएँ चुन सकते हैं।
languages.note=ये 20 नाम लिखने के उदाहरण हैं, जारी होते समय उपलब्ध आवाज़ों की पक्की सूची नहीं। ऐप जारी होने पर Sleep2Story भाषाओं की सटीक सूची बताएगा। कई भाषाओं में कहानी चाहिए तो हर भाषा का पूरा पाठ अलग दें।
story.kicker=पढ़कर सुनाने के लिए तैयार मिसाल
story.title=हिंदी में छोटी सी कहानी
story.intro=यह मौलिक मिसाल हिंदी में है, क्योंकि यह गाइड हिंदी में है। वेबसाइट की दूसरी भाषाओं वाले पन्नों पर यही कहानी उन भाषाओं में है। दृश्य और शांत अंत से प्रेरणा लेकर अपने घर जैसी कहानी लिखें।
story.first_title=कागज़ का तारा
story.first_p1=हर शाम नीका और नानी रसोई की खिड़की के पास कागज़ का एक छोटा तारा रखती थीं। “यह किसके लिए है?” नीका ने पूछा। “जो भी घर का रास्ता ढूँढ़ रहा हो,” नानी ने कहा। एक बरसाती रात तारा अलमारी के पीछे गिर गया। उन्होंने मेज़ के नीचे और जूतों के बीच ढूँढ़ा, मगर वहाँ बस एक पीली पेंसिल मिली।
story.first_p2=नानी ने पुरानी खरीदारी की सूची के पीछे से नया तारा मोड़ लिया। नीका ने उसके बीच में चमकीली बिंदी बना दी। उन्होंने तारे को काँच पर चिपकाया, जहाँ से रसोई की रोशनी झलक रही थी। थोड़ी देर में पापा कोट से बारिश झाड़ते हुए अंदर आए। “मुझे हमारा तारा दिख गया था,” उन्होंने कहा। नीका मुस्कुराई। खोया हुआ तारा सुबह भी ढूँढ़ा जा सकता था।
adapt.title=शब्द अपने परिवार जैसे रखें
adapt.body1=आपके घर में नानी को किसी और नाम से बुलाते हों, या रसोई की जगह बच्चे की परिचित कोई दूसरी जगह हो। घटनाओं का आसान क्रम रखें, लेकिन भाषा में अपने सहज शब्द चुनें। दूसरी भाषा का रूप लिखें तो हर पंक्ति का अनुवाद करने के बजाय कहानी नए सिरे से सुनाएँ।
adapt.body2=इस मौलिक मिसाल की जगह प्रकाशित किताब ढाल रहे हों तो बदले हुए पाठ या ऑडियो को सार्वजनिक रूप से साझा करने से पहले अधिकार जाँचें। अपनी लिखी छोटी कहानी को दोबारा इस्तेमाल करना आसान है।
reading.title=अभी पढ़ें; ऑडियो बाद में तैयार करें
reading.body1=बच्चा जिस भाषा को पसंद करता है, उसमें पूरी कहानी एक बार पढ़ें। कागज़ के तारे की ओर इशारा करें, सवाल पूछे तो रुकें, फिर अंत तक लौटें। किसी और शाम वही कहानी दोहराना ठीक है।
reading.body2=परिवार का कोई सदस्य इसे सामने पढ़ सकता है या फ़ोन पर सामान्य रिकॉर्डिंग बना सकता है। बच्चे को बताएँ कि वह किसकी आवाज़ सुनेगा। Sleep2Story जारी होने के बाद नियोजित आवाज़ आपके पूरे पाठ और सहमति देने वाले वयस्क की आवाज़ के नमूने से बनेगी; यह उसके हर शब्द के असली पाठ को सुरक्षित नहीं करेगी।
product.title=अपनी भाषा में जानी-पहचानी आवाज़
product.body=Sleep2Story को परिवार के सहमति देने वाले वयस्क की आवाज़ के नमूने से 30 से अधिक भाषाओं में लिखी पूरी कहानी सुनाने के लिए विकसित किया जा रहा है। ऐप अभी तैयारी में है; सटीक भाषा सूची जारी होते समय प्रकाशित की जाएगी।
product.body2=ऐप आपके लिए कहानी लिखता या उसका अनुवाद नहीं करता। जिस भाषा में कहानी सुनानी है, उसका पूरा पाठ दें। आज के लिए खुद पढ़ें या फ़ोन पर रिकॉर्ड करें; सामान्य रिकॉर्डिंग असली पाठ सुरक्षित रखती है, जबकि आवाज़ के नमूने से बना कृत्रिम स्वर अलग तरह से काम करता है।
faq.title=कहानी की भाषाओं पर सवाल
faq.1.question=क्या कहानी इसी पन्ने की भाषा में होनी चाहिए?
faq.1.answer=नहीं। यह पन्ना हिंदी में है ताकि आप गाइड पढ़ सकें। कहानी अपने परिवार की भाषा में लिखें। ऐप की 30 से अधिक नियोजित आवाज़ी भाषाएँ वेबसाइट पर उपलब्ध 14 भाषाओं से अलग हैं; ऐप जारी होने पर अंतिम सूची देखें।
faq.2.question=क्या Sleep2Story मेरे लिए कहानी लिखेगा या अनुवाद करेगा?
faq.2.answer=नहीं। जिस भी भाषा में कहानी चाहिए, उसका पूरा पाठ किसी बड़े को देना होगा। दूसरा रूप चाहिए तो उसे सहज भाषा में लिखें और रिकॉर्ड या आवाज़ तैयार करने से पहले उस भाषा के जानकार से जँचवा लें।
sources.body=Colorín Colorado परिवारों को अपनी घरेलू भाषा में किताबें साझा करने के लिए प्रोत्साहित करता है। यहाँ कागज़ के तारे की कहानी और लिखने की योजना Sleep2Story की मौलिक संपादकीय मिसालें हैं। आगे पढ़ें:
