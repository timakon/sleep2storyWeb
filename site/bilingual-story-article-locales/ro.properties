hero.title=Povești de seară în diferite limbi
hero.dek=Limba unei povești de seară ar trebui să te facă să te simți acasă. Sleep2Story este în pregătire pentru a nara texte complete în peste 30 de limbi, astfel încât fiecare familie să poată alege ce îi sună familiar.
byline.read_time=5 minute de lectură
byline.date=30 septembrie 2026
answer.title=Începe cu limba pe care copilul o cunoaște cel mai bine.
answer.body=Scrie o poveste scurtă și completă în limba pe care vrei să o audă copilul. Folosește nume familiare și cuvinte obișnuite. Dacă vrei și o altă limbă, pregătește separat o versiune firească. Începe cu limba pe care o folosește familia ta.
plan.title=Pregătește o poveste în limba pe care o alegi
plan.body1=Alege o persoană, un obiect familiar și o schimbare blândă. O poveste de două sau trei minute de lectură este suficientă. Scrie textul complet în limba pe care o folosește familia ta, chiar dacă diferă de limba acestei pagini.
plan.body2=Folosește cuvintele pe care copilul le știe pentru membrii familiei, locuri și mici obiceiuri zilnice. Dacă scrii într-o limbă pe care nu o vorbești fluent, roagă o persoană de încredere care o cunoaște bine să verifice textul. O propoziție firească este mai importantă decât o traducere literală.
plan.body3=Salvează textul complet înainte de a crea varianta audio. Îl poți citi cu voce tare sau poți înregistra întreaga poveste pe telefon chiar astăzi. Sleep2Story pregătește narațiune sintetică pe baza textului complet și a unei mostre vocale oferite de un adult cu consimțământul său; aplicația nu este încă disponibilă în magazinele de aplicații.
