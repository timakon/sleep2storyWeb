hero.eyebrow=Poveste bilingvă de familie · Ghid 07
hero.title=Poveste de seară în două limbi
hero.dek=O aventură mică poate aparține ambelor limbi vorbite în familie. Nu trebuie să traduci fiecare propoziție cu voce tare sau să transformi culcarea într-o lecție.
byline.read_time=6 minute de lectură
byline.date=30 septembrie 2026
answer.title=Păstrează firul poveștii și scrie două versiuni complete.
answer.body=Alege o poveste scurtă creată de tine. Personajele și finalul rămân la fel, dar fiecare versiune sună cum vorbiți voi acasă. Citește câte o versiune întreagă.
plan.title=Pregătește povestea în două limbi
plan.body1=Pornește de la o scenă mică: o persoană, un obiect familiar și o schimbare blândă. Ajung două sau trei minute de lectură. Scrie întâi în limba în care vorbești cel mai firesc cu copilul.
plan.body2=Repovestește apoi în a doua limbă, nu traduce cuvânt cu cuvânt. Păstrează întâmplările și imaginea de la final. Dacă bunica are un alt nume în familie, folosește numele cunoscut copilului. Roagă pe cineva care vorbește bine limba să verifice formulările nesigure.
plan.body3=Ține textele separat sau pe pagini alăturate. Copilul poate alege limba pentru seara aceasta; adulți diferiți pot citi fiecare în limba sa. Nu trebuie să te oprești după fiecare frază pentru traducere sau pentru un test de vocabular.
story.kicker=Un exemplu gata de citit
story.title=O poveste originală în două limbi
story.intro=Steluța de hârtie, ploaia și același final liniștit apar în ambele versiuni. Poți înlocui numele și apelativele de familie cu ale voastre.
story.first_title=Steluța de hârtie
story.first_p1=În fiecare seară, Nika și bunica puneau o steluță de hârtie lângă fereastra bucătăriei. „Pentru cine e?”, întrebă Nika. „Pentru oricine caută drumul spre casă”, spuse bunica. Într-o seară ploioasă, steluța alunecă după dulap. Căutară sub masă și printre pantofi, dar găsiră doar un creion galben.
story.first_p2=Bunica îndoi o altă stea din spatele unei liste vechi de cumpărături. Nika desenă un punct luminos în mijloc. O lipiră pe geam, unde lumina din bucătărie strălucea prin ea. Curând, tata deschise ușa și scutură ploaia de pe haină. „Am văzut steaua noastră”, spuse el. Nika zâmbi. Pe cea pierdută o puteau căuta dimineață.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Schimbă cuvintele, păstrează povestea
adapt.body1=„Bunica” poate avea la voi un alt nume de alint. Folosește cuvântul pe care îl știe copilul. Poți muta scena și într-un alt loc cunoscut. Contează aceleași întâmplări, nu ordinea exactă a cuvintelor.
adapt.body2=Dacă adaptezi o carte publicată în locul acestei povești originale, păstrează adaptarea în familie și verifică drepturile înainte de a distribui public textul sau înregistrarea.
reading.title=Un plan de lectură pentru două seri
reading.body1=În prima seară, citește o versiune întreagă. A doua seară, citește-o pe cealaltă fără traducere după fiecare frază. Dacă apare o întrebare despre un cuvânt, răspunde scurt și revino la poveste. E în regulă și să repeți versiunea preferată.
reading.body2=O rudă care vorbește cealaltă limbă poate citi versiunea sa sau o poate înregistra pe telefon. Spune-i copilului a cui voce va auzi. Adultul prezent poate pune pauză, vorbi cu el și încheia seara cum obișnuiește familia.
product.body2=Aplicația este încă în pregătire. Deocamdată, păstrează textele separat și citește-le sau înregistrează-le pe telefon. O înregistrare păstrează lectura reală a persoanei; narațiunea sintetică planificată dintr-o mostră vocală este diferită.
faq.title=Întrebări despre poveștile bilingve
faq.1.question=Trebuie să schimb limba după fiecare propoziție?
faq.1.answer=Nu. Două versiuni complete sunt adesea mai ușor de urmărit seara. Dacă cel mic amestecă limbile firesc, nu e nevoie să impui o regulă strictă.
faq.2.question=Dar dacă vorbesc doar una dintre cele două limbi?
faq.2.answer=Citește versiunea în care te simți confortabil. Cere ajutorul unei persoane apropiate care știe cealaltă limbă pentru scris sau citit. Nu trebuie să pretinzi că vorbești fluent.
sources.body=Colorín Colorado încurajează familiile să citească în limba de acasă. Planul cu două versiuni și povestea steluței sunt exemple editoriale originale. Mai multe la:
