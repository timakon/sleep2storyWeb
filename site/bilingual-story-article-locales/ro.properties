languages.title=În ce limbă poate fi povestea?
languages.intro=Aplicația în pregătire își propune să ofere narațiune în peste 30 de limbi. Limba site-ului este doar limba acestui ghid; nu stabilește limba poveștii tale.
languages.examples=Câteva limbi pe care familiile le pot folosi pentru povești sunt engleza, germana, franceza, spaniola, italiana, portugheza, neerlandeza, polona, ceha, româna, sârba, ucraineana, rusa, turca, araba, hindi, chineza mandarină, japoneza, coreeana și indoneziana.
languages.note=Aceste 20 de limbi sunt exemple pentru scrierea poveștilor, nu o listă confirmată de limbi pentru narațiune la lansare. Sleep2Story va publica selecția exactă de limbi când va fi lansată aplicația. Dacă dorești mai multe versiuni, furnizează un text complet pentru fiecare.
story.kicker=Un exemplu gata de citit
story.title=O scurtă poveste de seară în română
story.intro=Acest exemplu original este în română deoarece și ghidul este în română. Celelalte versiuni ale site-ului prezintă aceeași poveste în limba lor. Folosește scena și finalul liniștit ca model pentru o poveste care să sune firesc în familia ta.
story.first_title=Steluța de hârtie
story.first_p1=În fiecare seară, Nika și bunica puneau o steluță de hârtie lângă fereastra bucătăriei. „Pentru cine e?”, întrebă Nika. „Pentru oricine caută drumul spre casă”, spuse bunica. Într-o seară ploioasă, steluța alunecă după dulap. Căutară sub masă și printre pantofi, dar găsiră doar un creion galben.
story.first_p2=Bunica îndoi o altă stea din spatele unei liste vechi de cumpărături. Nika desenă un punct luminos în mijloc. O lipiră pe geam, unde lumina din bucătărie strălucea prin ea. Curând, tata deschise ușa și scutură ploaia de pe haină. „Am văzut steaua noastră”, spuse el. Nika zâmbi. Pe cea pierdută o puteau căuta dimineață.
adapt.title=Alege cuvinte care sună ca la voi acasă
adapt.body1=Bunica poate avea alt nume la voi acasă, iar bucătăria poate deveni un loc cunoscut copilului. Păstrează succesiunea simplă a întâmplărilor, dar alege expresii firești în limba pe care o folosești. Dacă pregătești o altă versiune lingvistică, repovestește în loc să traduci rând cu rând.
adapt.body2=Dacă adaptezi o carte publicată în locul acestui exemplu original, verifică drepturile înainte de a distribui public textul rescris sau varianta audio. O poveste scurtă scrisă de tine este mai simplu de refolosit.
reading.title=Citește acum; pregătește varianta audio mai târziu
reading.body1=Citește o dată povestea completă în limba preferată de copil. Arată-i steluța de hârtie, fă o pauză dacă pune o întrebare și apoi continuă până la final. Poți repeta aceeași versiune în altă seară.
reading.body2=O rudă poate citi povestea în direct sau o poate înregistra obișnuit pe telefon. Spune-i copilului a cui voce va auzi. După lansarea Sleep2Story, narațiunea planificată va folosi textul complet și o mostră vocală de la un adult care își dă consimțământul; nu va păstra felul în care acea persoană a rostit inițial fiecare cuvânt.
product.title=O voce familiară în limba pe care o alegi
product.body=Sleep2Story este în dezvoltare pentru a nara texte complete de povești de seară în peste 30 de limbi, folosind o mostră vocală de la un membru adult al familiei care își dă consimțământul. Aplicația este încă în pregătire; lista exactă de limbi va fi publicată la lansare.
product.body2=Aplicația nu scrie și nu traduce povestea pentru tine. Furnizează textul complet în limba în care vrei narațiunea. Pentru seara aceasta, citește-l tu sau înregistrează-l pe telefon; o înregistrare obișnuită păstrează lectura reală, în timp ce narațiunea sintetică pornind de la o mostră vocală funcționează diferit.
faq.title=Întrebări despre limbile poveștilor
faq.1.question=Povestea trebuie să fie în limba acestei pagini?
faq.1.answer=Nu. Această pagină este în română ca să poți citi ghidul. Pregătește textul poveștii într-o limbă pe care o folosește familia ta. Cele peste 30 de limbi planificate pentru narațiunea din aplicație sunt separate de cele 14 limbi disponibile pe site; consultă lista finală de limbi acceptate când se lansează aplicația.
faq.2.question=Sleep2Story va scrie sau va traduce povestea pentru mine?
faq.2.answer=Nu. Un adult furnizează textul complet în fiecare limbă pe care vrea să o folosească. Dacă ai nevoie de altă versiune, scrie-o firesc și roagă pe cineva care vorbește fluent limba să o verifice înainte de înregistrare sau de pregătirea narațiunii.
sources.body=Colorín Colorado încurajează familiile să citească împreună cărți în limba de acasă. Povestea steluței de hârtie și planul de scriere de aici sunt exemple editoriale originale Sleep2Story. Lecturi suplimentare:
