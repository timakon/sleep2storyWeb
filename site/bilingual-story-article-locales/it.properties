answer.title=Mantieni la stessa trama e prepara due versioni complete.
answer.body=Scegli una breve storia originale. Personaggi ed epilogo restano uguali, ma ogni versione usa le parole che la tua famiglia direbbe davvero. Leggi una versione per volta.
plan.title=Preparare due versioni per la sera
plan.body1=Parti da una scena piccola: una persona, un oggetto familiare e un cambiamento gentile. Bastano due o tre minuti di lettura. Scrivi prima nella lingua che usi più spontaneamente con il tuo bambino.
plan.body2=Racconta di nuovo la storia nell’altra lingua, senza tradurre parola per parola. Conserva gli avvenimenti e l’immagine finale. Se in casa chiamate la nonna in un altro modo, usa quel nome. Chiedi a una persona che parla bene la lingua di rivedere i passaggi incerti.
plan.body3=Tieni i due testi separati o su pagine affiancate. Il bambino può scegliere la lingua della sera; adulti diversi possono leggere ciascuno nella propria. Non occorre fermarsi dopo ogni frase per tradurre o interrogare il bambino.
story.kicker=Un esempio pronto da leggere
story.title=Una storia originale in due lingue
story.intro=La stella di carta, la sera piovosa e lo stesso finale tranquillo compaiono in entrambe le versioni. Puoi sostituire nomi e parole di famiglia con i vostri.
story.first_title=La stella di carta
story.first_p1=Ogni sera Nika e la nonna mettevano una stellina di carta vicino alla finestra della cucina. «Per chi è?», chiese Nika. «Per chi cerca la strada di casa», rispose la nonna. Una sera di pioggia, la stella scivolò dietro la credenza. Cercarono sotto il tavolo e tra le scarpe, ma trovarono solo una matita gialla.
story.first_p2=La nonna piegò una nuova stella sul retro di una vecchia lista della spesa. Nika disegnò un punto luminoso al centro. La fissarono al vetro, dove arrivava la luce della cucina. Poco dopo papà aprì la porta e scrollò la pioggia dalla giacca. «Ho visto la nostra stella», disse. Nika sorrise. La stella perduta poteva aspettare fino al mattino.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Adatta le parole, conserva la trama
adapt.body1=«Nonna» può diventare il nome affettuoso che usa tuo figlio. Puoi spostare la scena in un’altra stanza familiare. Conta la stessa sequenza di eventi, non l’identico ordine delle parole.
adapt.body2=Se adatti un libro pubblicato invece di questo racconto originale, tieni la tua versione in famiglia e verifica i diritti prima di condividere pubblicamente testo o registrazione.
reading.title=Un piano per due sere
reading.body1=La prima sera leggi una versione intera. La sera dopo passa all’altra, senza tradurre ogni frase. Se il bambino domanda il significato di una parola, rispondi brevemente e torna al racconto. Va bene anche ripetere la versione preferita.
reading.body2=Un parente che parla l’altra lingua può leggere la propria versione o registrarla con il telefono. Di’ al bambino di chi è la voce. L’adulto presente può fermarsi, parlare e concludere la serata nel modo abituale.
product.body2=L’app è ancora in preparazione. Per ora conserva i due testi separati e leggili o registrali con il telefono. Una registrazione conserva la lettura reale di una persona; la narrazione sintetica prevista da un campione vocale è diversa.
faq.title=Domande sulle storie bilingui
faq.1.question=Devo cambiare lingua dopo ogni frase?
faq.1.answer=No. Due versioni complete sono spesso più facili da seguire prima di dormire. Se tuo figlio mescola spontaneamente le lingue, non serve imporre una regola.
faq.2.question=E se parlo solo una delle due lingue?
faq.2.answer=Leggi la versione in cui ti senti a tuo agio. Chiedi a una persona fidata che parla l’altra lingua di aiutarti a scriverla o leggerla. Non devi fingere una scioltezza che non hai.
sources.body=Colorín Colorado incoraggia le famiglie a leggere nella lingua di casa. Il piano in due versioni e la storia della stella sono esempi originali della redazione. Per approfondire:
