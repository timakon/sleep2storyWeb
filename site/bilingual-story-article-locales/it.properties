languages.title=In quale lingua può essere la storia?
languages.intro=L’app in preparazione prevede la narrazione in oltre 30 lingue. La lingua del sito è solo quella di questa guida; non determina la lingua della tua storia.
languages.examples=Le famiglie possono scrivere le proprie storie, per esempio, in inglese, tedesco, francese, spagnolo, italiano, portoghese, neerlandese, polacco, ceco, rumeno, serbo, ucraino, russo, turco, arabo, hindi, cinese mandarino, giapponese, coreano e indonesiano.
languages.note=Queste 20 lingue sono esempi per la scrittura, non un elenco confermato delle lingue di narrazione al lancio. Sleep2Story pubblicherà la selezione esatta all’uscita dell’app. Se vuoi più versioni, fornisci un testo completo per ciascuna.
story.kicker=Un esempio pronto da leggere
story.title=Una breve storia della buonanotte in italiano
story.intro=Questo esempio originale è in italiano, come questa guida. Le altre versioni del sito presentano la stessa storia nella propria lingua. Prendi la scena e il finale tranquillo come modello per un racconto che suoni naturale nella tua famiglia.
story.first_title=La stella di carta
story.first_p1=Ogni sera Nika e la nonna mettevano una stellina di carta vicino alla finestra della cucina. «Per chi è?», chiese Nika. «Per chi cerca la strada di casa», rispose la nonna. Una sera di pioggia, la stella scivolò dietro la credenza. Cercarono sotto il tavolo e tra le scarpe, ma trovarono solo una matita gialla.
story.first_p2=La nonna piegò una nuova stella sul retro di una vecchia lista della spesa. Nika disegnò un punto luminoso al centro. La fissarono al vetro, dove arrivava la luce della cucina. Poco dopo papà aprì la porta e scrollò la pioggia dalla giacca. «Ho visto la nostra stella», disse. Nika sorrise. La stella perduta poteva aspettare fino al mattino.
adapt.title=Scegli le parole della tua famiglia
adapt.body1=In casa potreste chiamare la nonna in un altro modo, e la cucina può diventare un luogo che tuo figlio conosce. Mantieni la semplice sequenza degli eventi, ma scegli espressioni naturali nella lingua che usi. Se prepari un’altra versione linguistica, racconta di nuovo la storia anziché tradurla riga per riga.
adapt.body2=Se adatti un libro pubblicato invece di questo esempio originale, verifica i diritti prima di condividere pubblicamente il testo rielaborato o l’audio. Una breve storia scritta da te è più semplice da riutilizzare.
reading.title=Leggi ora, prepara l’audio più avanti
reading.body1=Leggi la storia finita una volta nella lingua che tuo figlio preferisce. Indica la stella di carta, fermati se fa una domanda e poi riprendi fino alla fine. Puoi ripetere la stessa versione un’altra sera.
reading.body2=Un familiare può leggere la storia dal vivo o fare una normale registrazione con il telefono. Di’ al bambino di chi è la voce che sentirà. Dopo il lancio di Sleep2Story, la narrazione prevista userà il testo completo e un campione della voce di un adulto consenziente; non conserverà la sua lettura originale di ogni parola.
product.title=Una voce familiare nella lingua che scegli
product.body=Sleep2Story è in fase di sviluppo per narrare testi completi di storie della buonanotte in oltre 30 lingue, usando un campione della voce di un familiare adulto che ha dato il proprio consenso. L’app è ancora in preparazione; l’elenco esatto delle lingue sarà pubblicato al lancio.
product.body2=L’app non scrive né traduce la storia al posto tuo. Fornisci il testo completo nella lingua in cui vuoi ascoltarlo. Per stasera, leggilo tu o registralo con il telefono: una normale registrazione conserva la lettura reale, mentre la narrazione sintetica da un campione vocale funziona diversamente.
faq.title=Domande sulle lingue delle storie
faq.1.question=La storia deve essere nella lingua di questa pagina?
faq.1.answer=No. Questa pagina è in italiano per permetterti di leggere la guida. Prepara il testo della storia in una lingua usata dalla tua famiglia. Le oltre 30 lingue di narrazione previste nell’app sono un elenco distinto dalle 14 lingue disponibili sul sito; controlla l’elenco definitivo delle lingue supportate quando l’app sarà disponibile.
faq.2.question=Sleep2Story scriverà o tradurrà la storia per me?
faq.2.answer=No. Un adulto fornisce il testo completo in ogni lingua che desidera usare. Se ti serve un’altra versione, scrivila in modo naturale e chiedi a una persona che parla correntemente la lingua di rivederla prima della registrazione o della preparazione della narrazione.
sources.body=Colorín Colorado incoraggia le famiglie a condividere libri nella lingua di casa. La storia della stella di carta e il piano di scrittura sono esempi originali della redazione di Sleep2Story. Per approfondire:
