hero.title=Storie della buonanotte in diverse lingue
hero.dek=La lingua di una storia della buonanotte dovrebbe far sentire a casa. Sleep2Story si sta preparando a narrare testi completi in oltre 30 lingue, così ogni famiglia potrà scegliere ciò che le suona familiare.
byline.read_time=5 minuti di lettura
byline.date=30 settembre 2026
answer.title=Comincia dalla lingua che tuo figlio conosce meglio.
answer.body=Scrivi una storia breve e completa nella lingua che vuoi far ascoltare a tuo figlio. Usa nomi familiari e parole quotidiane. Se desideri anche un’altra lingua, prepara una versione separata e naturale. Comincia da qualsiasi lingua usata dalla tua famiglia.
plan.title=Prepara una storia nella lingua che scegli
plan.body1=Scegli una persona, un oggetto familiare e un piccolo cambiamento delicato. Bastano due o tre minuti di lettura. Scrivi il testo completo nella lingua che la tua famiglia usa davvero, anche se è diversa da quella di questa pagina.
plan.body2=Per i familiari, i luoghi e le piccole abitudini usa le parole che tuo figlio conosce. Se non parli correntemente la lingua in cui scrivi, chiedi a una persona fidata che la conosce bene di rivedere il testo. Una frase naturale conta più di una traduzione letterale.
plan.body3=Salva il testo finito prima di creare l’audio. Già oggi puoi leggerlo ad alta voce o registrare l’intera storia con il telefono. Sleep2Story sta preparando la narrazione sintetica a partire dal testo completo e da un campione della voce di un adulto consenziente; l’app non è ancora disponibile negli store.
