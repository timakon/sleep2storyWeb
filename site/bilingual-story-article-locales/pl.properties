hero.eyebrow=Dwujęzyczna bajka rodzinna · Poradnik 07
hero.title=Bajka na dobranoc w dwóch językach
hero.dek=Jedna mała przygoda może należeć do dwóch języków używanych w rodzinie. Nie trzeba tłumaczyć każdego zdania na głos ani robić z wieczoru lekcji słówek.
byline.read_time=6 minut czytania
byline.date=30 września 2026
answer.title=Zachowaj jedną fabułę i przygotuj dwie pełne wersje.
answer.body=Wybierz krótką własną historię. Bohaterowie i zakończenie pozostają takie same, ale każda wersja brzmi tak, jak mówi się u was w domu. Czytaj jedną wersję na raz.
plan.title=Przygotuj bajkę w dwóch językach
plan.body1=Zacznij od jednej sceny: bohater, znajomy przedmiot i łagodna zmiana. Wystarczy opowieść na dwie lub trzy minuty czytania. Pierwszą wersję napisz w języku, którym najłatwiej rozmawiasz z dzieckiem.
plan.body2=Drugą opowiedz na nowo, zamiast tłumaczyć słowo w słowo. Zachowaj wydarzenia i końcowy obraz. Jeśli dziecko inaczej nazywa babcię w drugim języku, użyj domowego słowa. O niepewne sformułowania zapytaj kogoś, kto swobodnie mówi tym językiem.
plan.body3=Trzymaj oba gotowe teksty osobno lub na sąsiednich stronach. Dziecko może wybrać język na dziś, a różni dorośli mogą czytać w swoim języku. Nie musisz przerywać po każdym zdaniu, by tłumaczyć albo odpytywać ze słówek.
story.kicker=Przykład gotowy do czytania
story.title=Jedna autorska bajka w dwóch językach
story.intro=Papierowa gwiazdka, deszczowy wieczór i to samo spokojne zakończenie są w obu wersjach. Imiona i rodzinne zwroty możesz zmienić na wasze.
story.first_title=Papierowa gwiazdka
story.first_p1=Każdego wieczoru Nika i babcia stawiały papierową gwiazdkę przy kuchennym oknie. „Dla kogo ona jest?” — spytała Nika. „Dla każdego, kto szuka drogi do domu” — odpowiedziała babcia. Pewnego deszczowego wieczoru gwiazdka wpadła za szafkę. Szukały pod stołem i między butami, ale znalazły tylko żółty ołówek.
story.first_p2=Babcia złożyła nową gwiazdkę z odwrotnej strony starej listy zakupów. Nika narysowała jasną kropkę pośrodku. Przykleiły gwiazdkę do szyby, przez którą przeświecało światło z kuchni. Wkrótce tata otworzył drzwi i strząsnął deszcz z kurtki. „Widziałem naszą gwiazdkę” — powiedział. Nika się uśmiechnęła. Zagubionej gwiazdki mogły poszukać rano.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Dopasuj słowa, zachowaj opowieść
adapt.body1=„Babcia” może w waszym domu mieć inne imię. Wybierz słowo, które zna dziecko. Kuchnię też można zmienić na inne znane miejsce. Ważna jest ta sama kolejność zdarzeń, nie identyczny szyk wyrazów.
adapt.body2=Jeśli zamiast tej autorskiej bajki przerabiasz wydaną książkę, zachowaj tekst w rodzinie i sprawdź prawa przed publicznym udostępnieniem przeróbki lub nagrania.
reading.title=Plan czytania na dwa wieczory
reading.body1=Pierwszego wieczoru przeczytaj jedną wersję w całości. Następnego sięgnij po drugą, bez tłumaczenia każdego zdania. Jeśli dziecko zapyta o słowo, odpowiedz krótko i wróć do bajki. Powtórzenie ulubionej wersji też jest w porządku.
reading.body2=Bliska osoba mówiąca drugim językiem może przeczytać swoją wersję lub nagrać ją telefonem. Powiedz dziecku, czyj głos usłyszy. Dorosły, który jest obok, może w każdej chwili zrobić pauzę i zakończyć wieczór jak zwykle.
product.body2=Aplikacja wciąż powstaje. Na razie przechowuj oba teksty osobno i czytaj je lub nagrywaj telefonem. Zwykłe nagranie zachowuje prawdziwe czytanie osoby; planowana narracja syntetyczna z próbki głosu działa inaczej.
faq.title=Pytania o dwujęzyczne bajki
faq.1.question=Czy trzeba zmieniać język po każdym zdaniu?
faq.1.answer=Nie. Dwie pełne wersje często łatwiej śledzić przed snem. Jeśli dziecko samo naturalnie miesza języki, nie trzeba narzucać sztywnej zasady.
faq.2.question=A jeśli znam tylko jeden z dwóch języków?
faq.2.answer=Czytaj wersję, w której czujesz się swobodnie. Poproś zaufaną osobę znającą drugi język o pomoc w pisaniu lub czytaniu. Nie musisz udawać biegłości.
sources.body=Colorín Colorado zachęca rodziny do czytania w języku domowym. Plan dwóch wersji i gwiazdka to nasze własne przykłady redakcyjne. Więcej informacji:
