hero.eyebrow=Bajki w twoim języku · Poradnik 07
hero.title=Bajki na dobranoc w różnych językach
hero.dek=Język bajki na dobranoc powinien brzmieć jak dom. Sleep2Story przygotowuje narrację gotowych tekstów w ponad 30 językach, aby każda rodzina mogła wybrać znajome brzmienie.
byline.read_time=5 minut czytania
byline.date=30 września 2026
answer.title=Zacznij od języka, który dziecko zna najlepiej.
answer.body=Napisz krótką, kompletną bajkę w języku, który dziecko ma usłyszeć. Używaj znajomych imion i codziennych słów. Jeśli chcesz też inny język, przygotuj osobną, naturalnie brzmiącą wersję. Zacznij od dowolnego języka używanego w twojej rodzinie.
plan.title=Przygotuj bajkę w wybranym języku
plan.body1=Wybierz bohatera, znajomy przedmiot i jedną łagodną zmianę. Wystarczy opowieść na dwie lub trzy minuty czytania. Napisz pełny tekst w języku, którego naprawdę używa twoja rodzina, nawet jeśli różni się on od języka tej strony.
plan.body2=Nazywaj bliskich, miejsca i codzienne czynności słowami, które zna dziecko. Jeśli nie mówisz płynnie w języku bajki, poproś zaufaną osobę, która go zna, o sprawdzenie tekstu. Naturalne zdanie jest ważniejsze niż dosłowne tłumaczenie.
plan.body3=Zapisz gotowy tekst przed przygotowaniem nagrania. Już dziś możesz przeczytać go na głos lub nagrać całą bajkę telefonem. Sleep2Story przygotowuje narrację syntetyczną z pełnego tekstu i próbki głosu dorosłej osoby, która wyraziła zgodę; aplikacja nie jest jeszcze dostępna w sklepach.
