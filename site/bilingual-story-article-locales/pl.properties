languages.title=W jakim języku może być bajka?
languages.intro=W planowanej aplikacji ma być dostępna narracja w ponad 30 językach. Język strony to tylko język tego poradnika; nie decyduje o języku twojej bajki.
languages.examples=Rodziny mogą pisać bajki na przykład po angielsku, niemiecku, francusku, hiszpańsku, włosku, portugalsku, niderlandzku, polsku, czesku, rumuńsku, serbsku, ukraińsku, rosyjsku, turecku, arabsku, hindi, chińsku (mandaryńsku), japońsku, koreańsku i indonezyjsku.
languages.note=Te 20 języków to przykłady do pisania bajek, a nie potwierdzona lista języków narracji na premierę. Sleep2Story opublikuje dokładną listę wraz z wydaniem aplikacji. Jeśli chcesz kilka wersji, przygotuj pełny tekst każdej z nich.
story.kicker=Przykład gotowy do czytania
story.title=Krótka bajka na dobranoc po polsku
story.intro=Ten autorski przykład jest po polsku, ponieważ po polsku jest ten poradnik. Inne wersje językowe strony pokazują tę samą bajkę w swoim języku. Wykorzystaj scenę i spokojne zakończenie jako wzór opowieści, która brzmi naturalnie w twojej rodzinie.
story.first_title=Papierowa gwiazdka
story.first_p1=Każdego wieczoru Nika i babcia stawiały papierową gwiazdkę przy kuchennym oknie. „Dla kogo ona jest?” — spytała Nika. „Dla każdego, kto szuka drogi do domu” — odpowiedziała babcia. Pewnego deszczowego wieczoru gwiazdka wpadła za szafkę. Szukały pod stołem i między butami, ale znalazły tylko żółty ołówek.
story.first_p2=Babcia złożyła nową gwiazdkę z odwrotnej strony starej listy zakupów. Nika narysowała jasną kropkę pośrodku. Przykleiły gwiazdkę do szyby, przez którą przeświecało światło z kuchni. Wkrótce tata otworzył drzwi i strząsnął deszcz z kurtki. „Widziałem naszą gwiazdkę” — powiedział. Nika się uśmiechnęła. Zagubionej gwiazdki mogły poszukać rano.
adapt.title=Dobierz słowa używane w twojej rodzinie
adapt.body1=Babcia może mieć w waszym domu inne imię, a kuchnię można zamienić na miejsce znane dziecku. Zachowaj prostą kolejność zdarzeń, ale wybierz sformułowania naturalne w danym języku. Jeśli przygotowujesz kolejną wersję językową, opowiedz historię na nowo zamiast tłumaczyć ją zdanie po zdaniu.
adapt.body2=Jeśli przerabiasz wydaną książkę zamiast tego autorskiego przykładu, sprawdź prawa przed publicznym udostępnieniem zmienionego tekstu lub nagrania. Krótką bajkę napisaną samodzielnie łatwiej wykorzystać ponownie.
reading.title=Czytaj teraz, nagranie przygotuj później
reading.body1=Przeczytaj gotową bajkę raz w języku, który dziecko lubi najbardziej. Wskaż papierową gwiazdkę, zrób przerwę na pytanie i wróć do zakończenia. Powtórzenie tej samej wersji kolejnego wieczoru też jest w porządku.
reading.body2=Bliska osoba może przeczytać bajkę na żywo lub zrobić zwykłe nagranie telefonem. Powiedz dziecku, czyj głos usłyszy. Po premierze planowana narracja Sleep2Story będzie wykorzystywać pełny tekst i próbkę głosu dorosłej osoby, która wyraziła zgodę; nie będzie zapisem oryginalnego odczytania każdego słowa przez tę osobę.
product.title=Znajomy głos w wybranym języku
product.body=Sleep2Story powstaje z myślą o narracji gotowych bajek na dobranoc w ponad 30 językach, z użyciem próbki głosu dorosłego członka rodziny za jego zgodą. Aplikacja jest jeszcze w przygotowaniu; dokładna lista języków zostanie opublikowana w dniu premiery.
product.body2=Aplikacja nie pisze ani nie tłumaczy bajki za ciebie. Dostarcz pełny tekst w języku, w którym ma być czytany. Na dziś przeczytaj go samodzielnie lub nagraj telefonem: zwykłe nagranie zachowuje prawdziwe czytanie, a narracja syntetyczna z próbki głosu działa inaczej.
faq.title=Pytania o języki bajek
faq.1.question=Czy bajka musi być w języku tej strony?
faq.1.answer=Nie. Ta strona jest po polsku, aby ułatwić ci czytanie poradnika. Przygotuj tekst bajki w języku używanym w twojej rodzinie. Planowane ponad 30 języków narracji w aplikacji to osobna lista niż 14 języków strony; po premierze sprawdź ostateczną listę obsługiwanych języków.
faq.2.question=Czy Sleep2Story napisze lub przetłumaczy bajkę za mnie?
faq.2.answer=Nie. Dorosły dostarcza pełny tekst w każdym języku, którego chce użyć. Jeśli potrzebujesz innej wersji, napisz ją naturalnie i poproś osobę biegle znającą język o sprawdzenie przed nagraniem lub przygotowaniem narracji.
sources.body=Colorín Colorado zachęca rodziny do wspólnego czytania książek w języku domowym. Bajka o papierowej gwiazdce i plan pisania to autorskie przykłady redakcji Sleep2Story. Więcej informacji:
