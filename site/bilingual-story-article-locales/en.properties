languages.title=Which language can the story use?
languages.intro=The planned app aims to offer narration in more than 30 languages. Your website language is only the language of this guide; it does not decide the language of your story.
languages.examples=Some languages families may use for their stories are English, German, French, Spanish, Italian, Portuguese, Dutch, Polish, Czech, Romanian, Serbian, Ukrainian, Russian, Turkish, Arabic, Hindi, Mandarin Chinese, Japanese, Korean and Indonesian.
languages.note=These 20 are writing examples, not a confirmed launch list for narration. Sleep2Story will publish its exact language selection when the app is released. If you want several versions, provide a complete text for each one.
story.kicker=A ready-to-read example
story.title=A short bedtime story in English
story.intro=This original example is in English because this guide is in English. The other website versions show the same story in their own language. Use the scene and quiet ending as a model for a story that sounds natural in your family.
story.first_title=The Paper Star
story.first_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.first_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Make the words sound like your family
adapt.body1=Grandma may have another name in your home, and the kitchen can become a place your child knows. Keep the simple sequence, but choose expressions that sound natural in the language you are using. If you prepare another language version, let it be a retelling rather than a line-by-line translation.
adapt.body2=If you adapt a published book instead of this original example, check the rights before sharing rewritten text or audio publicly. A short story you wrote yourself is simpler to reuse.
reading.title=Read it now; prepare audio later
reading.body1=Read the finished story once in the language your child prefers. Point to the paper star, pause if they ask a question and return to the ending. Repeating the same version on another evening is fine.
reading.body2=A relative can read it live or make an ordinary phone recording. Tell the child whose voice they will hear. Once Sleep2Story launches, its planned narration will use the complete text and a consenting adult's voice sample; it will not preserve that person's original performance of every word.
product.title=A familiar voice in your chosen language
product.body=Sleep2Story is being developed to narrate finished bedtime-story text in more than 30 languages using a consenting adult family member's voice sample. The app is still in preparation; the exact language list will be published at launch.
product.body2=The app does not write or translate the story for you. Supply the complete text in the language you want narrated. For tonight, read it yourself or record it on a phone; an ordinary recording preserves the real reading, while synthetic narration from a voice sample works differently.
faq.title=Questions about story languages
faq.1.question=Does the story have to be in the language of this page?
faq.1.answer=No. This page is in English so you can read the guide. Prepare the story text in a language your family uses. The app's planned 30+ narration languages are separate from the 14 languages available on the website; check the final supported list when the app launches.
faq.2.question=Will Sleep2Story write or translate the story for me?
faq.2.answer=No. An adult supplies the complete text in each language they want to use. If you need another version, write it naturally and ask a fluent person to review it before recording or preparing narration.
sources.body=Colorín Colorado encourages families to share books in their home language. The paper-star story and writing plan here are original Sleep2Story editorial examples. Further reading:
