hero.eyebrow=Stories in your language · Guide 07
hero.title=Bedtime stories in different languages
hero.dek=The language of a bedtime story should feel like home. Sleep2Story is being prepared to narrate finished story text in more than 30 languages, so each family can choose what sounds familiar.
byline.read_time=5 minute read
byline.date=September 30, 2026
answer.title=Start with the language your child knows best.
answer.body=Write a complete, short story in the language you want your child to hear. Keep familiar names and everyday words. If you want another language too, prepare a separate natural version. Start with whichever language your family uses.
plan.title=Prepare a story in the language you choose
plan.body1=Choose a person, a familiar object and one gentle change. A story that takes two or three minutes to read is enough. Write the full text in the language your family actually uses, whether or not it matches this website page.
plan.body2=Use the words your child knows for family members, places and small routines. If you are writing in a language you do not speak fluently, ask a trusted speaker to review the text. A natural sentence matters more than a literal translation.
plan.body3=Save the finished text before making audio. You can read it aloud or record the whole story on your phone today. Sleep2Story is preparing synthetic narration from a consenting adult's voice sample and your complete text; it is not yet available in app stores.
