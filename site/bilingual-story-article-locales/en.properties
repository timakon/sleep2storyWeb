meta.description=How to read the same bedtime story in two languages: make two natural versions, try a simple reading plan and use a complete bilingual story example.
meta.og_title=A bedtime story in two languages
schema.description=How to read the same bedtime story in two languages: make two natural versions, try a simple reading plan and use a complete bilingual story example.
hero.eyebrow=Bilingual family story · Guide 07
hero.title=A bedtime story in two languages
hero.dek=A child can hear the same small adventure in two family languages. You do not need to translate every sentence aloud or turn bedtime into a vocabulary lesson.
byline.read_time=6 minute read
byline.date=September 30, 2026
answer.title=Keep one plot and write two complete, natural versions.
answer.body=Choose a short original story, keep its characters and ending the same, and let each language sound like something your family would actually say. Read one version at a time. A familiar line or object helps the child recognize the tale in either language.
plan.title=Make two versions without turning the evening into a lesson
plan.body1=Start with one small scene: a person, a familiar object and a gentle change. A story that takes two or three minutes to read is enough. Write the first version in the language you use most comfortably with your child.
plan.body2=Make the second version a retelling, not a word-for-word exercise. Keep the same events and final image. If a relative uses another name for Grandma or a different everyday phrase, use the words the child actually hears at home. Ask a fluent family member to check wording you are unsure of.
plan.body3=Put both finished texts in separate notes or on facing pages. Let the child choose a language tonight, or let different adults read their own language on different evenings. There is no need to interrupt every line with a translation or ask the child to repeat unfamiliar words.
story.kicker=A ready-to-read example
story.title=An original bedtime story in two languages
story.intro=Here is one complete story twice. The paper star, the rainy evening and the same quiet ending appear in both versions. You can replace the names and family words with your own.
story.first_title=The Paper Star
story.first_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.first_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
story.second_lang=ru
story.second_title=Бумажная звёздочка
story.second_p1=Каждый вечер Ника и бабушка ставили бумажную звёздочку у кухонного окна. «Для кого она?» — спросила Ника. «Для тех, кто ищет дорогу домой», — ответила бабушка. Однажды дождливым вечером звёздочка упала за шкаф. Они заглянули под стол и между ботинками, но нашли только жёлтый карандаш.
story.second_p2=Бабушка сложила новую звёздочку из старого списка покупок. Ника нарисовала в середине яркую точку. Они прикрепили звёздочку к стеклу, чтобы сквозь неё светила кухонная лампа. Вскоре папа открыл дверь и стряхнул дождь с куртки. «Я видел нашу звезду», — сказал он. Ника улыбнулась. Потерявшуюся звёздочку можно поискать утром.
adapt.title=Adapt the words; keep the story
adapt.body1=“Grandma” may be Nana, Babushka, Oma or the name your family uses. Change that word in both versions. You can also change the kitchen to a place your child knows. The aim is the same sequence of events, not identical word order or a perfect school translation.
adapt.body2=If you adapt a published book rather than this original example, keep it within your household and check the rights before sharing a recording or rewritten text publicly. Your own short family story is simpler to reuse.
reading.title=A two-night reading plan
reading.body1=On the first evening, read one full version and point out the star at the window. On the next, read the other version without stopping after each sentence. If the child asks about a word, answer briefly and return to the story. Repeating a favorite version is fine too.
reading.body2=A relative who speaks the other language can read their version live or make an ordinary phone recording. Tell the child whose voice they will hear. Keep the adult who is present free to pause, talk or close the evening in the way that feels right for your family.
product.body2=The app is still being prepared for release. For now, keep the two texts separately and read them aloud or record them on your phone. A phone recording preserves a person’s actual reading; planned synthetic narration from a voice sample is a different thing.
faq.title=Questions about bilingual bedtime stories
faq.1.question=Should I switch languages after every sentence?
faq.1.answer=You can, but you do not have to. Two complete versions are often easier to follow at bedtime. If your child enjoys mixing languages naturally, follow their lead rather than enforcing a rule.
faq.2.question=What if I speak only one of the two languages?
faq.2.answer=Read the version you are comfortable with. Ask a trusted speaker of the other language to help write or read that version. Do not feel you must perform fluency you do not have.
sources.body=Colorín Colorado encourages families to share books in their home language; the two-version plan and paper-star story here are original editorial examples. Further reading:
