hero.eyebrow=Cuentos en tu idioma · Guía 07
hero.title=Cuentos para dormir en diferentes idiomas
hero.dek=El idioma de un cuento para dormir debería sonar a hogar. Sleep2Story se está preparando para narrar textos completos en más de 30 idiomas, de modo que cada familia pueda elegir lo que le resulte familiar.
byline.read_time=5 minutos de lectura
byline.date=30 de septiembre de 2026
answer.title=Empieza por el idioma que tu peque conoce mejor.
answer.body=Escribe un cuento breve y completo en el idioma que quieres que tu peque escuche. Usa nombres conocidos y palabras cotidianas. Si también quieres otro idioma, prepara una versión aparte que suene natural. Empieza por cualquier idioma que use tu familia.
plan.title=Prepara un cuento en el idioma que elijas
plan.body1=Elige una persona, un objeto familiar y un pequeño cambio tranquilo. Bastan dos o tres minutos de lectura. Escribe el texto completo en el idioma que tu familia usa de verdad, aunque no coincida con el de esta página.
plan.body2=Usa las palabras que tu peque conoce para los familiares, los lugares y las pequeñas rutinas. Si no dominas el idioma en el que escribes, pide a una persona de confianza que lo hable bien que revise el texto. Una frase natural importa más que una traducción literal.
plan.body3=Guarda el texto terminado antes de crear el audio. Hoy mismo puedes leerlo en voz alta o grabar el cuento entero con el móvil. Sleep2Story está preparando una narración sintética a partir del texto completo y de una muestra de voz de una persona adulta que haya dado su consentimiento; aún no está disponible en las tiendas de aplicaciones.
