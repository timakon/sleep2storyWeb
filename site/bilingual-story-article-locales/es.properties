languages.title=¿En qué idioma puede estar el cuento?
languages.intro=La aplicación en desarrollo prevé ofrecer narración en más de 30 idiomas. El idioma del sitio es solo el de esta guía; no determina el idioma de tu cuento.
languages.examples=Las familias pueden escribir sus cuentos, por ejemplo, en inglés, alemán, francés, español, italiano, portugués, neerlandés, polaco, checo, rumano, serbio, ucraniano, ruso, turco, árabe, hindi, chino mandarín, japonés, coreano e indonesio.
languages.note=Estos 20 idiomas son ejemplos para escribir cuentos, no una lista confirmada de idiomas de narración en el lanzamiento. Sleep2Story publicará la selección exacta cuando se lance la aplicación. Si quieres varias versiones, proporciona un texto completo para cada una.
story.kicker=Un ejemplo listo para leer
story.title=Un cuento corto para dormir en español
story.intro=Este ejemplo original está en español porque esta guía está en español. Las otras versiones del sitio muestran el mismo cuento en su propio idioma. Usa la escena y el final tranquilo como modelo para un cuento que suene natural en tu familia.
story.first_title=La estrella de papel
story.first_p1=Cada noche, Nika y la abuela colocaban una estrellita de papel junto a la ventana de la cocina. «¿Para quién es?», preguntó Nika. «Para quien busca el camino a casa», respondió la abuela. Una noche de lluvia, la estrella cayó detrás del armario. Buscaron debajo de la mesa y entre los zapatos, pero solo encontraron un lápiz amarillo.
story.first_p2=La abuela dobló otra estrella con el reverso de una vieja lista de la compra. Nika dibujó un punto brillante en el centro. La pegaron al cristal, iluminada por la luz de la cocina. Poco después, papá abrió la puerta y sacudió la lluvia de la chaqueta. «He visto nuestra estrella», dijo. Nika sonrió. Podían buscar la estrella perdida por la mañana.
adapt.title=Usa las palabras de tu familia
adapt.body1=Puede que en casa llaméis a la abuela de otra forma, y puedes cambiar la cocina por un lugar que tu peque conozca. Conserva la secuencia sencilla, pero elige expresiones naturales en el idioma que estés usando. Si preparas otra versión, vuelve a contar el cuento en lugar de traducirlo línea por línea.
adapt.body2=Si adaptas un libro publicado en vez de este ejemplo original, comprueba los derechos antes de compartir públicamente el texto modificado o el audio. Un cuento corto escrito por ti es más sencillo de reutilizar.
reading.title=Lee ahora y prepara el audio más adelante
reading.body1=Lee el cuento terminado una vez en el idioma que tu peque prefiera. Señala la estrella de papel, haz una pausa si tiene alguna pregunta y retoma la lectura hasta el final. Puedes repetir la misma versión otra noche.
reading.body2=Un familiar puede leer el cuento en directo o hacer una grabación normal con el móvil. Dile a tu peque de quién es la voz que va a escuchar. Cuando se lance Sleep2Story, la narración prevista usará el texto completo y una muestra de voz de una persona adulta que haya dado su consentimiento; no conservará su lectura original de cada palabra.
product.title=Una voz familiar en el idioma que elijas
product.body=Sleep2Story se está desarrollando para narrar textos completos de cuentos para dormir en más de 30 idiomas a partir de una muestra de voz de un familiar adulto que haya dado su consentimiento. La aplicación aún se está preparando; la lista exacta de idiomas se publicará en el lanzamiento.
product.body2=La aplicación no escribe ni traduce el cuento por ti. Proporciona el texto completo en el idioma en que quieres escucharlo. Esta noche puedes leerlo tú o grabarlo con el móvil: una grabación normal conserva la lectura real, mientras que la narración sintética a partir de una muestra de voz funciona de otra manera.
faq.title=Preguntas sobre los idiomas de los cuentos
faq.1.question=¿El cuento tiene que estar en el idioma de esta página?
faq.1.answer=No. Esta página está en español para que puedas leer la guía. Prepara el texto del cuento en un idioma que use tu familia. Los más de 30 idiomas de narración previstos para la aplicación son una lista distinta de los 14 idiomas disponibles en el sitio; consulta la lista definitiva de idiomas compatibles cuando se lance la aplicación.
faq.2.question=¿Sleep2Story escribirá o traducirá el cuento por mí?
faq.2.answer=No. Una persona adulta proporciona el texto completo en cada idioma que quiera usar. Si necesitas otra versión, escríbela de forma natural y pide a alguien que domine el idioma que la revise antes de grabarla o preparar la narración.
sources.body=Colorín Colorado anima a las familias a compartir libros en la lengua del hogar. El cuento de la estrella de papel y el plan de escritura son ejemplos originales de la redacción de Sleep2Story. Más información:
