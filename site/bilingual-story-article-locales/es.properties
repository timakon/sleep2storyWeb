hero.eyebrow=Cuento familiar bilingüe · Guía 07
hero.title=Cuento para dormir en dos idiomas
hero.dek=Un cuento breve puede formar parte de las dos lenguas de la familia. No hace falta traducir cada frase en voz alta ni convertir la hora de dormir en una clase.
byline.read_time=6 minutos de lectura
byline.date=30 de septiembre de 2026
answer.title=Mantén la misma trama y prepara dos versiones completas.
answer.body=Elige un cuento corto inventado por ti. Conserva los personajes y el final, pero cuenta cada versión con las palabras que usaría tu familia. Lee una versión entera cada vez.
plan.title=Preparar un cuento en dos idiomas
plan.body1=Empieza con una escena pequeña: una persona, un objeto familiar y un cambio suave. Bastan dos o tres minutos de lectura. Escribe primero en la lengua que te resulte más natural con tu peque.
plan.body2=Vuelve a contar el cuento en la segunda lengua en lugar de traducirlo palabra por palabra. Mantén los hechos y la imagen final. Si en casa llamáis a la abuela de otra forma, usa ese nombre. Pide a alguien que domine la lengua que revise lo que te suene dudoso.
plan.body3=Guarda los dos textos por separado o en páginas enfrentadas. El niño puede elegir el idioma de hoy; cada adulto también puede leer en el suyo. No tienes que parar tras cada frase para traducir ni comprobar qué palabras ha aprendido.
story.kicker=Un ejemplo listo para leer
story.title=Un cuento original en dos idiomas
story.intro=La estrella de papel, la lluvia y el mismo final tranquilo aparecen en ambas versiones. Puedes cambiar los nombres y las palabras familiares por las de tu casa.
story.first_title=La estrella de papel
story.first_p1=Cada noche, Nika y la abuela colocaban una estrellita de papel junto a la ventana de la cocina. «¿Para quién es?», preguntó Nika. «Para quien busca el camino a casa», respondió la abuela. Una noche de lluvia, la estrella cayó detrás del armario. Buscaron debajo de la mesa y entre los zapatos, pero solo encontraron un lápiz amarillo.
story.first_p2=La abuela dobló otra estrella con el reverso de una vieja lista de la compra. Nika dibujó un punto brillante en el centro. La pegaron al cristal, iluminada por la luz de la cocina. Poco después, papá abrió la puerta y sacudió la lluvia de la chaqueta. «He visto nuestra estrella», dijo. Nika sonrió. Podían buscar la estrella perdida por la mañana.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Adapta las palabras, conserva la historia
adapt.body1=«Abuela» puede ser el apodo que use tu peque. Cambia también la cocina por un lugar conocido si te encaja mejor. Lo importante es que suceda lo mismo, no que cada frase tenga idéntico orden.
adapt.body2=Si adaptas un libro publicado en vez de este cuento original, mantén la versión en el ámbito familiar y comprueba los derechos antes de compartir públicamente el texto o la grabación.
reading.title=Un plan de lectura para dos noches
reading.body1=La primera noche, lee una versión completa. La siguiente, lee la otra sin detenerte a traducir cada línea. Si surge una pregunta, responde brevemente y vuelve al cuento. Repetir la versión favorita también está bien.
reading.body2=Un familiar que hable la otra lengua puede leer su versión o grabarla con el móvil. Dile al niño de quién es la voz. La persona adulta que está presente puede pausar, conversar y cerrar la noche como prefiera la familia.
product.body2=La aplicación aún se está preparando. Por ahora, guarda los dos textos por separado y léelos o grábalos con el móvil. Una grabación conserva la lectura real de una persona; la narración sintética prevista a partir de una muestra de voz es diferente.
faq.title=Preguntas sobre cuentos bilingües
faq.1.question=¿Tengo que cambiar de idioma después de cada frase?
faq.1.answer=No. Dos versiones completas suelen ser más fáciles de seguir a la hora de dormir. Si tu peque mezcla lenguas de forma natural, no hace falta imponer una regla.
faq.2.question=¿Y si solo hablo uno de los dos idiomas?
faq.2.answer=Lee la versión que dominas. Pide ayuda a alguien de confianza que hable el otro idioma para escribirla o leerla. No tienes que fingir que lo hablas con soltura.
sources.body=Colorín Colorado anima a las familias a compartir libros en la lengua del hogar. El plan de dos versiones y la estrella de papel son ejemplos originales de Sleep2Story. Más información:
