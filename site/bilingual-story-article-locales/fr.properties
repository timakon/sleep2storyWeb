schema.description=Comment lire la même histoire du soir en deux langues : deux versions naturelles, un rituel simple et un exemple complet à raconter à votre enfant.
hero.eyebrow=Histoire familiale bilingue · Guide 07
hero.title=Histoire du soir bilingue
hero.dek=Une petite aventure peut appartenir aux deux langues de la famille. Pas besoin de traduire chaque phrase à voix haute ni de transformer le coucher en leçon de vocabulaire.
byline.read_time=6 minutes de lecture
byline.date=30 septembre 2026
answer.title=Gardez la même intrigue et préparez deux récits complets.
answer.body=Choisissez une histoire courte que vous avez inventée. Les personnages, les événements et la fin restent les mêmes, mais chaque version emploie les mots que votre famille utiliserait spontanément.
plan.title=Préparer deux versions sans compliquer le coucher
plan.body1=Partez d’une seule scène : un personnage, un objet familier et un petit changement. Deux ou trois minutes de lecture suffisent. Écrivez d’abord dans la langue que vous parlez le plus naturellement avec votre enfant.
plan.body2=Réécrivez ensuite l’histoire dans l’autre langue au lieu de traduire mot à mot. Gardez la même suite d’événements. Si, chez vous, « mamie » porte un autre nom, utilisez-le. Demandez à un proche à l’aise dans cette langue de relire les passages qui vous font hésiter.
plan.body3=Conservez les deux textes séparément ou sur deux pages face à face. L’enfant peut choisir la langue du soir ; deux adultes peuvent aussi raconter chacun dans la leur. Inutile d’interrompre chaque ligne pour traduire ou interroger l’enfant.
story.kicker=Un exemple prêt à lire
story.title=Une histoire originale en deux langues
story.intro=L’étoile en papier, la pluie et la même fin paisible figurent dans les deux versions. Vous pouvez remplacer les prénoms et les mots de famille par les vôtres.
story.first_title=La petite étoile en papier
story.first_p1=Chaque soir, Nika et Mamie posaient une petite étoile en papier près de la fenêtre de la cuisine. « Pour qui est-elle ? » demandait Nika. « Pour ceux qui cherchent le chemin de la maison », répondait Mamie. Un soir de pluie, l’étoile glissa derrière le placard. Elles cherchèrent sous la table et entre les chaussures, mais ne trouvèrent qu’un crayon jaune.
story.first_p2=Mamie plia une nouvelle étoile dans le dos d’une vieille liste de courses. Nika dessina un point lumineux au milieu. Elles la fixèrent à la vitre, éclairée par la lampe de la cuisine. Bientôt, Papa ouvrit la porte en secouant la pluie de son manteau. « J’ai vu notre étoile », dit-il. Nika sourit. Elles chercheraient l’autre demain matin.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Adapter les mots, garder le récit
adapt.body1=« Mamie » peut devenir le petit nom que votre enfant emploie vraiment. Vous pouvez aussi déplacer la scène dans une pièce connue de lui. Ce qui compte, c’est la suite des événements, pas un calque de chaque phrase.
adapt.body2=Si vous adaptez un livre publié plutôt que cette histoire originale, gardez votre version dans le cercle familial et vérifiez les droits avant de diffuser le texte ou un enregistrement.
reading.title=Un rituel sur deux soirs
reading.body1=Le premier soir, lisez une version entière. Le lendemain, lisez l’autre sans traduire après chaque phrase. Si l’enfant demande le sens d’un mot, répondez simplement et reprenez le fil. Répéter sa version préférée convient aussi.
reading.body2=Un proche qui parle l’autre langue peut lire sa version ou l’enregistrer avec un téléphone. Dites à l’enfant quelle voix il va entendre. L’adulte présent garde la liberté de faire une pause et de conclure le coucher à sa manière.
product.body2=L’application est encore en préparation. Pour le moment, gardez les deux textes séparément et lisez-les ou enregistrez-les avec un téléphone. Un enregistrement conserve la lecture réelle d’une personne ; la narration synthétique prévue à partir d’un échantillon vocal est différente.
faq.title=Questions sur les histoires bilingues
faq.1.question=Faut-il changer de langue à chaque phrase ?
faq.1.answer=Non. Deux versions complètes sont souvent plus faciles à suivre le soir. Si votre enfant mélange spontanément les langues, inutile de lui imposer une règle rigide.
faq.2.question=Et si je ne parle qu’une des deux langues ?
faq.2.answer=Lisez celle que vous maîtrisez. Un proche qui parle l’autre peut vous aider à écrire ou lire sa version. Vous n’avez pas à faire semblant de parler couramment.
sources.body=Colorín Colorado encourage les familles à lire dans leur langue familiale. Le rituel en deux versions et l’histoire de l’étoile sont des exemples originaux de notre rédaction. Pour aller plus loin :
