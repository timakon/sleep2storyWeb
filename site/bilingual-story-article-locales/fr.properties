languages.title=Dans quelle langue peut-on écrire l’histoire ?
languages.intro=L’application en préparation prévoit une narration dans plus de 30 langues. La langue du site est simplement celle de ce guide ; elle ne détermine pas la langue de votre histoire.
languages.examples=Les familles peuvent écrire leurs histoires, par exemple, en anglais, allemand, français, espagnol, italien, portugais, néerlandais, polonais, tchèque, roumain, serbe, ukrainien, russe, turc, arabe, hindi, chinois mandarin, japonais, coréen et indonésien.
languages.note=Ces 20 langues sont des exemples pour l’écriture, et non une liste confirmée des langues de narration au lancement. Sleep2Story publiera la sélection exacte à la sortie de l’application. Si vous souhaitez plusieurs versions, fournissez un texte complet pour chacune.
story.kicker=Un exemple prêt à lire
story.title=Une courte histoire du soir en français
story.intro=Cet exemple original est en français, comme ce guide. Les autres versions du site proposent la même histoire dans leur propre langue. Inspirez-vous de la scène et de la fin paisible pour écrire un récit qui sonne naturellement dans votre famille.
story.first_title=La petite étoile en papier
story.first_p1=Chaque soir, Nika et Mamie posaient une petite étoile en papier près de la fenêtre de la cuisine. « Pour qui est-elle ? » demandait Nika. « Pour ceux qui cherchent le chemin de la maison », répondait Mamie. Un soir de pluie, l’étoile glissa derrière le placard. Elles cherchèrent sous la table et entre les chaussures, mais ne trouvèrent qu’un crayon jaune.
story.first_p2=Mamie plia une nouvelle étoile dans le dos d’une vieille liste de courses. Nika dessina un point lumineux au milieu. Elles la fixèrent à la vitre, éclairée par la lampe de la cuisine. Bientôt, Papa ouvrit la porte en secouant la pluie de son manteau. « J’ai vu notre étoile », dit-il. Nika sourit. Elles chercheraient l’autre demain matin.
adapt.title=Choisir les mots de votre famille
adapt.body1=Chez vous, Mamie porte peut-être un autre nom, et la cuisine peut devenir un lieu que votre enfant connaît. Gardez la suite simple des événements, mais choisissez des expressions naturelles dans la langue utilisée. Pour une autre version linguistique, racontez à nouveau l’histoire plutôt que de la traduire ligne par ligne.
adapt.body2=Si vous adaptez un livre publié plutôt que cet exemple original, vérifiez les droits avant de partager publiquement le texte remanié ou l’audio. Une courte histoire que vous avez écrite vous-même est plus simple à réutiliser.
reading.title=Lire maintenant, préparer l’audio plus tard
reading.body1=Lisez l’histoire terminée une fois dans la langue que votre enfant préfère. Montrez l’étoile en papier, faites une pause s’il pose une question, puis reprenez jusqu’à la fin. Vous pouvez relire la même version un autre soir.
reading.body2=Un proche peut lire l’histoire en direct ou faire un simple enregistrement sur téléphone. Dites à l’enfant quelle voix il va entendre. Après le lancement de Sleep2Story, la narration prévue utilisera le texte complet et un échantillon de la voix d’un adulte consentant ; elle ne conservera pas la lecture originale de chaque mot par cette personne.
product.title=Une voix familière dans la langue de votre choix
product.body=Sleep2Story est en cours de développement pour proposer la narration de textes complets d’histoires du soir dans plus de 30 langues, à partir d’un échantillon de la voix d’un adulte de la famille qui a donné son accord. L’application est encore en préparation ; la liste exacte des langues sera publiée au lancement.
product.body2=L’application n’écrit ni ne traduit l’histoire à votre place. Fournissez le texte complet dans la langue souhaitée pour la narration. Pour ce soir, lisez-le vous-même ou enregistrez-le sur votre téléphone : un enregistrement ordinaire conserve la lecture réelle, tandis que la narration synthétique à partir d’un échantillon vocal fonctionne autrement.
faq.title=Questions sur les langues des histoires
faq.1.question=L’histoire doit-elle être dans la langue de cette page ?
faq.1.answer=Non. Cette page est en français pour vous permettre de lire le guide. Préparez le texte de l’histoire dans une langue utilisée par votre famille. Les plus de 30 langues de narration prévues dans l’application sont distinctes des 14 langues du site ; consultez la liste définitive des langues prises en charge à la sortie de l’application.
faq.2.question=Sleep2Story écrira-t-il ou traduira-t-il l’histoire pour moi ?
faq.2.answer=Non. Un adulte fournit le texte complet dans chaque langue souhaitée. Si vous avez besoin d’une autre version, écrivez-la naturellement et demandez à une personne qui maîtrise la langue de la relire avant l’enregistrement ou la préparation de la narration.
sources.body=Colorín Colorado encourage les familles à partager des livres dans leur langue familiale. L’histoire de l’étoile en papier et les étapes d’écriture sont des exemples originaux de la rédaction de Sleep2Story. Pour aller plus loin :
