hero.eyebrow=Des histoires dans votre langue · Guide 07
hero.title=Histoires du soir en différentes langues
hero.dek=La langue d’une histoire du soir devrait évoquer la chaleur du foyer. Sleep2Story prépare la narration de textes complets dans plus de 30 langues, pour que chaque famille puisse choisir celle qui lui est familière.
byline.read_time=5 minutes de lecture
byline.date=30 septembre 2026
answer.title=Commencez par la langue que votre enfant connaît le mieux.
answer.body=Écrivez une histoire courte et complète dans la langue que vous souhaitez faire entendre à votre enfant. Gardez des prénoms familiers et des mots du quotidien. Si vous voulez aussi une autre langue, préparez une version distincte et naturelle. Commencez par la langue que votre famille utilise.
plan.title=Préparer une histoire dans la langue de votre choix
plan.body1=Choisissez un personnage, un objet familier et un petit changement tout en douceur. Deux ou trois minutes de lecture suffisent. Écrivez le texte complet dans la langue que votre famille utilise réellement, même si elle diffère de celle de cette page.
plan.body2=Pour les proches, les lieux et les petites habitudes, utilisez les mots que votre enfant connaît. Si vous ne maîtrisez pas la langue dans laquelle vous écrivez, demandez à une personne de confiance qui la parle bien de relire le texte. Une phrase naturelle compte davantage qu’une traduction littérale.
plan.body3=Enregistrez le texte terminé avant de créer l’audio. Vous pouvez dès aujourd’hui le lire à voix haute ou enregistrer toute l’histoire sur votre téléphone. Sleep2Story prépare une narration synthétique à partir de votre texte complet et d’un échantillon de la voix d’un adulte consentant ; l’application n’est pas encore disponible dans les boutiques d’applications.
