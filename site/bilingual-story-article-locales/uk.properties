hero.eyebrow=Казки вашою мовою · Порада 07
hero.title=Казки на ніч різними мовами
hero.dek=Мова казки на ніч має бути рідною й затишною. Sleep2Story готується озвучувати готові тексти понад 30 мовами, щоб кожна родина могла обрати знайоме звучання.
byline.read_time=5 хвилин читання
byline.date=30 вересня 2026 року
answer.title=Почніть із мови, яку дитина знає найкраще.
answer.body=Напишіть коротку завершену казку мовою, яку хочете дати дитині почути. Залиште знайомі імена та повсякденні слова. Якщо потрібна ще одна мова, підготуйте окрему природну версію. Почніть із будь-якої мови, якою користується ваша родина.
plan.title=Підготуйте казку обраною мовою
plan.body1=Оберіть героя, знайому річ і одну лагідну зміну. Вистачить казки на дві-три хвилини читання. Напишіть повний текст мовою, якою справді користується ваша родина, навіть якщо вона відрізняється від мови цієї сторінки.
plan.body2=Називайте рідних, місця та щоденні справи словами, які знає дитина. Якщо ви не вільно володієте мовою казки, попросіть людину, якій довіряєте і яка добре знає цю мову, перевірити текст. Природне речення важливіше за дослівний переклад.
plan.body3=Збережіть готовий текст, перш ніж створювати аудіо. Уже сьогодні його можна прочитати вголос або повністю записати на телефон. Sleep2Story готує синтетичне озвучення за вашим повним текстом і зразком голосу дорослого, який дав згоду; застосунок іще не доступний у магазинах.
