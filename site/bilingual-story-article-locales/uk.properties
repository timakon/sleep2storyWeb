languages.title=Якою мовою може бути казка?
languages.intro=У майбутньому застосунку планується озвучення понад 30 мовами. Мова сайту — це лише мова цієї поради; вона не визначає мову вашої казки.
languages.examples=Родини можуть писати казки, наприклад, англійською, німецькою, французькою, іспанською, італійською, португальською, нідерландською, польською, чеською, румунською, сербською, українською, російською, турецькою, арабською, гінді, китайською (мандаринською), японською, корейською та індонезійською.
languages.note=Ці 20 мов — приклади для написання казок, а не підтверджений перелік мов озвучення на момент запуску. Sleep2Story опублікує точний перелік під час запуску застосунку. Для кількох версій підготуйте окремий повний текст кожною мовою.
story.kicker=Готовий приклад для читання
story.title=Коротка казка на ніч українською
story.intro=Цей авторський приклад написано українською, як і цю пораду. На інших мовних версіях сайту та сама казка подана відповідною мовою. Візьміть сцену та спокійний фінал за основу історії, яка природно звучатиме у вашій родині.
story.first_title=Паперова зірочка
story.first_p1=Щовечора Ніка й бабуся ставили паперову зірочку біля кухонного вікна. «Для кого вона?» — запитала Ніка. «Для тих, хто шукає дорогу додому», — відповіла бабуся. Одного дощового вечора зірочка впала за шафу. Вони зазирнули під стіл і поміж черевиків, але знайшли лише жовтий олівець.
story.first_p2=Бабуся склала нову зірочку зі звороту старого списку покупок. Ніка намалювала посередині яскраву цятку. Вони прикріпили зірочку до скла, крізь яке світило кухонне світло. Незабаром тато відчинив двері й струсив дощ із куртки. «Я бачив нашу зірку», — сказав він. Ніка всміхнулася. Загублену зірочку можна пошукати вранці.
adapt.title=Доберіть слова, звичні для вашої родини
adapt.body1=Удома ви можете називати бабусю інакше, а кухню можна замінити знайомим дитині місцем. Збережіть просту послідовність подій, але доберіть природні вислови обраною мовою. Іншу мовну версію краще переповісти, а не перекладати рядок за рядком.
adapt.body2=Якщо берете за основу видану книжку, а не цей авторський приклад, перевірте права перед публічним поширенням переробленого тексту чи аудіо. Власноруч написану коротку казку простіше використовувати повторно.
reading.title=Читайте зараз, готуйте аудіо згодом
reading.body1=Прочитайте готову казку один раз мовою, яку дитина любить найбільше. Покажіть паперову зірочку, зробіть паузу, якщо дитина щось запитає, і дочитайте до кінця. Іншого вечора можна повторити ту саму версію.
reading.body2=Рідна людина може прочитати казку наживо або зробити звичайний запис на телефон. Скажіть дитині, чий голос вона почує. Після запуску заплановане озвучення Sleep2Story використовуватиме повний текст і зразок голосу дорослого, який дав згоду; це не буде збереженим оригінальним читанням кожного слова цією людиною.
product.title=Знайомий голос обраною вами мовою
product.body=Sleep2Story розробляється для озвучення готових казок на ніч понад 30 мовами за зразком голосу дорослого члена родини, який дав згоду. Застосунок іще готується до випуску; точний перелік мов буде опубліковано під час запуску.
product.body2=Застосунок не пише й не перекладає казку за вас. Надайте повний текст мовою, якою хочете почути озвучення. Сьогодні прочитайте його самі або запишіть на телефон: звичайний запис зберігає справжнє читання, а синтетичне озвучення за зразком голосу працює інакше.
faq.title=Запитання про мови казок
faq.1.question=Чи має казка бути мовою цієї сторінки?
faq.1.answer=Ні. Цю сторінку написано українською, щоб ви могли прочитати пораду. Підготуйте текст казки мовою своєї родини. Заплановані понад 30 мов озвучення в застосунку — окремий перелік від 14 мов сайту; перевірте остаточний список підтримуваних мов після запуску.
faq.2.question=Чи напише або перекладе Sleep2Story казку за мене?
faq.2.answer=Ні. Дорослий надає повний текст кожною мовою, яку хоче використати. Якщо потрібна інша версія, напишіть її природно та попросіть людину, яка вільно володіє мовою, перевірити текст перед записом чи підготовкою озвучення.
sources.body=Colorín Colorado заохочує родини читати книжки домашньою мовою. Казка про паперову зірочку та план написання — авторські приклади редакції Sleep2Story. Детальніше:
