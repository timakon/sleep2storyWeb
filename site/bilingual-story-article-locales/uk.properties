hero.eyebrow=Двомовна сімейна казка · Порада 07
hero.title=Казка на ніч двома мовами
hero.dek=Одна маленька пригода може звучати двома мовами родини. Не потрібно перекладати кожне речення вголос або перетворювати вечір на урок слів.
byline.read_time=6 хвилин читання
byline.date=30 вересня 2026 року
answer.title=Збережіть один сюжет і підготуйте дві повні версії.
answer.body=Оберіть коротку власну казку. Герої та фінал лишаються ті самі, але кожною мовою розповідайте так, як звично говорять удома. Читайте одну версію за раз.
plan.title=Як підготувати казку двома мовами
plan.body1=Почніть з однієї невеликої сцени: людина, знайома річ і лагідна зміна. Вистачить історії на дві-три хвилини. Першу версію напишіть мовою, якою вам найлегше спілкуватися з дитиною.
plan.body2=Другу версію переповідьте, а не перекладайте слово в слово. Залиште ті самі події та фінальний образ. Якщо в родині бабусю називають інакше, використайте знайоме дитині слово. Сумнівні вислови попросіть перевірити людину, яка вільно говорить цією мовою.
plan.body3=Зберігайте два тексти окремо або на сусідніх сторінках. Дитина може сама обрати мову сьогодні, а в різні вечори читати можуть різні дорослі. Не треба перериватися після кожного рядка заради перекладу чи перевірки слів.
story.kicker=Готовий приклад для читання
story.title=Одна авторська казка двома мовами
story.intro=Паперова зірочка, дощовий вечір і спокійний фінал однакові в обох версіях. Імена та родинні звертання можете замінити на свої.
story.first_title=Паперова зірочка
story.first_p1=Щовечора Ніка й бабуся ставили паперову зірочку біля кухонного вікна. «Для кого вона?» — запитала Ніка. «Для тих, хто шукає дорогу додому», — відповіла бабуся. Одного дощового вечора зірочка впала за шафу. Вони зазирнули під стіл і поміж черевиків, але знайшли лише жовтий олівець.
story.first_p2=Бабуся склала нову зірочку зі звороту старого списку покупок. Ніка намалювала посередині яскраву цятку. Вони прикріпили зірочку до скла, крізь яке світило кухонне світло. Незабаром тато відчинив двері й струсив дощ із куртки. «Я бачив нашу зірку», — сказав він. Ніка всміхнулася. Загублену зірочку можна пошукати вранці.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Змінюйте слова, а не події
adapt.body1=«Бабуся» може мати інше домашнє ім’я. Уживайте звертання, яке знає дитина. Кухню також можна замінити знайомим місцем. Важливі ті самі події, а не дослівний порядок слів.
adapt.body2=Якщо берете за основу видану книжку, а не цю авторську історію, залиште переробку для родини й перевірте права перед публічним поширенням тексту або запису.
reading.title=План читання на два вечори
reading.body1=Першого вечора прочитайте одну версію повністю. Наступного — другу, без перекладу кожного речення. Якщо дитина запитає про слово, коротко поясніть і поверніться до сюжету. Повторювати улюблену версію теж можна.
reading.body2=Рідна людина, яка говорить другою мовою, може прочитати свою версію або записати її на телефон. Скажіть дитині, чий голос вона почує. Дорослий поруч завжди може зробити паузу й завершити вечір по-своєму.
product.body2=Застосунок іще готується до випуску. Поки що зберігайте обидва тексти окремо та читайте самі або записуйте на телефон. Звичайний запис зберігає справжнє читання людини; заплановане синтетичне озвучення за зразком голосу працює інакше.
faq.title=Запитання про двомовні казки
faq.1.question=Чи потрібно змінювати мову після кожного речення?
faq.1.answer=Ні. Дві цілісні версії перед сном часто легше слухати. Якщо дитина сама природно змішує мови, не потрібно встановлювати суворе правило.
faq.2.question=Що робити, якщо я знаю лише одну з двох мов?
faq.2.answer=Читайте версію, яка вам зручна. Попросіть близьку людину, що володіє другою мовою, допомогти написати або прочитати її. Удавати вільне володіння не потрібно.
sources.body=Colorín Colorado радить сім’ям читати дітям домашньою мовою. План із двома версіями та історія про зірочку — власні приклади редакції. Детальніше:
