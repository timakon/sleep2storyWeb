hero.eyebrow=Zweisprachige Familiengeschichte · Ratgeber 07
hero.title=Gute-Nacht-Geschichte in zwei Sprachen
hero.dek=Eine kleine Geschichte kann zu zwei Familiensprachen gehören. Sie müssen beim Vorlesen nicht jeden Satz übersetzen und aus der Schlafenszeit keine Vokabelstunde machen.
byline.read_time=6 Minuten Lesezeit
byline.date=30. September 2026
answer.title=Behalten Sie eine Handlung und schreiben Sie zwei vollständige Fassungen.
answer.body=Wählen Sie eine kurze eigene Geschichte mit denselben Figuren und demselben Ende. Formulieren Sie jede Fassung so, wie Ihre Familie tatsächlich spricht. Lesen Sie jeweils eine Version am Stück.
plan.title=Zwei Fassungen für den Abend vorbereiten
plan.body1=Beginnen Sie mit einer kleinen Szene: eine Person, ein vertrauter Gegenstand und eine sanfte Wendung. Zwei bis drei Minuten Vorlesezeit reichen. Schreiben Sie zuerst in der Sprache, die Ihnen mit Ihrem Kind am leichtesten fällt.
plan.body2=Erzählen Sie die Geschichte in der zweiten Sprache neu, statt Wort für Wort zu übersetzen. Ereignisse und Schlussbild bleiben gleich. Nutzen Sie für „Oma“ den Familiennamen, den das Kind wirklich kennt. Bei unsicheren Formulierungen kann jemand aus der Familie gegenlesen.
plan.body3=Bewahren Sie beide Texte getrennt oder auf gegenüberliegenden Seiten auf. Das Kind kann die Sprache wählen; vielleicht liest auch jeder Erwachsene in seiner Sprache. Sie müssen nicht nach jedem Satz unterbrechen oder neue Wörter abfragen.
story.kicker=Eine Geschichte zum Ausprobieren
story.title=Eine eigene Geschichte in zwei Sprachen
story.intro=Der Papierstern, der Regen und das ruhige Ende bleiben in beiden Fassungen gleich. Namen und Familienwörter dürfen Sie durch Ihre eigenen ersetzen.
story.first_title=Der Papierstern
story.first_p1=Jeden Abend stellten Nika und Oma einen kleinen Papierstern ans Küchenfenster. „Für wen ist er?“, fragte Nika. „Für alle, die nach Hause finden wollen“, sagte Oma. An einem regnerischen Abend rutschte der Stern hinter den Schrank. Sie suchten unter dem Tisch und zwischen den Schuhen, fanden aber nur einen gelben Stift.
story.first_p2=Oma faltete aus der Rückseite eines alten Einkaufszettels einen neuen Stern. Nika malte einen hellen Punkt in die Mitte. Sie klebten ihn ans Glas, sodass das Küchenlicht hindurchschien. Bald öffnete Papa die Tür und schüttelte den Regen von der Jacke. „Ich habe unseren Stern gesehen“, sagte er. Nika lächelte. Den verlorenen Stern konnten sie morgen suchen.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Wörter anpassen, die Handlung bewahren
adapt.body1=Oma kann bei Ihnen einen anderen Namen haben. Verwenden Sie das Wort, das Ihr Kind kennt. Auch die Küche darf ein vertrauter anderer Ort sein. Entscheidend sind die gleichen Ereignisse, nicht die gleiche Wortstellung.
adapt.body2=Wenn Sie statt dieser eigenen Geschichte ein veröffentlichtes Buch umschreiben, behalten Sie die Fassung in der Familie und prüfen Sie die Rechte, bevor Sie Text oder Aufnahme öffentlich teilen.
reading.title=Ein Plan für zwei Abende
reading.body1=Lesen Sie am ersten Abend eine Fassung ganz vor. Am nächsten Abend folgt die andere, ohne Satz für Satz zu übersetzen. Beantworten Sie eine Frage kurz und kehren Sie zur Handlung zurück. Wenn Ihr Kind dieselbe Fassung noch einmal möchte, ist das ebenfalls in Ordnung.
reading.body2=Eine vertraute Person kann die zweite Sprache vorlesen oder mit dem Handy aufnehmen. Sagen Sie Ihrem Kind vorher, wessen Stimme es hört. Der Erwachsene vor Ort kann jederzeit pausieren und den Abend wie gewohnt beenden.
product.body2=Die App wird noch für die Veröffentlichung vorbereitet. Bis dahin können Sie beide Texte getrennt aufbewahren, selbst vorlesen oder mit dem Handy aufnehmen. Eine normale Aufnahme bewahrt die echte Lesestimme; geplante synthetische Vertonung aus einer Stimmprobe ist etwas anderes.
faq.title=Fragen zum zweisprachigen Vorlesen
faq.1.question=Muss ich nach jedem Satz die Sprache wechseln?
faq.1.answer=Nein. Zwei vollständige Fassungen lassen sich abends oft leichter verfolgen. Wenn Ihr Kind selbst gern Sprachen mischt, müssen Sie daraus keine feste Regel machen.
faq.2.question=Was, wenn ich nur eine der beiden Sprachen spreche?
faq.2.answer=Lesen Sie die Fassung, in der Sie sich wohlfühlen. Eine vertraute Person mit der anderen Sprache kann beim Schreiben oder Vorlesen helfen. Sie müssen keine Sprachkenntnisse vorspielen.
sources.body=Colorín Colorado ermutigt Familien, in ihrer Familiensprache vorzulesen. Der Plan mit zwei Fassungen und die Geschichte vom Papierstern sind eigene redaktionelle Beispiele. Mehr dazu:
