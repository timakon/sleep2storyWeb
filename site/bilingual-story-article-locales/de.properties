languages.title=In welcher Sprache kann die Geschichte sein?
languages.intro=Für die App ist eine Vertonung in mehr als 30 Sprachen geplant. Die Sprache dieser Website dient nur zum Lesen des Ratgebers; sie legt die Sprache Ihrer Geschichte nicht fest.
languages.examples=Familien können ihre Geschichten beispielsweise auf Englisch, Deutsch, Französisch, Spanisch, Italienisch, Portugiesisch, Niederländisch, Polnisch, Tschechisch, Rumänisch, Serbisch, Ukrainisch, Russisch, Türkisch, Arabisch, Hindi, Mandarin-Chinesisch, Japanisch, Koreanisch oder Indonesisch schreiben.
languages.note=Diese 20 Sprachen sind Beispiele für das Schreiben, keine bestätigte Liste der Vertonung zum Start. Sleep2Story veröffentlicht die genaue Sprachauswahl zum Start der App. Für jede weitere Fassung brauchen Sie einen vollständigen Text.
story.kicker=Eine Geschichte zum Vorlesen
story.title=Eine kurze Gute-Nacht-Geschichte auf Deutsch
story.intro=Dieses eigene Beispiel steht auf Deutsch, weil Sie gerade die deutsche Seite lesen. Die anderen Website-Versionen erzählen dieselbe Geschichte jeweils in ihrer Sprache. Nehmen Sie die einfache Handlung und das ruhige Ende als Anregung für Ihre Familie.
story.first_title=Der Papierstern
story.first_p1=Jeden Abend stellten Nika und Oma einen kleinen Papierstern ans Küchenfenster. „Für wen ist er?“, fragte Nika. „Für alle, die nach Hause finden wollen“, sagte Oma. An einem regnerischen Abend rutschte der Stern hinter den Schrank. Sie suchten unter dem Tisch und zwischen den Schuhen, fanden aber nur einen gelben Stift.
story.first_p2=Oma faltete aus der Rückseite eines alten Einkaufszettels einen neuen Stern. Nika malte einen hellen Punkt in die Mitte. Sie klebten ihn ans Glas, sodass das Küchenlicht hindurchschien. Bald öffnete Papa die Tür und schüttelte den Regen von der Jacke. „Ich habe unseren Stern gesehen“, sagte er. Nika lächelte. Den verlorenen Stern konnten sie morgen suchen.
adapt.title=Worte wählen, die nach Familie klingen
adapt.body1=„Oma“ kann bei Ihnen anders heißen; auch die Küche lässt sich durch einen Ort ersetzen, den Ihr Kind kennt. Behalten Sie die einfache Handlung bei, aber wählen Sie natürliche Formulierungen. Eine weitere Sprachfassung darf eine Nacherzählung sein statt einer Übersetzung Satz für Satz.
adapt.body2=Wenn Sie ein veröffentlichtes Buch anpassen, prüfen Sie die Rechte, bevor Sie umgeschriebenen Text oder Audio öffentlich teilen. Eine eigene kurze Geschichte lässt sich einfacher wiederverwenden.
reading.title=Heute vorlesen, Audio später vorbereiten
reading.body1=Lesen Sie die fertige Geschichte in der Sprache vor, die Ihr Kind mag. Zeigen Sie auf den Papierstern, beantworten Sie Fragen und kehren Sie zum Schluss zurück. Auch am nächsten Abend darf es dieselbe Geschichte sein.
reading.body2=Eine vertraute Person kann live vorlesen oder die Geschichte mit dem Handy aufnehmen. Sagen Sie Ihrem Kind, wessen Stimme es hört. Nach dem Start wird die geplante Sleep2Story-Vertonung den vollständigen Text und die Stimmprobe eines einwilligenden Erwachsenen nutzen; sie bewahrt nicht dessen ursprünglichen Vortrag Wort für Wort.
product.title=Eine vertraute Stimme in Ihrer Sprache
product.body=Sleep2Story wird entwickelt, um fertige Gute-Nacht-Geschichten in mehr als 30 Sprachen mit der Stimme eines einwilligenden erwachsenen Familienmitglieds zu vertonen. Die App ist noch in Vorbereitung; die genaue Sprachauswahl wird zum Start veröffentlicht.
product.body2=Die App schreibt oder übersetzt die Geschichte nicht für Sie. Geben Sie den vollständigen Text in der gewünschten Sprache ein. Für heute können Sie selbst vorlesen oder die Geschichte mit dem Handy aufnehmen. Eine solche Aufnahme bewahrt die echte Lesestimme; eine synthetische Vertonung aus einer Stimmprobe funktioniert anders.
faq.title=Fragen zur Sprache der Geschichte
faq.1.question=Muss die Geschichte in der Sprache dieser Seite sein?
faq.1.answer=Nein. Die deutsche Seite soll Ihnen nur das Lesen des Ratgebers erleichtern. Den Text können Sie in einer Sprache Ihrer Familie vorbereiten. Die geplanten mehr als 30 Erzählsprachen der App sind etwas anderes als die 14 Website-Sprachen; die endgültige Liste folgt zum Start.
faq.2.question=Schreibt oder übersetzt Sleep2Story die Geschichte für mich?
faq.2.answer=Nein. Ein Erwachsener liefert den vollständigen Text in jeder gewünschten Sprache. Für eine weitere Fassung schreiben Sie natürlich klingende Sätze und lassen sie am besten von jemandem prüfen, der die Sprache gut beherrscht.
sources.body=Colorín Colorado ermutigt Familien, Kindern in ihrer Familiensprache vorzulesen. Die Papierstern-Geschichte und der Schreibplan sind eigene redaktionelle Beispiele von Sleep2Story. Mehr dazu:
