hero.eyebrow=Geschichten in Ihrer Sprache · Ratgeber 07
hero.title=Gute-Nacht-Geschichten in vielen Sprachen
hero.dek=Eine Geschichte vor dem Schlafengehen sollte für Ihr Kind vertraut klingen. Sleep2Story bereitet die Vertonung fertiger Texte in über 30 Sprachen vor, damit Familien ihre eigene Sprache wählen können.
byline.read_time=5 Minuten Lesezeit
byline.date=30. September 2026
answer.title=Beginnen Sie mit der Sprache, die Ihr Kind gut kennt.
answer.body=Schreiben Sie eine kurze, vollständige Geschichte in der Sprache, in der Ihr Kind sie hören soll. Verwenden Sie vertraute Namen und Alltagswörter. Falls Sie noch eine andere Sprache möchten, schreiben Sie dafür eine eigene, natürlich klingende Fassung. Beginnen Sie mit der Sprache, die Ihr Kind zu Hause hört.
plan.title=Eine Geschichte in Ihrer Sprache vorbereiten
plan.body1=Wählen Sie eine Person, einen vertrauten Gegenstand und eine sanfte Wendung. Ein Text für zwei bis drei Minuten Vorlesezeit reicht. Schreiben Sie in der Sprache, die Ihre Familie tatsächlich spricht – auch wenn sie nicht der Sprache dieser Website entspricht.
plan.body2=Nutzen Sie die Namen und Wendungen, die Ihr Kind zu Hause hört. Wenn Sie in der gewählten Sprache nicht sicher schreiben, bitten Sie eine vertraute Person mit guten Sprachkenntnissen um Rückmeldung. Ein natürlicher Satz ist wichtiger als eine wörtliche Übersetzung.
plan.body3=Bewahren Sie den fertigen Text auf, bevor Sie Audio vorbereiten. Heute können Sie selbst vorlesen oder die ganze Geschichte mit dem Handy aufnehmen. Sleep2Story plant eine synthetische Vertonung auf Basis des vollständigen Textes und der Stimmprobe eines einwilligenden Erwachsenen. Die App ist noch nicht in den Stores erhältlich.
