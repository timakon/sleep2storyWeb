hero.eyebrow=Priče na vašem jeziku · Vodič 07
hero.title=Priče za laku noć na različitim jezicima
hero.dek=Jezik priče za laku noć treba da podseća na dom. Sleep2Story se priprema za naraciju gotovih tekstova na više od 30 jezika, kako bi svaka porodica mogla da izabere ono što joj zvuči poznato.
byline.read_time=5 minuta čitanja
byline.date=30. septembar 2026.
answer.title=Počnite od jezika koji dete najbolje poznaje.
answer.body=Napišite kratku, celu priču na jeziku koji želite da dete čuje. Koristite poznata imena i svakodnevne reči. Ako želite još jedan jezik, pripremite zasebnu verziju koja zvuči prirodno. Počnite od bilo kog jezika koji vaša porodica koristi.
plan.title=Pripremite priču na jeziku koji izaberete
plan.body1=Izaberite osobu, poznat predmet i jednu blagu promenu. Dovoljna je priča za dva ili tri minuta čitanja. Napišite ceo tekst na jeziku koji vaša porodica zaista koristi, čak i ako nije isti kao jezik ove stranice.
plan.body2=Za članove porodice, mesta i male navike koristite reči koje dete poznaje. Ako ne govorite tečno jezik na kom pišete, zamolite nekoga kome verujete i ko dobro zna taj jezik da pregleda tekst. Prirodna rečenica važnija je od doslovnog prevoda.
plan.body3=Sačuvajte gotov tekst pre nego što napravite audio. Već danas možete da ga pročitate naglas ili snimite celu priču telefonom. Sleep2Story priprema sintetičku naraciju iz celog teksta i uzorka glasa odrasle osobe koja je dala saglasnost; aplikacija još nije dostupna u prodavnicama.
