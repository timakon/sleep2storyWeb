languages.title=Na kom jeziku može da bude priča?
languages.intro=Za buduću aplikaciju planira se naracija na više od 30 jezika. Jezik sajta je samo jezik ovog vodiča; on ne određuje jezik vaše priče.
languages.examples=Porodice mogu da pišu priče, na primer, na engleskom, nemačkom, francuskom, španskom, italijanskom, portugalskom, holandskom, poljskom, češkom, rumunskom, srpskom, ukrajinskom, ruskom, turskom, arapskom, hindiju, mandarinskom kineskom, japanskom, korejskom i indonežanskom.
languages.note=Ovih 20 jezika su primeri za pisanje priča, a ne potvrđena lista jezika naracije pri pokretanju aplikacije. Sleep2Story će objaviti tačan izbor jezika kada aplikacija bude objavljena. Ako želite više verzija, pripremite ceo tekst za svaku.
story.kicker=Primer spreman za čitanje
story.title=Kratka priča za laku noć na srpskom
story.intro=Ovaj originalni primer je na srpskom zato što je i vodič na srpskom. Ostale jezičke verzije sajta prikazuju istu priču na svom jeziku. Neka vam scena i miran kraj posluže kao uzor za priču koja prirodno zvuči u vašoj porodici.
story.first_title=Papirna zvezdica
story.first_p1=Svake večeri Nika i baka stavljale su malu papirnu zvezdu pored kuhinjskog prozora. „Za koga je?”, pitala je Nika. „Za svakoga ko traži put kući”, rekla je baka. Jedne kišne večeri zvezda je skliznula iza ormarića. Tražile su ispod stola i između cipela, ali su našle samo žutu olovku.
story.first_p2=Baka je savila novu zvezdu od poleđine starog spiska za kupovinu. Nika je nacrtala svetlu tačku u sredini. Zalepile su je na staklo, kroz koje je sijalo kuhinjsko svetlo. Uskoro je tata otvorio vrata i otresao kišu sa jakne. „Video sam našu zvezdu”, rekao je. Nika se nasmešila. Izgubljenu zvezdu mogle su da potraže ujutru.
adapt.title=Koristite reči svoje porodice
adapt.body1=Baku možda u vašoj kući zovete drugačije, a kuhinju možete zameniti mestom koje dete poznaje. Zadržite jednostavan sled događaja, ali birajte izraze koji prirodno zvuče na jeziku koji koristite. Ako pripremate verziju na drugom jeziku, prepričajte je umesto da prevodite red po red.
adapt.body2=Ako prilagođavate objavljenu knjigu umesto ovog originalnog primera, proverite prava pre javnog deljenja prerađenog teksta ili audio-snimka. Kratku priču koju ste sami napisali lakše je ponovo koristiti.
reading.title=Čitajte sada, audio pripremite kasnije
reading.body1=Pročitajte gotovu priču jednom na jeziku koji dete najviše voli. Pokažite papirnu zvezdicu, zastanite ako nešto pita, pa se vratite završetku. U redu je da neke druge večeri ponovite istu verziju.
reading.body2=Član porodice može da pročita priču uživo ili napravi običan snimak telefonom. Recite detetu čiji će glas čuti. Kada Sleep2Story bude objavljen, planirana naracija koristiće ceo tekst i uzorak glasa odrasle osobe koja je dala saglasnost; neće čuvati njeno izvorno čitanje svake reči.
product.title=Poznat glas na jeziku koji izaberete
product.body=Sleep2Story se razvija za naraciju gotovih priča za laku noć na više od 30 jezika, uz uzorak glasa odraslog člana porodice koji je dao saglasnost. Aplikacija se još priprema; tačna lista jezika biće objavljena pri pokretanju.
product.body2=Aplikacija ne piše niti prevodi priču umesto vas. Priložite ceo tekst na jeziku na kom želite naraciju. Za večeras ga pročitajte sami ili snimite telefonom: običan snimak čuva stvarno čitanje, dok sintetička naracija iz uzorka glasa radi drugačije.
faq.title=Pitanja o jezicima priča
faq.1.question=Da li priča mora da bude na jeziku ove stranice?
faq.1.answer=Ne. Ova stranica je na srpskom da biste mogli da pročitate vodič. Pripremite tekst priče na jeziku koji vaša porodica koristi. Planiranih više od 30 jezika naracije u aplikaciji odvojeno je od 14 jezika sajta; proverite konačnu listu podržanih jezika kada aplikacija bude objavljena.
faq.2.question=Da li će Sleep2Story napisati ili prevesti priču umesto mene?
faq.2.answer=Ne. Odrasla osoba daje ceo tekst na svakom jeziku koji želi da koristi. Ako vam treba druga verzija, napišite je prirodno i zamolite osobu koja tečno govori taj jezik da je pregleda pre snimanja ili pripreme naracije.
sources.body=Colorín Colorado podstiče porodice da zajedno čitaju knjige na jeziku koji govore kod kuće. Priča o papirnoj zvezdici i plan pisanja originalni su urednički primeri Sleep2Story. Više na:
