hero.eyebrow=Dvojezična porodična priča · Vodič 07
hero.title=Priča za laku noć na dva jezika
hero.dek=Mala avantura može da pripada oba jezika u porodici. Ne morate da prevodite svaku rečenicu naglas niti da od odlaska na spavanje pravite čas reči.
byline.read_time=6 minuta čitanja
byline.date=30. septembar 2026.
answer.title=Zadržite istu radnju i napišite dve cele verzije.
answer.body=Izaberite kratku priču koju ste sami smislili. Likovi i kraj ostaju isti, ali svaka verzija zvuči kao razgovor u vašoj kući. Čitajte po jednu verziju od početka do kraja.
plan.title=Pripremite priču na dva jezika
plan.body1=Počnite od jedne male scene: osoba, poznata stvar i blaga promena. Dovoljna je priča od dva ili tri minuta. Prvu verziju napišite na jeziku kojim najlakše razgovarate sa detetom.
plan.body2=Drugu verziju ispričajte ponovo, umesto da prevodite reč po reč. Sačuvajte iste događaje i završnu sliku. Ako dete baku zove drugačije na drugom jeziku, koristite taj porodični naziv. Za nesigurne izraze zamolite nekoga ko dobro govori taj jezik da pročita tekst.
plan.body3=Čuvajte tekstove odvojeno ili na susednim stranama. Dete može da bira jezik za večeras, a različiti odrasli mogu da čitaju na svom jeziku. Nema potrebe da prekidate posle svake rečenice radi prevoda ili provere reči.
story.kicker=Primer spreman za čitanje
story.title=Jedna originalna priča na dva jezika
story.intro=Papirna zvezdica, kiša i isti miran kraj ostaju u obe verzije. Imena i porodične nazive možete promeniti.
story.first_title=Papirna zvezdica
story.first_p1=Svake večeri Nika i baka stavljale su malu papirnu zvezdu pored kuhinjskog prozora. „Za koga je?”, pitala je Nika. „Za svakoga ko traži put kući”, rekla je baka. Jedne kišne večeri zvezda je skliznula iza ormarića. Tražile su ispod stola i između cipela, ali su našle samo žutu olovku.
story.first_p2=Baka je savila novu zvezdu od poleđine starog spiska za kupovinu. Nika je nacrtala svetlu tačku u sredini. Zalepile su je na staklo, kroz koje je sijalo kuhinjsko svetlo. Uskoro je tata otvorio vrata i otresao kišu sa jakne. „Video sam našu zvezdu”, rekao je. Nika se nasmešila. Izgubljenu zvezdu mogle su da potraže ujutru.
story.second_lang=en
story.second_title=The Paper Star
story.second_p1=Every evening, Nika and Grandma put a little paper star beside the kitchen window. “Who is it for?” Nika asked. “For anyone finding their way home,” Grandma said. One rainy night the star slipped behind a cupboard. They looked under the table and between the shoes, but found only a yellow pencil.
story.second_p2=Grandma folded a new star from the back of an old shopping list. Nika drew a bright dot in its middle. They taped it to the glass, where the kitchen light shone through. Soon Dad opened the door, shaking rain from his coat. “I saw our star,” he said. Nika smiled. The lost star could wait until morning.
adapt.title=Prilagodite reči, sačuvajte radnju
adapt.body1=„Baka” može da bude vaš kućni nadimak. Upotrebite reč koju dete poznaje. I kuhinju možete zameniti nekim drugim poznatim mestom. Bitan je isti sled događaja, a ne isti redosled reči.
adapt.body2=Ako prilagođavate objavljenu knjigu umesto ove originalne priče, zadržite preradu u porodici i proverite prava pre nego što tekst ili snimak javno podelite.
reading.title=Plan čitanja za dve večeri
reading.body1=Prve večeri pročitajte jednu verziju u celini. Sledeće večeri pročitajte drugu bez prevoda posle svake rečenice. Ako dete pita za neku reč, kratko odgovorite i nastavite priču. Možete i da ponovite omiljenu verziju.
reading.body2=Član porodice koji govori drugi jezik može da pročita svoju verziju ili je snimi telefonom. Recite detetu čiji će glas čuti. Odrasli koji je tu može da pauzira i završi veče onako kako je porodici uobičajeno.
product.body2=Aplikacija se još priprema za objavljivanje. Do tada čuvajte dva teksta odvojeno, čitajte ih ili snimite telefonom. Običan snimak čuva stvarno čitanje osobe; planirana sintetička naracija iz uzorka glasa je nešto drugo.
faq.title=Pitanja o dvojezičnim pričama
faq.1.question=Moram li da promenim jezik posle svake rečenice?
faq.1.answer=Ne. Dve cele verzije često je lakše pratiti pred spavanje. Ako dete samo prirodno meša jezike, ne morate da uvodite strogo pravilo.
faq.2.question=Šta ako govorim samo jedan od ta dva jezika?
faq.2.answer=Čitajte verziju u kojoj se osećate sigurno. Zamolite blisku osobu koja govori drugi jezik da pomogne pri pisanju ili čitanju. Ne morate da glumite tečno znanje jezika.
sources.body=Colorín Colorado podstiče porodice da čitaju na jeziku koji govore kod kuće. Plan s dve verzije i priča o zvezdici naši su originalni primeri. Više na:
