meta.title=祖父母が孫に読み聞かせを録音する方法 | Sleep2Story
meta.description=祖父母が孫のために寝る前の物語を録るための実用ガイド。物語選びから、温かな声の録音、離れて暮らす家族への安全な共有まで。
meta.og_title=祖父母が孫に物語を録音する方法
meta.og_description=祖父母の読み聞かせや家族の思い出を、孫が何度も聴ける音声として残すための、やさしい手順。
meta.twitter_description=スマホと静かな部屋、自分らしいひと言で、祖父母が孫に温かな読み聞かせを録る方法。
schema.description=祖父母の聞き慣れた声で、孫のために寝る前の物語や家族の思い出を録音する実用ガイド。
hero.eyebrow=祖父母のためのガイド · 02
hero.line1=孫に物語を
hero.line2=録って贈ろう
hero.line3=いつもの声で
hero.dek=聞き慣れた「むかしむかし」は、離れた場所にも届きます。寝る時間を一緒に過ごせなくても、祖父母らしい温かく聞き取りやすい録音を作るためのガイドです。
byline.read_time=読了目安：9分
field.label=今夜のメモ
field.line1=孫のお気に入りの物語。
field.line2=あなたの本当の声。
field.line3=続けられる家族の習慣。
sticker.line1=まずは
sticker.line2=名前を呼んで
answer.title=孫がすでに好きな物語をひとつ選び、名前を呼んで、静かな部屋でスマホに録りましょう。自分らしい言い回しはそのまま残して大丈夫です。
answer.body=「朗読用の声」を作る必要はありません。愛称や笑い声、間の取り方といった小さなものが、その録音を家族だけのものにします。
toc.1=その子に合う録音を考える
toc.2=祖父母のための7ステップ
toc.3=残しておきたい話題
toc.4=録音を楽にする工夫
toc.6=家族からの質問
setup.title=後世のためより、まずは目の前の孫のために
setup.lead=聴く子のことから考えましょう。今好きなものや知っている名前、寝る前に親しんでいる本、家族の話、わらべ歌、子守歌があるか、保護者に聞いてみてください。
setup.body=初めてなら5〜15分ほどの録音を目標にするとよいでしょう。急がずにすむ時間を選び、スマホを安定した場所に置きます。始める前に、録音をどこに保存し、誰と共有するかを家族で話しておきましょう。
kit.1.title=親しみのある物語
kit.1.body=録音してよい本、自作のお話、または子どもにも分かる言葉で語る家族の思い出を選びます。
kit.2.title=その子への挨拶
kit.2.body=子どもの名前や愛称、温かい最初のひと言を手元のメモに書いておきます。
kit.3.title=静かな場所とスマホ
kit.3.body=スマホを充電し、通知を消して、音が響きにくい落ち着いた部屋で短く試し録りをします。
steps.title=「こんばんは」から、何度も聴ける物語までの7ステップ
step.1.title=今、孫が何を好きか聞く
step.1.body=子どものお気に入りはすぐ変わります。今の寝る前の習慣、集中できる長さ、好きな登場人物、保護者が避けたい言葉を確認しましょう。その子のために選んだ物語は、決まりきった朗読より身近に感じられます。
step.2.title=録音してよい文章を選ぶ
step.2.body=自作の物語、著作権の保護期間が満了した作品、録音の許可を得た素材を使いましょう。出版された本では、家族内での利用と一般公開で扱いが異なる場合があるため、適用される権利を確認してください。
step.3.title=あなただけの挨拶で始める
step.3.body=子どもの名前と、どこで録っているかを伝えます。「こんばんは、まいちゃん。おばあちゃんは窓辺の椅子から読んでいるよ」。具体的なひと言が、ただの音声ファイルを訪問のように感じさせます。
step.4.title=短く試し録りをする
step.4.body=30秒録ってみましょう。必要なら保護者に送って、声が十分に聞こえるか、相手の端末で開けるかを確認してもらいます。全部録ってから困ることを防げます。
step.5.title=会話するような速さで読む
step.5.body=孫が隣にいるつもりで。少しゆっくり読みながらも、いつもの話し方や方言、言い回し、やさしい冗談は残します。質問の後に間を置けば、録音には聞こえなくても小さな聴き手は答えられます。
step.6.title=家族の思い出をひとつ添える
step.6.body=物語に合うなら、初めて雪を見た日、子どものころ飼っていた動物、自分の祖父母の口癖などを短く入れてみましょう。長くしすぎず、知らない名前は説明します。
step.7.title=締めくくって、名前をつけて、保存する
step.7.body=会っているときと同じ「おやすみ」の言葉で終えます。物語、話し手、年が分かるファイル名をつけ、元の録音を残し、家族が管理できる場所にもう1部保存しましょう。
quote.text=完璧なら、きれいに聞こえるかもしれません。でも、おばあちゃんが次の言葉を思い出す間には、家族らしさが宿ります。
quote.attribution=Sleep2Story の家族の録音についての考え方
checklist.kicker=送る前に
checklist.title=家族らしい録音にする8つのポイント
checklist.1=子どもが好む名前を正しく呼んでいる
checklist.2=物語が年齢と今の生活習慣に合っている
checklist.3=声がどう使われるか、関係者が理解している
checklist.4=部屋が静かで、通知を切っている
checklist.5=30秒の試し録りを再生し、明瞭に聞こえる
checklist.6=家族の細部や聞き慣れた言葉がひとつ入っている
checklist.7=急に切れず、落ち着いて終わる
checklist.8=元のファイルに分かりやすい名前とバックアップがある
problems.title=気負いをなくしてから、機械の問題を解決
problem.1.question=録音した自分の声が好きになれません
problem.1.answer=録音した自分の声を聞き慣れないと感じる人は多いものです。アナウンサーのような声を目指すより、言葉が分かるか、孫にあなたの声だと伝わるかを確かめましょう。それで十分です。
problem.2.question=遠くに住んでいて、操作を手伝ってほしい
problem.2.answer=保護者と短い練習の通話をしてみましょう。ただし、音をきれいに残すにはスマホの録音アプリで直接録るのがおすすめです。先に試し録りを送り、本番で使うボタンを3つほどメモしておきます。
problem.3.question=物語を全部読むのは疲れます
problem.3.answer=1章ずつ、または5分ずつ録りましょう。楽に座り、近くに水を置き、声がつらくなる前に止めます。疲れ切って一度で録るより、短く落ち着いた録音をいくつか残すほうがよいでしょう。
problem.4.question=家族が複数の言語や方言を使います
problem.4.answer=愛情をいちばん自然に伝えられる言葉を使ってください。別の言語の知らない語を説明したり、おやすみの言葉を繰り返したり、短い別バージョンを作ったりできます。方言を無理に消す必要はありません。
problem.5.question=直接読むと子どもが途中で話しかけます
problem.5.answer=そのやり取りを録音に入れましょう。質問して3秒ほど待ち、「どう思った？」と続けます。再生するときにも、子どもは参加できます。
faq.1.question=祖父母の寝る前の録音は、何分くらいがよいですか？
faq.1.answer=まずは5〜15分、または慣れた本の1章から。小さい子は何度も聴ける短い話を好むかもしれません。年上の子には、長い家族の思い出を分けて録る方法もあります。
faq.2.question=電話やビデオ通話だけでも十分ですか？
faq.2.answer=直接話せる通話はすてきです。一方、スマホで直接録音した声は通常より明瞭で、寝る前に繰り返し聴けます。通話でおしゃべりし、別に録音も送る、という両方の方法を使えます。
faq.3.question=おばあちゃんやおじいちゃんは本を丸ごと読むべきですか？
faq.3.answer=無理なく読めて、録音する権利がある場合だけで十分です。短い自作の物語や家族の思い出、使用できるわらべ歌、許可を得た1章も、同じくらい大切なものになります。
faq.4.question=録音は誰が保管すべきですか？
faq.4.answer=録る前に決めておきましょう。元のファイルは家族が管理するアカウントや保存先に置き、共有は合意した相手に限ります。別の目的で声を使う前には、改めて許可を求めてください。
