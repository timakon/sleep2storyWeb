answer.title=Choisissez une histoire que votre petit-enfant aime déjà, ajoutez un bonjour personnel et enregistrez-la au téléphone dans une pièce calme.
answer.body=Inutile d’avoir une « voix de conteur ». Le surnom, le rire et vos petites pauses rendent l’enregistrement vraiment familial.
toc.1=Préparer un enregistrement personnel
toc.2=Sept étapes pour les grands-parents
toc.3=Les souvenirs à garder
toc.4=Enregistrer sans pression
toc.6=Questions des familles
setup.title=Pensez à un enfant, pas à la postérité
setup.lead=Commencez par la personne qui écoutera. Demandez aux parents ce que l’enfant aime aujourd’hui, les prénoms qu’il reconnaît et le livre, récit de famille, comptine ou berceuse qui accompagne déjà le coucher.
setup.body=Cinq à quinze minutes suffisent pour commencer. Choisissez un moment tranquille, posez le téléphone et convenez à l’avance du lieu de stockage et des personnes qui pourront recevoir l’enregistrement.
kit.1.title=Une histoire familière
kit.1.body=Prenez votre propre conte, un texte autorisé ou un vrai souvenir de famille raconté avec des mots d’enfant.
kit.2.title=Un bonjour personnel
kit.2.body=Notez le prénom, le petit nom et une phrase chaleureuse pour commencer.
kit.3.title=Un téléphone au calme
kit.3.body=Chargez-le, coupez les notifications et faites un court essai dans une pièce calme et meublée.
steps.title=Sept étapes du bonjour à l’histoire qu’on réécoute
step.1.title=Demandez ce qui lui plaît en ce moment
step.1.body=Les goûts changent vite. Vérifiez le rituel du soir, les personnages préférés, la durée d’attention et les mots que les parents souhaitent éviter.
step.2.title=Choisissez un texte que vous pouvez enregistrer
step.2.body=Utilisez votre histoire, une œuvre du domaine public ou un texte autorisé. Un enregistrement privé et la diffusion publique d’un livre ne relèvent pas forcément des mêmes règles.
step.3.title=Ouvrez avec une phrase qui n’appartient qu’à vous
step.3.body=Dites le prénom et où vous êtes : « Bonsoir, Maya. Papi te lit cette histoire depuis le fauteuil près de la fenêtre. » Un vrai détail transforme un fichier en visite.
step.4.title=Faites un petit essai avec les parents
step.4.body=Enregistrez 30 secondes et envoyez-les si vous avez besoin d’aide. Les parents vérifieront le volume et l’ouverture du fichier avant l’histoire complète.
step.5.title=Lisez comme dans une conversation
step.5.body=Imaginez l’enfant près de vous. Ralentissez un peu, mais gardez accent, expressions et humour. Après une question, laissez une pause pour que l’enfant puisse répondre.
step.6.title=Ajoutez un petit souvenir de famille
step.6.body=S’il s’accorde au récit, évoquez votre première neige, un animal de votre enfance ou une expression de vos propres grands-parents. Expliquez les prénoms inconnus et restez bref.
step.7.title=Dites bonne nuit, nommez et sauvegardez
step.7.body=Terminez par votre formule habituelle. Nommez le fichier avec le titre, la personne et l’année, conservez l’original et une seconde copie gérée par la famille.
quote.text=La perfection semble répétée. La proximité, c’est Mamie qui s’arrête un instant pour retrouver la ligne suivante.
quote.attribution=Principe d’enregistrement familial Sleep2Story
checklist.kicker=Avant l’envoi
checklist.title=Huit détails qui rendent l’enregistrement personnel
checklist.1=Le prénom préféré de l’enfant est bien prononcé
checklist.2=L’histoire convient à son âge et au rituel
checklist.3=Chacun sait comment la voix sera utilisée
checklist.4=Pièce calme et notifications coupées
checklist.5=L’essai de 30 secondes est clair
checklist.6=Un détail familial ou une expression est présent
checklist.7=La fin est douce, pas brusque
checklist.8=L’original est bien nommé et sauvegardé
problems.title=Enlevez la pression avant de régler la technique
problem.1.question=Je n’aime pas ma voix enregistrée
problem.1.answer=Presque tout le monde trouve sa voix enregistrée étrange au début. Ne cherchez pas une voix de radio : les mots doivent être clairs et votre petit-enfant doit vous reconnaître.
problem.2.question=Nous habitons loin et j’ai besoin d’aide
problem.2.answer=Prévoyez un bref appel d’essai, mais enregistrez localement avec le dictaphone pour un son plus net. Envoyez le test et notez les trois boutons utiles.
problem.3.question=Lire toute l’histoire me fatigue
problem.3.answer=Enregistrez un chapitre ou cinq minutes à la fois. Installez-vous bien, gardez de l’eau près de vous et arrêtez avant de fatiguer la voix. Plusieurs parties calmes conviennent parfaitement.
problem.4.question=Notre famille parle plusieurs langues ou dialectes
problem.4.answer=Parlez la langue dans laquelle l’affection vient naturellement. Expliquez un mot dans l’autre langue, répétez l’au revoir ou créez deux versions courtes sans effacer votre accent.
problem.5.question=L’enfant m’interrompt quand je lis en direct
problem.5.answer=Intégrez l’échange : posez une question, laissez trois secondes puis ajoutez « Et toi, qu’en penses-tu ? ». L’enfant peut ainsi participer à chaque écoute.
faq.1.question=Combien de temps doit durer l’histoire d’un grand-parent ?
faq.1.answer=Commencez par cinq à quinze minutes ou un chapitre familier. Les plus jeunes aiment les récits courts à répéter ; les plus grands, un souvenir de famille en plusieurs épisodes.
faq.2.question=Un appel vidéo ne suffit-il pas ?
faq.2.answer=Le direct est précieux pour discuter, mais un fichier enregistré sur le téléphone est souvent plus clair et rejoint facilement le rituel du soir. Les deux sont complémentaires.
faq.3.question=Faut-il lire tout le livre ?
faq.3.answer=Seulement si c’est confortable et si vous avez le droit d’enregistrer le texte. Un conte original, un souvenir, une comptine autorisée ou un chapitre peuvent avoir autant de valeur.
faq.4.question=Qui doit conserver l’enregistrement ?
faq.4.answer=Décidez-le avant. Gardez l’original dans un espace familial, partagez-le uniquement avec les personnes prévues et redemandez l’accord pour tout nouvel usage de la voix.
