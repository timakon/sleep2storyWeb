checklist.1=Der bevorzugte Name des Kindes wird richtig ausgesprochen
checklist.2=Geschichte und Länge passen zum Alter
checklist.3=Alle wissen, wie die Stimme verwendet wird
checklist.4=Zimmer ruhig und Benachrichtigungen aus
checklist.5=Der 30-Sekunden-Test klingt klar
checklist.6=Ein Familiendetail oder vertrauter Spruch ist dabei
checklist.7=Das Ende klingt ruhig, nicht abgebrochen
