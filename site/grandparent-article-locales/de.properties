problems.title=Erst den Druck nehmen, dann die Technik lösen
problem.1.question=Meine aufgenommene Stimme gefällt mir nicht
problem.1.answer=Die eigene Aufnahme klingt fast allen zunächst fremd. Sie müssen nicht wie im Radio sprechen. Wichtig ist, dass die Wörter klar sind und Ihr Enkelkind Sie erkennt.
problem.2.question=Wir wohnen weit auseinander und ich brauche Hilfe
problem.2.answer=Verabreden Sie einen kurzen Probeanruf, nehmen Sie die Geschichte für besseren Klang aber lokal mit der Diktier-App auf. Schicken Sie zuerst den Test und notieren Sie die drei nötigen Tasten.
problem.3.question=Eine ganze Geschichte ist zu anstrengend
problem.3.answer=Nehmen Sie jeweils ein Kapitel oder fünf Minuten auf. Sitzen Sie bequem, stellen Sie Wasser bereit und hören Sie auf, bevor die Stimme ermüdet. Mehrere entspannte Teile sind völlig in Ordnung.
problem.4.question=Unsere Familie spricht mehrere Sprachen oder Dialekte
problem.4.answer=Sprechen Sie in der Sprache, in der Zuneigung natürlich klingt. Erklären Sie einzelne Wörter, wiederholen Sie den Abschiedsgruß in einer zweiten Sprache oder nehmen Sie zwei kurze Fassungen auf.
problem.5.question=Das Kind unterbricht beim Vorlesen ständig
problem.5.answer=Bauen Sie das Mitmachen ein: Stellen Sie eine Frage, lassen Sie drei Sekunden Pause und fahren Sie mit „Was meinst du?“ fort. So kann das Kind auch beim Abspielen antworten.
faq.1.question=Wie lang sollte eine Aufnahme von Oma oder Opa sein?
faq.1.answer=Beginnen Sie mit fünf bis fünfzehn Minuten oder einem vertrauten Kapitel. Jüngere Kinder mögen kurze Wiederholungen, ältere vielleicht eine Familienerinnerung in mehreren Teilen.
faq.2.question=Reicht nicht auch ein Videoanruf?
faq.2.answer=Live-Anrufe sind wunderbar für Gespräche. Eine lokale Tonaufnahme klingt meist klarer und lässt sich jeden Abend wiederholen. Beides lässt sich gut verbinden.
faq.3.question=Muss das ganze Buch vorgelesen werden?
faq.3.answer=Nur wenn es angenehm ist und Sie den Text aufnehmen dürfen. Eine kurze eigene Geschichte, eine Familienerinnerung, ein erlaubter Reim oder ein einzelnes Kapitel kann genauso wertvoll sein.
faq.4.question=Wer sollte die Aufnahme aufbewahren?
faq.4.answer=Klären Sie das vorher. Speichern Sie das Original in einem familienverwalteten Konto, teilen Sie es nur mit vereinbarten Personen und holen Sie für neue Verwendungszwecke erneut Zustimmung ein.
