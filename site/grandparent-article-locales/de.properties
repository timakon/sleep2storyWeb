answer.title=Wählen Sie eine Geschichte, die Ihr Enkelkind bereits mag, sprechen Sie einen persönlichen Gruß und nehmen Sie in einem ruhigen Zimmer mit dem Handy auf.
answer.body=Eine perfekte Vorlesestimme ist nicht nötig. Kosename, Lachen und die ganz eigenen Pausen machen die Aufnahme zu einem Stück Familie.
toc.1=Eine persönliche Aufnahme planen
toc.2=Sieben Schritte für Großeltern
toc.3=Erinnerungen, die bleiben
toc.4=Aufnehmen ohne Stress
toc.6=Fragen aus der Familie
setup.title=Für ein Kind planen, nicht für die Ewigkeit
setup.lead=Denken Sie zuerst an den kleinen Menschen, der zuhört. Fragen Sie die Eltern, was das Kind gerade liebt, welche Namen es kennt und welches Buch, Familienerlebnis, Lied oder welcher Reim schon zum Abend gehört.
setup.body=Fünf bis fünfzehn Minuten sind ein gutes erstes Ziel. Wählen Sie einen ruhigen Moment, legen Sie das Handy stabil hin und klären Sie vorher, wo die Aufnahme gespeichert und mit wem sie geteilt wird.
kit.1.title=Eine vertraute Geschichte
kit.1.body=Nehmen Sie einen eigenen Text, ein erlaubtes Werk oder eine kindgerecht erzählte Familienerinnerung.
kit.2.title=Ein persönlicher Gruß
kit.2.body=Notieren Sie Name, Kosename und einen warmen ersten Satz auf einem Zettel.
kit.3.title=Handy und ruhiges Zimmer
kit.3.body=Handy laden, Benachrichtigungen ausschalten und in einem ruhig eingerichteten Zimmer kurz testen.
steps.title=Sieben Schritte vom Hallo bis zur Lieblingsaufnahme
step.1.title=Fragen Sie nach den aktuellen Lieblingsdingen
step.1.body=Vorlieben ändern sich schnell. Fragen Sie nach Abendroutine, Lieblingsfiguren, Aufmerksamkeitsspanne und Wörtern, die Eltern vermeiden möchten. Eine Geschichte für dieses Kind wirkt näher als ein allgemeiner Vortrag.
step.2.title=Wählen Sie einen Text, den Sie aufnehmen dürfen
step.2.body=Nutzen Sie eine eigene Geschichte, ein gemeinfreies Werk oder Material mit Erlaubnis. Eine private Familienaufnahme und eine öffentliche Veröffentlichung können rechtlich unterschiedlich behandelt werden.
step.3.title=Beginnen Sie mit einem Satz, den nur Sie sagen würden
step.3.body=Nennen Sie das Kind und den Ort: „Guten Abend, Mila. Opa liest heute aus dem Sessel am Fenster.“ Ein echtes Detail macht aus einer Datei einen kleinen Besuch.
step.4.title=Machen Sie gemeinsam einen kurzen Test
step.4.body=Nehmen Sie 30 Sekunden auf und schicken Sie den Test bei Bedarf an die Eltern. So lässt sich prüfen, ob die Stimme laut genug ist und die Datei funktioniert, bevor die ganze Geschichte entsteht.
step.5.title=Lesen Sie wie in einem Gespräch
step.5.body=Stellen Sie sich das Kind neben sich vor. Sprechen Sie etwas langsamer, behalten Sie aber Dialekt, Lieblingsausdrücke und Humor. Lassen Sie nach Fragen eine Pause, damit das Kind antworten kann.
step.6.title=Fügen Sie eine kleine Familienerinnerung ein
step.6.body=Wenn es passt, erzählen Sie kurz vom ersten Schnee, einem Haustier aus Ihrer Kindheit oder einem Spruch Ihrer Großeltern. Erklären Sie unbekannte Namen und bleiben Sie knapp.
step.7.title=Verabschieden, benennen und sichern
step.7.body=Enden Sie mit dem gewohnten Gute-Nacht-Satz. Benennen Sie die Datei mit Geschichte, Sprecher und Jahr, bewahren Sie das Original auf und legen Sie eine zweite Kopie in einem Familienkonto ab.
quote.text=Perfektion klingt glatt. Nähe klingt wie Oma, die kurz nach der nächsten Zeile sucht.
quote.attribution=Sleep2Story-Grundsatz für Familienaufnahmen
