setup.title=Plan for one child, not for posterity
setup.lead=Begin with the person who will listen. Ask a parent what the child currently loves, which names they recognise, and whether there is a familiar book, family tale, rhyme, or lullaby that already belongs to bedtime.
setup.body=A five- to fifteen-minute recording is a useful first goal. Choose a moment when you are not rushed, put the phone on a stable surface, and tell the family how the recording will be stored and shared before you begin.
kit.1.title=A familiar story
kit.1.body=Pick a book you may record, an original tale, or a true family memory told in child-friendly words.
kit.2.title=A personal hello
kit.2.body=Write the child’s name, nickname, and one warm opening line on a note beside you.
kit.3.title=A quiet phone setup
kit.3.body=Charge the phone, silence notifications, and make a short test in a soft, calm room.
steps.title=Seven steps from “hello” to a story they can replay
step.1.title=Ask what your grandchild enjoys now
step.1.body=Children’s favourites change quickly. Check the current bedtime routine, attention span, favourite characters, and any words a parent would rather you avoid. A story chosen for this child will feel closer than a generic performance.
step.2.title=Choose a text you may record
step.2.body=Use your own story, a public-domain work, or material you have permission to record. If you read a published book, private family use and public sharing can be treated differently, so confirm the rights that apply.
step.3.title=Open with a message only you would say
step.3.body=Say the child’s name and where you are recording: “Good evening, Maya. Grandpa is reading from the chair by the window.” One concrete detail turns an audio file into a visit.
step.4.title=Make a short test together
step.4.body=Record thirty seconds and send it to the parent if you need help. They can confirm that the voice is loud enough and the file opens on their device before you spend time on the full story.
step.5.title=Read at conversation pace
step.5.body=Imagine the child beside you. Slow down a little, but keep your own accent, expressions, and gentle humour. Leave a pause after questions so a young listener can answer, even when the recording cannot hear them.
step.6.title=Add one small family memory
step.6.body=If it fits the story, include a short memory: the first time you saw snow, the pet you had as a child, or a saying from your own grandparents. Keep it brief and explain unfamiliar names.
step.7.title=Close, name, and back up the file
step.7.body=End with the same goodnight phrase you use in person. Name the file with the story, speaker, and year, keep the original recording, and store a second copy somewhere the family controls.
quote.text=Perfection sounds polished. Belonging sounds like Grandma pausing to remember the next line.
