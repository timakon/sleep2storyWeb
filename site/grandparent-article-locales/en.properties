checklist.kicker=Before you send it
checklist.title=Eight details that make a recording feel personal
checklist.1=The child’s preferred name is spoken correctly
checklist.2=The story suits their age and current routine
checklist.3=Everyone understands how the voice will be used
checklist.4=The room is quiet and notifications are off
checklist.5=A 30-second test sounds clear on playback
checklist.6=One family detail or familiar phrase is included
checklist.7=The ending is calm rather than abrupt
checklist.8=The original file has a clear name and backup
problems.title=Remove the pressure, then solve the technology
problem.1.question=I do not like the sound of my recorded voice
problem.1.answer=Most people find their recorded voice unfamiliar. Do not chase a broadcaster’s sound; ask whether the words are clear and whether your grandchild will recognise you. That is the useful standard.
problem.2.question=We live far apart and I need technical help
problem.2.answer=Arrange a short practice call with the parent, but record locally in the phone’s voice recorder for cleaner sound. Send the test first and write down the same three buttons you will use for the full take.
problem.3.question=Reading a whole story is tiring
problem.3.answer=Record one chapter or five minutes at a time. Sit comfortably, keep water nearby, and stop before your voice feels strained. Several short, relaxed recordings are better than one exhausting session.
problem.4.question=Our family uses more than one language or dialect
problem.4.answer=Use the language in which affection feels most natural. You can explain an unfamiliar word in the other language, repeat a closing phrase, or make separate short versions without flattening your accent.
problem.5.question=The child interrupts when we read live
problem.5.answer=Build the interaction into the recording. Ask a question, pause for three seconds, then continue with “What did you think?” The child can still take part during playback.
faq.1.question=How long should a grandparent’s bedtime recording be?
faq.1.answer=Start with five to fifteen minutes, or one familiar chapter. Younger children may prefer a very short story they can replay; an older child may enjoy a longer family memory split into parts.
faq.2.question=Is a phone call or video call enough?
faq.2.answer=Live calls are lovely for conversation, but a local voice recording is usually clearer and can become part of the bedtime routine. You can do both: talk live, then share a separate recording for replay.
faq.3.question=Should Grandma or Grandpa read the whole book?
faq.3.answer=Only if it is comfortable and you have the right to record the text. A short original story, a family memory, a nursery rhyme you may use, or one permitted chapter can be just as meaningful.
faq.4.question=Who should keep the recording?
faq.4.answer=Agree this before recording. Keep the original in a family-controlled account or drive, limit sharing to the people named in the agreement, and ask again before using the voice for a new purpose.
