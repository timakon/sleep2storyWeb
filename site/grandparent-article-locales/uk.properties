answer.title=Оберіть казку, яку онук чи онука вже любить, додайте особисте привітання і запишіть читання телефоном у тихій кімнаті.
answer.body=«Дикторський» голос не потрібен. Домашнє ім’я, усмішка і ваші звичні паузи роблять запис по-справжньому родинним.
toc.1=Як спланувати особистий запис
toc.2=Сім кроків для бабусі й дідуся
toc.3=Що варто зберегти в голосі
toc.4=Як полегшити запис
toc.6=Запитання родини
setup.title=Записуйте для однієї дитини, а не «для вічності»
setup.lead=Почніть із того, хто слухатиме. Запитайте батьків, що дитина любить зараз, які імена впізнає і яка книжка, родинна історія, забавлянка чи колискова вже стала частиною засинання.
setup.body=Для першого запису достатньо п’яти–п’ятнадцяти хвилин. Оберіть спокійний час, покладіть телефон стійко й заздалегідь домовтеся, де зберігатиметься файл та кому його можна надсилати.
kit.1.title=Знайома історія
kit.1.body=Візьміть власну казку, дозволений текст або справжній родинний спогад, зрозумілий дитині.
kit.2.title=Особисте привітання
kit.2.body=Запишіть поруч ім’я, домашнє звертання й одну теплу фразу для початку.
kit.3.title=Телефон і тиха кімната
kit.3.body=Зарядіть телефон, вимкніть сповіщення та зробіть коротку пробу в тихій затишній кімнаті.
steps.title=Сім кроків від «привіт» до казки, яку вмикатимуть знову
step.1.title=Дізнайтеся, що дитина любить саме зараз
step.1.body=Дитячі вподобання швидко змінюються. Уточніть вечірній розпорядок, улюблених героїв, потрібну тривалість і слова, яких батьки просять уникати.
step.2.title=Оберіть текст, який можна записувати
step.2.body=Використовуйте власну казку, твір суспільного надбання або матеріал із дозволом. Приватний родинний запис і публічне поширення книжки можуть мати різні правила.
step.3.title=Почніть із фрази, яку скажете лише ви
step.3.body=Назвіть дитину й місце: «Добрий вечір, Марійко. Дідусь читає тобі з крісла біля вікна». Одна справжня деталь перетворює файл на маленький візит.
step.4.title=Зробіть коротку пробу разом із батьками
step.4.body=Запишіть 30 секунд і за потреби надішліть батькам. Вони перевірять гучність та чи відкривається файл, перш ніж ви читатимете всю казку.
step.5.title=Читайте як під час розмови
step.5.body=Уявіть дитину поруч. Трохи сповільніться, але збережіть свою говірку, улюблені вислови й лагідний гумор. Після запитання залиште паузу для відповіді.
step.6.title=Додайте один родинний спогад
step.6.body=Якщо він пасує сюжету, згадайте перший сніг, улюбленця з дитинства чи приказку своїх дідуся й бабусі. Пояснюйте незнайомі імена й не затягуйте.
step.7.title=Попрощайтеся, назвіть файл і збережіть копію
step.7.body=Завершіть звичним побажанням доброї ночі. У назві вкажіть казку, оповідача й рік, збережіть оригінал і другу копію в родинному сховищі.
quote.text=Досконалість звучить відрепетирувано. Близькість — як бабуся, що на мить пригадує наступний рядок.
quote.attribution=Принцип родинного запису Sleep2Story
checklist.kicker=Перед надсиланням
checklist.title=Вісім деталей, що роблять запис особистим
checklist.1=Ім’я дитини вимовлене так, як вона любить
checklist.2=Казка відповідає віку й вечірньому ритуалу
checklist.3=Усі розуміють, як використовуватиметься голос
checklist.4=У кімнаті тихо, сповіщення вимкнені
checklist.5=Пробні 30 секунд звучать чисто
checklist.6=Є родинна деталь або знайома приказка
checklist.7=Фінал спокійний, а не обірваний
checklist.8=Оригінал зрозуміло названий і має копію
problems.title=Спочатку приберіть хвилювання, потім вирішуйте технічне
problem.1.question=Мені не подобається мій голос у записі
problem.1.answer=Записаний голос майже всім спершу здається чужим. Не намагайтеся звучати як диктор: важливо, щоб слова були чіткими й онуки вас упізнали.
problem.2.question=Ми далеко одне від одного, а мені потрібна допомога
problem.2.answer=Домовтеся про короткий пробний дзвінок, але казку запишіть локально в диктофоні. Спершу надішліть тест і запишіть на папері три потрібні кнопки.
problem.3.question=Важко прочитати всю казку за один раз
problem.3.answer=Записуйте по розділу або п’ять хвилин. Сядьте зручно, поставте воду й зупиніться до втоми голосу. Кілька спокійних частин кращі за один виснажливий дубль.
problem.4.question=У родині говорять кількома мовами чи діалектами
problem.4.answer=Говоріть мовою, якою ніжність звучить природно. Незнайоме слово можна пояснити іншою мовою, повторити прощання або зробити дві короткі версії, не приховуючи свого акценту.
problem.5.question=Під час живого читання дитина перебиває
problem.5.answer=Залиште місце для відповіді: поставте запитання, помовчіть три секунди й продовжте словами «А ти як думаєш?». Дитина зможе брати участь і під час відтворення.
faq.1.question=Якої тривалості має бути казка від бабусі чи дідуся?
faq.1.answer=Почніть із п’яти–п’ятнадцяти хвилин або знайомого розділу. Малюки часто люблять короткі повтори, а старші діти — родинну історію в кількох частинах.
faq.2.question=Хіба відеодзвінка недостатньо?
faq.2.answer=Живий дзвінок чудовий для спілкування, але локальний аудіозапис зазвичай чистіший і легко входить у вечірній ритуал. Можна робити і те, й інше.
faq.3.question=Чи треба читати всю книжку?
faq.3.answer=Лише якщо вам зручно й текст дозволено записувати. Коротка авторська казка, родинний спогад, дозволена забавлянка або один розділ не менш цінні.
faq.4.question=Хто має зберігати запис?
faq.4.answer=Домовтеся заздалегідь. Тримайте оригінал у родинному обліковому записі, діліться лише з погодженими людьми й знову запитуйте згоду для нового використання голосу.
