problems.title=Сначала уберите волнение, потом разбирайтесь с техникой
problem.1.question=Мне не нравится мой голос в записи
problem.1.answer=Свой записанный голос почти всем кажется непривычным. Не стремитесь звучать как диктор: проверьте, разборчивы ли слова и узнает ли вас внук. Этого достаточно.
problem.2.question=Мы живём далеко, и мне нужна помощь с телефоном
problem.2.answer=Договоритесь с родителями о коротком пробном звонке, но саму сказку запишите локально в диктофоне — так звук будет чище. Сначала отправьте тест и запишите три нужные кнопки на бумаге.
problem.3.question=Мне трудно прочитать всю сказку за один раз
problem.3.answer=Записывайте по одной главе или по пять минут. Сядьте удобно, поставьте рядом воду и остановитесь до того, как голос устанет. Несколько спокойных частей лучше одного тяжёлого дубля.
problem.4.question=В семье говорят на нескольких языках или диалектах
problem.4.answer=Говорите на языке, на котором нежность звучит естественнее. Незнакомое слово можно объяснить на втором языке, повторить прощальную фразу или записать две короткие версии, сохранив свой акцент.
problem.5.question=Во время живого чтения ребёнок постоянно перебивает
problem.5.answer=Оставьте место для ответа внутри записи. Задайте вопрос, помолчите три секунды и продолжите словами «Ну как ты думаешь?». При прослушивании ребёнок всё равно сможет участвовать.
faq.1.question=Какой длины должна быть сказка от бабушки или дедушки?
faq.1.answer=Начните с пяти–пятнадцати минут или одной знакомой главы. Малышам часто нравится короткая сказка, которую можно повторять, а детям постарше — семейная история из нескольких частей.
faq.2.question=Разве видеозвонка недостаточно?
faq.2.answer=Живой звонок хорош для общения, а локальная аудиозапись обычно звучит чище и легко становится частью укладывания. Можно совместить: поговорить по видео и отдельно отправить сказку для повторного прослушивания.
faq.3.question=Нужно ли читать книгу целиком?
faq.3.answer=Только если вам удобно и текст разрешено записывать. Короткая авторская сказка, семейное воспоминание, разрешённая потешка или одна глава могут быть не менее ценными.
faq.4.question=У кого должна храниться запись?
faq.4.answer=Договоритесь об этом заранее. Храните оригинал в семейном аккаунте или диске, ограничьте круг получателей и снова спросите согласие, прежде чем использовать голос для другой цели.
