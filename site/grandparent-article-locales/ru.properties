answer.title=Выберите сказку, которую внук уже любит, добавьте личное приветствие, запишите чтение на телефон в тихой комнате и не убирайте живые интонации.
answer.body=Специальный «голос диктора» не нужен. Домашнее прозвище, улыбка и привычные паузы делают запись по-настоящему семейной.
