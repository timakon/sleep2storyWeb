setup.title=Записывайте для одного ребёнка, а не «на века»
setup.lead=Сначала подумайте о том, кто будет слушать. Спросите родителей, что ребёнок любит сейчас, какие имена узнаёт и какая книга, семейная история, потешка или колыбельная уже стала частью укладывания.
setup.body=Для первой попытки достаточно пяти–пятнадцати минут. Выберите спокойное время, поставьте телефон устойчиво и заранее договоритесь с семьёй, где запись будет храниться и кому её можно отправлять.
kit.1.title=Знакомая история
kit.1.body=Возьмите свою сказку, разрешённый для записи текст или настоящий семейный случай, понятный ребёнку.
kit.2.title=Личное приветствие
kit.2.body=Запишите рядом имя, домашнее прозвище и одну тёплую фразу, с которой хотите начать.
kit.3.title=Телефон и тихая комната
kit.3.body=Зарядите телефон, отключите уведомления и сделайте короткую пробу в комнате с мягкой мебелью.
steps.title=Семь шагов от «привет» до сказки, которую можно включать снова
step.1.title=Узнайте, что внук любит именно сейчас
step.1.body=Детские интересы быстро меняются. Уточните вечерний распорядок, любимых героев, подходящую длину и слова, которых родители просят избегать. История для конкретного ребёнка всегда теплее безличного выступления.
step.2.title=Выберите текст, который можно записывать
step.2.body=Используйте собственную сказку, произведение из общественного достояния или материал, на который у вас есть разрешение. Семейная запись для себя и публичная публикация книги могут регулироваться по-разному.
step.3.title=Начните с фразы, которую скажете только вы
step.3.body=Назовите ребёнка и место записи: «Добрый вечер, Маша. Дедушка читает тебе из кресла у окна». Одна настоящая деталь превращает аудиофайл в маленькую встречу.
step.4.title=Сделайте короткую пробу вместе с родителями
step.4.body=Запишите тридцать секунд и отправьте родителю, если нужна помощь. Он проверит громкость и откроется ли файл на его телефоне, прежде чем вы потратите время на всю сказку.
step.5.title=Читайте как в разговоре
step.5.body=Представьте ребёнка рядом. Чуть замедлитесь, но сохраните свой говор, любимые выражения и мягкий юмор. После вопроса оставьте паузу: маленький слушатель сможет ответить даже в записи.
step.6.title=Добавьте одно семейное воспоминание
step.6.body=Если оно подходит к сюжету, вспомните первый снег, домашнего питомца из детства или присказку своих бабушки и дедушки. Не затягивайте и объясняйте незнакомые имена.
step.7.title=Попрощайтесь, назовите файл и сохраните копию
step.7.body=Закончите привычным пожеланием спокойной ночи. Укажите в названии сказку, рассказчика и год, сохраните оригинал и сделайте вторую копию там, где семья управляет доступом.
quote.text=Идеальность звучит отрепетированно. Близость — как бабушка, которая на секунду забыла следующую строчку.
quote.attribution=Принцип семейной записи Sleep2Story
