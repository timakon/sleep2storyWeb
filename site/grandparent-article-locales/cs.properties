answer.title=Vyberte pohádku, kterou vnouče už má rádo, přidejte osobní pozdrav a nahrajte ji telefonem v klidném pokoji.
answer.body=Nepotřebujete hlas profesionálního vypravěče. Domácí oslovení, smích a vaše pauzy dělají nahrávku skutečně rodinnou.
toc.1=Jak naplánovat osobní nahrávku
toc.2=Sedm kroků pro prarodiče
toc.3=Vzpomínky, které stojí za uchování
toc.4=Nahrávání bez tlaku
toc.6=Otázky rodin
setup.title=Myslete na jedno dítě, ne na věčnost
setup.lead=Začněte u posluchače. Zeptejte se rodičů, co dítě právě baví, která jména zná a jaká kniha, rodinný příběh, říkanka nebo ukolébavka už patří k večeru.
setup.body=Pět až patnáct minut je dobrý první cíl. Vyberte klidnou chvíli, položte telefon stabilně a předem se domluvte, kde se soubor uloží a kdo ho může dostat.
kit.1.title=Známý příběh
kit.1.body=Vyberte vlastní pohádku, povolený text nebo skutečnou rodinnou vzpomínku vyprávěnou dětskými slovy.
kit.2.title=Osobní pozdrav
kit.2.body=Napište si jméno, domácí oslovení a jednu hřejivou úvodní větu.
kit.3.title=Telefon a klidný pokoj
kit.3.body=Nabijte telefon, vypněte oznámení a udělejte krátkou zkoušku v klidně zařízeném pokoji.
steps.title=Sedm kroků od pozdravu k pohádce pro další večery
step.1.title=Zjistěte, co má vnouče rádo právě teď
step.1.body=Dětské záliby se rychle mění. Ověřte večerní rutinu, oblíbené postavy, délku pozornosti a slova, kterým se rodiče chtějí vyhnout.
step.2.title=Vyberte text, který smíte nahrát
step.2.body=Použijte vlastní příběh, volné dílo nebo materiál se svolením. Soukromá rodinná nahrávka a veřejné sdílení knihy mohou podléhat jiným pravidlům.
step.3.title=Začněte větou, kterou říkáte jen vy
step.3.body=Řekněte jméno a místo: „Dobrý večer, Májo. Dědeček dnes čte z křesla u okna.“ Jeden skutečný detail promění soubor v malou návštěvu.
step.4.title=Udělejte krátkou zkoušku s rodiči
step.4.body=Nahrajte 30 sekund a pošlete je, pokud potřebujete pomoc. Rodiče ověří hlasitost i otevření souboru před celou pohádkou.
step.5.title=Čtěte jako při rozhovoru
step.5.body=Představte si dítě vedle sebe. Trochu zpomalte, ale zachovejte přízvuk, oblíbená rčení a humor. Po otázce nechte pauzu pro odpověď.
step.6.title=Přidejte jednu malou rodinnou vzpomínku
step.6.body=Pokud se hodí, vzpomeňte na první sníh, zvíře z dětství nebo rčení vlastních prarodičů. Vysvětlete neznámá jména a buďte struční.
step.7.title=Rozlučte se, pojmenujte soubor a zálohujte
step.7.body=Zakončete obvyklým přáním na dobrou noc. Do názvu dejte pohádku, vypravěče a rok, zachovejte originál a druhou kopii pod správou rodiny.
quote.text=Dokonalost zní nacvičeně. Blízkost zní jako babička, která na chvíli hledá další řádek.
quote.attribution=Zásada rodinných nahrávek Sleep2Story
checklist.kicker=Před odesláním
checklist.title=Osm detailů, díky nimž je nahrávka osobní
checklist.1=Oblíbená podoba jména zní správně
checklist.2=Pohádka odpovídá věku a večernímu režimu
checklist.3=Všichni vědí, jak bude hlas použit
checklist.4=Pokoj je tichý a oznámení vypnutá
checklist.5=Zkouška 30 sekund zní čistě
checklist.6=Je přidán rodinný detail nebo známé rčení
checklist.7=Konec je klidný, ne useknutý
checklist.8=Originál má jasný název a zálohu
problems.title=Nejdřív odstraňte tlak, potom řešte techniku
problem.1.question=Nelíbí se mi můj hlas na nahrávce
problem.1.answer=Většině lidí zní vlastní nahraný hlas zpočátku cize. Nesnažte se znít jako hlasatel; důležitá jsou srozumitelná slova a poznání.
problem.2.question=Bydlíme daleko a potřebuji technickou pomoc
problem.2.answer=Domluvte krátký zkušební hovor, pohádku však nahrajte lokálně v diktafonu. Nejprve pošlete test a napište si tři potřebná tlačítka.
problem.3.question=Čtení celé pohádky je únavné
problem.3.answer=Nahrávejte jednu kapitolu nebo pět minut. Posaďte se pohodlně, mějte vodu a skončete před únavou hlasu. Několik klidných částí funguje skvěle.
problem.4.question=Rodina používá více jazyků nebo nářečí
problem.4.answer=Mluvte jazykem, v němž náklonnost zní přirozeně. Vysvětlete slovo v druhém jazyce, zopakujte rozloučení nebo udělejte dvě krátké verze bez skrývání přízvuku.
problem.5.question=Dítě při živém čtení stále skáče do řeči
problem.5.answer=Zapojte rozhovor do nahrávky. Položte otázku, počkejte tři sekundy a řekněte „Co myslíš ty?“. Dítě se tak zapojí i při přehrávání.
faq.1.question=Jak dlouhá má být pohádka od babičky nebo dědečka?
faq.1.answer=Začněte pěti až patnácti minutami nebo známou kapitolou. Malé děti mají rády krátké opakování, starší rodinnou vzpomínku na pokračování.
faq.2.question=Nestačí videohovor?
faq.2.answer=Živý hovor je skvělý pro rozhovor, ale místní zvuková nahrávka bývá čistší a lze ji pouštět každý večer. Obě možnosti se doplňují.
faq.3.question=Je nutné přečíst celou knihu?
faq.3.answer=Jen pokud je to příjemné a smíte text nahrát. Krátká vlastní pohádka, rodinná vzpomínka, povolená říkanka nebo kapitola mohou být stejně cenné.
faq.4.question=Kdo má nahrávku uchovávat?
faq.4.answer=Dohodněte se předem. Originál uložte v rodinném účtu, sdílejte jen s dohodnutými lidmi a pro nové použití hlasu si znovu vyžádejte souhlas.
