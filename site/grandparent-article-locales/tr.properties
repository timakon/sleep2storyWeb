setup.title=Gelecek kuşakları değil, bir çocuğu düşünün
setup.lead=Dinleyecek kişiden başlayın. Anne babaya çocuğun şu anda neyi sevdiğini, hangi isimleri bildiğini ve hangi kitap, aile öyküsü, tekerleme ya da ninninin gece düzenine ait olduğunu sorun.
setup.body=İlk kayıt için beş ila on beş dakika yeterlidir. Acele etmeyeceğiniz bir zaman seçin, telefonu sabitleyin ve dosyanın nerede saklanıp kimlerle paylaşılacağını önceden konuşun.
kit.1.title=Tanıdık bir hikâye
kit.1.body=Kendi masalınızı, izinli bir metni veya çocuk dilinde anlatılmış gerçek bir aile anısını seçin.
kit.2.title=Kişisel bir selam
kit.2.body=İsmi, sevdiği hitabı ve sıcak bir başlangıç cümlesini not edin.
kit.3.title=Telefon ve sessiz oda
kit.3.body=Telefonu şarj edin, bildirimleri kapatın ve sessiz, eşyalı bir odada kısa test yapın.
steps.title=“Merhaba”dan tekrar dinlenecek masala yedi adım
step.1.title=Torununuzun bugün neyi sevdiğini öğrenin
step.1.body=Çocukların ilgisi hızla değişir. Gece düzenini, sevdiği karakterleri, dikkat süresini ve anne babanın kaçınmak istediği kelimeleri sorun.
step.2.title=Kaydetmeye hakkınız olan bir metin seçin
step.2.body=Kendi hikâyenizi, kamu malı bir eseri veya izinli içeriği kullanın. Özel aile kaydı ile bir kitabı herkese açık paylaşmanın kuralları farklı olabilir.
step.3.title=Yalnızca sizin söyleyeceğiniz bir cümleyle açın
step.3.body=İsmi ve bulunduğunuz yeri söyleyin: “İyi geceler Maya. Deden pencere yanındaki koltuktan okuyor.” Gerçek bir ayrıntı dosyayı küçük bir ziyarete çevirir.
step.4.title=Anne babayla kısa bir test yapın
step.4.body=30 saniye kaydedip yardıma ihtiyacınız varsa gönderin. Tüm masalı kaydetmeden önce ses düzeyini ve dosyanın açıldığını kontrol edebilirler.
step.5.title=Sohbet eder gibi okuyun
step.5.body=Çocuğu yanınızda hayal edin. Biraz yavaşlayın ama şivenizi, ifadelerinizi ve mizahınızı koruyun. Sorudan sonra cevap verebilmesi için durun.
step.6.title=Küçük bir aile anısı ekleyin
step.6.body=Masala uyarsa ilk karınızı, çocukluk evcil hayvanınızı veya kendi büyüklerinizin sözünü kısaca anlatın. Bilinmeyen isimleri açıklayın.
step.7.title=İyi geceler deyin, adlandırın ve yedekleyin
step.7.body=Her zamanki iyi geceler sözünüzle bitirin. Dosyaya masal, anlatıcı ve yılı yazın; aslı ile aile kontrolündeki ikinci kopyayı saklayın.
quote.text=Mükemmellik prova edilmiş gibi gelir. Yakınlık, bir sonraki satırı hatırlamak için duran büyükanne gibidir.
quote.attribution=Sleep2Story aile kaydı ilkesi
