checklist.2=Masal yaşına ve düzenine uygun
checklist.3=Herkes sesin nasıl kullanılacağını biliyor
checklist.4=Oda sessiz, bildirimler kapalı
checklist.5=30 saniyelik test net duyuluyor
checklist.6=Bir aile ayrıntısı veya tanıdık söz var
checklist.7=Son sakin, ani değil
checklist.8=Asıl dosyanın açık adı ve yedeği var
problems.title=Önce baskıyı kaldırın, sonra teknolojiyi çözün
problem.1.question=Kayıttaki sesimi sevmiyorum
problem.1.answer=Çoğu insan kendi kayıtlı sesini önce yabancı bulur. Spiker gibi olmaya çalışmayın; kelimelerin net olması ve torununuzun sizi tanıması yeterlidir.
problem.2.question=Uzakta yaşıyoruz ve teknik yardıma ihtiyacım var
problem.2.answer=Kısa bir deneme görüşmesi yapın ama daha temiz ses için masalı telefonun ses kaydedicisinde yerel kaydedin. Testi gönderin ve gereken üç düğmeyi yazın.
problem.3.question=Tüm masalı okumak yorucu
problem.3.answer=Bir bölüm ya da beş dakika kaydedin. Rahat oturun, su bulundurun ve sesiniz yorulmadan durun. Birkaç sakin parça gayet iyi çalışır.
problem.4.question=Ailemiz birden fazla dil veya lehçe kullanıyor
problem.4.answer=Sevginin doğal geldiği dili kullanın. Bir kelimeyi diğer dilde açıklayın, vedayı tekrarlayın veya şivenizi gizlemeden iki kısa sürüm yapın.
problem.5.question=Canlı okurken çocuk sürekli araya giriyor
problem.5.answer=Sohbeti kayda katın. Bir soru sorun, üç saniye bekleyin ve “Sen ne düşünüyorsun?” diye devam edin. Dinlerken de katılabilir.
faq.1.question=Büyükanne veya dede kaydı ne kadar uzun olmalı?
faq.1.answer=Beş ila on beş dakika ya da tanıdık bir bölümle başlayın. Küçükler kısa tekrarları, büyükler bölümlere ayrılmış aile anılarını sevebilir.
faq.2.question=Görüntülü arama yeterli değil mi?
faq.2.answer=Canlı arama sohbet için güzeldir ama yerel ses kaydı genellikle daha nettir ve birçok gece dinlenebilir. İkisi birbirini tamamlar.
faq.3.question=Tüm kitabı okumak gerekir mi?
faq.3.answer=Yalnızca rahatsa ve metni kaydetme hakkınız varsa. Kısa özgün masal, aile anısı, izinli tekerleme veya tek bölüm de aynı ölçüde değerli olabilir.
faq.4.question=Kaydı kim saklamalı?
faq.4.answer=Önceden anlaşın. Aslı aile hesabında tutun, yalnızca kararlaştırılan kişilerle paylaşın ve sesi yeni bir amaçla kullanmadan önce tekrar izin isteyin.
