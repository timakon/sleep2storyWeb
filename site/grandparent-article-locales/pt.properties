setup.title=Pense numa criança, não na posteridade
setup.lead=Comece por quem vai ouvir. Pergunte aos pais do que a criança gosta agora, que nomes reconhece e que livro, memória de família, lengalenga ou canção já pertence à rotina da noite.
setup.body=Cinco a quinze minutos são um bom primeiro objetivo. Escolha uma altura sem pressa, apoie bem o telemóvel e combine antes onde o ficheiro será guardado e com quem poderá ser partilhado.
kit.1.title=Uma história conhecida
kit.1.body=Escolha um conto seu, um texto permitido ou uma memória verdadeira contada com palavras para crianças.
kit.2.title=Uma saudação pessoal
kit.2.body=Anote o nome, a alcunha e uma frase carinhosa para começar.
kit.3.title=Telemóvel e quarto tranquilo
kit.3.body=Carregue o telefone, silencie os avisos e faça um teste curto num espaço acolhedor.
steps.title=Sete passos do «olá» à história para repetir
step.1.title=Pergunte do que o neto gosta agora
step.1.body=Os interesses mudam depressa. Confirme a rotina, as personagens preferidas, o tempo de atenção e as palavras que os pais preferem evitar.
step.2.title=Escolha um texto que possa gravar
step.2.body=Use uma história sua, uma obra em domínio público ou material autorizado. Uma gravação familiar privada e a partilha pública de um livro podem ter regras diferentes.
step.3.title=Abra com uma frase que só diria você
step.3.body=Diga o nome e onde está: «Boa noite, Maya. O avô lê-te hoje da cadeira junto à janela». Um detalhe real transforma um ficheiro numa pequena visita.
step.4.title=Faça um teste curto com os pais
step.4.body=Grave 30 segundos e envie-os se precisar de ajuda. Os pais podem verificar o volume e se o ficheiro abre antes da história completa.
step.5.title=Leia como numa conversa
step.5.body=Imagine a criança ao seu lado. Abrande um pouco, mas mantenha o sotaque, as expressões e o humor. Depois de uma pergunta, deixe uma pausa para ela responder.
step.6.title=Acrescente uma pequena memória de família
step.6.body=Se encaixar, recorde a primeira neve, um animal da infância ou uma frase dos seus avós. Explique nomes desconhecidos e seja breve.
step.7.title=Despeça-se, dê um nome e guarde uma cópia
step.7.body=Termine com o seu habitual boa-noite. Nomeie o ficheiro com história, pessoa e ano, conserve o original e uma segunda cópia controlada pela família.
quote.text=A perfeição soa ensaiada. A proximidade soa à avó que para um instante para se lembrar da linha seguinte.
quote.attribution=Princípio Sleep2Story para gravações de família
checklist.kicker=Antes de enviar
checklist.title=Oito detalhes que tornam a gravação pessoal
checklist.1=O nome preferido da criança está bem pronunciado
checklist.2=A história corresponde à idade e à rotina
checklist.3=Todos sabem como a voz será utilizada
checklist.4=Quarto sossegado e notificações desligadas
checklist.5=O teste de 30 segundos está nítido
checklist.6=Há um detalhe ou expressão de família
checklist.7=O final é calmo, não abrupto
checklist.8=O original tem nome claro e cópia de segurança
problems.title=Retire primeiro a pressão, depois resolva a tecnologia
problem.1.question=Não gosto da minha voz gravada
problem.1.answer=Quase toda a gente estranha a própria voz. Não tente soar como um locutor: basta que as palavras estejam claras e que o seu neto o reconheça.
problem.2.question=Vivemos longe e preciso de ajuda técnica
problem.2.answer=Combine uma chamada curta de teste, mas grave localmente no gravador do telemóvel para obter melhor som. Envie o teste e anote os três botões necessários.
problem.3.question=Ler a história inteira é cansativo
problem.3.answer=Grave um capítulo ou cinco minutos de cada vez. Sente-se confortavelmente, tenha água por perto e pare antes de cansar a voz. Várias partes tranquilas funcionam bem.
problem.4.question=A família fala várias línguas ou dialetos
problem.4.answer=Use a língua em que o carinho soa natural. Explique uma palavra noutra língua, repita a despedida ou faça duas versões curtas sem esconder o sotaque.
problem.5.question=A criança interrompe quando leio ao vivo
problem.5.answer=Inclua a conversa na gravação. Faça uma pergunta, deixe três segundos e continue com «E tu, o que achas?». A criança poderá participar ao ouvir.
faq.1.question=Quanto deve durar uma história gravada pelos avós?
faq.1.answer=Comece com cinco a quinze minutos ou um capítulo conhecido. Os mais pequenos gostam de repetir histórias breves; os maiores podem ouvir uma memória dividida em partes.
faq.2.question=Uma videochamada não chega?
faq.2.answer=As chamadas são ótimas para conversar, mas uma gravação local costuma ser mais nítida e pode acompanhar muitas noites. As duas opções complementam-se.
faq.3.question=É preciso ler o livro todo?
faq.3.answer=Só se for confortável e tiver o direito de gravar o texto. Um conto original, uma memória, uma rima permitida ou um capítulo podem ser igualmente especiais.
faq.4.question=Quem deve guardar a gravação?
faq.4.answer=Combinem antes. Guardem o original numa conta da família, partilhem apenas com as pessoas acordadas e peçam novo consentimento para outra utilização da voz.
