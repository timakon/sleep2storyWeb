answer.title=Escolha uma história de que o neto já goste, acrescente uma saudação pessoal e grave-a no telemóvel, num quarto sossegado.
answer.body=Não precisa de uma «voz de contador». A alcunha, o riso e as suas pausas tornam a gravação verdadeiramente familiar.
toc.1=Preparar uma gravação pessoal
toc.2=Sete passos para avós
