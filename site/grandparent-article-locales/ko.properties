meta.title=조부모가 손주를 위해 이야기를 녹음하는 방법
meta.description=손주에게 들려줄 잠자리 이야기를 녹음하려는 조부모를 위한 실용 가이드. 이야기 선택부터 따뜻한 목소리 녹음, 멀리 있어도 안전하게 공유하는 방법까지 알아보세요.
meta.og_title=조부모가 손주를 위해 이야기를 녹음하는 방법
meta.og_description=조부모의 낭독과 가족의 추억을 손주가 다시 들을 수 있는 잠자리 녹음으로 남기는 쉽고 세심한 방법.
meta.twitter_description=휴대전화와 조용한 방, 손주에게 건네는 인사말로 따뜻한 잠자리 이야기를 녹음하는 방법.
schema.description=손주를 위해 조부모의 익숙한 목소리로 잠자리 이야기와 가족의 추억을 녹음하는 실용 가이드.
hero.eyebrow=조부모를 위한 가이드 · 02
hero.line1=손주가 아는 목소리로
hero.line2=이야기를
hero.line3=남겨 주세요
hero.dek=익숙한 ‘옛날 옛적에’는 먼 거리도 건너갑니다. 잠자리에 함께하지 못하는 밤에도, 손주에게 직접 들려주는 듯 따뜻하고 또렷한 녹음을 남기는 방법을 소개합니다.
byline.read_time=읽는 시간 9분
field.label=오늘 밤을 위한 메모
field.line1=손주가 좋아하는 이야기.
field.line2=할머니나 할아버지의 진짜 목소리.
field.line3=오래 남을 잠자리 습관.
sticker.line1=손주의 이름을
sticker.line2=부르며 시작하세요
answer.title=손주가 이미 좋아하는 이야기를 하나 고르고, 직접 건네는 인사를 더하세요. 조용한 방에서 휴대전화로 녹음하고, 평소 내 말투를 그대로 남기면 됩니다.
answer.body=‘동화책 읽는 목소리’를 따로 낼 필요는 없어요. 애칭, 웃음소리, 잠깐 멈추는 방식 같은 작은 것들이 그 녹음을 우리 가족만의 것으로 만듭니다.
toc.1=손주를 위한 녹음 계획
toc.2=조부모를 위한 일곱 단계
toc.3=남겨 둘 만한 이야기 소재
toc.4=녹음을 쉽게 하는 방법
toc.6=가족들이 묻는 질문
setup.title=먼 훗날보다 지금 들을 아이를 생각하세요
setup.lead=먼저 이 이야기를 들을 손주를 떠올리세요. 지금 무엇을 좋아하는지, 어떤 이름을 알아듣는지, 잠자리마다 찾는 책이나 가족 이야기, 운율 있는 말, 자장가가 있는지 부모에게 물어보세요.
setup.body=첫 녹음은 5~15분 정도를 목표로 해 보세요. 서두르지 않아도 되는 때를 골라 휴대전화를 안정적인 곳에 놓고, 녹음을 시작하기 전에 파일을 어떻게 보관하고 나눌지 가족과 이야기하세요.
kit.1.title=익숙한 이야기
kit.1.body=녹음해도 되는 책, 직접 지은 이야기, 또는 아이 눈높이로 들려줄 진짜 가족의 추억을 고르세요.
kit.2.title=손주에게 건네는 인사
kit.2.body=손주의 이름과 애칭, 따뜻한 첫마디를 메모해 곁에 놓으세요.
kit.3.title=조용한 휴대전화 녹음 환경
kit.3.body=휴대전화를 충전하고 알림을 끈 뒤 조용하고 소리가 부드러운 방에서 짧게 시험 녹음하세요.
steps.title=‘안녕’부터 다시 들을 수 있는 이야기까지, 일곱 단계
step.1.title=지금 손주가 좋아하는 것을 물어보세요
step.1.body=아이의 취향은 금방 바뀝니다. 요즘의 잠자리 습관과 집중할 수 있는 시간, 좋아하는 등장인물, 부모가 되도록 피했으면 하는 표현을 확인하세요. 누구에게나 읽어 주는 이야기보다 이 아이를 위해 고른 이야기가 더 가깝게 들립니다.
step.2.title=녹음해도 되는 글을 고르세요
step.2.body=직접 쓴 이야기나 저작권 보호 기간이 끝난 작품, 녹음 허락을 받은 자료를 사용하세요. 출판된 책을 읽는다면 가족끼리만 쓰는 경우와 공개적으로 공유하는 경우의 권리가 다를 수 있으니 적용되는 규정을 확인하세요.
step.3.title=나만 할 수 있는 말로 시작하세요
step.3.body=손주의 이름과 지금 녹음하는 곳을 말해 주세요. “마야야, 좋은 저녁이야. 할아버지가 창가 의자에 앉아 읽어 줄게.” 이렇게 구체적인 장면 하나가 음성 파일을 작은 방문처럼 느끼게 합니다.
step.4.title=짧게 시험 녹음해 보세요
step.4.body=30초 정도 녹음하고 도움이 필요하면 부모에게 보내 보세요. 긴 이야기를 녹음하기 전에 목소리가 충분히 크게 들리는지, 상대방 기기에서 파일이 열리는지 확인할 수 있습니다.
step.5.title=대화하듯 읽어 주세요
step.5.body=손주가 바로 곁에 있다고 상상하세요. 조금 천천히 읽되 평소 억양과 말투, 부드러운 농담은 그대로 두세요. 질문 뒤에는 잠깐 쉬어 주세요. 녹음은 아이의 대답을 듣지 못해도 아이는 대답할 수 있으니까요.
step.6.title=작은 가족 추억을 하나 더하세요
step.6.body=이야기와 어울린다면 처음 눈을 봤던 날, 어릴 적 함께한 반려동물, 또는 내 조부모가 자주 하던 말 같은 짧은 기억을 넣어 보세요. 길게 늘이지 말고 낯선 이름은 설명해 주세요.
step.7.title=마무리하고 이름을 붙여 백업하세요
step.7.body=직접 만났을 때처럼 익숙한 ‘잘 자’ 인사로 끝내세요. 파일 이름에는 이야기 제목, 읽은 사람, 연도를 넣고 원본을 남겨 둔 뒤 가족이 관리하는 곳에 사본을 하나 더 보관하세요.
quote.text=완벽하게 다듬은 목소리보다, 다음 문장을 떠올리느라 잠깐 멈추는 할머니의 목소리가 더 우리답습니다.
quote.attribution=Sleep2Story의 가족 녹음 원칙
checklist.kicker=보내기 전에
checklist.title=녹음을 더 특별하게 만드는 여덟 가지
checklist.1=아이가 좋아하는 이름을 정확하게 부른다
checklist.2=이야기가 아이의 나이와 현재 잠자리 습관에 맞는다
checklist.3=목소리가 어떻게 쓰이는지 모두가 이해한다
checklist.4=방이 조용하고 알림이 꺼져 있다
checklist.5=30초 시험 녹음이 또렷하게 들린다
checklist.6=가족만의 디테일이나 익숙한 말투가 들어 있다
checklist.7=끝이 갑작스럽지 않고 차분하다
checklist.8=원본 파일에 알아보기 쉬운 이름과 백업이 있다
problems.title=부담을 내려놓고 기술적인 문제를 해결하세요
problem.1.question=녹음된 제 목소리가 마음에 들지 않아요
problem.1.answer=대부분 자기 목소리를 녹음으로 들으면 낯설게 느낍니다. 방송인처럼 들리려 애쓰기보다 말이 또렷한지, 손주가 내 목소리를 알아볼지만 확인하세요. 그것이면 충분합니다.
problem.2.question=멀리 살고 있어서 기기 사용에 도움이 필요해요
problem.2.answer=부모와 짧게 영상 통화로 연습하되, 실제 녹음은 더 또렷한 소리를 위해 휴대전화 녹음 앱에서 직접 하세요. 먼저 시험 파일을 보내고 전체 녹음에 쓸 버튼 세 개를 적어 두면 좋습니다.
problem.3.question=이야기 한 편을 끝까지 읽으면 힘들어요
problem.3.answer=한 번에 한 장이나 5분씩 나누어 녹음하세요. 편하게 앉고 물을 가까이 두고 목이 힘들어지기 전에 멈추세요. 무리해서 한 번에 끝낸 녹음보다 짧고 편안한 녹음 여러 개가 좋습니다.
problem.4.question=우리 가족은 여러 언어나 사투리를 써요
problem.4.answer=애정을 가장 자연스럽게 표현할 수 있는 언어를 사용하세요. 다른 언어의 낯선 단어를 설명하거나 끝인사를 반복해도 되고, 억양을 억지로 바꾸지 않고 짧은 버전을 따로 만들어도 좋습니다.
problem.5.question=직접 읽어 주면 아이가 자꾸 말을 끊어요
problem.5.answer=녹음 안에 대답할 틈을 넣어 보세요. 질문하고 3초 정도 멈춘 다음 “넌 어떻게 생각했니?”라고 이어 가면 됩니다. 다시 들을 때도 아이가 참여할 수 있습니다.
faq.1.question=조부모가 녹음하는 잠자리 이야기는 얼마나 길어야 하나요?
faq.1.answer=5~15분이나 익숙한 책 한 장 정도로 시작해 보세요. 어린아이는 여러 번 들을 수 있는 아주 짧은 이야기를 좋아할 수 있고, 나이가 더 든 아이는 여러 부분으로 나눈 긴 가족 이야기를 즐길 수 있습니다.
faq.2.question=전화나 영상 통화만으로도 충분할까요?
faq.2.answer=실시간 통화는 대화하기에 좋습니다. 하지만 휴대전화에 직접 남긴 녹음은 대체로 소리가 더 또렷하고 잠자리 습관의 일부가 될 수 있습니다. 통화도 하고, 다시 듣는 녹음도 따로 나눌 수 있어요.
faq.3.question=할머니나 할아버지가 책 전체를 읽어야 하나요?
faq.3.answer=편안하게 읽을 수 있고 그 글을 녹음할 권리가 있을 때만 그렇게 하세요. 직접 지은 짧은 이야기나 가족의 추억, 사용해도 되는 동요, 허락받은 책의 한 장만으로도 충분히 의미가 있습니다.
faq.4.question=녹음은 누가 보관해야 하나요?
faq.4.answer=녹음 전에 합의하세요. 원본은 가족이 관리하는 계정이나 저장 공간에 두고, 공유 범위는 합의한 사람으로 제한하세요. 목소리를 새로운 용도로 쓰려면 다시 동의를 구하세요.
