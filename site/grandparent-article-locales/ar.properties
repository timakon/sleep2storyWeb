setup.title=خطّط لطفل واحد، لا للذكرى وحدها
setup.lead=ابدأ بالطفل الذي سيستمع. اسأل أحد والديه عمّا يحبه هذه الأيام، والأسماء التي يعرفها، وما إذا كانت هناك حكاية أو أغنية هادئة أو موقف عائلي مألوف يرتبط بوقت نومه.
setup.body=تسجيل من خمس إلى خمس عشرة دقيقة هدف مناسب للمرة الأولى. اختر وقتًا لا تكون فيه مستعجلًا، وضع الهاتف على سطح ثابت، واتفق مع العائلة مسبقًا على طريقة حفظ التسجيل ومشاركته.
kit.1.title=حكاية مألوفة
kit.1.body=اختر كتابًا يحق لك تسجيله، أو حكاية من تأليفك، أو ذكرى عائلية حقيقية ترويها بلغة تناسب الطفل.
kit.2.title=تحية خاصة
kit.2.body=اكتب اسم الطفل والاسم الذي تحب مناداته به وجملة افتتاحية دافئة على ورقة أمامك.
kit.3.title=إعداد هادئ للهاتف
kit.3.body=اشحن الهاتف، وأوقف الإشعارات، وسجّل تجربة قصيرة في غرفة هادئة تقلّل صدى الصوت.
steps.title=سبع خطوات من التحية إلى حكاية يعيد سماعها
step.1.title=اسأل عمّا يحبه حفيدك الآن
step.1.body=تتغيّر تفضيلات الأطفال بسرعة. اسأل عن روتين النوم الحالي، ومدّة انتباهه، وشخصياته المفضّلة، والكلمات التي يفضّل والداه تجنّبها. الحكاية المختارة له تحديدًا أقرب إلى قلبه من أداء عام.
step.2.title=اختر نصًا يحق لك تسجيله
step.2.body=استخدم حكاية من تأليفك أو عملًا من الملكية العامة أو مادة لديك إذن بتسجيلها. قد تختلف معاملة القراءة الخاصة داخل العائلة عن النشر العام لكتاب منشور؛ لذا تحقّق من الحقوق المعمول بها.
step.3.title=ابدأ برسالة لا يقولها سواك
step.3.body=اذكر اسم الطفل والمكان الذي تسجّل فيه: «مساء الخير يا مريم. جدّك يقرأ لك من كرسيّه قرب النافذة». تفصيل صغير كهذا يجعل الملف الصوتي أشبه بزيارة.
step.4.title=جرّب تسجيلًا قصيرًا مع العائلة
step.4.body=سجّل ثلاثين ثانية وأرسلها إلى أحد الوالدين إذا احتجت إلى المساعدة. يمكنه التأكد من وضوح الصوت وإمكانية فتح الملف على جهازه قبل أن تسجّل الحكاية كلها.
step.5.title=اقرأ بوتيرة الحديث المعتاد
step.5.body=تخيّل الطفل جالسًا إلى جوارك. أبطئ قليلًا، لكن احتفظ بلهجتك وتعبيراتك وروح الدعابة الهادئة. توقّف بعد السؤال لحظةً كي يجيب المستمع الصغير، حتى لو لم يسمعه التسجيل.
step.6.title=أضف ذكرى عائلية صغيرة
step.6.body=إذا ناسبت الحكاية، أضف ذكرى قصيرة: أول مرة رأيت فيها الثلج، أو الحيوان الذي ربيته صغيرًا، أو عبارة كان يقولها جدّاك. اجعلها موجزة واشرح الأسماء غير المألوفة.
step.7.title=اختم وسمِّ الملف واحفظ نسخة ثانية
step.7.body=اختم بعبارة تصبح على خير التي تقولها وجهًا لوجه. سمِّ الملف باسم الحكاية وراويها وسنة التسجيل، واحتفظ بالأصل ونسخة أخرى في مكان تتحكّم فيه العائلة.
quote.text=قد يبدو الإتقان مصقولًا، لكن الألفة تُسمَع حين تتوقف الجدّة لحظة لتتذكّر الجملة التالية.
quote.attribution=مبدأ التسجيل العائلي في Sleep2Story
