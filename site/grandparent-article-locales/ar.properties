answer.title=اختر حكاية يحبها حفيدك بالفعل، وأضف تحية خاصة به، وسجّلها بهاتفك في غرفة هادئة، واحتفظ بالعبارات الطبيعية التي تشبهك.
answer.body=لست بحاجة إلى «صوت راوي حكايات». الاسم الذي تدلّله به، وضحكتك، وطريقة وقوفك بين الجمل هي ما يجعل التسجيل جزءًا من عائلتكم.
