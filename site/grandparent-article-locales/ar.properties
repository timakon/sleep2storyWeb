checklist.7=النهاية هادئة وغير مفاجئة
checklist.8=الملف الأصلي له اسم واضح ونسخة احتياطية
problems.title=خفّف عن نفسك الضغط، ثم عالج الجانب التقني
problem.1.question=لا أحب سماع صوتي مسجّلًا
problem.1.answer=يبدو صوتنا المسجّل غريبًا على معظمنا. لا تسعَ إلى صوت مذيع؛ اسأل هل الكلمات واضحة وهل سيتعرّف حفيدك إلى صوتك. هذا هو المعيار المفيد.
problem.2.question=نعيش بعيدًا وأحتاج إلى مساعدة تقنية
problem.2.answer=رتّب مكالمة تدريب قصيرة مع أحد الوالدين، لكن سجّل محليًا في تطبيق التسجيل على الهاتف لتحصل على صوت أوضح. أرسل التجربة أولًا، ودوّن الأزرار الثلاثة التي ستستخدمها في التسجيل الكامل.
problem.3.question=قراءة حكاية كاملة تُتعبني
problem.3.answer=سجّل فصلًا واحدًا أو خمس دقائق في كل مرة. اجلس براحة، وضع الماء قربك، وتوقف قبل أن يُجهَد صوتك. تسجيلات قصيرة هادئة خير من جلسة واحدة مرهقة.
problem.4.question=تستخدم عائلتنا أكثر من لغة أو لهجة
problem.4.answer=تحدّث باللغة التي تعبّر بها عن محبتك بصورة طبيعية. يمكنك شرح كلمة غير مألوفة بلغة ثانية أو تكرار عبارة الختام أو تسجيل نسختين قصيرتين، من دون إخفاء لهجتك.
problem.5.question=يقاطع الطفل القراءة المباشرة بأسئلته
problem.5.answer=اجعل التفاعل جزءًا من التسجيل. اطرح سؤالًا، وانتظر ثلاث ثوانٍ، ثم واصل مثلًا: «ماذا توقعت؟». يستطيع الطفل المشاركة حتى أثناء تشغيل التسجيل.
faq.1.question=ما المدة المناسبة لتسجيل الجدّين قبل النوم؟
faq.1.answer=ابدأ بخمس إلى خمس عشرة دقيقة أو فصل مألوف. قد يفضّل الصغار حكاية قصيرة يسمعونها مرارًا، بينما يستمتع الأكبر سنًا بذكرى عائلية أطول تُروى على أجزاء.
faq.2.question=ألا تكفي مكالمة صوتية أو فيديو؟
faq.2.answer=المكالمات المباشرة جميلة للحديث، لكن التسجيل المحلي غالبًا أوضح ويمكن إدخاله في روتين النوم. ويمكن الجمع بين الأمرين: الحديث مباشرةً ثم مشاركة تسجيل مستقل لإعادة الاستماع.
faq.3.question=هل ينبغي للجدّة أو الجدّ قراءة الكتاب كله؟
faq.3.answer=فقط إذا كان ذلك مريحًا ولهما الحق في تسجيل النص. قد تكون حكاية قصيرة من تأليفهما أو ذكرى عائلية أو أغنية أطفال يحق استخدامها أو فصل مسموح به ذات معنى بالقدر نفسه.
faq.4.question=من يحتفظ بالتسجيل؟
faq.4.answer=اتفقوا على ذلك قبل التسجيل. احتفظوا بالأصل في حساب أو مساحة تخزين تتحكّم فيها العائلة، واقصروا المشاركة على الأشخاص المتفق عليهم، واطلبوا الموافقة من جديد قبل استخدام الصوت لغرض آخر.
