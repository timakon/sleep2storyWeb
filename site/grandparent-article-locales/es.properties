setup.title=Piensa en un niño, no en la posteridad
setup.lead=Empieza por quien va a escuchar. Pregunta a sus padres qué le gusta ahora, qué nombres reconoce y qué libro, historia familiar, canción o nana ya forma parte de la rutina nocturna.
setup.body=Entre cinco y quince minutos es un buen primer objetivo. Busca un momento sin prisas, apoya bien el móvil y acuerda antes dónde se guardará el archivo y con quién se podrá compartir.
kit.1.title=Una historia conocida
kit.1.body=Elige un cuento propio, un texto permitido o un recuerdo familiar verdadero contado con palabras para niños.
kit.2.title=Un saludo personal
kit.2.body=Anota su nombre, su apodo y una frase cariñosa para empezar.
kit.3.title=El móvil en un lugar tranquilo
kit.3.body=Cárgalo, silencia las notificaciones y haz una prueba corta en una habitación acogedora.
steps.title=Siete pasos desde «hola» hasta un cuento para repetir
step.1.title=Pregunta qué le gusta ahora mismo
step.1.body=Los gustos infantiles cambian rápido. Comprueba su rutina, personajes favoritos, tiempo de atención y las palabras que sus padres prefieren evitar.
step.2.title=Elige un texto que puedas grabar
step.2.body=Usa una historia propia, una obra de dominio público o material autorizado. Una grabación familiar privada y publicar un libro pueden estar sujetos a reglas distintas.
step.3.title=Abre con una frase que solo dirías tú
step.3.body=Di su nombre y dónde estás: «Buenas noches, Maya. El abuelo te lee desde el sillón junto a la ventana». Un detalle real convierte un archivo en una pequeña visita.
step.4.title=Haz una prueba breve con los padres
step.4.body=Graba 30 segundos y envíalos si necesitas ayuda. Así podrán comprobar el volumen y que el archivo se abre antes de que dediques tiempo al cuento completo.
step.5.title=Lee como si conversarais
step.5.body=Imagina al niño a tu lado. Ve un poco más despacio, pero conserva tu acento, expresiones y humor. Después de una pregunta, deja una pausa para que pueda responder.
step.6.title=Añade un pequeño recuerdo familiar
step.6.body=Si encaja, cuenta brevemente tu primera nevada, una mascota de infancia o un dicho de tus propios abuelos. Explica los nombres desconocidos y no alargues el inciso.
step.7.title=Despídete, nombra y guarda una copia
step.7.body=Termina con tu frase habitual de buenas noches. Nombra el archivo con cuento, narrador y año, conserva el original y una segunda copia bajo control familiar.
quote.text=La perfección suena ensayada. La cercanía suena a la abuela que se detiene para recordar la siguiente línea.
quote.attribution=Principio de grabación familiar de Sleep2Story
checklist.kicker=Antes de enviarlo
checklist.title=Ocho detalles que hacen personal una grabación
checklist.1=El nombre preferido del niño está bien pronunciado
checklist.2=El cuento encaja con su edad y rutina
checklist.3=Todos saben cómo se utilizará la voz
checklist.4=La habitación está tranquila y sin avisos
checklist.5=La prueba de 30 segundos se oye clara
checklist.6=Incluye un detalle o una frase familiar
checklist.7=El final es tranquilo, no repentino
checklist.8=El original tiene nombre claro y copia
problems.title=Quita primero la presión y después resuelve la tecnología
problem.1.question=No me gusta cómo suena mi voz grabada
problem.1.answer=A casi todos nos resulta extraña al principio. No busques sonar como un locutor: basta con que las palabras sean claras y tu nieto te reconozca.
problem.2.question=Vivimos lejos y necesito ayuda técnica
problem.2.answer=Organiza una videollamada de prueba, pero graba localmente con la app de voz para obtener mejor sonido. Envía antes la muestra y apunta los tres botones que usarás.
problem.3.question=Leer todo el cuento me cansa
problem.3.answer=Graba un capítulo o cinco minutos cada vez. Siéntate cómodo, ten agua cerca y para antes de cansar la voz. Varias partes relajadas funcionan muy bien.
problem.4.question=En casa hablamos varios idiomas o dialectos
problem.4.answer=Usa el idioma en el que el cariño salga natural. Puedes explicar una palabra en el otro idioma, repetir la despedida o hacer dos versiones breves sin ocultar tu acento.
problem.5.question=El niño interrumpe cuando le leo en directo
problem.5.answer=Incluye la conversación en la grabación. Haz una pregunta, deja tres segundos y continúa con «¿Tú qué crees?». Así podrá participar al escucharla.
faq.1.question=¿Cuánto debe durar un cuento grabado por los abuelos?
faq.1.answer=Empieza con cinco o quince minutos, o con un capítulo conocido. Los pequeños suelen preferir cuentos breves que repiten; los mayores, un recuerdo familiar dividido en partes.
faq.2.question=¿No basta con una videollamada?
faq.2.answer=Las llamadas son estupendas para conversar, pero una grabación local suele oírse mejor y puede acompañar muchas noches. Las dos opciones se complementan.
faq.3.question=¿Hay que leer el libro entero?
faq.3.answer=Solo si resulta cómodo y tienes derecho a grabar el texto. Un cuento propio, un recuerdo, una canción permitida o un solo capítulo pueden ser igual de valiosos.
faq.4.question=¿Quién debe guardar la grabación?
faq.4.answer=Acordadlo antes. Conserva el original en una cuenta familiar, compártelo solo con las personas pactadas y vuelve a pedir permiso antes de usar la voz con otro fin.
