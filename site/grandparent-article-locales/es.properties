answer.title=Elige un cuento que tu nieto ya disfrute, añade un saludo personal y grábalo con el móvil en una habitación tranquila.
answer.body=No necesitas «voz de cuentacuentos». El apodo, la risa y tus pausas habituales hacen que la grabación sea verdaderamente familiar.
