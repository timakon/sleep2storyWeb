setup.title=Pensa a un bambino, non ai posteri
setup.lead=Parti da chi ascolterà. Chiedi ai genitori cosa piace al bambino in questo momento, quali nomi riconosce e quale libro, storia di famiglia, filastrocca o ninna nanna fa già parte della sera.
setup.body=Da cinque a quindici minuti sono un buon primo obiettivo. Scegli un momento senza fretta, appoggia bene il telefono e concorda prima dove sarà custodito il file e con chi potrà essere condiviso.
kit.1.title=Una storia familiare
kit.1.body=Scegli un racconto tuo, un testo consentito o un vero ricordo di famiglia spiegato con parole adatte al bambino.
kit.2.title=Un saluto personale
kit.2.body=Annota il nome, il nomignolo e una frase affettuosa con cui iniziare.
kit.3.title=Telefono e stanza tranquilla
kit.3.body=Carica il telefono, silenzia le notifiche e fai una breve prova in una stanza tranquilla e arredata.
steps.title=Sette passi dal saluto alla storia da riascoltare
step.1.title=Chiedi cosa piace al bambino adesso
step.1.body=I gusti cambiano in fretta. Informati sulla routine serale, i personaggi preferiti, la durata dell’attenzione e le parole che i genitori preferiscono evitare.
step.2.title=Scegli un testo che puoi registrare
step.2.body=Usa una storia tua, un’opera di pubblico dominio o materiale autorizzato. Una registrazione privata in famiglia e la pubblicazione di un libro possono seguire regole diverse.
step.3.title=Apri con una frase che diresti solo tu
step.3.body=Di’ il nome e dove sei: «Buonasera, Maya. Il nonno legge dalla poltrona vicino alla finestra». Un dettaglio vero trasforma un file in una piccola visita.
step.4.title=Fai una breve prova con i genitori
step.4.body=Registra 30 secondi e inviali se ti serve aiuto. I genitori controlleranno il volume e l’apertura del file prima che tu registri tutta la storia.
step.5.title=Leggi come in una conversazione
step.5.body=Immagina il bambino accanto. Rallenta un poco, ma conserva accento, espressioni e umorismo. Dopo una domanda lascia una pausa perché possa rispondere.
step.6.title=Aggiungi un piccolo ricordo di famiglia
step.6.body=Se si lega al racconto, ricorda la prima neve, un animale dell’infanzia o un detto dei tuoi nonni. Spiega i nomi sconosciuti e resta breve.
step.7.title=Saluta, assegna un nome e salva una copia
step.7.body=Chiudi con il tuo solito augurio della buonanotte. Nomina il file con storia, voce e anno, conserva l’originale e una seconda copia gestita dalla famiglia.
quote.text=La perfezione sembra provata. La vicinanza è la nonna che si ferma un attimo per ricordare la riga successiva.
quote.attribution=Principio Sleep2Story per le registrazioni di famiglia
checklist.kicker=Prima di inviare
checklist.title=Otto dettagli che rendono personale una registrazione
checklist.1=Il nome preferito del bambino è pronunciato bene
checklist.2=La storia si adatta a età e routine
checklist.3=Tutti sanno come sarà usata la voce
checklist.4=Stanza tranquilla e notifiche disattivate
checklist.5=La prova di 30 secondi è chiara
checklist.6=C’è un dettaglio o un modo di dire familiare
checklist.7=Il finale è calmo, non brusco
checklist.8=L’originale ha un nome chiaro e un backup
problems.title=Togli prima la pressione, poi risolvi la tecnologia
problem.1.question=Non mi piace la mia voce registrata
problem.1.answer=Quasi tutti la trovano strana all’inizio. Non cercare una voce da radio: conta che le parole siano chiare e che tuo nipote ti riconosca.
problem.2.question=Viviamo lontani e mi serve aiuto tecnico
problem.2.answer=Organizza una breve chiamata di prova, ma registra localmente con il registratore del telefono per un suono più pulito. Invia il test e annota i tre pulsanti necessari.
problem.3.question=Leggere tutta la storia mi stanca
problem.3.answer=Registra un capitolo o cinque minuti alla volta. Siediti comodo, tieni dell’acqua vicina e fermati prima di affaticare la voce. Più parti rilassate vanno benissimo.
problem.4.question=In famiglia parliamo più lingue o dialetti
problem.4.answer=Usa la lingua in cui l’affetto ti viene naturale. Puoi spiegare una parola nell’altra lingua, ripetere il saluto o creare due versioni brevi senza cancellare il tuo accento.
problem.5.question=Il bambino interrompe quando leggo dal vivo
problem.5.answer=Inserisci il dialogo nella registrazione. Fai una domanda, attendi tre secondi e continua con «Tu cosa ne pensi?». Potrà partecipare anche al riascolto.
faq.1.question=Quanto deve durare una storia registrata dai nonni?
faq.1.answer=Inizia con cinque–quindici minuti o un capitolo noto. I piccoli amano storie brevi da ripetere; i più grandi possono seguire un ricordo di famiglia in più parti.
faq.2.question=Non basta una videochiamata?
faq.2.answer=Le chiamate sono preziose per parlare, ma una registrazione locale di solito è più chiara e può accompagnare molte sere. Le due cose si completano.
faq.3.question=Bisogna leggere tutto il libro?
faq.3.answer=Solo se è comodo e hai il diritto di registrare il testo. Una storia originale, un ricordo, una filastrocca consentita o un capitolo possono valere altrettanto.
faq.4.question=Chi dovrebbe conservare la registrazione?
faq.4.answer=Decidetelo prima. Custodite l’originale in un account di famiglia, condividetelo solo con le persone concordate e chiedete nuovo consenso per altri usi della voce.
