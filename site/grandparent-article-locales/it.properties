answer.title=Scegli una storia che tuo nipote ama già, aggiungi un saluto personale e registrala con il telefono in una stanza tranquilla.
answer.body=Non serve una «voce da narratore». Il soprannome, una risata e le tue pause rendono la registrazione davvero di famiglia.
