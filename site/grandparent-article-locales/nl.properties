answer.title=Kies een verhaal dat je kleinkind al graag hoort, voeg een persoonlijke groet toe en neem het met je telefoon op in een rustige kamer.
answer.body=Een perfecte voorleesstem is niet nodig. De koosnaam, je lach en eigen pauzes maken de opname echt van jullie familie.
toc.1=Een persoonlijke opname plannen
toc.2=Zeven stappen voor grootouders
toc.3=Herinneringen om te bewaren
toc.4=Opnemen zonder druk
toc.6=Vragen van families
setup.title=Denk aan één kind, niet aan later
setup.lead=Begin bij de luisteraar. Vraag de ouders wat het kind nu leuk vindt, welke namen bekend zijn en welk boek, familieverhaal, rijmpje of liedje al bij bedtijd hoort.
setup.body=Vijf tot vijftien minuten is een goed eerste doel. Kies een rustig moment, leg de telefoon stabiel neer en spreek vooraf af waar het bestand wordt bewaard en met wie het mag worden gedeeld.
kit.1.title=Een bekend verhaal
kit.1.body=Kies je eigen verhaal, een toegestane tekst of een echte familieherinnering in kindvriendelijke woorden.
kit.2.title=Een persoonlijke groet
kit.2.body=Schrijf de naam, koosnaam en één warme openingszin op een briefje.
kit.3.title=Telefoon en rustige kamer
kit.3.body=Laad de telefoon op, zet meldingen uit en maak een korte test in een rustig ingerichte kamer.
steps.title=Zeven stappen van hallo tot een verhaal voor elke avond
step.1.title=Vraag wat je kleinkind nu leuk vindt
step.1.body=Voorkeuren veranderen snel. Vraag naar de avondroutine, favoriete figuren, aandachtsspanne en woorden die ouders liever vermijden.
step.2.title=Kies tekst die je mag opnemen
step.2.body=Gebruik een eigen verhaal, publiek domein of materiaal met toestemming. Een privé-opname en openbare verspreiding van een boek kunnen onder andere regels vallen.
step.3.title=Begin met een zin die alleen jij zegt
step.3.body=Noem het kind en de plek: ‘Goedenavond, Maya. Opa leest vanuit de stoel bij het raam.’ Eén echt detail maakt van een bestand een bezoekje.
step.4.title=Maak samen met de ouders een korte test
step.4.body=Neem 30 seconden op en stuur die als je hulp nodig hebt. Ouders kunnen volume en bestand controleren voordat je het hele verhaal opneemt.
step.5.title=Lees alsof je samen praat
step.5.body=Stel je het kind naast je voor. Lees iets rustiger, maar behoud accent, uitdrukkingen en humor. Laat na een vraag een pauze om antwoord te geven.
step.6.title=Voeg één kleine familieherinnering toe
step.6.body=Vertel als het past kort over je eerste sneeuw, een huisdier uit je jeugd of een uitspraak van je eigen grootouders. Leg onbekende namen uit.
step.7.title=Zeg welterusten, geef een naam en bewaar
step.7.body=Eindig met je gewone welterusten. Noem het bestand naar verhaal, verteller en jaar, bewaar het origineel en een tweede kopie onder familiebeheer.
quote.text=Perfectie klinkt geoefend. Nabijheid klinkt als oma die even naar de volgende regel zoekt.
quote.attribution=Sleep2Story-principe voor familieopnames
