problems.title=Haal eerst de druk weg, los dan de techniek op
problem.1.question=Ik vind mijn opgenomen stem niet mooi
problem.1.answer=Bijna iedereen vindt de eigen opname eerst vreemd. Probeer niet als een presentator te klinken; duidelijke woorden en herkenning zijn genoeg.
problem.2.question=We wonen ver weg en ik heb technische hulp nodig
problem.2.answer=Plan een korte oefenoproep, maar neem lokaal op met de dictafoon voor beter geluid. Stuur eerst de test en schrijf de drie benodigde knoppen op.
problem.3.question=Een heel verhaal lezen is vermoeiend
problem.3.answer=Neem één hoofdstuk of vijf minuten per keer op. Zit prettig, houd water bij de hand en stop voordat je stem moe wordt. Meerdere rustige delen werken prima.
problem.4.question=Onze familie spreekt meerdere talen of dialecten
problem.4.answer=Gebruik de taal waarin genegenheid vanzelf klinkt. Leg een woord uit in de andere taal, herhaal het afscheid of maak twee korte versies zonder je accent te verbergen.
problem.5.question=Het kind onderbreekt tijdens live voorlezen
problem.5.answer=Bouw het gesprek in. Stel een vraag, wacht drie seconden en ga verder met ‘Wat denk jij?’. Zo kan het kind tijdens afspelen meedoen.
faq.1.question=Hoe lang moet een opname van opa of oma zijn?
faq.1.answer=Begin met vijf tot vijftien minuten of één bekend hoofdstuk. Jonge kinderen houden van korte herhaling; oudere kinderen misschien van een familieherinnering in delen.
faq.2.question=Is videobellen niet genoeg?
faq.2.answer=Een livegesprek is fijn voor contact, maar een lokale opname klinkt meestal helderder en kan elke avond terugkomen. Beide vormen vullen elkaar aan.
faq.3.question=Moet het hele boek worden voorgelezen?
faq.3.answer=Alleen als dat prettig is en je de tekst mag opnemen. Een kort eigen verhaal, familieherinnering, toegestaan rijmpje of één hoofdstuk kan even waardevol zijn.
faq.4.question=Wie bewaart de opname?
faq.4.answer=Spreek dit vooraf af. Bewaar het origineel in een familieaccount, deel alleen met afgesproken mensen en vraag opnieuw toestemming voor nieuw gebruik van de stem.
