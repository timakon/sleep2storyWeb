answer.title=Izaberite priču koju unuče već voli, dodajte lični pozdrav i snimite čitanje telefonom u tihoj sobi.
answer.body=Ne treba vam glas spikera. Nadimak, osmeh i vaše uobičajene pauze čine snimak zaista porodičnim.
