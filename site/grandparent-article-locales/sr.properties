setup.title=Planirajte za jedno dete, ne za večnost
setup.lead=Počnite od slušaoca. Pitajte roditelje šta dete sada voli, koja imena prepoznaje i da li neka knjiga, porodična priča, brojalica ili uspavanka već pripada večernjoj rutini.
setup.body=Pet do petnaest minuta je dobar prvi cilj. Izaberite miran trenutak, stabilno položite telefon i unapred dogovorite gde će snimak biti sačuvan i ko sme da ga dobije.
kit.1.title=Poznata priča
kit.1.body=Izaberite svoju priču, tekst koji smete da snimite ili istinitu porodičnu uspomenu prilagođenu detetu.
kit.2.title=Lični pozdrav
kit.2.body=Zapišite ime, nadimak i jednu toplu početnu rečenicu.
kit.3.title=Telefon i tiha soba
kit.3.body=Napunite telefon, utišajte obaveštenja i napravite kratku probu u mirnoj, prijatno nameštenoj sobi.
steps.title=Sedam koraka od „zdravo“ do priče koja se ponovo sluša
step.1.title=Saznajte šta unuče voli baš sada
step.1.body=Dečja interesovanja se brzo menjaju. Proverite večernju rutinu, omiljene junake, dužinu pažnje i reči koje roditelji žele da izbegnu.
step.2.title=Izaberite tekst koji smete da snimite
step.2.body=Koristite svoju priču, delo u javnom domenu ili materijal za koji imate dozvolu. Privatni porodični snimak i javno deljenje knjige ne moraju imati ista pravila.
step.3.title=Počnite rečenicom koju samo vi govorite
step.3.body=Recite ime i mesto: „Dobro veče, Mila. Deka ti čita iz fotelje kraj prozora.“ Jedan stvaran detalj pretvara datoteku u malu posetu.
step.4.title=Napravite kratku probu uz pomoć roditelja
step.4.body=Snimite 30 sekundi i po potrebi pošaljite roditelju. Proveriće glasnoću i da li se datoteka otvara pre nego što snimite celu priču.
step.5.title=Čitajte kao da razgovarate
step.5.body=Zamislite dete pored sebe. Malo usporite, ali zadržite naglasak, omiljene izraze i blag humor. Posle pitanja ostavite pauzu da dete odgovori.
step.6.title=Dodajte jednu porodičnu uspomenu
step.6.body=Ako se uklapa, spomenite prvi sneg, ljubimca iz detinjstva ili izreku svojih baka i deka. Objasnite nepoznata imena i budite kratki.
step.7.title=Pozdravite se, nazovite i sačuvajte datoteku
step.7.body=Završite svojim uobičajenim „laku noć“. U naziv stavite priču, pripovedača i godinu, sačuvajte original i još jednu kopiju pod kontrolom porodice.
quote.text=Savršenstvo zvuči uglađeno. Bliskost zvuči kao baka koja nakratko traži sledeći red.
quote.attribution=Sleep2Story princip porodičnog snimanja
checklist.kicker=Pre slanja
checklist.title=Osam detalja koji snimak čine ličnim
checklist.1=Omiljeni oblik imena izgovoren je pravilno
checklist.2=Priča odgovara uzrastu i rutini
checklist.3=Svi znaju kako će se glas koristiti
checklist.4=Soba je tiha, obaveštenja isključena
checklist.5=Proba od 30 sekundi zvuči jasno
checklist.6=Uključena je porodična pojedinost ili izreka
checklist.7=Kraj je miran, a ne prekinut
checklist.8=Original ima jasan naziv i rezervnu kopiju
problems.title=Prvo sklonite pritisak, zatim rešite tehniku
problem.1.question=Ne sviđa mi se moj glas na snimku
problem.1.answer=Snimljeni glas skoro svima prvo zvuči čudno. Ne pokušavajte da budete spiker; važno je da su reči jasne i da vas unuče prepoznaje.
problem.2.question=Živimo daleko i potrebna mi je tehnička pomoć
problem.2.answer=Dogovorite kratak probni poziv, ali priču snimite lokalno u diktafonu. Prvo pošaljite test i zapišite tri dugmeta koja su vam potrebna.
problem.3.question=Čitanje cele priče je naporno
problem.3.answer=Snimajte jedno poglavlje ili pet minuta odjednom. Sedite udobno, držite vodu blizu i stanite pre zamora glasa. Nekoliko opuštenih delova je sasvim dobro.
problem.4.question=Porodica koristi više jezika ili dijalekata
problem.4.answer=Govorite jezikom na kojem nežnost zvuči prirodno. Objasnite nepoznatu reč na drugom jeziku, ponovite pozdrav ili napravite dve kratke verzije bez skrivanja naglaska.
problem.5.question=Dete stalno prekida čitanje uživo
problem.5.answer=Ugradite razgovor u snimak. Postavite pitanje, sačekajte tri sekunde i nastavite sa „Šta ti misliš?“. Dete tako učestvuje i tokom reprodukcije.
faq.1.question=Koliko treba da traje priča bake ili deke?
faq.1.answer=Počnite sa pet do petnaest minuta ili jednim poznatim poglavljem. Mlađa deca vole kratke priče koje ponavljaju, a starija porodičnu uspomenu u delovima.
faq.2.question=Zar video-poziv nije dovoljan?
faq.2.answer=Poziv uživo je divan za razgovor, ali lokalni audio-snimak obično zvuči jasnije i može se ponavljati pred spavanje. Slobodno koristite oba.
faq.3.question=Da li treba pročitati celu knjigu?
faq.3.answer=Samo ako vam je prijatno i smete da snimite tekst. Kratka originalna priča, porodična uspomena, dozvoljena pesmica ili jedno poglavlje mogu biti jednako vredni.
faq.4.question=Ko treba da čuva snimak?
faq.4.answer=Dogovorite se pre snimanja. Original držite na porodičnom nalogu, delite samo sa dogovorenim ljudima i ponovo tražite saglasnost za novu upotrebu glasa.
