answer.title=Alegeți o poveste pe care nepotul o iubește deja, adăugați un salut personal și înregistrați-o cu telefonul într-o cameră liniștită.
answer.body=Nu aveți nevoie de „voce de povestitor”. Alintul, râsul și pauzele proprii fac înregistrarea cu adevărat a familiei.
toc.1=Planul unei înregistrări personale
