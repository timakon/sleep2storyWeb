setup.title=Gândiți-vă la un copil, nu la posteritate
setup.lead=Porniți de la cel care va asculta. Întrebați părinții ce îi place copilului acum, ce nume recunoaște și ce carte, poveste de familie, rimă sau cântec face deja parte din seară.
setup.body=Cinci până la cincisprezece minute sunt suficiente la început. Alegeți un moment calm, așezați telefonul stabil și stabiliți dinainte unde va fi păstrat fișierul și cu cine poate fi împărtășit.
kit.1.title=O poveste cunoscută
kit.1.body=Alegeți un text propriu, unul permis sau o amintire adevărată spusă pe înțelesul copilului.
kit.2.title=Un salut personal
kit.2.body=Notați numele, alintul și o frază caldă pentru început.
kit.3.title=Telefon și cameră liniștită
kit.3.body=Încărcați telefonul, opriți notificările și faceți o probă scurtă într-o cameră primitoare.
steps.title=Șapte pași de la salut la povestea de reascultat
step.1.title=Întrebați ce îi place nepotului acum
step.1.body=Preferințele copiilor se schimbă repede. Aflați rutina de seară, personajele preferate, durata atenției și cuvintele pe care părinții vor să le evite.
step.2.title=Alegeți un text pe care îl puteți înregistra
step.2.body=Folosiți povestea proprie, o operă din domeniul public sau material autorizat. O înregistrare privată și publicarea unei cărți pot avea reguli diferite.
step.3.title=Începeți cu o frază pe care doar dumneavoastră o spuneți
step.3.body=Rostiți numele și locul: „Bună seara, Maia. Bunicul citește din fotoliul de lângă fereastră.” Un detaliu real transformă fișierul într-o vizită.
step.4.title=Faceți o probă scurtă cu părinții
step.4.body=Înregistrați 30 de secunde și trimiteți proba dacă aveți nevoie de ajutor. Părinții pot verifica volumul și deschiderea fișierului înainte de povestea întreagă.
step.5.title=Citiți ca într-o conversație
step.5.body=Imaginați-vă copilul alături. Încetiniți puțin, dar păstrați accentul, expresiile și umorul. După o întrebare lăsați o pauză pentru răspuns.
step.6.title=Adăugați o amintire mică de familie
step.6.body=Dacă se potrivește, povestiți despre prima zăpadă, un animal din copilărie sau o vorbă de la propriii bunici. Explicați numele necunoscute și fiți succinți.
step.7.title=Spuneți noapte bună, denumiți și salvați
step.7.body=Încheiați cu urarea obișnuită. Denumiți fișierul cu povestea, naratorul și anul, păstrați originalul și o copie administrată de familie.
quote.text=Perfecțiunea sună repetat. Apropierea sună ca bunica oprindu-se o clipă să-și amintească rândul următor.
quote.attribution=Principiul Sleep2Story pentru înregistrări de familie
checklist.kicker=Înainte de trimitere
checklist.title=Opt detalii care fac înregistrarea personală
checklist.1=Numele preferat al copilului este rostit corect
checklist.2=Povestea se potrivește vârstei și rutinei
checklist.3=Toți știu cum va fi folosită vocea
checklist.4=Camera e liniștită, notificările sunt oprite
checklist.5=Proba de 30 de secunde se aude clar
checklist.6=Există un detaliu sau o expresie de familie
checklist.7=Finalul e calm, nu brusc
checklist.8=Originalul are nume clar și copie de siguranță
problems.title=Înlăturați presiunea, apoi rezolvați tehnologia
problem.1.question=Nu îmi place vocea mea înregistrată
problem.1.answer=Aproape tuturor li se pare ciudată la început. Nu încercați să sunați ca un crainic; contează cuvintele clare și faptul că nepotul vă recunoaște.
problem.2.question=Locuim departe și am nevoie de ajutor tehnic
problem.2.answer=Programați un apel scurt de probă, dar înregistrați local cu reportofonul pentru sunet mai bun. Trimiteți testul și notați cele trei butoane necesare.
problem.3.question=E obositor să citesc toată povestea
problem.3.answer=Înregistrați un capitol sau cinci minute odată. Stați comod, țineți apă aproape și opriți-vă înainte să obosească vocea. Mai multe părți calme funcționează foarte bine.
problem.4.question=Familia folosește mai multe limbi sau dialecte
problem.4.answer=Vorbiți în limba în care afecțiunea vine firesc. Explicați un cuvânt în cealaltă limbă, repetați despărțirea sau faceți două versiuni scurte fără să ascundeți accentul.
problem.5.question=Copilul întrerupe când citesc în direct
problem.5.answer=Includeți dialogul în înregistrare. Puneți o întrebare, așteptați trei secunde și continuați cu „Tu ce crezi?”. Copilul poate participa și la redare.
faq.1.question=Cât ar trebui să dureze povestea unui bunic?
faq.1.answer=Începeți cu cinci până la cincisprezece minute sau un capitol cunoscut. Cei mici preferă repetiții scurte, iar cei mari o amintire în episoade.
faq.2.question=Nu este suficient un apel video?
faq.2.answer=Apelurile sunt minunate pentru conversație, dar o înregistrare locală se aude de obicei mai clar și poate însoți multe seri. Cele două se completează.
faq.3.question=Trebuie citită toată cartea?
faq.3.answer=Doar dacă este confortabil și aveți dreptul de a înregistra textul. O poveste proprie, o amintire, o rimă permisă sau un capitol pot fi la fel de valoroase.
faq.4.question=Cine ar trebui să păstreze înregistrarea?
faq.4.answer=Stabiliți înainte. Păstrați originalul într-un cont de familie, distribuiți-l doar persoanelor agreate și cereți din nou acordul pentru o utilizare nouă a vocii.
