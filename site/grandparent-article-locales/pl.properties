answer.title=Wybierz bajkę, którą wnuk już lubi, dodaj osobiste powitanie i nagraj czytanie telefonem w cichym pokoju.
answer.body=Nie potrzebujesz głosu lektora. Domowe zdrobnienie, śmiech i własne pauzy sprawiają, że nagranie naprawdę należy do rodziny.
toc.1=Jak zaplanować osobiste nagranie
toc.2=Siedem kroków dla dziadków
toc.3=Wspomnienia warte zachowania
toc.4=Nagrywanie bez stresu
toc.6=Pytania rodzin
setup.title=Planuj dla jednego dziecka, nie „dla potomności”
setup.lead=Zacznij od słuchacza. Zapytaj rodziców, co dziecko teraz lubi, jakie imiona rozpoznaje i czy książka, rodzinna historia, rymowanka lub kołysanka już towarzyszy zasypianiu.
setup.body=Na początek wystarczy pięć–piętnaście minut. Wybierz spokojną porę, połóż telefon stabilnie i wcześniej ustal, gdzie nagranie będzie przechowywane oraz kto może je dostać.
kit.1.title=Znajoma historia
kit.1.body=Wybierz własną bajkę, dozwolony tekst albo prawdziwe rodzinne wspomnienie opowiedziane językiem dziecka.
kit.2.title=Osobiste powitanie
kit.2.body=Zapisz obok imię, zdrobnienie i jedno ciepłe zdanie na początek.
kit.3.title=Telefon i cichy pokój
kit.3.body=Naładuj telefon, wycisz powiadomienia i zrób krótki test w miękko urządzonym pokoju.
steps.title=Siedem kroków od „cześć” do bajki na wiele wieczorów
step.1.title=Sprawdź, co wnuk lubi właśnie teraz
step.1.body=Dziecięce upodobania szybko się zmieniają. Zapytaj o wieczorny rytuał, ulubione postacie, długość skupienia i słowa, których rodzice wolą unikać.
step.2.title=Wybierz tekst, który wolno nagrywać
step.2.body=Użyj własnej historii, utworu z domeny publicznej albo materiału z pozwoleniem. Prywatne rodzinne nagranie i publiczne udostępnianie książki mogą podlegać innym zasadom.
step.3.title=Zacznij od zdania, które powiesz tylko ty
step.3.body=Wymień dziecko i miejsce: „Dobry wieczór, Maju. Dziadek czyta dziś z fotela przy oknie”. Jeden prawdziwy szczegół zamienia plik w małą wizytę.
step.4.title=Zrób krótki test z pomocą rodziców
step.4.body=Nagraj 30 sekund i w razie potrzeby wyślij rodzicowi. Sprawdzi głośność oraz czy plik otwiera się na jego telefonie, zanim nagrasz całość.
step.5.title=Czytaj jak podczas rozmowy
step.5.body=Wyobraź sobie dziecko obok. Zwolnij odrobinę, ale zachowaj swój akcent, powiedzonka i humor. Po pytaniu zostaw pauzę, aby mały słuchacz mógł odpowiedzieć.
step.6.title=Dodaj jedno rodzinne wspomnienie
step.6.body=Jeśli pasuje, wspomnij pierwszy śnieg, zwierzę z dzieciństwa albo powiedzenie własnych dziadków. Wyjaśnij nieznane imiona i nie przeciągaj dygresji.
step.7.title=Pożegnaj się, nazwij plik i zrób kopię
step.7.body=Zakończ zwykłym życzeniem dobrej nocy. W nazwie wpisz tytuł, osobę i rok, zachowaj oryginał oraz drugą kopię w rodzinnym miejscu.
quote.text=Perfekcja brzmi gładko. Bliskość brzmi jak babcia, która na chwilę szuka kolejnego zdania.
quote.attribution=Zasada rodzinnych nagrań Sleep2Story
checklist.kicker=Przed wysłaniem
checklist.title=Osiem szczegółów, które nadają nagraniu osobisty charakter
checklist.1=Ulubiona forma imienia dziecka brzmi poprawnie
checklist.2=Bajka pasuje do wieku i wieczornego rytuału
checklist.3=Każdy wie, jak głos będzie używany
checklist.4=Pokój jest cichy, powiadomienia wyłączone
checklist.5=30-sekundowy test brzmi wyraźnie
checklist.6=Jest rodzinny szczegół lub znajome powiedzonko
checklist.7=Zakończenie jest spokojne, nie urwane
checklist.8=Oryginał ma jasną nazwę i kopię zapasową
problems.title=Najpierw zdejmij presję, potem rozwiąż technikę
problem.1.question=Nie podoba mi się mój głos na nagraniu
problem.1.answer=Większości osób nagrany głos wydaje się obcy. Nie próbuj brzmieć jak lektor. Liczy się wyraźna mowa i to, czy wnuk cię rozpozna.
problem.2.question=Mieszkamy daleko i potrzebuję pomocy technicznej
problem.2.answer=Umów krótki próbny telefon, lecz bajkę nagraj lokalnie w dyktafonie. Najpierw wyślij test i zapisz na kartce trzy przyciski potrzebne do pełnego nagrania.
problem.3.question=Cała bajka jest zbyt męcząca
problem.3.answer=Nagraj jeden rozdział albo pięć minut naraz. Usiądź wygodnie, miej wodę pod ręką i przerwij przed zmęczeniem głosu. Kilka spokojnych części jest lepszych niż jeden ciężki dubel.
problem.4.question=W rodzinie używamy kilku języków lub gwary
problem.4.answer=Mów językiem, w którym czułość brzmi naturalnie. Możesz wyjaśnić słowo w drugim języku, powtórzyć pożegnanie albo nagrać dwie krótkie wersje bez ukrywania akcentu.
problem.5.question=Dziecko ciągle przerywa podczas czytania na żywo
problem.5.answer=Wbuduj rozmowę w nagranie. Zadaj pytanie, odczekaj trzy sekundy i powiedz „A jak ty myślisz?”. Dziecko może uczestniczyć także podczas odtwarzania.
faq.1.question=Jak długa powinna być bajka od babci lub dziadka?
faq.1.answer=Zacznij od pięciu–piętnastu minut albo jednego znanego rozdziału. Młodsze dzieci wolą krótkie powtórki, starsze mogą polubić rodzinne wspomnienie w częściach.
faq.2.question=Czy rozmowa wideo nie wystarczy?
faq.2.answer=Rozmowa na żywo jest świetna do kontaktu, ale lokalne nagranie zwykle brzmi wyraźniej i można je włączać każdego wieczoru. Warto łączyć obie formy.
faq.3.question=Czy trzeba przeczytać całą książkę?
faq.3.answer=Tylko jeśli jest ci wygodnie i wolno nagrywać tekst. Krótka własna bajka, rodzinne wspomnienie, dozwolona rymowanka lub jeden rozdział mogą znaczyć równie wiele.
faq.4.question=Kto powinien przechowywać nagranie?
faq.4.answer=Ustalcie to wcześniej. Trzymaj oryginał na rodzinnym koncie, udostępniaj tylko uzgodnionym osobom i pytaj ponownie o zgodę przed nowym użyciem głosu.
