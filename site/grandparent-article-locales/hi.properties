problems.title=पहले दबाव कम करें, फिर तकनीक देखें
problem.1.question=रिकॉर्डिंग में अपनी आवाज़ पसंद नहीं आती
problem.1.answer=अधिकांश लोगों को रिकॉर्डिंग में अपनी आवाज़ कुछ अलग लगती है। रेडियो प्रस्तुतकर्ता जैसी आवाज़ पाने की कोशिश न करें। बस देखें कि शब्द साफ़ हैं और बच्चा आपको पहचान लेगा; यही सही कसौटी है।
problem.2.question=हम दूर रहते हैं और तकनीकी मदद चाहिए
problem.2.answer=माता-पिता के साथ छोटी अभ्यास कॉल रखें, लेकिन साफ़ आवाज़ के लिए फ़ोन के रिकॉर्डर में स्थानीय रिकॉर्डिंग करें। पहले नमूना भेजें और पूरी रिकॉर्डिंग में इस्तेमाल होने वाले वही तीन बटन लिख लें।
problem.3.question=पूरी कहानी पढ़ना थका देता है
problem.3.answer=एक बार में एक अध्याय या पाँच मिनट रिकॉर्ड करें। आराम से बैठें, पानी पास रखें और आवाज़ पर ज़ोर आने से पहले रुकें। कई छोटी, सहज रिकॉर्डिंग एक थका देने वाली लंबी रिकॉर्डिंग से बेहतर हैं।
problem.4.question=हमारे घर में एक से ज़्यादा भाषाएँ या बोलियाँ हैं
problem.4.answer=जिस भाषा में प्यार सबसे सहज लगे, उसी में बोलें। दूसरे भाषा का अपरिचित शब्द समझा सकते हैं, विदाई की बात दोहरा सकते हैं या अपनी बोली दबाए बिना छोटे अलग संस्करण बना सकते हैं।
problem.5.question=सामने कहानी पढ़ते समय बच्चा बीच में बोलता है
problem.5.answer=बातचीत को रिकॉर्डिंग में जगह दें। सवाल पूछें, तीन सेकंड रुकें और फिर कहें, “तुम्हें क्या लगा?” बच्चा बाद में सुनते हुए भी शामिल हो पाएगा।
faq.1.question=दादा-दादी या नाना-नानी की रात की रिकॉर्डिंग कितनी लंबी हो?
faq.1.answer=पाँच से पंद्रह मिनट या किसी परिचित किताब के एक अध्याय से शुरू करें। छोटा बच्चा बहुत छोटी कहानी बार-बार सुनना चाहेगा; बड़ा बच्चा हिस्सों में सुनाई गई लंबी पारिवारिक याद पसंद कर सकता है।
faq.2.question=क्या फ़ोन या वीडियो कॉल ही काफ़ी है?
faq.2.answer=सीधी कॉल बातचीत के लिए अच्छी है, लेकिन फ़ोन में स्थानीय रिकॉर्डिंग आम तौर पर साफ़ होती है और रात की दिनचर्या का हिस्सा बन सकती है। दोनों कर सकते हैं: पहले बात करें, फिर दोबारा सुनने के लिए अलग रिकॉर्डिंग भेजें।
faq.3.question=क्या दादी या दादा पूरी किताब पढ़ें?
faq.3.answer=केवल तब, जब उन्हें सहज लगे और पाठ रिकॉर्ड करने का अधिकार हो। अपनी छोटी कहानी, पारिवारिक याद, उपयोग की अनुमति वाली बाल कविता या एक स्वीकृत अध्याय भी उतना ही अर्थपूर्ण हो सकता है।
faq.4.question=रिकॉर्डिंग किसके पास रहे?
faq.4.answer=यह पहले तय कर लें। मूल रिकॉर्डिंग परिवार के नियंत्रण वाले खाते या ड्राइव में रखें, सहमति में बताए लोगों तक साझा करना सीमित रखें और आवाज़ के नए उपयोग से पहले फिर अनुमति माँगें।
