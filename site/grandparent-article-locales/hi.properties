setup.title=रिकॉर्डिंग बच्चे के लिए करें, किसी स्मारक के लिए नहीं
setup.lead=पहले उस बच्चे के बारे में सोचें जो सुनेगा। माता-पिता से पूछें कि उसे इन दिनों क्या पसंद है, कौन-से नाम वह पहचानता है और क्या कोई किताब, परिवार की कहानी, कविता या लोरी पहले से उसकी रात का हिस्सा है।
setup.body=पहली बार पाँच से पंद्रह मिनट की रिकॉर्डिंग अच्छा लक्ष्य है। ऐसा समय चुनें जब जल्दी न हो, फ़ोन स्थिर जगह पर रखें और शुरू करने से पहले परिवार को बताएँ कि रिकॉर्डिंग कहाँ रखी और किससे साझा की जाएगी।
kit.1.title=परिचित कहानी
kit.1.body=ऐसी किताब चुनें जिसे रिकॉर्ड करने की अनुमति हो, अपनी रची कहानी या बच्चे की समझ के शब्दों में सुनाई गई सच्ची पारिवारिक याद।
kit.2.title=अपना अभिवादन
kit.2.body=बच्चे का नाम, प्यार से पुकारने वाला नाम और एक प्यारी शुरुआती पंक्ति लिखकर पास रखें।
kit.3.title=शांत फ़ोन सेटअप
kit.3.body=फ़ोन चार्ज करें, सूचनाएँ बंद करें और शांत, कम गूँज वाले कमरे में छोटी जाँच रिकॉर्डिंग करें।
steps.title=अभिवादन से बार-बार सुनी जाने वाली कहानी तक: सात कदम
step.1.title=पूछें कि बच्चा अभी क्या पसंद करता है
step.1.body=बच्चों की पसंद जल्दी बदलती है। सोने की मौजूदा दिनचर्या, ध्यान की अवधि, पसंदीदा पात्र और ऐसे शब्द जान लें जिनसे माता-पिता बचना चाहें। खास उसी बच्चे के लिए चुनी कहानी सामान्य प्रदर्शन से कहीं ज़्यादा अपनी लगेगी।
step.2.title=ऐसा पाठ चुनें जिसे रिकॉर्ड कर सकें
step.2.body=अपनी कहानी, सार्वजनिक अधिकार क्षेत्र की रचना या अनुमति मिला पाठ उपयोग करें। प्रकाशित किताब पढ़ते समय निजी पारिवारिक उपयोग और सार्वजनिक साझा करने के नियम अलग हो सकते हैं, इसलिए लागू अधिकार जाँचें।
step.3.title=शुरुआत ऐसी बात से करें जो केवल आप कहेंगे
step.3.body=बच्चे का नाम और रिकॉर्डिंग की जगह बताएँ: “शुभ रात्रि, माया। दादाजी खिड़की के पास वाली कुर्सी पर बैठकर कहानी पढ़ रहे हैं।” एक छोटा ठोस विवरण ऑडियो फ़ाइल को मुलाक़ात जैसा बना देता है।
step.4.title=पहले छोटा नमूना रिकॉर्ड करें
step.4.body=तीस सेकंड रिकॉर्ड करके ज़रूरत हो तो माता-पिता को भेजें। पूरी कहानी पर समय लगाने से पहले वे बता सकेंगे कि आवाज़ साफ़ सुनाई देती है और उनके फ़ोन पर फ़ाइल खुलती है।
step.5.title=बातचीत की रफ़्तार से पढ़ें
step.5.body=कल्पना करें कि बच्चा आपके पास बैठा है। थोड़ा धीमे पढ़ें, लेकिन अपना लहजा, बोलचाल और हल्का मज़ाक बनाए रखें। सवाल के बाद रुकें ताकि बच्चा जवाब दे सके, भले रिकॉर्डिंग उसे सुन न पाए।
step.6.title=परिवार की एक छोटी याद जोड़ें
step.6.body=कहानी से मेल खाए तो कोई छोटी याद सुनाएँ: पहली बार बर्फ़ देखना, बचपन का पालतू जानवर या आपके दादा-दादी की कही बात। उसे संक्षिप्त रखें और अपरिचित नाम समझा दें।
step.7.title=शुभ रात्रि कहें, फ़ाइल को नाम दें और बैकअप रखें
step.7.body=अंत में वही शुभ रात्रि वाली बात कहें जो आमने-सामने कहते हैं। फ़ाइल का नाम कहानी, पढ़ने वाले और साल के साथ रखें; मूल रिकॉर्डिंग बचाएँ और परिवार के नियंत्रण वाली जगह पर दूसरी प्रति रखें।
quote.text=बिल्कुल सही रिकॉर्डिंग चमकदार लगती है। अपनापन तब सुनाई देता है जब दादी अगली पंक्ति याद करने को ज़रा रुकती हैं।
