sticker.line1=从孩子的
sticker.line2=名字讲起
answer.title=选一个孙辈已经喜欢的故事，加一句专属问候，在安静房间用手机录下来，保留那些最像你自己的自然表达。
answer.body=不必刻意模仿“讲故事的声音”。昵称、笑声、停顿方式这些小细节，才让录音真正属于你们的家。
toc.1=准备一段专属录音
toc.2=祖辈录音的七个步骤
toc.3=值得留下的故事线索
toc.4=让录音更轻松
toc.6=家人常问的问题
setup.title=为眼前这个孩子准备，而不是为了留档
setup.lead=先想想谁会听。问问家长，孩子现在喜欢什么、认得哪些名字，睡前是否已经有熟悉的绘本、家里的故事、儿歌或摇篮曲。
setup.body=第一次可以先以五到十五分钟为目标。挑个不赶时间的时段，把手机放稳；开始前，先和家人说清楚录音会怎样保存、分享。
kit.1.title=熟悉的故事
kit.1.body=选一本你有权录制的书、自己编的故事，或一段用孩子能懂的话讲述的真实家庭回忆。
kit.2.title=专属问候
kit.2.body=把孩子的名字、昵称和一句温暖的开场白写在手边的纸上。
kit.3.title=安静的手机录音环境
kit.3.body=给手机充电、关闭通知，先在柔软安静的房间里试录一小段。
steps.title=从一句问候，到孩子想反复听的故事：七个步骤
step.1.title=问问孙辈最近喜欢什么
step.1.body=孩子的喜好变化很快。了解现在的睡前习惯、注意力能维持多久、喜欢哪些角色，以及家长希望避开哪些词语。为这个孩子挑选的故事，比泛泛的表演更亲近。
step.2.title=选一段可以录制的内容
step.2.body=使用自己写的故事、已进入公有领域的作品，或已取得录制许可的材料。如果朗读出版书籍，私人家庭使用和公开分享可能适用不同规定，请确认相关权利。
step.3.title=用只有你会说的方式开场
step.3.body=叫一声孩子的名字，说说你在哪里录音：“晚上好，小雅。爷爷坐在窗边的椅子上，给你读一个故事。”一个具体的小细节，就能让音频像一次探望。
step.4.title=先试录一小段
step.4.body=录 30 秒。如果需要帮助，可以先发给家长，让他们确认声音够清楚、文件能在设备上打开，再花时间录完整故事。
step.5.title=用聊天的节奏朗读
step.5.body=想象孩子就在身边。稍微放慢一点，但保留自己的口音、常用词和温和的幽默。问完问题停一停，让小听众有机会回答，即使录音听不到回应。
step.6.title=加入一段简短的家庭回忆
step.6.body=如果和故事合适，可以说说你第一次看见雪、小时候养过的宠物，或从自己的祖辈那里听来的话。说得简短一些，并解释孩子不认识的名字。
step.7.title=道晚安、命名并备份
step.7.body=用平时见面时说的那句话结束故事。文件名写上故事、朗读者和年份；保留原始录音，并在家人能掌控的地方再存一份。
quote.text=完美听起来很精致。真正的亲近，是奶奶想起下一句时那一个小小的停顿。
quote.attribution=Sleep2Story 家庭录音原则
checklist.kicker=发送之前
checklist.title=让录音充满个人心意的八个细节
checklist.1=孩子喜欢的名字念对了
checklist.2=故事适合孩子的年龄和眼下的睡前习惯
checklist.3=家人都了解这段声音会怎样使用
checklist.4=房间安静，通知已关闭
checklist.5=回听 30 秒测试录音，声音清晰
checklist.6=加入了一处家庭细节或熟悉的话
checklist.7=结尾平和，没有戛然而止
checklist.8=原始文件命名清楚，已经备份
problems.title=先放下压力，再解决技术问题
problem.1.question=我不喜欢录音里的自己
problem.1.answer=很多人都觉得自己录下来的声音陌生。不必追求播音员的音色；只要话说得清楚，孩子能认出你，这就足够了。
problem.2.question=我们住得很远，我需要别人帮忙
problem.2.answer=可以先和家长通个简短的练习电话，但正式录音最好用手机自带的录音工具在本地完成，声音通常更清楚。先发送测试文件，再记下正式录制要用的几个按钮。
problem.3.question=读完整个故事太累
problem.3.answer=每次只录一章或五分钟。坐得舒服一点，把水放在手边，在嗓子疲劳前停下。几段轻松的短录音，胜过一次勉强撑完的长录音。
problem.4.question=家里会说不止一种语言或方言
problem.4.answer=用最能自然表达亲近感的语言讲。可以顺手解释另一种语言中的陌生词，重复一句晚安，或者分别录几个短版本，不必刻意抹平自己的口音。
problem.5.question=平时读书时孩子总爱插话
problem.5.answer=把互动留在录音里。问一个问题，停三秒，再接着说“你觉得呢？”孩子回听时仍然可以参与。
faq.1.question=祖辈录的睡前故事多长合适？
faq.1.answer=先从五到十五分钟，或孩子熟悉的一章开始。年纪小的孩子可能更喜欢能反复听的短故事；大一点的孩子也许会喜欢分段讲的较长家庭回忆。
faq.2.question=打电话或视频通话不就够了吗？
faq.2.answer=实时通话很适合聊天，但用手机本地录的声音通常更清楚，也能成为固定的睡前习惯。两种都可以：平时实时聊天，另留一段能反复播放的录音。
faq.3.question=爷爷奶奶或外公外婆需要把整本书读完吗？
faq.3.answer=只有在读起来不吃力、也有权录制这段文字时才需要。简短的原创故事、家庭回忆、可以使用的童谣，或获准录制的一章，同样有意义。
faq.4.question=录音应该由谁保管？
faq.4.answer=开始前先说好。把原始文件存进家人可控的账户或网盘，只分享给约定的人。如果以后要把这段声音用于新的目的，记得重新征求同意。
