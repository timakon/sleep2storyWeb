figure.alt=رسم دافئ لوالد متعب بجانب طفله، مع كتاب مفتوح ومصباح صغير قرب السرير
figure.caption=يمكن أن تكون الحكاية أقصر الليلة، وأن تظل اللحظة مشتركة.
intro.title=حدّد ما الذي يحتاج إلى تخفيف
intro.body1=أحيانًا تكون المشكلة في طول الكتاب. وأحيانًا لا تقدر على تقليد أصوات الشخصيات مرة أخرى. وقد يؤلمك حلقك فتغدو القراءة بصوت عالٍ غير مريحة. لكل حالة خيار مختلف: الكتاب الأقصر يخفف التعب، لكنه لا يعالج صوتًا يحتاج إلى راحة.
intro.body2=قبل أن تعرض خيارًا، حدّد ما تستطيع فعله فعلًا. «هاتان الصفحتان أم حكايتنا المسجّلة؟» أسهل من «اختر أي شيء». لا تحتاج إلى البحث عن حكاية جديدة مثالية بينما ينتظر طفلك. ابدأ بكتاب أو تسجيل أو شخص بالغ متاح لعائلتك الآن.
tonight.kicker=ابدأ بما هو متاح
tonight.title=أربع طرق للإبقاء على الحكاية في روتين الليلة
tonight.lead=اختر طريقة واحدة بدلًا من تجربة الأربع. وإذا كان طفلك مستعدًا للنوم، فانتقل مباشرةً إلى تصبح على خير المعتادة.
option.1.title=اقرأ جزءًا أصغر من كتاب مألوف
option.1.body1=عندما تكون متعبًا لكن الكلام مريح، اختر حكاية قصيرة واحدة أو صفحتين مفضّلتين أو فصلًا واحدًا. أخبر طفلك أين ستتوقف قبل البداية. ويمكن لعلامة الكتاب أن تُبقي للحكاية الطويلة مكانًا واضحًا حتى الغد.
option.1.body2=استخدم صوتك المعتاد. يمكنك الاستغناء عن أصوات الشخصيات والمؤثرات المبالغ فيها. وإذا طلب طفلك المزيد، اختم بوضوح: «هذه حكايتنا لليلة. نكمل من هذه الصفحة غدًا». المهم أن تناسب المدّة كليكما، لا قاعدة تحدد كم دقيقة يقرأ الوالد الجيد.
option.2.title=دع الصور تحمل الحكاية
option.2.body1=افتح كتابًا يعرفه طفلك وادعه إلى الإشارة إلى الصور أو تقليب صفحة أو إخبارك بما يراه. ويمكن للطفل الذي لم يبدأ بعد في رواية القصص أن يختار صورة يحبها فحسب. استمع وابتسم أو أومئ؛ ليس مطلوبًا أن تتحوّل اللحظة إلى درس.
option.2.body2=جرّب دعوة بسيطة مثل «أرني أين ذهب الدب الصغير». إذا كان الكلام يزعجك، فلتقم الإشارات وتقليب الصفحات بالمهمة. وإذا لم يرغب طفلك في المشاركة، فاختر طريقة أخرى. ليس عليه أن يروي الكتاب كله لأن الشخص البالغ متعب.
option.3.title=سلّم القراءة لشخص آخر مع نهاية واضحة
option.3.body1=إذا كان هناك شخص بالغ موثوق، فاطلب منه تولّي مهمة محددة: هذا الكتاب، وهذه الصفحات، ثم عبارة تصبح على خير المعتادة. ابقَ قريبًا إن ناسَب عائلتكم، أو دعه يكمل. ليس عليه أن يقلّد أسلوب قراءتك حرفيًا.
option.3.body2=قد يشارك قريب عبر مكالمة إذا سمح الوقت ومزاج الطفل. اتفقوا على حكاية واحدة مسبقًا. قد تتحوّل المكالمة المباشرة إلى حديث حماسي طويل، فاجعلها خيارًا لا ترتيبا يجب فرضه وقت النوم. أما التسجيل السابق فلا يحتاج إلى تنسيق التوقيت بين بلدين.
option.4.title=شغّل حكاية صوتية اخترتها مسبقًا
option.4.body1=يمكن لتسجيل عائلي مألوف أو حكاية صوتية مناسبة للعمر أن يتولى السرد بينما تستريح. اختر الملف بنفسك، وتحقق من بدايته ونهايته، واضبط إيقاف التشغيل بعد الحكاية إذا أتاح المشغّل ذلك. اجعل الصوت مريحًا، وأبعد الجهاز وأي أسلاك عن متناول طفلك.
option.4.body2=ابدأ تشغيل الصوت ثم اترك الشاشة. إذا أراد طفلك الكتاب، فليتصفحه مع التسجيل. ابقَ متاحًا للأسئلة أو لتغيير الرأي. وإذا جعل الصوت هذه الليلة أكثر انشغالًا، فأوقفه وعُد إلى خيار أهدأ. لا حاجة إلى إنشاء حساب جديد أو تصفّح توصيات طويلة الليلة.
voice.title=التهاب الحلق سبب كافٍ لتغيير خطة القراءة
voice.body1=إذا كان صوتك مبحوحًا أو متعبًا، فأرحه؛ والهمس ليس حلًا بديلًا. هذه إرشادات للعناية بالصوت من المعهد الوطني الأمريكي للصمم واضطرابات التواصل الأخرى (NIDCD).
voice.link=اقرأ إرشادات NIDCD للعناية بالصوت
voice.body2=اختر لوقت الحكاية ما لا يتطلب منك الكلام: شخصًا بالغًا آخر، أو تسجيلًا موجودًا، أو تصفّح الصور معًا. تسجيل عيّنة صوتية جديدة الليلة يُتعب الصوت الذي تحاول إراحته. حضّرها لاحقًا. يقدّم هذا المقال بدائل للقراءة، لا تشخيصًا أو علاجًا؛ اطلب مشورة طبية إذا أقلقتك الأعراض أو لم تتحسّن.
words.title=ماذا تقول عندما يطلب طفلك سماع صوتك؟
words.intro=غالبًا ما يكون تفسير قصير وخيار واضح أسهل من مفاوضة طويلة. هذه عبارات يمكنك تكييفها، وليست كلمات يجب أن تقولها بحذافيرها. وإذا آلمك الكلام، يمكن لشخص بالغ آخر شرح الخطة.
words.1.label=حين تكون طاقتك قليلة جدًا
words.1.text=«أنا متعب جدًا الليلة. يمكننا قراءة هاتين الصفحتين معًا، ثم نقول تصبح على خير».
words.2.label=حين يحتاج صوتك إلى راحة
words.2.text=«صوتي يحتاج إلى راحة. لننظر إلى الصور معًا بينما يقرأ لنا شخص آخر».
words.3.label=حين يكون لديك تسجيل محفوظ
words.3.text=«الليلة سيقرأ لنا التسجيل الحكاية، وسأجلس بجانبك ونحن نستمع».
words.end=إذا لم يناسبكم أي خيار، فأغلقوا الكتاب واستخدموا عبارة تصبح على خير المعتادة. يمكنكم قراءة حكاية في وقت آخر. لا يحتاج هذا المساء إلى نشاط بديل لكل دقيقة خططتم لقضائها في القراءة.
backup.title=حضّر حكاية احتياطية صغيرة في يوم أفضل
backup.lead=تحتاج إلى بداية بسيطة، لا إلى مشروع ثانٍ لإدارته. في يوم تكون فيه لديك طاقة وصوتك مرتاح، سهّل المساء المتعب المقبل بثلاث خطوات.
backup.1.title=اختر حكاية قصيرة مفضّلة يحق لك تسجيلها
backup.1.body=استخدم حكاية من تأليفك أو نصًا لديك إذن بتسجيله واستخدامه. تجعل البداية المألوفة والنهاية الواضحة الاختيار سهلًا لاحقًا. وإذا كان الكتاب طويلًا، فاختر مقطعًا قصيرًا مسموحًا بدلًا من الوعد بإكماله كله في جلسة واحدة.
backup.2.title=سجّل، واستمع، وسمِّ الملف بوضوح
backup.2.body=تسجيل الهاتف بداية عملية. استمع مرة للتأكد من وضوح الكلمات واكتمال النهاية. ضمّن اسم الحكاية واسم القارئ في الملف، واحتفظ بالأصل في مكان تتحكّم فيه. وإذا سجّل أحد أفراد العائلة الحكاية، فاتفقوا على كيفية استخدام صوته وتسجيله.
backup.3.title=جرّب التشغيل قبل أن تحتاج إليه
backup.3.body=افتح التسجيل على الجهاز الذي ستستخدمه فعلًا عند النوم. تحقّق مما إذا كان يحتاج إلى الإنترنت، وما إذا كان الصوت يستمر عند إغلاق الشاشة، وما الذي يُشغَّل بعده؛ فهذه الميزات تختلف بحسب المشغّل. ضع الحكاية المختارة في مكان يجده شخص بالغ من غير تصفّح مكتبة كاملة.
backup.note=تريد مساعدة في التسجيل نفسه؟ يشرح دليل التسجيل بالهاتف اختيار الغرفة، وتجربة صوت قصيرة، وحل المشكلات المعتادة. وإذا كان لديكم روتين يناسبكم بالفعل، فاحتفظوا به؛ المطلوب أن ينسجم التسجيل الاحتياطي معه.
product.eyebrow=يجري تجهيزه لنظامَي iOS وAndroid
product.title=صوت عائلي مألوف، يُحضَّر مسبقًا
product.body=يُطوَّر Sleep2Story لهذا النوع من التحضير. يسجّل شخص بالغ عيّنة صوتية بموافقة صاحب الصوت ويضيف النص الكامل للحكاية. يُعدّ التطبيق سردًا اصطناعيًا بصوت فرد العائلة المختار للاستماع إليه في مكتبة شخصية. لا يكتب الحكاية ولا يحتفظ بأداء القارئ الأصلي للكلمات نفسها.
product.body2=التطبيق غير متاح بعد في المتاجر. استخدم الليلة خيارًا لديك بالفعل. يُجهَّز Sleep2Story للأمسيات المقبلة، وليس علاجًا فوريًا للتعب أو ألم الصوت.
