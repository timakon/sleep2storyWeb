answer.title=اختر شكل وقت الحكاية الذي تستطيع تقديمه الليلة.
answer.body=إذا كان صوتك بخير، فاقرأ جزءًا قصيرًا جدًا من حكاية مفضّلة أو تصفّحا كتابًا معًا. وإذا كان الكلام يؤلمك، فاطلب من شخص بالغ موثوق أن يقرأ أو شغّل تسجيلًا متاحًا. حافظ على عبارة تصبح على خير المألوفة، واترك تسجيل حكاية جديدة ليوم يكون صوتك فيه مرتاحًا.
