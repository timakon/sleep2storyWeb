faq.title=أسئلة الأمسيات المتعبة
faq.1.question=هل يجوز أن نتجاوز حكاية ما قبل النوم الليلة؟
faq.1.answer=إذا كانت القراءة فوق طاقتك الليلة، فاحتفظ بعبارة تصبح على خير واعرض الكتاب في وقت آخر. الحكاية الأقصر أو تصفّح الصور أو قارئ آخر خيارات، لا مهام إضافية يجب إنجازها. اختر ما يناسب عائلتك.
faq.2.question=ماذا إذا كان حلقي يؤلمني لكن طفلي يريدني أن أقرأ؟
faq.2.answer=اشرح باختصار أن صوتك يحتاج إلى راحة، أو اطلب من شخص بالغ آخر الشرح. اعرض الصور أو قارئًا آخر أو تسجيلًا موجودًا. لا تحتاج إلى إعداد تسجيل جديد وصوتك متعب. اتبع المشورة الطبية المناسبة لأعراضك.
faq.3.question=هل تحل الحكاية الصوتية محل القراءة المباشرة؟
faq.3.answer=يمكنها أن تتولى السرد في أمسية معيّنة، لكنها تجربة مختلفة عن الحديث مع الطفل حول الكتاب. يمكن لشخص بالغ أن يظل حاضرًا ويوقف التسجيل ويجيب عن الطفل. هذا خيار عملي، لا ادّعاء بأن فوائد الصوت والقراءة المشتركة متطابقة.
faq.4.question=ماذا لو لم يكن لدينا تسجيل جاهز؟
faq.4.answer=ابدأ بما هو متاح: كتاب أقصر إذا كان الكلام مريحًا، أو تصفّح الصور، أو قارئ آخر موثوق. لا تحوّل هذه الليلة إلى جلسة تسجيل. يمكنك إعداد حكاية محفوظة حين تتوفر لديك طاقة أكبر.
faq.5.question=هل أعد طفلي بحكاية أطول غدًا؟
faq.5.answer=لا تعده إلا بما تتوقع أنك ستستطيع فعله. «يمكننا العودة إلى هذا الكتاب» تترك مجالًا لما سيحمله الغد. النهاية البسيطة الصادقة أسهل من الوعد بثلاث حكايات إضافية وأنت لا تعرف كيف ستشعر.
sources.title=المصادر وحدود الدليل
sources.body=الأمثلة العملية والعبارات المقترحة من تحرير Sleep2Story. توفّر المصادر التالية خلفية عن العناية بالصوت وروتين النوم، لكنها لا تثبت أن تطبيقًا معيّنًا يساعد الطفل على النوم.
