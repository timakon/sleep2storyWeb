meta.title=Fără energie pentru povestea de seară? | Sleep2Story
meta.description=Nu mai ai energie să citești sau te doare gâtul? Alege o poveste mai scurtă, alt cititor ori o înregistrare, cu un plan simplu pentru seara aceasta și data viitoare.
meta.og_title=Fără energie pentru povestea de seară? Un plan pentru azi
meta.og_description=Opțiuni practice pentru părinți obosiți: o poveste mai scurtă, privitul imaginilor împreună, alt cititor sau o înregistrare pregătită din timp.
meta.twitter_description=Povestea de seară când nu mai ai energie: ce poți încerca azi, ce îi poți spune copilului și ce să pregătești când te simți mai bine.
schema.description=Ghid practic pentru povestea de seară când un părinte nu mai are energie să citească cu voce tare sau are nevoie să își odihnească vocea, cu alternative și un plan pentru pregătirea înregistrărilor.
hero.eyebrow=Pentru părinți obosiți · Ghidul 04
hero.title=Nu mai ai energie pentru povestea de seară?
hero.dek=Cartea e deschisă, copilul mai vrea o poveste, iar tu nu mai ai putere să citești cu voce tare. Iată un mic plan pentru seara aceasta, inclusiv pentru serile în care vorbitul doare.
byline.read_time=8 minute de lectură
byline.date=7 septembrie 2026
nav.tonight=În seara aceasta
nav.voice=Odihnește-ți vocea
nav.backup=Data viitoare
answer.title=Alege o variantă a poveștii de seară pe care o poți duce la capăt azi.
answer.body=Dacă poți vorbi fără disconfort, citește o poveste preferată foarte scurtă sau răsfoiți o carte împreună. Dacă vorbitul te deranjează, roagă un alt adult de încredere să citească ori folosește o înregistrare pe care o ai deja. Păstrează urarea familiară de noapte bună; lasă înregistrarea unei povești noi pentru o zi în care poți vorbi din nou fără disconfort.
toc.tonight=Patru opțiuni pentru seara aceasta
toc.voice=Când te doare gâtul sau vorbitul te deranjează
toc.words=Fraze pe care le poți folosi
toc.backup=Pregătește câteva povești audio de rezervă
toc.product=Unde se potrivește Sleep2Story
toc.faq=Întrebări pentru serile obositoare
figure.alt=Ilustrație în tonuri calde cu un părinte obosit lângă copil, o carte deschisă și o lampă mică de noptieră
figure.caption=Povestea poate fi mai scurtă în seara aceasta. Puteți împărtăși în continuare momentul.
intro.title=Hotărăște ce ai nevoie să fie mai ușor
intro.body1=Uneori, problema este lungimea cărții. Alteori, nu mai ai energie să faci din nou vocile personajelor. Iar uneori te doare gâtul și cititul cu voce tare este pur și simplu neplăcut. Serile acestea cer alegeri diferite. O carte mai scurtă ajută când ești obosit, dar nu rezolvă nevoia de a-ți odihni vocea.
intro.body2=Înainte să oferi o alegere, hotărăște ce poți face cu adevărat. E mai ușor să respecți „Aceste două pagini sau povestea noastră înregistrată?” decât „Alege orice”. Nu trebuie să cauți povestea de seară perfectă cât timp copilul așteaptă. Începe cu o carte, o înregistrare sau un alt adult deja disponibil în familie.
tonight.kicker=Începe cu ce ai la îndemână
tonight.title=Patru moduri de a păstra povestea în rutina din seara aceasta
tonight.lead=Alege o singură opțiune, fără să încerci neapărat toate cele patru. Dacă cel mic este deja gata să vă opriți, puteți trece direct la urarea obișnuită de noapte bună.
option.1.title=Citește un fragment mai scurt dintr-o carte cunoscută
option.1.body1=Când simți oboseală, dar poți vorbi fără disconfort, alege o poveste scurtă, două pagini preferate sau un singur capitol. Spune unde vă veți opri înainte să începi. Un semn de carte arată clar locul în care o poveste mai lungă vă poate aștepta până mâine.
option.1.body2=Folosește vocea ta obișnuită. Poți renunța la interpretarea elaborată a personajelor și la efectele sonore. Dacă cel mic cere mai mult, oferă un final clar: „Aceasta este povestea noastră pentru seara asta. Mâine putem continua de la pagina aceasta.” Lungimea ar trebui să vi se potrivească amândurora, fără să urmeze o regulă despre câte minute citește un părinte bun.
option.2.title=Lasă imaginile să spună povestea
option.2.body1=Deschide o carte pe care copilul o cunoaște și invită-l să arate ceva, să întoarcă o pagină sau să spună ce observă. Un copil care nu povestește încă poate alege pur și simplu o imagine preferată. Poți asculta și răspunde printr-un zâmbet sau o înclinare a capului; nu e nevoie să transformați momentul într-o lecție.
option.2.body2=Încearcă o invitație scurtă, precum „Arată-mi unde a plecat ursulețul”. Dacă vorbitul îți provoacă disconfort, lăsați arătatul imaginilor și întorsul paginilor să fie suficiente. Dacă cel mic nu vrea să preia povestea, alege altă opțiune. Nu trebuie să povestească întreaga carte fiindcă adultul este obosit.
option.3.title=Lasă pe altcineva să citească și stabiliți un final clar
option.3.body1=Dacă este disponibil un alt adult de încredere, roagă-l să preia lectura cu un plan precis: această carte, aceste pagini, apoi urarea obișnuită de noapte bună. Poți rămâne aproape dacă asta funcționează pentru familia voastră sau îi poți lăsa lui tot momentul. Nu trebuie să reproducă exact felul tău de a citi.
option.3.body2=O rudă care citește printr-un apel este o altă posibilitate, dacă ora și dispoziția copilului permit. Stabiliți dinainte că va fi o singură poveste. Conversația în direct se poate transforma într-un schimb animat de noutăți, așa că apelul este o opțiune, nu ceva ce trebuie neapărat să organizezi la culcare. O înregistrare pregătită mai devreme nu cere să vă potriviți fusurile orare.
option.4.title=Pornește o poveste audio pe care ai ales-o deja
option.4.body1=O înregistrare familiară din familie sau o poveste audio potrivită vârstei poate prelua lectura cât timp te odihnești. Alege tu înregistrarea, verifică începutul și sfârșitul și setează oprirea după poveste, dacă aplicația de redare permite. Păstrează un volum confortabil și ține dispozitivul și cablurile departe de mâinile copilului.
option.4.body2=Pornește înregistrarea, apoi lasă ecranul deoparte. Dacă cel mic vrea cartea, o poate privi în timp ce ascultă. Rămâi disponibil pentru întrebări sau dacă se răzgândește. Dacă povestea audio agită această seară, oprește-o și revino la o opțiune mai liniștită. Nu ai nevoie de un cont nou sau de o căutare lungă printre recomandări în seara aceasta.
voice.title=Durerea în gât este un motiv să schimbi planul de lectură
voice.body1=Dacă vocea îți este răgușită sau obosită, odihnește-o; șoptitul nu ține loc de repaus vocal. Aceasta este o recomandare pentru îngrijirea vocii a Institutului Național pentru Surditate și Alte Tulburări de Comunicare din SUA (NIDCD).
voice.link=Citește recomandările NIDCD pentru îngrijirea vocii
voice.body2=Pentru povestea de seară, alege o variantă care nu îți cere să vorbești: un alt adult, o înregistrare pe care o ai deja sau privitul imaginilor împreună. O mostră nouă înregistrată în seara aceasta ar solicita tocmai vocea pe care încerci să o odihnești. Pregătește-o mai târziu. Acest articol oferă alternative la citit, nu un diagnostic sau un tratament; cere sfatul unui medic dacă simptomele te îngrijorează sau nu se ameliorează.
words.title=Ce să spui când copilul vrea să îți audă vocea
words.intro=O explicație scurtă și o alegere sunt, de obicei, mai ușor de oferit decât o negociere lungă. Acestea sunt exemple de adaptat, nu replici pe care trebuie să le spui perfect. Dacă vorbitul doare, un alt adult poate explica planul.
words.1.label=Când mai ai foarte puțină energie
words.1.text=„În seara asta nu mai am energie. Putem citi împreună aceste două pagini, apoi ne spunem noapte bună.”
words.2.label=Când vocea ta are nevoie de odihnă
words.2.text=„Vocea mea are nevoie de odihnă. Putem privi imaginile împreună cât timp citește altcineva.”
words.3.label=Când ai o înregistrare salvată
words.3.text=„În seara asta ascultăm povestea noastră înregistrată. Pot să stau lângă tine cât timp ascultăm.”
words.end=Dacă nicio opțiune nu funcționează, închide cartea și folosește urarea voastră obișnuită de noapte bună. Poți propune o poveste altă dată. Nu trebuie să înlocuiești fiecare minut planificat pentru citit cu o altă activitate în seara aceasta.
backup.title=Pregătește câteva povești de rezervă într-o zi mai bună
backup.lead=Ai nevoie doar de o mică selecție pentru început, nu de încă un proiect de gestionat. Într-o zi în care ai puțină energie și poți vorbi fără disconfort, pregătește-te pentru următoarea seară obositoare în trei pași.
backup.1.title=Alege o poveste preferată scurtă pe care ai voie să o înregistrezi
backup.1.body=Folosește propria poveste sau un text pe care ai permisiunea să îl înregistrezi și să îl utilizezi. Un început familiar și un final clar îți vor ușura alegerea mai târziu. Dacă este o carte lungă, alege un fragment scurt pentru care ai permisiune, în loc să promiți că vei termina totul dintr-o dată.
backup.2.title=Înregistrează, ascultă și dă fișierului un nume clar
backup.2.body=O înregistrare cu telefonul este un început practic. Ascult-o o dată ca să verifici dacă se înțeleg cuvintele și dacă finalul este complet. Include titlul poveștii și numele cititorului în numele fișierului și păstrează originalul într-un loc pe care îl controlezi. Dacă înregistrează altcineva din familie, stabiliți cum vor fi folosite vocea și înregistrarea sa.
backup.3.title=Verifică redarea înainte să ai nevoie de înregistrare
backup.3.body=Deschide înregistrarea pe dispozitivul pe care îl vei folosi la culcare. Verifică dacă are nevoie de internet, dacă sunetul continuă când lași ecranul deoparte și ce se redă după ea. Aceste funcții depind de aplicația de redare. Pune povestea aleasă într-un loc unde un adult o poate găsi fără să caute printr-o bibliotecă întreagă.
backup.note=Ai nevoie de ajutor cu înregistrarea în sine? Ghidul nostru pentru înregistrarea cu telefonul explică alegerea camerei, un test scurt de sunet și problemele audio frecvente. Dacă aveți deja o rutină care funcționează, păstrați-o; această rezervă trebuie doar să se potrivească în ea.
product.eyebrow=În pregătire pentru iOS și Android
product.title=O voce familiară din familie, pregătită din timp
product.body=Sleep2Story este în dezvoltare pentru acest fel de pregătire. Un adult înregistrează o mostră scurtă de voce cu acordul persoanei căreia îi aparține vocea și adaugă textul complet al poveștii. Aplicația pregătește o narațiune sintetică folosind vocea aleasă din familie, pentru ascultare într-o bibliotecă personală. Nu scrie povestea și nu păstrează o lectură originală a acelor cuvinte.
product.body2=Aplicația nu este încă disponibilă în magazinele de aplicații. La lansare este planificată narațiunea în engleză și rusă; o pagină tradusă a site-ului nu înseamnă că narațiunea este disponibilă în acea limbă. Pentru seara aceasta, folosește o opțiune pe care o ai deja. Sleep2Story este un mod de a te pregăti pentru serile viitoare, nu un remediu imediat pentru o voce obosită sau pentru disconfortul la vorbit.
