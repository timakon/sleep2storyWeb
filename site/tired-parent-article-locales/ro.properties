faq.title=Întrebări care apar în serile obositoare
faq.1.question=Este în regulă să sărim peste povestea de seară astăzi?
faq.1.answer=Dacă cititul este prea mult pentru tine în seara aceasta, poți păstra urarea de noapte bună și propune o carte altă dată. O poveste mai scurtă, privitul imaginilor împreună sau un alt cititor sunt opțiuni, nu sarcini suplimentare pe care trebuie să le îndeplinești. Alege ce poate face familia voastră în seara aceasta.
faq.2.question=Ce fac dacă mă doare gâtul, dar copilul vrea să îi citesc?
faq.2.answer=Explică pe scurt că vocea ta are nevoie de odihnă sau roagă un alt adult să explice. Propune imagini, un alt cititor sau o înregistrare existentă. Nu trebuie să faci o înregistrare nouă când vorbitul îți provoacă disconfort. Urmează recomandările medicale potrivite simptomelor tale.
faq.3.question=Poate o poveste audio de seară să înlocuiască cititul cu voce tare?
faq.3.answer=Poate prelua narațiunea într-o anumită seară, dar experiența este diferită de o conversație despre carte împreună. Un adult poate fi în continuare prezent, poate pune pauză și îi poate răspunde copilului. Este o opțiune practică, nu afirmația că poveștile audio și cititul împreună au beneficii identice.
faq.4.question=Ce facem dacă nu avem o înregistrare pregătită?
faq.4.answer=Începe cu ce este disponibil: o carte mai scurtă dacă poți vorbi fără disconfort, privitul imaginilor sau un alt cititor de încredere. Nu transforma seara aceasta într-o sesiune de înregistrare. Poți pregăti o poveste salvată când ai mai multă energie.
faq.5.question=Ar trebui să promit o poveste mai lungă pentru mâine?
faq.5.answer=Promite doar ceva ce crezi că vei putea face. „Putem reveni la cartea aceasta” lasă loc pentru felul în care va decurge ziua de mâine. Un final simplu și sincer este mai ușor de respectat decât promisiunea a trei povești în plus când nu știi cum te vei simți.
sources.title=Surse și limitele articolului
sources.body=Exemplele practice și frazele propuse sunt sugestii ale redacției Sleep2Story. Sursele de mai jos oferă context despre îngrijirea vocii și rutinele de seară; nu demonstrează că o anumită aplicație ajută un copil să doarmă.
