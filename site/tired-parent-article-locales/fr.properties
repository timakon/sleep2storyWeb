nav.tonight=Ce soir
nav.voice=Reposer sa voix
nav.backup=La prochaine fois
answer.title=Choisissez une histoire du soir à la mesure de votre énergie.
answer.body=Si votre voix va bien, lisez une histoire très courte que votre enfant aime ou regardez un livre ensemble. Si parler est inconfortable, demandez à un autre adulte de confiance de lire ou utilisez un enregistrement que vous avez déjà. Gardez votre « bonne nuit » habituel et attendez que votre voix aille mieux pour enregistrer une nouvelle histoire.
