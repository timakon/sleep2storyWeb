faq.title=Les questions qui reviennent les soirs de fatigue
faq.1.question=Peut-on sauter l’histoire du soir ce soir ?
faq.1.answer=Si lire vous demande trop d’efforts ce soir, vous pouvez garder le « bonne nuit » et proposer un livre à un autre moment. Une histoire plus courte, des images partagées ou un autre lecteur sont des possibilités, pas des tâches supplémentaires à accomplir. Choisissez ce qui est à la portée de votre famille.
faq.2.question=Que faire si j’ai mal à la gorge mais que mon enfant veut que je lise ?
faq.2.answer=Expliquez brièvement que votre voix a besoin de repos, ou demandez à un autre adulte de le faire. Proposez de regarder des images, d’écouter un autre lecteur ou un enregistrement existant. Vous n’avez pas à enregistrer une nouvelle histoire quand parler est inconfortable. Suivez les conseils médicaux adaptés à vos symptômes.
faq.3.question=Une histoire audio peut-elle remplacer la lecture à voix haute ?
faq.3.answer=Elle peut assurer la narration un soir donné, mais l’expérience diffère d’un échange autour d’un livre. Un adulte peut rester présent, mettre l’audio en pause et répondre à l’enfant. C’est une solution pratique ; cela ne signifie pas que l’audio et la lecture partagée ont des bénéfices identiques.
faq.4.question=Et si nous n’avons aucun enregistrement prêt ?
faq.4.answer=Partez de ce qui est disponible : un livre plus court si parler ne vous gêne pas, des images à regarder ensemble ou un autre lecteur de confiance. Ne transformez pas cette soirée en séance d’enregistrement. Vous pourrez préparer une histoire quand vous aurez plus d’énergie.
faq.5.question=Faut-il promettre une histoire plus longue demain ?
faq.5.answer=Ne promettez que ce que vous pensez pouvoir faire. « On pourra reprendre ce livre » laisse de la place à la façon dont demain se passera. Une fin simple et honnête est plus facile à tenir que trois histoires supplémentaires promises sans savoir comment vous vous sentirez.
sources.title=Sources et limites
sources.body=Les exemples pratiques et les phrases proposées sont des suggestions de la rédaction de Sleep2Story. Les sources ci-dessous apportent des repères sur le soin de la voix et les rituels du coucher ; elles ne démontrent pas qu’une application donnée aide un enfant à dormir.
