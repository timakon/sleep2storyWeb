figure.alt=Illustration chaleureuse d’un parent fatigué près de son enfant, avec un livre ouvert et une petite lampe de chevet
figure.caption=L’histoire peut être plus courte ce soir. Le moment partagé reste là.
intro.title=Repérez ce qui vous demande trop d’efforts
intro.body1=Parfois, c’est le livre qui est trop long. Parfois, vous n’avez plus le courage de faire toutes les voix. Et parfois, vous avez mal à la gorge et lire à voix haute est tout simplement inconfortable. Ces situations appellent des réponses différentes. Un livre plus court aide quand on est fatigué ; il ne repose pas une voix qui en a besoin.
intro.body2=Avant de proposer un choix, décidez de ce que vous pouvez vraiment faire. « Ces deux pages ou notre histoire enregistrée ? » est plus facile à tenir que « Choisis ce que tu veux ». Inutile de chercher une nouvelle histoire parfaite pendant que votre enfant attend. Commencez par un livre, un enregistrement ou un autre adulte déjà disponible dans votre entourage.
tonight.kicker=Partez de ce que vous avez
tonight.title=Quatre façons de garder une histoire dans le rituel de ce soir
tonight.lead=Choisissez une option, sans chercher à toutes les essayer. Si votre enfant est déjà prêt à s’arrêter, vous pouvez passer directement à votre « bonne nuit » habituel.
option.1.title=Lisez un petit passage d’un livre connu
option.1.body1=Si vous êtes fatigué mais que parler reste confortable, choisissez une histoire courte, deux pages préférées ou un seul chapitre. Annoncez où vous vous arrêterez avant de commencer. Dans un long récit, un marque-page indique clairement où reprendre demain.
option.1.body2=Gardez votre voix habituelle. Vous pouvez laisser de côté les voix de personnages et les bruitages. Si votre enfant en demande encore, marquez simplement la fin : « C’est notre histoire pour ce soir. On pourra reprendre à cette page demain. » La durée doit vous convenir à tous les deux, sans règle sur le nombre de minutes qu’un bon parent devrait lire.
option.2.title=Laissez les images raconter l’histoire
option.2.body1=Ouvrez un livre que votre enfant connaît et invitez-le à montrer une image, tourner une page ou raconter ce qu’il remarque. Un enfant qui ne raconte pas encore d’histoires peut simplement choisir son image préférée. Vous pouvez écouter et répondre par un sourire ou un signe de tête ; inutile d’en faire un exercice.
option.2.body2=Essayez une invitation toute simple : « Montre-moi où est parti le petit ours. » Si parler vous gêne, laissez les gestes et les pages tournées guider le moment. Si votre enfant n’a pas envie de participer ainsi, choisissez une autre option. Ce n’est pas à lui de raconter tout le livre parce que l’adulte est fatigué.
option.3.title=Passez le relais en précisant quand finir
option.3.body1=Si un autre adulte de confiance est disponible, faites une demande précise : ce livre, ces pages, puis le « bonne nuit » habituel. Vous pouvez rester à proximité si cela convient à votre famille, ou lui confier ce moment. Il n’a pas besoin de reproduire exactement votre façon de lire.
option.3.body2=Un proche peut aussi lire pendant un appel si l’horaire et l’humeur de l’enfant s’y prêtent. Mettez-vous d’accord à l’avance sur une seule histoire. L’appel peut vite devenir une conversation animée pour prendre des nouvelles : c’est donc une possibilité, pas quelque chose à organiser à tout prix au coucher. Un enregistrement préparé plus tôt évite d’avoir à accorder les fuseaux horaires.
option.4.title=Lancez une histoire audio déjà choisie
option.4.body1=Un enregistrement familial connu ou une histoire audio adaptée à l’âge de votre enfant peut assurer la lecture pendant que vous vous reposez. Choisissez vous-même le fichier, vérifiez le début et la fin et, si le lecteur le permet, réglez l’arrêt à la fin de l’histoire. Gardez un volume confortable et placez l’appareil ainsi que les câbles hors de portée de votre enfant.
option.4.body2=Lancez l’audio, puis laissez l’écran de côté. Si votre enfant souhaite garder le livre, il peut le regarder en écoutant. Restez disponible pour ses questions ou s’il change d’avis. Si l’audio rend cette soirée plus agitée, arrêtez-le et revenez à une option plus calme. Ce soir, vous n’avez besoin ni d’un nouveau compte ni d’une longue recherche parmi les recommandations.
voice.title=Mal à la gorge ? Adaptez l’histoire du soir
voice.body1=Si votre voix est enrouée ou fatiguée, reposez-la ; chuchoter ne permet pas de contourner ce besoin. C’est ce que recommande le NIDCD, l’Institut national américain sur la surdité et les autres troubles de la communication, dans ses conseils pour prendre soin de la voix.
voice.link=Lire les conseils du NIDCD pour prendre soin de sa voix
voice.body2=Pour l’histoire du soir, choisissez une option sans avoir à parler : un autre adulte, un enregistrement déjà prêt ou des images à regarder ensemble. Enregistrer un nouvel échantillon de voix ce soir solliciterait justement la voix que vous cherchez à reposer. Préparez-le plus tard. Cet article propose des alternatives à la lecture, pas un diagnostic ni un traitement ; demandez un avis médical si les symptômes vous inquiètent ou ne s’améliorent pas.
words.title=Que dire quand votre enfant réclame votre voix ?
words.intro=Une courte explication et un choix sont souvent plus faciles à proposer qu’une longue négociation. Voici des exemples à adapter, pas des phrases à réciter parfaitement. Si parler fait mal, un autre adulte peut expliquer ce qui est prévu.
words.1.label=Quand vous n’avez presque plus d’énergie
words.1.text=« Je suis très fatigué ce soir. On peut lire ces deux pages ensemble, puis se dire bonne nuit. »
words.2.label=Quand votre voix a besoin de repos
words.2.text=« Ma voix a besoin de se reposer. On peut regarder les images ensemble pendant que quelqu’un d’autre lit. »
words.3.label=Quand vous avez une histoire enregistrée
words.3.text=« Ce soir, on va écouter notre histoire enregistrée. Je peux m’asseoir près de toi pendant qu’on l’écoute. »
words.end=Si aucune option ne convient, fermez le livre et gardez votre « bonne nuit » habituel. Vous pourrez proposer une histoire à un autre moment. Il n’est pas nécessaire de remplacer chaque minute de lecture prévue par une autre activité.
backup.title=Préparez une ou deux histoires de secours un jour où vous allez mieux
backup.lead=Quelques histoires suffisent pour commencer, sans vous créer un nouveau projet à gérer. Un jour où vous avez de l’énergie et où votre voix va bien, facilitez la prochaine soirée de fatigue en trois étapes.
backup.1.title=Choisissez une histoire courte que vous avez le droit d’enregistrer
backup.1.body=Utilisez votre propre histoire ou un texte que vous avez l’autorisation d’enregistrer et d’utiliser. Un début familier et une fin claire vous aideront à la choisir facilement le moment venu. Si le livre est long, retenez un court passage autorisé plutôt que de promettre de tout finir d’une traite.
backup.2.title=Enregistrez, réécoutez et donnez un nom clair au fichier
backup.2.body=Un enregistrement au téléphone est un bon point de départ. Écoutez-le une fois pour vérifier que les mots sont clairs et que la fin est complète. Indiquez le titre de l’histoire et le nom de la personne qui lit dans le nom du fichier, puis conservez l’original dans un emplacement que vous maîtrisez. Si un proche réalise l’enregistrement, convenez ensemble de l’usage de sa voix et du fichier.
backup.3.title=Vérifiez la lecture avant d’en avoir besoin
backup.3.body=Ouvrez l’enregistrement sur l’appareil que vous utiliserez réellement au coucher. Vérifiez s’il faut une connexion internet, si l’audio continue une fois l’écran éteint et ce qui se lance ensuite. Ces possibilités dépendent du lecteur utilisé. Placez l’histoire choisie là où un adulte pourra la retrouver sans parcourir toute une bibliothèque.
backup.note=Besoin d’aide pour l’enregistrement ? Notre guide pour enregistrer au téléphone aborde le choix de la pièce, un court essai sonore et les problèmes audio fréquents. Si vous avez déjà un rituel qui fonctionne, gardez-le ; cette solution de secours doit simplement y trouver sa place.
product.eyebrow=En préparation pour iOS et Android
product.title=Une voix familière, préparée à l’avance
product.body=Sleep2Story est en cours de développement pour faciliter cette préparation. Un adulte enregistre un court échantillon de voix avec le consentement de la personne concernée et ajoute le texte intégral de l’histoire. L’application prépare une narration de synthèse reproduisant la voix du proche choisi, à écouter dans une bibliothèque personnelle. Elle n’écrit pas l’histoire et ne conserve pas une lecture originale de ces mots précis.
product.body2=L’application n’est pas encore disponible sur les boutiques d’applications. La narration en anglais et en russe est prévue au lancement ; une page du site traduite ne signifie pas que la narration dans cette langue est disponible. Pour ce soir, utilisez une solution que vous avez déjà. Sleep2Story est une façon de préparer les soirées à venir, pas une réponse immédiate à une voix fatiguée ou douloureuse.
