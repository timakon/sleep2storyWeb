meta.og_description=Des solutions concrètes pour les parents épuisés : une histoire plus courte, des images à regarder ensemble, un autre lecteur ou un enregistrement déjà prêt.
meta.twitter_description=L’histoire du soir quand l’énergie manque : que faire ce soir, comment l’expliquer à votre enfant et quoi préparer quand vous irez mieux.
schema.description=Un guide pratique pour l’histoire du soir quand un parent est trop fatigué pour lire à voix haute ou doit reposer sa voix, avec des alternatives et des conseils pour préparer des enregistrements.
hero.eyebrow=Pour les parents fatigués · Guide 04
hero.title=Trop fatigué pour lire l’histoire du soir ?
hero.dek=Le livre est ouvert, votre enfant réclame encore une histoire et vous n’avez plus l’énergie de lire à voix haute. Voici quelques solutions simples pour ce soir, y compris quand parler vous fait mal.
