meta.title=Non hai energie per la storia della buonanotte? | Sleep2Story
meta.description=Non hai energie per leggere una storia della buonanotte o ti fa male la gola? Prova una lettura breve, un altro lettore o un audio già pronto.
meta.og_title=Non hai energie per leggere? Un piano per la buonanotte
meta.og_description=Idee pratiche per le sere senza energie: una storia più breve, le figure da guardare insieme, un altro lettore o una registrazione preparata prima.
meta.twitter_description=La storia della buonanotte nelle sere senza energie: cosa provare stasera, cosa dire a tuo figlio e cosa preparare quando starai meglio.
schema.description=Una guida pratica alla storia della buonanotte quando un genitore non ha energie per leggere ad alta voce o deve far riposare la voce, con alternative e consigli per preparare delle registrazioni.
hero.eyebrow=Per genitori stanchi · Guida 04
hero.title=Non hai energie per la storia della buonanotte?
hero.dek=Il libro è aperto, tuo figlio chiede un’altra storia e tu non ce la fai più a leggere ad alta voce. Ecco un piccolo piano per stasera, anche quando parlare fa male.
