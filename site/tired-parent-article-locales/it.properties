answer.title=Scegli il modo di condividere una storia che riesci a gestire stasera.
answer.body=Se la voce sta bene, leggi una storia preferita molto breve o guardate insieme un libro. Se parlare dà fastidio, chiedi a un altro adulto di fiducia di leggere oppure usa un audio che hai già. Conserva il vostro solito saluto della buonanotte; registra una nuova storia in un giorno in cui la voce starà bene.
toc.tonight=Quattro possibilità per stasera
toc.voice=Quando la gola o la voce fanno male
toc.words=Frasi da usare con tuo figlio
toc.backup=Prepara qualche storia audio di scorta
toc.product=Come può aiutare Sleep2Story
toc.faq=Domande nelle sere di stanchezza
figure.alt=Illustrazione dai toni caldi di un genitore stanco accanto a un bambino, con un libro aperto e una piccola lampada sul comodino
figure.caption=Stasera la storia può essere più breve. Il momento da condividere resta.
intro.title=Capisci cosa ti pesa di più
intro.body1=A volte il problema è la lunghezza del libro. A volte non te la senti di rifare tutte le voci dei personaggi. Altre volte hai mal di gola e leggere ad alta voce dà proprio fastidio. Sono sere che richiedono scelte diverse. Un libro più breve aiuta se sei stanco; non risolve il problema di una voce che ha bisogno di riposo.
intro.body2=Prima di proporre una scelta, decidi cosa riesci davvero a fare. «Queste due pagine o la storia che abbiamo registrato?» è una proposta più facile da mantenere di «Scegli quello che vuoi». Non serve cercare la nuova storia della buonanotte perfetta mentre tuo figlio aspetta. Parti da un libro, una registrazione o un altro adulto già disponibile in famiglia.
tonight.kicker=Comincia da quello che hai
tonight.title=Quattro modi per mantenere la storia nel rituale di stasera
tonight.lead=Scegli una possibilità, senza provarle tutte e quattro. Se tuo figlio è già pronto a finire, potete passare direttamente al vostro solito saluto della buonanotte.
option.1.title=Leggi un pezzetto di un libro che conoscete
option.1.body1=Se sei stanco ma parlare non ti dà fastidio, scegli una storia breve, due pagine preferite o un solo capitolo. Spiega dove vi fermerete prima di cominciare. In una storia più lunga, un segnalibro indica chiaramente il punto da cui ripartire domani.
option.1.body2=Usa la tua voce di tutti i giorni. Puoi fare a meno delle voci elaborate dei personaggi e degli effetti sonori. Se tuo figlio chiede ancora, concludi in modo chiaro: «Per stasera la storia finisce qui. Domani possiamo continuare da questa pagina». La durata deve andare bene a entrambi, senza regole su quanti minuti debba leggere un bravo genitore.
option.2.title=Lascia che siano le figure a raccontare
option.2.body1=Apri un libro che tuo figlio conosce e invitalo a indicare qualcosa, girare pagina o raccontarti che cosa vede. Se non sa ancora raccontare una storia, può semplicemente scegliere la sua figura preferita. Tu puoi ascoltare e rispondere con un sorriso o un cenno della testa: non deve diventare una lezione.
option.2.body2=Prova con un piccolo invito, come «Fammi vedere dov’è andato l’orsetto». Se parlare ti dà fastidio, lasciate spazio ai gesti e alle pagine da sfogliare. Se tuo figlio non vuole partecipare, scegli un’altra possibilità. Non deve raccontare tutto il libro solo perché l’adulto è stanco.
option.3.title=Passa la lettura a un altro adulto e concordate dove finire
option.3.body1=Se c’è un altro adulto di fiducia disponibile, chiedigli un cambio preciso: questo libro, queste pagine, poi il solito saluto della buonanotte. Puoi restare vicino, se per la vostra famiglia va bene, oppure lasciare che se ne occupi lui. Non deve riprodurre esattamente il tuo modo di leggere.
option.3.body2=Un familiare al telefono è un’altra possibilità, se l’orario e l’umore del bambino lo permettono. Accordatevi prima per una sola storia. Una chiamata può trasformarsi in una chiacchierata piena di entusiasmo: considerala una scelta, non un appuntamento da organizzare per forza all’ora della nanna. Una registrazione preparata prima non richiede di far coincidere i fusi orari.
option.4.title=Avvia una storia audio che hai già scelto
option.4.body1=Una registrazione di famiglia conosciuta o una storia audio adatta all’età può occuparsi della lettura mentre tu riposi. Scegli personalmente la traccia, controlla l’inizio e la fine e, se il lettore lo consente, imposta l’arresto dopo la storia. Tieni un volume confortevole e lascia il dispositivo e gli eventuali cavi fuori dalla portata del bambino.
option.4.body2=Avvia l’audio e poi lascia stare lo schermo. Se tuo figlio vuole il libro, può sfogliarlo mentre ascolta la registrazione. Resta disponibile per le sue domande o se cambia idea. Se stasera l’audio crea più agitazione, fermalo e torna a una possibilità più tranquilla. Non serve aprire un nuovo account né passare tanto tempo a scorrere suggerimenti.
voice.title=Il mal di gola è un buon motivo per cambiare programma
voice.body1=Se la voce è rauca o affaticata, falla riposare: sussurrare non è una soluzione alternativa. È una raccomandazione del NIDCD, l’istituto statunitense che si occupa di sordità e altri disturbi della comunicazione.
voice.link=Leggi i consigli del NIDCD per la cura della voce
voice.body2=Per il momento della storia, scegli qualcosa che non ti richieda di parlare: un altro adulto, una registrazione che hai già o le figure da guardare insieme. Registrare un nuovo campione vocale stasera significa usare proprio la voce che stai cercando di far riposare. Preparalo più avanti. Questo articolo propone alternative alla lettura, non diagnosi o cure; chiedi consiglio a un medico se i sintomi ti preoccupano o non migliorano.
words.title=Cosa dire quando tuo figlio vuole proprio la tua voce
words.intro=Una breve spiegazione e una scelta sono di solito più facili da offrire di una lunga trattativa. Queste frasi sono esempi da adattare, non battute da recitare alla perfezione. Se parlare fa male, un altro adulto può spiegare il programma.
words.1.label=Quando hai pochissime energie
words.1.text=«Stasera non ho più energie. Possiamo leggere insieme queste due pagine, poi ci diamo la buonanotte».
words.2.label=Quando la voce deve riposare
words.2.text=«La mia voce ha bisogno di riposare. Possiamo guardare insieme le figure mentre legge qualcun altro».
words.3.label=Quando hai una registrazione pronta
words.3.text=«Stasera ascoltiamo la nostra storia registrata. Posso sedermi accanto a te mentre la ascoltiamo».
words.end=Se nessuna delle possibilità funziona, chiudi il libro e datevi la buonanotte come sempre. Puoi proporre una storia in un altro momento. Non serve riempire ogni minuto che avevi previsto per la lettura con un’attività diversa.
backup.title=Prepara qualche storia di scorta in una giornata migliore
backup.lead=Per cominciare bastano poche registrazioni, senza un altro progetto da gestire. In un giorno in cui hai un po’ di energie e parlare non ti dà fastidio, prepara la prossima sera di stanchezza in tre passaggi.
backup.1.title=Scegli una storia breve che amate e che puoi registrare
backup.1.body=Usa una storia tua o un testo che hai il permesso di registrare e utilizzare. Un inizio familiare e una conclusione chiara renderanno più facile sceglierlo in seguito. Se il libro è lungo, scegli un breve brano che puoi usare, invece di promettere di finirlo tutto in una volta.
backup.2.title=Registra, riascolta e dai al file un nome chiaro
backup.2.body=Una registrazione con il telefono è un punto di partenza pratico. Riascoltala una volta per verificare che le parole siano chiare e il finale sia completo. Inserisci il titolo della storia e il nome di chi legge nel nome del file, e conserva l’originale in un posto che gestisci tu. Se registra un altro familiare, concordate come verranno usate la sua voce e la registrazione.
backup.3.title=Prova l’ascolto prima di averne bisogno
backup.3.body=Apri la registrazione sul dispositivo che userai davvero all’ora della nanna. Controlla se serve una connessione a internet, se l’audio continua quando smetti di usare lo schermo e che cosa parte dopo. Queste funzioni dipendono dal lettore. Tieni la storia scelta in un posto dove un adulto possa trovarla senza sfogliare un’intera raccolta.
backup.note=Ti serve una mano con la registrazione? La nostra guida per registrare con il telefono spiega come scegliere la stanza, fare una breve prova e risolvere i problemi audio più comuni. Se avete già un rituale che funziona, conservalo: questa piccola scorta deve solo trovare posto al suo interno.
product.eyebrow=In preparazione per iOS e Android
product.title=Una voce di famiglia, preparata in anticipo
product.body=Sleep2Story è in fase di sviluppo proprio per questo tipo di preparazione. Un adulto registra un breve campione vocale con il consenso della persona a cui appartiene la voce e aggiunge il testo completo della storia. L’app prepara una narrazione sintetica con la voce familiare scelta, da ascoltare in una biblioteca personale. Non scrive la storia: l’audio creato non è la registrazione originale di una persona che legge quel testo.
product.body2=L’app non è ancora disponibile negli store. Al lancio sono previste narrazioni in inglese e russo; una pagina del sito tradotta non significa che la narrazione in quella lingua sia disponibile. Per stasera, usa una possibilità che hai già. Sleep2Story è un modo per preparare le sere future, non un rimedio immediato per una voce stanca o dolorante.
