faq.title=Le domande delle sere di stanchezza
faq.1.question=Va bene saltare la storia della buonanotte stasera?
faq.1.answer=Se stasera leggere è più di quanto riesci a fare, puoi conservare il saluto della buonanotte e proporre un libro in un altro momento. Una storia più breve, le figure da guardare insieme o un altro lettore sono possibilità, non altri compiti da portare a termine. Scegli quello che la vostra famiglia riesce a gestire.
faq.2.question=E se ho mal di gola ma mio figlio vuole che legga io?
faq.2.answer=Spiega in poche parole che la tua voce deve riposare, oppure chiedi a un altro adulto di farlo. Proponi le figure, un altro lettore o una registrazione già pronta. Non serve crearne una nuova mentre usare la voce ti dà fastidio. Per i tuoi sintomi, segui le indicazioni mediche appropriate.
faq.3.question=Una storia audio può sostituire la lettura ad alta voce?
faq.3.answer=Può occuparsi della narrazione in una determinata sera, ma è un’esperienza diversa dal parlare insieme di un libro. Un adulto può comunque restare presente, mettere in pausa l’audio e rispondere al bambino. È una possibilità pratica: non significa che l’ascolto e la lettura condivisa abbiano benefici identici.
faq.4.question=E se non abbiamo una registrazione pronta?
faq.4.answer=Parti da quello che c’è: un libro più breve, se parlare non dà fastidio, le figure da guardare insieme o un altro lettore di fiducia. Non trasformare stasera in una sessione di registrazione. Potrai preparare una storia da salvare quando avrai più energie.
faq.5.question=Devo promettere una storia più lunga per domani?
faq.5.answer=Prometti solo quello che pensi di riuscire a fare. «Possiamo riprendere questo libro» lascia spazio a come andrà la giornata di domani. Una conclusione semplice e sincera è più facile da rispettare che promettere altre tre storie senza sapere come ti sentirai.
sources.title=Fonti e limiti della guida
sources.body=Gli esempi pratici e le frasi proposte sono suggerimenti della redazione Sleep2Story. Le fonti qui sotto offrono informazioni sulla cura della voce e sui rituali della buonanotte; non dimostrano che una determinata app aiuti un bambino a dormire.
