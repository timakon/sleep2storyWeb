answer.title=Dopasuj dzisiejszą bajkę do tego, na co masz siłę.
answer.body=Jeśli możesz swobodnie mówić, przeczytaj króciutką ulubioną bajkę albo obejrzyjcie razem książkę. Jeśli mówienie sprawia trudność, poproś o czytanie innego zaufanego dorosłego lub włącz nagranie, które już masz. Zakończcie wieczór zwykłym „dobranoc”, a nagrywanie nowej bajki odłóż na dzień, w którym głos będzie w dobrej formie.
