figure.alt=Ilustracja w ciepłych kolorach: zmęczony rodzic obok dziecka, otwarta książka i mała lampka nocna
figure.caption=Dziś bajka może być krótsza. Nadal możecie spędzić tę chwilę razem.
intro.title=Zastanów się, co dziś najbardziej Cię męczy
intro.body1=Czasem książka jest po prostu za długa. Czasem nie masz siły po raz kolejny zmieniać głosu dla każdej postaci. A czasem boli Cię gardło i czytanie na głos jest zwyczajnie nieprzyjemne. W każdej z tych sytuacji przyda się inne rozwiązanie. Krótsza książka może pomóc przy zmęczeniu, ale nie zastąpi odpoczynku dla głosu.
intro.body2=Zanim dasz dziecku wybór, ustal, na co naprawdę masz siłę. Łatwiej dotrzymać propozycji „Te dwie strony czy nasze nagranie?” niż „Wybierz cokolwiek”. Nie musisz szukać idealnej nowej bajki na dobranoc, kiedy dziecko już czeka. Zacznij od książki, nagrania lub pomocy dorosłego, z których możecie skorzystać od razu.
tonight.kicker=Zacznij od tego, co masz pod ręką
tonight.title=Cztery sposoby na bajkę w dzisiejszym wieczornym rytuale
tonight.lead=Wybierz jedną możliwość. Nie trzeba próbować wszystkich czterech. Jeśli dziecko też chce już kończyć, możecie od razu przejść do waszego zwykłego pożegnania na noc.
option.1.title=Przeczytaj krótki fragment znanej książki
option.1.body1=Gdy brakuje Ci sił, ale mówienie nie sprawia trudności, wybierz jedną krótką bajkę, dwie ulubione strony albo rozdział. Jeszcze przed czytaniem powiedz, gdzie skończycie. Zakładka pozwoli zaznaczyć miejsce, od którego wrócicie do dłuższej historii jutro.
option.1.body2=Czytaj swoim zwykłym głosem. Możesz pominąć odgrywanie postaci i efekty dźwiękowe. Jeśli dziecko prosi o więcej, wyraźnie zaznacz koniec: „Na dziś to już koniec bajki. Jutro możemy czytać dalej od tej strony”. Długość czytania powinna pasować do was obojga, a nie do zasady, ile minut musi czytać dobry rodzic.
option.2.title=Obejrzyjcie razem obrazki
option.2.body1=Otwórz książkę, którą dziecko zna. Zaproś je do wskazywania obrazków, przewracania stron lub opowiedzenia o tym, co zauważa. Jeśli jeszcze nie opowiada, może po prostu wybrać ulubioną ilustrację. Ty możesz słuchać, uśmiechać się i potakiwać. Nie trzeba robić z tego lekcji.
option.2.body2=Wystarczy krótka zachęta, na przykład: „Pokaż mi, dokąd poszedł miś”. Jeśli mówienie jest nieprzyjemne, możecie tylko wskazywać obrazki i przewracać strony. Gdy dziecko nie ma na to ochoty, wybierz coś innego. Nie musi opowiadać całej książki tylko dlatego, że dorosłemu brakuje sił.
option.3.title=Poproś kogoś o czytanie i ustalcie, kiedy skończyć
option.3.body1=Jeśli może pomóc inny zaufany dorosły, poproś go konkretnie: ta książka, te strony, a potem zwykłe „dobranoc”. Możesz zostać obok, jeśli tak wam wygodnie, albo oddać mu prowadzenie reszty wieczoru. Nie musi czytać dokładnie tak jak Ty.
option.3.body2=Możecie też zadzwonić do kogoś z rodziny, jeśli pora i nastrój dziecka na to pozwalają. Umówcie się wcześniej na jedną bajkę. Rozmowa na żywo łatwo zamienia się w ekscytujące opowiadanie o całym dniu, więc to tylko jedna z możliwości, a nie coś, co trzeba organizować tuż przed snem. Nagranie przygotowane wcześniej nie wymaga uzgadniania godzin między strefami czasowymi.
option.4.title=Włącz wcześniej wybraną bajkę do słuchania
option.4.body1=Znane rodzinne nagranie albo bajka audio odpowiednia do wieku dziecka pozwolą Ci odpocząć od czytania. Samodzielnie wybierz nagranie, sprawdź początek i zakończenie, a jeśli odtwarzacz na to pozwala, ustaw zatrzymanie po bajce. Zadbaj o komfortową głośność i trzymaj urządzenie oraz przewody poza zasięgiem dziecka.
option.4.body2=Włącz nagranie i odłóż ekran. Jeśli dziecko chce mieć przy sobie książkę, może ją oglądać podczas słuchania. Pozostań w pobliżu, aby odpowiedzieć na pytanie lub zareagować, gdy zmieni zdanie. Jeśli nagranie tego wieczoru tylko wprowadza więcej zamieszania, wyłącz je i wybierz coś spokojniejszego. Dziś nie potrzebujesz nowego konta ani długiego przeglądania polecanych bajek.
voice.title=Gdy boli gardło, zmień plan czytania
voice.body1=Przy chrypce lub zmęczeniu głosu daj mu odpocząć. Czytanie szeptem nie zastępuje odpoczynku. Takie zalecenia dotyczące dbania o głos podaje amerykański instytut NIDCD, zajmujący się słuchem, głosem i komunikacją.
voice.link=Przeczytaj zalecenia NIDCD dotyczące głosu (po angielsku)
voice.body2=Wybierz sposób na bajkę, który nie wymaga mówienia: pomoc innego dorosłego, gotowe nagranie lub wspólne oglądanie obrazków. Nagrywanie nowej próbki głosu dziś wieczorem obciąża właśnie ten głos, któremu chcesz dać odpocząć. Zostaw to na później. Ten poradnik przedstawia możliwości na wieczór bez czytania na głos; nie służy diagnozowaniu ani leczeniu. Skonsultuj się z lekarzem, jeśli objawy Cię niepokoją lub nie ustępują.
words.title=Co powiedzieć, gdy dziecko chce słuchać właśnie Ciebie
words.intro=Krótkie wyjaśnienie i prosty wybór zwykle wymagają mniej sił niż długie negocjacje. Poniższe zdania możesz dopasować do siebie. Nie trzeba powtarzać ich słowo w słowo. Jeśli mówienie boli, plan może wyjaśnić dziecku inny dorosły.
words.1.label=Gdy masz bardzo mało siły
words.1.text=„Dziś mam już bardzo mało siły. Przeczytamy razem te dwie strony, a potem powiemy sobie dobranoc”.
words.2.label=Gdy głos potrzebuje odpoczynku
words.2.text=„Mój głos musi odpocząć. Możemy razem oglądać obrazki, a ktoś inny nam poczyta”.
words.3.label=Gdy masz gotowe nagranie
words.3.text=„Dzisiaj posłuchamy naszej bajki z nagrania. Mogę usiąść obok Ciebie”.
words.end=Jeśli żadna z propozycji się nie sprawdzi, zamknij książkę i pożegnajcie się na noc tak jak zwykle. Do bajki możecie wrócić o innej porze. Nie musisz zapełniać innym zajęciem każdej minuty, którą planowaliście spędzić na czytaniu.
backup.title=W spokojniejszy dzień przygotuj bajkę na kolejny trudny wieczór
backup.lead=Na początek wystarczy niewielki zapas nagrań. To nie ma być kolejny projekt do prowadzenia. W dzień, gdy masz trochę siły i możesz swobodnie mówić, przygotuj się na kolejny męczący wieczór w trzech krokach.
backup.1.title=Wybierz krótką ulubioną historię, którą wolno Ci nagrać
backup.1.body=Sięgnij po własną historię lub tekst, na którego nagranie i wykorzystanie masz zgodę. Znany początek i wyraźne zakończenie ułatwią późniejszy wybór. Jeśli książka jest długa, wybierz krótki fragment, który wolno Ci nagrać, zamiast obiecywać sobie przeczytanie całości za jednym razem.
backup.2.title=Nagraj, odsłuchaj i nadaj plikowi czytelną nazwę
backup.2.body=Na początek wystarczy nagranie telefonem. Odsłuchaj je raz, aby sprawdzić, czy słowa są wyraźne i czy nie brakuje zakończenia. W nazwie pliku umieść tytuł bajki i imię osoby czytającej, a oryginał zachowaj w miejscu, do którego masz dostęp i nad którym masz kontrolę. Jeśli nagrywa ktoś z rodziny, uzgodnijcie, jak będziecie korzystać z jego głosu i nagrania.
backup.3.title=Sprawdź odtwarzanie, zanim nagranie będzie potrzebne
backup.3.body=Otwórz nagranie na urządzeniu, którego będziecie używać przed snem. Sprawdź, czy potrzebny jest internet, czy dźwięk gra dalej po wygaszeniu ekranu i co uruchamia się po zakończeniu. Zależy to od odtwarzacza. Umieść wybraną bajkę tak, aby dorosły mógł ją znaleźć bez przeglądania całej biblioteki.
backup.note=Potrzebujesz wskazówek dotyczących samego nagrywania? W poradniku o nagrywaniu telefonem opisujemy wybór pokoju, krótki test dźwięku i typowe problemy. Jeśli macie już sprawdzony wieczorny rytuał, zachowajcie go. Przygotowane nagranie ma się po prostu w niego wpisać.
product.eyebrow=Aplikacja w przygotowaniu · iOS i Android
product.title=Znajomy głos bliskiej osoby, przygotowany wcześniej
product.body=Sleep2Story powstaje z myślą o takim przygotowaniu. Dorosły nagrywa krótką próbkę głosu za zgodą osoby, do której ten głos należy, i dodaje pełny tekst bajki. Aplikacja przygotowuje syntetyczną narrację wybranym głosem bliskiej osoby do słuchania w osobistej bibliotece. Sama nie pisze bajki, a wynik nie jest oryginalnym nagraniem, na którym ta osoba czyta dokładnie ten tekst.
product.body2=Aplikacja nie jest jeszcze dostępna w sklepach. Na start planowana jest narracja po angielsku i rosyjsku. Polska wersja strony nie oznacza dostępności narracji po polsku. Na dzisiejszy wieczór wybierz coś, z czego możesz już skorzystać. Sleep2Story to sposób na przygotowanie się do kolejnych wieczorów, a nie doraźna pomoc na zmęczenie lub bolące gardło.
