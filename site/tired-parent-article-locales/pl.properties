faq.title=Pytania, które pojawiają się w męczący wieczór
faq.1.question=Czy można dziś pominąć bajkę na dobranoc?
faq.1.answer=Jeśli dziś nie masz siły czytać, możecie pożegnać się na noc tak jak zwykle, a książkę zostawić na inną porę. Krótsza bajka, wspólne oglądanie obrazków czy pomoc przy czytaniu to możliwości, nie kolejne obowiązki do odhaczenia. Wybierzcie to, na co macie siłę.
faq.2.question=Co zrobić, gdy boli mnie gardło, a dziecko prosi mnie o czytanie?
faq.2.answer=Wyjaśnij krótko, że głos potrzebuje odpoczynku, albo poproś innego dorosłego, żeby to wyjaśnił. Zaproponuj oglądanie obrazków, czytanie przez kogoś innego lub gotowe nagranie. Nie musisz nagrywać nowej bajki, kiedy mówienie sprawia trudność. W sprawie objawów kieruj się zaleceniami lekarza.
faq.3.question=Czy bajka audio może zastąpić czytanie na głos?
faq.3.answer=Może przejąć czytanie na jeden wieczór, ale to inne doświadczenie niż wspólna rozmowa o książce. Dorosły nadal może być obok, zatrzymywać nagranie i odpowiadać dziecku. To praktyczna możliwość na dany wieczór, nie stwierdzenie, że słuchanie nagrań i wspólne czytanie przynoszą identyczne korzyści.
faq.4.question=Co jeśli nie mamy żadnego gotowego nagrania?
faq.4.answer=Zacznij od tego, co jest dostępne: krótszej książki, jeśli możesz swobodnie mówić, oglądania obrazków lub pomocy innego zaufanego dorosłego. Nie zamieniaj tego wieczoru w sesję nagraniową. Jedną bajkę możesz przygotować na zapas, kiedy będziesz mieć więcej siły.
faq.5.question=Czy obiecać dłuższą bajkę jutro?
faq.5.answer=Obiecuj tylko to, co prawdopodobnie będziesz w stanie zrobić. „Możemy wrócić do tej książki” zostawia miejsce na to, jak ułoży się jutro. Łatwiej dotrzymać prostego, uczciwego zakończenia niż obietnicy trzech dodatkowych bajek, gdy nie wiesz, jak będziesz się czuć.
sources.title=Źródła i zakres poradnika
sources.body=Praktyczne przykłady i propozycje zdań opracowała redakcja Sleep2Story. Poniższe źródła dostarczają informacji o dbaniu o głos i wieczornych rytuałach. Nie dowodzą, że konkretna aplikacja pomaga dziecku zasnąć.
