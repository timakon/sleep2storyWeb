figure.alt=Ilustração de tons quentes de um adulto cansado ao lado de uma criança, com um livro aberto e um pequeno candeeiro de cabeceira
figure.caption=A história pode ser mais curta esta noite. O momento continua a ser vosso.
intro.title=Perceba o que precisa de tornar mais fácil
intro.body1=Às vezes, o problema é o tamanho do livro. Outras vezes, já não apetece voltar a fazer todas as vozes das personagens. E há noites em que tem dores de garganta e ler em voz alta causa mesmo desconforto. Cada situação pede uma escolha diferente. Um livro mais curto ajuda quando há cansaço; não resolve o problema de uma voz que precisa de descanso.
intro.body2=Antes de dar opções, decida o que consegue realmente fazer. «Estas duas páginas ou a história que temos gravada?» é uma proposta mais fácil de cumprir do que «Escolhe o que quiseres». Não precisa de procurar a nova história para dormir perfeita enquanto a criança espera. Comece por um livro, uma gravação ou outro adulto já disponível na família.
tonight.kicker=Comece pelo que já tem
tonight.title=Quatro formas de manter a história na rotina desta noite
tonight.lead=Escolha uma opção, sem tentar as quatro. Se a criança já estiver pronta para terminar, podem passar diretamente ao «boa noite» habitual.
option.1.title=Leia um pequeno trecho de um livro conhecido
option.1.body1=Quando há cansaço mas falar não custa, escolha uma história curta, duas páginas preferidas ou um só capítulo. Diga onde vão parar antes de começar. Num livro mais longo, um marcador deixa claro o ponto de onde podem continuar amanhã.
option.1.body2=Use a sua voz habitual. Pode dispensar as vozes elaboradas das personagens e os efeitos sonoros. Se a criança pedir mais, termine com clareza: «Por hoje, a história fica por aqui. Amanhã podemos continuar a partir desta página.» A duração deve servir aos dois, sem regras sobre quantos minutos deve ler um bom pai ou uma boa mãe.
option.2.title=Deixe as imagens contar a história
option.2.body1=Abra um livro que a criança conheça e convide-a a apontar, a virar a página ou a dizer o que vê. Uma criança que ainda não conte histórias pode simplesmente escolher a imagem preferida. Pode ouvir e responder com um sorriso ou um aceno; não é preciso transformar o momento numa lição.
option.2.body2=Experimente um pequeno convite, como «Mostra-me para onde foi o ursinho». Se falar causar desconforto, deixem que os gestos e o virar das páginas contem a história. Se a criança não quiser participar, escolha outra opção. Não tem de contar o livro inteiro só porque o adulto está cansado.
option.3.title=Peça a outro adulto para ler e combinem onde terminar
option.3.body1=Se houver outro adulto de confiança disponível, faça um pedido concreto: este livro, estas páginas e depois o «boa noite» de sempre. Pode ficar por perto, se isso fizer sentido para a família, ou deixar esse adulto assumir a leitura. Não precisa de imitar exatamente a sua maneira de ler.
option.3.body2=Um familiar ao telefone é outra possibilidade, se o horário e a disposição da criança o permitirem. Combinem uma só história antes da chamada. Uma conversa em direto pode tornar-se uma troca animada de novidades, por isso encare a chamada como uma opção, não como algo que tem de organizar à hora de deitar. Uma gravação preparada antes dispensa a necessidade de conciliar fusos horários.
option.4.title=Ponha a tocar uma história em áudio que já escolheu
option.4.body1=Uma gravação familiar conhecida ou uma história em áudio adequada à idade pode fazer a leitura enquanto descansa. Escolha a faixa, verifique o início e o fim e, se o leitor o permitir, programe-o para parar depois da história. Mantenha um volume confortável e deixe o dispositivo e quaisquer cabos fora do alcance da criança.
option.4.body2=Inicie o áudio e depois deixe o ecrã de lado. Se a criança quiser o livro, pode vê-lo enquanto ouve a gravação. Fique disponível para perguntas ou para uma mudança de ideias. Se o áudio tornar esta noite mais agitada, pare e volte a uma opção mais tranquila. Hoje não precisa de criar uma conta nova nem de passar muito tempo a percorrer recomendações.
voice.title=As dores de garganta são motivo para mudar o plano da leitura
voice.body1=Se a voz estiver rouca ou cansada, dê-lhe descanso; sussurrar não é uma alternativa. Esta é uma recomendação do NIDCD, o instituto norte-americano dedicado à surdez e a outras perturbações da comunicação.
voice.link=Leia as recomendações do NIDCD para cuidar da voz
voice.body2=Para a hora da história, escolha uma opção que não exija falar: outro adulto, uma gravação que já tenha ou ver as imagens em conjunto. Gravar uma nova amostra de voz esta noite obriga a usar precisamente a voz que está a tentar descansar. Prepare-a mais tarde. Este artigo apresenta alternativas à leitura, não um diagnóstico ou tratamento; procure aconselhamento médico se os sintomas causarem preocupação ou não melhorarem.
words.title=O que dizer quando a criança quer ouvir a sua voz
words.intro=Uma explicação curta e uma escolha são geralmente mais fáceis de dar do que entrar numa longa negociação. Estas frases são exemplos para adaptar, não falas que tenha de dizer na perfeição. Se falar doer, outro adulto pode explicar o plano.
words.1.label=Quando resta muito pouca energia
words.1.text=«Esta noite já estou sem forças. Podemos ler estas duas páginas em conjunto e depois damos as boas-noites.»
words.2.label=Quando a voz precisa de descanso
words.2.text=«A minha voz precisa de descansar. Podemos ver as imagens em conjunto enquanto outra pessoa lê.»
words.3.label=Quando tem uma gravação guardada
words.3.text=«Esta noite vamos ouvir a nossa história gravada. Posso sentar-me ao teu lado enquanto ouvimos.»
words.end=Se nenhuma das opções resultar, feche o livro e dê as boas-noites como de costume. Pode propor uma história noutra altura. Esta noite não precisa de substituir cada minuto de leitura previsto por outra atividade.
backup.title=Num dia melhor, prepare algumas histórias de reserva
backup.lead=Para começar, bastam umas poucas gravações, sem mais um projeto para gerir. Num dia em que tenha alguma energia e falar não cause desconforto, facilite a próxima noite de cansaço em três passos.
backup.1.title=Escolha uma história curta de que gostem e que possa gravar
backup.1.body=Use uma história sua ou um texto que tenha autorização para gravar e utilizar. Um início familiar e um final claro facilitam a escolha mais tarde. Se o livro for longo, escolha um trecho curto que possa usar, em vez de prometer acabar tudo de uma só vez.
backup.2.title=Grave, ouça e dê um nome claro ao ficheiro
backup.2.body=Uma gravação no telemóvel é um ponto de partida prático. Ouça-a uma vez para confirmar que as palavras são percetíveis e o final está completo. Inclua o título da história e o nome de quem lê no nome do ficheiro, e guarde o original num local que controle. Se outro familiar fizer a gravação, combinem como serão usadas a voz e a gravação dessa pessoa.
backup.3.title=Teste a reprodução antes de precisar da história
backup.3.body=Abra a gravação no dispositivo que vai usar à hora de deitar. Verifique se precisa de internet, se o áudio continua quando deixa de usar o ecrã e o que toca a seguir. Estas funções dependem do leitor. Guarde a história escolhida num local onde um adulto a consiga encontrar sem percorrer toda a biblioteca.
backup.note=Precisa de ajuda com a gravação? O nosso guia para gravar com o telemóvel explica como escolher a divisão, fazer um teste de som curto e resolver problemas de áudio comuns. Se já tem uma rotina que funciona, mantenha-a; esta pequena reserva só precisa de encaixar nela.
product.eyebrow=Em preparação para iOS e Android
product.title=Uma voz familiar, preparada com antecedência
product.body=O Sleep2Story está a ser desenvolvido para este tipo de preparação. Um adulto grava uma pequena amostra de voz com o consentimento de quem fala e acrescenta o texto completo da história. A aplicação prepara uma narração sintética com a voz familiar escolhida, para ouvir numa biblioteca pessoal. Não escreve a história: o áudio criado não é uma gravação original de alguém a ler esse texto.
product.body2=A aplicação ainda não está disponível nas lojas. No lançamento, está prevista a narração em inglês e russo; uma página traduzida no site não significa que a narração nesse idioma esteja disponível. Para esta noite, use uma opção que já tenha. O Sleep2Story é uma forma de preparar noites futuras, não um remédio imediato para uma voz cansada ou dolorosa.
