answer.title=Escolha a forma de partilhar uma história que consegue gerir esta noite.
answer.body=Se a voz estiver bem, leia uma história preferida muito curta ou vejam um livro em conjunto. Se falar causar desconforto, peça a outro adulto de confiança para ler ou use um áudio que já tenha. Mantenha o «boa noite» de sempre; deixe a gravação de uma nova história para um dia em que a voz esteja bem.
