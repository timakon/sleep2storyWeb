faq.title=Perguntas que surgem nas noites de cansaço
faq.1.question=Faz mal não ler a história ao deitar esta noite?
faq.1.answer=Se esta noite ler for mais do que consegue fazer, pode manter as boas-noites e propor um livro noutra altura. Uma história mais curta, ver imagens em conjunto ou pedir a outra pessoa para ler são opções, não mais tarefas que tem de cumprir. Escolha o que for possível para a sua família.
faq.2.question=E se tiver dores de garganta, mas a criança quiser que eu leia?
faq.2.answer=Explique em poucas palavras que a voz precisa de descanso ou peça a outro adulto para explicar. Proponha ver imagens, ouvir outro leitor ou uma gravação já feita. Não precisa de fazer uma nova gravação enquanto falar causar desconforto. Siga o aconselhamento médico adequado aos seus sintomas.
faq.3.question=Uma história em áudio pode substituir a leitura em voz alta?
faq.3.answer=Pode assumir a narração numa determinada noite, mas é uma experiência diferente de conversar sobre um livro em conjunto. Um adulto pode continuar presente, fazer pausas e responder à criança. É uma opção prática; não significa que o áudio e a leitura partilhada tenham benefícios idênticos.
faq.4.question=E se não tivermos nenhuma gravação pronta?
faq.4.answer=Comece pelo que tem: um livro mais curto, se falar não causar desconforto, ver imagens ou pedir a outro leitor de confiança. Não transforme esta noite numa sessão de gravação. Pode preparar e guardar uma história quando tiver mais energia.
faq.5.question=Devo prometer uma história mais longa amanhã?
faq.5.answer=Prometa apenas algo que espera conseguir fazer. «Podemos voltar a este livro» deixa margem para o que acontecer amanhã. Um final simples e honesto é mais fácil de cumprir do que aceitar ler mais três histórias sem saber como se vai sentir.
sources.title=Fontes e âmbito do guia
sources.body=Os exemplos práticos e as frases propostas são sugestões da redação Sleep2Story. As fontes abaixo dão contexto sobre os cuidados com a voz e as rotinas ao deitar; não demonstram que uma determinada aplicação ajude uma criança a dormir.
sources.nidcd=NIDCD: cuidar da sua voz (em inglês)
sources.aap=Academia Americana de Pediatria: lavar os dentes, ler e ir para a cama (em inglês)
sources.wipo=Organização Mundial da Propriedade Intelectual: perguntas sobre direitos de autor (em inglês)
