answer.title=Přizpůsobte dnešní pohádku tomu, na co máte sílu.
answer.body=Pokud se vám mluví dobře, přečtěte krátkou oblíbenou pohádku nebo si společně prohlédněte knížku. Jestli je mluvení nepříjemné, požádejte o čtení jiného dospělého, kterému důvěřujete, nebo pusťte nahrávku, kterou už máte. Rozlučte se na noc jako obvykle. Novou pohádku nahrajte až v den, kdy bude váš hlas v pořádku.
