meta.title=Nemáte sílu číst pohádku na dobrou noc? | Sleep2Story
meta.description=Na čtení pohádky už nemáte sílu nebo vás bolí v krku? Zkuste kratší příběh, pomoc blízkého či hotovou nahrávku. Praktické možnosti na dnešek i příště.
meta.og_title=Nemáte sílu číst pohádku na dobrou noc? Co zkusit dnes
meta.og_description=Praktické možnosti pro unavené rodiče: kratší pohádka, společné prohlížení obrázků, někdo jiný u čtení nebo předem připravená nahrávka.
meta.twitter_description=Pohádka na dobrou noc, když docházejí síly: co zkusit dnes večer, jak to říct dítěti a co si připravit, až vám bude lépe.
schema.description=Praktický průvodce pro rodiče, kteří už nemají sílu předčítat nebo potřebují šetřit hlas: jiné možnosti na dnešní večer a příprava nahrávek na příště.
hero.eyebrow=Pro unavené rodiče · Průvodce 04
hero.title=Nemáte už sílu číst pohádku na dobrou noc?
hero.dek=Knížka je otevřená, dítě chce ještě jednu pohádku a vám už na čtení nezbývají síly. Tady je jednoduchý plán na dnešní večer, i pro chvíle, kdy mluvení bolí.
