faq.title=Otázky, které přicházejí v náročné večery
faq.1.question=Je v pořádku dnes pohádku na dobrou noc vynechat?
faq.1.answer=Jestli dnes čtení nezvládnete, můžete se rozloučit na noc jako obvykle a knížku nabídnout jindy. Kratší příběh, společné obrázky nebo jiný čtenář jsou možnosti, ne další úkoly, které musíte splnit. Vyberte si to, co vaše rodina dnes zvládne.
faq.2.question=Co když mě bolí v krku, ale dítě chce pohádku právě ode mě?
faq.2.answer=Krátce vysvětlete, že váš hlas potřebuje odpočinek, nebo požádejte o vysvětlení jiného dospělého. Nabídněte obrázky, jiného čtenáře nebo hotovou nahrávku. Když se vám špatně mluví, nemusíte pořizovat novou. Ohledně svých příznaků se řiďte radami lékaře.
faq.3.question=Může audiopohádka nahradit čtení nahlas?
faq.3.answer=Na jeden večer může převzít vyprávění, ale je to jiný zážitek než společné povídání o knížce. Dospělý může být dál přítomný, nahrávku zastavovat a reagovat na dítě. Je to praktická možnost, ne tvrzení, že poslech a společné čtení mají stejné přínosy.
faq.4.question=Co když nemáme připravenou žádnou nahrávku?
faq.4.answer=Začněte tím, co je k dispozici: kratší knížkou, pokud se vám dobře mluví, prohlížením obrázků nebo pomocí jiného dospělého, kterému důvěřujete. Do nahrávání se dnes večer nepouštějte. Jednu pohádku do zásoby si můžete připravit, až budete mít víc energie.
faq.5.question=Mám na zítra slíbit delší pohádku?
faq.5.answer=Slibujte jen to, co podle vás budete schopni splnit. „K téhle knížce se můžeme vrátit“ nechává prostor pro to, jak bude zítřek vypadat. Jednoduché a upřímné ukončení čtení dodržíte snáz než slib tří pohádek navíc, když nevíte, jak se budete cítit.
