figure.alt=Ilustrace v teplých barvách: unavený rodič vedle dítěte, otevřená knížka a malá noční lampička
figure.caption=Dnes může být pohádka kratší. Pořád to může být vaše společná chvíle.
intro.title=Rozmyslete si, co si dnes potřebujete ulehčit
intro.body1=Někdy je problém v délce knížky. Jindy už nemáte sílu vymýšlet každé postavě jiný hlas. A někdy vás bolí v krku a čtení nahlas je prostě nepříjemné. Každá z těchto situací potřebuje jiné řešení. Kratší knížka pomůže při únavě, ale nenahradí odpočinek pro hlas.
intro.body2=Než dítěti nabídnete výběr, rozmyslete si, co opravdu zvládnete. Nabídku „Tyhle dvě stránky, nebo naše nahrávka?“ dodržíte snáz než „Vyber si cokoli“. Nemusíte hledat dokonalou novou pohádku na dobrou noc, zatímco dítě čeká. Začněte knížkou, nahrávkou nebo pomocí dospělého, které máte právě k dispozici.
tonight.kicker=Začněte tím, co máte po ruce
tonight.title=Čtyři možnosti, jak dnes večer zařadit pohádku
tonight.lead=Vyberte si jednu možnost. Nemusíte zkoušet všechny čtyři. Pokud i dítě už chce skončit, můžete si rovnou popřát dobrou noc tak, jak jste zvyklí.
option.1.title=Přečtěte krátký úsek známé knížky
option.1.body1=Když jste unavení, ale mluvení vám nedělá potíže, vyberte jednu krátkou pohádku, dvě oblíbené stránky nebo jedinou kapitolu. Ještě před čtením řekněte, kde skončíte. Záložkou označíte místo, od kterého se k delšímu příběhu můžete zítra vrátit.
option.1.body2=Čtěte svým běžným hlasem. Složité hlasy postav i zvukové efekty můžete vynechat. Jestli dítě chce pokračovat, jasně čtení uzavřete: „Pro dnešek už je pohádky konec. Zítra můžeme číst dál od téhle stránky.“ Délka má vyhovovat vám oběma, ne nějakému pravidlu o tom, kolik minut čte dobrý rodič.
option.2.title=Prohlížejte si spolu obrázky
option.2.body1=Otevřete knížku, kterou dítě zná, a nabídněte mu, ať ukazuje, otáčí stránky nebo vypráví, čeho si všimlo. Dítě, které ještě samo nevypráví, si může jednoduše vybrat oblíbený obrázek. Vy můžete poslouchat, usmívat se nebo přikyvovat. Nemusí z toho být učení.
option.2.body2=Stačí drobná pobídka, třeba „Ukaž mi, kam šel medvídek.“ Jestli je vám mluvení nepříjemné, zůstaňte u ukazování a otáčení stránek. Pokud se dítěti nechce, vyberte jinou možnost. Nemusí odvyprávět celou knížku jen proto, že je dospělý unavený.
option.3.title=Požádejte někoho o čtení a domluvte se na konci
option.3.body1=Je-li k dispozici jiný dospělý, kterému důvěřujete, požádejte ho o konkrétní pomoc: tuto knížku, tyto stránky a potom obvyklé přání na dobrou noc. Můžete zůstat nablízku, pokud vám to vyhovuje, nebo mu nechat zbytek večera na starost. Nemusí přesně napodobovat váš způsob čtení.
option.3.body2=Další možností je zavolat někomu z rodiny, pokud se to časově hodí a dítě na to má náladu. Předem se domluvte na jedné pohádce. Hovor se může proměnit v živé povídání o novinkách, berte ho tedy jako možnost, ne něco, co musíte před spaním zařídit. Předem připravená nahrávka nevyžaduje hledání společného času napříč časovými pásmy.
option.4.title=Pusťte předem vybranou pohádku k poslechu
option.4.body1=Známá rodinná nahrávka nebo audiopohádka přiměřená věku dítěte může převzít čtení, zatímco si odpočinete. Nahrávku vyberte sami, zkontrolujte začátek a konec a nastavte zastavení po pohádce, pokud to přehrávač umožňuje. Zvolte příjemnou hlasitost a zařízení i všechny kabely nechte mimo dosah dítěte.
option.4.body2=Spusťte nahrávku a obrazovku odložte. Pokud dítě chce knížku, může si ji při poslechu prohlížet. Zůstaňte k dispozici pro otázky i pro případ, že si poslech rozmyslí. Pokud nahrávka zrovna dnes přináší víc ruchu, vypněte ji a vraťte se ke klidnější možnosti. Dnes večer nepotřebujete nový účet ani dlouhé procházení doporučených příběhů.
voice.title=Když vás bolí v krku, změňte plán čtení
voice.body1=Pokud chraptíte nebo je váš hlas unavený, dopřejte mu odpočinek. Šeptání odpočinek nenahradí. Tak zní doporučení amerického institutu NIDCD, který se zabývá sluchem, hlasem a komunikací.
voice.link=Přečtěte si doporučení NIDCD k péči o hlas (anglicky)
voice.body2=Zvolte možnost, při které nemusíte mluvit: čtení jiného dospělého, hotovou nahrávku nebo společné prohlížení obrázků. Pořízením nového hlasového vzorku byste dnes zatěžovali právě ten hlas, který má odpočívat. Nechte to na později. Tento článek nabízí jiné možnosti místo předčítání; neslouží k určení diagnózy ani k léčbě. Pokud vás příznaky znepokojují nebo neustupují, poraďte se s lékařem.
words.title=Co říct, když chce dítě slyšet právě váš hlas
words.intro=Krátké vysvětlení a jednoduchý výběr obvykle stojí méně sil než dlouhé vyjednávání. Následující věty si upravte po svém. Nemusíte je říkat přesně. Pokud vás mluvení bolí, může plán vysvětlit jiný dospělý.
words.1.label=Když vám už skoro nezbývá energie
words.1.text=„Dnes už mám jen málo sil. Přečteme si spolu tyhle dvě stránky a pak si popřejeme dobrou noc.“
words.2.label=Když hlas potřebuje odpočinek
words.2.text=„Můj hlas si potřebuje odpočinout. Můžeme si spolu prohlížet obrázky a někdo jiný nám bude číst.“
words.3.label=Když máte připravenou nahrávku
words.3.text=„Dnes si naši pohádku pustíme z nahrávky. Můžu sedět u tebe a poslouchat s tebou.“
words.end=Pokud nevyhovuje žádná možnost, zavřete knížku a rozlučte se na noc jako obvykle. Pohádku můžete nabídnout jindy. Nemusíte vyplnit jinou činností každou minutu, kterou jste původně chtěli věnovat čtení.
backup.title=V klidnější den si připravte pohádku do zásoby
backup.lead=Na začátek stačí pár nahrávek. Nemá to být další projekt, o který se musíte starat. V den, kdy máte trochu energie a mluví se vám dobře, si usnadněte příští náročný večer ve třech krocích.
backup.1.title=Vyberte krátký oblíbený příběh, který smíte nahrát
backup.1.body=Použijte vlastní příběh nebo text, k jehož nahrání a použití máte svolení. Známý začátek a jasný konec vám později usnadní výběr. Pokud je knížka dlouhá, zvolte krátký úsek, který smíte nahrát, místo abyste si slibovali, že ji zvládnete celou najednou.
backup.2.title=Nahrajte, poslechněte a soubor srozumitelně pojmenujte
backup.2.body=Pro začátek stačí nahrávka z telefonu. Jednou si ji poslechněte a ověřte, že je slovům rozumět a nechybí konec. Do názvu souboru dejte název pohádky a jméno čtenáře. Originál uchovejte na místě, nad kterým máte kontrolu. Pokud nahrává někdo z rodiny, domluvte se, jak budete jeho hlas a nahrávku používat.
backup.3.title=Vyzkoušejte přehrávání dřív, než budete nahrávku potřebovat
backup.3.body=Otevřete nahrávku na zařízení, které budete používat před spaním. Ověřte, zda potřebuje internet, jestli zvuk pokračuje po vypnutí displeje a co se přehraje po skončení. To záleží na přehrávači. Vybranou pohádku uložte tak, aby ji dospělý našel bez procházení celé knihovny.
backup.note=Potřebujete poradit se samotným nahráváním? Náš průvodce nahráváním na telefon popisuje výběr místnosti, krátkou zvukovou zkoušku i běžné potíže se zvukem. Pokud už máte večerní rituál, který vám vyhovuje, zachovejte ho. Připravená nahrávka se do něj má jen přirozeně zařadit.
product.eyebrow=Připravujeme pro iOS a Android
product.title=Známý hlas někoho blízkého, připravený předem
product.body=Sleep2Story vzniká právě pro takovou přípravu. Dospělý pořídí krátký hlasový vzorek se souhlasem člověka, kterému hlas patří, a vloží celý text pohádky. Aplikace připraví syntetické vyprávění vybraným hlasem člena rodiny k poslechu v osobní knihovně. Příběh sama nepíše a výsledná nahrávka není původním záznamem toho, jak dotyčný člověk čte přesně tato slova.
product.body2=Aplikace zatím není dostupná v obchodech. Při spuštění plánujeme vyprávění v angličtině a ruštině. Česká verze webu neznamená, že je dostupné vyprávění v češtině. Pro dnešní večer použijte to, co už máte. Sleep2Story je možnost, jak se připravit na příští večery, ne okamžité řešení únavy nebo bolesti při mluvení.
product.cta=Podívejte se, jak Sleep2Story funguje
