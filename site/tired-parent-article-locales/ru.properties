figure.alt=Тёплая иллюстрация: уставший родитель рядом с ребёнком, открытой книгой и небольшой лампой у кровати
figure.caption=Сегодня сказка может быть короче. Время вместе от этого не исчезнет.
intro.title=Сначала поймите, что именно хочется упростить
intro.body1=Иногда книга просто слишком длинная. Иногда совсем не хочется читать детям: вы устали и больше не можете изображать голоса всех героев. А иногда болит горло и читать вслух неприятно. Для этих вечеров нужны разные решения. Короткая книга поможет, если вы устали, но не заменит отдых, когда он нужен голосу.
intro.body2=Прежде чем предлагать выбор, решите, на что у вас действительно есть силы. «Эти две страницы или наша запись?» — договорённость, которую легче выполнить, чем «Выбирай что угодно». Не нужно искать идеальную новую сказку, пока ребёнок ждёт. Начните с того, что уже доступно вашей семье: книги, записи или помощи другого взрослого.
tonight.kicker=Начните с того, что уже есть
tonight.title=Четыре способа оставить сказку в сегодняшнем вечере
tonight.lead=Выберите один вариант: пробовать все четыре не нужно. Если ребёнок уже готов закончить, можно сразу перейти к привычному пожеланию спокойной ночи.
option.1.title=Прочитайте небольшой отрывок знакомой книги
option.1.body1=Если вы устали, но говорить комфортно, выберите одну короткую сказку, две любимые страницы или одну главу. До начала чтения скажите, где остановитесь. В длинной истории оставьте закладку: завтра будет понятно, с какого места продолжать.
option.1.body2=Читайте обычным голосом. Сложные голоса персонажей и звуковые эффекты можно пропустить. Если ребёнок просит ещё, спокойно обозначьте конец: «На сегодня сказка закончилась. Завтра можем продолжить с этой страницы». Объём чтения должен подходить вам обоим, а не правилу о том, сколько минут читают хорошие родители.
option.2.title=Посмотрите картинки вместе
option.2.body1=Откройте знакомую ребёнку книгу и предложите показать что-нибудь на картинке, перевернуть страницу или рассказать, что он заметил. Малыш, который пока не рассказывает истории, может просто выбрать любимую иллюстрацию. Вы можете слушать и отвечать улыбкой или кивком. Превращать это в занятие не нужно.
option.2.body2=Начните с простого: «Покажи, куда пошёл медвежонок». Если говорить неприятно, можно молча показывать картинки и листать страницы. Если ребёнок не хочет рассказывать, выберите другой вариант. Он не обязан пересказывать всю книгу только потому, что взрослый устал.
option.3.title=Попросите другого взрослого прочитать до условленного места
option.3.body1=Если рядом есть взрослый, которому вы доверяете, попросите о конкретной помощи: вот эта книга, вот эти страницы, затем привычное «спокойной ночи». Вы можете остаться поблизости или полностью передать ему укладывание — как удобнее вашей семье. Точно повторять вашу манеру чтения не требуется.
option.3.body2=Можно попросить родственника прочитать сказку по звонку, если время и настроение ребёнка позволяют. Заранее договоритесь об одной истории. Живой разговор легко превращается в оживлённый обмен новостями, поэтому звонок — лишь один из вариантов, а не обязательная задача перед сном. А для записи, подготовленной заранее, не придётся подстраиваться под чужой часовой пояс.
option.4.title=Включите аудиосказку, которую уже выбрали
option.4.body1=Знакомая семейная запись или подходящая по возрасту аудиосказка прочитает историю, пока вы отдыхаете. Сами выберите дорожку, проверьте начало и конец и, если плеер позволяет, настройте остановку после сказки. Сделайте громкость комфортной, а устройство и провода разместите вне досягаемости ребёнка.
option.4.body2=Запустите аудио и отложите экран. Если ребёнку нужна книга, он может смотреть её во время прослушивания. Оставайтесь доступны, чтобы ответить на вопрос или помочь, если ребёнок передумает. Если именно сегодня аудио только добавляет суеты, выключите его и выберите что-нибудь тише. Заводить новый аккаунт и долго перебирать рекомендации этим вечером не нужно.
voice.title=Болит горло — можно изменить план чтения
voice.body1=Если голос охрип или устал, дайте ему отдохнуть; переходить на шёпот вместо этого не стоит. Такие рекомендации по заботе о голосе даёт Национальный институт глухоты и других нарушений коммуникации США (NIDCD).
voice.link=Рекомендации NIDCD по заботе о голосе
voice.body2=Выберите вариант, в котором вам не нужно говорить: чтение другого взрослого, готовую запись или совместное рассматривание картинок. Записывая новый образец голоса сегодня, вы снова нагружаете голос, которому нужен отдых. Сделайте это позже. В этой статье собраны замены чтению, а не способы поставить диагноз или лечиться; обратитесь к врачу, если симптомы вас беспокоят или не проходят.
words.title=Что сказать, если ребёнок хочет именно ваш голос
words.intro=Короткое объяснение и понятный выбор обычно проще долгих переговоров. Ниже — примеры, которые можно изменить под себя, а не обязательные правильные слова. Если говорить больно, объяснить план может другой взрослый.
words.1.label=Если сил почти не осталось
words.1.text=«Сегодня у меня совсем мало сил. Давай прочитаем вместе эти две страницы, а потом пожелаем друг другу спокойной ночи».
words.2.label=Если голосу нужен отдых
words.2.text=«Моему голосу нужно отдохнуть. Мы можем вместе смотреть картинки, пока нам читает кто-то другой».
words.3.label=Если есть сохранённая запись
words.3.text=«Сегодня послушаем нашу сказку в записи. Я могу посидеть с тобой, пока она звучит».
words.end=Если ни один вариант не подошёл, закройте книгу и пожелайте спокойной ночи, как обычно. Сказку можно предложить в другое время. Не обязательно придумывать новое занятие на каждую минуту, которую вы собирались потратить на чтение.
backup.title=В день, когда будут силы, подготовьте небольшой запас сказок
backup.lead=Для начала достаточно совсем небольшой подборки. Ещё один большой проект вам не нужен. Когда появятся силы и говорить будет комфортно, сделайте три шага, чтобы следующий уставший вечер прошёл проще.
backup.1.title=Выберите короткую любимую историю, которую можно записать
backup.1.body=Возьмите собственную сказку или текст, который вам разрешено записывать и использовать. Знакомое начало и ясный финал помогут быстро выбрать историю в нужный вечер. Если книга длинная, подберите небольшой отрывок, на запись которого есть разрешение, вместо обещания прочитать всё за один раз.
backup.2.title=Запишите, послушайте и понятно назовите файл
backup.2.body=Начать можно с обычной записи на телефон. Прослушайте её один раз: слова должны быть разборчивыми, а конец — не обрезанным. Добавьте в имя файла название сказки и имя чтеца, сохраните оригинал там, где сами управляете доступом. Если записывает другой член семьи, заранее договоритесь, как будут использоваться его голос и запись.
backup.3.title=Проверьте воспроизведение заранее
backup.3.body=Откройте запись на устройстве, с которого будете включать сказку перед сном. Проверьте, нужен ли интернет, продолжается ли звук при выключенном экране и что включается после окончания. Всё это зависит от плеера. Сохраните выбранную историю так, чтобы взрослый мог найти её без просмотра всей библиотеки.
backup.note=Нужна помощь с самой записью? В нашем руководстве по записи на телефон разобраны выбор комнаты, короткая проверка звука и частые неполадки. Если вечерний ритуал уже вам подходит, сохраните его: запасная сказка должна просто в него вписаться.
product.eyebrow=Готовится для iOS и Android
product.title=Знакомый голос для будущих вечеров
product.body=Sleep2Story создаётся для такой подготовки. Взрослый записывает короткий образец голоса с согласия того, кому он принадлежит, и добавляет полный текст сказки. Приложение готовит синтетическую озвучку выбранным голосом близкого человека для прослушивания в личной библиотеке. Оно не сочиняет сказку и не сохраняет подлинное чтение именно этих слов.
product.body2=Приложение пока недоступно в магазинах. При запуске планируется озвучка на русском и английском; перевод страницы сайта не означает, что озвучка на этом языке уже доступна. Для сегодняшнего вечера выберите то, что у вас уже есть. Sleep2Story — один из способов подготовиться к будущим вечерам, а не немедленная помощь уставшему голосу или больному горлу.
product.cta=Посмотреть, как работает Sleep2Story
