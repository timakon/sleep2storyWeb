meta.title=Нет сил читать сказку на ночь? Что сделать сегодня | Sleep2Story
meta.description=Устали читать сказку на ночь или болит горло? Короткая история, другой чтец или готовая запись: простые варианты на сегодня и подготовка на будущее.
meta.og_title=Нет сил читать сказку на ночь? План на сегодняшний вечер
meta.og_description=Что поможет уставшему родителю: короткий отрывок, картинки в книге, другой близкий взрослый или запись, сделанная заранее.
meta.twitter_description=Сказка на ночь, когда сил почти не осталось: что выбрать сегодня, как объяснить это ребёнку и что подготовить в другой день.
schema.description=Практические советы для вечера, когда родитель слишком устал читать вслух или голосу нужен отдых: доступные замены чтению и подготовка записей на будущее.
hero.eyebrow=Уставшим родителям · руководство 04
hero.title=Нет сил читать сказку на ночь?
hero.dek=Книга открыта, ребёнок просит ещё одну сказку, а у вас уже не осталось сил читать вслух. Вот небольшой план на сегодняшний вечер — в том числе на случай, когда говорить больно.
byline.read_time=8 минут чтения
byline.date=7 сентября 2026
nav.tonight=На сегодня
nav.voice=Отдых для голоса
nav.backup=На будущее
answer.title=Выберите сказку в том виде, на который сегодня хватит сил.
answer.body=Если говорить комфортно, прочитайте короткую любимую историю или посмотрите книгу вместе. Если голосу нужен отдых, попросите другого близкого взрослого почитать или включите уже готовое аудио. Сохраните привычное «спокойной ночи», а новую запись сделайте в день, когда голос будет в порядке.
