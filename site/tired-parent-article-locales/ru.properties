faq.title=О чём спрашивают родители, когда к вечеру нет сил
faq.1.question=Можно ли сегодня обойтись без сказки на ночь?
faq.1.answer=Если сегодня на чтение не хватает сил, можно сохранить привычное «спокойной ночи» и предложить книгу в другое время. Короткая сказка, картинки или другой чтец — это варианты, а не дополнительные обязанности. Выберите то, что сейчас по силам вашей семье.
faq.2.question=Что делать, если болит горло, а ребёнок просит прочитать сказку?
faq.2.answer=Коротко объясните, что голосу нужен отдых, или попросите об этом другого взрослого. Предложите посмотреть картинки, послушать другого чтеца или готовую запись. Записывать новую сказку, когда говорить неприятно, не нужно. Следуйте медицинским рекомендациям, которые относятся к вашим симптомам.
faq.3.question=Может ли аудиосказка заменить чтение вслух перед сном?
faq.3.answer=В отдельный вечер запись может прочитать сказку за вас, но это другой опыт, чем совместное обсуждение книги. Взрослый может оставаться рядом, ставить дорожку на паузу и отвечать ребёнку. Это практический вариант, а не утверждение, что аудио и совместное чтение приносят одинаковую пользу.
faq.4.question=Что делать, если готовой записи нет?
faq.4.answer=Начните с того, что есть: короткой книги, если говорить комфортно, рассматривания картинок или помощи другого взрослого, которому вы доверяете. Не превращайте сегодняшний вечер в сеанс записи. Одну сказку про запас можно записать, когда сил будет больше.
faq.5.question=Стоит ли обещать завтра сказку подлиннее?
faq.5.answer=Обещайте только то, что, скорее всего, сможете выполнить. «Мы можем вернуться к этой книге» оставляет место для того, как сложится завтрашний день. Честно закончить чтение сейчас проще, чем пообещать три дополнительные сказки, не зная, как вы будете себя чувствовать.
sources.title=Источники и границы рекомендаций
sources.body=Практические примеры и варианты фраз предложены редакцией Sleep2Story. Источники ниже дают общую информацию о заботе о голосе и вечерних ритуалах; они не доказывают, что какое-либо приложение помогает ребёнку уснуть.
