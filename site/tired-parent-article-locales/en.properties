answer.title=Choose the version of storytime you can manage tonight.
answer.body=If your voice feels fine, read a very short favourite or look at a book together. If speaking is uncomfortable, ask another trusted adult to read or use audio you already have. Keep the familiar goodnight; save recording a new story for a day when your voice feels well.
