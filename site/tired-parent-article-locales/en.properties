figure.alt=Warm illustration of a tired parent beside a child, with an open book and a small bedside lamp
figure.caption=The story can be smaller tonight. You can still share the moment.
intro.title=Decide what needs to be easier
intro.body1=Sometimes the problem is the length of the book. Sometimes you cannot face doing the voices again. And sometimes you have a sore throat and reading aloud is simply uncomfortable. Those evenings need different choices. A shorter book helps with tiredness; it does not solve a voice that needs a rest.
intro.body2=Before offering a choice, decide what you can actually do. “These two pages or our saved story?” is easier to keep than “Choose anything.” You do not need to search for the perfect new bedtime story while your child waits. Start with a book, recording or other adult already available to your family.
tonight.kicker=Start with what you have
tonight.title=Four ways to keep a story in tonight’s routine
tonight.lead=Choose one option, rather than trying all four. If your child is already ready to stop, you can go straight to your usual goodnight.
option.1.title=Read a smaller piece of a familiar book
option.1.body1=When you are tired but speaking is comfortable, choose one short story, two favourite pages or a single chapter. Say where you will stop before you begin. A bookmark gives a longer story a clear place to wait until tomorrow.
option.1.body2=Use your ordinary speaking voice. You can leave out the elaborate character voices and sound effects. If your child asks for more, offer a clear ending: “That is our story for tonight. We can carry on from this page tomorrow.” The amount should fit both of you, not a rule about how many minutes a good parent reads.
option.2.title=Let the pictures carry the story
option.2.body1=Open a book your child knows and invite them to point, turn a page or tell you what they notice. A child who does not yet tell stories can simply choose a favourite picture. You can listen and respond with a smile or a nod; it does not need to become a lesson.
option.2.body2=Try a small invitation such as “Show me where the little bear went.” If talking is uncomfortable, let the pointing and page-turning do the work. If your child does not want a turn, choose another option. They do not need to perform the whole book because the adult is tired.
option.3.title=Hand over the reading, with a clear ending
option.3.body1=If another trusted adult is available, ask for a specific handover: this book, these pages, then the usual goodnight. You can stay nearby if that works for your family, or let that adult take over. There is no need to recreate your reading style exactly.
option.3.body2=A relative on a call is another possibility when timing and the child’s mood make it practical. Agree on one story beforehand. A live conversation may turn into an exciting catch-up, so treat a call as a choice, not something you must arrange at bedtime. A recording prepared earlier needs no matching time zone.
option.4.title=Play an audio story you have already chosen
option.4.body1=A familiar family recording or an age-appropriate audio story can do the reading while you rest. Choose the track yourself, check the beginning and ending, and set it to stop after the story if your player allows. Keep the volume comfortable and the device and any cables out of your child’s reach.
option.4.body2=Start the audio, then leave the screen alone. If your child wants the book, they can look at it alongside the recording. Stay available for questions or a change of mind. If audio makes this particular evening busier, stop it and return to a quieter option. You do not need a new account or a long search through recommendations tonight.
voice.title=A sore throat is a reason to change the reading plan
voice.body1=If your voice is hoarse or tired, rest it; whispering is not a workaround. That is voice-care guidance from the US National Institute on Deafness and Other Communication Disorders (NIDCD).
voice.link=Read NIDCD’s voice-care guidance
voice.body2=For storytime, choose a no-speaking option: another adult, a recording you already have, or looking at pictures together. Recording a fresh voice sample tonight asks you to use the same voice you are trying to rest. Prepare it later. This article offers alternatives to reading, not a diagnosis or treatment; seek medical advice if symptoms worry you or do not improve.
words.title=What to say when your child asks for your voice
words.intro=A short explanation and a choice are usually easier to offer than a long negotiation. These are example phrases to adapt, not lines you have to get right. If speaking hurts, another adult can explain the plan.
words.1.label=When you have very little energy
words.1.text=“I’m very tired tonight. We can read these two pages together, then say goodnight.”
words.2.label=When your voice needs a rest
words.2.text=“My voice needs a rest. We can look at the pictures together while someone else reads.”
words.3.label=When you have a saved recording
words.3.text=“Tonight the recording will read our story. I can sit with you while we listen.”
words.end=If none of the options works, close the book and use your ordinary goodnight. You can offer a story at another time. This evening does not need a replacement activity for every minute you planned to read.
backup.title=Prepare a tiny story backup on a better day
backup.lead=You only need a small starting collection, not a second project to manage. On a day when you have some energy and your voice feels comfortable, make the next tired evening easier in three steps.
backup.1.title=Choose one short favourite you may record
backup.1.body=Use your own story or a text you have permission to record and use. A familiar beginning and a clear ending make it easy to choose later. If the book is long, pick a permitted short section rather than promising to finish the whole thing in one sitting.
backup.2.title=Record, listen back and name the file clearly
backup.2.body=A phone recording is a practical starting point. Listen once to check that the words are clear and the ending is complete. Include the story title and reader in the filename, and keep the original somewhere you control. If another family member records it, agree how their voice and recording will be used.
backup.3.title=Check how it will play before you need it
backup.3.body=Open the recording on the device you will actually use at bedtime. Check whether it requires internet, whether the audio continues when the screen is put away, and what plays after it. These features depend on the player. Put the chosen story somewhere an adult can find without browsing a whole library.
backup.note=Want help with the recording itself? Our phone-recording guide covers the room, a short sound check and common audio problems. If you already have a routine that works, keep it; this backup only needs to fit into it.
product.eyebrow=Being prepared for iOS and Android
product.title=A familiar family voice, prepared ahead of time
product.body=Sleep2Story is being developed for this kind of preparation. An adult records a short voice sample with the speaker’s consent and adds the complete story text. The app prepares a synthetic narration in the chosen family voice for listening in a personal library. It does not write the story or preserve an original reading of those exact words.
product.body2=The app is not yet available in the stores. English and Russian narration are planned for launch; a translated website page does not mean that narration in that language is available. For tonight, use an option you already have. Sleep2Story is one way to prepare for future evenings, not an immediate remedy for a tired or sore voice.
