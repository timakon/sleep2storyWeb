meta.title=Too Tired to Read a Bedtime Story? Try This | Sleep2Story
meta.description=No energy for a bedtime story, or a sore voice? Choose a shorter reading, another reader or ready-made audio, with a simple plan for tonight and next time.
meta.og_title=Too Tired to Read a Bedtime Story? A Plan for Tonight
meta.og_description=Practical options for an exhausted parent: a shorter story, shared pictures, another reader or a recording prepared earlier.
meta.twitter_description=A bedtime story on a low-energy evening: what to try tonight, what to say to your child, and what to prepare when you feel better.
schema.description=A practical guide to bedtime stories when a parent is too tired to read aloud or needs to rest their voice, with alternatives and a plan for preparing recordings.
