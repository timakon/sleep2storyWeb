faq.title=Questions that come up on tired evenings
faq.1.question=Is it okay to skip the bedtime story tonight?
faq.1.answer=If reading is more than you can manage tonight, you can keep the goodnight and offer a book at another time. A shorter story, shared pictures or another reader are options, not extra tasks you must complete. Pick what is manageable for your family.
faq.2.question=What if I have a sore throat but my child wants me to read?
faq.2.answer=Explain briefly that your voice needs a rest, or ask another adult to explain. Offer pictures, another reader or an existing recording. You do not need to make a new recording while your voice is uncomfortable. Follow appropriate medical advice about your symptoms.
faq.3.question=Can an audio bedtime story replace reading aloud?
faq.3.answer=It can take over the narration on a particular evening, but it is a different experience from talking about a book together. An adult can still be present, pause the track and respond to the child. This is a practical option, not a claim that audio and shared reading have identical benefits.
faq.4.question=What if we have no recording ready?
faq.4.answer=Start with what is available: a shorter book if speaking is comfortable, looking at pictures, or another trusted reader. Do not turn tonight into a recording session. You can prepare one saved story when you have more energy.
faq.5.question=Should I promise a longer story tomorrow?
faq.5.answer=Only promise something you expect to be able to do. “We can come back to this book” leaves room for how tomorrow goes. A simple, honest ending is easier to keep than agreeing to three extra stories when you do not know how you will feel.
