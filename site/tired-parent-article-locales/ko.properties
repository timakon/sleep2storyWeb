figure.alt=펼친 책과 작은 침대 옆 조명 앞에서 아이 곁에 앉아 있는 지친 부모를 그린 따뜻한 그림
figure.caption=오늘 밤 이야기는 조금 짧아도 됩니다. 함께하는 시간은 그대로예요.
intro.title=무엇을 덜어 내야 할지 먼저 생각하세요
intro.body1=어떤 날은 책이 너무 긴 것이 문제입니다. 어떤 날은 등장인물 목소리를 또 내기가 버겁고, 또 어떤 날은 목이 아파 소리 내어 읽는 것 자체가 불편합니다. 상황마다 선택도 달라야 해요. 짧은 책은 피로에는 도움이 되지만 쉬어야 하는 목소리를 낫게 하지는 못합니다.
intro.body2=아이에게 선택지를 주기 전에 실제로 무엇을 할 수 있는지 정하세요. “이 두 쪽을 읽을까, 저장해 둔 이야기를 들을까?”가 “아무거나 골라”보다 지키기 쉽습니다. 아이가 기다리는 동안 완벽한 새 잠자리 이야기를 찾아 헤맬 필요는 없어요. 가족에게 이미 있는 책이나 녹음, 도움을 줄 수 있는 다른 어른부터 떠올려 보세요.
tonight.kicker=지금 있는 것부터
tonight.title=오늘 밤에도 이야기 시간을 이어 가는 네 가지 방법
tonight.lead=네 가지를 다 하려 하지 말고 하나만 고르세요. 아이도 이제 그만하고 싶어 한다면 평소처럼 ‘잘 자’ 인사로 바로 마쳐도 됩니다.
option.1.title=익숙한 책을 조금만 읽으세요
option.1.body1=피곤하지만 말하기는 괜찮다면 짧은 이야기 한 편이나 좋아하는 두 쪽, 한 장만 고르세요. 시작하기 전에 어디서 멈출지 말해 주세요. 책갈피를 꽂아 두면 긴 이야기도 내일까지 기다릴 자리가 생깁니다.
option.1.body2=평소 말하는 목소리로 읽으세요. 인물별 연기와 효과음은 빼도 됩니다. 아이가 더 읽어 달라고 하면 분명하게 마무리하세요. “오늘 이야기는 여기까지야. 내일 이 페이지부터 이어 읽자.” 좋은 부모라면 몇 분을 읽어야 한다는 기준보다 둘 다 편안한 분량이 중요합니다.
option.2.title=그림이 이야기를 이끌게 하세요
option.2.body1=아이가 아는 책을 펴고 가리키거나 책장을 넘기거나 눈에 띄는 것을 말해 보게 하세요. 아직 이야기를 만들기 어려운 아이라면 좋아하는 그림만 고르면 됩니다. 어른은 미소나 끄덕임으로 들어 주어도 좋아요. 공부 시간으로 만들 필요는 없습니다.
option.2.body2=“작은 곰이 어디로 갔는지 보여 줄래?”처럼 가볍게 권해 보세요. 말하기가 불편하다면 손가락으로 가리키고 책장을 넘기는 것만으로 충분합니다. 아이가 자기 차례를 원하지 않으면 다른 방법을 고르세요. 어른이 피곤하다고 아이가 책 한 권을 다 들려줄 필요는 없습니다.
option.3.title=다른 사람에게 부탁하고 끝은 분명히 정하세요
option.3.body1=믿을 수 있는 다른 어른이 있다면 구체적으로 부탁하세요. 이 책을 이 쪽까지 읽고, 늘 하던 ‘잘 자’ 인사로 마무리해 달라고요. 가족에게 맞는다면 곁에 있어도 되고, 그 어른에게 맡겨도 됩니다. 내 읽는 방식과 똑같이 할 필요는 없어요.
option.3.body2=시간과 아이의 기분이 맞으면 멀리 있는 친척과 통화하며 읽는 방법도 있습니다. 미리 이야기 한 편을 정해 두세요. 실시간 대화는 반가운 수다로 길어질 수 있으니, 잠자리에서 꼭 준비해야 하는 일로 생각하지는 마세요. 미리 만들어 둔 녹음이라면 시간대를 맞출 필요도 없습니다.
option.4.title=이미 골라 둔 오디오 이야기를 틀어 주세요
option.4.body1=익숙한 가족의 녹음이나 나이에 맞는 오디오 이야기가 어른 대신 읽어 줄 수 있습니다. 어른이 직접 트랙을 고르고 시작과 끝을 확인하세요. 플레이어가 지원한다면 이야기가 끝날 때 재생도 멈추게 설정하세요. 볼륨은 편안하게 맞추고 기기와 케이블은 아이 손이 닿지 않게 두세요.
option.4.body2=오디오를 시작한 뒤 화면은 더 보지 마세요. 아이가 책을 원하면 들으면서 함께 볼 수 있습니다. 질문하거나 마음을 바꾸면 응답할 수 있게 곁에 있어 주세요. 오늘따라 오디오가 오히려 부산스럽다면 끄고 더 조용한 방법으로 돌아가면 됩니다. 새 계정을 만들거나 긴 추천 목록을 뒤질 필요는 없어요.
voice.title=목이 아프다면 읽기 계획을 바꿔도 됩니다
voice.body1=목소리가 쉬었거나 피곤하다면 쉬게 해 주세요. 속삭이는 것으로 대신하지도 마세요. 이는 미국 국립난청·기타 의사소통장애연구소(NIDCD)의 목소리 관리 지침에 따른 내용입니다.
voice.link=NIDCD의 목소리 관리 지침 보기
voice.body2=이야기 시간에는 말하지 않아도 되는 방법을 고르세요. 다른 어른에게 부탁하거나 기존 녹음을 틀거나 함께 그림을 보세요. 오늘 새 목소리 샘플을 녹음하면 쉬어야 할 목소리를 다시 써야 합니다. 녹음은 나중에 하세요. 이 글은 낭독의 대안을 소개하며 진단이나 치료를 제공하지 않습니다. 증상이 걱정되거나 나아지지 않으면 의료진과 상담하세요.
words.title=아이가 내 목소리를 듣고 싶어 할 때 건넬 말
words.intro=길게 실랑이하기보다 짧게 설명하고 선택지를 주는 편이 쉬울 때가 많습니다. 아래는 상황에 맞게 바꿔 쓸 예시이지, 꼭 그대로 말해야 하는 문장이 아닙니다. 말하기가 아프다면 다른 어른이 설명해 줄 수 있어요.
words.1.label=기운이 거의 없을 때
words.1.text=“오늘은 많이 피곤해. 이 두 쪽만 함께 읽고 잘 자자.”
words.2.label=목소리를 쉬게 해야 할 때
words.2.text=“내 목소리가 조금 쉬어야 해. 다른 사람이 읽어 주는 동안 그림은 같이 보자.”
words.3.label=저장해 둔 녹음이 있을 때
words.3.text=“오늘은 녹음이 이야기를 읽어 줄 거야. 같이 들으면서 내가 옆에 있을게.”
words.end=어느 방법도 맞지 않으면 책을 덮고 평소처럼 ‘잘 자’ 인사를 하세요. 이야기는 다른 때 읽어도 됩니다. 오늘 밤 원래 읽으려던 시간을 매분 다른 활동으로 채울 필요는 없어요.
backup.title=몸이 괜찮은 날 작은 이야기 예비책을 준비하세요
backup.lead=관리해야 할 두 번째 프로젝트가 아니라 작은 모음 하나면 됩니다. 기운이 있고 목소리도 편한 날, 다음에 지친 밤을 위해 세 단계로 준비해 보세요.
backup.1.title=녹음해도 되는 짧은 애독서 한 편을 고르세요
backup.1.body=직접 쓴 이야기나 녹음하고 사용할 허락을 받은 글을 선택하세요. 익숙한 시작과 분명한 끝이 있으면 나중에 고르기 쉽습니다. 책이 길다면 한 번에 끝내겠다고 약속하기보다 녹음이 허용된 짧은 부분을 고르세요.
backup.2.title=녹음해 듣고 파일 이름을 알아보기 쉽게 붙이세요
backup.2.body=휴대전화 녹음부터 시작하면 됩니다. 한 번 들어 보며 말이 또렷한지, 결말까지 담겼는지 확인하세요. 파일 이름에 제목과 읽은 사람을 넣고 원본은 직접 관리하는 곳에 보관하세요. 다른 가족이 녹음한다면 그 목소리와 녹음물을 어떻게 쓸지 합의하세요.
backup.3.title=필요해지기 전에 재생 방식을 확인하세요
backup.3.body=실제로 잠자리에서 사용할 기기로 녹음을 열어 보세요. 인터넷이 필요한지, 화면을 치워도 계속 재생되는지, 끝난 뒤 무엇이 재생되는지 확인하세요. 이는 플레이어에 따라 다릅니다. 고른 이야기는 어른이 전체 목록을 뒤지지 않고도 찾을 수 있는 곳에 두세요.
backup.note=녹음 자체가 막막한가요? 휴대전화 녹음 가이드에서 방 선택, 짧은 음질 점검, 흔한 소리 문제를 다룹니다. 이미 잘 맞는 습관이 있다면 그대로 두세요. 이 예비책은 그 습관에 들어맞기만 하면 됩니다.
product.eyebrow=iOS 및 Android용 출시 준비 중
product.title=미리 준비해 두는 익숙한 가족의 목소리
product.body=Sleep2Story는 이런 준비를 돕기 위해 개발 중입니다. 성인이 목소리 제공자의 동의를 받아 짧은 샘플을 녹음하고 이야기의 전체 글을 추가하면, 앱이 선택한 가족 목소리로 합성 낭독을 만들어 개인 보관함에서 들을 수 있게 합니다. 앱이 이야기를 대신 쓰거나 그 글을 실제로 읽은 원본 녹음을 보존하는 것은 아닙니다.
product.body2=앱은 아직 스토어에서 이용할 수 없습니다. 오늘 밤에는 이미 할 수 있는 방법을 쓰세요. Sleep2Story는 지쳤거나 목이 아픈 지금 당장의 해결책이 아니라 앞으로의 저녁을 위해 준비 중입니다.
product.cta=Sleep2Story 이용 방법 보기
links.title=다음 작은 단계를 위한 도움
links.record=휴대전화로 잠자리 이야기 녹음하는 방법
links.routine=편안한 잠자리 이야기 습관 만들기
links.grandparents=조부모가 손주를 위해 이야기 녹음하기
faq.title=지친 밤에 자주 드는 질문
faq.1.question=오늘 밤 잠자리 이야기를 건너뛰어도 되나요?
faq.1.answer=오늘 읽기가 버겁다면 ‘잘 자’ 인사만 하고 다른 때 책을 읽어 주어도 됩니다. 짧은 이야기나 그림 함께 보기, 다른 사람이 읽어 주기는 선택지일 뿐 꼭 해야 할 추가 과제가 아닙니다. 가족이 감당할 수 있는 방법을 고르세요.
faq.2.question=목이 아픈데 아이가 제 목소리로 읽어 달라고 해요
faq.2.answer=목소리를 쉬게 해야 한다고 짧게 설명하거나 다른 어른에게 부탁하세요. 그림을 보거나 다른 사람이 읽거나 이미 있는 녹음을 들을 수 있습니다. 목이 불편한 동안 새 녹음을 만들 필요는 없어요. 증상에 관해서는 적절한 의료 조언을 따르세요.
faq.3.question=오디오 잠자리 이야기가 직접 읽기를 대신할 수 있나요?
faq.3.answer=어느 밤에는 낭독을 대신할 수 있지만 함께 책을 보며 대화하는 것과는 다른 경험입니다. 어른은 여전히 곁에 있으면서 재생을 멈추고 아이에게 응답할 수 있어요. 실용적인 선택지일 뿐, 오디오와 함께 읽기가 똑같은 효과를 낸다는 뜻은 아닙니다.
faq.4.question=준비해 둔 녹음이 없으면 어떡하죠?
faq.4.answer=지금 가능한 것부터 하세요. 말하기가 괜찮다면 짧은 책을 읽고, 그림을 보거나 믿을 수 있는 다른 어른에게 부탁하세요. 오늘 밤을 녹음 시간으로 바꾸지 마세요. 기운이 더 나는 날 저장해 둘 이야기 하나를 준비하면 됩니다.
faq.5.question=내일은 더 긴 이야기를 읽어 주겠다고 약속할까요?
faq.5.answer=지킬 수 있을 것 같을 때만 약속하세요. “이 책은 다음에 다시 보자”는 내일 상황에 맞출 여지를 남깁니다. 내일 기분도 모르는 상태에서 이야기 세 편을 더 읽겠다고 하는 것보다 솔직하고 간단한 마무리가 지키기 쉽습니다.
sources.title=자료 출처와 안내 범위
sources.body=실용적인 예시와 대화 문장은 Sleep2Story 편집팀의 제안입니다. 아래 자료는 목소리 관리와 잠자리 습관의 배경 정보를 제공하며, 특정 앱이 아이의 수면을 돕는다는 근거는 아닙니다.
