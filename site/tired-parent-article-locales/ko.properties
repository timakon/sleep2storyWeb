hero.title=잠자리 이야기를 읽어 줄 기운이 없나요?
hero.dek=책은 펼쳐져 있고 아이는 한 편만 더 듣고 싶어 하는데, 소리 내어 읽을 기운은 남지 않았나요? 말하는 것조차 아픈 밤까지 포함해 오늘 저녁을 위한 작은 계획을 준비했습니다.
