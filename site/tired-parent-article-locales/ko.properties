answer.title=오늘 밤 할 수 있는 만큼만 이야기 시간을 가지세요.
answer.body=목소리가 괜찮다면 좋아하는 이야기를 아주 짧게 읽거나 함께 책의 그림을 보세요. 말하기가 불편하면 믿을 수 있는 다른 어른에게 부탁하거나 이미 있는 오디오를 사용하세요. 익숙한 ‘잘 자’ 인사는 남기고, 새 이야기를 녹음하는 일은 목소리가 괜찮은 날로 미루세요.
