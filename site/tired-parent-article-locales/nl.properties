answer.title=Kies een manier om het verhaal te delen die vanavond lukt.
answer.body=Voelt je stem goed, lees dan een heel korte favoriet of kijk samen in een boek. Is praten vervelend, vraag dan een andere vertrouwde volwassene om voor te lezen of zet een opname op die je al hebt. Houd jullie vertrouwde welterusten aan. Een nieuw verhaal opnemen kan wachten tot je stem weer goed voelt.
toc.tonight=Vier mogelijkheden voor vanavond
toc.voice=Als je keel of stem pijn doet
toc.words=Zinnen die je kunt gebruiken
toc.backup=Een kleine voorraad opnames maken
toc.product=Wat Sleep2Story kan betekenen
toc.faq=Vragen op vermoeide avonden
figure.alt=Warme illustratie van een vermoeide ouder naast een kind, een open boek en een klein bedlampje
figure.caption=Het verhaal mag vanavond korter zijn. Het moment kun je nog steeds samen delen.
intro.title=Wat moet er vanavond makkelijker worden?
intro.body1=Soms is het boek gewoon te lang. Soms kun je het niet opbrengen om weer alle stemmetjes te doen. En soms heb je keelpijn en is hardop lezen vervelend. Die avonden vragen om verschillende keuzes. Een korter boek kan helpen als je moe bent, maar geeft een stem die rust nodig heeft nog geen pauze.
intro.body2=Bedenk eerst wat je echt aankunt en bied daarna een keuze aan. ‘Deze twee bladzijden of onze opgeslagen opname?’ is makkelijker vol te houden dan ‘Kies maar iets’. Je hoeft geen perfect nieuw verhaaltje voor het slapengaan te zoeken terwijl je kind wacht. Begin met een boek, opname of andere volwassene die voor jullie al beschikbaar is.
tonight.kicker=Begin met wat er al is
tonight.title=Vier manieren om vanavond een verhaal te delen
tonight.lead=Kies één mogelijkheid. Je hoeft ze niet alle vier uit te proberen. Heeft je kind al genoeg gehad, dan kun je ook meteen op jullie gewone manier welterusten zeggen.
option.1.title=Lees een klein stukje uit een bekend boek
option.1.body1=Ben je moe maar kun je prettig praten, kies dan één kort verhaal, twee favoriete bladzijden of één hoofdstuk. Vertel voordat je begint waar je stopt. Met een boekenlegger geef je een langer verhaal een duidelijke plek om tot morgen te wachten.
option.1.body2=Gebruik je gewone spreekstem. Uitgebreide stemmetjes en geluidseffecten kun je overslaan. Vraagt je kind om meer, geef dan een duidelijk einde aan: ‘Dit was ons verhaal voor vanavond. Morgen kunnen we vanaf deze bladzijde verder.’ De lengte moet bij jullie allebei passen. Er is geen aantal voorleesminuten waaraan een goede ouder moet voldoen.
option.2.title=Laat de plaatjes het verhaal vertellen
option.2.body1=Sla een bekend boek open en nodig je kind uit om iets aan te wijzen, een bladzijde om te slaan of te vertellen wat het ziet. Een kind dat zelf nog geen verhalen vertelt, kan gewoon een lievelingsplaatje kiezen. Jij kunt luisteren en reageren met een glimlach of een knikje. Het hoeft geen lesje te worden.
option.2.body2=Een kleine uitnodiging is genoeg: ‘Laat eens zien waar het beertje naartoe ging.’ Is praten vervelend, laat het dan bij aanwijzen en bladeren. Wil je kind niet meedoen, kies dan iets anders. Je kind hoeft niet het hele boek te vertellen omdat de volwassene moe is.
option.3.title=Vraag iemand anders om voor te lezen en spreek een einde af
option.3.body1=Is er een andere vertrouwde volwassene beschikbaar, vraag dan iets concreets: dit boek, deze bladzijden en daarna het gewone welterusten. Je kunt erbij blijven als dat bij jullie past, of het helemaal aan die ander overlaten. Die hoeft niet precies op jouw manier voor te lezen.
option.3.body2=Een familielid via een belgesprek laten voorlezen kan ook, als het tijdstip en de stemming van je kind dat toelaten. Spreek vooraf één verhaal af. Een gesprek kan al snel gezellig bijpraten worden. Zie bellen daarom als een mogelijkheid, niet als iets wat je vlak voor bedtijd nog moet regelen. Voor een eerder gemaakte opname hoef je geen rekening te houden met verschillende tijdzones.
option.4.title=Zet een luisterverhaal op dat je al hebt uitgekozen
option.4.body1=Een bekende familieopname of een luisterverhaal dat bij de leeftijd past, kan het voorlezen overnemen terwijl jij uitrust. Kies zelf de opname, controleer het begin en einde en stel zo mogelijk in dat het afspelen na het verhaal stopt. Houd het volume prettig en leg het apparaat en eventuele snoeren buiten het bereik van je kind.
option.4.body2=Start de opname en laat het scherm daarna met rust. Als je kind het boek erbij wil, kan het tijdens het luisteren meekijken. Blijf beschikbaar voor vragen of als je kind iets anders wil. Maakt audio deze avond juist drukker, stop dan en kies iets rustigers. Je hoeft vanavond geen nieuw account aan te maken of lang door aanbevelingen te zoeken.
voice.title=Bij keelpijn mag het voorlezen anders
voice.body1=Is je stem hees of vermoeid, geef haar dan rust. Fluisteren is geen oplossing. Dat adviseert het Amerikaanse National Institute on Deafness and Other Communication Disorders (NIDCD) in zijn informatie over stemverzorging.
voice.link=Lees de stemadviezen van het NIDCD (Engels)
voice.body2=Kies voor het verhaaltje iets waarbij jij niet hoeft te praten: een andere volwassene, een opname die al klaarstaat of samen plaatjes kijken. Met een nieuw stemfragment zou je vanavond juist de stem gebruiken die je rust wilt geven. Neem het later op. Dit artikel biedt alternatieven voor voorlezen, geen diagnose of behandeling. Vraag medisch advies als je je zorgen maakt over klachten of als ze niet verbeteren.
words.title=Wat je kunt zeggen als je kind jouw stem wil horen
words.intro=Een korte uitleg en een keuze zijn meestal makkelijker dan lang onderhandelen. De zinnen hieronder zijn voorbeelden die je aan je eigen gezin kunt aanpassen. Je hoeft ze niet precies zo uit te spreken. Doet praten pijn, dan kan een andere volwassene uitleggen wat jullie gaan doen.
words.1.label=Als je weinig energie hebt
words.1.text=‘Ik ben vanavond heel moe. We kunnen deze twee bladzijden samen lezen en daarna welterusten zeggen.’
words.2.label=Als je stem rust nodig heeft
words.2.text=‘Mijn stem heeft even rust nodig. We kunnen samen naar de plaatjes kijken terwijl iemand anders voorleest.’
words.3.label=Als je een opname hebt bewaard
words.3.text=‘Vanavond horen we ons verhaal via de opname. Ik kan bij je zitten terwijl we luisteren.’
words.end=Werkt geen van deze mogelijkheden, doe dan het boek dicht en zeg op jullie gewone manier welterusten. Je kunt op een ander moment een verhaal aanbieden. Je hoeft vanavond niet voor elke geplande voorleesminuut een vervangende activiteit te bedenken.
backup.title=Zet op een betere dag een klein voorraadje verhalen klaar
backup.lead=Een kleine verzameling is genoeg om te beginnen. Het hoeft geen extra project te worden. Op een dag waarop je wat energie hebt en je stem goed voelt, kun je in drie stappen de volgende vermoeide avond makkelijker maken.
backup.1.title=Kies één korte favoriet die je mag opnemen
backup.1.body=Gebruik een eigen verhaal of een tekst die je met toestemming mag opnemen en gebruiken. Een bekend begin en een duidelijk einde maken later kiezen makkelijker. Is het boek lang, neem dan een kort gedeelte waarvoor je de nodige toestemming hebt. Je hoeft niet te beloven het hele boek in één keer af te maken.
backup.2.title=Neem op, luister terug en geef het bestand een duidelijke naam
backup.2.body=Een opname met je telefoon is een praktisch begin. Luister één keer of de woorden duidelijk zijn en het einde compleet is. Zet de titel van het verhaal en de naam van de voorlezer in de bestandsnaam. Bewaar het origineel op een plek die je zelf beheert. Neemt een ander familielid het op, spreek dan af hoe de stem en de opname worden gebruikt.
backup.3.title=Test het afspelen voordat je de opname nodig hebt
backup.3.body=Open de opname op het apparaat dat je bij bedtijd echt gaat gebruiken. Controleer of er internet nodig is, of de audio doorgaat als je het scherm niet meer gebruikt en wat er na het verhaal wordt afgespeeld. Die mogelijkheden verschillen per speler. Bewaar het gekozen verhaal zo dat een volwassene het kan vinden zonder een hele bibliotheek te doorzoeken.
backup.note=Hulp nodig bij het opnemen zelf? Onze gids voor opnemen met je telefoon gaat over de kamer, een korte geluidstest en veelvoorkomende geluidsproblemen. Werkt jullie routine al goed, houd die dan aan. De opname hoeft daar alleen een plekje in te krijgen.
product.eyebrow=In voorbereiding voor iOS en Android
product.title=Een vertrouwde familiestem, van tevoren klaargezet
product.body=Sleep2Story wordt ontwikkeld voor dit soort voorbereiding. Een volwassene neemt met toestemming van de spreker een kort stemfragment op en voegt de volledige tekst van het verhaal toe. De app maakt daarmee een synthetische vertelling in de gekozen familiestem, om te beluisteren in een persoonlijke bibliotheek. De app schrijft het verhaal niet zelf. De vertelling is ook geen oorspronkelijke opname waarin die persoon deze tekst zelf heeft voorgelezen.
product.body2=De app is nog niet verkrijgbaar in de stores. Bij de start zijn vertellingen in het Engels en Russisch gepland. Een vertaalde websitepagina betekent niet dat er ook vertellingen in die taal beschikbaar zijn. Gebruik vanavond iets wat je al hebt. Sleep2Story is een manier om latere avonden voor te bereiden, geen directe oplossing voor een vermoeide of pijnlijke stem.
