meta.title=Te moe om voor te lezen? Dit kan vanavond | Sleep2Story
meta.description=Geen puf voor een verhaaltje of keelpijn? Kies iets korts, kijk samen plaatjes of gebruik een bestaande opname. Een klein plan voor vanavond en later.
meta.og_title=Te moe om voor te lezen? Een klein plan voor vanavond
meta.og_description=Praktische keuzes voor vermoeide ouders: een korter verhaal, samen plaatjes kijken, een andere voorlezer of een eerder gemaakte opname.
meta.twitter_description=Een verhaaltje voor het slapengaan met weinig energie: wat vanavond kan, wat je tegen je kind zegt en wat je op een betere dag voorbereidt.
schema.description=Een praktische gids voor ouders die te moe zijn om voor te lezen of hun stem rust moeten geven, met andere mogelijkheden en tips voor een opname voor later.
hero.eyebrow=Voor vermoeide ouders · Gids 04
hero.title=Te moe om voor te lezen?
hero.dek=Het boek ligt open, je kind wil nog een verhaaltje en jij hebt geen puf meer om voor te lezen. Hier is een klein plan voor vanavond, ook als praten pijn doet.
