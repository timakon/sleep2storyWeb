faq.title=Vragen die op vermoeide avonden opkomen
faq.1.question=Mag het verhaaltje voor het slapengaan vanavond een keer vervallen?
faq.1.answer=Als voorlezen vanavond meer is dan je aankunt, kun je het vertrouwde welterusten aanhouden en op een ander moment een boek aanbieden. Een korter verhaal, samen plaatjes kijken of een andere voorlezer zijn mogelijkheden, geen extra taken die je nog moet afronden. Kies wat voor jullie gezin haalbaar is.
faq.2.question=Wat als ik keelpijn heb, maar mijn kind wil dat ik voorlees?
faq.2.answer=Leg kort uit dat je stem rust nodig heeft, of vraag een andere volwassene dat te doen. Bied plaatjes, een andere voorlezer of een bestaande opname aan. Je hoeft geen nieuwe opname te maken terwijl je stem niet goed voelt. Volg passend medisch advies over je klachten.
faq.3.question=Kan een luisterverhaal het voorlezen vervangen?
faq.3.answer=Het kan op een bepaalde avond de vertelling overnemen, maar het is een andere ervaring dan samen over een boek praten. Een volwassene kan nog steeds aanwezig zijn, de opname pauzeren en op het kind reageren. Dit is een praktische mogelijkheid, geen bewering dat audio en samen lezen precies dezelfde voordelen hebben.
faq.4.question=Wat als we geen opname klaar hebben staan?
faq.4.answer=Begin met wat beschikbaar is: een korter boek als praten prettig voelt, samen plaatjes kijken of een andere vertrouwde voorlezer. Maak van vanavond geen opnamesessie. Je kunt één verhaal opnemen en bewaren wanneer je meer energie hebt.
faq.5.question=Moet ik voor morgen een langer verhaal beloven?
faq.5.answer=Beloof alleen iets waarvan je verwacht dat het lukt. ‘We kunnen later verder in dit boek’ laat ruimte voor hoe morgen verloopt. Een eenvoudig, eerlijk einde is makkelijker vol te houden dan drie extra verhalen toezeggen terwijl je nog niet weet hoe je je zult voelen.
sources.title=Bronnen en afbakening
sources.body=De praktische voorbeelden en voorgestelde zinnen zijn suggesties van de redactie van Sleep2Story. De bronnen hieronder geven achtergrondinformatie over stemverzorging en bedtijdroutines. Ze tonen niet aan dat een bepaalde app een kind helpt slapen.
