answer.title=Izaberite onoliko priče koliko možete večeras.
answer.body=Ako govorite bez tegoba, pročitajte vrlo kratku omiljenu priču ili zajedno pogledajte knjigu. Ako vam govor ne prija, zamolite drugu odraslu osobu od poverenja da čita ili pustite snimak koji već imate. Zadržite poznato „laku noć”, a novu priču snimite nekog dana kada vam glas bude odmoran i bez tegoba.
