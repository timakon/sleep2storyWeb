figure.alt=Topla ilustracija umornog roditelja uz dete, otvorenu knjigu i malu lampu pored kreveta
figure.caption=Večeras priča može biti kraća. I dalje možete da podelite taj trenutak.
intro.title=Odlučite šta treba da olakšate
intro.body1=Ponekad je problem dužina knjige. Ponekad nemate snage da ponovo glumite sve likove. A ponekad vas boli grlo i čitanje naglas vam jednostavno ne prija. Za te večeri potrebna su različita rešenja. Kraća knjiga pomaže kada ste umorni, ali ne odmara glas kome je potrebna pauza.
intro.body2=Pre nego što ponudite izbor, odlučite šta zaista možete. Lakše je održati dogovor „Ove dve strane ili naša snimljena priča?” nego „Izaberi šta god želiš”. Ne morate da tražite savršenu novu priču za laku noć dok dete čeka. Počnite od knjige, snimka ili druge odrasle osobe koja je vašoj porodici već dostupna.
tonight.kicker=Počnite od onoga što imate
tonight.title=Četiri načina da priča ostane deo večerašnje rutine
tonight.lead=Izaberite jednu mogućnost, bez potrebe da isprobate sve četiri. Ako je dete već spremno da završite, možete odmah preći na svoje uobičajeno „laku noć”.
option.1.title=Pročitajte kraći deo poznate knjige
option.1.body1=Kada ste umorni, ali govorite bez tegoba, izaberite jednu kratku priču, dve omiljene strane ili jedno poglavlje. Pre početka recite gde ćete stati. Obeleživač u dužoj priči jasno pokazuje mesto na kome će vas sačekati do sutra.
option.1.body2=Govorite svojim običnim glasom. Složene glasove likova i zvučne efekte možete da preskočite. Ako dete traži još, jasno završite: „To je naša priča za večeras. Sutra možemo da nastavimo od ove strane.” Dužina treba da odgovara i vama i detetu, a ne pravilu o tome koliko minuta dobar roditelj čita.
option.2.title=Neka slike ispričaju priču
option.2.body1=Otvorite knjigu koju dete poznaje i pozovite ga da pokaže nešto na slici, okrene stranu ili kaže šta primećuje. Dete koje još ne pripoveda može jednostavno da izabere omiljenu sliku. Možete da slušate i odgovorite osmehom ili klimanjem glave; nema potrebe da ovo postane lekcija.
option.2.body2=Pokušajte sa kratkim pozivom, na primer: „Pokaži mi gde je otišao mali meda.” Ako vam govor ne prija, dovoljno je pokazivanje i okretanje strana. Ako dete ne želi da preuzme priču, izaberite drugu mogućnost. Ne mora da ispriča celu knjigu zato što je odrasla osoba umorna.
option.3.title=Prepustite čitanje drugoj osobi i dogovorite završetak
option.3.body1=Ako je dostupna druga odrasla osoba od poverenja, zamolite je da preuzme uz jasan dogovor: ova knjiga, ove strane, pa uobičajeno „laku noć”. Možete ostati blizu ako to odgovara vašoj porodici ili joj prepustiti čitavu rutinu. Nije potrebno da tačno ponovi vaš način čitanja.
option.3.body2=Možete pozvati i nekoga iz porodice da čita na daljinu ako se uklapaju vreme i detetovo raspoloženje. Unapred se dogovorite za jednu priču. Razgovor uživo može prerasti u uzbudljivo prepričavanje novosti, zato je poziv samo jedna mogućnost, a ne nešto što morate da organizujete pred spavanje. Uz ranije pripremljen snimak ne morate da usklađujete vremenske zone.
option.4.title=Pustite audio-priču koju ste već izabrali
option.4.body1=Poznat porodični snimak ili audio-priča primerena uzrastu može preuzeti čitanje dok se vi odmarate. Sami izaberite snimak, proverite početak i kraj i podesite da se reprodukcija zaustavi posle priče ako aplikacija to omogućava. Podesite prijatnu jačinu zvuka, a uređaj i sve kablove držite van domašaja deteta.
option.4.body2=Pokrenite snimak, pa ostavite ekran na miru. Ako dete želi knjigu, može da je gleda dok sluša. Budite dostupni za pitanja ili promenu plana. Ako slušanje baš večeras unosi dodatnu živost, zaustavite ga i vratite se mirnijoj mogućnosti. Večeras vam ne trebaju nov nalog ni dugo pretraživanje preporuka.
voice.title=Bol u grlu je razlog da promenite plan za čitanje
voice.body1=Ako ste promukli ili vam je glas umoran, odmorite ga; šaputanje nije zamena za odmor. To je smernica za negu glasa američkog Nacionalnog instituta za gluvoću i druge poremećaje komunikacije (NIDCD).
voice.link=Pročitajte smernice NIDCD-a za negu glasa
voice.body2=Za vreme priče izaberite nešto što ne zahteva da govorite: drugu odraslu osobu, snimak koji već imate ili zajedničko gledanje slika. Snimanje novog uzorka glasa večeras tražilo bi da koristite isti glas koji pokušavate da odmorite. Ostavite to za kasnije. Ovaj članak nudi druge mogućnosti umesto čitanja, a ne dijagnozu ili lečenje; potražite savet lekara ako vas simptomi brinu ili se ne povlače.
words.title=Šta da kažete kada dete želi baš vaš glas
words.intro=Obično je lakše ponuditi kratko objašnjenje i izbor nego voditi duge pregovore. Ovo su primeri koje možete da prilagodite, a ne rečenice koje morate savršeno da izgovorite. Ako vas boli dok govorite, druga odrasla osoba može da objasni plan.
words.1.label=Kada imate vrlo malo snage
words.1.text=„Večeras više nemam snage. Možemo zajedno da pročitamo ove dve strane, pa da kažemo laku noć.”
words.2.label=Kada vašem glasu treba odmor
words.2.text=„Mom glasu treba odmor. Možemo zajedno da gledamo slike dok neko drugi čita.”
words.3.label=Kada imate sačuvan snimak
words.3.text=„Večeras ćemo čuti našu priču sa snimka. Mogu da sedim uz tebe dok slušamo.”
words.end=Ako nijedna mogućnost ne odgovara, zatvorite knjigu i poželite laku noć kao i obično. Priču možete da ponudite drugi put. Ne morate svaki minut planiran za čitanje večeras da popunite nekom drugom aktivnošću.
backup.title=Pripremite malu rezervu priča kada budete imali više snage
backup.lead=Za početak vam treba samo nekoliko snimaka, a ne još jedan projekat o kome ćete brinuti. Kada budete imali malo energije i mogli da govorite bez tegoba, olakšajte sledeće umorno veče u tri koraka.
backup.1.title=Izaberite jednu kratku omiljenu priču koju smete da snimite
backup.1.body=Upotrebite svoju priču ili tekst koji imate dozvolu da snimite i koristite. Poznat početak i jasan kraj olakšaće vam kasniji izbor. Ako je knjiga duga, izaberite kratak odlomak za koji imate dozvolu umesto da obećate čitanje cele knjige odjednom.
backup.2.title=Snimite, preslušajte i jasno nazovite fajl
backup.2.body=Snimak telefonom je praktičan početak. Preslušajte ga jednom da proverite da li se reči jasno čuju i da li je završetak potpun. U naziv fajla unesite naslov priče i ime osobe koja čita, a original čuvajte na mestu koje je pod vašom kontrolom. Ako snima drugi član porodice, dogovorite se kako će se njegov glas i snimak koristiti.
backup.3.title=Proverite reprodukciju pre nego što vam zatreba
backup.3.body=Otvorite snimak na uređaju koji ćete zaista koristiti pred spavanje. Proverite da li je potreban internet, da li se zvuk nastavlja kada sklonite ekran i šta se pušta posle snimka. Te mogućnosti zavise od aplikacije za slušanje. Sačuvajte izabranu priču tako da je odrasla osoba lako pronađe bez pretraživanja cele biblioteke.
backup.note=Treba vam pomoć oko samog snimanja? Naš vodič za snimanje telefonom objašnjava izbor prostorije, kratku proveru zvuka i česte probleme sa snimkom. Ako već imate rutinu koja vam odgovara, zadržite je; dovoljno je da se ova rezerva uklopi u nju.
product.eyebrow=U pripremi za iOS i Android
product.title=Poznat porodični glas, pripremljen unapred
product.body=Sleep2Story se razvija upravo za ovakvu pripremu. Odrasla osoba snima kratak uzorak glasa uz saglasnost osobe čiji se glas koristi i dodaje ceo tekst priče. Aplikacija priprema sintetičku naraciju izabranim porodičnim glasom za slušanje u ličnoj biblioteci. Ona ne piše priču niti čuva izvorni snimak čitanja tih istih reči.
product.body2=Aplikacija još nije dostupna u prodavnicama aplikacija. Za početak je planirana naracija na engleskom i ruskom; prevedena stranica sajta ne znači da je naracija na tom jeziku dostupna. Za večeras upotrebite ono što već imate. Sleep2Story je jedan način da se pripremite za buduće večeri, a ne trenutno rešenje za umoran glas ili bol pri govoru.
