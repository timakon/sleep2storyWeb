faq.title=Pitanja koja se javljaju kada ste uveče umorni
faq.1.question=Da li je u redu da večeras preskočimo priču za laku noć?
faq.1.answer=Ako večeras nemate snage za čitanje, možete da zadržite poznato „laku noć” i ponudite knjigu drugi put. Kraća priča, zajedničko gledanje slika ili druga osoba koja čita jesu mogućnosti, a ne dodatne obaveze koje morate da ispunite. Izaberite ono što vaša porodica može večeras.
faq.2.question=Šta ako me boli grlo, a dete želi da mu čitam?
faq.2.answer=Ukratko objasnite da vašem glasu treba odmor ili zamolite drugu odraslu osobu da to objasni. Ponudite gledanje slika, drugu osobu koja čita ili postojeći snimak. Ne morate da pravite nov snimak dok vam govor stvara tegobe. Pridržavajte se odgovarajućih saveta lekara o svojim simptomima.
faq.3.question=Može li audio-priča za laku noć da zameni čitanje naglas?
faq.3.answer=Može da preuzme pripovedanje određene večeri, ali to je drugačije iskustvo od zajedničkog razgovora o knjizi. Odrasla osoba i dalje može da bude prisutna, zaustavi snimak i odgovori detetu. To je praktična mogućnost, a ne tvrdnja da slušanje snimka i zajedničko čitanje imaju iste koristi.
faq.4.question=Šta ako nemamo pripremljen snimak?
faq.4.answer=Počnite od onoga što je dostupno: kraće knjige ako govorite bez tegoba, gledanja slika ili druge osobe od poverenja koja može da čita. Nemojte ovu večer pretvoriti u snimanje. Jednu priču možete da pripremite i sačuvate kada budete imali više energije.
faq.5.question=Da li da obećam dužu priču za sutra?
faq.5.answer=Obećajte samo ono što očekujete da ćete moći da ispunite. „Možemo da se vratimo ovoj knjizi” ostavlja prostora da vidite kakav će biti sutrašnji dan. Jednostavan i iskren završetak lakše je održati nego obećanje o tri dodatne priče kada ne znate kako ćete se osećati.
sources.title=Izvori i namena članka
sources.body=Praktični primeri i predložene rečenice potiču od redakcije Sleep2Story. Izvori ispod pružaju dodatne informacije o nezi glasa i večernjim rutinama; oni ne dokazuju da određena aplikacija pomaže detetu da zaspi.
