figure.alt=Açık bir kitap ve küçük bir başucu lambasının yanında çocuğuyla oturan yorgun ebeveynin sıcak tonlarda çizimi
figure.caption=Bu akşam masal kısa olabilir. Yine de o anı birlikte paylaşabilirsiniz.
intro.title=Sizi neyin zorladığını belirleyin
intro.body1=Bazen kitap çok uzundur. Bazen karakterlerin seslerini bir kez daha taklit edecek hâliniz yoktur. Bazen de boğazınız ağrır ve yüksek sesle okumak canınızı acıtır. Her durum farklı bir çözüm gerektirir. Daha kısa bir kitap yorgunken okumayı kolaylaştırabilir; dinlenmesi gereken bir ses içinse yeterli değildir.
intro.body2=Çocuğunuza seçenek sunmadan önce ne yapabilecek durumda olduğunuza karar verin. “Bu iki sayfayı mı okuyalım, kaydettiğimiz masalı mı dinleyelim?” demek, “İstediğini seç” demekten daha kolay uygulanır. Çocuğunuz beklerken en güzel yeni uyku masalını aramanız gerekmez. Elinizdeki bir kitap, kayıt veya size yardımcı olabilecek bir yetişkinle başlayın.
tonight.kicker=Elinizdekilerle başlayın
tonight.title=Bu akşam masala yer açmanın dört yolu
tonight.lead=Dördünü de denemeye çalışmak yerine birini seçin. Çocuğunuz zaten bitirmeye hazırsa doğrudan her zamanki gibi iyi geceler diyebilirsiniz.
option.1.title=Tanıdık bir kitaptan kısa bir bölüm okuyun
option.1.body1=Yorgunsanız ama rahatça konuşabiliyorsanız kısa bir masal, sevilen iki sayfa veya tek bir bölüm seçin. Nerede duracağınızı başlamadan söyleyin. Uzun bir hikâyede ayraç kullanmak, yarın nereden devam edeceğinizi belli eder.
option.1.body2=Her zamanki konuşma sesinizle okuyun. Karakterleri ayrı ayrı seslendirmeniz veya ses efektleri yapmanız gerekmez. Çocuğunuz daha fazlasını isterse sonu açıkça belirtin: “Bu akşamlık masalımız bu kadar. Yarın bu sayfadan devam edebiliriz.” Ne kadar okuyacağınızı iyi bir ebeveynin kaç dakika okuması gerektiğine dair bir kural değil, ikinizin de ne kadarına hazır olduğu belirlesin.
option.2.title=Masalı resimlerle paylaşın
option.2.body1=Çocuğunuzun bildiği bir kitabı açın; resimleri göstermesini, sayfa çevirmesini veya gördüklerini anlatmasını isteyin. Henüz hikâye anlatamayan bir çocuk yalnızca sevdiği resmi seçebilir. Siz de dinleyip gülümseyerek veya başınızı sallayarak karşılık verebilirsiniz. Bunu bir derse dönüştürmeniz gerekmez.
option.2.body2=“Küçük ayının nereye gittiğini gösterir misin?” gibi basit bir davet yeterli olabilir. Konuşmak sizi zorluyorsa birlikte resimlere bakıp sayfaları çevirebilirsiniz. Çocuğunuz anlatmak istemezse başka bir seçenek deneyin. Siz yorgunsunuz diye kitabın tamamını onun anlatması gerekmez.
option.3.title=Okumayı başka birine devredin, nerede biteceğini belirleyin
option.3.body1=Güvendiğiniz başka bir yetişkin uygunsa neye ihtiyacınız olduğunu açıkça söyleyin: bu kitap, şu sayfalar, ardından her zamanki iyi geceler. Aileniz için uygunsa yakınlarında kalabilir veya masal saatini o kişiye bırakabilirsiniz. Sizin okuma biçiminizi aynen taklit etmesi gerekmez.
option.3.body2=Saat ve çocuğunuzun o anki hâli uygunsa bir yakınınızı aramak da seçenek olabilir. Önceden tek bir masalda anlaşın. Canlı görüşme heyecanlı bir sohbete dönüşebilir; bu yüzden aramayı uyku saatinde mutlaka ayarlamanız gereken bir iş gibi görmeyin. Önceden hazırlanmış bir kayıtta ise saatleri denk getirmek gerekmez.
option.4.title=Önceden seçtiğiniz bir sesli masalı açın
option.4.body1=Tanıdık bir aile kaydı veya yaşına uygun bir sesli masal, siz dinlenirken okumayı üstlenebilir. Kaydı siz seçin, başlangıcını ve sonunu kontrol edin. Kullandığınız oynatıcı izin veriyorsa masal bitince duracak şekilde ayarlayın. Sesi rahat duyulacak bir düzeyde tutun; cihazı ve varsa kabloları çocuğunuzun erişemeyeceği yere koyun.
option.4.body2=Kaydı başlatıp ekranı bir kenara bırakın. Çocuğunuz kitabı da isterse dinlerken sayfalara bakabilir. Soru sorduğunda veya fikrini değiştirdiğinde size ulaşabilsin. Ses kaydı o akşam ortamı daha da hareketlendiriyorsa durdurup daha sakin bir seçeneğe dönün. Bu gece yeni bir hesap açmanız veya öneriler arasında uzun uzun arama yapmanız gerekmez.
voice.title=Boğazınız ağrıyorsa masal planını değiştirin
voice.body1=Sesiniz kısılmış veya yorulmuşsa dinlendirin; fısıldayarak okumak bir çözüm değildir. ABD Ulusal Sağırlık ve Diğer İletişim Bozuklukları Enstitüsünün (NIDCD) ses sağlığı önerileri de bu yöndedir.
voice.link=NIDCD'nin ses sağlığı önerilerini okuyun
voice.body2=Masal saatinde konuşmanızı gerektirmeyen bir yol seçin: başka bir yetişkin okusun, hazır bir kayıt dinleyin veya birlikte resimlere bakın. Bu gece yeni bir ses örneği kaydetmek, dinlendirmeye çalıştığınız sesi yeniden kullanmak demektir. Hazırlığı sonraya bırakın. Bu yazı, masal okumaya alternatifler sunar; tanı veya tedavi önermez. Belirtiler sizi endişelendiriyorsa ya da düzelmiyorsa tıbbi görüş alın.
words.title=Çocuğunuz masalı sizin okumanızı istediğinde ne söyleyebilirsiniz?
words.intro=Kısa bir açıklama yapıp seçenek sunmak, uzun bir pazarlıktan genellikle daha kolaydır. Aşağıdaki cümleleri kendinize göre değiştirebilirsiniz; kelimesi kelimesine söylemeniz gerekmez. Konuşmak canınızı acıtıyorsa planı başka bir yetişkin açıklayabilir.
words.1.label=Çok az enerjiniz kaldığında
words.1.text=“Bu akşam çok yorgunum. Birlikte bu iki sayfayı okuyup sonra iyi geceler diyebiliriz.”
words.2.label=Sesinizin dinlenmesi gerektiğinde
words.2.text=“Sesimi dinlendirmem gerekiyor. Başka biri okurken biz de birlikte resimlere bakabiliriz.”
words.3.label=Hazır bir kaydınız olduğunda
words.3.text=“Bu akşam masalımızı kayıttan dinleyeceğiz. Dinlerken ben de yanına oturabilirim.”
words.end=Seçeneklerin hiçbiri işe yaramazsa kitabı kapatıp her zamanki gibi iyi geceler deyin. Başka bir zaman masal okumayı önerebilirsiniz. Okumaya ayırdığınız her dakikayı başka bir etkinlikle doldurmanız gerekmez.
backup.title=Kendinizi daha iyi hissettiğinizde birkaç masal kaydı hazırlayın
backup.lead=Başlangıçta birkaç kayıt yeterli; bu da yönetmeniz gereken ayrı bir işe dönüşmesin. Enerjinizin olduğu ve sesinizi rahatça kullanabildiğiniz bir gün, üç adımda bir sonraki yorgun akşamı kolaylaştırabilirsiniz.
backup.1.title=Kaydetme hakkınız olan, sevilen kısa bir masal seçin
backup.1.body=Kendi masalınızı veya kaydetme ve kullanma izniniz olan bir metni kullanın. Tanıdık bir başlangıç ve belirgin bir son, daha sonra seçim yapmayı kolaylaştırır. Kitap uzunsa tek oturuşta tamamını bitirme sözü vermek yerine kaydetmenize izin verilen kısa bir bölüm seçin.
backup.2.title=Kaydedin, dinleyin ve dosyaya anlaşılır bir ad verin
backup.2.body=Telefonla kayıt yapmak pratik bir başlangıçtır. Kelimelerin net duyulduğunu ve sonunun eksiksiz olduğunu kontrol etmek için kaydı bir kez dinleyin. Dosya adına masalın adını ve okuyanın kim olduğunu ekleyin; asıl kaydı sizin kontrolünüzde olan bir yerde saklayın. Kaydı başka bir aile üyesi yapıyorsa sesinin ve kaydın nasıl kullanılacağını önceden konuşup anlaşın.
backup.3.title=İhtiyaç duymadan önce kaydın nasıl çaldığını kontrol edin
backup.3.body=Kaydı uyku saatinde kullanacağınız cihazda açın. İnternet gerekip gerekmediğini, ekranı bir kenara bıraktığınızda sesin devam edip etmediğini ve kayıt bitince ne çaldığını kontrol edin. Bunlar kullandığınız oynatıcıya bağlıdır. Seçtiğiniz masalı bir yetişkinin bütün kütüphaneyi taramadan bulabileceği bir yere koyun.
backup.note=Kaydın kendisi için yardıma mı ihtiyacınız var? Telefonla masal kaydetme rehberimizde oda seçimini, kısa ses denemesini ve yaygın ses sorunlarını ele alıyoruz. İşleyen bir düzeniniz varsa onu koruyun; hazırladığınız kaydın bu düzene uyması yeterli.
product.eyebrow=iOS ve Android için hazırlanıyor
product.title=Önceden hazırlanan, tanıdık bir aile sesi
product.body=Sleep2Story, böyle bir hazırlık için geliştiriliyor. Bir yetişkin, sesi kullanılacak kişinin onayıyla kısa bir ses örneği kaydeder ve masalın tam metnini ekler. Uygulama, kişisel kütüphanede dinlemek üzere seçilen aile sesiyle sentetik bir anlatım hazırlar. Masalı yazmaz; ortaya çıkan ses de o kişinin bu metni baştan sona okuduğu özgün bir kayıt değildir.
product.body2=Uygulama henüz mağazalarda yayımlanmadı. İlk sürümde İngilizce ve Rusça anlatım planlanıyor; bir web sayfasının Türkçeye çevrilmiş olması, Türkçe anlatımın kullanılabildiği anlamına gelmez. Bu akşam elinizde olan bir seçeneği kullanın. Sleep2Story, ilerideki akşamlar için hazırlık yapmanın bir yoludur; ses yorgunluğu veya boğaz ağrısı için anında çözüm sunmaz.
