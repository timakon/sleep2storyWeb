answer.title=Bu akşam masalı, gücünüzün yettiği şekilde paylaşın.
answer.body=Sesinizde bir sorun yoksa sevilen çok kısa bir masalı okuyun veya birlikte bir kitaba bakın. Konuşmak sizi zorluyorsa güvendiğiniz başka bir yetişkinden okumasını isteyin ya da elinizdeki bir ses kaydını kullanın. Her zamanki gibi iyi geceler deyin; yeni bir masal kaydetmeyi sesinizin rahat olduğu bir güne bırakın.
