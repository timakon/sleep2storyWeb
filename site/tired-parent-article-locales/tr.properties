faq.title=Yorgun akşamlarda akla gelen sorular
faq.1.question=Bu akşam uyku masalını atlasak olur mu?
faq.1.answer=Bu akşam okumaya gücünüz yetmiyorsa her zamanki gibi iyi geceler deyip kitabı başka bir zamana bırakabilirsiniz. Kısa bir masal, birlikte resimlere bakmak veya başka birinin okuması birer seçenektir; tamamlamanız gereken ek işler değildir. Aileniz için yapabileceğiniz kadarını seçin.
faq.2.question=Boğazım ağrıyor ama çocuğum masalı benim okumamı istiyor. Ne yapabilirim?
faq.2.answer=Sesinizi dinlendirmeniz gerektiğini kısaca açıklayın veya başka bir yetişkinden açıklamasını isteyin. Birlikte resimlere bakmayı, başka birinin okumasını ya da hazır bir kaydı dinlemeyi önerin. Sesinizi kullanmak sizi zorlarken yeni bir kayıt yapmanız gerekmez. Belirtileriniz konusunda size verilen uygun tıbbi tavsiyelere uyun.
faq.3.question=Sesli uyku masalı, yüksek sesle okumanın yerini tutar mı?
faq.3.answer=O akşam anlatımı üstlenebilir, ancak birlikte bir kitap hakkında konuşmaktan farklı bir deneyimdir. Bir yetişkin yine çocuğun yanında bulunabilir, kaydı durdurabilir ve ona karşılık verebilir. Bu pratik bir seçenektir; ses kaydının ve birlikte kitap okumanın faydalarının aynı olduğu anlamına gelmez.
faq.4.question=Hazır bir kaydımız yoksa ne yapabiliriz?
faq.4.answer=Elinizdekilerle başlayın: konuşmak sizi zorlamıyorsa daha kısa bir kitap okuyun, birlikte resimlere bakın veya güvendiğiniz başka birinden okumasını isteyin. Bu geceyi kayıt yapmaya ayırmanız gerekmez. Daha çok enerjiniz olduğunda bir masal kaydedip saklayabilirsiniz.
faq.5.question=Yarın daha uzun bir masal okuyacağımıza söz vermeli miyim?
faq.5.answer=Yalnızca yapabileceğinizi düşündüğünüz bir şey için söz verin. “Bu kitaba tekrar dönebiliriz” demek, yarının nasıl geçeceğine göre hareket etmenize alan bırakır. Nasıl hissedeceğinizi bilmeden üç masal daha okumayı kabul etmek yerine basit ve dürüst bir kapanış yapmak, sözünüzü tutmayı kolaylaştırır.
sources.title=Kaynaklar ve kapsam
sources.body=Uygulama örnekleri ve çocuğunuza söyleyebileceğiniz cümleler Sleep2Story editörlerinin önerileridir. Aşağıdaki kaynaklar ses sağlığı ve uyku öncesi rutinler hakkında bilgi verir; belirli bir uygulamanın çocuğun uyumasına yardımcı olduğunu kanıtlamaz.
