meta.title=¿Sin fuerzas para leer un cuento? | Sleep2Story
meta.description=¿No tienes fuerzas para leer un cuento o te duele la garganta? Prueba una lectura breve, otro lector o un audio ya preparado, con ideas para esta noche.
meta.og_title=¿Sin fuerzas para leer el cuento de esta noche? Un plan sencillo
meta.og_description=Opciones prácticas para madres y padres agotados: un cuento más corto, mirar las ilustraciones juntos, otro lector o una grabación preparada con tiempo.
meta.twitter_description=El cuento de antes de dormir cuando faltan las fuerzas: qué hacer esta noche, cómo explicárselo a tu hijo y qué preparar cuando te encuentres mejor.
schema.description=Guía práctica para el cuento de antes de dormir cuando el cansancio impide leer en voz alta o necesitas descansar la voz, con alternativas y pasos para preparar grabaciones.
hero.eyebrow=Para madres y padres cansados · Guía 04
hero.title=¿No tienes fuerzas para leer un cuento esta noche?
hero.dek=El libro está abierto, tu hijo pide otro cuento y ya no te quedan fuerzas para leer en voz alta. Aquí tienes un plan sencillo para esta noche, también si hablar te duele.
