answer.title=Elige una forma de compartir el cuento que puedas asumir esta noche.
answer.body=Si la voz está bien, lee un cuento favorito muy corto o mirad un libro juntos. Si hablar te resulta incómodo, pide a otro adulto de confianza que lea o usa un audio que ya tengas. Despídete como siempre y deja la grabación de un cuento nuevo para un día en que la voz esté bien.
