figure.alt=Ilustración cálida de una madre o un padre con gesto de cansancio junto a su hijo, con un libro abierto y una pequeña lámpara de mesilla
figure.caption=El cuento puede ser más corto esta noche. Podéis seguir compartiendo el momento.
intro.title=Decide qué necesitas hacer más llevadero
intro.body1=A veces, el problema es lo largo que resulta el libro. Otras, no te ves capaz de volver a poner todas las voces. Y otras, tienes dolor de garganta y leer en voz alta resulta incómodo. Cada situación pide una opción distinta. Un libro más corto ayuda con el cansancio, pero no da descanso a una voz que lo necesita.
intro.body2=Antes de ofrecer una elección, decide qué puedes hacer de verdad. «¿Estas dos páginas o nuestro cuento grabado?» es más fácil de cumplir que «Elige lo que quieras». No hace falta buscar el cuento perfecto mientras tu hijo espera. Empieza por un libro, una grabación u otro adulto que ya esté disponible para vuestra familia.
tonight.kicker=Empieza por lo que tienes
tonight.title=Cuatro formas de mantener el cuento en la rutina de esta noche
tonight.lead=Elige una opción, sin intentar probar las cuatro. Si tu hijo ya quiere terminar, podéis pasar directamente a las buenas noches de siempre.
option.1.title=Lee un fragmento de un libro conocido
option.1.body1=Si estás cansado pero hablar no te molesta, elige un cuento corto, dos páginas favoritas o un solo capítulo. Di dónde vais a parar antes de empezar. Un marcapáginas deja claro en qué punto espera una historia larga hasta mañana.
option.1.body2=Usa tu voz habitual. Puedes prescindir de las voces elaboradas de los personajes y de los efectos de sonido. Si tu hijo pide más, ofrece un final claro: «Este es nuestro cuento de hoy. Mañana podemos seguir desde esta página». La cantidad debe encajar con los dos, sin reglas sobre cuántos minutos lee una buena madre o un buen padre.
option.2.title=Deja que las ilustraciones cuenten la historia
option.2.body1=Abre un libro que tu hijo conozca e invítale a señalar, pasar una página o contarte qué ve. Si todavía no cuenta historias, basta con que elija una ilustración favorita. Puedes escuchar y responder con una sonrisa o un gesto; no tiene que convertirse en una clase.
option.2.body2=Prueba con una invitación sencilla, como «Enséñame dónde se ha ido el osito». Si hablar te molesta, deja que los gestos y el paso de las páginas guíen el momento. Si a tu hijo no le apetece participar así, elige otra opción. No tiene que contar el libro entero porque el adulto esté cansado.
option.3.title=Pasa el relevo y acordad cuándo terminar
option.3.body1=Si hay otro adulto de confianza disponible, pídele algo concreto: este libro, estas páginas y después las buenas noches de siempre. Puedes quedarte cerca si os viene bien o dejar que esa persona se encargue. No hace falta que reproduzca tu forma de leer al detalle.
option.3.body2=Un familiar también puede leer durante una llamada si el horario y el ánimo del niño lo permiten. Acordad un solo cuento de antemano. La conversación puede convertirse en un encuentro animado para ponerse al día, así que la llamada es una posibilidad, no algo que debas organizar a la hora de acostarse. Una grabación preparada antes evita tener que cuadrar husos horarios.
option.4.title=Pon un cuento en audio que ya hayas elegido
option.4.body1=Una grabación familiar conocida o un cuento en audio adecuado para la edad de tu hijo puede encargarse de la lectura mientras descansas. Elige tú el audio, comprueba el principio y el final y, si el reproductor lo permite, prográmalo para que se detenga al terminar el cuento. Mantén un volumen cómodo y deja el dispositivo y sus cables fuera del alcance del niño.
option.4.body2=Pon el audio y después deja la pantalla de lado. Si tu hijo quiere el libro, puede mirarlo mientras escucha. Sigue disponible por si tiene preguntas o cambia de idea. Si el audio hace que esta noche haya más agitación, páralo y vuelve a una opción más tranquila. Hoy no necesitas abrir una cuenta nueva ni pasar mucho tiempo buscando entre recomendaciones.
voice.title=El dolor de garganta es un motivo para cambiar el plan del cuento
voice.body1=Si tienes la voz ronca o cansada, dale descanso; susurrar no es una alternativa para evitarlo. Es la recomendación del NIDCD, el Instituto Nacional de la Sordera y Otros Trastornos de la Comunicación de Estados Unidos, para cuidar la voz.
voice.link=Leer los consejos del NIDCD para cuidar la voz
voice.body2=Para el cuento, elige una opción en la que no tengas que hablar: otro adulto, una grabación que ya tengas o mirar ilustraciones juntos. Grabar una muestra de voz nueva esta noche exige usar precisamente la voz que intentas descansar. Prepárala más adelante. Este artículo ofrece alternativas a la lectura, no un diagnóstico ni un tratamiento; consulta con un profesional sanitario si los síntomas te preocupan o no mejoran.
words.title=Qué decir cuando tu hijo pide escuchar tu voz
words.intro=Una explicación breve y una elección suelen ser más fáciles de ofrecer que una larga negociación. Son frases de ejemplo para adaptar, no un guion que tengas que decir a la perfección. Si hablar te duele, otro adulto puede explicar el plan.
words.1.label=Cuando apenas te quedan fuerzas
words.1.text=«Esta noche estoy muy cansado. Podemos leer estas dos páginas juntos y después darnos las buenas noches».
words.2.label=Cuando la voz necesita descanso
words.2.text=«Mi voz necesita descansar. Podemos mirar las ilustraciones juntos mientras otra persona lee».
words.3.label=Cuando tienes una grabación guardada
words.3.text=«Esta noche vamos a escuchar nuestro cuento grabado. Puedo sentarme contigo mientras lo escuchamos».
words.end=Si ninguna opción funciona, cierra el libro y usa las buenas noches de siempre. Puedes ofrecer un cuento en otro momento. Esta noche no hace falta sustituir cada minuto que pensabas dedicar a leer por otra actividad.
backup.title=Prepara uno o dos cuentos de reserva cuando te encuentres mejor
backup.lead=Solo necesitas unos pocos cuentos para empezar, sin añadir otro proyecto a la lista. Un día que tengas algo de energía y la voz esté bien, facilita la próxima noche de cansancio en tres pasos.
backup.1.title=Elige un cuento favorito corto que puedas grabar
backup.1.body=Usa un cuento propio o un texto que tengas permiso para grabar y utilizar. Un principio conocido y un final claro harán que sea fácil elegirlo después. Si el libro es largo, escoge un fragmento breve autorizado en vez de prometer que lo terminarás entero de una sentada.
backup.2.title=Graba, escucha y pon un nombre claro al archivo
backup.2.body=Una grabación con el móvil es un buen punto de partida. Escúchala una vez para comprobar que las palabras se entienden y que el final está completo. Incluye el título del cuento y quién lo lee en el nombre del archivo, y conserva el original en un lugar que controles. Si lo graba otro familiar, acordad cómo se usarán su voz y la grabación.
backup.3.title=Comprueba cómo se reproduce antes de necesitarlo
backup.3.body=Abre la grabación en el dispositivo que vayas a usar a la hora de acostarse. Comprueba si necesita internet, si el audio sigue al apagar la pantalla y qué se reproduce después. Estas funciones dependen del reproductor. Guarda el cuento elegido donde un adulto pueda encontrarlo sin recorrer toda una biblioteca.
backup.note=¿Necesitas ayuda con la grabación? Nuestra guía para grabar con el móvil explica cómo elegir la habitación, hacer una prueba breve de sonido y resolver problemas de audio habituales. Si ya tenéis una rutina que funciona, mantenedla; este recurso solo tiene que encajar en ella.
product.eyebrow=En preparación para iOS y Android
product.title=Una voz familiar, preparada con antelación
product.body=Sleep2Story se está desarrollando para facilitar esta preparación. Un adulto graba una breve muestra de voz con el consentimiento de la persona que habla y añade el texto completo del cuento. La aplicación prepara una narración sintética que reproduce la voz del familiar elegido para escucharla en una biblioteca personal. No escribe el cuento ni conserva una lectura original de esas palabras exactas.
product.body2=La aplicación todavía no está disponible en las tiendas de aplicaciones. Está previsto ofrecer narración en inglés y ruso en el lanzamiento; que una página web esté traducida no significa que la narración en ese idioma esté disponible. Para esta noche, usa una opción que ya tengas. Sleep2Story es una forma de prepararse para futuras noches, no una solución inmediata para una voz cansada o dolorida.
