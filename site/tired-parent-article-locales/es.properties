faq.title=Preguntas que surgen en las noches de cansancio
faq.1.question=¿Pasa algo si esta noche nos saltamos el cuento?
faq.1.answer=Si leer es más de lo que puedes asumir hoy, puedes despedirte como siempre y ofrecer un libro en otro momento. Un cuento más corto, mirar ilustraciones juntos u otro lector son opciones, no tareas adicionales que debas completar. Elige lo que vuestra familia pueda hacer.
faq.2.question=¿Y si me duele la garganta pero mi hijo quiere que lea yo?
faq.2.answer=Explica brevemente que tu voz necesita descanso, o pide a otro adulto que lo explique. Ofrece mirar ilustraciones, escuchar a otro lector o poner una grabación que ya tengáis. No necesitas grabar algo nuevo mientras hablar te resulte incómodo. Sigue las indicaciones médicas adecuadas para tus síntomas.
faq.3.question=¿Un cuento en audio puede sustituir a la lectura en voz alta?
faq.3.answer=Puede encargarse de narrar una noche concreta, pero la experiencia es distinta de conversar juntos sobre un libro. Un adulto puede seguir presente, pausar el audio y responder al niño. Es una opción práctica; no significa que el audio y la lectura compartida tengan los mismos beneficios.
faq.4.question=¿Y si no tenemos ninguna grabación preparada?
faq.4.answer=Empieza por lo que haya disponible: un libro más corto si hablar no te molesta, mirar ilustraciones u otro lector de confianza. No conviertas esta noche en una sesión de grabación. Puedes preparar un cuento guardado cuando tengas más energía.
faq.5.question=¿Debería prometer un cuento más largo para mañana?
faq.5.answer=Promete solo lo que creas que podrás cumplir. «Podemos volver a este libro» deja margen para cómo vaya el día de mañana. Un final sencillo y sincero es más fácil de mantener que prometer tres cuentos más sin saber cómo te encontrarás.
sources.title=Fuentes y alcance
sources.body=Los ejemplos prácticos y las frases propuestas son sugerencias editoriales de Sleep2Story. Las fuentes siguientes aportan contexto sobre el cuidado de la voz y las rutinas al acostarse; no demuestran que una aplicación concreta ayude a un niño a dormir.
