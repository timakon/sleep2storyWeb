meta.description=Keine Kraft für eine Gute-Nacht-Geschichte oder eine heisere Stimme? Kurze Geschichten, Bilder und fertige Aufnahmen: einfache Möglichkeiten für heute Abend.
meta.og_title=Zu müde zum Vorlesen? Ein kleiner Plan für heute Abend
meta.og_description=Praktische Möglichkeiten für erschöpfte Eltern: kürzer lesen, gemeinsam Bilder anschauen, jemanden bitten oder eine frühere Aufnahme abspielen.
meta.twitter_description=Eine Gute-Nacht-Geschichte trotz wenig Energie: was heute möglich ist, wie Sie es Ihrem Kind erklären und was sich für später vorbereiten lässt.
schema.description=Ein praktischer Ratgeber für Abende, an denen Eltern zu müde zum Vorlesen sind oder ihre Stimme schonen müssen, mit Alternativen und Tipps für vorbereitete Aufnahmen.
hero.eyebrow=Für müde Eltern · Ratgeber 04
hero.title=Zu müde zum Vorlesen?
hero.dek=Das Buch liegt offen, Ihr Kind möchte noch eine Geschichte, doch Ihnen fehlt die Kraft zum Vorlesen. Hier finden Sie einen kleinen Plan für heute Abend – auch dann, wenn das Sprechen wehtut.
byline.read_time=9 Minuten Lesezeit
byline.date=7. September 2026
nav.tonight=Heute Abend
nav.voice=Stimme schonen
nav.backup=Für später
answer.title=Wählen Sie die Geschichtenzeit, die heute für Sie machbar ist.
answer.body=Wenn sich Ihre Stimme gut anfühlt, lesen Sie eine sehr kurze Lieblingsgeschichte oder schauen Sie gemeinsam ein Buch an. Ist Sprechen unangenehm, kann ein anderer vertrauter Erwachsener vorlesen oder eine vorhandene Aufnahme übernehmen. Behalten Sie Ihren gewohnten Gute-Nacht-Abschluss bei. Eine neue Geschichte nehmen Sie an einem Tag auf, an dem Ihre Stimme wieder mitmacht.
toc.tonight=Vier Möglichkeiten für heute Abend
toc.voice=Wenn Hals oder Stimme wehtun
toc.words=Sätze, die Ihnen helfen können
toc.backup=Eine kleine Hörreserve vorbereiten
toc.product=Wo Sleep2Story ins Bild passt
toc.faq=Fragen an müden Abenden
figure.alt=Warme Illustration eines müden Elternteils neben einem Kind, einem offenen Buch und einer kleinen Nachttischlampe
figure.caption=Heute darf die Geschichte kürzer ausfallen. Der gemeinsame Moment bleibt.
intro.title=Was soll heute leichter werden?
intro.body1=Manchmal ist das Buch einfach zu lang. Manchmal fehlt die Kraft, noch einmal alle Figurenstimmen nachzumachen. Und manchmal haben Sie Halsschmerzen und das Vorlesen ist unangenehm. Dafür braucht es unterschiedliche Lösungen. Ein kürzeres Buch kann bei Müdigkeit helfen; eine Stimme, die Ruhe braucht, bekommt dadurch aber noch keine Pause.
intro.body2=Überlegen Sie zuerst, was Sie tatsächlich schaffen, und bieten Sie erst dann eine Auswahl an. „Diese beiden Seiten oder unsere gespeicherte Geschichte?“ lässt sich leichter einhalten als „Such dir irgendetwas aus“. Sie müssen jetzt keine neue, perfekte Gute-Nacht-Geschichte finden, während Ihr Kind wartet. Beginnen Sie mit einem Buch, einer Aufnahme oder einer anderen erwachsenen Bezugsperson, die schon verfügbar ist.
tonight.kicker=Nutzen Sie, was schon da ist
tonight.title=Vier Möglichkeiten für eine Geschichte heute Abend
tonight.lead=Wählen Sie eine Möglichkeit aus. Sie müssen nicht alle vier ausprobieren. Wenn Ihr Kind bereits genug hat, können Sie auch direkt wie gewohnt Gute Nacht sagen.
option.1.title=Lesen Sie einen kleinen Teil eines vertrauten Buchs
option.1.body1=Wenn Sie müde sind, aber gut sprechen können, reicht eine kurze Geschichte, ein Lieblingsabschnitt von zwei Seiten oder ein einzelnes Kapitel. Sagen Sie vor dem Anfang, wo Sie aufhören werden. Ein Lesezeichen zeigt bei einer längeren Geschichte, an welcher Stelle es morgen weitergehen kann.
option.1.body2=Bleiben Sie bei Ihrer normalen Sprechstimme. Aufwendige Figurenstimmen und Geräusche dürfen heute fehlen. Wenn Ihr Kind mehr möchte, hilft ein klarer Abschluss: „Das war unsere Geschichte für heute. Morgen können wir an dieser Stelle weiterlesen.“ Der Umfang soll zu Ihnen beiden passen. Es gibt keine Vorleseminutenzahl, an der sich gute Eltern messen müssen.
option.2.title=Lassen Sie die Bilder erzählen
option.2.body1=Schlagen Sie ein bekanntes Buch auf und laden Sie Ihr Kind ein, etwas zu zeigen, umzublättern oder zu erzählen, was es entdeckt. Ein Kind, das selbst noch keine Geschichten erzählt, kann einfach sein Lieblingsbild auswählen. Sie können zuhören und mit einem Lächeln oder Nicken antworten. Daraus muss keine Übungsstunde werden.
option.2.body2=Ein kleiner Impuls genügt: „Zeig mir, wohin der kleine Bär gegangen ist.“ Wenn das Sprechen unangenehm ist, lassen Sie Zeigen und Umblättern für sich sprechen. Möchte Ihr Kind nicht mitmachen, wählen Sie etwas anderes. Es muss nicht das ganze Buch vortragen, nur weil der Erwachsene müde ist.
option.3.title=Geben Sie das Vorlesen mit einem klaren Abschluss weiter
option.3.body1=Wenn ein anderer vertrauter Erwachsener da ist, bitten Sie ihn um eine konkrete Übernahme: dieses Buch, diese Seiten, danach der gewohnte Gute-Nacht-Abschluss. Sie können dabeibleiben, wenn das für Ihre Familie passt, oder die Geschichtenzeit vollständig abgeben. Niemand muss Ihren Vorlesestil genau nachmachen.
option.3.body2=Auch ein Anruf bei Verwandten kann passen, wenn Uhrzeit und Stimmung Ihres Kindes es zulassen. Vereinbaren Sie vorher eine Geschichte. Aus einem Gespräch kann schnell ein lebhafter Austausch werden. Ein Anruf ist deshalb eine Möglichkeit, keine zusätzliche Aufgabe, die Sie noch zur Schlafenszeit organisieren müssen. Bei einer vorher aufgenommenen Geschichte müssen keine Zeitzonen zusammenpassen.
option.4.title=Spielen Sie eine bereits ausgewählte Hörgeschichte ab
option.4.body1=Eine vertraute Familienaufnahme oder eine altersgerechte Hörgeschichte kann das Vorlesen übernehmen, während Sie sich ausruhen. Wählen Sie die Aufnahme selbst aus, prüfen Sie Anfang und Ende und stellen Sie möglichst ein, dass danach nichts weiterläuft. Ob das geht, hängt vom Abspielgerät ab. Achten Sie auf eine angenehme Lautstärke und halten Sie Gerät und Kabel außerhalb der Reichweite Ihres Kindes.
option.4.body2=Starten Sie die Aufnahme und lassen Sie den Bildschirm danach in Ruhe. Wenn Ihr Kind möchte, kann es das Buch beim Zuhören anschauen. Bleiben Sie für Ihr Kind da, wenn es Fragen hat oder sich anders entscheidet. Bringt die Aufnahme heute eher Unruhe, stoppen Sie sie und wählen Sie etwas Ruhigeres. Für diesen Abend brauchen Sie weder ein neues Konto noch eine lange Suche in Empfehlungslisten.
voice.title=Bei Halsschmerzen darf der Vorleseplan anders aussehen
voice.body1=Ist Ihre Stimme heiser oder ermüdet, gönnen Sie ihr Ruhe. Flüstern ist kein Ausweg. Das empfiehlt das US-amerikanische National Institute on Deafness and Other Communication Disorders (NIDCD) in seinen Hinweisen zur Stimmpflege.
voice.link=Hinweise des NIDCD zur Stimmpflege lesen (Englisch)
voice.body2=Wählen Sie für die Geschichtenzeit etwas, bei dem Sie nicht sprechen müssen: einen anderen Erwachsenen, eine vorhandene Aufnahme oder gemeinsames Bilderanschauen. Eine neue Stimmprobe würde heute genau die Stimme beanspruchen, die Sie schonen möchten. Bereiten Sie sie später vor. Dieser Ratgeber bietet Alternativen zum Vorlesen, keine Diagnose oder Behandlung. Holen Sie ärztlichen Rat ein, wenn die Beschwerden Ihnen Sorgen machen oder nicht besser werden.
words.title=Wenn Ihr Kind gerade Ihre Stimme hören möchte
words.intro=Eine kurze Erklärung und eine konkrete Auswahl sind meist leichter als langes Verhandeln. Die folgenden Sätze sind Anregungen, die Sie anpassen können. Sie müssen nicht genau so klingen. Wenn das Sprechen wehtut, kann ein anderer Erwachsener den Plan erklären.
words.1.label=Wenn kaum noch Kraft da ist
words.1.text=„Ich bin heute sehr müde. Wir können diese beiden Seiten zusammen lesen und uns dann Gute Nacht sagen.“
words.2.label=Wenn Ihre Stimme Ruhe braucht
words.2.text=„Meine Stimme braucht eine Pause. Wir können uns zusammen die Bilder anschauen, während jemand anderes vorliest.“
words.3.label=Wenn Sie eine Aufnahme gespeichert haben
words.3.text=„Heute hören wir unsere Geschichte als Aufnahme. Ich kann bei dir sitzen, während wir zuhören.“
words.end=Wenn keine der Möglichkeiten passt, schließen Sie das Buch und sagen Sie wie gewohnt Gute Nacht. Eine Geschichte kann zu einem anderen Zeitpunkt Platz finden. Sie müssen nicht jede ursprünglich geplante Vorleseminute mit einer Ersatzbeschäftigung füllen.
backup.title=An einem besseren Tag eine kleine Hörreserve anlegen
backup.lead=Für den Anfang reicht eine kleine Auswahl. Daraus muss kein weiteres Projekt werden. Wenn Sie etwas Energie haben und Ihre Stimme sich gut anfühlt, können Sie in drei Schritten für den nächsten müden Abend vorsorgen.
backup.1.title=Wählen Sie eine kurze Lieblingsgeschichte, die Sie aufnehmen dürfen
backup.1.body=Verwenden Sie eine eigene Geschichte oder einen Text, den Sie aufnehmen und nutzen dürfen. Ein vertrauter Anfang und ein eindeutiger Schluss erleichtern später die Auswahl. Bei einem langen Buch bietet sich ein kurzer Abschnitt an, für dessen Aufnahme Sie die nötigen Rechte haben. Sie müssen nicht versprechen, das ganze Buch in einem Durchgang aufzunehmen.
backup.2.title=Aufnehmen, anhören und die Datei eindeutig benennen
backup.2.body=Eine Aufnahme mit dem Smartphone ist ein praktischer Anfang. Hören Sie einmal nach, ob die Wörter verständlich sind und der Schluss vollständig ist. Nehmen Sie Titel und Namen der vorlesenden Person in den Dateinamen auf. Bewahren Sie das Original an einem Ort auf, den Sie selbst kontrollieren. Nimmt ein anderes Familienmitglied die Geschichte auf, vereinbaren Sie, wie Stimme und Aufnahme verwendet werden.
backup.3.title=Testen Sie das Abspielen, bevor Sie die Aufnahme brauchen
backup.3.body=Öffnen Sie die Aufnahme auf dem Gerät, das Sie abends tatsächlich verwenden möchten. Prüfen Sie, ob Internet nötig ist, ob der Ton weiterläuft, wenn Sie den Bildschirm nicht mehr benutzen, und was nach der Geschichte abgespielt wird. Diese Funktionen hängen vom verwendeten Player ab. Legen Sie die Geschichte so ab, dass ein Erwachsener sie findet, ohne eine ganze Bibliothek zu durchsuchen.
backup.note=Sie brauchen Hilfe bei der Aufnahme? Unser Smartphone-Ratgeber erklärt die Raumwahl, einen kurzen Tontest und häufige Tonprobleme. Wenn Ihre Abendroutine bereits gut funktioniert, behalten Sie sie bei. Die Hörreserve muss nur darin Platz finden.
product.eyebrow=In Vorbereitung für iOS und Android
product.title=Eine vertraute Stimme für den nächsten Abend
product.body=Sleep2Story wird für diese Vorbereitung entwickelt. Ein Erwachsener nimmt mit Zustimmung der sprechenden Person eine kurze Stimmprobe auf und fügt den vollständigen Geschichtentext hinzu. Die App erstellt daraus eine synthetische Erzählung in der ausgewählten Familienstimme, die sich in einer persönlichen Bibliothek anhören lässt. Sie schreibt die Geschichte nicht selbst. Die Erzählung ist auch keine Originalaufnahme, in der die Person diesen Text selbst vorgelesen hat.
product.body2=Die App ist noch nicht in den Stores erhältlich. Zum Start sind Erzählungen auf Englisch und Russisch geplant. Eine übersetzte Website bedeutet nicht, dass Erzählungen in dieser Sprache verfügbar sind. Nutzen Sie für heute Abend etwas, das Sie bereits haben. Sleep2Story ist eine Möglichkeit, spätere Abende vorzubereiten; bei einer müden oder schmerzenden Stimme hilft heute ein anderer Vorleseplan.
