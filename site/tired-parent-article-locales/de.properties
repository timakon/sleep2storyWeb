faq.title=Fragen, die an müden Abenden aufkommen
faq.1.question=Darf die Gute-Nacht-Geschichte heute ausfallen?
faq.1.answer=Wenn Sie heute keine Kraft für eine Gute-Nacht-Geschichte haben, können Sie wie gewohnt Gute Nacht sagen und das Buch zu einem anderen Zeitpunkt anbieten. Eine kürzere Geschichte, gemeinsames Bilderanschauen oder eine andere vorlesende Person sind Möglichkeiten, keine zusätzlichen Pflichtaufgaben. Wählen Sie, was für Ihre Familie machbar ist.
faq.2.question=Was tun, wenn ich Halsschmerzen habe, mein Kind aber vorgelesen bekommen möchte?
faq.2.answer=Erklären Sie kurz, dass Ihre Stimme Ruhe braucht, oder bitten Sie einen anderen Erwachsenen darum. Bieten Sie Bilder, eine andere vorlesende Person oder eine vorhandene Aufnahme an. Sie brauchen keine neue Aufnahme zu machen, während das Sprechen unangenehm ist. Beachten Sie ärztliche Empfehlungen zu Ihren Beschwerden.
faq.3.question=Kann eine Hörgeschichte das Vorlesen ersetzen?
faq.3.answer=Sie kann an einem bestimmten Abend die Erzählung übernehmen. Das gemeinsame Gespräch über ein Buch ist jedoch eine andere Erfahrung. Ein Erwachsener kann weiterhin dabeisein, die Aufnahme anhalten und auf das Kind eingehen. Hier geht es um eine praktische Möglichkeit; daraus folgt nicht, dass Hören und gemeinsames Vorlesen die gleichen Vorteile haben.
faq.4.question=Was machen wir, wenn keine Aufnahme bereitliegt?
faq.4.answer=Beginnen Sie mit dem, was verfügbar ist: ein kürzeres Buch, sofern das Sprechen angenehm ist, gemeinsames Bilderanschauen oder eine andere vertraute Person, die vorliest. Machen Sie aus diesem Abend keine Aufnahmesitzung. Eine Geschichte können Sie vorbereiten, wenn Sie wieder mehr Energie haben.
faq.5.question=Sollte ich für morgen eine längere Geschichte versprechen?
faq.5.answer=Versprechen Sie nur, was Sie voraussichtlich einhalten können. „Wir können dieses Buch später weiterlesen“ lässt offen, wie der nächste Tag verläuft. Ein einfacher, ehrlicher Abschluss ist leichter einzuhalten als die Zusage von drei zusätzlichen Geschichten, wenn Sie noch nicht wissen, wie es Ihnen morgen geht.
sources.title=Quellen und Einordnung
sources.body=Die praktischen Beispiele und Formulierungsvorschläge stammen von der Sleep2Story-Redaktion. Die folgenden Quellen liefern Hintergrundinformationen zu Stimmpflege und Abendroutinen. Sie belegen nicht, dass eine bestimmte App Kindern beim Schlafen hilft.
