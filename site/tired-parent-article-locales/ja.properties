hero.title=寝る前に物語を読む元気がないときは？
hero.dek=本は開いたけれど、子どもはもう一つお話を聞きたがり、声に出して読む力が残っていない。話すと喉が痛む夜も含め、今夜できる小さな計画を紹介します。
