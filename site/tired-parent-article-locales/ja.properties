faq.title=疲れた夜によくある質問
faq.1.question=今夜は物語を読まずに寝てもいいですか？
faq.1.answer=今夜読むのが大変なら、いつもの「おやすみ」だけを残して、本は別の時間にしても大丈夫です。短い話や一緒に絵を見ること、別の読み手は選択肢であって、追加の宿題ではありません。家族にできることを選びましょう。
faq.2.question=喉が痛いのに、子どもが私に読んでほしがるときは？
faq.2.answer=声を休ませたいと短く説明するか、別の大人に伝えてもらいましょう。絵を見る、ほかの人に読んでもらう、既存の録音を使う方法があります。声がつらいときに新しく録る必要はありません。症状については適切な医療上の助言に従ってください。
faq.3.question=音声の物語は読み聞かせの代わりになりますか？
faq.3.answer=その夜の朗読を任せることはできますが、一緒に本を見ながら話すのとは別の体験です。大人はそばにいて、音声を止めたり、子どもに答えたりできます。実用的な選択肢であり、音声と一緒に読むことにまったく同じ利点があるという主張ではありません。
faq.4.question=録音がまだない場合は？
faq.4.answer=今ある方法から始めましょう。話すのがつらくなければ短い本、そうでなければ絵を見るか、信頼できる別の大人に頼みます。今夜を録音作業の夜にしなくて大丈夫。元気のある日に1つ保存しておけます。
faq.5.question=明日は長い話を読むと約束すべきですか？
faq.5.answer=できそうなことだけ約束しましょう。「この本の続きはまた読めるよ」なら明日の様子に合わせられます。体調がどうなるか分からないのに、追加で3話読むと約束するより、正直でシンプルな終わり方のほうが守れます。
sources.title=資料と記事の範囲
sources.body=実用例と声かけの文例は Sleep2Story 編集部の提案です。以下の資料は声のケアと寝る前の習慣の参考情報であり、特定のアプリが子どもの睡眠に役立つことを証明するものではありません。
