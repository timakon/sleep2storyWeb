figure.alt=開いた本と小さなベッドサイドランプのそばに、疲れた保護者と子どもがいる温かなイラスト
figure.caption=今夜の物語は短くていい。一緒にいる時間は残せます。
intro.title=何を楽にしたいか、先に考える
intro.body1=本が長すぎる日もあれば、登場人物の声を演じる余裕がない日もあります。喉が痛くて、声に出して読むこと自体がつらい日もあります。必要な選択肢はそれぞれ違います。短い本は疲れには役立ちますが、休ませるべき声の代わりにはなりません。
intro.body2=選択肢を出す前に、実際にできることを決めましょう。「この2ページと、録ってあるお話のどっちにする？」のほうが、「何でも選んでいいよ」より守りやすいものです。子どもを待たせながら完璧な新しい物語を探す必要はありません。今ある本や録音、頼める大人から始めましょう。
tonight.kicker=手元にあるものから
tonight.title=今夜も物語の時間を残す4つの方法
tonight.lead=4つ全部試すのではなく、1つ選びましょう。子どもがもう終わりにしたそうなら、いつもの「おやすみ」へ進んでも大丈夫です。
option.1.title=慣れた本を少しだけ読む
option.1.body1=疲れていても話すのはつらくないなら、短い話を1つ、お気に入りの2ページだけ、または1章だけを選びます。始める前に、どこまで読むか伝えましょう。しおりを挟めば、長い話も明日まで待てます。
option.1.body2=普段の声で読みましょう。凝った声色や効果音は省いて大丈夫。もっと聞きたがったら、「今夜はここまで。明日はこのページから読もうね」と区切ります。読む量は、大人と子どもの両方に合えば十分です。「よい親なら何分読むべき」という決まりはありません。
option.2.title=絵にお話を任せる
option.2.body1=子どもが知っている本を開き、指をさしたり、ページをめくったり、気づいたことを話したりしてもらいましょう。まだお話を作れない子なら、好きな絵を選ぶだけでも十分です。大人は笑顔やうなずきで応えればよく、勉強の時間にする必要はありません。
option.2.body2=「小さなくまさんはどこに行ったかな？教えて」と軽く誘ってみます。話すのがつらければ、指さしとページめくりに任せましょう。子どもが乗り気でなければ別の方法に。大人が疲れているからといって、子どもが本を丸ごと演じる必要はありません。
option.3.title=終わり方を決めて、別の人に読んでもらう
option.3.body1=信頼できる別の大人がいるなら、「この本のこのページを読んで、いつもの言葉でおやすみを言って」と具体的に頼みます。家族に合うならそばにいても、その人に任せても構いません。あなたの読み方をそっくり再現する必要はありません。
option.3.body2=時間と子どもの気分が合えば、離れた親族と通話する方法もあります。話は前もって1つ決めておきましょう。生の会話は楽しい近況報告で盛り上がることもあるので、寝る前に必ず手配するものではなく選択肢として考えて。以前の録音なら、時差を合わせる必要もありません。
option.4.title=すでに選んである音声の物語を流す
option.4.body1=家族の聞き慣れた録音や年齢に合う音声の物語なら、大人が休む間に朗読を任せられます。大人が再生するものを選び、冒頭と結末を確認し、可能なら物語が終わったら止まるよう設定します。音量は心地よくし、端末やコードは子どもの手の届かない所に置きましょう。
option.4.body2=音声を流し始めたら、画面から離れましょう。子どもが本を見たければ、聴きながら一緒に見られます。質問や気持ちの変化には応じてあげてください。今夜は音声でかえって落ち着かないなら止めて、静かな方法に戻りましょう。今夜のために新しいアカウントを作ったり、長々とおすすめを探したりする必要はありません。
voice.title=喉が痛いなら、読み聞かせの計画を変えてよい
voice.body1=声がかれたり疲れたりしているときは休ませましょう。ささやき声は代わりになりません。これは米国の国立聴覚・その他のコミュニケーション障害研究所（NIDCD）による声のケアの案内です。
voice.link=NIDCD の声のケアについて読む
voice.body2=お話の時間は、話さずにできる方法を選びましょう。別の大人、手元にある録音、または一緒に絵を見る方法があります。今夜新しい声のサンプルを録るのは、休ませたい声を使うことになります。録音は後日にしましょう。この記事は読み聞かせの代案を紹介するもので、診断や治療ではありません。症状が心配なときや改善しないときは、医療機関に相談してください。
words.title=子どもがあなたの声を聞きたがるときの言葉
words.intro=長い交渉より、短い説明と選択肢のほうが伝えやすいことがあります。以下は言い換えて使える例で、正しく言わなければならない台詞ではありません。話すのが痛いなら、別の大人に説明してもらいましょう。
words.1.label=ほとんど元気が残っていないとき
words.1.text=「今夜はとても疲れているから、この2ページを一緒に読んでから、おやすみしようね。」
words.2.label=声を休めたいとき
words.2.text=「今日は声を休ませたいんだ。ほかの人に読んでもらいながら、一緒に絵を見ようね。」
words.3.label=録ってある音声があるとき
words.3.text=「今夜は録ってあるお話を聴こう。聴いている間、そばにいるよ。」
words.end=どれも合わないときは本を閉じて、いつもの「おやすみ」を言いましょう。物語はまた別の時間にできます。読むつもりだった時間を、別の活動で埋める必要はありません。
backup.title=元気な日に、小さなお話の備えを作る
backup.lead=準備するのは少しで十分。管理する仕事を増やす必要はありません。声も体も楽な日に、次の疲れた夜を助ける3つの手順を試しましょう。
backup.1.title=録音してよい短いお気に入りを1つ選ぶ
backup.1.body=自作の話か、録音して利用する許可のある文章を使います。なじみのある始まりとはっきりした終わりがあると、後で選びやすくなります。長い本なら、一度で全部読むと決めず、録音が許された短い部分を選びましょう。
backup.2.title=録って聴き返し、分かりやすい名前で保存する
backup.2.body=スマホの録音から始められます。一度聴き返し、言葉が明瞭で、最後まで録れているか確認します。ファイル名には物語の題名と読み手を入れ、元のデータは自分で管理できる場所に保存しましょう。別の家族が録る場合は、その声と録音の使い方に合意しておきます。
backup.3.title=使う前に再生方法を確認する
backup.3.body=寝るときに実際に使う端末で録音を開きます。インターネットが必要か、画面をしまっても音が続くか、終わった後に何が再生されるか確認しましょう。こうした機能はプレーヤーによって異なります。大人がライブラリを探し回らず見つけられる場所に、選んだ話を置きます。
backup.note=録音の仕方を詳しく知りたい方へ。スマホ録音のガイドでは、部屋選び、短い試し録り、よくある音の問題を扱っています。すでにうまくいっている寝る前の習慣があれば、そのまま大切に。この備えはそこに合うだけで十分です。
product.eyebrow=iOS と Android 向けに公開準備中
product.title=聞き慣れた家族の声を、元気なうちに準備
product.body=Sleep2Story は、こうした準備のために開発中です。大人が話し手本人の同意を得て短い声のサンプルを録り、物語の全文を追加します。アプリは選んだ家族の声による合成朗読を作り、個人ライブラリで聴けるようにします。物語を代筆したり、その文章を読んだ実際の録音を保存したりするものではありません。
product.body2=アプリはまだストアで公開されていません。今夜はすでに手元にある方法を使ってください。Sleep2Story はこれからの夜に備えるもので、疲れや声の痛みをその場で解決するものではありません。
product.cta=Sleep2Story の使い方を見る
