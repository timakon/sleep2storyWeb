nav.backup=次回の備え
answer.title=今夜できる形の「お話の時間」を選びましょう。
answer.body=声がつらくなければ、ごく短いお気に入りを読むか、一緒に本の絵を見ましょう。話すのが苦痛なら、信頼できる別の大人に頼むか、すでにある音声を使います。いつもの「おやすみ」は残し、新しい録音は声の調子がよい日に。
