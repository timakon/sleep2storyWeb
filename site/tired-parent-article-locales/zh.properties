answer.title=今晚就选一种你做得到的故事时间。
answer.body=如果说话没问题，可以读最短的一篇，或一起看书。如果说话不舒服，请另一位信任的成年人来读，或播放已有音频。熟悉的晚安仪式可以照旧；新故事等嗓子舒服的那天再录。
toc.tonight=今晚的四种选择
toc.voice=喉咙或声音不舒服时
toc.words=可以借用的话
toc.backup=准备一份简短音频备选
