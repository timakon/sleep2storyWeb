meta.title=累得不想读睡前故事？今晚可以这样做 | Sleep2Story
meta.description=没力气读睡前故事，或嗓子不舒服？试试更短的内容、请别人来读，或播放已有录音。这里有今晚和下次都用得上的简单方案。
meta.og_title=累得不想读睡前故事？今晚的轻松方案
meta.og_description=给疲惫家长的实用选择：读短一点、一起看图、换人朗读，或播放提前准备的录音。
meta.twitter_description=精力不足的夜晚怎样讲睡前故事：今晚能做什么、怎样告诉孩子，以及状态好时可以准备什么。
schema.description=当家长累得读不动、或需要让嗓子休息时，如何安排睡前故事：可行的替代方式和提前录音的计划。
