toc.faq=疲惫夜晚的常见问题
figure.alt=温暖的插画：疲惫的家长坐在孩子身旁，旁边有打开的书和小床头灯
figure.caption=今晚的故事可以短一点，陪伴的时刻依然在。
intro.title=先想想什么需要变得更轻松
intro.body1=有时问题在于书太长；有时你实在不想再模仿角色说话；有时喉咙疼，朗读本身就不舒服。不同的夜晚需要不同的选择。换一本短书能减轻疲惫，却不能让需要休息的嗓子恢复。
intro.body2=给孩子提供选择前，先想清楚自己现在能做什么。“读这两页，还是听我们存好的故事？”比“想听什么都行”更容易兑现。孩子等着的时候，不必临时寻找最完美的新故事；先用家里已有的书、录音或帮得上忙的成年人。
tonight.kicker=从手边已有的开始
tonight.title=四种办法，让故事留在今晚的习惯里
tonight.lead=选一种就够了，不必四种都试。如果孩子已经想结束，可以直接说平时那句晚安。
option.1.title=把熟悉的书读短一点
option.1.body1=如果只是累，但说话并不难受，就选一个短故事、最喜欢的两页或一章。开始前告诉孩子读到哪里。书签能让长故事有个明确的位置，留到明天继续。
option.1.body2=用平时说话的声音读就好，复杂的角色声线和音效都可以省略。如果孩子还想听，可以清楚地收尾：“今晚读到这里，明天我们从这一页接着读。”读多少应该适合你和孩子，不必按某条“好家长读几分钟”的标准来。
option.2.title=让图画带着故事往前走
option.2.body1=打开孩子熟悉的书，请他或她指一指、翻一页，说说看到了什么。还不会讲故事的孩子，也可以只选一张最喜欢的图。你听着，笑一笑或点点头就好，不用变成一堂课。
option.2.body2=试着轻轻邀请：“小熊去哪儿了？指给我看好吗？”如果说话不舒服，就让指图和翻页替你说话。如果孩子不想参与，就换一种方法。大人累了，不代表孩子必须负责把整本书讲完。
option.3.title=请别人接着读，并约定好结尾
option.3.body1=如果有另一位信任的成年人在场，可以说清楚怎么接手：读这本书的这几页，最后照常道晚安。你可以留在旁边，也可以让对方全程陪伴，不必要求他或她完全模仿你的读法。
option.3.body2=时间和孩子的状态合适时，也可以请远方亲人打电话读。事先约定一个故事。实时聊天可能变成兴奋的叙旧，所以电话只是一个选择，不是睡前必须安排的任务。提前录好的故事则不受时区影响。
option.4.title=播放早已选好的音频故事
option.4.body1=熟悉的家庭录音，或适合孩子年龄的音频故事，可以在你休息时负责朗读。由大人挑好音轨，检查开头结尾；如果播放器允许，设置故事结束后停止。把音量调到舒适，并让设备和线缆远离孩子够得到的地方。
option.4.body2=开始播放后，就把屏幕放下。孩子想看书，可以边听边看。你仍可以回答问题，也能随时改变主意。如果音频反而让今晚更热闹，就停下，换回更安静的方式。今晚不需要新注册账号，也不必长时间刷推荐列表。
voice.title=喉咙疼，就该调整朗读计划
voice.body1=如果声音沙哑或疲劳，就让它休息；耳语也不是替代办法。这是美国国家耳聋及其他沟通障碍研究所（NIDCD）给出的护嗓建议。
voice.link=阅读 NIDCD 的护嗓建议
voice.body2=今晚可以选不必说话的方式：请另一位成年人来读、播放已有录音，或陪孩子一起看图。为了录新声音样本而开口，正好会用到你需要休息的嗓子，留到以后再做。这篇文章提供朗读的替代选择，不提供诊断或治疗；若症状让你担心或迟迟不见好转，请咨询医生。
words.title=孩子想听你的声音时，可以怎么说
words.intro=简短解释，再给一个选择，通常比长时间商量更容易。这些只是可以按自家情况改写的示例，不必一字不差。如果开口会疼，可以请另一位成年人说明安排。
words.1.label=精力所剩无几时
words.1.text=“我今晚真的很累。我们一起读这两页，然后说晚安，好吗？”
words.2.label=嗓子需要休息时
words.2.text=“我的嗓子要休息一下。我们一起看图，请别人来读故事吧。”
words.3.label=已有录音时
words.3.text=“今晚让录音给我们读故事。我可以坐在你身边一起听。”
words.end=如果哪种方法都行不通，就合上书，照常说晚安。故事可以改天再讲。原本计划读书的每一分钟，今晚都不必另外找活动填满。
backup.title=状态好的那天，备一个小小的故事方案
backup.lead=只需要一小份可以开始的内容，不必再给自己添个需要管理的新项目。精力较好、嗓子也舒服时，用三步让下一个疲惫的夜晚轻松些。
backup.1.title=挑一个你有权录制的短故事
backup.1.body=用自己写的故事，或你有权录制、使用的文字。熟悉的开头和明确的结尾，方便以后直接选用。如果书很长，就挑获准使用的短章节，不必承诺一次录完。
backup.2.title=录音、回听，并清楚命名文件
backup.2.body=用手机录音就能开始。听一遍，确认字句清楚、结尾完整。文件名写上故事标题和朗读者，把原始文件存在自己可控的地方。如果由其他家人录制，先说好这段声音和录音将如何使用。
backup.3.title=提前确认到时怎么播放
backup.3.body=在真正打算睡前使用的设备上打开录音。检查是否需要联网、屏幕收起后能否继续播放，以及播完会接着播放什么。这些取决于播放器。把选好的故事放在大人不用翻完整个故事库也找得到的地方。
backup.note=想了解录音本身怎么做？我们的手机录音指南讲到了房间选择、简短试听和常见音频问题。如果你们已有顺手的睡前流程，就沿用它；备选故事只需融入其中。
product.eyebrow=正在准备登陆 iOS 和 Android
product.title=提前准备好家人熟悉的声音
product.body=Sleep2Story 正是为这种提前准备而开发。成年人在声音提供者同意的前提下录制一小段声音样本，并添加完整故事正文。应用会用选定的家人声音制作合成讲述音频，保存在个人故事库中供聆听。它不会替你写故事，也不会保存成年人逐字朗读原文的原始表演。
product.body2=应用尚未在商店上架。今晚请先使用手边已有的方式。Sleep2Story 是为未来的夜晚做准备，并不是疲惫或嗓子疼时立即见效的办法。
