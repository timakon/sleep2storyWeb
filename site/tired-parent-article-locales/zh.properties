faq.title=疲惫夜晚常见的问题
faq.1.question=今晚不讲睡前故事可以吗？
faq.1.answer=如果今晚实在读不动，可以照常说晚安，改天再读。短故事、一起看图或请别人读，都是选择，不是非完成不可的新任务。选适合你们家的方式就好。
faq.2.question=喉咙疼，可孩子坚持要我读，怎么办？
faq.2.answer=简单说说嗓子需要休息，或者请另一位成年人解释。可以一起看图、请别人读，或播放已有录音。说话不舒服时不必新录一段。对于症状，请遵照合适的医疗建议。
faq.3.question=音频睡前故事能代替大声朗读吗？
faq.3.answer=某个夜晚，它可以接过朗读的部分，但与一起讨论一本书的体验不同。成年人仍可以陪在身边，暂停音频、回应孩子。这是一种实用选择，并不意味着音频和共同阅读有完全相同的益处。
faq.4.question=没有现成录音怎么办？
faq.4.answer=就从手边已有的方式开始：说话舒服就读一本更短的书，或者看图、请另一位信任的成年人来读。不要把今晚变成新的录音任务。精力充足时，再准备一段保存好的故事。
faq.5.question=要不要答应明天讲更长的故事？
faq.5.answer=只答应你觉得自己做得到的事。“我们以后可以接着读这本书”，为明天的实际情况留了空间。简单诚实的结尾，比不知道明天精神如何却答应再讲三个故事，更容易兑现。
