hero.title=कहानी पढ़ने की ताकत नहीं बची?
hero.dek=किताब खुली है, बच्चा एक और कहानी चाहता है और आप ऊँची आवाज़ में पढ़ने की स्थिति में नहीं हैं। आज शाम के लिए यह छोटी योजना है, उन रातों के लिए भी जब बोलने में दर्द हो।
