figure.alt=खुली किताब और छोटी बिस्तर वाली लाइट के पास बच्चे के साथ बैठे थके अभिभावक की सुकून भरी तस्वीर
figure.caption=आज कहानी छोटी हो सकती है। साथ बिताया पल फिर भी आपका रहेगा।
intro.title=तय करें, किस बात को आसान करना है
intro.body1=कभी किताब बहुत लंबी लगती है। कभी पात्रों की आवाज़ें फिर बनाने का मन नहीं होता। और कभी गला दुखता है और पढ़ना ही मुश्किल है। इन शामों के हल अलग हैं। छोटी किताब थकान में मदद करती है; आराम माँगती आवाज़ को उससे आराम नहीं मिलता।
intro.body2=विकल्प देने से पहले तय करें कि आप सच में क्या कर सकते हैं। “ये दो पन्ने या हमारी सहेजी कहानी?” कहना “कुछ भी चुन लो” से आसान है। बच्चा इंतज़ार कर रहा हो तो बिल्कुल नई, परिपूर्ण कहानी खोजने की ज़रूरत नहीं। परिवार के पास पहले से मौजूद किताब, रिकॉर्डिंग या दूसरे वयस्क से शुरुआत करें।
tonight.kicker=जो उपलब्ध है, उसी से शुरू करें
tonight.title=आज रात की दिनचर्या में कहानी रखने के चार तरीके
tonight.lead=चारों आज़माने के बजाय एक विकल्प चुनें। बच्चा सोने को तैयार है तो सीधे रोज़ की शुभ रात्रि कह सकते हैं।
option.1.title=परिचित किताब का छोटा हिस्सा पढ़ें
option.1.body1=थके हैं, पर बोलना सहज है, तो एक छोटी कहानी, पसंदीदा दो पन्ने या एक अध्याय चुनें। शुरू करने से पहले बता दें कहाँ रुकेंगे। बुकमार्क लंबी कहानी को कल तक ठहरने की साफ़ जगह देता है।
option.1.body2=अपनी सामान्य आवाज़ में पढ़ें। कठिन पात्र-आवाज़ें और ध्वनि-अभिनय छोड़ सकते हैं। बच्चा और माँगे तो साफ़ अंत कहें: “आज की कहानी यहीं तक। कल इसी पन्ने से आगे पढ़ेंगे।” मात्रा आप दोनों के अनुकूल हो, किसी अच्छे माता-पिता की तय मिनट-गिनती के अनुसार नहीं।
option.2.title=चित्रों को कहानी आगे बढ़ाने दें
option.2.body1=बच्चे की परिचित किताब खोलें और उसे इशारा करने, पन्ना पलटने या जो दिख रहा है वह बताने दें। जो बच्चा अभी कहानी नहीं सुनाता, वह बस पसंदीदा चित्र चुन सकता है। आप मुस्कान या सिर हिलाकर जवाब दे सकते हैं; इसे पाठ बनाने की ज़रूरत नहीं।
option.2.body2=इतना पूछें: “दिखाओ, छोटा भालू कहाँ गया?” बोलना मुश्किल है तो इशारे और पन्ने ही काम करें। बच्चा बारी नहीं लेना चाहता तो दूसरा विकल्प चुनें। वयस्क की थकान के कारण बच्चे को पूरी किताब सुनाने का बोझ नहीं उठाना चाहिए।
option.3.title=पढ़ना किसी और को सौंपें, अंत स्पष्ट रखें
option.3.body1=दूसरा भरोसेमंद वयस्क उपलब्ध हो तो साफ़-साफ़ बताएं: यह किताब, ये पन्ने, फिर रोज़ की शुभ रात्रि। आपके परिवार में ठीक लगे तो पास बैठें या पूरी ज़िम्मेदारी उन्हें दें। उन्हें आपकी पढ़ने की शैली हूबहू दोहराने की ज़रूरत नहीं।
option.3.body2=समय और बच्चे का मूड ठीक हो तो रिश्तेदार को कॉल भी कर सकते हैं। पहले से एक कहानी तय करें। सीधी बातचीत उत्साहपूर्ण गपशप बन सकती है, इसलिए इसे विकल्प मानें, रात में ज़रूर आयोजित करने वाला काम नहीं। पहले से बनी रिकॉर्डिंग के लिए समय मिलाने की ज़रूरत नहीं।
option.4.title=पहले से चुनी ऑडियो कहानी चलाएँ
option.4.body1=परिवार की परिचित रिकॉर्डिंग या उम्र के अनुकूल ऑडियो कहानी आपके आराम करते समय पढ़ने का काम कर सकती है। ट्रैक खुद चुनें, उसकी शुरुआत और अंत जाँचें और प्लेयर अनुमति दे तो कहानी के बाद रुकने पर लगाएँ। आवाज़ का स्तर सहज रखें और डिवाइस व तार बच्चे की पहुँच से दूर रखें।
option.4.body2=ऑडियो चालू करके स्क्रीन अलग रख दें। बच्चा किताब चाहे तो रिकॉर्डिंग के साथ उसे देख सकता है। सवाल या मन बदलने पर उपलब्ध रहें। अगर आज ऑडियो से और हलचल हो, बंद करके शांत विकल्प लें। आज रात नया खाता बनाने या सुझावों में बहुत खोजने की ज़रूरत नहीं।
voice.title=गला दुखे तो पढ़ने की योजना बदलना ठीक है
voice.body1=आवाज़ बैठी या थकी हो तो उसे आराम दें; फुसफुसाना उसका विकल्प नहीं है। यह अमेरिकी National Institute on Deafness and Other Communication Disorders (NIDCD) की आवाज़ की देखभाल संबंधी सलाह है।
voice.link=NIDCD की आवाज़ की देखभाल वाली गाइड पढ़ें
voice.body2=कहानी के लिए बिना बोलने वाला विकल्प चुनें: दूसरा वयस्क, पहले से मौजूद रिकॉर्डिंग या साथ में चित्र देखना। आज नया आवाज़ नमूना रिकॉर्ड करना उसी आवाज़ से काम लेना होगा जिसे आप आराम देना चाहते हैं। इसे बाद में करें। यह लेख पढ़ने के विकल्प बताता है, निदान या उपचार नहीं; लक्षणों की चिंता हो या सुधार न आए तो चिकित्सकीय सलाह लें।
words.title=जब बच्चा आपकी आवाज़ माँगे तो क्या कहें
words.intro=लंबी बहस से अक्सर छोटी बात और एक विकल्प देना आसान होता है। नीचे कुछ उदाहरण हैं जिन्हें आप अपने ढंग से बदल सकते हैं; इन्हें बिल्कुल सही कहना ज़रूरी नहीं। बोलना दर्द देता है तो दूसरा वयस्क योजना समझा सकता है।
words.1.label=बहुत कम ऊर्जा हो
words.1.text=“आज मैं बहुत थक गया हूँ। हम ये दो पन्ने साथ पढ़ेंगे, फिर शुभ रात्रि कहेंगे।”
words.2.label=आवाज़ को आराम चाहिए
words.2.text=“मेरी आवाज़ को आराम चाहिए। कोई और पढ़े, तब तक हम साथ चित्र देख सकते हैं।”
words.3.label=सहेजी रिकॉर्डिंग हो
words.3.text=“आज हमारी रिकॉर्डिंग कहानी सुनाएगी। सुनते समय मैं तुम्हारे पास बैठूँगा।”
words.end=कोई विकल्प न जँचे तो किताब बंद करके रोज़ की तरह शुभ रात्रि कहें। कहानी दूसरे समय भी सुनाई जा सकती है। आज शाम पढ़ने के लिए सोचे हर मिनट का नया विकल्प भरना ज़रूरी नहीं।
backup.title=अच्छे दिन में छोटी कहानी का बैकअप तैयार करें
backup.lead=शुरुआत के लिए छोटी-सी सूची काफ़ी है, कोई नया बड़ा प्रोजेक्ट नहीं। जिस दिन ऊर्जा हो और आवाज़ सहज हो, अगले थके दिन को तीन कदमों से आसान बनाएँ।
backup.1.title=एक छोटी पसंदीदा कहानी चुनें जिसे रिकॉर्ड कर सकें
backup.1.body=अपनी कहानी या रिकॉर्ड करने और उपयोग करने की अनुमति मिला पाठ लें। परिचित शुरुआत और स्पष्ट अंत से बाद में चुनना आसान होगा। किताब लंबी हो तो एक बार में पूरी खत्म करने का वादा करने के बजाय अनुमत छोटा हिस्सा चुनें।
backup.2.title=रिकॉर्ड करें, सुनें और फ़ाइल को साफ़ नाम दें
backup.2.body=फ़ोन से रिकॉर्डिंग व्यावहारिक शुरुआत है। एक बार सुनकर देखें कि शब्द साफ़ हैं और अंत पूरा है। फ़ाइल नाम में कहानी और पढ़ने वाले का नाम रखें, मूल प्रति अपनी पहुँच वाली जगह पर रखें। परिवार का कोई और सदस्य रिकॉर्ड करे तो पहले तय करें उसकी आवाज़ और रिकॉर्डिंग कैसे उपयोग होगी।
backup.3.title=ज़रूरत पड़ने से पहले चलाकर जाँच लें
backup.3.body=उसी डिवाइस पर फ़ाइल खोलें जिससे रात में सुनाएँगे। देखें कि इंटरनेट चाहिए या नहीं, स्क्रीन अलग रखने पर ऑडियो चलता है या नहीं और बाद में क्या बजता है। यह प्लेयर पर निर्भर है। चुनी कहानी ऐसी जगह रखें जहाँ वयस्क पूरी लाइब्रेरी खंगाले बिना पा सके।
backup.note=रिकॉर्डिंग में मदद चाहिए? फ़ोन से रिकॉर्डिंग वाली हमारी गाइड कमरे, छोटी ध्वनि-जाँच और आम समस्याएँ समझाती है। आपकी दिनचर्या पहले से ठीक चल रही है तो उसी को रखें; इस बैकअप को बस उसमें फिट होना है।
product.eyebrow=iOS और Android के लिए तैयार किया जा रहा है
product.title=परिवार की परिचित आवाज़, पहले से तैयार
product.body=Sleep2Story इसी तरह की तैयारी के लिए विकसित हो रहा है। वयस्क बोलने वाले की सहमति से छोटा आवाज़ नमूना रिकॉर्ड करता है और कहानी का पूरा पाठ जोड़ता है। ऐप चुनी पारिवारिक आवाज़ में कृत्रिम कथन तैयार करता है, जिसे निजी लाइब्रेरी में सुना जा सके। यह कहानी खुद नहीं लिखता और उन शब्दों की वयस्क द्वारा की गई मूल पढ़ाई को सुरक्षित नहीं करता।
product.body2=ऐप अभी स्टोर में उपलब्ध नहीं है। आज रात पहले से उपलब्ध विकल्प चुनें। Sleep2Story भविष्य की शामों के लिए तैयार किया जा रहा है, थकी या दुखती आवाज़ का तुरंत इलाज नहीं।
