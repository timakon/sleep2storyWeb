faq.title=थकी शामों में उठने वाले सवाल
faq.1.question=क्या आज रात कहानी छोड़ देना ठीक है?
faq.1.answer=आज पढ़ना संभव नहीं तो शुभ रात्रि का परिचित ढंग रखें और किताब किसी दूसरे समय पढ़ें। छोटी कहानी, साथ में चित्र या दूसरा पाठक विकल्प हैं, नए अनिवार्य काम नहीं। अपने परिवार के लिए जो संभव हो वही चुनें।
faq.2.question=मेरा गला दुखता है, लेकिन बच्चा मुझसे ही पढ़ने को कहता है तो?
faq.2.answer=संक्षेप में बताएं कि आवाज़ को आराम चाहिए या दूसरे वयस्क से समझाने को कहें। चित्र, दूसरा पाठक या मौजूद रिकॉर्डिंग सुझाएँ। आवाज़ दुखती हो तो अभी नई रिकॉर्डिंग बनाना ज़रूरी नहीं। लक्षणों के लिए उचित चिकित्सकीय सलाह मानें।
faq.3.question=क्या ऑडियो कहानी सामने बैठकर पढ़ने की जगह ले सकती है?
faq.3.answer=किसी शाम ऑडियो कहानी सुना सकता है, लेकिन साथ बैठकर किताब पर बात करना अलग अनुभव है। वयस्क फिर भी पास रह सकता है, ऑडियो रोककर बच्चे को जवाब दे सकता है। यह व्यावहारिक विकल्प है, दोनों तरीकों के एक जैसे लाभ का दावा नहीं।
faq.4.question=अगर रिकॉर्डिंग तैयार नहीं है तो?
faq.4.answer=जो उपलब्ध है उससे शुरू करें: बोलना सहज हो तो छोटी किताब, साथ चित्र देखना या भरोसेमंद दूसरे पाठक की मदद। आज की रात को रिकॉर्डिंग का काम न बनाएँ। अधिक ऊर्जा होने पर एक कहानी तैयार कर सकते हैं।
faq.5.question=क्या कल लंबी कहानी का वादा करूँ?
faq.5.answer=केवल वही वादा करें जिसे पूरा करने की उम्मीद हो। “हम इस किताब पर फिर लौट सकते हैं” कल की स्थिति के लिए जगह छोड़ता है। यह सरल, सच्चा अंत, अनिश्चित तबीयत में तीन अतिरिक्त कहानियों का वादा करने से आसान है।
sources.title=स्रोत और दायरा
sources.body=व्यावहारिक उदाहरण और सुझाए वाक्य Sleep2Story संपादकीय टीम के सुझाव हैं। नीचे दिए स्रोत आवाज़ की देखभाल और रात की दिनचर्या की पृष्ठभूमि बताते हैं; वे यह साबित नहीं करते कि कोई खास ऐप बच्चे को सुलाता है।
