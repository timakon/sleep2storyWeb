answer.title=आज जितनी कहानी आप निभा सकें, उतनी ही चुनें।
answer.body=आवाज़ ठीक है तो पसंदीदा कहानी का छोटा हिस्सा पढ़ें या साथ में किताब के चित्र देखें। बोलना मुश्किल हो तो किसी भरोसेमंद वयस्क से पढ़वाएँ या पहले से मौजूद ऑडियो चलाएँ। परिचित शुभ रात्रि बनाए रखें; नई रिकॉर्डिंग उस दिन करें जब आवाज़ स्वस्थ लगे।
