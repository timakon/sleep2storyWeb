figure.alt=Тепла ілюстрація: втомлений дорослий поруч із дитиною, розгорнутою книжкою та невеликою лампою біля ліжка
figure.caption=Сьогодні казка може бути коротшою. Цей час однаково можна провести разом.
intro.title=Спершу з'ясуйте, що саме хочеться спростити
intro.body1=Іноді книжка просто задовга. Іноді зовсім не хочеться читати дітям: ви втомилися й уже не маєте сил знову озвучувати всіх героїв. А іноді болить горло й читати вголос неприємно. У таких ситуаціях потрібні різні рішення. Коротша книжка допоможе, коли ви втомилися, але не замінить відпочинку, якого потребує голос.
intro.body2=Перш ніж пропонувати вибір, вирішіть, що вам справді під силу. «Ці дві сторінки чи наш запис?» — домовленість, якої легше дотриматися, ніж «Обирай що завгодно». Не потрібно шукати ідеальну нову казку, поки дитина чекає. Почніть із того, що вже доступне вашій родині: книжки, запису чи допомоги іншого дорослого.
tonight.kicker=Почніть із того, що вже є
tonight.title=Чотири способи залишити казку в сьогоднішньому вечорі
tonight.lead=Оберіть один варіант: випробовувати всі чотири не потрібно. Якщо дитина вже готова завершувати, можна одразу перейти до звичного побажання на добраніч.
option.1.title=Прочитайте невеликий уривок знайомої книжки
option.1.body1=Якщо ви втомилися, але говорити комфортно, оберіть одну коротку казку, дві улюблені сторінки або один розділ. Перед читанням скажіть, де зупинитеся. У довгій історії залиште закладку: завтра буде зрозуміло, звідки продовжувати.
option.1.body2=Читайте звичайним голосом. Складні голоси персонажів і звукові ефекти можна пропустити. Якщо дитина просить ще, спокійно позначте завершення: «На сьогодні казка закінчилася. Завтра можемо продовжити з цієї сторінки». Обсяг читання має підходити вам обом, а не правилу про те, скільки хвилин читають хороші батьки.
option.2.title=Роздивіться малюнки разом
option.2.body1=Розгорніть знайому дитині книжку й запропонуйте щось показати, перегорнути сторінку або розповісти, що вона помітила. Малюк, який поки не розповідає історій, може просто обрати улюблений малюнок. Ви можете слухати й відповідати усмішкою чи кивком. Перетворювати це на урок не потрібно.
option.2.body2=Почніть із простого: «Покажи, куди пішло ведмежа». Якщо говорити неприємно, можна мовчки показувати малюнки й гортати сторінки. Якщо дитина не хоче розповідати, оберіть інший варіант. Вона не мусить переказувати всю книжку лише тому, що дорослий втомився.
option.3.title=Попросіть іншого дорослого прочитати до домовленого місця
option.3.body1=Якщо поруч є дорослий, якому ви довіряєте, попросіть про конкретну допомогу: ось ця книжка, ось ці сторінки, потім звичне «на добраніч». Ви можете лишитися поблизу або доручити йому вкладання — як зручніше вашій родині. Точно відтворювати вашу манеру читання не потрібно.
option.3.body2=Ще один варіант — попросити когось із рідних прочитати казку під час дзвінка, якщо час і настрій дитини дозволяють. Заздалегідь домовтеся про одну історію. Жива розмова може перетворитися на жвавий обмін новинами, тож дзвінок — це можливість, а не обов'язковий пункт перед сном. А для запису, підготовленого раніше, не доведеться підлаштовуватися під інший часовий пояс.
option.4.title=Увімкніть аудіоказку, яку вже обрали
option.4.body1=Знайомий родинний запис або аудіоказка за віком може прочитати історію, поки ви відпочиваєте. Самі оберіть доріжку, перевірте початок і кінець та, якщо програвач дозволяє, налаштуйте зупинку після казки. Зробіть гучність комфортною, а пристрій і дроти розмістіть так, щоб дитина не могла до них дотягнутися.
option.4.body2=Запустіть аудіо й відкладіть екран. Якщо дитині потрібна книжка, вона може роздивлятися її під час слухання. Будьте поруч або напохваті, щоб відповісти на запитання чи допомогти, якщо дитина передумає. Якщо саме цього вечора аудіо лише додає метушні, вимкніть його й оберіть щось тихіше. Створювати новий обліковий запис і довго гортати рекомендації сьогодні не потрібно.
voice.title=Болить горло — можна змінити план читання
voice.body1=Якщо голос захрип або втомився, дайте йому відпочити; переходити натомість на шепіт не варто. Такі поради щодо догляду за голосом надає Національний інститут глухоти та інших розладів комунікації США (NIDCD).
voice.link=Поради NIDCD щодо догляду за голосом
voice.body2=Оберіть варіант, за якого вам не потрібно говорити: читання іншого дорослого, готовий запис або спільне розглядання малюнків. Записуючи новий зразок голосу сьогодні, ви знову навантажуєте голос, якому потрібен відпочинок. Зробіть це пізніше. У цій статті зібрано заміни читанню, а не способи встановити діагноз чи лікуватися; зверніться до лікаря, якщо симптоми вас непокоять або не минають.
words.title=Що сказати, коли дитина хоче чути саме ваш голос
words.intro=Коротке пояснення та зрозумілий вибір зазвичай простіші за довгі перемовини. Нижче — приклади, які можна змінити під себе, а не слова, які ви мусите повторити дослівно. Якщо говорити боляче, пояснити план може інший дорослий.
words.1.label=Якщо сил майже не лишилося
words.1.text=«Сьогодні в мене зовсім мало сил. Давай прочитаємо разом ці дві сторінки, а потім побажаємо одне одному на добраніч».
words.2.label=Якщо голосу потрібен відпочинок
words.2.text=«Моєму голосу потрібно відпочити. Ми можемо разом дивитися малюнки, поки нам читає хтось інший».
words.3.label=Якщо маєте збережений запис
words.3.text=«Сьогодні послухаємо нашу казку в записі. Я можу посидіти з тобою, поки вона звучить».
words.end=Якщо жоден варіант не підійшов, закрийте книжку й побажайте на добраніч, як зазвичай. Казку можна запропонувати в інший час. Не обов'язково вигадувати нове заняття на кожну хвилину, яку ви збиралися присвятити читанню.
backup.title=Коли матимете сили, підготуйте невеликий запас казок
backup.lead=Для початку достатньо маленької добірки. Ще один великий проєкт вам не потрібен. У день, коли матимете сили й говоритимете без напруження, зробіть три кроки, щоб підготуватися до вечора, коли знову забракне сил.
backup.1.title=Оберіть коротку улюблену історію, яку можна записати
backup.1.body=Візьміть власну казку або текст, який вам дозволено записувати й використовувати. Знайомий початок і зрозумілий фінал допоможуть швидко обрати історію в потрібний вечір. Якщо книжка довга, підберіть короткий уривок, на запис якого маєте дозвіл, замість обіцянки прочитати все за один раз.
backup.2.title=Запишіть, послухайте й дайте файлу зрозумілу назву
backup.2.body=Почати можна зі звичайного запису на телефон. Послухайте його один раз: слова мають бути розбірливими, а кінець — не обрізаним. Додайте до назви файлу назву казки та ім'я того, хто читає, і збережіть оригінал там, де самі керуєте доступом. Якщо записує хтось із родини, заздалегідь домовтеся, як використовуватимуть його голос і запис.
backup.3.title=Завчасно перевірте, як відтворюється запис
backup.3.body=Відкрийте запис на пристрої, з якого вмикатимете казку перед сном. Перевірте, чи потрібен інтернет, чи триває звук із вимкненим екраном і що вмикається після завершення. Усе це залежить від програвача. Збережіть обрану історію так, щоб дорослий міг знайти її без перегляду всієї бібліотеки.
backup.note=Потрібна допомога із самим записом? У наших порадах щодо запису на телефон ідеться про вибір кімнати, коротку перевірку звуку та типові неполадки. Якщо вечірній ритуал уже вам підходить, збережіть його: запасна казка має просто в нього вписатися.
product.eyebrow=Готується для iOS та Android
product.title=Знайомий родинний голос, підготовлений заздалегідь
product.body=Sleep2Story створюється для такої підготовки. Дорослий записує короткий зразок голосу за згодою людини, якій він належить, і додає повний текст казки. Застосунок готує синтетичне озвучення обраним голосом близької людини для слухання в особистій бібліотеці. Він не вигадує казку й не зберігає справжнє читання саме цих слів.
product.body2=Застосунок поки недоступний у магазинах. На старті планується озвучення англійською та російською; переклад сторінки сайту не означає, що озвучення цією мовою вже доступне. Для сьогоднішнього вечора оберіть те, що вже маєте. Sleep2Story — один зі способів підготуватися до майбутніх вечорів, а не негайна допомога втомленому голосу чи хворому горлу.
product.cta=Подивитися, як працює Sleep2Story
