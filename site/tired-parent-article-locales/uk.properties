faq.title=Про що запитують батьки, коли надвечір бракує сил
faq.1.question=Чи можна сьогодні обійтися без казки на ніч?
faq.1.answer=Якщо сьогодні на читання бракує сил, можна зберегти звичне «на добраніч» і запропонувати книжку в інший час. Коротша казка, малюнки чи допомога іншого дорослого — це варіанти, а не додаткові обов'язки. Оберіть те, що зараз під силу вашій родині.
faq.2.question=Що робити, якщо болить горло, а дитина просить прочитати казку?
faq.2.answer=Коротко поясніть, що голосу потрібен відпочинок, або попросіть про це іншого дорослого. Запропонуйте роздивитися малюнки, послухати іншого дорослого чи готовий запис. Не потрібно записувати нову казку, коли говорити неприємно. Дотримуйтеся медичних рекомендацій, які стосуються ваших симптомів.
faq.3.question=Чи може аудіоказка замінити читання вголос перед сном?
faq.3.answer=В окремий вечір запис може прочитати казку за вас, але це інший досвід, ніж спільне обговорення книжки. Дорослий може лишатися поруч, ставити доріжку на паузу й відповідати дитині. Це практичний варіант, а не твердження, що аудіо та спільне читання мають однакову користь.
faq.4.question=Що робити, якщо готового запису немає?
faq.4.answer=Почніть із того, що є: коротшої книжки, якщо говорити комфортно, розглядання малюнків або допомоги іншого дорослого, якому довіряєте. Не перетворюйте сьогоднішній вечір на сеанс запису. Одну казку про запас можна записати, коли сил буде більше.
faq.5.question=Чи варто обіцяти завтра довшу казку?
faq.5.answer=Обіцяйте лише те, що, найімовірніше, зможете виконати. «Ми можемо повернутися до цієї книжки» залишає місце для того, як складеться завтрашній день. Чесно завершити читання зараз простіше, ніж пообіцяти три додаткові казки, не знаючи, як ви почуватиметеся.
sources.title=Джерела та межі рекомендацій
sources.body=Практичні приклади та варіанти фраз запропоновані редакцією Sleep2Story. Джерела нижче дають загальну інформацію про догляд за голосом і вечірні ритуали; вони не доводять, що певний застосунок допомагає дитині заснути.
