meta.title=Немає сил читати казку на ніч? Що робити сьогодні | Sleep2Story
meta.description=Немає сил читати казку на ніч чи болить горло? Коротка історія, інший дорослий або готовий запис: прості варіанти на сьогодні й підготовка на майбутнє.
meta.og_title=Немає сил читати казку на ніч? План на цей вечір
meta.og_description=Що обрати, коли ви втомилися: короткий уривок, малюнки в книжці, допомогу іншого дорослого або запис, зроблений заздалегідь.
meta.twitter_description=Казка на ніч, коли сил майже не лишилося: що спробувати сьогодні, як пояснити дитині та що підготувати в інший день.
schema.description=Практичні поради для вечора, коли батькам бракує сил читати вголос або голосу потрібен відпочинок: чим замінити читання та як підготувати записи на майбутнє.
hero.eyebrow=Втомленим батькам · поради 04
hero.title=Немає сил читати казку на ніч?
hero.dek=Книжку розгорнуто, дитина просить ще одну казку, а сил читати вголос уже зовсім не лишилося. Ось невеликий план на цей вечір — зокрема й на випадок, коли говорити боляче.
