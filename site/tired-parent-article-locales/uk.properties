answer.title=Оберіть такий спосіб побути з казкою, на який сьогодні вистачить сил.
answer.body=Якщо говорити комфортно, прочитайте коротку улюблену історію або погортайте книжку разом. Якщо голосу потрібен відпочинок, попросіть іншого близького дорослого почитати або ввімкніть аудіо, яке вже маєте. Збережіть звичне «на добраніч», а нову казку запишіть у день, коли знову зможете говорити без напруження.
