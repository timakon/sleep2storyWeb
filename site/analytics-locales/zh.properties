analytics.title=允许使用网站分析吗？
analytics.body=Google Analytics 帮助我们了解访客从哪里来、阅读哪些页面。只有你同意后才会启用。
analytics.details=查看详情
analytics.explanation=如果你同意，浏览器会向 Google 发送访问、网站互动及设备相关信息，其中包括 Cookie 标识符。分析 Cookie 和你的选择最多保存 180 天。广告功能已关闭。如果拒绝，网站不会加载 Google Analytics。语言偏好 Cookie 独立运行。你可以随时通过页脚的“分析设置”更改选择。
analytics.google=Google 如何使用这些信息
analytics.accept=允许
analytics.reject=拒绝
analytics.settings=分析设置
