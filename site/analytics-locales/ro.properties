analytics.title=Permiți analiza?
analytics.body=Google Analytics ne ajută să aflăm de unde vin vizitatorii și ce pagini citesc. Analiza rămâne dezactivată fără acordul tău.
analytics.details=Detalii
analytics.explanation=Dacă accepți, browserul tău trimite către Google informații despre vizitele tale, interacțiunile pe site și dispozitivul tău, inclusiv un identificator de cookie. Cookie-urile de analiză și alegerea ta sunt păstrate până la 180 de zile. Funcțiile de publicitate sunt dezactivate. Dacă refuzi, Google Analytics nu se încarcă. Cookie-ul pentru preferința de limbă funcționează separat. Îți poți schimba alegerea oricând din „Setări de analiză” în subsolul paginii.
analytics.google=Cum folosește Google aceste informații
analytics.accept=Permite
analytics.reject=Refuză
analytics.settings=Setări de analiză
