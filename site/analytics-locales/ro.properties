analytics.title=Ajută-ne să înțelegem cum ne găsești
analytics.body=Cu permisiunea ta, Sleep2Story folosește Google Analytics pentru a înțelege sursele de trafic, paginile vizitate și interacțiunile pe site. Cookie-urile de analiză sunt opționale; îți poți schimba alegerea mai jos în orice moment.
analytics.details=Despre analiză
analytics.explanation=Dacă accepți, browserul tău trimite către Google informații despre vizitele și dispozitivul tău, inclusiv un identificator de cookie. Cookie-urile de analiză și alegerea ta sunt păstrate până la 180 de zile. Dezactivăm funcțiile de publicitate. Dacă refuzi, Google Analytics nu se încarcă. Cookie-ul pentru preferința de limbă funcționează separat.
analytics.google=Cum folosește Google aceste informații
analytics.accept=Permite analiza
analytics.reject=Refuză analiza
analytics.settings=Setări de analiză
