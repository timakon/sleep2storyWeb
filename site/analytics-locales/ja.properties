analytics.title=アクセス解析を許可しますか？
analytics.body=Google アナリティクスを使うと、訪問者がどこから来て、どのページを読んでいるかを確認できます。許可するまで有効になりません。
analytics.details=詳細
analytics.explanation=許可すると、ブラウザーから Google に、訪問、サイト内での操作、端末に関する情報（Cookie 識別子を含む）が送信されます。解析用 Cookie と選択結果は最長180日間保存されます。広告機能は無効です。拒否した場合、Google アナリティクスは読み込まれません。言語設定用 Cookie は別に機能します。フッターの「アクセス解析の設定」からいつでも変更できます。
analytics.google=Google による情報の利用方法
analytics.accept=許可する
analytics.reject=拒否する
analytics.settings=アクセス解析の設定
