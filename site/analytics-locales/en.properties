analytics.title=Help us understand what brings you here
analytics.body=With your permission, Sleep2Story uses Google Analytics to understand traffic sources, pages viewed and site interactions. Analytics cookies are optional; you can change your choice below at any time.
analytics.details=About analytics
analytics.explanation=If you accept, your browser sends Google information about your visits and device, including a cookie identifier. Analytics cookies and your choice are kept for up to 180 days. We disable advertising features. If you decline, Google Analytics is not loaded. The language preference cookie works separately.
