analytics.title=Allow analytics?
analytics.body=Google Analytics helps us see where visitors come from and which pages they read. It stays off unless you allow it.
analytics.details=Details
analytics.explanation=If you accept, your browser sends Google information about your visits, site interactions and device, including a cookie identifier. Analytics cookies and your choice are kept for up to 180 days. Advertising features are disabled. If you decline, Google Analytics is not loaded. The language preference cookie works separately. You can change your choice anytime through “Analytics settings” in the footer.
analytics.google=How Google uses this information
analytics.accept=Allow
analytics.reject=Reject
analytics.settings=Analytics settings
