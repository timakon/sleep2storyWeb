analytics.title=Bizi nasıl bulduğunuzu anlamamıza yardımcı olun
analytics.body=Sleep2Story, izninizle trafik kaynaklarını, görüntülenen sayfaları ve site etkileşimlerini anlamak için Google Analytics kullanır. Analiz çerezleri isteğe bağlıdır; seçiminizi aşağıdan istediğiniz zaman değiştirebilirsiniz.
analytics.details=Analiz hakkında
analytics.explanation=Kabul ederseniz tarayıcınız, çerez tanımlayıcısı da dahil olmak üzere ziyaretleriniz ve cihazınız hakkında Google’a bilgi gönderir. Analiz çerezleri ve seçiminiz en fazla 180 gün saklanır. Reklam özelliklerini devre dışı bırakıyoruz. Reddederseniz Google Analytics yüklenmez. Dil tercihi çerezi bağımsız olarak çalışır.
analytics.google=Google bu bilgileri nasıl kullanır?
analytics.accept=Analize izin ver
analytics.reject=Analizi reddet
analytics.settings=Analiz ayarları
