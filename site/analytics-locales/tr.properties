analytics.title=Analize izin verilsin mi?
analytics.body=Google Analytics, ziyaretçilerin nereden geldiğini ve hangi sayfaları okuduğunu anlamamıza yardımcı olur. Siz izin verene kadar analiz kapalı kalır.
analytics.details=Ayrıntılar
analytics.explanation=Kabul ederseniz tarayıcınız, çerez tanımlayıcısı da dahil olmak üzere ziyaretleriniz, site etkileşimleriniz ve cihazınız hakkında Google’a bilgi gönderir. Analiz çerezleri ve seçiminiz en fazla 180 gün saklanır. Reklam özellikleri devre dışıdır. Reddederseniz Google Analytics yüklenmez. Dil tercihi çerezi bağımsız olarak çalışır. Seçiminizi istediğiniz zaman sayfanın altındaki “Analiz ayarları” üzerinden değiştirebilirsiniz.
analytics.google=Google bu bilgileri nasıl kullanır?
analytics.accept=İzin ver
analytics.reject=Reddet
analytics.settings=Analiz ayarları
