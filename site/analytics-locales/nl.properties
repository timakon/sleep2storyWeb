analytics.title=Analyse toestaan?
analytics.body=Google Analytics laat ons zien waar bezoekers vandaan komen en welke pagina’s ze lezen. De analyse blijft uit zonder jouw toestemming.
analytics.details=Details
analytics.explanation=Als je akkoord gaat, stuurt je browser Google informatie over je bezoeken, interacties op de site en je apparaat, waaronder een cookie-ID. Analysecookies en je keuze worden maximaal 180 dagen bewaard. Advertentiefuncties zijn uitgeschakeld. Als je weigert, wordt Google Analytics niet geladen. De cookie voor je taalvoorkeur werkt los hiervan. Je kunt je keuze op elk moment wijzigen via ‘Analyse-instellingen’ onderaan de pagina.
analytics.google=Hoe Google deze informatie gebruikt
analytics.accept=Toestaan
analytics.reject=Weigeren
analytics.settings=Analyse-instellingen
