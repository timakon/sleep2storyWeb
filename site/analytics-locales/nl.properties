analytics.title=Help ons begrijpen hoe je ons vindt
analytics.body=Met jouw toestemming gebruikt Sleep2Story Google Analytics om inzicht te krijgen in verkeersbronnen, bekeken pagina’s en interacties op de site. Analysecookies zijn optioneel; je kunt je keuze hieronder op elk moment wijzigen.
analytics.details=Over de analyse
analytics.explanation=Als je akkoord gaat, stuurt je browser Google informatie over je bezoeken en je apparaat, waaronder een cookie-ID. Analysecookies en je keuze worden maximaal 180 dagen bewaard. We schakelen advertentiefuncties uit. Als je weigert, wordt Google Analytics niet geladen. De cookie voor je taalvoorkeur werkt los hiervan.
analytics.google=Hoe Google deze informatie gebruikt
analytics.accept=Analyse toestaan
analytics.reject=Analyse weigeren
analytics.settings=Analyse-instellingen
