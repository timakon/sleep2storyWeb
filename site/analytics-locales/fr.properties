analytics.title=Aidez-nous à comprendre comment vous nous trouvez
analytics.body=Avec votre accord, Sleep2Story utilise Google Analytics pour comprendre les sources de trafic, les pages consultées et les interactions sur le site. Les cookies d’analyse sont facultatifs ; vous pouvez modifier votre choix ci-dessous à tout moment.
analytics.details=À propos de l’analyse
analytics.explanation=Si vous acceptez, votre navigateur transmet à Google des informations sur vos visites et votre appareil, notamment un identifiant de cookie. Les cookies d’analyse et votre choix sont conservés jusqu’à 180 jours. Nous désactivons les fonctionnalités publicitaires. Si vous refusez, Google Analytics n’est pas chargé. Le cookie de préférence linguistique fonctionne séparément.
analytics.google=Comment Google utilise ces informations
analytics.accept=Autoriser l’analyse
analytics.reject=Refuser l’analyse
analytics.settings=Paramètres d’analyse
