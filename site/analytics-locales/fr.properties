analytics.title=Autoriser l’analyse ?
analytics.body=Google Analytics nous aide à savoir d’où viennent les visiteurs et quelles pages ils lisent. L’analyse reste désactivée sans votre accord.
analytics.details=Détails
analytics.explanation=Si vous acceptez, votre navigateur transmet à Google des informations sur vos visites, vos interactions sur le site et votre appareil, notamment un identifiant de cookie. Les cookies d’analyse et votre choix sont conservés jusqu’à 180 jours. Les fonctionnalités publicitaires sont désactivées. Si vous refusez, Google Analytics n’est pas chargé. Le cookie de préférence linguistique fonctionne séparément. Vous pouvez modifier votre choix à tout moment via « Paramètres d’analyse » en bas de page.
analytics.google=Comment Google utilise ces informations
analytics.accept=Autoriser
analytics.reject=Refuser
analytics.settings=Paramètres d’analyse
