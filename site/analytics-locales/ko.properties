analytics.title=방문 분석을 허용할까요?
analytics.body=Google Analytics를 사용하면 방문자가 어디에서 왔고 어떤 페이지를 읽는지 알 수 있습니다. 허용하기 전에는 작동하지 않습니다.
analytics.details=자세히 보기
analytics.explanation=허용하면 브라우저가 쿠키 식별자를 포함한 방문 정보, 사이트 이용 정보, 기기 정보를 Google에 보냅니다. 분석 쿠키와 선택 기록은 최대 180일 동안 보관됩니다. 광고 기능은 꺼져 있습니다. 거부하면 Google Analytics는 로드되지 않습니다. 언어 설정 쿠키는 별도로 작동합니다. 바닥글의 ‘분석 설정’에서 언제든 선택을 바꿀 수 있습니다.
analytics.google=Google의 정보 사용 방식
analytics.accept=허용
analytics.reject=거부
analytics.settings=분석 설정
