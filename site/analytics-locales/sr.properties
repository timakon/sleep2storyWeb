analytics.title=Pomozite nam da razumemo kako nas pronalazite
analytics.body=Uz vašu dozvolu, Sleep2Story koristi Google Analytics da sazna odakle dolaze posetioci, koje stranice pregledaju i kako koriste sajt. Analitički kolačići nisu obavezni; svoj izbor možete promeniti ispod u bilo kom trenutku.
analytics.details=O analitici
analytics.explanation=Ako prihvatite, vaš pregledač šalje Google-u podatke o vašim posetama i uređaju, uključujući identifikator kolačića. Analitički kolačići i vaš izbor čuvaju se do 180 dana. Isključujemo funkcije oglašavanja. Ako odbijete, Google Analytics se ne učitava. Kolačić za izbor jezika radi nezavisno od toga.
analytics.google=Kako Google koristi ove podatke
analytics.accept=Dozvoli analitiku
analytics.reject=Odbij analitiku
analytics.settings=Podešavanja analitike
