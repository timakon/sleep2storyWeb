analytics.title=Dozvoliti analitiku?
analytics.body=Google Analytics nam pomaže da saznamo odakle dolaze posetioci i koje stranice čitaju. Analitika ostaje isključena bez vaše dozvole.
analytics.details=Detalji
analytics.explanation=Ako prihvatite, vaš pregledač šalje Google-u podatke o vašim posetama, interakcijama na sajtu i uređaju, uključujući identifikator kolačića. Analitički kolačići i vaš izbor čuvaju se do 180 dana. Funkcije oglašavanja su isključene. Ako odbijete, Google Analytics se ne učitava. Kolačić za izbor jezika radi nezavisno od toga. Svoj izbor možete promeniti u bilo kom trenutku preko opcije „Podešavanja analitike“ u podnožju stranice.
