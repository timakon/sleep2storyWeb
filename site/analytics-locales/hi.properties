analytics.title=क्या एनालिटिक्स की अनुमति दें?
analytics.body=Google Analytics से हमें पता चलता है कि लोग कहाँ से आते हैं और कौन-से पेज पढ़ते हैं। आपकी अनुमति के बिना यह चालू नहीं होगा।
analytics.details=विवरण
analytics.explanation=यदि आप अनुमति देते हैं, तो आपका ब्राउज़र Google को आपकी विज़िट, साइट पर की गई गतिविधियों और डिवाइस की जानकारी भेजेगा, जिसमें कुकी पहचानकर्ता भी शामिल है। एनालिटिक्स कुकी और आपकी पसंद अधिकतम 180 दिनों तक रखी जाती हैं। विज्ञापन संबंधी सुविधाएँ बंद हैं। मना करने पर Google Analytics लोड नहीं होगा। भाषा की पसंद वाली कुकी अलग से काम करती है। आप फ़ुटर में “एनालिटिक्स सेटिंग” से कभी भी अपनी पसंद बदल सकते हैं।
analytics.google=Google इस जानकारी का उपयोग कैसे करता है
analytics.accept=अनुमति दें
analytics.reject=अस्वीकार करें
analytics.settings=एनालिटिक्स सेटिंग
