analytics.title=Helfen Sie uns zu verstehen, wie Sie uns finden
analytics.body=Mit Ihrer Erlaubnis nutzt Sleep2Story Google Analytics, um Zugriffsquellen, aufgerufene Seiten und Interaktionen auf der Website zu verstehen. Analyse-Cookies sind optional; Sie können Ihre Auswahl unten jederzeit ändern.
analytics.details=Über die Analyse
analytics.explanation=Wenn Sie zustimmen, sendet Ihr Browser Google Informationen über Ihre Besuche und Ihr Gerät, einschließlich einer Cookie-Kennung. Analyse-Cookies und Ihre Auswahl werden bis zu 180 Tage gespeichert. Wir deaktivieren Werbefunktionen. Wenn Sie ablehnen, wird Google Analytics nicht geladen. Das Cookie für Ihre Sprachauswahl funktioniert unabhängig davon.
analytics.google=So verwendet Google diese Informationen
analytics.accept=Analyse erlauben
analytics.reject=Analyse ablehnen
analytics.settings=Analyseeinstellungen
