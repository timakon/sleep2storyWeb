analytics.title=Analyse erlauben?
analytics.body=Google Analytics zeigt uns, woher Besucher kommen und welche Seiten sie lesen. Ohne Ihre Zustimmung bleibt die Analyse ausgeschaltet.
analytics.details=Details
analytics.explanation=Wenn Sie zustimmen, sendet Ihr Browser Google Informationen über Ihre Besuche, Interaktionen auf der Website und Ihr Gerät, einschließlich einer Cookie-Kennung. Analyse-Cookies und Ihre Auswahl werden bis zu 180 Tage gespeichert. Werbefunktionen sind deaktiviert. Wenn Sie ablehnen, wird Google Analytics nicht geladen. Das Cookie für Ihre Sprachauswahl funktioniert unabhängig davon. Sie können Ihre Auswahl jederzeit über „Analyseeinstellungen“ in der Fußzeile ändern.
analytics.google=So verwendet Google diese Informationen
analytics.accept=Erlauben
analytics.reject=Ablehnen
analytics.settings=Analyseeinstellungen
