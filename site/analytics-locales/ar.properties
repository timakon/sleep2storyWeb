analytics.title=هل تسمح باستخدام التحليلات؟
analytics.body=تساعدنا Google Analytics على معرفة مصدر الزوار والصفحات التي يقرؤونها. لن تُفعَّل إلا بموافقتك.
analytics.details=التفاصيل
analytics.explanation=إذا وافقت، يرسل متصفحك إلى Google معلومات عن زياراتك وتفاعلك مع الموقع وجهازك، بما فيها معرّف ملف تعريف الارتباط. تُحفَظ ملفات تعريف الارتباط الخاصة بالتحليلات وخيارك لمدة تصل إلى 180 يومًا. ميزات الإعلان معطّلة. إذا رفضت، فلن تُحمَّل Google Analytics. يعمل ملف تعريف الارتباط الخاص بتفضيل اللغة بصورة منفصلة. يمكنك تغيير قرارك في أي وقت من خلال «إعدادات التحليلات» أسفل الصفحة.
analytics.google=كيف تستخدم Google هذه المعلومات
analytics.accept=السماح
analytics.reject=رفض
analytics.settings=إعدادات التحليلات
