analytics.title=Aiutaci a capire come ci trovi
analytics.body=Con il tuo permesso, Sleep2Story usa Google Analytics per conoscere le fonti di traffico, le pagine visitate e le interazioni sul sito. I cookie di analisi sono facoltativi; puoi cambiare la tua scelta qui sotto in qualsiasi momento.
analytics.details=Informazioni sull’analisi
analytics.explanation=Se accetti, il tuo browser invia a Google informazioni sulle tue visite e sul tuo dispositivo, incluso un identificatore del cookie. I cookie di analisi e la tua scelta vengono conservati per un massimo di 180 giorni. Disattiviamo le funzionalità pubblicitarie. Se rifiuti, Google Analytics non viene caricato. Il cookie per la preferenza di lingua funziona separatamente.
analytics.google=Come Google usa queste informazioni
analytics.accept=Consenti l’analisi
analytics.reject=Rifiuta l’analisi
analytics.settings=Impostazioni di analisi
