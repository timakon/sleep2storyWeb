analytics.title=Consentire l’analisi?
analytics.body=Google Analytics ci aiuta a capire da dove arrivano i visitatori e quali pagine leggono. L’analisi resta disattivata senza il tuo consenso.
analytics.details=Dettagli
analytics.explanation=Se accetti, il tuo browser invia a Google informazioni sulle tue visite, sulle interazioni sul sito e sul tuo dispositivo, incluso un identificatore del cookie. I cookie di analisi e la tua scelta vengono conservati per un massimo di 180 giorni. Le funzionalità pubblicitarie sono disattivate. Se rifiuti, Google Analytics non viene caricato. Il cookie per la preferenza di lingua funziona separatamente. Puoi cambiare la tua scelta in qualsiasi momento da «Impostazioni di analisi» a fondo pagina.
analytics.google=Come Google usa queste informazioni
analytics.accept=Consenti
analytics.reject=Rifiuta
analytics.settings=Impostazioni di analisi
