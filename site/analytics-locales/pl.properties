analytics.title=Zezwolić na analitykę?
analytics.body=Google Analytics pokazuje, skąd przychodzą odwiedzający i które strony czytają. Bez Twojej zgody jest wyłączone.
analytics.details=Szczegóły
analytics.explanation=Jeśli wyrazisz zgodę, Twoja przeglądarka będzie wysyłać Google informacje o wizytach, działaniach w witrynie i urządzeniu, w tym identyfikator pliku cookie. Analityczne pliki cookie i Twój wybór są przechowywane przez maksymalnie 180 dni. Funkcje reklamowe są wyłączone. Jeśli odmówisz, Google Analytics nie zostanie załadowane. Plik cookie z ustawieniem języka działa niezależnie. Swój wybór możesz zmienić w każdej chwili przez „Ustawienia analityki” w stopce.
analytics.google=Jak Google wykorzystuje te informacje
analytics.accept=Zezwól
analytics.reject=Odrzuć
