analytics.title=Pomóż nam zrozumieć, jak do nas trafiasz
analytics.body=Za Twoją zgodą Sleep2Story korzysta z Google Analytics, aby poznawać źródła ruchu, wyświetlane strony i działania w witrynie. Analityczne pliki cookie są opcjonalne; poniżej możesz w każdej chwili zmienić swój wybór.
analytics.details=O analityce
analytics.explanation=Jeśli wyrazisz zgodę, Twoja przeglądarka będzie wysyłać Google informacje o wizytach i urządzeniu, w tym identyfikator pliku cookie. Analityczne pliki cookie i Twój wybór są przechowywane przez maksymalnie 180 dni. Wyłączamy funkcje reklamowe. Jeśli odmówisz, Google Analytics nie zostanie załadowane. Plik cookie z ustawieniem języka działa niezależnie.
analytics.google=Jak Google wykorzystuje te informacje
analytics.accept=Zezwól na analitykę
analytics.reject=Odrzuć analitykę
analytics.settings=Ustawienia analityki
