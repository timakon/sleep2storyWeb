analytics.title=Povolit analytiku?
analytics.body=Google Analytics nám pomáhá zjistit, odkud návštěvníci přicházejí a které stránky čtou. Bez vašeho souhlasu zůstává analytika vypnutá.
analytics.details=Podrobnosti
analytics.explanation=Pokud souhlasíte, váš prohlížeč odesílá Googlu informace o vašich návštěvách, interakcích na webu a zařízení, včetně identifikátoru cookie. Analytické cookies a vaše volba se uchovávají po dobu až 180 dnů. Reklamní funkce jsou vypnuté. Pokud odmítnete, Google Analytics se nenačte. Cookie pro volbu jazyka funguje samostatně. Svou volbu můžete kdykoli změnit přes „Nastavení analytiky“ v zápatí.
analytics.google=Jak Google tyto informace používá
analytics.accept=Povolit
analytics.reject=Odmítnout
analytics.settings=Nastavení analytiky
