analytics.title=Pomozte nám pochopit, jak nás nacházíte
analytics.body=S vaším svolením používá Sleep2Story Google Analytics ke sledování zdrojů návštěvnosti, zobrazených stránek a interakcí na webu. Analytické cookies jsou volitelné; svou volbu můžete níže kdykoli změnit.
analytics.details=O analytice
analytics.explanation=Pokud souhlasíte, váš prohlížeč odesílá Googlu informace o vašich návštěvách a zařízení, včetně identifikátoru cookie. Analytické cookies a vaše volba se uchovávají po dobu až 180 dnů. Reklamní funkce vypínáme. Pokud odmítnete, Google Analytics se nenačte. Cookie pro volbu jazyka funguje samostatně.
