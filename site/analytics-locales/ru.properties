analytics.title=Разрешить аналитику?
analytics.body=Google Analytics помогает понять, откуда приходят посетители и какие страницы читают. Без вашего согласия аналитика выключена.
analytics.details=Подробнее
analytics.explanation=Если вы согласитесь, ваш браузер отправит Google сведения о посещениях, действиях на сайте и устройстве, включая идентификатор cookie. Аналитические cookie и ваш выбор хранятся до 180 дней. Рекламные функции отключены. Если вы откажетесь, Google Analytics не будет загружаться. Cookie с настройкой языка работает отдельно. Изменить выбор можно в любой момент через «Настройки аналитики» внизу страницы.
analytics.google=Как Google использует эти сведения
analytics.accept=Разрешить
analytics.reject=Отказаться
analytics.settings=Настройки аналитики
