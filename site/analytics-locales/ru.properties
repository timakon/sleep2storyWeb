analytics.title=Помогите нам понять, как вы нас находите
analytics.body=С вашего разрешения Sleep2Story использует Google Analytics, чтобы узнавать об источниках трафика, просмотренных страницах и действиях на сайте. Аналитические cookie необязательны; вы можете изменить свой выбор ниже в любой момент.
analytics.details=Об аналитике
analytics.explanation=Если вы согласитесь, ваш браузер отправит Google сведения о посещениях и устройстве, включая идентификатор cookie. Аналитические cookie и ваш выбор хранятся до 180 дней. Мы отключаем рекламные функции. Если вы откажетесь, Google Analytics не будет загружаться. Cookie с настройкой языка работает отдельно.
analytics.google=Как Google использует эти сведения
analytics.accept=Разрешить аналитику
analytics.reject=Отклонить аналитику
analytics.settings=Настройки аналитики
