analytics.title=Ajude-nos a perceber como nos encontra
analytics.body=Com a sua autorização, o Sleep2Story utiliza o Google Analytics para conhecer as fontes de tráfego, as páginas visitadas e as interações no site. Os cookies de análise são opcionais; pode alterar a sua escolha abaixo a qualquer momento.
analytics.details=Sobre a análise
analytics.explanation=Se aceitar, o seu navegador envia à Google informações sobre as suas visitas e o seu dispositivo, incluindo um identificador de cookie. Os cookies de análise e a sua escolha são guardados durante um máximo de 180 dias. Desativamos as funcionalidades de publicidade. Se recusar, o Google Analytics não é carregado. O cookie de preferência de idioma funciona separadamente.
analytics.google=Como a Google utiliza estas informações
analytics.accept=Permitir análise
analytics.reject=Recusar análise
analytics.settings=Definições de análise
