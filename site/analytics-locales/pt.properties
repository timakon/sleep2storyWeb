analytics.title=Permitir análise?
analytics.body=O Google Analytics ajuda-nos a saber de onde vêm os visitantes e que páginas leem. A análise fica desativada sem a sua autorização.
analytics.details=Detalhes
analytics.explanation=Se aceitar, o seu navegador envia à Google informações sobre as suas visitas, as interações no site e o seu dispositivo, incluindo um identificador de cookie. Os cookies de análise e a sua escolha são guardados durante um máximo de 180 dias. As funcionalidades de publicidade estão desativadas. Se recusar, o Google Analytics não é carregado. O cookie de preferência de idioma funciona separadamente. Pode alterar a sua escolha a qualquer momento em «Definições de análise» no rodapé.
analytics.google=Como a Google utiliza estas informações
analytics.accept=Permitir
analytics.reject=Recusar
analytics.settings=Definições de análise
