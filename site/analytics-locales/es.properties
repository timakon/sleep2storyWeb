analytics.title=Ayúdanos a entender cómo nos encuentras
analytics.body=Con tu permiso, Sleep2Story usa Google Analytics para conocer las fuentes de tráfico, las páginas visitadas y las interacciones en el sitio. Las cookies de análisis son opcionales; puedes cambiar tu elección a continuación en cualquier momento.
analytics.details=Acerca del análisis
analytics.explanation=Si aceptas, tu navegador envía a Google información sobre tus visitas y tu dispositivo, incluido un identificador de cookie. Las cookies de análisis y tu elección se guardan durante un máximo de 180 días. Desactivamos las funciones publicitarias. Si rechazas, Google Analytics no se carga. La cookie de preferencia de idioma funciona por separado.
analytics.google=Cómo usa Google esta información
analytics.accept=Permitir análisis
analytics.reject=Rechazar análisis
analytics.settings=Ajustes de análisis
