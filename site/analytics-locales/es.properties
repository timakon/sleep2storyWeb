analytics.title=¿Permitir análisis?
analytics.body=Google Analytics nos ayuda a saber de dónde vienen los visitantes y qué páginas leen. El análisis sigue desactivado hasta que lo permitas.
analytics.details=Detalles
analytics.explanation=Si aceptas, tu navegador envía a Google información sobre tus visitas, tus interacciones en el sitio y tu dispositivo, incluido un identificador de cookie. Las cookies de análisis y tu elección se guardan durante un máximo de 180 días. Las funciones publicitarias están desactivadas. Si rechazas, Google Analytics no se carga. La cookie de preferencia de idioma funciona por separado. Puedes cambiar tu elección en cualquier momento desde «Ajustes de análisis» en el pie de página.
analytics.google=Cómo usa Google esta información
analytics.accept=Permitir
analytics.reject=Rechazar
analytics.settings=Ajustes de análisis
