analytics.title=Допоможіть нам зрозуміти, як ви нас знаходите
analytics.body=З вашого дозволу Sleep2Story використовує Google Analytics, щоб дізнаватися про джерела трафіку, переглянуті сторінки та дії на сайті. Аналітичні cookie необов’язкові; ви можете змінити свій вибір нижче будь-коли.
analytics.details=Про аналітику
analytics.explanation=Якщо ви погодитеся, ваш браузер надсилатиме Google відомості про відвідування та пристрій, зокрема ідентифікатор cookie. Аналітичні cookie та ваш вибір зберігаються до 180 днів. Ми вимикаємо рекламні функції. Якщо ви відмовитеся, Google Analytics не завантажуватиметься. Cookie з налаштуванням мови працює окремо.
