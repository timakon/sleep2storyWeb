analytics.title=Дозволити аналітику?
analytics.body=Google Analytics допомагає зрозуміти, звідки приходять відвідувачі та які сторінки читають. Без вашої згоди аналітика вимкнена.
analytics.details=Докладніше
analytics.explanation=Якщо ви погодитеся, ваш браузер надсилатиме Google відомості про відвідування, дії на сайті та пристрій, зокрема ідентифікатор cookie. Аналітичні cookie та ваш вибір зберігаються до 180 днів. Рекламні функції вимкнено. Якщо ви відмовитеся, Google Analytics не завантажуватиметься. Cookie з налаштуванням мови працює окремо. Змінити вибір можна будь-коли через «Налаштування аналітики» внизу сторінки.
analytics.google=Як Google використовує ці відомості
analytics.accept=Дозволити
analytics.reject=Відмовитися
analytics.settings=Налаштування аналітики
