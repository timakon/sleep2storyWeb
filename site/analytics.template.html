    <section id="analytics-notice" class="analytics-notice" aria-labelledby="analytics-title" hidden>
      <h2 id="analytics-title" tabindex="-1">{{analytics.title}}</h2>
      <p>{{analytics.body}}</p>
      <details>
        <summary>{{analytics.details}}</summary>
        <p>{{analytics.explanation}}</p>
        <a href="https://policies.google.com/technologies/partner-sites">{{analytics.google}}</a>
      </details>
      <div class="analytics-actions">
        <button id="analytics-accept" type="button">{{analytics.accept}}</button>
        <button id="analytics-reject" type="button">{{analytics.reject}}</button>
      </div>
    </section>
    <script src="/assets/analytics.js?v=20260910" defer></script>
